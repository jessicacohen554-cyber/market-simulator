<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Explorer — Codebase Explorer</title>
  <meta name="description" content="Drill into any backcast run — generation mix, zonal LMPs, capacity-factor heatmaps, price duration curves. Compare model vs EPA CAMPD / EIA actuals.">

  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/bc-pages.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
  <nav id="topNav" aria-label="Site navigation"></nav>

  <div class="bc-layout">

    <!-- Sidebar -->
    <aside class="bc-sidebar">
      <h3>Market (ISO)</h3>
      <div class="iso-select-wrap" id="isoWrap">
        <span class="iso-dot"></span>
        <select class="iso-select" id="isoSel" aria-label="Market (ISO)"></select>
      </div>
      <p class="run-hint" id="isoHint"></p>

      <h3>Run</h3>
      <div class="run-list" id="runList"></div>
      <p class="run-hint">Click a run id for its definition. Newest first.</p>
    </aside>

    <!-- Main content -->
    <main class="bc-main">
      <div class="bc-page-header">
        <h1>Backcast Results</h1>
        <span id="isoBadge" class="iso-badge"></span>
      </div>
      <p class="bc-page-sub" id="pageSub">Model vs EPA CAMPD / EIA actuals</p>

      <div id="diag" class="bc-diag-alert">Loading run data&hellip;</div>

      <!-- Top controls -->
      <div class="bc-controls" id="bcTop" style="display:none">
        <div class="ctl">
          <span class="ctl-label">View</span>
          <span class="seg-ctrl" id="viewSel">
            <button data-v="report" class="active">Report</button>
            <button data-v="charts">Charts</button>
            <button data-v="tables">Tables</button>
          </span>
        </div>
        <div class="ctl" id="ctlYear">
          <span class="ctl-label">Year</span>
          <span class="seg-ctrl" id="yearSel"></span>
        </div>
        <div class="ctl" id="ctlClass" style="display:none">
          <span class="ctl-label">Class</span>
          <select id="classSel" class="iso-select" style="min-width:130px"></select>
        </div>
        <div class="ctl ctlwide" id="ctlZones" style="display:none">
          <span class="ctl-label">Zones</span>
          <div class="zone-chips" id="zoneChips"></div>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <div class="bc-tooltip" id="bctip"></div>

  <script src="js/nav.js"></script>
  <script src="js/shared.js"></script>

  <script type="module">
    import {
      initBC, loadRun, loadBench,
      getMeta, getCompleteness,
      isoList, isoZones, isoYears, isoGroups, isoGroupLabels,
      isoColorVar, inflateGz, pearson,
      fmtPct, fmtNum, fmtDollars,
      hashState, MONTHS
    } from './js/bc-data.js';

    /* ================================================================
       STATE
       ================================================================ */
    const T = 8760;
    let st = {
      iso: null, runId: null, view: 'report', year: null,
      klass: null, zones: new Set(), plant: 'agg',
      runData: null, benchData: null, runMeta: null,
    };

    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

    /* ================================================================
       CONSTANTS — calibration tolerance bands
       ================================================================ */
    // 2026-07-02 rubric re-balance — mirrors calibration_verdict.FUELMIX_*
    // (loosened from 0.01 / 5 / 1.5): green = within 1× the C1 band, amber = 2×.
    const SUM_TOL_LOAD_FRAC = 0.02, SUM_TOL_LOAD_CAP = 8, SUM_TOL_SHARE_PP = 3.0;
    const SUM_TOL_PCT = 5;
    const R_GOOD = 0.85, R_OK = 0.70;
    const NONFOSSIL = ['nuclear', 'wind', 'solar'];
    const CHP_MERGE = { CC_CHP: 'CC_REGULAR', CT_CHP: 'CT_PEAKER', ST_CHP: 'ST_GAS' };
    // C1 gate membership — mirrors calibration_verdict.GAS_CLASSES / COAL_CLASSES /
    // FUELMIX_EXCLUDED exactly, so the "Classes in tol" KPI counts the SAME classes
    // the Calibration Status page gates: gas+coal only; CT_CHP (a BTM peaker the
    // grid LP zeroes by construction) and OTHER/OTHER_FOSSIL (mixed-plant
    // reconciliation buckets) are excluded; nuclear/wind/solar are advisory
    // (verdict scores VRE report-only), shown in the tables but never gated.
    const GAS_CLASSES = ['CC_REGULAR', 'CC_CHP', 'CT_PEAKER', 'CT_CHP', 'ST_GAS', 'ST_CHP'];
    const COAL_CLASSES = ['COAL_PRB', 'COAL_LIGNITE', 'COAL_BIT', 'COAL_WC', 'COAL'];
    const FUELMIX_EXCLUDED = new Set(['CT_CHP', 'OTHER', 'OTHER_FOSSIL']);
    const OVERLAY_COLOR = '#E67E22';

    /* ================================================================
       ISO COLORS
       ================================================================ */
    const ISO_COLORS = {
      ERCOT: '#22C55E', CAISO: '#F59E0B', PJM: '#0EA5E9',
      NYISO: '#E91E63', NEISO: '#9C27B0', MISO: '#F97316', SPP: '#14B8A6'
    };
    function isoColor(iso) { return ISO_COLORS[iso] || '#4A90D9'; }

    /* ================================================================
       SCORE / TOLERANCE HELPERS
       ================================================================ */
    // Δ-vs-actual color bands. Mirrors _backcast_shell.py dcls exactly: <5% good,
    // <15% ok, else bad. lo/hi kept overridable but default to the shell's 5/15
    // so every Δ cell colors identically to the deployed dashboard.
    function dcls(v, lo, hi) {
      if (v == null || isNaN(v)) return '';
      const a = Math.abs(v);
      return a < (lo ?? SUM_TOL_PCT) ? 'clr-good' : a < (hi ?? 3 * SUM_TOL_PCT) ? 'clr-ok' : 'clr-bad';
    }
    // Generation-share (pp) color band — matches shell ppcls: <1pp good, <3pp ok.
    function ppcls(d) { const a = Math.abs(d); return a < 1 ? 'clr-good' : a < 3 ? 'clr-ok' : 'clr-bad'; }
    function rcls(r) {
      if (r == null) return '';
      return r >= R_GOOD ? 'clr-good' : r >= R_OK ? 'clr-ok' : 'clr-bad';
    }
    // Composite class-capture score (shell capScore): geometric mean of hourly-r,
    // (1−NRMSE) and (1−|volume dev|), ×100. This is the number the deployed
    // dashboard shows as "Class capture" — NOT a volume ratio.
    function capScore(r, nr, dev) { return 100 * Math.cbrt(Math.max(0, r) * Math.max(0, 1 - nr) * Math.max(0, 1 - Math.abs(dev))); }
    // Mean-normalized NRMSE, matching the shell's nrmse(model, actual): the SSE is
    // normalized by the MEAN of the actual (second arg), not by its range. Kept
    // local so it never diverges from the imported (range-normalized) bc-data nrmse.
    function nrmseM(m, o) { let s = 0, om = 0, n = m.length; for (let i = 0; i < n; i++) { s += (m[i] - o[i]) ** 2; om += o[i]; } om /= n; return om > 0 ? Math.sqrt(s / n) / om : 9.9; }
    function fmtpp(d) { return (d >= 0 ? '+' : '') + d.toFixed(1); }
    function mixLabel(g) { return META().groupLabel?.[g] || ({ ST_CHP: 'Steam Gas CHP' }[g]) || g; }
    function fmtPctSigned(v) {
      if (v == null) return '—';
      return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
    }
    function fmtTWh(v) {
      return (v >= 0 ? '+' : '') + (Math.abs(v) >= 1 ? v.toFixed(1) + ' TWh' : (v * 1e3).toFixed(0) + ' GWh');
    }

    /* ================================================================
       TOOLTIP
       ================================================================ */
    const tip = document.getElementById('bctip');
    function showTip(html, cx, cy) {
      tip.innerHTML = html; tip.style.display = 'block';
      const p = 14, w = tip.offsetWidth, h = tip.offsetHeight;
      let x = cx + p, y = cy + p;
      if (x + w > innerWidth) x = cx - w - p;
      if (y + h > innerHeight) y = cy - h - p;
      if (x < 2) x = 2; if (y < 2) y = 2;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    function hideTip() { tip.style.display = 'none'; }
    document.addEventListener('click', e => {
      if (!e.target.closest('[data-rid]') && !e.target.closest('svg.chart') && !e.target.closest('canvas.heat')) hideTip();
    });

    /* ================================================================
       DATA ACCESSORS — operate on st.runData / st.benchData
       ================================================================ */
    function RUN(yr) { return st.runData?.years?.[yr] || st.runData?.[yr] || st.runData?.[String(yr)] || {}; }
    function BENCH(yr) { return st.benchData?.[yr] || st.benchData?.[String(yr)] || {}; }
    function META() { return getMeta()?.[st.iso] || {}; }

    /* Decode base64-encoded Float32 CF/dispatch arrays. */
    function dec(b) {
      const s = atob(b), a = new Float32Array(s.length);
      for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
      return a;
    }

    /* Plants of a class in the selected zones. */
    function plantsOf(yr, grp) {
      const M = RUN(yr), B = BENCH(yr);
      if (!M?.plants || !B?.plants) return [];
      return Object.keys(M.plants).filter(c => {
        const b = B.plants[c];
        return b && b.group === grp && st.zones.has(b.zone);
      });
    }

    /* Aggregate model vs CAMPD MW arrays for a class + selected zones. */
    const _aggC = {};
    function clearAggCache() { Object.keys(_aggC).forEach(k => delete _aggC[k]); }
    function aggMW(yr, grp) {
      const key = st.runId + '|' + yr + '|' + grp + '|' + [...st.zones].sort().join(',');
      if (_aggC[key]) return _aggC[key];
      const M = RUN(yr), B = BENCH(yr);
      const mm = new Float32Array(T), cc = new Float32Array(T);
      let mA = 0, cA = 0, eA = 0;
      for (const c of plantsOf(yr, grp)) {
        const b = B.plants[c], mp = M.plants[c];
        const npl = b.npl || 1;
        if (mp?.m) { const md = dec(mp.m); for (let i = 0; i < T; i++) mm[i] += md[i] * npl / 100; }
        if (b?.campd) { const cd = dec(b.campd); for (let i = 0; i < T; i++) cc[i] += cd[i] * npl / 100; }
        mA += mp?.m_ann || 0;
        cA += b?.c_ann || 0;
        eA += b?.e_ann || 0;
      }
      return _aggC[key] = { mm, cc, mA, cA, eA };
    }

    /* Full EIA-923 class total (classFull from benchmark), zone-allocated. */
    function classBench923(yr, grp, eAzones) {
      const B = BENCH(yr);
      const cf = B.classFull?.[grp], plants = B.plants || {};
      let eAll = 0;
      for (const c in plants) { if (plants[c].group === grp) eAll += plants[c].e_ann || 0; }
      return (cf != null && eAll > 0) ? cf * (eAzones / eAll) : eAzones;
    }

    /* Full model class total (gmModel), zone-allocated. */
    function classModelFull(yr, grp, mAzones) {
      const M = RUN(yr), B = BENCH(yr);
      const gm = M.gmModel?.[grp];
      let mAll = 0;
      for (const c in (M.plants || {})) {
        if (B.plants?.[c]?.group === grp) mAll += M.plants[c].m_ann || 0;
      }
      return (gm != null && mAll > 0) ? gm * (mAzones / mAll) : mAzones;
    }

    /* Class metrics — mirrors _backcast_shell.py classMetrics exactly:
       r (Pearson), nr (MEAN-normalized NRMSE, model vs CAMPD), dev (volume
       deviation), m1 (composite capture score = "Class capture" KPI), m2
       (npl-weighted mean of per-plant .cap = "Plant capture" KPI), plus the
       zone-allocated model/EIA-923 class totals. */
    function classMetrics(yr, grp) {
      const ps = plantsOf(yr, grp);
      if (!ps.length) return null;
      const a = aggMW(yr, grp);
      const r = pearson(a.mm, a.cc), nr = nrmseM(a.mm, a.cc), dev = a.cA > 0 ? (a.mA - a.cA) / a.cA : 0;
      const m1 = a.cc.reduce((s, v) => s + v, 0) > 0 ? capScore(r, nr, dev) : null;
      const M = RUN(yr), B = BENCH(yr);
      let ws = 0, cs = 0;
      for (const c of ps) { const w = B.plants[c].npl, cp = M.plants[c].cap; if (cp != null) { ws += w; cs += w * cp; } }
      return {
        m1, m2: ws > 0 ? cs / ws : null, r, nr, dev,
        mA: a.mA, cA: a.cA, eA: a.eA,
        mFull: classModelFull(yr, grp, a.mA),
        bench923: classBench923(yr, grp, a.eA),
        n: ps.length
      };
    }

    /* Single-plant or aggregate series for Charts view — mirrors the shell
       singleSeries: a single plant carries the payload's Python-computed
       r/nrmse/cap (never recomputed in JS); the aggregate carries the class
       mt.r/mt.nr and grid-delivered mFull/bench923 volume totals. */
    function singleSeries(yr, grp, plantCode) {
      const M = RUN(yr), B = BENCH(yr);
      const ps = plantsOf(yr, grp);
      if (plantCode && plantCode !== 'agg' && B.plants?.[plantCode] && M.plants?.[plantCode]) {
        const b = B.plants[plantCode], mp = M.plants[plantCode];
        const npl = b.npl || 1;
        const mm = new Float32Array(T), cc = new Float32Array(T);
        if (mp?.m) { const md = dec(mp.m); for (let i = 0; i < T; i++) mm[i] = md[i] * npl / 100; }
        if (b?.campd) { const cd = dec(b.campd); for (let i = 0; i < T; i++) cc[i] = cd[i] * npl / 100; }
        const nodata = !!b.nodata || !b.campd || cc.every(v => v === 0);
        return {
          name: (b.name || plantCode) + ' · ' + (b.zone || '?'), agg: false, nodata,
          mm, cc, m_ann: mp.m_ann || 0, c_ann: b.c_ann || 0, e_ann: b.e_ann || 0,
          r: mp.r ?? null, nr: mp.nrmse ?? null, cap: mp.cap ?? null
        };
      }
      const a = aggMW(yr, grp);
      const mt = classMetrics(yr, grp);
      const nodata = a.cA <= 0;
      return {
        name: (META().groupLabel?.[grp] || grp) + ' (aggregate)', agg: true, nodata,
        mm: a.mm, cc: a.cc,
        m_ann: mt ? mt.mFull : a.mA, c_ann: a.cA, e_ann: (mt && mt.bench923 > 0) ? mt.bench923 : a.eA,
        r: mt ? mt.r : null, nr: mt ? mt.nr : null, cap: mt ? mt.m1 : null
      };
    }

    /* Demand-weighted average LMP over selected zones. */
    function avgLMP(yr) {
      const L = RUN(yr).lmp || {};
      let pd = 0, d = 0;
      for (const z in L) {
        if (!st.zones.has(z)) continue;
        pd += (L[z].p || 0) * (L[z].d || 0);
        d += L[z].d || 0;
      }
      return d > 0 ? pd / d : null;
    }

    /* Monthly model LMP (demand-weighted across selected zones). */
    function avgLMPMon(yr) {
      const L = RUN(yr).lmp || {};
      const out = Array(12).fill(0);
      const dMon = Array(12).fill(0);
      let any = false;
      for (const z in L) {
        if (!st.zones.has(z)) continue;
        const zd = L[z];
        if (!zd.pMon || !zd.dMon) continue;
        any = true;
        for (let m = 0; m < 12; m++) {
          if (zd.pMon[m] == null) continue;
          out[m] += zd.pMon[m] * (zd.dMon[m] || 0);
          dMon[m] += zd.dMon[m] || 0;
        }
      }
      if (!any) return null;
      return out.map((s, m) => dMon[m] > 0 ? s / dMon[m] : null);
    }

    /* ORDC-overlaid monthly LMP. */
    function avgLMPMonScar(yr) {
      const Y = RUN(yr), S = Y.lmpScar, L = Y.lmp || {};
      if (!S) return null;
      const out = Array(12).fill(0), dMon = Array(12).fill(0);
      let any = false;
      for (const z in S) {
        if (!st.zones.has(z)) continue;
        const sp = S[z].pMonScar, dm = (L[z] || {}).dMon;
        if (!sp || !dm) continue;
        any = true;
        for (let m = 0; m < 12; m++) {
          if (sp[m] == null) continue;
          out[m] += sp[m] * dm[m];
          dMon[m] += dm[m] || 0;
        }
      }
      if (!any) return null;
      return out.map((s, m) => dMon[m] > 0 ? s / dMon[m] : null);
    }

    /* Annual demand-weighted ORDC-overlaid avg LMP. */
    function avgLMPScar(yr) {
      const ms = avgLMPMonScar(yr);
      if (!ms) return null;
      const L = RUN(yr).lmp || {};
      const dT = Array(12).fill(0);
      for (const z in L) { if (!st.zones.has(z)) continue; const dm = L[z].dMon; if (dm) for (let m = 0; m < 12; m++) dT[m] += dm[m] || 0; }
      let pd = 0, d = 0;
      for (let m = 0; m < 12; m++) { if (ms[m] != null) { pd += ms[m] * dT[m]; d += dT[m]; } }
      return d > 0 ? pd / d : null;
    }

    function actualLMP(yr) { return BENCH(yr).avgLMP || null; }
    function ordcInfo(yr) { return RUN(yr).ordc || null; }
    function ordcOverlay(yr) { const o = ordcInfo(yr); return o && o.maeEnergyOnly != null ? o : null; }

    /* System totals. */
    function totalGen(yr) {
      const B = BENCH(yr), M = RUN(yr);
      if (!B?.classFull) return null;
      const gm = M.gmModel || {};
      const aGen = Object.values(B.classFull).reduce((s, v) => s + (v || 0), 0);
      const mGen = Object.keys(B.classFull).reduce((s, g) => s + (gm[g] || 0), 0);
      return (mGen > 0 && aGen > 0) ? { mGen, aGen } : null;
    }
    function totalLoad(yr) {
      const L = RUN(yr).lmp || {};
      const s = Object.values(L).reduce((a, z) => a + (z.d || 0), 0);
      return s > 0 ? s : (totalGen(yr)?.aGen || 0);
    }
    function sharePP(yr, mCls, aCls) {
      const T = totalGen(yr); if (!T) return null;
      return 100 * mCls / T.mGen - 100 * aCls / T.aGen;
    }

    /* Class error objects (fossil + non-fossil). */
    function classErr(yr, grp) {
      const m = classMetrics(yr, grp);
      const mSys = RUN(yr).gmModel?.[grp] || 0;
      const aSys = BENCH(yr).classFull?.[grp] || 0;
      if (!m) {
        // No CAMPD-matched plants for this class (e.g. ERCOT ST_CHP) — fall
        // back to the system-wide gmModel/classFull totals the verdict gates
        // on, so the C1 count spans the same classes as Calibration Status.
        if (!(aSys > 0.02)) return null;
        return {
          grp, err: 100 * (mSys - aSys) / aSys, mFull: mSys, bench923: aSys,
          annLoad: totalLoad(yr), sharePP: sharePP(yr, mSys, aSys), r: null, nr: null
        };
      }
      if (!(m.bench923 > 0.02)) return null;
      return {
        grp, err: 100 * (m.mFull - m.bench923) / m.bench923,
        mFull: m.mFull, bench923: m.bench923,
        annLoad: totalLoad(yr), sharePP: sharePP(yr, mSys, aSys), r: m.r, nr: m.nr
      };
    }
    function nonFosErr(yr, fuel) {
      const a = BENCH(yr).e930?.[fuel] || 0, m = RUN(yr).nonfossil?.[fuel] || 0;
      if (!(a > 0.02)) return null;
      return {
        grp: fuel, nonfos: true, err: 100 * (m - a) / a,
        mFull: m, bench923: a, annLoad: totalLoad(yr), sharePP: sharePP(yr, m, a)
      };
    }
    function anyErr(yr, g) { return NONFOSSIL.includes(g) ? nonFosErr(yr, g) : classErr(yr, g); }
    function allClasses() { return [...(META().groups || []), ...NONFOSSIL]; }
    function classLabel(g) {
      if (NONFOSSIL.includes(g)) return g[0].toUpperCase() + g.slice(1);
      return META().groupLabel?.[g] || g;
    }

    /* Tolerance. */
    function volInTol(e, k) { return e.annLoad > 0 && Math.abs(e.mFull - e.bench923) <= k * Math.min(SUM_TOL_LOAD_FRAC * e.annLoad, SUM_TOL_LOAD_CAP); }
    function shareInTol(e, k) { return e.sharePP == null || Math.abs(e.sharePP) <= k * SUM_TOL_SHARE_PP; }
    function classInTol(e) { return volInTol(e, 1) && shareInTol(e, 1); }
    function clsTol(e) { return classInTol(e) ? 'good' : (volInTol(e, 2) && shareInTol(e, 2)) ? 'ok' : 'bad'; }
    function tolcls(v) { const a = Math.abs(v); return a <= SUM_TOL_PCT ? 'clr-good' : a <= 2 * SUM_TOL_PCT ? 'clr-ok' : 'clr-bad'; }
    /* Whether a class GATES in the C1 fuel-mix test for this year — mirrors
       calibration_verdict.score_fuelmix + class_is_gated: gas/coal family
       membership, not FUELMIX_EXCLUDED, and (in a preliminary-EIA-923 vintage)
       verified complete by the committed completeness audit. Everything else on
       the page is report-only context, exactly like the verdict. */
    function classIsGated(yr, g) {
      if (!GAS_CLASSES.includes(g) && !COAL_CLASSES.includes(g)) return false;
      if (FUELMIX_EXCLUDED.has(g)) return false;
      const ci = cmpInfo(yr, st.iso, g);
      return !ci || !!ci.gate; // no completeness part = complete vintage -> gates
    }

    function classErrs(yr) {
      const out = [];
      for (const g of allClasses()) { const e = anyErr(yr, g); if (e) out.push(e); }
      return out;
    }

    /* Generation-weighted fleet dispatch r. */
    function fleetR(yr) {
      let ws = 0, s = 0;
      for (const g of (META().groups || [])) {
        const m = classMetrics(yr, g);
        if (!m || m.cA <= 0) continue;
        ws += m.cA; s += m.cA * m.r;
      }
      return ws > 0 ? s / ws : null;
    }

    /* Summary headline for a year. "Classes in tol" counts ONLY the C1-gated
       classes (the same set the Calibration Status verdict scores); classes a
       preliminary-vintage completeness audit skips are reported separately, and
       excluded/non-fossil classes never enter the count. Worst class is the
       largest error among the gated classes. */
    function summaryHeadline(yr) {
      const es = classErrs(yr);
      const gated = es.filter(e => classIsGated(yr, e.grp));
      const skipped = es.filter(e =>
        !FUELMIX_EXCLUDED.has(e.grp) && !NONFOSSIL.includes(e.grp)
        && (GAS_CLASSES.includes(e.grp) || COAL_CLASSES.includes(e.grp))
        && !classIsGated(yr, e.grp)).length;
      let sm = 0, sa = 0, worst = null;
      es.forEach(e => { if (!e.nonfos) { sm += e.mFull; sa += e.bench923; } });
      // Worst = out-of-tolerance first, then largest absolute TWh miss (the
      // C1 gate's own magnitude) — a tiny in-tolerance class with a big % error
      // (e.g. 0.4 TWh ST_CHP) must not outrank a 19 TWh CC miss.
      gated.forEach(e => {
        if (!worst) { worst = e; return; }
        const eOut = !classInTol(e), wOut = !classInTol(worst);
        if (eOut !== wOut) { if (eOut) worst = e; return; }
        if (Math.abs(e.mFull - e.bench923) > Math.abs(worst.mFull - worst.bench923)) worst = e;
      });
      return {
        n: gated.length, inTol: gated.filter(classInTol).length, skipped,
        sysErr: sa > 0 ? 100 * (sm - sa) / sa : null,
        worst, price: avgLMP(yr), priceScar: avgLMPScar(yr)
      };
    }

    /* ================================================================
       CF HEATMAP COLOR
       ================================================================ */
    function cfColorRGB(v) {
      if (v <= 1) return [232, 243, 247];
      const t = Math.min(v, 100) / 100;
      const S = [[0, 232, 243, 247], [0.04, 127, 196, 230], [0.30, 134, 201, 143],
                 [0.55, 242, 214, 92], [0.78, 239, 143, 60], [1, 192, 57, 43]];
      for (let i = 1; i < S.length; i++) {
        if (t <= S[i][0]) {
          const a = S[i - 1], b = S[i], f = (t - a[0]) / (b[0] - a[0]);
          return [a[1] + f * (b[1] - a[1]), a[2] + f * (b[2] - a[2]), a[3] + f * (b[3] - a[3])];
        }
      }
      return [192, 57, 43];
    }

    function drawHeat(cv, cf) {
      const ctx = cv.getContext('2d');
      const im = ctx.createImageData(365, 24);
      for (let h = 0; h < 8760; h++) {
        const day = h / 24 | 0, hod = h % 24;
        if (day > 364) break;
        const c = cfColorRGB(cf[h]);
        const i = (hod * 365 + day) * 4;
        im.data[i] = c[0]; im.data[i + 1] = c[1]; im.data[i + 2] = c[2]; im.data[i + 3] = 255;
      }
      ctx.putImageData(im, 0, 0);
    }

    /* ================================================================
       UPDATE ISO CHROME
       ================================================================ */
    function updateIsoChrome(iso) {
      const c = isoColor(iso);
      const wrap = $('#isoWrap');
      wrap.style.setProperty('--c', c);
      wrap.querySelector('.iso-dot').style.background = c;
      const badge = $('#isoBadge');
      badge.style.background = c;
      badge.innerHTML = `<span class="dot" style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.92);display:inline-block"></span>${esc(iso)}`;
    }

    /* ================================================================
       BUILD RUN LIST — from window.BC.manifest (not runGz)
       ================================================================ */
    function isoRuns(iso) {
      return (window.BC.manifest || [])
        .filter(m => (m.iso || 'ERCOT').toUpperCase() === iso.toUpperCase())
        .sort((a, b) => (b.id || '').localeCompare(a.id || ''));
    }

    function buildRunList(iso) {
      const list = $('#runList');
      const runs = isoRuns(iso);

      if (!runs.length) {
        list.innerHTML = '<p class="run-hint">No runs found for this ISO.</p>';
        return runs;
      }

      list.innerHTML = runs.map((r, i) => {
        const active = (st.runId === r.id || (!st.runId && i === 0)) ? 'active' : '';
        return `<label class="run-opt ${active}" data-id="${esc(r.id)}">
          <input type="radio" name="run" value="${esc(r.id)}" ${active ? 'checked' : ''}>
          <span class="run-label">${esc(r.label || r.shorthand || r.id)}</span>
        </label>`;
      }).join('');

      list.querySelectorAll('.run-opt').forEach(opt => {
        opt.addEventListener('click', () => selectRun(opt.dataset.id));
      });

      // Wire definition tooltips on run labels
      list.querySelectorAll('.run-opt').forEach(opt => {
        const id = opt.dataset.id;
        const meta = (window.BC.manifest || []).find(r => r.id === id);
        if (meta?.definition) {
          opt.addEventListener('mouseenter', e => showTip(`<b>${esc(id)}</b><br>${esc(meta.definition.slice(0, 300))}`, e.clientX, e.clientY));
          opt.addEventListener('mouseleave', hideTip);
        }
      });

      return runs;
    }

    /* ================================================================
       LOAD AND DISPLAY A RUN
       ================================================================ */
    async function selectRun(runId) {
      st.runId = runId;
      hashState.update('run', runId);
      st.runMeta = (window.BC.manifest || []).find(r => r.id === runId) || {};
      clearAggCache();

      $$('.run-opt').forEach(o => {
        o.classList.toggle('active', o.dataset.id === runId);
        o.querySelector('input').checked = o.dataset.id === runId;
      });

      const diag = $('#diag');
      diag.textContent = 'Loading run data...';
      diag.style.display = '';

      try {
        st.runData = await loadRun(runId);
        st.benchData = await loadBench(st.iso);
        diag.style.display = 'none';
        $('#bcTop').style.display = '';

        const meta = META();
        const years = meta.years || [];
        if (!st.year || !years.includes(parseInt(st.year))) {
          st.year = years[0] || 2024;
        }
        st.year = Number(st.year);

        // Init zones
        if (!st.zones.size) st.zones = new Set(meta.zones || []);

        buildYearSelector(years);
        buildClassSelector();
        buildZoneChips();
        syncTopbar();
        render();
      } catch (err) {
        diag.textContent = `Error loading run: ${err.message}`;
        console.error(err);
      }
    }

    /* ================================================================
       YEAR / CLASS / ZONE / VIEW SELECTORS
       ================================================================ */
    function buildYearSelector(years) {
      const sel = $('#yearSel');
      sel.innerHTML = years.map(y =>
        `<button data-y="${y}" class="${Number(y) === Number(st.year) ? 'active' : ''}">${y}</button>`
      ).join('');
      sel.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          st.year = Number(btn.dataset.y);
          hashState.update('year', st.year);
          sel.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
          clearAggCache(); render();
        });
      });
    }

    function buildClassSelector() {
      const sel = $('#classSel');
      const groups = META().groups || [];
      const labels = META().groupLabel || {};
      if (!st.klass || !groups.includes(st.klass)) st.klass = groups[0] || null;
      sel.innerHTML = groups.map(g => `<option value="${g}">${esc(labels[g] || g)}</option>`).join('');
      sel.value = st.klass;
      sel.onchange = () => { st.klass = sel.value; st.plant = 'agg'; clearAggCache(); render(); };
    }

    function buildZoneChips() {
      const container = $('#zoneChips');
      const zones = META().zones || [];
      const allOn = st.zones.size === zones.length;
      container.innerHTML = `<span class="zone-chip ${allOn ? 'active' : ''}" data-z="__all">All</span>` +
        zones.map(z => `<span class="zone-chip ${st.zones.has(z) ? 'active' : ''}" data-z="${esc(z)}">${esc(z)}</span>`).join('');
      container.onclick = e => {
        const z = e.target.dataset?.z;
        if (!z) return;
        if (z === '__all') { st.zones = new Set(zones); }
        else { if (st.zones.has(z)) st.zones.delete(z); else st.zones.add(z); if (!st.zones.size) st.zones = new Set(zones); }
        [...container.children].forEach(c => {
          const zz = c.dataset.z;
          c.classList.toggle('active', zz === '__all' ? st.zones.size === zones.length : st.zones.has(zz));
        });
        st.plant = 'agg'; clearAggCache(); render();
      };
    }

    function wireViewSel() {
      $('#viewSel').querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          st.view = btn.dataset.v;
          hashState.update('view', st.view);
          $('#viewSel').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
          syncTopbar(); render();
        });
      });
    }

    function syncTopbar() {
      const charts = st.view === 'charts';
      $('#ctlClass').style.display = charts ? '' : 'none';
      $('#ctlZones').style.display = (charts || st.view === 'tables') ? '' : 'none';
    }

    /* ================================================================
       MAIN RENDER DISPATCHER
       ================================================================ */
    function render() {
      const content = $('#content');
      if (!st.runData) { content.innerHTML = ''; return; }
      switch (st.view) {
        case 'report': renderReport(content); break;
        case 'charts': renderCharts(content); break;
        case 'tables': renderTables(content); break;
      }
    }

    /* ================================================================
       REPORT VIEW — all years at once
       ================================================================ */
    function renderReport(el) {
      const meta = META();
      const years = meta.years || [];
      const reg = st.runMeta || {};
      let html = '';

      // Run definition
      if (reg.definition) {
        html += `<div class="bc-panel">
          <h2>Run Definition</h2>
          <p class="bc-narration"><span class="ndef">${esc(reg.definition)}</span></p>
          <p style="margin-top:8px;font-size:0.72rem;color:var(--text-muted)">
            ID: <span class="run-id-link">${esc(st.runId)}</span>
            ${reg.date ? ` &middot; ${esc(reg.date)}` : ''}
          </p>
        </div>`;
      }

      // D-3 zero-forcing ablation twin (CLAUDE.md rule 21 / audit §7 D-3):
      // keeper-vs-ablation per-class TWh delta + the market-story annotation.
      // Present only on a keeper that has registered its twin (fields carried on
      // the sidecar/manifest entry); absent runs render nothing.
      if (reg.ablation_twin) {
        const twinLink = `backcast-runs.html#iso=${encodeURIComponent(meta.iso || '')}&run=${encodeURIComponent(reg.ablation_twin)}`;
        let rows = '';
        (reg.ablation_delta || []).forEach(d => {
          const dv = Number(d.delta_twh);
          const cls = dv > 0.05 ? 'clr-bad' : (dv < -0.05 ? 'clr-ok' : '');
          rows += `<tr><td>${esc(d.class)}</td>
            <td style="text-align:right">${Number(d.keeper_twh).toFixed(2)}</td>
            <td style="text-align:right">${Number(d.ablation_twh).toFixed(2)}</td>
            <td style="text-align:right" class="${cls}">${dv >= 0 ? '+' : ''}${dv.toFixed(2)}</td></tr>`;
        });
        html += `<div class="bc-panel">
          <h2>Zero-forcing ablation twin (D-3)</h2>
          <p class="panel-sub">Per-class TWh with every merchant floor/bridge OFF
            (nuclear must-run, CHP steam, coal take-or-pay kept). Δ = forced
            energy the keeper's floors buy. Twin:
            <a class="run-id-link" href="${twinLink}">${esc(reg.ablation_twin)}</a></p>
          ${reg.market_story ? `<p class="bc-narration"><span class="ndef">Market story: ${esc(reg.market_story)}</span></p>` : `<p class="panel-sub" style="color:var(--text-muted)">No market story recorded — a delta explainable only as "the floor buys the residual" is an open root-cause item (rule 21).</p>`}
          ${rows ? `<table class="bc-table" style="margin-top:10px"><thead><tr><th>Class</th><th style="text-align:right">Keeper TWh</th><th style="text-align:right">Ablation TWh</th><th style="text-align:right">Δ TWh</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
        </div>`;
      }

      // Year scorecards
      html += `<div class="bc-panel"><h2>Year Scorecards</h2>
        <p class="panel-sub">Class tolerance (C1 gate: gas+coal classes minus CT_CHP/OTHER, completeness-gated — the same stats the Calibration Status page scores), dispatch correlation, and LMP fidelity per year</p>
        <div class="year-grid">`;

      for (const yr of years) {
        const M = RUN(yr);
        if (!M || !Object.keys(M).length) continue;
        const H = summaryHeadline(yr);
        const fr = fleetR(yr);
        const aL = actualLMP(yr);
        const aP = aL ? (aL.da != null ? aL.da : aL.rt) : null;
        const aLab = aL && aL.da != null ? 'DA' : 'RT';
        const ov = H.priceScar != null;
        const mp = ov ? H.priceScar : H.price;
        const pdiff = (mp != null && aP) ? 100 * (mp - aP) / aP : null;

        html += `<div class="year-card">
          <div class="year-head"><span>${yr}</span><span style="font-size:0.72rem;font-weight:600;color:var(--text-muted)">${H.n && H.inTol === H.n ? 'all pass' : ''}</span></div>
          <div class="kpi-row"><span class="k" title="C1 fuel-mix gate — gas+coal classes only, same set the Calibration Status page scores">Classes in tol (C1)</span><span class="v ${H.n && H.inTol === H.n ? 'clr-good' : H.inTol * 2 >= H.n ? 'clr-ok' : 'clr-bad'}">${H.inTol} / ${H.n}${H.skipped ? ` <span style="font-weight:600;color:var(--text-muted)">· ${H.skipped} skipped</span>` : ''}</span></div>
          <div class="kpi-row"><span class="k">Sys vol error</span><span class="v ${H.sysErr == null ? '' : tolcls(H.sysErr)}">${H.sysErr == null ? '—' : fmtPctSigned(H.sysErr)}</span></div>
          <div class="kpi-row"><span class="k">Fleet r</span><span class="v ${rcls(fr)}">${fr == null ? '—' : fr.toFixed(3)}</span></div>
          <div class="kpi-row"><span class="k">Avg LMP${ov ? ' +ORDC' : ''}</span><span class="v" ${ov ? `style="color:${OVERLAY_COLOR}"` : ''}>${mp == null ? '—' : fmtDollars(mp)}</span></div>
          <div class="kpi-row"><span class="k">LMP vs ${aL ? aLab : 'actual'}</span><span class="v ${pdiff == null ? '' : dcls(pdiff)}">${pdiff == null ? '—' : fmtPctSigned(pdiff)}</span></div>
          <div class="kpi-row"><span class="k">Worst class</span><span class="v ${H.worst ? 'clr-' + clsTol(H.worst) : ''}">${H.worst ? classLabel(H.worst.grp) + ' ' + fmtPctSigned(H.worst.err) : '—'}</span></div>
        </div>`;
      }
      html += `</div></div>`;

      // LMP alignment cards (monthly model vs actual per year)
      html += `<div class="bc-panel"><h2>LMP Alignment</h2>
        <p class="panel-sub">Monthly model LMP vs actual DA/RT per year</p>
        <div class="lmp-grid" id="lmpGrid">`;
      for (const yr of years) {
        const mm = avgLMPMon(yr);
        const aL = actualLMP(yr) || {};
        const annScar = avgLMPScar(yr);
        const ann = annScar != null ? annScar : avgLMP(yr);
        const aP = aL.da != null ? aL.da : aL.rt;
        const pdiff = (ann != null && aP) ? 100 * (ann - aP) / aP : null;
        html += `<div class="year-card">
          <div class="year-head"><span>${yr}</span><span style="font-size:0.72rem;font-weight:600" class="${pdiff == null ? '' : dcls(pdiff)}">${pdiff == null ? '' : 'ann ' + fmtPctSigned(pdiff)}</span></div>
          <div class="svg-box" data-lmpyr="${yr}"></div>
        </div>`;
      }
      html += `</div></div>`;

      // Diagnostic findings
      const findings = diagFindings(years);
      if (findings.length) {
        html += `<div class="bc-panel"><h2>Diagnostics</h2>
          <p class="panel-sub">Auto-generated findings — pointers for where to look, not verdicts</p>`;
        let lastCat = '';
        for (const f of findings) {
          if (f.cat !== lastCat) {
            lastCat = f.cat;
            html += `<div class="finding-cat">${f.cat === 'vol' ? 'Volume' : f.cat === 'shape' ? 'Dispatch Shape' : 'LMP'}</div>`;
          }
          html += `<div class="finding">
            <div class="sev-dot sev-${f.sev}"></div>
            <div><span style="font-weight:700">${esc(f.title)}</span>
              <span style="display:inline-block;font-size:0.72rem;font-weight:600;color:var(--text-muted);background:var(--bg-muted);border-radius:4px;padding:1px 7px;margin-left:7px">${esc(f.tag)}</span>
              <div style="font-size:0.82rem;margin-top:4px;line-height:1.55">${esc(f.txt)}</div>
            </div>
          </div>`;
        }
        html += `</div>`;
      }

      el.innerHTML = html;

      // Mount LMP line charts
      mountLmpCharts(years);
    }

    /* Mount SVG monthly LMP charts. */
    function mountLmpCharts(years) {
      document.querySelectorAll('[data-lmpyr]').forEach(box => {
        const yr = Number(box.dataset.lmpyr);
        const mm = avgLMPMon(yr);
        const aL = actualLMP(yr) || {};
        if (!mm) { box.innerHTML = '<p style="font-size:0.82rem;color:var(--text-muted)">No model LMP.</p>'; return; }

        const ms = avgLMPMonScar(yr);
        const sets = [];
        if (aL.rt_mon) sets.push({ pts: aL.rt_mon, color: '#9aa5b1', name: 'Actual RT', w: 2 });
        if (aL.da_mon) sets.push({ pts: aL.da_mon, color: '#647184', name: 'Actual DA', w: 3 });
        if (ms) {
          sets.push({ pts: ms.map(v => v ?? 0), color: OVERLAY_COLOR, name: 'Model+ORDC', w: 3 });
          sets.push({ pts: mm.map(v => v ?? 0), color: '#4A90D9', name: 'Model', w: 1.4, dash: '4 3' });
        } else {
          sets.push({ pts: mm.map(v => v ?? 0), color: '#4A90D9', name: 'Model', w: 2.4, dash: '4 3' });
        }

        const vw = 380, vh = 200;
        const L = 52, R = 14, Tp = 14, B = 40;
        const pw = vw - L - R, ph = vh - Tp - B;
        const ymax = Math.max(20, ...sets.flatMap(s => s.pts.map(v => Number(v) || 0))) * 1.15;
        const X = i => L + (11 > 0 ? pw * i / 11 : 0);
        const Y = v => Tp + ph * (1 - Math.min(Math.max(Number(v) || 0, 0), ymax) / ymax);

        const NS = 'http://www.w3.org/2000/svg';
        const mk = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
        const svg = mk('svg', { viewBox: `0 0 ${vw} ${vh}`, class: 'chart' });

        // Grid lines + labels
        const g = mk('g', { 'font-size': 12, fill: '#8a93a0' });
        for (let i = 0; i <= 4; i++) {
          const y = Tp + ph * i / 4;
          g.appendChild(mk('line', { x1: L, y1: y, x2: vw - R, y2: y, stroke: '#eef1f4' }));
          g.appendChild(mk('text', { x: L - 7, y: y + 4, 'text-anchor': 'end' }, '$' + (ymax * (1 - i / 4)).toFixed(0)));
        }
        MONTHS.forEach((m, i) => g.appendChild(mk('text', { x: X(i), y: vh - 14, 'text-anchor': 'middle', 'font-size': 11 }, m[0])));
        svg.appendChild(g);

        // Lines
        for (const s of sets) {
          const d = s.pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
          svg.appendChild(mk('path', { d, fill: 'none', stroke: s.color, 'stroke-width': s.w || 2.4, 'stroke-dasharray': s.dash || '' }));
        }

        // Hover guide
        const guide = mk('line', { y1: Tp, y2: Tp + ph, stroke: '#c3ccd6', 'stroke-width': 1, opacity: 0 });
        svg.appendChild(guide);
        svg.addEventListener('mousemove', e => {
          const r = svg.getBoundingClientRect();
          const vx = (e.clientX - r.left) / r.width * vw;
          let bi = 0, bd = 1e9;
          for (let i = 0; i < 12; i++) { const dd = Math.abs(X(i) - vx); if (dd < bd) { bd = dd; bi = i; } }
          guide.setAttribute('x1', X(bi)); guide.setAttribute('x2', X(bi)); guide.setAttribute('opacity', 0.6);
          let h = `<b>${MONTHS[bi]}</b>`;
          for (const s of sets) h += `<br><span style="color:${s.color}">&#9679;</span> ${s.name}: $${(Number(s.pts[bi]) || 0).toFixed(1)}`;
          showTip(h, e.clientX, e.clientY);
        });
        svg.addEventListener('mouseleave', () => { hideTip(); guide.setAttribute('opacity', 0); });

        box.appendChild(svg);
      });
    }

    /* ================================================================
       DIAGNOSTIC FINDINGS
       ================================================================ */
    function diagFindings(years) {
      const out = [];

      // Volume findings
      for (const g of allClasses()) {
        const errsByY = years.map(yr => ({ yr, e: anyErr(yr, g) })).filter(x => x.e);
        const failing = errsByY.filter(x => clsTol(x.e) !== 'good');
        if (!failing.length) continue;
        const worst = failing.reduce((a, b) => Math.abs(b.e.err) > Math.abs(a.e.err) ? b : a);
        const sev = clsTol(worst.e);
        const dir = worst.e.err >= 0 ? 'over' : 'under';
        const yrs = failing.map(x => x.yr).join(', ');
        let txt = `${dir === 'over' ? 'Over' : 'Under'}-generates by ${fmtPctSigned(worst.e.err)} (${fmtTWh(worst.e.mFull - worst.e.bench923)}) in ${worst.yr}`;
        if (failing.length > 1) txt += `; out of tolerance in ${yrs}`;
        txt += '.';
        if (!shareInTol(worst.e, 1) && worst.e.sharePP != null)
          txt += ` Share of total gen off by ${worst.e.sharePP >= 0 ? '+' : ''}${worst.e.sharePP.toFixed(1)}pp.`;
        if (!failing.some(x => classIsGated(x.yr, g)))
          txt += ' Report-only: this class does not gate the C1 fuel-mix test (excluded class, advisory non-fossil, or completeness-skipped vintage).';
        out.push({ cat: 'vol', sev, title: classLabel(g), tag: yrs, txt, score: Math.abs(worst.e.err) });
      }

      // Shape findings
      for (const g of (META().groups || [])) {
        const ms = years.map(yr => ({ yr, m: classMetrics(yr, g) })).filter(x => x.m && x.m.cA > 0);
        const weak = ms.filter(x => x.m.r < R_GOOD);
        if (!weak.length) continue;
        const worst = weak.reduce((a, b) => b.m.r < a.m.r ? b : a);
        const sev = worst.m.r >= R_OK ? 'ok' : 'bad';
        let txt = `Hourly r ${worst.m.r.toFixed(2)} vs CAMPD in ${worst.yr}`;
        if (weak.length > 1) txt += ` (weak in ${weak.map(x => x.yr).join(', ')})`;
        txt += '.';
        out.push({ cat: 'shape', sev, title: classLabel(g), tag: weak.map(x => x.yr).join(', '), txt, score: 1 - worst.m.r });
      }

      // LMP findings
      for (const yr of years) {
        const mm = avgLMPMon(yr);
        if (!mm) continue;
        const aL = actualLMP(yr) || {};
        const am = aL.da_mon || aL.rt_mon;
        if (!am) continue;
        const lab = aL.da_mon ? 'DA' : 'RT';
        const ms = avgLMPMonScar(yr);
        const dvals = ms || mm;
        const errs = MONTHS.map((_, i) => (dvals[i] != null && am[i]) ? dvals[i] - am[i] : null);
        const worst = errs.reduce((a, v, i) => (v != null && (a == null || Math.abs(v) > Math.abs(errs[a]))) ? i : a, null);
        if (worst == null) continue;
        const ann = avgLMPScar(yr) ?? avgLMP(yr);
        const aP = aL.da ?? aL.rt;
        const annD = (ann != null && aP) ? 100 * (ann - aP) / aP : null;
        if (annD != null && Math.abs(annD) > 10) {
          const sev = Math.abs(annD) > 20 ? 'bad' : 'ok';
          let txt = `Annual ${ms ? 'model+ORDC' : 'model'} LMP ${ann != null ? '$' + ann.toFixed(1) : '?'} vs actual ${lab} $${aP.toFixed(1)} (${fmtPctSigned(annD)}).`;
          txt += ` Worst month: ${MONTHS[worst]} ($${errs[worst].toFixed(1)} ${ms ? 'overlay' : 'model'} error).`;
          out.push({ cat: 'lmp', sev, title: `LMP ${yr}`, tag: String(yr), txt, score: Math.abs(annD) });
        }
      }

      // Sort: bad first, then by score descending
      const sevOrd = { bad: 0, ok: 1, good: 2 };
      out.sort((a, b) => (sevOrd[a.sev] ?? 2) - (sevOrd[b.sev] ?? 2) || b.score - a.score);
      return out;
    }

    /* ================================================================
       CHARTS VIEW — single year, single class

    function drawCfHeatmap(yr, grp) {
      const section = document.getElementById('cfHeatSection');
      if (!section) return;
      const d = singleSeries(yr, grp, st.plant);
      if (!d || !d.mm || d.mm.length < T) {
        section.innerHTML = '<p style="font-size:0.82rem;color:var(--text-muted)">No hourly dispatch data for this class.</p>';
        return;
      }

      const maxMW = Math.max(...d.mm);
      const cf = new Float32Array(T);
      if (maxMW > 0) for (let i = 0; i < T; i++) cf[i] = d.mm[i] / maxMW * 100;

      let cfC = null;
      const hasC = !d.nodata && d.cc && d.cc.length >= T;

      section.innerHTML = '';

      // CAMPD actual heatmap (on top)
      if (hasC) {
        const maxCC = Math.max(...d.cc);
        cfC = new Float32Array(T);
        if (maxCC > 0) for (let i = 0; i < T; i++) cfC[i] = d.cc[i] / maxCC * 100;

        section.innerHTML = '<p style="font-weight:700;font-size:0.82rem;margin-bottom:4px">CAMPD Actual</p>';
        const cv1 = document.createElement('canvas');
        cv1.className = 'heat'; cv1.width = 365; cv1.height = 24;
        section.appendChild(cv1);
        drawHeat(cv1, cfC);
        const axis1 = document.createElement('div');
        axis1.className = 'heat-axis';
        axis1.innerHTML = '<span>Jan</span><span>Jul</span><span>Dec</span>';
        section.appendChild(axis1);
      }

      // Model heatmap (on bottom)
      const div2 = document.createElement('div');
      if (hasC) div2.style.marginTop = '12px';
      div2.innerHTML = '<p style="font-weight:700;font-size:0.82rem;margin-bottom:4px">Model</p>';
      section.appendChild(div2);
      const cv2 = document.createElement('canvas');
      cv2.className = 'heat'; cv2.width = 365; cv2.height = 24;
      div2.appendChild(cv2);
      drawHeat(cv2, cf);
      const axis2 = document.createElement('div');
      axis2.className = 'heat-axis';
      axis2.innerHTML = '<span>Jan</span><span>Jul</span><span>Dec</span>';
      div2.appendChild(axis2);

      // Ramp
      const ramp = document.createElement('div');
      ramp.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span style="font-size:0.68rem;color:var(--text-muted)">0%</span><div class="color-ramp"></div><span style="font-size:0.68rem;color:var(--text-muted)">100%</span></div>';
      section.appendChild(ramp);

      // Hover tip on canvases
      const canvases = section.querySelectorAll('canvas.heat');
      canvases.forEach((cv, idx) => {
        const isCampd = hasC && idx === 0;
        const cfArr = isCampd ? cfC : cf;
        cv.addEventListener('mousemove', e => {
          const r = cv.getBoundingClientRect();
          const day = Math.floor((e.clientX - r.left) / r.width * 365);
          const hod = Math.floor((e.clientY - r.top) / r.height * 24);
          if (day < 0 || day > 364 || hod < 0 || hod > 23) { hideTip(); return; }
          const dt = new Date(2023, 0, 1); dt.setDate(day + 1);
          showTip(`<b>${isCampd ? 'CAMPD' : 'Model'}</b><br>${MONTHS[dt.getMonth()]} ${dt.getDate()}, ${String(hod).padStart(2, '0')}:00 &middot; CF ${Math.round(cfArr[day * 24 + hod])}%`, e.clientX, e.clientY);
        });
        cv.addEventListener('mouseleave', hideTip);
      });
    }

    function drawCfDistribution(yr, grp) {
      const container = document.getElementById('cfDistChart');
      if (!container) return;
      const d = singleSeries(yr, grp, st.plant);
      if (!d || !d.mm || d.mm.length < T) {
        container.innerHTML = '<p style="font-size:0.82rem;color:var(--text-muted)">No data.</p>';
        return;
      }
      const a = { mm: d.mm, cc: d.cc };

      const maxMW = Math.max(...a.mm) || 1;
      const maxCC = Math.max(...a.cc) || 1;
      const binW = 5, nBins = Math.ceil(100 / binW);
      const mBins = new Array(nBins).fill(0), cBins = new Array(nBins).fill(0);
      for (let i = 0; i < T; i++) {
        let mv = a.mm[i] / maxMW * 100, cv = a.cc[i] / maxCC * 100;
        if (mv < 0) mv = 0; if (mv > 100) mv = 100;
        if (cv < 0) cv = 0; if (cv > 100) cv = 100;
        let mk = Math.floor(mv / binW); if (mk >= nBins) mk = nBins - 1; mBins[mk]++;
        let ck = Math.floor(cv / binW); if (ck >= nBins) ck = nBins - 1; cBins[ck]++;
      }

      const w = container.clientWidth || 600;
      const h = 260;
      const L = 52, R = 14, Tp = 18, B = 40;
      const pw = w - L - R, ph = h - Tp - B;
      const ymax = Math.max(1, ...mBins, ...cBins) * 1.12;

      const svg = d3.select(container).append('svg')
        .attr('width', w).attr('height', h).attr('class', 'chart');

      const X = c => L + pw * Math.min(Math.max(c, 0), 100) / 100;
      const Y = v => Tp + ph * (1 - Math.min(Math.max(v, 0), ymax) / ymax);

      // Grid
      for (let i = 0; i <= 4; i++) {
        const y = Tp + ph * i / 4;
        svg.append('line').attr('x1', L).attr('y1', y).attr('x2', w - R).attr('y2', y).attr('stroke', '#eef1f4');
        svg.append('text').attr('x', L - 7).attr('y', y + 4).attr('text-anchor', 'end').attr('font-size', 12).attr('fill', '#8a93a0')
          .text(Math.round(ymax * (1 - i / 4)));
      }
      for (let c = 0; c <= 100; c += 10) {
        svg.append('text').attr('x', X(c)).attr('y', h - 14).attr('text-anchor', 'middle').attr('font-size', 12).attr('fill', '#8a93a0').text(c);
      }
      svg.append('text').attr('x', L + pw / 2).attr('y', h - 1).attr('text-anchor', 'middle').attr('font-size', 11).attr('fill', '#6b7480').text('capacity factor (%)');

      // Bars
      const slot = pw * binW / 100, bw = Math.max(2, slot * 0.40);
      const cx = i => X((i + 0.5) * binW);
      for (let i = 0; i < nBins; i++) {
        const c = cx(i);
        // CAMPD
        svg.append('rect').attr('x', c - bw).attr('y', Y(cBins[i])).attr('width', bw).attr('height', Tp + ph - Y(cBins[i]))
          .attr('fill', '#647184');
        // Model
        svg.append('rect').attr('x', c).attr('y', Y(mBins[i])).attr('width', bw).attr('height', Tp + ph - Y(mBins[i]))
          .attr('fill', '#4A90D9');
      }

      // Legend
      svg.append('rect').attr('x', L + 10).attr('y', Tp + 2).attr('width', 12).attr('height', 10).attr('fill', '#4A90D9');
      svg.append('text').attr('x', L + 26).attr('y', Tp + 11).attr('font-size', 10).attr('fill', '#666').text('Model');
      svg.append('rect').attr('x', L + 80).attr('y', Tp + 2).attr('width', 12).attr('height', 10).attr('fill', '#647184');
      svg.append('text').attr('x', L + 96).attr('y', Tp + 11).attr('font-size', 10).attr('fill', '#666').text('CAMPD');
    }

    /* ================================================================
       TABLES VIEW — single year
       ================================================================ */
    // Tables view — same table set, order and numbers as the deployed dashboard
    // (_backcast_shell.py tablesHTML): generation mix (with net-imports/supply/
    // load reconciliation), fuel totals, fossil classes r/NRMSE, CO2, monthly
    // LMP, and the per-plant fit table.
    function renderTables(el) {
      const yr = Number(st.year);
      let html = '';
      html += genMixTable(yr);
      html += fuelTable(yr);
      html += fossilTable(yr);
      html += co2Table(yr);
      html += lmpMonthlyTable(yr);
      html += perPlantTable(yr);
      el.innerHTML = html;
    }

    // System-wide load (TWh): sum of every zone's annual demand in the payload —
    // the same reconciliation basis as the shell (model gen + net imports == load).
    function sysDemand(yr) { const L = RUN(yr).lmp || {}; let d = 0; for (const z in L) d += (L[z].d || 0); return d; }
    // EIA-923 completeness flag for one (year, iso, class) — drives the gen-mix
    // color code, matching the shell's cmpInfo/cmpBadge.
    function cmpInfo(yr, iso, g) { const C = getCompleteness()?.[yr]; if (!C) return null; return (C[iso] || {})[g] || { status: 'incomplete', gate: false }; }
    function cmpBadge(c) {
      if (!c) return '';
      if (c.status === 'complete') return ' <span class="badge-923 ok" title="EIA-923 verified complete — gates C1">&#10003; 923</span>';
      if (c.status === 'immaterial') return ' <span class="badge-923 imm" title="immaterial volume — not gated">&mdash; 923</span>';
      return ' <span class="badge-923 inc" title="incomplete EIA-923 plant data — not gated this vintage">&#9888; 923</span>';
    }

    // Generation mix + supply/load reconciliation — a faithful port of the shell
    // genMixPanel. Iterates over EVERY benchmarked class in classFull (fossil +
    // biomass/hydro/nuclear/oil/solar/wind, CHP folded into parents), so shares
    // are share of TOTAL generation, and appends the net-imports / total-supply /
    // load rows so the net-import volume the generation-only rows omit is visible.
    function genMixTable(yr) {
      const B = BENCH(yr);
      if (!B || !B.classFull) return '';
      const cf = B.classFull, FG = Object.keys(cf), gm = RUN(yr).gmModel || {};
      const iso = st.iso;
      const aGen = FG.reduce((s, g) => s + (cf[g] || 0), 0);
      const mGen = FG.reduce((s, g) => s + (gm[g] || 0), 0);
      const prelim = !!getCompleteness()?.[yr];
      // Net imports (import-positive): the fuelRows "interchange" row is net-EXPORT
      // positive (EIA-930 sign), so flip it. Present only for a priced-interchange
      // bundle; a measured-schedule bundle nets interchange into demand (no row).
      const ix = (RUN(yr).fuelRows || []).find(x => x.fuel === 'interchange');
      const mImp = ix ? -ix.m : null, aImp = (ix && ix.b != null) ? -ix.b : null;
      const load = sysDemand(yr);

      // CHP → parent merge (grid-delivered values already BTM-subtracted).
      const FG_disp = FG.filter(g => !(g in CHP_MERGE));
      const cf_d = Object.fromEntries(FG_disp.map(g => [g, cf[g] || 0]));
      const gm_d = Object.fromEntries(FG_disp.map(g => [g, gm[g] || 0]));
      for (const [chp, par] of Object.entries(CHP_MERGE)) {
        if (par in cf_d) cf_d[par] = (cf_d[par] || 0) + (cf[chp] || 0);
        if (par in gm_d) gm_d[par] = (gm_d[par] || 0) + (gm[chp] || 0);
      }

      let h = `<div class="bc-panel"><h2>Generation mix <span class="panel-sub">(system-wide; share of total generation by class vs grid-delivered EIA-923 (923 &minus; BTM); CHP folded into parent class; BTM excluded — grid-delivered only)</span></h2>`;
      h += `<p class="panel-sub">${esc(RUN(yr).label || st.runId)} generation ${mGen.toFixed(1)} TWh &middot; actual ${aGen.toFixed(1)} TWh`
        + (mImp != null ? ` &middot; + net imports ${mImp.toFixed(1)} (actual ${aImp == null ? '—' : aImp.toFixed(1)}) &rarr; supply ${(mGen + mImp).toFixed(1)} TWh vs load ${load.toFixed(1)} TWh` : '') + `</p>`;
      if (prelim) h += '<p class="panel-sub" style="color:#9a5b12"><b>Preliminary EIA-923 vintage:</b> only <span class="badge-923 ok">&#10003; 923</span> classes are verified-complete and gate the C1 fuel-mix test; <span class="badge-923 inc">&#9888; 923</span> (incomplete) and <span class="badge-923 imm">&mdash; 923</span> (immaterial) classes are shown for reference but not gated.</p>';
      h += `<div class="bc-table-wrap"><table>
        <thead><tr><th>class</th><th>model TWh</th><th>actual TWh</th><th>model %gen</th><th>actual %gen</th><th>Δpp</th></tr></thead>
        <tbody>`;

      for (const g of FG_disp) {
        const a = cf_d[g] || 0, m = gm_d[g] || 0;
        const a_g = aGen > 0 ? 100 * a / aGen : 0, m_g = mGen > 0 ? 100 * m / mGen : 0, dpp = m_g - a_g;
        const ci = prelim && (g in ((getCompleteness()?.[yr] || {})[iso] || {})) ? cmpInfo(yr, iso, g) : null;
        const rowcls = ci ? (ci.status === 'incomplete' ? ' class="cmpl-inc"' : (ci.status === 'immaterial' ? ' class="cmpl-imm"' : '')) : '';
        const dppcls = (ci && !ci.gate) ? '' : ppcls(dpp);
        h += `<tr${rowcls}><td>${esc(mixLabel(g))}${cmpBadge(ci)}</td><td class="num">${m.toFixed(2)}</td><td class="num">${a.toFixed(2)}</td>`
          + `<td class="num">${m_g.toFixed(1)}</td><td class="num">${a_g.toFixed(1)}</td>`
          + `<td class="num ${dppcls}">${fmtpp(dpp)}</td></tr>`;
      }
      h += `<tr class="sub"><td>Total generation</td><td class="num">${mGen.toFixed(2)}</td><td class="num">${aGen.toFixed(2)}</td>`
        + `<td class="num">100.0</td><td class="num">100.0</td><td class="num"></td></tr>`;

      // Reconcile generation + net imports = supply = load.
      if (mImp != null) {
        const mSup = mGen + mImp;
        const aSup = aImp != null ? aGen + aImp : null;
        h += `<tr><td>net imports</td><td class="num">${mImp.toFixed(2)}</td><td class="num">${aImp == null ? '—' : aImp.toFixed(2)}</td><td class="num"></td><td class="num"></td><td class="num"></td></tr>`;
        h += `<tr class="sub"><td>Total supply (gen + net imports)</td><td class="num">${mSup.toFixed(2)}</td><td class="num">${aSup == null ? '—' : aSup.toFixed(2)}</td><td class="num"></td><td class="num"></td><td class="num"></td></tr>`;
        if (load > 0) {
          const dM = mSup - load, dA = aSup != null ? aSup - load : null;
          h += `<tr><td>Load (EIA-930 demand)</td><td class="num">${load.toFixed(2)}</td><td class="num">${load.toFixed(2)}</td><td class="num"></td><td class="num"></td><td class="num ${ppcls(100 * dM / load)}">${fmtTWh(dM)}</td></tr>`;
          if (dA != null && Math.abs(dA) > 2)
            h += `<tr><td colspan="6" class="panel-sub" style="text-align:left;white-space:normal;padding:6px 0 0">Model supply balances load to ${fmtTWh(dM)} (storage round-trip + dump). The actual column is EIA-923 net generation reconciled to the EIA-930 grid series per fossil family (grid-delivered: CHP behind-the-meter and 923↔930 plant-to-BA assignment removed so each family matches what reached the grid). Any residual ${fmtTWh(dA)} vs load is EIA-930's own net-generation-minus-demand discrepancy (the two series are independently surveyed), not behind-the-meter — both columns are now on the same grid-delivered basis, so the per-class shares and the absolute supply total are directly comparable.</td></tr>`;
        }
      }
      return h + '</tbody></table></div></div>';
    }

    function fuelTable(yr) {
      const fr = RUN(yr).fuelRows;
      if (!fr || !fr.length) return '';
      // Gas/coal totals are recomputed from the committed gmModel + bench e930 on
      // the grid-delivered vs raw-EIA-930 basis (user directive 2026-07-02):
      // model = EVERY gas/coal class's grid LP dispatch (the BTM CHP host supply
      // was never in the LP, so the model side is grid-delivered by
      // construction); benchmark = the raw EIA-930 grid series, gas deflated by
      // the biomass/'other' fold-in exactly like calibration_verdict.score_sysvol.
      // Older payloads baked a gas row that dropped the CHP classes from the
      // model and releveled the "930" bench to the EIA-923 classFull basis —
      // that double-showed the CC classification split already visible in the
      // Generation-mix table and made the 930 column a misnomer. r/NRMSE stay
      // the committed payload values (the C4 hourly-shape stats the verdict
      // gates on — a flat level shift does not change r).
      const gm = RUN(yr).gmModel || {}, B = BENCH(yr) || {};
      const e930 = B.e930 || {}, cf = B.classFull || {};
      const hasGm = Object.keys(gm).length > 0;
      let h = `<div class="bc-panel"><h2>Fuel totals vs EIA-930 <span class="panel-sub">(system-wide; 930 not zonal; grid-delivered model vs raw EIA-930 grid series; calibrated fuels only — hydro/oil/other/biomass and the full load reconciliation are in the Generation mix table above)</span></h2>
        <div class="bc-table-wrap"><table>
        <thead><tr><th>fuel</th><th>model TWh</th><th>EIA-930</th><th>Δ</th><th>r</th><th>NRMSE</th></tr></thead>
        <tbody>`;
      for (const f of ['gas', 'coal', 'nuclear', 'wind', 'solar']) {
        const r = fr.find(x => x.fuel === f);
        if (!r) continue;
        let m = r.m, b = r.b;
        if (hasGm && (f === 'gas' || f === 'coal')) {
          const cls = f === 'gas' ? GAS_CLASSES : COAL_CLASSES;
          m = cls.reduce((s, c) => s + (gm[c] || 0), 0);
          if (e930[f] != null) {
            b = e930[f];
            if (f === 'gas' && e930.other != null)
              b -= Math.max(0, (cf.OTHER || 0) + (cf.biomass || 0) - (e930.other || 0));
          }
        }
        const d = b != null && b !== 0 ? 100 * (m - b) / b : null;
        h += `<tr><td>${f}</td><td class="num">${m.toFixed(1)}</td><td class="num">${b == null ? '—' : b.toFixed(1)}</td>
          <td class="num ${d == null ? '' : dcls(d)}">${d == null ? '—' : fmtPctSigned(d)}</td>
          <td class="num">${r.r == null ? '—' : r.r.toFixed(3)}</td>
          <td class="num">${r.nrmse == null ? '—' : r.nrmse.toFixed(3)}</td></tr>`;
      }
      // Net imports
      const ix = fr.find(x => x.fuel === 'interchange');
      if (ix) {
        const m = -ix.m, b = ix.b == null ? null : -ix.b;
        const d = (b != null && b !== 0) ? 100 * (m - b) / b : null;
        h += `<tr><td>net imports</td><td class="num">${m.toFixed(1)}</td><td class="num">${b == null ? '—' : b.toFixed(1)}</td>
          <td class="num ${d == null ? '' : dcls(d)}">${d == null ? '—' : fmtPctSigned(d)}</td>
          <td class="num">${ix.r == null ? '—' : ix.r.toFixed(3)}</td>
          <td class="num">${ix.nrmse == null ? '—' : Math.abs(ix.nrmse).toFixed(3)}</td></tr>`;
      }
      return h + `</tbody></table></div><p class="panel-sub" style="margin-top:6px">Model gas/coal sum every class's grid LP dispatch (behind-the-meter CHP host supply is held out of the LP, so both columns are grid-delivered); EIA-930 gas is deflated by the biomass/&lsquo;other&rsquo; fold-in where the BA folds those fuels into its NG series — the same construction the C2 verdict uses. The per-class split against grid-delivered EIA-923 lives in the Generation mix table.</p></div>`;
    }

    // Fossil classes — model vs full EIA-923 (Δ923), with hourly r and
    // MEAN-normalized NRMSE vs CAMPD. Mirrors the shell singleFossilTable.
    function fossilTable(yr) {
      const groups = META().groups || [], labels = META().groupLabel || {};
      let h = `<div class="bc-panel"><h2>Fossil classes — model vs EIA-923, r/NRMSE vs CAMPD</h2>
        <div class="bc-table-wrap"><table>
        <thead><tr><th>class</th><th>model TWh</th><th>EIA-923</th><th>Δ923</th><th>r</th><th>NRMSE</th></tr></thead>
        <tbody>`;
      for (const grp of groups) {
        const m = classMetrics(yr, grp);
        if (!m) continue;
        const dd = m.bench923 > 0.02 ? 100 * (m.mFull - m.bench923) / m.bench923 : null;
        h += `<tr><td>${esc(labels[grp] || grp)}</td><td class="num">${m.mFull.toFixed(2)}</td><td class="num">${m.bench923.toFixed(2)}</td>`
          + `<td class="num ${dd == null ? '' : dcls(dd)}">${dd == null ? '—' : fmtPctSigned(dd)}</td>`
          + `<td class="num ${rcls(m.r)}">${m.r.toFixed(3)}</td><td class="num">${m.nr.toFixed(3)}</td></tr>`;
      }
      return h + '</tbody></table></div></div>';
    }

    // Per-plant fit vs CAMPD / EIA-923, sorted by class then plate capacity.
    // Mirrors the shell's per-plant table (r, NRMSE, capture%, Δ923%).
    function perPlantTable(yr) {
      const B = BENCH(yr), M = RUN(yr), labels = META().groupLabel || {};
      if (!B?.plants || !M?.plants) return '';
      let h = `<div class="bc-panel"><h2>Per-plant fit vs CAMPD / EIA-923 — ${yr}</h2>
        <div class="bc-table-wrap"><table>
        <thead><tr><th>plant</th><th>class</th><th>zone</th><th>r</th><th>NRMSE</th><th>capture%</th><th>Δ923%</th></tr></thead>
        <tbody>`;
      const codes = Object.keys(M.plants).filter(c => B.plants[c] && st.zones.has(B.plants[c].zone))
        .sort((a, b) => B.plants[a].group.localeCompare(B.plants[b].group) || B.plants[b].npl - B.plants[a].npl);
      for (const c of codes) {
        const b = B.plants[c], mp = M.plants[c];
        const d = b.e_ann > 0.001 ? 100 * (mp.m_ann - b.e_ann) / b.e_ann : null;
        h += `<tr><td>${esc(b.name)}</td><td>${esc(labels[b.group] || b.group)}</td><td>${esc(b.zone)}</td>`
          + `<td class="num ${rcls(mp.r)}">${mp.r ?? '—'}</td><td class="num">${mp.nrmse ?? '—'}</td>`
          + `<td class="num">${mp.cap == null ? '—' : mp.cap.toFixed(0)}</td>`
          + `<td class="num ${d == null ? '' : dcls(d)}">${d == null ? '—' : d.toFixed(0)}</td></tr>`;
      }
      return h + '</tbody></table></div></div>';
    }

    const CO2_BAND = 7; // ±7% system gate — matches calibration_verdict C5a (CO2_TOL)
    function co2Table(yr) {
      const M = RUN(yr).co2, B = BENCH(yr).co2;
      if (!M || !B) return '';
      const dT = B.egrid > 0 ? 100 * (M.model - B.egrid) / B.egrid : null;
      let h = `<div class="bc-panel"><h2>Fossil CO2 — model vs actual (Mt) <span class="panel-sub">(eGRID + CAMPD plant rates × grid generation; C5a ±${CO2_BAND}% gate)</span></h2>
        <div class="bc-table-wrap"><table>
        <thead><tr><th>class</th><th>model Mt</th><th>actual Mt</th><th>Δ</th></tr></thead>
        <tbody>`;
      const mb = M.byClass || {}, ab = B.byClass || {};
      const classes = [...new Set([...Object.keys(ab), ...Object.keys(mb)])].sort();
      for (const c of classes) {
        const m = mb[c] || 0, a = ab[c] || 0;
        const dc = a > 0 ? 100 * (m - a) / a : null;
        h += `<tr><td>${esc((META().groupLabel || {})[c] || c)}</td><td class="num">${m.toFixed(2)}</td><td class="num">${a.toFixed(2)}</td>
          <td class="num ${dc == null ? '' : dcls(dc)}">${dc == null ? '—' : fmtPctSigned(dc)}</td></tr>`;
      }
      const gate = dT == null ? '' : (Math.abs(dT) <= CO2_BAND ? '<span class="cs-badge det-cal">PASS</span>' : '<span class="cs-badge det-not">FAIL</span>');
      h += `<tr class="sub"><td><b>total</b></td><td class="num"><b>${M.model.toFixed(1)}</b></td><td class="num"><b>${B.egrid.toFixed(1)}</b></td>
        <td class="num ${dT == null ? '' : dcls(dT)}"><b>${dT == null ? '—' : fmtPctSigned(dT)}</b> ${gate}</td></tr>`;
      return h + `</tbody></table></div><p class="panel-sub" style="margin-top:6px">Actual CO2 covers ${B.covPct}% of fossil-class EIA-923 generation by a plant-specific rate; the class intensity stands in for the small remainder. Grid-delivered basis (behind-the-meter CHP excluded, matching the model).</p></div>`;
    }

    function lmpMonthlyTable(yr) {
      const mm = avgLMPMon(yr);
      if (!mm) return '';
      const aL = actualLMP(yr) || {};
      const da = aL.da_mon, rt = aL.rt_mon;
      const ms = avgLMPMonScar(yr);
      const dvals = ms || mm;

      const pair = (m, a) => {
        const d = (m != null && a) ? 100 * (m - a) / a : null;
        return `<td class="num">${a == null ? '—' : '$' + a.toFixed(1)}</td>
          <td class="num ${d == null ? '' : dcls(d)}">${d == null ? '—' : fmtPctSigned(d)}</td>`;
      };

      const dBasis = ms ? 'model + overlay' : 'model';
      let h = `<div class="bc-panel"><h2>Monthly LMP — model vs actual <span class="panel-sub">(model load-weighted over selected zones; actual = system hub average; Δ = (${dBasis} − actual)/actual)</span></h2>
        <div class="bc-table-wrap"><table>
        <thead><tr><th>month</th><th>model $/MWh</th>`;
      if (ms) h += '<th>+ overlay $/MWh</th>';
      if (da) h += '<th>actual DA</th><th>Δ DA</th>';
      if (rt) h += '<th>actual RT</th><th>Δ RT</th>';
      h += '</tr></thead><tbody>';

      for (let m = 0; m < 12; m++) {
        h += `<tr><td>${MONTHS[m]}</td><td class="num">${mm[m] == null ? '—' : '$' + mm[m].toFixed(1)}</td>`;
        if (ms) h += `<td class="num" style="color:${OVERLAY_COLOR}">${ms[m] == null ? '—' : '$' + ms[m].toFixed(1)}</td>`;
        if (da) h += pair(dvals[m], da[m]);
        if (rt) h += pair(dvals[m], rt[m]);
        h += '</tr>';
      }

      const ann = avgLMP(yr), annScar = avgLMPScar(yr);
      const annD = annScar ?? ann;
      h += `<tr class="sub"><td>Annual</td><td class="num">${ann == null ? '—' : '$' + ann.toFixed(1)}</td>`;
      if (ms) h += `<td class="num" style="color:${OVERLAY_COLOR}">${annScar == null ? '—' : '$' + annScar.toFixed(1)}</td>`;
      if (da) h += pair(annD, aL.da);
      if (rt) h += pair(annD, aL.rt);
      h += '</tr>';

      // Diagnostic footnote (+ ORDC MAE improvement when the run carries an
      // overlay), matching the shell — LMP level is display-only, never gated.
      const O = ordcOverlay(yr);
      const note = O ? ` Δ is taken against the <b style="color:${OVERLAY_COLOR}">model + overlay</b> price (energy LMP + ORDC/reliability-deployment adder), since the actuals include the ORDC reserve adder; the overlay is display-only and never gated. Monthly LMP MAE vs actual RT ${O.maeEnergyOnly.toFixed(1)} → ${O.maeOverlay.toFixed(1)}.` : '';
      return h + '</tbody></table></div><p class="panel-sub" style="margin-top:6px">Diagnostic only — LMP level is not a calibration target.' + note + '</p></div>';
    }

    /* ================================================================
       ISO SELECTION
       ================================================================ */
    async function selectIso(iso) {
      st.iso = iso;
      hashState.update('iso', iso);
      updateIsoChrome(iso);

      const sel = $('#isoSel');
      sel.value = iso;

      const meta = getMeta()[iso] || {};
      const runs = isoRuns(iso);
      const hint = $('#isoHint');
      hint.textContent = `${meta.zones?.length || 0} zones, ${meta.years?.length || 0} years, ${runs.length} runs`;

      st.zones = new Set(meta.zones || []);
      st.klass = (meta.groups || [])[0] || null;

      $('#content').innerHTML = '';
      $('#bcTop').style.display = 'none';
      $('#diag').textContent = 'Loading runs...';
      $('#diag').style.display = '';

      clearAggCache();
      buildRunList(iso);

      if (runs.length) {
        const h = hashState.get();
        const targetRun = (h.run && runs.some(r => r.id === h.run)) ? h.run : runs[0].id;
        await selectRun(targetRun);
      } else {
        $('#diag').textContent = 'No runs available for this ISO.';
      }
    }

    /* ================================================================
       BOOT
       ================================================================ */
    async function boot() {
      try {
        await initBC();

        const meta = getMeta();
        if (!meta || !Object.keys(meta).length) throw new Error('No ISO data in manifest.');

        const isos = Object.keys(meta);
        const sel = $('#isoSel');
        sel.innerHTML = isos.map(iso => {
          const n = isoRuns(iso).length;
          return `<option value="${esc(iso)}">${esc(iso)} (${n})</option>`;
        }).join('');
        sel.addEventListener('change', () => selectIso(sel.value));

        wireViewSel();

        // Read hash state
        const h = hashState.get();
        if (h.view) st.view = h.view;
        if (h.year) st.year = Number(h.year);
        if (h.run) st.runId = h.run;

        // Activate correct view button
        $('#viewSel').querySelectorAll('button').forEach(b => {
          b.classList.toggle('active', b.dataset.v === st.view);
        });

        const startIso = (h.iso && isos.includes(h.iso)) ? h.iso : (isos.includes('ERCOT') ? 'ERCOT' : isos[0]);
        await selectIso(startIso);

      } catch (err) {
        const diag = $('#diag');
        diag.textContent = `Error initializing: ${err.message}`;
        diag.style.display = '';
        console.error(err);
      }
    }

    // Hash change listener
    window.addEventListener('hashchange', () => {
      const h = hashState.get();
      if (h.iso && h.iso !== st.iso) selectIso(h.iso);
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
