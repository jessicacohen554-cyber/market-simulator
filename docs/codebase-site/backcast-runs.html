<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Explorer — Codebase Explorer</title>
  <meta name="description" content="Drill into any backcast run — generation mix, zonal LMPs, capacity-factor heatmaps, price duration curves. Compare model vs EPA CAMPD / EIA actuals.">

  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/bc-pages.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
          integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
  <nav id="topNav" aria-label="Site navigation"></nav>

  <div class="bc-layout">

    <!-- Sidebar -->
    <aside class="bc-sidebar">
      <h3>Market (ISO)</h3>
      <div class="iso-select-wrap" id="isoWrap">
        <span class="iso-dot"></span>
        <select class="iso-select" id="isoSel" aria-label="Market (ISO)"></select>
      </div>
      <p class="run-hint" id="isoHint"></p>

      <h3>Run</h3>
      <div class="run-list" id="runList"></div>
      <p class="run-hint">Click a run id for its definition. Newest first.</p>
    </aside>

    <!-- Main content -->
    <main class="bc-main">
      <div class="bc-page-header">
        <h1>Backcast Results</h1>
        <span id="isoBadge" class="iso-badge"></span>
      </div>
      <p class="bc-page-sub" id="pageSub">Model vs EPA CAMPD / EIA actuals</p>

      <div id="diag" class="bc-diag-alert">Loading run data&hellip;</div>

      <!-- Top controls -->
      <div class="bc-controls" id="bcTop" style="display:none">
        <div class="ctl">
          <span class="ctl-label">View</span>
          <span class="seg-ctrl" id="viewSel">
            <button data-v="report" class="active">Report</button>
            <button data-v="charts">Charts</button>
            <button data-v="tables">Tables</button>
          </span>
        </div>
        <div class="ctl" id="ctlYear">
          <span class="ctl-label">Year</span>
          <select id="yearSel" class="iso-select" style="min-width:190px" aria-label="Year"></select>
        </div>
        <div class="ctl" id="ctlClass" style="display:none">
          <span class="ctl-label">Class</span>
          <select id="classSel" class="iso-select" style="min-width:130px"></select>
        </div>
        <div class="ctl ctlwide" id="ctlZones" style="display:none">
          <span class="ctl-label">Zones</span>
          <div class="zone-chips" id="zoneChips"></div>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <div class="bc-tooltip" id="bctip"></div>

  <script src="js/nav.js"></script>
  <script src="js/shared.js"></script>

  <script type="module" src="js/backcast-runs.js"></script>
</body>
</html>
