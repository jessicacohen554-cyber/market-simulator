<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calibration Status — Codebase Explorer</title>
  <meta name="description" content="Executive summary of backcast calibration across all ISOs — per-ISO determination cards, per-criterion test results, and methodology rubric.">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/bc-pages.css">
</head>
<body>
  <nav id="topNav"></nav>

  <div class="content-section" style="padding: var(--space-lg);">

    <!-- Page header -->
    <div class="bc-page-header">
      <h1>Calibration Status</h1>
    </div>
    <p class="bc-page-sub" id="genStamp">Loading calibration data&hellip;</p>

    <!-- Legend -->
    <div class="cs-legend" id="legend" style="margin-bottom: var(--space-lg);">
      <span><span class="cs-legend-dot cal"></span> Calibrated</span>
      <span><span class="cs-legend-dot cav"></span> Calibrated with caveats</span>
      <span><span class="cs-legend-dot not"></span> Not calibrated</span>
    </div>

    <!-- ISO Cards Grid -->
    <div class="cs-grid" id="cardGrid"></div>

    <!-- Selected ISO Detail -->
    <div id="detailPane" style="margin-top: var(--space-lg);"></div>

    <!-- Reference: rubric + commercial-band anchors (collapsed) -->
    <div id="methodologySection" style="margin-top: var(--space-xl);"></div>

  </div>

  <script src="js/nav.js"></script>
  <script src="js/shared.js"></script>

  <script type="module" src="js/calibration-status.js"></script>
</body>
</html>
