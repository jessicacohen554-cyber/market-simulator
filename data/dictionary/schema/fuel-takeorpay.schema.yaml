# Canonical schema: ERCOT gas take-or-pay (contract vs spot share)
#
# Per-plant EIA-923 Schedule-5 natural-gas purchase-type breakdown for ERCOT
# plants, derived by scripts/data/derive_gas_takeorpay.py.  spot_share is the
# fraction of annual gas volume purchased at spot prices (avoidable Waha hub
# exposure); the complement (1 - spot_share) is firm-contracted and insulated
# from the hub collapse.  total_mmbtu is used as the MMBtu-weighting factor
# when aggregating per-plant shares to model zones.
#
# Curated by scripts/data/curate_fuel_prices.py from
#   data/raw/_processed-legacy/gas_takeorpay_ERCOT.csv
datatype: fuel-takeorpay
schema_version: 1
title: ERCOT gas take-or-pay (spot vs contract share per plant)
description: >-
  Per-plant EIA-923 Schedule-5 gas purchase-type fractions for ERCOT.
  spot_share is the fraction purchased at spot (avoidable Waha hub exposure);
  total_mmbtu is the annual gas volume used as a weight for zone aggregation.

key_columns: [plant_code]
allow_additional_columns: false

columns:
  - name: plant_code
    dtype: int64
    unit: none
    nullable: false
    description: EIA plant code (integer, matches fleet plant_id).
  - name: spot_share
    dtype: float64
    unit: fraction
    nullable: false
    description: >-
      Fraction of annual natural-gas purchases at spot prices (0.0–1.0).
      The complement (1 - spot_share) is firm-contracted and insulated from
      hub-price swings.
  - name: total_mmbtu
    dtype: float64
    unit: mmbtu
    nullable: false
    description: >-
      Total annual gas volume in MMBtu.  Used as the MMBtu weight when
      aggregating per-plant spot shares to model zones.
