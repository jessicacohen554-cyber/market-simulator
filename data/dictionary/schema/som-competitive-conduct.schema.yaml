# Canonical schema: ISO State-of-the-Market competitive-conduct metrics
#
# Hand-transcription of the market monitor's (Potomac Economics IMM/MMU)
# published competitive-assessment and fuel-conduct statistics: the
# system price-cost mark-up, the economic-withholding "output gap", and
# the coal commitment-conduct decomposition (SOM "Coal-Fired Resource
# Operation and Profitability" tables — economic-offer vs must-run
# [self-commitment] start shares and per-MWh net revenue, split
# regulated vs merchant). These are the measured, citable answers to
# "how far from cost does a fleet actually offer" and "what fraction of
# coal commitments are self-scheduled" (CLAUDE.md rule 13-admissible: a
# market-design/conduct measurement that regenerates with each annual
# SOM and responds to changed conditions).
#
# MISO seeded 2026-07-10 (2023/2024 SOM annual tables + 2025 IMM
# quarterly output-gap rows) for the coal offer-structure adjudication
# (docs/handoffs/miso-coal-offer-som-redesign-2026-07.md). ERCOT seeded
# 2026-08-05 (2023/2024/2025 ERCOT SOM Net Revenue Analysis + CONE +
# existing-unit cost benchmarks; PDFs under data/raw/ERCOT/) for the
# FFR-6A retirement-screen margin-gap decomposition
# (docs/handoffs/ffr-6a-margin-gap-decomposition-2026-08-05.md). Other
# ISOs' SOMs (NYISO/ISO-NE) publish analogous sections and extend this
# datatype with new iso rows; annual grain except where a monitor only
# publishes seasonal/quarterly values.
#
# Holdout note (CLAUDE.md rule 22, as clarified by the owner 2026-08-06).
# The former quarantine here read "only train-window years (2023-2025)
# are transcribed … pending owner authorization". That is SUPERSEDED and
# was backwards: "WHAT IS HELD OUT IS THE *SCORE*, NEVER THE *DATA*" —
# data intake needs no per-ISO/per-window authorization and no marker,
# and a measured input belongs in every year. Only SOLVING, SCORING or
# REGISTERING an out-of-training year is the spend.
#
# ERCOT net-revenue anchors for 2019-2022 were therefore transcribed
# 2026-08-13 (session ercot-195, L-SCAR-SCREEN-2) from each vintage's
# OWN prose-stated Net Revenue Analysis values — the identification
# source for the screen scarcity-rent lane
# (docs/DECISION-CARD-lscar-screen-revenue-2026-08-13.md §2.2, whose V0
# gate sets a >=5-anchor-vintage floor). No year was solved or scored to
# produce them. NOTE the SOM prints its multi-year history only as BAR
# CHARTS with no data labels, so a vintage's value is transcribable only
# from the report that reports that year as its own subject year; the
# 2018 ERCOT SOM is absent from the Potomac document library, and 2018
# is outside the program's 2019-2025 working span in any case.
#
# Curated by scripts/data/curate_som_competitive_conduct.py from
#   data/raw/som-competitive-conduct/som_competitive_conduct.csv
datatype: som-competitive-conduct
schema_version: 1
title: ISO State-of-the-Market competitive-conduct metrics
description: >-
  Market-monitor (State of the Market / IMM quarterly) competitive-conduct
  statistics by ISO, year and fleet segment: price-cost mark-up, output-gap
  economic-withholding levels, and coal economic-offer vs must-run
  (self-commitment) start shares with net revenues.

key_columns: [iso, year, period, fleet_segment, metric]
allow_additional_columns: false

columns:
  - name: iso
    dtype: string
    unit: none
    nullable: false
    description: ISO identifier (MISO seeded; NYISO/ERCOT/NEISO extend).
  - name: year
    dtype: int64
    unit: none
    nullable: false
    description: Market year the statistic describes (not the publication year).
  - name: period
    dtype: string
    unit: none
    nullable: false
    description: >-
      Aggregation window within the year: "annual" for SOM full-year values,
      or the IMM quarterly-report season ("spring", "summer", "fall",
      "winter") for quarterly values.
  - name: fleet_segment
    dtype: string
    unit: none
    nullable: false
    description: >-
      Fleet the metric describes: "system" (all suppliers),
      "coal_regulated" (SOM Table 7 "Regulated Utilities" coal rows),
      "coal_merchant" (SOM Table 7 "Merchants" coal rows),
      "new_gas_ct" / "new_gas_cc" (the ERCOT SOM Net Revenue Analysis
      hypothetical new-entrant proxies: CT 10.5 / CC 7.0 MMBtu/MWh heat
      rate, $4/MWh VOM, 10% outage rate), or "coal_existing" /
      "nuclear_existing" (the SOM existing-unit profitability
      discussions' cost benchmarks). SPP adds "coal" / "wind" (the SPP
      MMU's fuel-type marginal-resource markup averages); SPP-81 adds
      "gas_combined_cycle" / "gas_simple_cycle" / "other" for the
      marginal-technology shares.
  - name: metric
    dtype: string
    unit: none
    nullable: false
    description: >-
      Metric code: "price_cost_markup" (simulated actual-offer vs
      reference-level SMP difference, fraction), "output_gap_share_of_load"
      (low-threshold monthly-average output gap as a fraction of load),
      "output_gap_low_threshold_mw" (low-threshold output gap, MW/hr),
      "starts" (coal unit commitments in the year), "starts_econ_offered_share"
      (fraction of starts offered economically / scheduled day-ahead),
      "starts_mustrun_profitable_share" / "starts_mustrun_unprofitable_share"
      (fraction of starts with must-run [self-commit] status, split by
      whether market revenues covered commitment + variable cost by the
      first full day), "net_revenue_usd_per_mwh" (net operating revenue of
      the segment's starts). ERCOT SOM net-revenue rows add:
      "net_revenue_usd_per_kw_yr" (single published value; "_min"/"_max"
      variants for locational ranges; "_houston"/"_west" variants for the
      named-zone values), "net_revenue_ex_uri_usd_per_kw_yr_min"/"_max"
      (the 2021 SOM's own published Winter-Storm-Uri counterfactual —
      what the year's net revenue "would have ranged" absent Uri; the
      monitor's number, not a derived one),
      "ecrs_effect_share_of_net_revenue" (share of
      2023 net revenue the monitor attributes to ECRS price effects),
      "cone_usd_per_kw_yr_min"/"_max" (Potomac CONE estimates),
      "cone_planning_usd_per_kw_yr" / "cone_pnm_threshold_usd_per_kw_yr"
      (PUCT planning CONE vs legacy PNM-threshold CONE),
      "peaker_net_margin_usd_per_kw_yr", and existing-unit cost
      benchmarks "fixed_om_usd_per_kw_yr", "vom_usd_per_mwh",
      "fuel_cost_usd_per_mwh", "marginal_cost_usd_per_mwh",
      "total_generating_cost_usd_per_mwh". SPP MMU SOM rows (SPP-80, 2026-09-25)
      add: "offer_markup_{onpeak,offpeak}_usd_per_mwh" (MW-weighted average
      marginal-resource offer markup, market-based minus mitigated offer, $/MWh
      — a DIFFERENT construct from MISO's fractional "price_cost_markup"),
      "_exfeb_" variants (the 2021 SOM's own February-excluded averages),
      "_digitized_" variants (read from the SOM bar chart's average marker where
      the report prints no value — the note carries the bias correction),
      "offer_markup_usd_per_mwh" on the "coal"/"wind" segments,
      "congestion_payments_usd" (DA+RT congestion payments),
      "rt_scarcity_intervals" (five-minute RT intervals with any reserve
      scarcity), and "avg_{da,rt}_price_usd_per_mwh" (+ "_exfeb_"). SPP-81
      (2026-09-25) adds "rt_marginal_interval_share_digitized" (share of RT
      intervals each technology segment was marginal, digitized from the SOM
      "Generation on the margin, real-time" bars, fraction) and
      "rt_implied_heat_rate" (the MMU's annual implied heat rate, btu_per_kwh).
  - name: value
    dtype: float64
    unit: mixed
    nullable: false
    description: Metric value; unit given by the unit column.
  - name: unit
    dtype: string
    unit: none
    nullable: false
    description: >-
      One of "fraction", "count", "usd_per_mwh", "usd_per_kw_yr", "mw", "usd",
      "btu_per_kwh" (SPP MMU implied heat rate, added by SPP-81).
  - name: source_doc
    dtype: string
    unit: none
    nullable: false
    description: Source report PDF filename under data/raw/MISO/ (or the ISO's raw dir).
  - name: source_page
    dtype: int64
    unit: none
    nullable: false
    description: PDF page number (1-based, PDF pagination) the value was read from.
  - name: note
    dtype: string
    unit: none
    nullable: true
    description: Restatements, definitions, and caveats as printed in the source.
