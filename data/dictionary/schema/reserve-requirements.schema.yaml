# Canonical schema: measured as-enforced hourly reserve requirements
#
# The hourly reserve-requirement MW an ISO actually enforced in real time,
# per reserve location and product — the condition-varying requirement series
# consumed by the in-LP energy+reserve co-optimization when a
# `<iso>_dynamic_reserve_requirements` ScenarioConfig flag is on. A measured
# requirement is a rule-13-admissible market-design INPUT (it regenerates for
# a forward year as the published static base plus the ISO's published
# condition rules — largest contingency, cold-weather/gas events — applied to
# forward states, and it responds to changed conditions). Measured reserve
# PRICES are the validation target and are never stored in this datatype.
#
# Tidy long frame: one row per (iso, location, product, hour). Locations and
# products keep each ISO's published vocabulary, normalized to the canonical
# product names below by the per-ISO parser
# (scripts/lib/reserve_requirements/<iso>.py). ISO-NE (NEISO) is the first
# registered ISO: ISO Express "Hourly Reserve Requirements"
# (ancillary-hourly-rr; locations ROS=7000 system-wide, SWCT=7001, CT=7002,
# NEMABSTN=7003 — Web Services API reserve-location vocabulary). The NYISO
# hourly analogue (issue #1344 Ask B) predates this datatype and stays on its
# legacy raw seam (data/raw/NYISO-AS/requirements/, data.nyiso_reserve_
# requirements); migrating it here is optional future work.
#
# Curated by scripts/data/curate_reserve_requirements.py from
#   data/raw/NEISO-AS/requirements/requirements_<start>_<end>.csv
# (window CSVs regenerated by scripts/data/fetch_neiso_reserve_requirements.py).
datatype: reserve-requirements
schema_version: 1
title: Measured as-enforced hourly reserve requirements
description: >-
  Hourly reserve-requirement MW enforced in real time, per ISO reserve
  location and canonical product (10min_spin / 10min_total / 30min_total).
  A measured market-design input for the in-LP reserve co-optimization;
  never a price or an outcome.

key_columns: [iso, location, product, interval_start_utc]
allow_additional_columns: false

columns:
  - name: iso
    dtype: string
    unit: none
    nullable: false
    description: ISO identifier (NEISO; other ISOs register additively).
  - name: location
    dtype: string
    unit: none
    nullable: false
    description: >-
      Reserve location label in the ISO's published vocabulary (NEISO: ROS =
      the system-wide requirement row, SWCT / CT / NEMABSTN = local reserve
      zones whose published series carries the 30-minute total only).
  - name: location_id
    dtype: int64
    unit: none
    nullable: false
    description: ISO-native numeric location ID (NEISO 7000-7003).
  - name: product
    dtype: string
    unit: none
    nullable: false
    description: >-
      Canonical reserve product: 10min_spin (NEISO Ten-Minute Spinning),
      10min_total (Ten-Minute), 30min_total (TOTAL, the 30-minute
      requirement).
  - name: interval_start_utc
    dtype: datetime64[ns, UTC]
    unit: utc_timestamp
    nullable: false
    description: tz-aware UTC hour-beginning of the requirement hour.
  - name: interval_start_local
    dtype: datetime64[ns]
    unit: local_timestamp
    nullable: true
    description: >-
      Prevailing Eastern wall-clock hour-beginning (informational; the
      fall-back hour repeats its wall-clock stamp, the UTC key stays unique).
  - name: requirement_mw
    dtype: float64
    unit: mw
    nullable: false
    description: >-
      Enforced requirement MW (>= 0). Local-zone rows publish 0 for the
      products they do not carry; zeros are kept as published.
