# Canonical schema: ERCOT electric-power gas price (TX delivered)
#
# EIA natural-gas price delivered to TX electric-power consumers (series
# N3045TX3), monthly, in $/Mcf.  Used by fuel.py to anchor the ERCOT
# zonal-basis level to the measured delivered cost rather than the flat
# GAS_BASIS_DIFFERENTIAL scalar.  The annual mean minus the Henry Hub annual
# mean gives the fleet-wide delivered-gas basis for ERCOT.
#
# Curated by scripts/data/curate_fuel_prices.py from
#   data/raw/ercot_electric_power_gas_price.csv
datatype: fuel-ercot-ep-gas
schema_version: 1
title: ERCOT electric-power gas price (TX delivered, $/Mcf)
description: >-
  Monthly EIA natural-gas price delivered to TX electric-power consumers
  (series N3045TX3, $/Mcf).  Used to anchor the ERCOT zonal-basis level on
  measured delivered cost rather than the flat scalar.

key_columns: [year, month]
allow_additional_columns: false

columns:
  - name: year
    dtype: int64
    unit: none
    nullable: false
    description: Calendar year.
  - name: month
    dtype: int64
    unit: none
    nullable: false
    description: Calendar month (1–12).
  - name: price_usd_mcf
    dtype: float64
    unit: usd_per_mcf
    nullable: false
    description: >-
      Monthly average price of natural gas delivered to TX electric-power
      consumers ($/Mcf; multiply by 1/1.036 MMBtu/Mcf to convert to $/MMBtu).
