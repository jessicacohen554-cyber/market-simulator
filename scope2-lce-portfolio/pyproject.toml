[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lce-portfolio"
version = "0.1.0"
description = "Scope 2 hourly LCE portfolio optimization — match load with clean resources at lowest premium above wholesale"
requires-python = ">=3.11"
dependencies = [
    "highspy",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
# pyyaml is a runtime-optional dependency (PortfolioConfig.from_file supports
# YAML configs only when it's installed, JSON always works) but the test
# suite exercises the YAML parsing path directly, so it's a real test-time
# dependency here.
dev = ["pytest", "pyyaml"]

[project.scripts]
lce-portfolio = "lce_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: touches real on-disk data; skipped when absent"]
