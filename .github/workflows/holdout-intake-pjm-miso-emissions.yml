# One-shot holdout DATA-READINESS intake: PJM + MISO 2022 per-plant CO2-rate rows
# (data/raw/_processed-legacy/plant_emission_rates_v2.parquet + .csv).
#
# Owner-authorized 2026-07-22 (frontend/data/backcast/calibration-complete.json
# intake_log) for the DATA, and owner-authorized this session to use an Actions
# workflow for the binary-artifact landing (push_files cannot carry the binary
# parquet, and git push is dead in the Claude container).
#
# Rule 22 (Option 2): DATA intake ONLY. No solve / score / register — PJM and
# MISO carry no calibration-complete marker, so the dispatch quarantine and the
# G-19 one-shot HOLD stay fully in force. The loosened intake tools
# (scripts/data/{curate_emissions_unit_annual,derive_plant_emissions_v2}.py)
# accept the logged intake_log authorization as the rule-22 gate; derive's own
# clash guard + byte-frozen assertion keep every pre-existing row identical and
# make a re-run safe (it refuses a second merge).
#
# Trigger: push any file under .github/holdout-emissions-queue/ on this branch.
# (Branch-only workflows can't use workflow_dispatch and this session's token
# can't dispatch, so this is the established push-queue pattern. The path filter
# means neither this workflow file nor the artifact commit re-triggers the run.)
name: Holdout intake — PJM/MISO 2022 emissions

on:
  push:
    branches: [claude/holdout-backcast-readiness-x8jf60]
    paths:
      - ".github/holdout-emissions-queue/**"

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Sparse + partial checkout: this repo commits hundreds of MB of raw data
      # (eia-930 ~230 MB, lmp-data, gas-prices, …) a full clone chokes on. Fetch
      # only what the intake touches — the package, the scripts, the schema, the
      # 2022 CAMPD inputs, the merge-target artifact, and the intake-log gate.
      # blob:none makes it a partial clone (blobs fetched lazily for the cone).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src
            scripts
            frontend
            data/dictionary
            data/raw/campd-unit-level
            data/raw/_processed-legacy
          sparse-checkout-cone-mode: true

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Curate 2022 emissions-unit-annual (holdout-authorized)
        run: uv run python scripts/data/curate_emissions_unit_annual.py --years 2022 --holdout-intake PJM

      - name: Derive PJM 2022 rows (merge into artifact, pre-existing rows frozen)
        run: uv run python scripts/data/derive_plant_emissions_v2.py --iso PJM --years 2022 --holdout-intake PJM

      - name: Derive MISO 2022 rows (merge into artifact, pre-existing rows frozen)
        run: uv run python scripts/data/derive_plant_emissions_v2.py --iso MISO --years 2022 --holdout-intake MISO

      - name: Summarize new rows
        run: |
          uv run python -c "import pandas as pd; from market_sim.config import paths; df=pd.read_parquet(paths.RAW_DATA_DIR/'_processed-legacy'/'plant_emission_rates_v2.parquet'); print('2022 rows by ISO:', {i: int(len(df[(df.iso==i)&(df.year==2022)])) for i in ('PJM','MISO')}); print('total rows:', len(df))"

      - name: Commit + push the updated artifact
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/_processed-legacy/plant_emission_rates_v2.parquet \
                  data/raw/_processed-legacy/plant_emission_rates_v2.csv
          if git diff --cached --quiet; then
            echo "no artifact change — nothing to commit (already merged?)"
            exit 0
          fi
          git commit \
            -m "data(emissions): PJM+MISO 2022 v2 rows (holdout data readiness, rule 22)" \
            -m "Owner-authorized 2026-07-22 (intake_log). DATA intake only; no solve/score/register (PJM/MISO have no calibration-complete marker)." \
            -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
