name: apply-ercot-c2-930-otr

# Applies the ERCOT C2 gas-counting 2/3 fix (thread NG:OTH into the ERCOT
# bundle frame, scripts/run_calibration_full.py) onto this branch server-side
# — the apply-export-cap.yml / apply-miso-1347-edits.yml precedent. The full
# file is ~363 KB, beyond what a hand-transcribed full-file API push can carry
# without corruption risk, so the 9-line change travels as a git patch
# (.github/patches/2026_07_10_ercot_c2_930_otr.patch) applied byte-exactly by
# `git apply`. The job then removes its own scaffolding so the branch diff vs
# main carries only the intended change. Idempotent: a re-run after cleanup
# no-ops (patch file gone); a re-run before cleanup skips the apply when the
# fix is already present.
on:
  push:
    branches:
      - claude/ercot-c2-930-scarcity-rd7k2m
    paths:
      - .github/patches/2026_07_10_ercot_c2_930_otr.patch
      - .github/workflows/apply-ercot-c2-930-otr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch, commit verbatim, remove scaffolding
        run: |
          set -euo pipefail
          PATCH=.github/patches/2026_07_10_ercot_c2_930_otr.patch
          WF=.github/workflows/apply-ercot-c2-930-otr.yml
          if [ ! -f "$PATCH" ]; then
            echo "patch file gone - already applied and cleaned up; no-op"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          if grep -q 'other = load_ercot_other_gen(year)' scripts/run_calibration_full.py; then
            echo "fix already present - skipping apply"
          else
            git apply --verbose "$PATCH"
            git add scripts/run_calibration_full.py
            cat > /tmp/commit-msg <<'MSG'
          fix(ercot): C2 gas counting 2/3 — thread NG:OTH into the ERCOT bundle frame

          Wires load_ercot_other_gen into _eia930_frame so the bundle carries the
          EIA-930 Other series and the C2 gas fold-in deflation can fire for ERCOT
          (companion to the eia_loader change merged via PR #1923).

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_019W7SPeJ9w4sogUxpVCBt2K
          MSG
            git commit -F /tmp/commit-msg
          fi
          git rm -q "$PATCH" "$WF"
          git commit -m "chore: remove ercot-c2-930-otr server-side apply scaffolding"
          git push origin "HEAD:${GITHUB_REF_NAME}"
