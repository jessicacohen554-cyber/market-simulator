# One-shot: finalize the NYISO/NEISO fleet_to_bins re-gate keeper promotions
# (caiso-81 lane E; the PJM leg finalizes separately when pjm-106 lands).
# Everything concurrency-sensitive happens ON THE RUNNER against CURRENT
# origin/main: the keepers.json swap is applied programmatically to main's
# copy (concurrent sessions promote keepers too — never clobber with a
# session-local snapshot), the ~770 KB calibration-log.md splice likewise
# (caiso80-finalize pattern), and status.js is rebuilt from the checked-out
# bundles + the swapped keepers.json. Data-API-only publish parented on
# main via ci_api_upload_onmain.py; no runner git-push anywhere.
name: caiso81-regate-finalize

on:
  push:
    branches:
      - claude/caiso-81-calibration-gvz68q
    paths:
      - .github/workflows/caiso81-regate-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl

      - name: Swap the NYISO/NEISO keepers against CURRENT origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- frontend/data/backcast/keepers.json
          python - <<'PY'
          import json
          p = 'frontend/data/backcast/keepers.json'
          k = json.load(open(p))
          swaps = {
              'NYISO': ('2026-07-11-nyiso-61-downstate-import', '2026-07-13-nyiso-62-cc-hr'),
              'NEISO': ('2026-07-09-neiso-56-reserve-coopt', '2026-07-13-neiso-59-cc-hr'),
          }
          for iso, (old, new) in swaps.items():
              if k.get(iso) == new:
                  print(f'{iso}: already {new}')
                  continue
              assert k.get(iso) == old, f'{iso} keeper is {k.get(iso)!r}, expected {old!r} — a concurrent swap happened; aborting'
              k[iso] = new
              k['keepers'] = [new if r == old else r for r in k['keepers']]
              print(f'{iso}: {old} -> {new}')
          json.dump(k, open(p, 'w'), indent=1)
          open(p, 'a').write('\n')
          PY

      - name: Splice the lane-E log entry against CURRENT origin/main
        run: |
          set -euo pipefail
          test -f docs/_caiso81e_log_entry.md
          git checkout origin/main -- docs/calibration-log.md
          python - <<'PY'
          lp = 'docs/calibration-log.md'
          log = open(lp).read()
          entry = open('docs/_caiso81e_log_entry.md').read().rstrip() + '\n'
          if 'nyiso-62 / neiso-59 (fleet_to_bins CC-HR re-gate' in log:
              print('already spliced')
          else:
              marker = '## Runs\n'
              assert marker in log, 'splice anchor missing'
              head, tail = log.split(marker, 1)
              open(lp, 'w').write(head + marker + '\n' + entry + tail)
              print('spliced at top of ## Runs')
          PY

      - name: Rebuild status.js (new NYISO/NEISO keepers)
        run: |
          set -euo pipefail
          python scripts/build_status.py
          grep -q '2026-07-13-nyiso-62-cc-hr' frontend/data/backcast/status.js
          grep -q '2026-07-13-neiso-59-cc-hr' frontend/data/backcast/status.js
          echo 'status.js carries both re-gate keepers'

      - name: Publish via the GitHub Data API (one commit parented on main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_onmain.py \
            --branch claude/caiso81-regate-finalize-pub \
            --message "keepers: promote nyiso-62 + neiso-59 (fleet_to_bins CC-HR re-gate, caiso-78 blast radius) + lane-E log entry + status.js [skip ci]" \
            --file frontend/data/backcast/keepers.json \
            --file docs/calibration-log.md \
            --file docs/_caiso81e_log_entry.md \
            --file frontend/data/backcast/status.js
