name: register-w3a-caiso65

# One-shot registration of the W3a envelope-clock A/B arms (caiso-65 + its
# zero-forcing ablation twin), rules 15/16/21. The agent sandbox cannot
# dispatch workflows (the MCP integration lacks actions:write), so this
# workflow triggers on the push that lands its own file and hardcodes the two
# dispatches it would otherwise receive as inputs; the solve+register+publish
# steps mirror calibration-run.yml. Each job re-solves the caiso-60 keeper
# recipe from the committed caiso61_lolp_tail bundle via --replay-bundle at
# THIS ref (whose eia_loader carries the envelope-clock fix), so the
# registered bundles carry the fix. Remove this file once both runs publish.
on:
  push:
    branches:
      - claude/caiso-seam-diurnal-shape-w3a-y2cc1s
    paths:
      - .github/workflows/register-w3a-caiso65.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - run_name: caiso65_seam_envelope_clock
            ablation_flag: ""
            note: >-
              PROBE/KEEPER-CANDIDATE (W3a seam-clock fix; keeper decision =
              owner). The caiso-60 keeper recipe re-solved with the measured
              (month x hod) p95 corridor envelope bucketed on the MODEL clock:
              the CISO per-DIBA parquet's local_time stamps lag the model
              frame by a measured 1h (standard) / 2h (daylight) - lag-scan
              corr 0.972/0.961 at -1/-2h vs <=0.930 elsewhere, absolute frame
              anchored by January solar astronomy + the 2024-04-08 eclipse dip
              - so the keeper's envelope reached the LP 1-2h late. Fixed at
              the read seam (eia_loader._caiso_interchange_model_clock, pinned
              measured constants + drift guard
              scripts/validate_caiso_seam_hod_frame.py; zero fitted
              parameters, rule 23). A/B vs the caiso-61 base arm at the same
              code state: hod-mean corridor-flow error improves every year
              (mean |delta| 1402->1362 / 1803->1692 / 1979->1816 MW, gains at
              the phase edges h9/h18), lambda a near-wash (+-$0.0-0.8) as
              pre-registered; kept on correctness (rule 14). Part of the W3a
              forensics that WITHDREW the seam-diurnal FINDING attribution
              (its actual-flow table was UTC-bucketed) and reattributed the
              C3a body to belly gas commitment - see
              FINDING-caiso-seam-tz-correction-2026-07-07.md.
          - run_name: caiso65_seam_envelope_clock-ablation
            ablation_flag: "--zero-forcing-ablation"
            note: >-
              D-3 zero-forcing ablation TWIN of caiso65_seam_envelope_clock
              (rule 21): the same envelope-clock-corrected caiso-60 recipe
              with every merchant floor/bridge neutralized
              (ScenarioConfig.as_zero_forcing_ablation). ablation_of:
              caiso65_seam_envelope_clock (recorded here; the replay path
              does not thread the run_config field - see the W3a PR).
    steps:
      - name: Checkout session ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Solve (replay caiso-60 recipe at this ref)
        env:
          RUN_NAME: ${{ matrix.run_name }}
          ABLATION: ${{ matrix.ablation_flag }}
          NOTE: ${{ matrix.note }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python scripts/run_calibration_full.py \
            --replay-bundle results/calibration/caiso61_lolp_tail \
            --out-dir "results/calibration/$RUN_NAME" \
            --note "$NOTE" $ABLATION

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.run_name }}
          path: results/calibration/${{ matrix.run_name }}
          retention-days: 7
          if-no-files-found: error

      - name: Register on dashboard and publish to main
        env:
          RUN_NAME: ${{ matrix.run_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="auto/${RUN_NAME}-${SHORT_SHA}"

          # Fresh main base; -f keeps the untracked bundle in the worktree.
          git fetch origin main
          git checkout -fB "$BRANCH" origin/main

          RUN_ID=$(python scripts/dashboard_add_run.py \
                     --label "$RUN_NAME" \
                     --bundle "results/calibration/$RUN_NAME" \
                   | sed -n 's/^RUN_ID=//p')
          test -n "$RUN_ID"
          echo "run id = $RUN_ID"

          git add "results/calibration/${RUN_NAME}" \
                  "frontend/data/backcast/registry/${RUN_ID}.json" \
                  "frontend/data/backcast/runs/${RUN_ID}.js" \
                  frontend/data/backcast/bench

          git commit -m "calibration: ${RUN_NAME} (${RUN_ID})"

          push_with_retry() {
            local n=0 delay=2
            until git push -u origin "$1"; do
              n=$((n+1)); [ $n -ge 4 ] && return 1
              echo "push failed; retry $n in ${delay}s"; sleep $delay; delay=$((delay*2))
            done
          }

          push_with_retry "$BRANCH" || { echo "::error::could not push $BRANCH"; exit 1; }

          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:main"; then
              echo "published to main."
              exit 0
            fi
            echo "main moved; rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not publish to main after retries; run remains on $BRANCH (use Bulk-merge)."
          exit 1
