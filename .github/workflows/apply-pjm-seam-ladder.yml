name: apply-pjm-seam-ladder

# Applies the 2026-07-10 PJM session's work onto this branch, server-side —
# the apply-miso-1347-edits / apply-export-cap precedent. The session's remote
# env cannot push large packs (git push 413s) or raw Data-API blobs (403), so
# the work travels as (a) a plain-text unified diff of every normal-width file
# (.github/patches/2026_07_10_pjm96_code.patch: the measured PJM seam ladder +
# the temp-derate validation probe + calibration-log) and (b) an anchored
# splice script for the multi-kilobyte single-line JSON files
# (.github/patches/2026_07_10_pjm96_registry_edits.py: keeper demotion
# pjm-95 -> pjm-94). status.js is DERIVED and rebuilt here (build_status.py)
# rather than transcribed. The patch's leading workflow-file section
# (fetch-pjm-interchange.yml) is FILTERED OUT before apply — the Actions
# GITHUB_TOKEN can never carry the `workflows` scope, so that file lands via
# the session's direct App-auth push instead. The patch applies with
# --ignore-whitespace (the transport can blur blank-vs-space context lines;
# content chars are exact and the post-apply pytest gate catches anything
# worse). Commit messages ride as files (git commit -F) — inline heredocs at
# column 0 break the YAML block scalar. Idempotent: the patch no-ops when
# already applied (reverse-check), the splice script checks its own markers.
on:
  push:
    branches:
      - claude/pjm-calibration-fuel-scarcity-2gd56m
    paths:
      - .github/patches/2026_07_10_pjm96_code.patch
      - .github/patches/2026_07_10_pjm96_registry_edits.py
      - .github/workflows/apply-pjm-seam-ladder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply the code patch (commit 1 — measured seam ladder + probe)
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # Strip the leading fetch-pjm-interchange.yml new-file section: the
          # runner token cannot push workflow files (no `workflows` scope);
          # that file arrives via the session's direct App-auth push.
          awk '/^diff --git a\/data\/raw\/eia-930-interchange\/README.md/{found=1} found' \
            .github/patches/2026_07_10_pjm96_code.patch > /tmp/pjm96_filtered.patch
          test -s /tmp/pjm96_filtered.patch
          if git apply --check --reverse --ignore-whitespace /tmp/pjm96_filtered.patch 2>/dev/null; then
            echo "code patch already applied — skipping"
          else
            git apply --ignore-whitespace --whitespace=nowarn /tmp/pjm96_filtered.patch
            git add -A
            git commit -F .github/patches/pjm96_commit1_msg.txt
          fi

      - name: Install the package (test + build_status deps)
        run: |
          pip install -e .
          pip install pytest

      - name: Post-apply test gate (ladder tests must pass before any push)
        run: python -m pytest tests/test_pjm_seam_ladder.py tests/test_miso_seam_ladder.py -q

      - name: Registry splices + status rebuild (commit 2 — keeper demotion)
        run: |
          set -euo pipefail
          python .github/patches/2026_07_10_pjm96_registry_edits.py
          python scripts/build_status.py
          if git diff --quiet; then
            echo "no registry changes (edits already applied)"
          else
            git add -u
            git commit -F .github/patches/pjm96_commit2_msg.txt
          fi

      - name: Push
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
