          fi

      - name: Push
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
