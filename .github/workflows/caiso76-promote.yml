# One-shot: promote caiso-76 to CAISO keeper on the runner (byte-heavy files
# never transit the MCP relay — apply-caiso7475-docs precedent). Steps:
# keepers.json swap (caiso65 -> caiso-76), calibration-log entry insertion
# from the committed payload docs/_caiso76_log_entry.md (payload removed in
# the same commit), and a deterministic status.js regen via
# scripts/build_status.py from the already-committed registry + bundles.
# Promotion authorization: the session's pre-authorized conditions — C6+C7+C8
# PASS, no C-gate regressed vs the keeper's v2.4 rescore (C2 CAVEAT bar
# cleared), C1/C2 volume cluster improved (see the log entry + FINDING).
name: caiso76-promote

on:
  push:
    branches:
      - claude/caiso-76-gas-evening-cc-ci27nq
    paths:
      - .github/workflows/caiso76-promote.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply keeper swap + log entry insertion
        run: |
          set -euo pipefail
          test -f docs/_caiso76_log_entry.md
          python - <<'PY'
          import json

          # 1. keepers.json: CAISO -> caiso-76 (idempotent).
          p = 'frontend/data/backcast/keepers.json'
          k = json.load(open(p))
          old = k['CAISO']
          new = '2026-07-11-caiso-76-hydro-budget'
          if old != new:
              k['CAISO'] = new
              k['keepers'] = [new if x == old else x for x in k['keepers']]
              json.dump(k, open(p, 'w'), indent=1)

          # 2. calibration-log: insert the entry before the caiso-74/75 one
          #    (idempotent on re-run).
          lp = 'docs/calibration-log.md'
          log = open(lp).read()
          entry = open('docs/_caiso76_log_entry.md').read()
          marker = '### 2026-07-11 — CAISO — caiso-74'
          assert marker in log
          if 'caiso-76 (measured 2025 hydro budget correction)' not in log:
              log = log.replace(marker, entry + '\n' + marker, 1)
              open(lp, 'w').write(log)
          PY
          git rm -q docs/_caiso76_log_entry.md

      - name: Regenerate status.js (deterministic from committed inputs)
        run: python scripts/build_status.py

      - name: Commit + push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/backcast/keepers.json \
                  frontend/data/backcast/status.js \
                  docs/calibration-log.md
          git commit -m "Promote caiso-76 (measured 2025 hydro budget correction) to CAISO keeper — C2 clears to CAVEAT, C6/C7/C8 PASS, no gate regressed [skip ci]"
          git push origin HEAD:claude/caiso-76-gas-evening-cc-ci27nq
