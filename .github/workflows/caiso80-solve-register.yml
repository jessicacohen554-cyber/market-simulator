# One-shot: solve the caiso-80 (supply-consistent honest demand) A/B probe
# pair (main + zero-forcing ablation twin) on CI and register both on the
# backcast dashboard as PROBES. The caiso-67/69/74/75/76/77/78 precedent: the
# session environment cannot transport the ~400-600 KB run payloads (or the
# 404 KB scenarios.py / 392 KB run_calibration_full.py) through the MCP
# push_files relay byte-safely, so the code delta travels as a committed
# xz+base64 git patch, the solve+register runs here, and the per-run files
# are committed via the GitHub Data API with the runner's token
# (scripts/ci_api_upload_multi.py). Keeper stays 2026-07-12-caiso-78-cc-hr;
# promotion is a separate decision evaluated from the committed scores.
#
# Probe: scripts/probes/_caiso80_supply_consistent_demand_ab.py — the
# caiso-78 keeper recipe unchanged; the single delta is
# caiso_supply_consistent_demand=True, the owner-signed Option A of
# FINDING-caiso80-demand-basis-wedge-2026-07-13 (the CISO EIA-930 Demand
# cell carries the corrupt NG cell's fabricated block by the
# Demand = NetGen + TI identity; the replacement is the derived measured
# supply-consistent series, 207.40/212.19/205.59 TWh). The patch also
# carries the demand-threading gate fix in run_calibration_full.py (the
# 48ec6b9 optimization read the PRISTINE per-year config for the CAISO
# demand flags, silently threading RAW demand into any probe-channel
# realigned solve — no committed bundle was affected, no CAISO solve ran
# between 48ec6b9 and this fix). Years 2023-2025 sequential within each
# invocation (CLAUDE.md rule 12); the two invocations run sequentially on
# this runner.
#
# NOTE (caiso-77 v1 postmortem): the runner token cannot push a ref whose
# NEW commits touch .github/workflows/* — the patch/artifact/prune commits
# here touch only src/scripts/data/registry files, and all bundle payloads
# go through the Data API, never `git push` of large packs.
#
# The CAISO registry is at 15/15, so registration is preceded by the top-15
# prune (rule 15 retention): the caiso-74 measured-battery-AS-reservation
# pair — an INERT probe (negative result; the calibration-log entry keeps
# the record; bundle dirs stay).
name: caiso80-solve-register

on:
  push:
    branches:
      - claude/caiso-80-c3a-decomposition-fm9460
    paths:
      - .github/workflows/caiso80-solve-register.yml

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and commit the caiso-80 core patch (sha-gated)
        run: |
          set -euo pipefail
          base64 -d scripts/probes/_caiso80_core.patch.xz.b64 | xz -d > /tmp/caiso80.patch
          echo "6a33e3ce686f6d913a75ef7d28330d4f3f7c304e0ab3180e16055b12d50f25d6  /tmp/caiso80.patch" | sha256sum -c -
          if git apply --check --reverse /tmp/caiso80.patch 2>/dev/null; then
            echo "patch already applied and committed — skipping"
          else
            git apply /tmp/caiso80.patch
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "caiso-80: caiso_supply_consistent_demand flag + loader seam + demand-threading gate fix (applied from _caiso80_core.patch.xz.b64) [skip ci]"
            git push origin HEAD:claude/caiso-80-c3a-decomposition-fm9460
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl pytest

      - name: Derive and commit the supply-consistent demand artifact (guarded)
        run: |
          set -euo pipefail
          python scripts/derive_caiso_supply_consistent_demand.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/raw/reference/caiso-supply-consistent-demand || \
             [ -n "$(git status --porcelain data/raw/reference/caiso-supply-consistent-demand)" ]; then
            git add data/raw/reference/caiso-supply-consistent-demand
            git commit -m "caiso-80: supply-consistent demand artifact (derived, guard-railed; 207.40/212.19/205.59 TWh) [skip ci]"
            git push origin HEAD:claude/caiso-80-c3a-decomposition-fm9460
          else
            echo "artifact already committed — skipping"
          fi

      - name: Regression-test the demand seam
        run: |
          python -m pytest tests/test_caiso_supply_consistent_demand.py \
            tests/test_caiso_demand_clock.py tests/test_config.py -q

      - name: Curate clean partitions the recipe reads
        run: |
          set -euo pipefail
          # data/clean is derived/gitignored — a fresh checkout has neither
          # partition. Without capacity-deliverability the keeper's published
          # MIC seam supersession silently skips (caiso-69 precedent).
          PYTHONPATH="$PWD" python scripts/curate_capacity_deliverability.py --isos CAISO

      - name: Solve caiso-80 main (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso80_supply_consistent_demand_ab.py main

      - name: Solve caiso-80 ablation twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso80_supply_consistent_demand_ab.py ablation

      - name: Write probe attestations
        run: python scripts/probes/_caiso80_attestation.py

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso67/69/7475/76/77/78-solve-register precedent).
          for b in caiso80_supply_consistent_demand caiso80_supply_consistent_demand-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso CAISO --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Prune CAISO registry to top-15 (caiso-74 inert-probe pair)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/caiso-80-c3a-decomposition-fm9460
          git rm -q \
            frontend/data/backcast/registry/2026-07-11-caiso-74-storage-as.json \
            frontend/data/backcast/registry/2026-07-11-caiso-74-storage-as-ablation.json \
            frontend/data/backcast/runs/2026-07-11-caiso-74-storage-as.js \
            frontend/data/backcast/runs/2026-07-11-caiso-74-storage-as-ablation.js
          git commit -m "Prune caiso-74 inert-probe pair sidecars + payloads (top-15 retention, displaced by caiso-80) [skip ci]"
          git push origin HEAD:claude/caiso-80-c3a-decomposition-fm9460

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 80 supply demand" \
            --bundle results/calibration/caiso80_supply_consistent_demand | tee /tmp/r80m.out
          python scripts/dashboard_add_run.py \
            --label "caiso 80 supply demand ablation" \
            --bundle results/calibration/caiso80_supply_consistent_demand-ablation | tee /tmp/r80a.out
          echo "RID80M=$(grep '^RUN_ID=' /tmp/r80m.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID80A=$(grep '^RUN_ID=' /tmp/r80a.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID80M" --bundle results/calibration/caiso80_supply_consistent_demand \
            --rid "$RID80A" --bundle results/calibration/caiso80_supply_consistent_demand-ablation \
            --branch claude/caiso-80-c3a-decomposition-fm9460 \
            --message "results: register caiso-80 (supply-consistent honest demand, owner-signed Option A) PROBE + zero-forcing twin on the backcast dashboard (keeper stays caiso-78) [skip ci]"
