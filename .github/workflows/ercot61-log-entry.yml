# One-shot: append the ERCOT-61 calibration-log entry (binding-regime ST_GAS
# lane adjudication — two rule-16 probes, thermal side exonerated, no
# registration) from the committed payload doc docs/_ercot61_log_entry.md,
# remove the payload doc, and push the docs commit back to this branch
# (ercot60-log-entry precedent — the ~700 KB calibration-log.md cannot transit
# the MCP relay).
name: ercot61-log-entry

on:
  push:
    branches:
      - claude/ercot-st-gas-drag-floor-lj3mek
    paths:
      - .github/workflows/ercot61-log-entry.yml

permissions:
  contents: write

jobs:
  log-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Append log entry, remove payload doc, push
        run: |
          set -euo pipefail
          python - <<'PY'
          log_path = 'docs/calibration-log.md'
          log = open(log_path).read()
          entry = open('docs/_ercot61_log_entry.md').read()
          if 'ERCOT-61: the binding-regime ST_GAS drag-floor lane adjudicated' not in log:
              log = log.rstrip('\n') + '\n\n' + entry.strip() + '\n'
              open(log_path, 'w').write(log)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q docs/_ercot61_log_entry.md
          git add docs/calibration-log.md
          git commit -m "docs: ERCOT-61 calibration-log entry (binding-regime ST_GAS lane adjudication) + session payload doc removed [skip ci]"
          git push origin HEAD:claude/ercot-st-gas-drag-floor-lj3mek
