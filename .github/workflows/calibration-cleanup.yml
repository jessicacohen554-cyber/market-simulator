name: calibration-cleanup

# Purge old calibration run bundles from the repo AND from all git history,
# selecting by each run dir's last-commit date, and/or strip oversized blobs
# THAT LIVE UNDER THE CALIBRATION BUNDLE PATH (path_prefix, default
# results/calibration). Rewrites history (BFG-style via git-filter-repo) and
# force-pushes the DEFAULT branch (what fresh clones check out). DRY-RUN by
# default — preview first, then re-run with dry_run=false.
#
# SCOPE: blob stripping is restricted to blobs whose every path in history is
# under path_prefix. Input data (data/raw/**, eGRID workbooks, EIA/CAMPD/ERCOT
# parquets, etc.) is NEVER touched — only the big dispatch-result parquets in
# the calibration bundles are eligible. This is deliberate: an earlier version
# used `--strip-blobs-bigger-than` which stripped EVERY blob over the threshold
# repo-wide and wiped the model's input data.
#
# NOTE: date-based dir removal frees little on its own (git de-dupes identical
# inputs and delta-compresses similar dispatch parquets across runs). To
# actually shrink the repo, set strip_blobs_bigger_than (e.g. 1M) — the
# dashboard renders from the small frontend runs/*.js, not the parquet bundles,
# so stripping the big calibration blobs does not break it.
#
# WARNING: a non-dry run REWRITES HISTORY on the default branch. Existing clones
# and open PRs must be re-cloned/rebased. If the branch is protected against
# force-push, allow it for GITHUB_TOKEN or run with a PAT that can bypass.

on:
  workflow_dispatch:
    inputs:
      before_date:
        description: "Purge run dirs whose LAST commit is before this date (YYYY-MM-DD). Blank = none."
        required: false
        default: ""
        type: string
      path_prefix:
        description: "Directory holding the bundle subdirs. Also bounds blob stripping — nothing outside it is touched."
        required: false
        default: "results/calibration"
        type: string
      keep_dirs:
        description: "Comma-separated bundle dir names to ALWAYS keep"
        required: false
        default: "caiso_keeper_v2_3yr,_shared"
        type: string
      strip_blobs_bigger_than:
        description: "Strip blobs bigger than this (e.g. 1M) — ONLY blobs whose whole history sits under path_prefix. Blank = skip."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Preview only — list what would be purged, do not rewrite or push"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: calibration-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (safe — keep the tool cache the runner needs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install git-filter-repo
        run: |
          python3 -m pip install --user git-filter-repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Mirror-clone history only (no 24 GB working tree)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo.git
          echo "Mirror .git size:"; du -sh repo.git

      - name: Select stale bundle dirs
        working-directory: repo.git
        run: |
          set -euo pipefail
          : > /tmp/removelist.txt
          if [ -n '${{ inputs.before_date }}' ]; then
            PREFIX='${{ inputs.path_prefix }}'
            CUTOFF_TS=$(date -u -d '${{ inputs.before_date }}' +%s)
            BR=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
            IFS=',' read -ra KEEP <<< '${{ inputs.keep_dirs }}'
            for dir in $(git ls-tree -d --name-only "$BR" "$PREFIX/" 2>/dev/null); do
              base=$(basename "$dir"); skip=false
              for k in "${KEEP[@]}"; do [ "$base" = "$(echo "$k" | xargs)" ] && skip=true; done
              if $skip; then echo "KEEP(listed) $dir"; continue; fi
              last=$(git log -1 --format=%cI "$BR" -- "$dir" 2>/dev/null || true)
              [ -z "$last" ] && continue
              if [ "$(date -u -d "$last" +%s)" -lt "$CUTOFF_TS" ]; then
                echo "PURGE $dir (last $last)"; echo "$dir/" >> /tmp/removelist.txt
              else
                echo "keep  $dir (last $last)"
              fi
            done
          else
            echo "No before_date given — date-based dir removal skipped."
          fi
          n=$(wc -l < /tmp/removelist.txt | tr -d ' '); echo "Selected $n dir(s)."
          {
            echo "### Calibration cleanup"
            echo "before_date: '${{ inputs.before_date }}'  |  strip_blobs_bigger_than: '${{ inputs.strip_blobs_bigger_than }}'  |  path_prefix: '${{ inputs.path_prefix }}'"
            echo "Selected **$n** bundle dir(s) to purge by date:"
            echo '```'; cat /tmp/removelist.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select oversized blobs UNDER path_prefix only
        if: ${{ inputs.strip_blobs_bigger_than != '' }}
        working-directory: repo.git
        env:
          PREFIX: ${{ inputs.path_prefix }}
          THRESH: ${{ inputs.strip_blobs_bigger_than }}
        run: |
          set -euo pipefail
          # Build the list of blob IDs to strip: a blob qualifies only if it is
          # bigger than the threshold AND every path it ever had in history is
          # under path_prefix. A blob shared with any path outside the prefix
          # (e.g. an input file) is never selected, so stripping cannot reach
          # outside the calibration bundles.
          python3 - <<'PY'
          import os, subprocess
          prefix = os.environ['PREFIX'].rstrip('/') + '/'
          raw = os.environ['THRESH'].strip().upper()
          mult = 1
          if raw and raw[-1] in 'KMG':
              mult = {'K': 1024, 'M': 1024**2, 'G': 1024**3}[raw[-1]]
              raw = raw[:-1]
          thresh = int(float(raw) * mult)

          sizes = {}
          out = subprocess.run(
              ['git', 'cat-file', '--batch-all-objects',
               '--batch-check=%(objectname) %(objecttype) %(objectsize)'],
              capture_output=True, text=True, check=True).stdout
          for line in out.splitlines():
              f = line.split()
              if len(f) >= 3 and f[1] == 'blob':
                  sizes[f[0]] = int(f[2])

          paths = {}
          out = subprocess.run(['git', 'rev-list', '--objects', '--all'],
                               capture_output=True, text=True, check=True).stdout
          for line in out.splitlines():
              sp = line.split(' ', 1)
              if len(sp) == 2:
                  paths.setdefault(sp[0], set()).add(sp[1])

          strip = [sha for sha, sz in sizes.items()
                   if sz > thresh and sha in paths
                   and all(p.startswith(prefix) for p in paths[sha])]

          with open('/tmp/strip_ids.txt', 'w') as fh:
              fh.write('\n'.join(sorted(strip)))
              if strip:
                  fh.write('\n')
          with open('/tmp/strip_preview.txt', 'w') as fh:
              for sha in sorted(strip, key=lambda s: -sizes[s]):
                  fh.write(f"{sizes[sha]:>12}  {sha}  {sorted(paths[sha])[0]}\n")
          print(f"{len(strip)} oversized blob(s) > {thresh} bytes under {prefix} selected to strip")
          PY
          {
            echo "### Oversized-blob strip (scoped to '${{ inputs.path_prefix }}')"
            echo "threshold: '${{ inputs.strip_blobs_bigger_than }}'  |  blobs selected: $(wc -l < /tmp/strip_ids.txt | tr -d ' ')"
            echo '```'; head -50 /tmp/strip_preview.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "DRY RUN — nothing rewritten or pushed. Re-run with dry_run=false to apply."

      - name: Rewrite history and force-push the default branch
        if: ${{ !inputs.dry_run }}
        working-directory: repo.git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          ARGS=()
          [ -s /tmp/removelist.txt ] && ARGS+=(--invert-paths --paths-from-file /tmp/removelist.txt)
          # Scoped strip: remove only the pre-selected blob IDs (all under
          # path_prefix). Never --strip-blobs-bigger-than, which is repo-wide.
          [ -s /tmp/strip_ids.txt ] && ARGS+=(--strip-blobs-with-ids /tmp/strip_ids.txt)
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Nothing to do (no before_date matches and no in-scope oversized blobs). Exiting."; exit 0
          fi
          du -sh . | sed 's/^/.git BEFORE: /'
          git filter-repo --force "${ARGS[@]}"
          du -sh . | sed 's/^/.git AFTER:  /'
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Push ONLY the default branch (what fresh clones check out). Pushing
          # --all force-pushes every rewritten branch in one oversized pack,
          # which GitHub rejects with HTTP 500.
          ok=false
          for i in 1 2 3 4; do
            if git push --force origin "refs/heads/$BR:refs/heads/$BR"; then ok=true; break; fi
            echo "push attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          $ok || { echo "Push failed after retries (repo on GitHub is unchanged)."; exit 1; }
          echo "Force-pushed rewritten **$BR**." >> "$GITHUB_STEP_SUMMARY"
