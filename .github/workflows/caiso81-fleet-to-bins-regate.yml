# One-shot: the caiso-78 blast-radius follow-up — re-gate the PJM, NYISO and
# NEISO keepers on the fixed fleet_to_bins CC heat-rate basis (base_hr
# computed pre-rescale under cc_nameplate_summer_derate; fleet.py fix,
# caiso-78 2026-07-12). Those keepers were solved on the buggy code and the
# caiso-78 log entry flagged them "must re-gate ... not silently re-solved".
#
# Three parallel matrix jobs, one ISO each (CLAUDE.md rule 12: independent
# calibration solves run in parallel as separate invocations; years within
# each invocation stay sequential). Per job: recipe-VERBATIM re-solve of the
# keeper + a fresh zero-forcing twin via scripts/probes/_fleet_to_bins_regate.py
# (replay_keeper.build_kwargs off the keeper's meta.json — the sanctioned
# recipe channel), legitimacy diagnostics, dashboard registration as PROBES,
# and a Data-API-only publish. Each job uploads to its OWN fresh branch
# (parented on main by ci_api_upload_multi's fallback, since the branch does
# not exist) so the three concurrent publishes can never clobber one
# another's ref update, and the bulk-merge automation sweeps each branch in.
# No git commit/push from any runner step (caiso80-solve-register-v2 pattern).
#
# Keeper re-gate adjudication (A/B vs the committed keepers, keeper swap if
# earned, log entry) happens in-session AFTER these land — the runs register
# as probes only.
name: caiso81-fleet-to-bins-regate

on:
  push:
    branches:
      - claude/caiso-81-calibration-gvz68q
    paths:
      - .github/workflows/caiso81-fleet-to-bins-regate.yml

permissions:
  contents: write

jobs:
  regate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - iso: PJM
            bundle: pjm105_cc_hr_regate
            label: pjm 105 cc hr regate
            branch: claude/caiso81-regate-pjm
          - iso: NYISO
            bundle: nyiso62_cc_hr_regate
            label: nyiso 62 cc hr regate
            branch: claude/caiso81-regate-nyiso
          - iso: NEISO
            bundle: neiso59_cc_hr_regate
            label: neiso 59 cc hr regate
            branch: claude/caiso81-regate-neiso
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl pytest

      - name: Tripwire — the runner code must carry the caiso-78 HR fix
        run: python -m pytest tests/test_fleet.py -q -k CcNameplateRescale

      - name: Curate clean partitions the keeper recipes read
        run: |
          set -euo pipefail
          # data/clean is derived/gitignored — a fresh checkout has none.
          # Smoke-tested set (caiso-81 session): PJM needs ramp-capability
          # (measured_ramp_capability=True in the pjm-98 recipe — without it
          # the solve silently falls back to class ramp fractions), NYISO
          # needs capacity-deliverability (nyiso_li_lcr_tsl fail-louds).
          PYTHONPATH="$PWD" python scripts/curate_ramp_capability.py
          PYTHONPATH="$PWD" python scripts/curate_capacity_deliverability.py --isos NYISO PJM ISONE

      - name: Solve re-gate main (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_fleet_to_bins_regate.py ${{ matrix.iso }} main

      - name: Solve zero-forcing twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_fleet_to_bins_regate.py ${{ matrix.iso }} ablation

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # exits 1 when a gate fails; the artifact is written before the
          # exit, so tolerate the code and only fail on a missing artifact
          # (caiso67..80-solve-register precedent).
          for b in ${{ matrix.bundle }} ${{ matrix.bundle }}-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso ${{ matrix.iso }} --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "${{ matrix.label }}" \
            --bundle results/calibration/${{ matrix.bundle }} | tee /tmp/rm.out
          python scripts/dashboard_add_run.py \
            --label "${{ matrix.label }} ablation" \
            --bundle results/calibration/${{ matrix.bundle }}-ablation | tee /tmp/ra.out
          echo "RIDM=$(grep '^RUN_ID=' /tmp/rm.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RIDA=$(grep '^RUN_ID=' /tmp/ra.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RIDM" --bundle results/calibration/${{ matrix.bundle }} \
            --rid "$RIDA" --bundle results/calibration/${{ matrix.bundle }}-ablation \
            --branch ${{ matrix.branch }} \
            --bench-iso ${{ matrix.iso }} \
            --extra scripts/probes/_fleet_to_bins_regate.py \
            --message "results: register ${{ matrix.iso }} fleet_to_bins CC-HR re-gate PROBE + zero-forcing twin (caiso-78 blast radius) [skip ci]"
