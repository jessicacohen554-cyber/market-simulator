name: Calibration run

# Launch one calibration backcast (chosen ISO + year(s)) with per-class
# offer-curve heat-rate multiplier overrides, persist the bundle, register it
# on the dashboard and publish it to main. The shared dashboard files
# (manifest/benchmark/html) are NOT committed by anyone — the "Deploy site to
# GitHub Pages" workflow (chained off this one's completion) assembles them
# from the committed registry sidecars + bench parts and takes the site live.
#
# Job graph (data flows via artifacts, never re-computation):
#   solve     -> set up deps, validate inputs, solve, write bundle, UPLOAD it.
#   dashboard -> DOWNLOAD bundle, render this run's own runs/<id>.js + registry
#                sidecar + bench/<ISO>/<year> parts, commit them to
#                auto/<run_name>-<sha>, publish to main.
#   deploy    -> handled downstream by Deploy site to GitHub Pages.
# Re-running only `dashboard` never re-solves (it consumes the solve artifact).

on:
  workflow_dispatch:
    inputs:
      iso:
        description: "ISO to backcast"
        type: choice
        default: ERCOT
        options: [ERCOT, CAISO, PJM, MISO, NYISO, NEISO]
      year:
        description: "Year(s): one of 2023/2024/2025, or a comma/space list e.g. '2023,2024'"
        type: string
        default: "2024"
      run_name:
        description: "Run name — used as BOTH the dashboard label and the bundle dir. Spaces/odd chars are auto-converted to dashes (e.g. 'run44 - ramp fix' -> 'run44-ramp-fix')."
        type: string
        required: true
      offer_curve_tweaks:
        description: "HR multiplier nudges, up to ~10 'CLASS.BAND <delta>' entries (comma/newline sep). Delta is RELATIVE to the current config: +0.05 / -0.05. E.g. CT_PEAKER.committed +0.05, COAL_PRB.committed -0.05, ST_GAS.peak +0.5"
        type: string
        default: ""
      prb_sigmoid:
        description: "Gas-keyed PRB passthrough sigmoid (off = flat passthrough)"
        type: boolean
        default: false
      storage_daily_cycling:
        description: "Cap storage to within-day arbitrage (recommended)"
        type: boolean
        default: true
      extra_flags:
        description: "Extra run_calibration_full.py flags appended verbatim, e.g. '--gas-monthly-actuals --priced-interchange --coal-bit-sigmoid' (the PJM keeper trio + bit sigmoid)"
        type: string
        default: ""
      note:
        description: "Optional free-text note (becomes the run's dashboard definition)"
        type: string
        default: ""
      publish:
        description: "Publish to main now (off = leave on auto/* branch for Bulk-merge)"
        type: boolean
        default: true

# Per-run concurrency: different run names run fully in parallel; two dispatches
# with the SAME run name serialize (queue, never cancel) so they can't clobber
# each other's bundle dir. NOT a global group — concurrent distinct runs must
# not cancel one another.
concurrency:
  group: calib-${{ github.event.inputs.run_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    outputs:
      # Sanitized run_name, reused as the dashboard label, bundle dir and
      # branch component by every downstream step in BOTH jobs.
      run_name: ${{ steps.validate.outputs.run_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate inputs
        id: validate
        env:
          RUN_NAME: ${{ inputs.run_name }}
          YEAR: ${{ inputs.year }}
          ISO: ${{ inputs.iso }}
        run: |
          set -euo pipefail
          # run_name doubles as a filesystem dir and a git branch component, so
          # it must match [A-Za-z0-9._-]+. Auto-sanitize instead of failing:
          # collapse any run of disallowed characters (spaces, etc.) into a
          # single dash and trim leading/trailing dashes. Only error if nothing
          # usable remains.
          CLEAN=$(printf '%s' "$RUN_NAME" \
                    | sed -E 's/[^A-Za-z0-9._]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$CLEAN" ]; then
            echo "::error::run_name '$RUN_NAME' has no usable [A-Za-z0-9._-] characters."
            exit 1
          fi
          if [ "$CLEAN" != "$RUN_NAME" ]; then
            echo "::notice::run_name sanitized: '$RUN_NAME' -> '$CLEAN'"
          fi
          echo "run_name=$CLEAN" >> "$GITHUB_OUTPUT"
          # Normalize the year list (commas -> spaces) and bound each value.
          YEARS="${YEAR//,/ }"
          for y in $YEARS; do
            case "$y" in
              2023|2024|2025) ;;
              *) echo "::error::year '$y' is not one of 2023/2024/2025."; exit 1 ;;
            esac
          done
          echo "YEARS=$YEARS" >> "$GITHUB_ENV"
          echo "Validated: iso=$ISO years='$YEARS' run_name='$CLEAN'"

      - name: Cache binned-fleet parquet
        # The per-ISO binned-fleet cache (inputs/processed/<iso>_fleet_binned.parquet)
        # is a deterministic side output of the EIA-860 source, so key it on that
        # source file — repeat runs reuse it instead of rebuilding the fleet.
        uses: actions/cache@v4
        with:
          path: inputs/processed/*_fleet_binned.parquet
          key: fleet-${{ hashFiles('inputs/raw-data/eia-860/eia860_generators.parquet') }}
          restore-keys: |
            fleet-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate clean datatypes from raw
        # data/clean is derived + gitignored (the clean_io seam), so a fresh
        # runner must rebuild it from the committed raw tree before any
        # loader can read_clean (e.g. capacity-deliverability for the NYISO
        # LI TSL cap, measured neighbor LMPs, outages, fleet).
        # Targeted: a read_clean trace of a full NYISO replay (solve + report
        # + benchmark build) shows exactly two clean datatypes are read —
        # capacity-deliverability and zonal-shares — and zonal-shares has a
        # keeper-validated raw fallback (nyiso-56). The full 33-datatype regen
        # OOM-killed standard runners (the CAMPD-hourly emissions curation).
        run: python scripts/regenerate_clean.py capacity-deliverability

      - name: Build offer-curve deltas from tweaks
        # Turn the friendly "CLASS.BAND <delta>" entries into the delta JSON the
        # solver consumes (no hand-written JSON), validating class/band names and
        # failing fast on a typo. Logs each nudge as default -> result.
        env:
          ISO: ${{ inputs.iso }}
          TWEAKS: ${{ inputs.offer_curve_tweaks }}
        run: |
          set -euo pipefail
          DELTAS=$(python scripts/build_offer_curve_overrides.py \
                     --iso "$ISO" --tweaks "$TWEAKS")
          echo "delta json: $DELTAS"
          echo "OFFER_CURVE_DELTAS=$DELTAS" >> "$GITHUB_ENV"

      - name: Solve calibration bundle
        env:
          ISO: ${{ inputs.iso }}
          RUN_NAME: ${{ steps.validate.outputs.run_name }}
          NOTE: ${{ inputs.note }}
          PRB_SIGMOID: ${{ inputs.prb_sigmoid }}
          STORAGE_DAILY: ${{ inputs.storage_daily_cycling }}
          EXTRA_FLAGS: ${{ inputs.extra_flags }}
        run: |
          set -euo pipefail
          ARGS=( --iso "$ISO" --year $YEARS \
                 --out-dir "results/calibration/$RUN_NAME" \
                 --note "$NOTE" --offer-curve-delta-json "$OFFER_CURVE_DELTAS" )
          # CLI default for the PRB sigmoid is ON; the dispatch input defaults
          # it OFF, so disable it unless the operator asked for it.
          if [ "$PRB_SIGMOID" != "true" ]; then
            ARGS+=( --no-prb-passthrough-sigmoid )
          fi
          if [ "$STORAGE_DAILY" = "true" ]; then
            ARGS+=( --storage-daily-cycling )
          fi
          # Operator-supplied passthrough flags (e.g. the PJM keeper trio:
          # --gas-monthly-actuals --priced-interchange, plus --coal-bit-sigmoid).
          # Word-split deliberately; flags only, validated by the CLI parser.
          if [ -n "$EXTRA_FLAGS" ]; then
            # shellcheck disable=SC2206
            ARGS+=( $EXTRA_FLAGS )
          fi
          echo "run_calibration_full.py ${ARGS[*]}"
          python scripts/run_calibration_full.py "${ARGS[@]}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ steps.validate.outputs.run_name }}
          # Include the content-hashed shared benchmark parquets the bundle's
          # meta.json shared_inputs point at (results/calibration/_shared/…,
          # gitignored) — the dashboard job's render needs them. With two
          # paths the artifact root is their common ancestor, so it holds
          # <run_name>/ and _shared/.
          path: |
            results/calibration/${{ steps.validate.outputs.run_name }}
            results/calibration/_shared
          retention-days: 7
          if-no-files-found: error

  dashboard:
    needs: solve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for publish)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate clean datatypes from raw
        # Same as the solve job: the render/verdict path reads through the
        # clean_io seam on a fresh runner.
        # Targeted: a read_clean trace of a full NYISO replay (solve + report
        # + benchmark build) shows exactly two clean datatypes are read —
        # capacity-deliverability and zonal-shares — and zonal-shares has a
        # keeper-validated raw fallback (nyiso-56). The full 33-datatype regen
        # OOM-killed standard runners (the CAMPD-hourly emissions curation).
        run: python scripts/regenerate_clean.py capacity-deliverability

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ needs.solve.outputs.run_name }}
          # Artifact root is results/calibration (see upload): restores
          # <run_name>/ and the shared benchmark parquets under _shared/.
          path: results/calibration

      - name: Commit to auto/* branch and publish
        env:
          RUN_NAME: ${{ needs.solve.outputs.run_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="auto/${RUN_NAME}-${SHORT_SHA}"

          # Base the run's branch on the freshest main so publishing is a clean
          # fast-forward/rebase (each run only adds disjoint files). -f discards
          # any tracked-file edits in the working tree while preserving the
          # untracked downloaded bundle.
          git fetch origin main
          git checkout -fB "$BRANCH" origin/main

          # Render this run onto the fresh base: writes its own runs/<id>.js,
          # registry sidecar and bench/<ISO>/<year> parts (the shared
          # manifest/benchmark/html are gitignored — assembled at deploy time).
          # RUN_ID is captured for staging.
          RUN_ID=$(python scripts/dashboard_add_run.py \
                     --label "$RUN_NAME" \
                     --bundle "results/calibration/$RUN_NAME" \
                   | sed -n 's/^RUN_ID=//p')
          test -n "$RUN_ID"
          echo "run id = $RUN_ID"

          # Stage this run's own files plus any bench parts it changed. Parts
          # are byte-deterministic, so an unchanged benchmark stages nothing
          # and concurrent runs that agree on it merge cleanly.
          git add "results/calibration/${RUN_NAME}" \
                  "frontend/data/backcast/registry/${RUN_ID}.json" \
                  "frontend/data/backcast/runs/${RUN_ID}.js" \
                  frontend/data/backcast/bench

          git commit -m "calibration: ${RUN_NAME} (${RUN_ID})"

          push_with_retry() {  # $1=refspec
            local n=0 delay=2
            until git push -u origin "$1"; do
              n=$((n+1)); [ $n -ge 4 ] && return 1
              echo "push failed; retry $n in ${delay}s"; sleep $delay; delay=$((delay*2))
            done
          }

          # Always push the auto/* branch — the durable record of the run.
          push_with_retry "$BRANCH" || { echo "::error::could not push $BRANCH"; exit 1; }

          if [ "$PUBLISH" != "true" ]; then
            echo "publish=false — left on $BRANCH; use Bulk-merge auto runs to land it."
            exit 0
          fi

          # Publish: push our single commit onto main. Concurrent runs add
          # disjoint files, so on rejection we rebase onto the new main and retry
          # (the loop serializes the contended ref update without losing runs).
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:main"; then
              echo "published to main."
              exit 0
            fi
            echo "main moved; rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not publish to main after retries; run remains on $BRANCH (use Bulk-merge)."
          exit 1
