# Pull aged-out CAISO OASIS LMP from the Historical bulk archive (a Requester-
# Pays S3 bucket) on a GitHub runner, keep only the three trading hubs, fold them
# into the hourly aggregates, and commit — no manual upload, no per-hour clicking.
#
# The live OASIS API (scripts/fetch_caiso_oasis.py) only retains ~39 months, so
# early-2023 is gone from it; this reads the bulk archive instead. Requester-Pays
# means download costs hit YOUR AWS account (pennies for the 3 hubs).
#
# RUN MANY INSTANCES AT ONCE. Each run downloads its own window into a private
# staging dir (RUNNER_TEMP) and only touches the shared aggregates at push time,
# where it hard-resets to the freshest `main`, drops its window CSVs in, and
# re-folds. The fold (postprocess_oasis_downloads.py) is idempotent + dedup +
# sorted, so every commit is built ON TOP OF the latest aggregates and a push
# race just re-folds onto the newer tip — never the textual rebase conflict that
# killed the old commit-then-rebase loop. So there is deliberately NO
# `concurrency:` guard: fire one run per gap window in parallel and each lands.
#
# The staged window CSVs are also uploaded as a build artifact, so a run that
# somehow exhausts its push retries loses nothing — re-commit from the artifact
# instead of re-downloading (and re-paying) from S3.
#
# SECRETS REQUIRED (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (a read-only IAM user)
#   AWS_REGION  (optional; defaults to us-west-2)
#
# Run the default small date range FIRST to validate access + see the bucket
# layout in the "Verify AWS access" step, then widen start/end for the full gap.
name: Fetch CAISO OASIS bulk LMP

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        default: "2023-01-06"
        type: string
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        default: "2023-01-10"
        type: string
      markets:
        description: "Markets (space-separated: DAM RTM)"
        default: "DAM RTM"
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
      BUCKET: s3://caiso-oasis-s3-prod-groupzips
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Verify AWS access + show bucket layout
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          echo "--- top-level of $BUCKET ---"
          aws s3 ls "$BUCKET/" --request-payer requester | head -50

      - name: Download group-zips + extract the 3 hubs (per day, low disk)
        run: |
          set -euo pipefail
          # This run's private staging dir for its extracted window CSVs. Under
          # RUNNER_TEMP so it survives the `git reset --hard` in the push step
          # and never collides with a sibling run. NB: $RUNNER_TEMP is the
          # runtime env var; the `runner.temp` context is NOT allowed in a
          # job-level env: block, so STAGE is computed here in each step.
          STAGE="$RUNNER_TEMP/oasis-hubs"
          # Extract into STAGE, NOT the repo working tree — the working tree is
          # only touched at push time (below).
          mkdir -p "$STAGE"
          TMP="$(mktemp -d)"
          d="${{ github.event.inputs.start }}"
          end="$(date -d '${{ github.event.inputs.end }}' +%Y%m%d)"
          while [ "$(date -d "$d" +%Y%m%d)" -le "$end" ]; do
            DAY="$(date -d "$d" +%Y%m%d)"
            rm -rf "${TMP:?}/"*
            for MKT in ${{ github.event.inputs.markets }}; do
              # Include-filter matches the key regardless of any prefix nesting;
              # HASP / Fifteen-Minute zips never match *_DAM_LMP_ / *_RTM_LMP_.
              aws s3 sync "$BUCKET/" "$TMP/" --request-payer requester --no-progress \
                --exclude "*" --include "*${DAY}_${DAY}_${MKT}_LMP_GRP_*.zip" || true
            done
            n="$(find "$TMP" -name '*.zip' | wc -l)"
            echo "$DAY: $n zip(s)"
            if [ "$n" -gt 0 ]; then
              python scripts/extract_caiso_hubs.py --zip-dir "$TMP" --out-dir "$STAGE"
            fi
            d="$(date -d "$d + 1 day" +%Y-%m-%d)"
          done
          echo "--- staged window CSVs ---"
          ls -la "$STAGE" || true

      - name: Upload staged raws (survives a failed push; no S3 re-download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-hubs-${{ github.run_id }}
          path: ${{ runner.temp }}/oasis-hubs
          if-no-files-found: ignore
          retention-days: 7

      - name: Fold into the FRESHEST main, then commit + push (parallel-safe)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/oasis-hubs"
          BRANCH="${{ github.ref_name }}"
          shopt -s nullglob
          staged=("$STAGE"/*.csv)
          if [ "${#staged[@]}" -eq 0 ]; then
            echo "no window CSVs extracted; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Conflict-free concurrent append. On EVERY attempt: hard-reset to the
          # freshest remote tip, drop THIS run's window CSVs into the working
          # tree, and re-fold. Because the fold is idempotent + dedup + sorted,
          # the commit is always built on top of the latest aggregates; a push
          # race just loops and re-folds onto an even-newer tip. No rebase, so no
          # textual merge conflict is ever possible.
          for i in $(seq 1 12); do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            # Clear any untracked leftovers from a prior attempt; tracked
            # aggregates were just restored by the reset above.
            git clean -fdq data/raw/lmp-data/CAISO/
            cp "$STAGE"/*.csv data/raw/lmp-data/CAISO/
            # Folds the window CSVs into the fresh aggregates and moves the
            # window files out of the working tree (into a throwaway stage dir),
            # so only the two aggregates are ever staged.
            python scripts/postprocess_oasis_downloads.py --stage-dir "$(mktemp -d)"
            git add data/raw/lmp-data/CAISO/CAISO_dam_hourly_*.csv \
                    data/raw/lmp-data/CAISO/CAISO_rtm_hourly_*.csv
            if git diff --cached --quiet; then
              echo "aggregates already contain this window; nothing to commit"
              exit 0
            fi
            git commit -m "data(caiso): OASIS bulk hub LMP ${{ github.event.inputs.start }}..${{ github.event.inputs.end }} (run ${{ github.run_id }})"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push raced on attempt $i; re-folding onto newer $BRANCH"
            sleep $(( (RANDOM % 5) + i ))
          done
          echo "push failed after retries" >&2
          exit 1
