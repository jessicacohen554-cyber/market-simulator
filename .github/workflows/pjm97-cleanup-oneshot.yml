name: pjm97-cleanup-oneshot

# One-shot post-merge housekeeping. The pjm-96/pjm-97 calibration + keeper
# sessions left a pile of one-shot register/apply/reconcile workflows and their
# .github/patches payloads on main; per the one-shot convention these are
# deleted once their results have merged (pjm-97 keeper landed via PR #1986).
# The session env cannot git push, so this job git-rm's the stale files in a
# single commit and pushes it to this cleanup branch for a review PR. It also
# removes ITSELF, so the resulting PR is a pure set of deletions with nothing
# left to clean up afterward.

on:
  push:
    branches:
      - claude/pjm97-cleanup-oneshot-dk5a6s
    paths:
      - .github/workflows/pjm97-cleanup-oneshot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pjm97-cleanup-oneshot
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git-rm the stale pjm96/97 one-shot workflows + patches (and self)
        run: |
          set -euo pipefail
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git checkout -B "${GITHUB_REF_NAME}" origin/main
          git rm -f \
            .github/workflows/register-pjm96.yml \
            .github/workflows/register-pjm96-v2.yml \
            .github/workflows/register-pjm97.yml \
            .github/workflows/apply-pjm97-wiring.yml \
            .github/workflows/reconcile-pjm97-merge.yml \
            .github/patches/2026_07_10_pjm96_code.patch \
            .github/patches/2026_07_10_pjm96_registry_edits.py \
            .github/patches/2026_07_10_pjm97_wiring.patch.gz.b64 \
            .github/patches/pjm96_callog_entry.md \
            .github/patches/pjm96_commit1_msg.txt \
            .github/patches/pjm96_commit2_msg.txt \
            .github/patches/pjm96_intake_msg.txt \
            .github/patches/pjm97_callog_entry.md \
            .github/patches/pjm97_commit_msg.txt \
            .github/patches/pjm97_definition.txt
          # Remove this one-shot itself so the PR is a pure set of deletions.
          git rm -f .github/workflows/pjm97-cleanup-oneshot.yml
          git commit -m "chore(ci): remove stale pjm96/97 one-shot workflows + patches [skip ci]"
          git push --force origin "HEAD:${GITHUB_REF_NAME}"
