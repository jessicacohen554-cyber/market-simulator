# One-shot: finish the ERCOT trough/spread FRONTIER declaration on the runner.
# keepers.json was pushed via the API (owner GO 2026-07-14) but (a) with
# literal-unicode escaping that deviates from the repo's \u-escaped convention
# and (b) without its derived status.js (a 222 KB single-line generated file
# that is committed, not deploy-generated — it needs the committed registry
# sidecars the Pages deploy does not check out). This job normalizes
# keepers.json to the canonical escaping and regenerates status.js, then
# commits both. Self-deletes nothing; safe to re-run (idempotent).
name: ercot65-frontier-status

on:
  push:
    branches:
      - claude/ercot-negative-price-epoch-368q8q
    paths:
      - .github/workflows/ercot65-frontier-status.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot65-frontier-status
  cancel-in-progress: false

jobs:
  frontier-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ercot-negative-price-epoch-368q8q
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize keepers.json escaping (match repo \u convention)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, collections
          p = "frontend/data/backcast/keepers.json"
          k = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          assert k["frontier"]["ERCOT"]["declared"] == "2026-07-14", "ERCOT frontier missing"
          with open(p, "w") as f:
              json.dump(k, f, indent=1)   # default ensure_ascii=True → \u escapes
              f.write("\n")
          PY

      - name: Regenerate status.js from the committed registry sidecars
        run: |
          set -euo pipefail
          python scripts/build_status.py
          grep -q "Frontier achieved for the trough/spread" frontend/data/backcast/status.js
          # sanity: keepers.json still valid and ERCOT frontier present
          python -c "import json; d=json.load(open('frontend/data/backcast/keepers.json')); assert d['frontier']['ERCOT']['declared']=='2026-07-14'"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/backcast/keepers.json frontend/data/backcast/status.js
          if git diff --cached --quiet; then
            echo "nothing to commit — already normalized"
            exit 0
          fi
          git commit -m "ERCOT frontier: normalize keepers.json escaping + regenerate status.js (owner GO 2026-07-14) [skip ci]"
          git push origin HEAD:claude/ercot-negative-price-epoch-368q8q
