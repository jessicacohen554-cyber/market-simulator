name: Cleanup Large File Blobs from History (Protected)

# Removes old/deleted/overwritten blobs from git history — but PROTECTS
# every file currently live in HEAD of ANY branch or tag.
#
# Scope: EVERYTHING under data/raw/ and results/calibration/, recursively,
# regardless of file extension. Nothing outside those two trees is touched.
#
# Runs against a --mirror (bare) clone. There is NO working tree at any point:
# actions/checkout would materialize thousands of parquet files and exhaust the
# runner disk ("unable to write file"). Every operation here — ls-tree,
# rev-list, cat-file, filter-repo, push — reads the object database directly.
#
# How it works:
#   1. Reclaim runner disk space, then mirror-clone (all refs, no checkout)
#   2. Snapshot all blob SHAs live in ANY branch HEAD or tag (the "protected set")
#   3. Record per-branch file manifests (mode+sha+path) for integrity verification
#   4. Walk all history to find blobs under data/raw/ or results/calibration/
#   5. Only blobs NOT in the protected set are candidates for removal
#   6. Strip dead blobs via git-filter-repo --strip-blobs-with-ids
#   7. Repack + gc to actually reclaim pack space
#   8. Verify EVERY branch's file manifest is byte-identical before and after
#   9. Force push all branches and tags
#
# Safety guarantees:
#   - Protected set includes ALL blobs reachable from ANY branch tip or tag
#   - Disjointness assertion: removable ∩ protected == ∅ (enforced, aborts if violated)
#   - Per-branch manifest comparison (not just main) catches any unexpected changes
#   - Dry run (default) shows full breakdown before any destructive action
#   - Confirmation string required for non-dry-run execution
#
# WARNING: This rewrites history. All collaborators must re-clone afterward.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REWRITE-HISTORY to confirm (irreversible)'
        required: true
        type: string
      dry_run:
        description: 'Dry run only — show what would be removed vs. protected'
        required: false
        type: boolean
        default: true

env:
  # The only two trees in scope. Extended-regex alternation, no trailing slash.
  SCOPE_REGEX: '(data/raw|results/calibration)/'
  # Default branch, used for summary output and the post-cleanup file count.
  DEFAULT_BRANCH: main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        # Every step below runs inside the bare mirror clone unless it says otherwise.
        working-directory: repo.git
    steps:
      - name: Validate confirmation
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.dry_run == false && inputs.confirm != 'REWRITE-HISTORY' }}
        run: |
          echo "::error::You must type 'REWRITE-HISTORY' to confirm. Aborting."
          exit 1

      - name: Free runner disk space
        working-directory: /
        run: |
          echo "=== Disk BEFORE reclaim ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/graalvm 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Disk AFTER reclaim ==="
          df -h /

      - name: Mirror-clone repository (no working tree)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # --mirror maps refs/* to refs/*, so every remote branch lands directly
          # in refs/heads/* and every tag in refs/tags/*. This replaces the old
          # "create local tracking branch for each remote branch" loop entirely.
          git clone --mirror \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            repo.git

          cd repo.git
          branch_count=$(git for-each-ref --format='%(refname:short)' refs/heads/ | wc -l)
          tag_count=$(git for-each-ref --format='%(refname)' refs/tags/ | wc -l)
          echo "Branches: $branch_count"
          echo "Tags:     $tag_count"

          if ! git show-ref --verify --quiet "refs/heads/${DEFAULT_BRANCH}"; then
            echo "::error::Branch '${DEFAULT_BRANCH}' not found in mirror. Aborting."
            git for-each-ref --format='  %(refname:short)' refs/heads/
            exit 1
          fi
          echo "${DEFAULT_BRANCH} HEAD: $(git log -1 --oneline "refs/heads/${DEFAULT_BRANCH}")"

          echo "Object store size:"
          du -sh objects
          df -h /

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Repo size before
        run: |
          echo "=== Repo size BEFORE ==="
          git count-objects -vH

      - name: Build protected blob set and record branch manifests
        id: protect
        run: |
          set -euo pipefail

          MANIFEST_DIR=$(mktemp -d)
          PROTECTED_BLOBS=$(mktemp)
          BRANCH_HASHES=$(mktemp)

          echo "=== Recording per-branch manifests ==="

          branch_count=0
          for branch in $(git for-each-ref --format='%(refname:short)' refs/heads/); do
            # Sanitize branch name for filename (replace / with __)
            safe_name="${branch//\//__}"
            manifest="$MANIFEST_DIR/${safe_name}.manifest"

            git ls-tree -r "refs/heads/$branch" | sort > "$manifest"
            git ls-tree -r "refs/heads/$branch" | awk '{print $3}' >> "$PROTECTED_BLOBS"

            file_count=$(wc -l < "$manifest")
            hash=$(sha256sum "$manifest" | awk '{print $1}')
            # Store: branch_name  manifest_hash  file_count  safe_name
            echo "$branch $hash $file_count $safe_name" >> "$BRANCH_HASHES"
            echo "  $branch: $file_count files (hash: ${hash:0:16}...)"
            branch_count=$((branch_count + 1))
          done

          # Protect blobs from all tags too
          tag_count=0
          for tag in $(git for-each-ref --format='%(refname)' refs/tags/); do
            git ls-tree -r "$tag" 2>/dev/null | awk '{print $3}' >> "$PROTECTED_BLOBS" || true
            tag_count=$((tag_count + 1))
          done

          # Deduplicate
          sort -u -o "$PROTECTED_BLOBS" "$PROTECTED_BLOBS"
          protected_count=$(wc -l < "$PROTECTED_BLOBS")

          echo ""
          echo "Protected: $protected_count unique blob SHAs from $branch_count branches + $tag_count tags"

          # Default-branch values for summary
          default_manifest="$MANIFEST_DIR/${DEFAULT_BRANCH//\//__}.manifest"
          head_file_count=$(wc -l < "$default_manifest")
          head_manifest_hash=$(sha256sum "$default_manifest" | awk '{print $1}')

          echo "manifest_dir=$MANIFEST_DIR" >> "$GITHUB_OUTPUT"
          echo "protected_blobs=$PROTECTED_BLOBS" >> "$GITHUB_OUTPUT"
          echo "branch_hashes=$BRANCH_HASHES" >> "$GITHUB_OUTPUT"
          echo "head_manifest_hash=$head_manifest_hash" >> "$GITHUB_OUTPUT"
          echo "head_file_count=$head_file_count" >> "$GITHUB_OUTPUT"

          # Live file counts for the two in-scope trees (recursive)
          echo ""
          echo "--- Live files in scope (${DEFAULT_BRANCH}) ---"
          for dir in data/raw results/calibration; do
            count=$(git ls-tree -r "refs/heads/${DEFAULT_BRANCH}" -- "$dir" 2>/dev/null | wc -l)
            echo "  ${dir}/  →  ${count} live files"
          done

      - name: Enumerate and classify historical blobs
        id: enumerate
        run: |
          set -euo pipefail
          PROTECTED_BLOBS="${{ steps.protect.outputs.protected_blobs }}"

          echo "=== Scanning all historical blobs ==="

          ALL_BLOBS=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$ALL_BLOBS"
          echo "Total blobs in history: $(wc -l < "$ALL_BLOBS")"

          # Target scope: EVERY path under data/raw/ or results/calibration/,
          # at any depth, any extension. The prefix match is inherently recursive.
          TARGET_BLOBS=$(mktemp)
          grep -E " ${SCOPE_REGEX}" "$ALL_BLOBS" > "$TARGET_BLOBS" || true
          sort -u -o "$TARGET_BLOBS" "$TARGET_BLOBS"
          echo "Target blobs (data/raw/ + results/calibration/, recursive): $(wc -l < "$TARGET_BLOBS")"

          if [ ! -s "$TARGET_BLOBS" ]; then
            echo "::warning::No blobs matched the scope. Check that data/raw/ and results/calibration/ exist."
          fi

          # Classify using comm (O(n log n) sort + O(n) merge)
          TARGET_SHAS=$(mktemp)
          awk '{print $1}' "$TARGET_BLOBS" | sort -u > "$TARGET_SHAS"

          REMOVABLE_SHAS=$(mktemp)
          comm -23 "$TARGET_SHAS" "$PROTECTED_BLOBS" > "$REMOVABLE_SHAS"

          KEPT_SHAS=$(mktemp)
          comm -12 "$TARGET_SHAS" "$PROTECTED_BLOBS" > "$KEPT_SHAS"

          # Safety assertion: removable and protected must be completely disjoint
          overlap=$(comm -12 "$REMOVABLE_SHAS" "$KEPT_SHAS" | wc -l)
          if [ "$overlap" -gt 0 ]; then
            echo "::error::FATAL: $overlap blob SHAs in both removable AND protected sets!"
            echo "This should be impossible (comm -23 guarantees disjointness)."
            echo "Something is wrong with the classification logic. Aborting."
            comm -12 "$REMOVABLE_SHAS" "$KEPT_SHAS" | head -10
            exit 1
          fi
          echo "Disjointness check: PASSED (removable ∩ protected = ∅)"

          # Build full removable/kept lists with sizes and paths
          REMOVABLE=$(mktemp)
          KEPT=$(mktemp)
          touch "$REMOVABLE" "$KEPT"

          awk -v removable_file="$REMOVABLE" -v kept_file="$KEPT" '
            FILENAME == ARGV[1] { removable[$1]=1; next }
            FILENAME == ARGV[2] { kept[$1]=1; next }
            { if($1 in removable) print >> removable_file; else if($1 in kept) print >> kept_file }
          ' "$REMOVABLE_SHAS" "$KEPT_SHAS" "$TARGET_BLOBS"

          removable_count=$(wc -l < "$REMOVABLE")
          kept_count=$(wc -l < "$KEPT")
          removable_bytes=$(awk '{s+=$2} END{print s+0}' "$REMOVABLE")
          kept_bytes=$(awk '{s+=$2} END{print s+0}' "$KEPT")

          echo ""
          echo "========================================"
          echo "  PROTECTED (live in any ref): $kept_count blob entries ($(awk -v b="$kept_bytes" 'BEGIN{printf "%.1f MB", b/1048576}'))"
          echo "  REMOVABLE (dead/old):        $removable_count blob entries ($(awk -v b="$removable_bytes" 'BEGIN{printf "%.1f MB", b/1048576}'))"
          echo "========================================"

          echo "removable=$REMOVABLE" >> "$GITHUB_OUTPUT"
          echo "kept=$KEPT" >> "$GITHUB_OUTPUT"
          echo "removable_count=$removable_count" >> "$GITHUB_OUTPUT"
          echo "removable_shas=$REMOVABLE_SHAS" >> "$GITHUB_OUTPUT"

      - name: "Dry run: show protected vs. removable breakdown"
        if: ${{ inputs.dry_run == true }}
        run: |
          REMOVABLE="${{ steps.enumerate.outputs.removable }}"
          KEPT="${{ steps.enumerate.outputs.kept }}"

          # Breakdowns are derived from the actual paths found — no hard-coded
          # subdirectory or extension lists, so new subdirs show up automatically.
          summarize_by_dir() {
            awk '{
              path=$3; sub(/\/[^\/]*$/, "", path)
              c[path]++; s[path]+=$2
            } END {
              for (d in c) printf "%12.1f MB  %6d blobs  %s/\n", s[d]/1048576, c[d], d
            }' "$1" | sort -rn
          }

          summarize_by_ext() {
            awk '{
              n=split($3, p, "/"); f=p[n]; ext=f
              sub(/.*\./, "", ext)
              if (ext == f) ext="(no extension)"
              c[ext]++; s[ext]+=$2
            } END {
              for (e in c) printf "%12.1f MB  %6d blobs  *.%s\n", s[e]/1048576, c[e], e
            }' "$1" | sort -rn
          }

          echo "============================================================"
          echo "  PROTECTED — will NOT be touched (live in any branch/tag)"
          echo "============================================================"
          if [ -s "$KEPT" ]; then
            echo ""
            echo "--- Protected by extension ---"
            summarize_by_ext "$KEPT"
            echo ""
            echo "--- Protected by directory (every depth) ---"
            summarize_by_dir "$KEPT"
            echo ""
            echo "--- All protected in-scope files ---"
            sort -k3 "$KEPT" | awk '{printf "  %-12s %s\n", sprintf("%.1f MB", $2/1048576), $3}'
          else
            echo "  (none — no in-scope blobs are live in any ref)"
          fi

          echo ""
          echo "============================================================"
          echo "  REMOVABLE — dead/overwritten, will be stripped"
          echo "============================================================"
          if [ -s "$REMOVABLE" ]; then
            echo ""
            echo "--- Removable by extension ---"
            summarize_by_ext "$REMOVABLE"
            echo ""
            echo "--- Removable by directory (every depth) ---"
            summarize_by_dir "$REMOVABLE"
            echo ""
            echo "--- Top 30 largest removable blobs ---"
            sort -rnk2 "$REMOVABLE" | head -30 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          else
            echo "  (none — all in-scope blobs are live, nothing to remove)"
          fi

          echo ""
          echo "Re-run with dry_run=false and confirm=REWRITE-HISTORY to execute."

      - name: Check if cleanup needed
        if: ${{ inputs.dry_run == false }}
        id: check
        run: |
          removable_count="${{ steps.enumerate.outputs.removable_count }}"

          if [ "$removable_count" = "0" ] || [ -z "$removable_count" ]; then
            echo "No removable blobs found. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Will strip $removable_count unique dead blob SHAs."

      - name: Strip dead blobs with git-filter-repo
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          REMOVABLE_SHAS="${{ steps.enumerate.outputs.removable_shas }}"
          count=$(wc -l < "$REMOVABLE_SHAS")
          echo "Stripping $count dead blobs from data/raw/ and results/calibration/..."
          echo "(All live blobs across all branches and tags are protected and untouched)"
          # --force is required because this is a mirror clone rather than a
          # fresh non-bare clone. No working tree means no checkout to reset.
          git filter-repo --strip-blobs-with-ids "$REMOVABLE_SHAS" --force
          df -h /

      - name: Repack and garbage collect
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          echo "=== Repacking to reclaim space ==="
          git reflog expire --expire=now --all || true
          # Plain gc, not --aggressive: aggressive repack briefly holds both the
          # old and new packs, which is what put this runner over the edge before.
          git gc --prune=now
          echo "Repack complete."
          df -h /

      - name: Verify ALL branch integrity
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          MANIFEST_DIR="${{ steps.protect.outputs.manifest_dir }}"
          BRANCH_HASHES="${{ steps.protect.outputs.branch_hashes }}"

          echo "=== Verifying ALL branch file manifests ==="

          failures=0
          verified=0
          while IFS=' ' read -r branch expected_hash expected_count safe_name; do
            ref="refs/heads/$branch"

            # Check branch still exists after filter-repo
            if ! git show-ref --verify --quiet "$ref"; then
              echo "  FAIL  $branch — branch missing after filter-repo!"
              failures=$((failures + 1))
              continue
            fi

            # Build post-cleanup manifest and compare
            post_manifest=$(mktemp)
            git ls-tree -r "$ref" | sort > "$post_manifest"
            actual_hash=$(sha256sum "$post_manifest" | awk '{print $1}')
            actual_count=$(wc -l < "$post_manifest")

            if [ "$expected_hash" = "$actual_hash" ]; then
              echo "  PASS  $branch ($actual_count files)"
              verified=$((verified + 1))
            else
              echo "  FAIL  $branch"
              echo "        Expected: $expected_count files, hash=${expected_hash:0:16}..."
              echo "        Actual:   $actual_count files, hash=${actual_hash:0:16}..."
              original="$MANIFEST_DIR/${safe_name}.manifest"
              if [ -f "$original" ]; then
                echo "        Diff (first 20 lines):"
                diff "$original" "$post_manifest" | head -20 || true
              fi
              failures=$((failures + 1))
            fi
            rm -f "$post_manifest"
          done < "$BRANCH_HASHES"

          echo ""
          echo "Verified: $verified branches"

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures branch(es) failed integrity check! Aborting push."
            echo "No data was pushed. The remote is untouched."
            exit 1
          fi

          echo "All branches verified — every file (mode + SHA + path) is identical."

      - name: Repo size after
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          echo "=== Repo size AFTER ==="
          git count-objects -vH
          echo ""

          file_count=$(git ls-tree -r "refs/heads/${DEFAULT_BRANCH}" | wc -l)
          echo "Files in ${DEFAULT_BRANCH} after cleanup: $file_count"
          for dir in data/raw results/calibration; do
            count=$(git ls-tree -r "refs/heads/${DEFAULT_BRANCH}" -- "$dir" 2>/dev/null | wc -l)
            echo "  ${dir}/  →  ${count} live files"
          done
          echo ""

          echo "=== Top 25 remaining blobs by size ==="
          BLOB_LIST=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$BLOB_LIST"
          sort -rnk2 "$BLOB_LIST" | head -25 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          rm -f "$BLOB_LIST"

      - name: Force push cleaned history
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          set -euo pipefail

          # git-filter-repo removes the origin remote. Re-add it as a plain
          # (non-mirror) remote so the pushes below are explicit rather than
          # an implicit mirror push of every ref namespace.
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git remote remove origin 2>/dev/null || true
          git remote add origin "$REPO_URL"
          git config --unset remote.origin.mirror 2>/dev/null || true

          echo "=== Force pushing ALL branches ==="
          branch_count=$(git for-each-ref --format='%(refname:short)' refs/heads/ | wc -l)
          echo "Pushing $branch_count branches..."
          git push --force --all origin

          echo ""
          echo "=== Force pushing all tags ==="
          git push --force --tags origin

          echo ""
          echo "============================================================"
          echo "  DONE — History rewritten successfully"
          echo "============================================================"
          echo "  - All $branch_count branches force-pushed with cleaned history"
          echo "  - All tags force-pushed"
          echo "  - Live content is UNCHANGED on every branch"
          echo "  - Only dead/overwritten blobs under data/raw/ and"
          echo "    results/calibration/ were stripped"
          echo ""
          echo "  WARNING: All collaborators must re-clone the repository."
          echo "  Run: git clone ${{ github.server_url }}/${{ github.repository }}.git"
          echo "============================================================"
