name: Cleanup Large File Blobs from History (Protected)

# Strips superseded versions of files under data/raw/ and results/calibration/
# from git history. Everything outside those two trees is untouched, at every
# commit, on every branch and tag.
#
# PROTECTION MODEL
#   Protected set = blobs live at the tip of DEFAULT_BRANCH only.
#   Consequence: an in-scope file version that exists ONLY on some other branch
#   or tag is treated as an older version and will be stripped. Out-of-scope
#   files are never candidates, so nothing else can be affected.
#
# INTEGRITY MODEL
#   DEFAULT_BRANCH  — full file manifest must be byte-identical before/after.
#   Other branches  — the out-of-scope portion of the manifest must be
#                     byte-identical; the in-scope portion may shrink.
#   Any out-of-scope change anywhere aborts before pushing.
#
# Runs against a --mirror (bare) clone. There is NO working tree at any point:
# actions/checkout would materialize thousands of parquet files and exhaust the
# runner disk ("unable to write file"). Every operation reads the object
# database directly.
#
# WARNING: This rewrites history. All collaborators must re-clone afterward.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REWRITE-HISTORY to confirm (irreversible)'
        required: true
        type: string
      dry_run:
        description: 'Dry run only — show what would be removed vs. protected'
        required: false
        type: boolean
        default: true

env:
  # The only two trees in scope. Extended-regex alternation, no trailing slash.
  SCOPE_REGEX: '(data/raw|results/calibration)/'
  # The single branch whose live files are protected.
  DEFAULT_BRANCH: main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: repo.git
    steps:
      - name: Validate confirmation
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.dry_run == false && inputs.confirm != 'REWRITE-HISTORY' }}
        run: |
          echo "::error::You must type 'REWRITE-HISTORY' to confirm. Aborting."
          exit 1

      - name: Free runner disk space
        working-directory: /
        run: |
          echo "=== Disk BEFORE reclaim ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/lib/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/graalvm 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Disk AFTER reclaim ==="
          df -h /

      - name: Mirror-clone repository (no working tree)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          git clone --mirror \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            repo.git
          cd repo.git

          # GitHub mirrors carry refs/pull/*. They keep old objects reachable,
          # are invisible to rev-list --all, and block gc from reclaiming space.
          pr_refs=$(git for-each-ref --format='%(refname)' refs/pull | wc -l)
          if [ "$pr_refs" -gt 0 ]; then
            git for-each-ref --format='delete %(refname)' refs/pull \
              | git update-ref --stdin
            echo "Deleted $pr_refs refs/pull/* refs"
          fi

          branch_count=$(git for-each-ref --format='%(refname:short)' refs/heads/ | wc -l)
          tag_count=$(git for-each-ref --format='%(refname)' refs/tags/ | wc -l)
          echo "Branches: $branch_count"
          echo "Tags:     $tag_count"

          if ! git show-ref --verify --quiet "refs/heads/${DEFAULT_BRANCH}"; then
            echo "::error::Branch '${DEFAULT_BRANCH}' not found in mirror. Aborting."
            git for-each-ref --format='  %(refname:short)' refs/heads/
            exit 1
          fi
          echo "${DEFAULT_BRANCH} HEAD: $(git log -1 --oneline "refs/heads/${DEFAULT_BRANCH}")"

          echo "Object store size:"
          du -sh objects
          df -h /

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Repo size before
        run: |
          echo "=== Repo size BEFORE ==="
          git count-objects -vH

      - name: Build protected set and record branch manifests
        id: protect
        run: |
          set -euo pipefail

          MANIFEST_DIR=$(mktemp -d)
          PROTECTED_BLOBS=$(mktemp)
          BRANCH_HASHES=$(mktemp)
          IN_SCOPE_RE="^${SCOPE_REGEX}"

          # ---- Protected set: DEFAULT_BRANCH tip ONLY ----
          git ls-tree -r "refs/heads/${DEFAULT_BRANCH}" | awk '{print $3}' | sort -u > "$PROTECTED_BLOBS"
          protected_count=$(wc -l < "$PROTECTED_BLOBS")
          echo "Protected: $protected_count unique blob SHAs (live at ${DEFAULT_BRANCH} tip)"
          echo ""

          # ---- Per-branch manifests, split in-scope vs out-of-scope ----
          echo "=== Recording per-branch manifests ==="
          branch_count=0
          for branch in $(git for-each-ref --format='%(refname:short)' refs/heads/); do
            safe_name="${branch//\//__}"
            full="$MANIFEST_DIR/${safe_name}.full"
            outs="$MANIFEST_DIR/${safe_name}.outscope"

            git ls-tree -r "refs/heads/$branch" | sort > "$full"
            awk -F'\t' -v re="$IN_SCOPE_RE" '$2 !~ re' "$full" > "$outs"

            full_count=$(wc -l < "$full")
            out_count=$(wc -l < "$outs")
            in_count=$((full_count - out_count))
            full_hash=$(sha256sum "$full" | awk '{print $1}')
            out_hash=$(sha256sum "$outs" | awk '{print $1}')

            # branch  full_hash  out_hash  in_count  out_count  safe_name
            echo "$branch $full_hash $out_hash $in_count $out_count $safe_name" >> "$BRANCH_HASHES"
            printf "  %-40s %6d in-scope  %6d out-of-scope\n" "$branch" "$in_count" "$out_count"
            branch_count=$((branch_count + 1))
          done

          echo ""
          echo "Recorded $branch_count branch manifests"

          echo "manifest_dir=$MANIFEST_DIR" >> "$GITHUB_OUTPUT"
          echo "protected_blobs=$PROTECTED_BLOBS" >> "$GITHUB_OUTPUT"
          echo "branch_hashes=$BRANCH_HASHES" >> "$GITHUB_OUTPUT"

          echo ""
          echo "--- Live files in scope (${DEFAULT_BRANCH}) ---"
          for dir in data/raw results/calibration; do
            count=$(git ls-tree -r "refs/heads/${DEFAULT_BRANCH}" -- "$dir" 2>/dev/null | wc -l)
            echo "  ${dir}/  →  ${count} live files"
          done

      - name: Enumerate and classify historical blobs
        id: enumerate
        run: |
          set -euo pipefail
          PROTECTED_BLOBS="${{ steps.protect.outputs.protected_blobs }}"

          echo "=== Scanning all historical blobs ==="

          ALL_BLOBS=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$ALL_BLOBS"
          echo "Total blobs in history: $(wc -l < "$ALL_BLOBS")"

          TARGET_BLOBS=$(mktemp)
          grep -E " ${SCOPE_REGEX}" "$ALL_BLOBS" > "$TARGET_BLOBS" || true
          sort -u -o "$TARGET_BLOBS" "$TARGET_BLOBS"
          target_count=$(wc -l < "$TARGET_BLOBS")
          echo "Target blobs (data/raw/ + results/calibration/, recursive): $target_count"

          if [ "$target_count" -eq 0 ]; then
            echo "::error::Scope matched ZERO blobs. The path prefixes are wrong."
            echo "Sample of actual paths in history:"
            awk '{print "  " $3}' "$ALL_BLOBS" | sort -u | head -20
            exit 1
          fi

          TARGET_SHAS=$(mktemp)
          awk '{print $1}' "$TARGET_BLOBS" | sort -u > "$TARGET_SHAS"

          REMOVABLE_SHAS=$(mktemp)
          comm -23 "$TARGET_SHAS" "$PROTECTED_BLOBS" > "$REMOVABLE_SHAS"

          KEPT_SHAS=$(mktemp)
          comm -12 "$TARGET_SHAS" "$PROTECTED_BLOBS" > "$KEPT_SHAS"

          overlap=$(comm -12 "$REMOVABLE_SHAS" "$KEPT_SHAS" | wc -l)
          if [ "$overlap" -gt 0 ]; then
            echo "::error::FATAL: $overlap blob SHAs in both removable AND protected sets!"
            comm -12 "$REMOVABLE_SHAS" "$KEPT_SHAS" | head -10
            exit 1
          fi
          echo "Disjointness check: PASSED (removable ∩ protected = ∅)"

          REMOVABLE=$(mktemp)
          KEPT=$(mktemp)
          touch "$REMOVABLE" "$KEPT"

          awk -v removable_file="$REMOVABLE" -v kept_file="$KEPT" '
            FILENAME == ARGV[1] { removable[$1]=1; next }
            FILENAME == ARGV[2] { kept[$1]=1; next }
            { if($1 in removable) print >> removable_file; else if($1 in kept) print >> kept_file }
          ' "$REMOVABLE_SHAS" "$KEPT_SHAS" "$TARGET_BLOBS"

          removable_count=$(wc -l < "$REMOVABLE")
          kept_count=$(wc -l < "$KEPT")
          removable_bytes=$(awk '{s+=$2} END{print s+0}' "$REMOVABLE")
          kept_bytes=$(awk '{s+=$2} END{print s+0}' "$KEPT")

          echo ""
          echo "========================================"
          echo "  PROTECTED (live at ${DEFAULT_BRANCH} tip): $kept_count blob entries ($(awk -v b="$kept_bytes" 'BEGIN{printf "%.1f MB", b/1048576}'))"
          echo "  REMOVABLE (older versions):              $removable_count blob entries ($(awk -v b="$removable_bytes" 'BEGIN{printf "%.1f MB", b/1048576}'))"
          echo "========================================"

          if [ "$removable_count" -eq 0 ]; then
            echo ""
            echo "::warning::Nothing removable. Every in-scope blob in history is live at"
            echo "${DEFAULT_BRANCH}'s tip — meaning files were only ever added, never"
            echo "overwritten or deleted. History rewriting cannot shrink this repo."
            echo "The pack is large because the CURRENT tree is large. Consider Git LFS,"
            echo "partial clone (--filter=blob:none), or moving data/raw out of git."
          fi

          echo "removable=$REMOVABLE" >> "$GITHUB_OUTPUT"
          echo "kept=$KEPT" >> "$GITHUB_OUTPUT"
          echo "removable_count=$removable_count" >> "$GITHUB_OUTPUT"
          echo "removable_shas=$REMOVABLE_SHAS" >> "$GITHUB_OUTPUT"

      - name: "Dry run: show protected vs. removable breakdown"
        if: ${{ inputs.dry_run == true }}
        run: |
          REMOVABLE="${{ steps.enumerate.outputs.removable }}"
          KEPT="${{ steps.enumerate.outputs.kept }}"

          summarize_by_dir() {
            awk '{
              path=$3; sub(/\/[^\/]*$/, "", path)
              c[path]++; s[path]+=$2
            } END {
              for (d in c) printf "%12.1f MB  %6d blobs  %s/\n", s[d]/1048576, c[d], d
            }' "$1" | sort -rn
          }

          summarize_by_ext() {
            awk '{
              n=split($3, p, "/"); f=p[n]; ext=f
              sub(/.*\./, "", ext)
              if (ext == f) ext="(no extension)"
              c[ext]++; s[ext]+=$2
            } END {
              for (e in c) printf "%12.1f MB  %6d blobs  *.%s\n", s[e]/1048576, c[e], e
            }' "$1" | sort -rn
          }

          echo "============================================================"
          echo "  PROTECTED — live at ${DEFAULT_BRANCH} tip, will NOT be touched"
          echo "============================================================"
          if [ -s "$KEPT" ]; then
            echo ""
            echo "--- Protected by extension ---"
            summarize_by_ext "$KEPT"
            echo ""
            echo "--- Protected by directory (every depth) ---"
            summarize_by_dir "$KEPT"
          else
            echo "  (none)"
          fi

          echo ""
          echo "============================================================"
          echo "  REMOVABLE — older versions, will be stripped"
          echo "============================================================"
          if [ -s "$REMOVABLE" ]; then
            echo ""
            echo "--- Removable by extension ---"
            summarize_by_ext "$REMOVABLE"
            echo ""
            echo "--- Removable by directory (every depth) ---"
            summarize_by_dir "$REMOVABLE"
            echo ""
            echo "--- Top 30 largest removable blobs ---"
            sort -rnk2 "$REMOVABLE" | head -30 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          else
            echo "  (none — nothing to remove)"
          fi

          echo ""
          echo "--- Which refs currently pin in-scope blobs ---"
          TGTSHA=$(mktemp)
          cat "$KEPT" "$REMOVABLE" | awk '{print $1}' | sort -u > "$TGTSHA"
          for ref in $(git for-each-ref --format='%(refname)' refs/heads/ refs/tags/); do
            n=$(git ls-tree -r "$ref" | awk '{print $3}' | sort -u | comm -12 - "$TGTSHA" | wc -l)
            printf "  %-55s %6d\n" "$ref" "$n"
          done | sort -k2 -rn

          echo ""
          echo "Re-run with dry_run=false and confirm=REWRITE-HISTORY to execute."

      - name: Check if cleanup needed
        if: ${{ inputs.dry_run == false }}
        id: check
        run: |
          removable_count="${{ steps.enumerate.outputs.removable_count }}"

          if [ "$removable_count" = "0" ] || [ -z "$removable_count" ]; then
            echo "No removable blobs found. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Will strip $removable_count unique older blob SHAs."

      - name: Strip older blobs with git-filter-repo
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          REMOVABLE_SHAS="${{ steps.enumerate.outputs.removable_shas }}"
          count=$(wc -l < "$REMOVABLE_SHAS")
          echo "Stripping $count older blobs from data/raw/ and results/calibration/..."
          echo "(Everything live at ${DEFAULT_BRANCH}'s tip is protected and untouched)"
          git filter-repo --strip-blobs-with-ids "$REMOVABLE_SHAS" --force
          df -h /

      - name: Repack and garbage collect
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          echo "=== Repacking to reclaim space ==="
          git reflog expire --expire=now --all || true
          # Plain gc, not --aggressive: aggressive repack briefly holds both the
          # old and new packs, which is what put this runner over the edge before.
          git gc --prune=now
          echo "Repack complete."
          df -h /

      - name: Verify branch integrity
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          MANIFEST_DIR="${{ steps.protect.outputs.manifest_dir }}"
          BRANCH_HASHES="${{ steps.protect.outputs.branch_hashes }}"
          IN_SCOPE_RE="^${SCOPE_REGEX}"

          echo "=== Verifying manifests ==="
          echo "  ${DEFAULT_BRANCH}: strict (every file must be identical)"
          echo "  others:  out-of-scope files must be identical; in-scope may shrink"
          echo ""

          failures=0
          while IFS=' ' read -r branch full_hash out_hash in_count out_count safe_name; do
            ref="refs/heads/$branch"

            if ! git show-ref --verify --quiet "$ref"; then
              echo "  FAIL  $branch — branch missing after filter-repo!"
              failures=$((failures + 1))
              continue
            fi

            post_full=$(mktemp)
            post_out=$(mktemp)
            git ls-tree -r "$ref" | sort > "$post_full"
            awk -F'\t' -v re="$IN_SCOPE_RE" '$2 !~ re' "$post_full" > "$post_out"

            actual_full=$(sha256sum "$post_full" | awk '{print $1}')
            actual_out=$(sha256sum "$post_out" | awk '{print $1}')
            actual_in=$(( $(wc -l < "$post_full") - $(wc -l < "$post_out") ))

            if [ "$branch" = "${DEFAULT_BRANCH}" ]; then
              if [ "$full_hash" = "$actual_full" ]; then
                echo "  PASS  $branch (strict — all $in_count in-scope + $out_count out-of-scope intact)"
              else
                echo "  FAIL  $branch — ${DEFAULT_BRANCH} content changed!"
                diff "$MANIFEST_DIR/${safe_name}.full" "$post_full" | head -20 || true
                failures=$((failures + 1))
              fi
            else
              if [ "$out_hash" != "$actual_out" ]; then
                echo "  FAIL  $branch — OUT-OF-SCOPE files changed!"
                diff "$MANIFEST_DIR/${safe_name}.outscope" "$post_out" | head -20 || true
                failures=$((failures + 1))
              elif [ "$actual_in" -gt "$in_count" ]; then
                echo "  FAIL  $branch — in-scope file count grew ($in_count → $actual_in)"
                failures=$((failures + 1))
              else
                dropped=$((in_count - actual_in))
                echo "  PASS  $branch (out-of-scope intact; in-scope $in_count → $actual_in, $dropped dropped)"
              fi
            fi
            rm -f "$post_full" "$post_out"
          done < "$BRANCH_HASHES"

          echo ""
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures branch(es) failed integrity check! Aborting push."
            echo "No data was pushed. The remote is untouched."
            exit 1
          fi
          echo "All branches verified."

      - name: Repo size after
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          echo "=== Repo size AFTER ==="
          git count-objects -vH
          echo ""

          file_count=$(git ls-tree -r "refs/heads/${DEFAULT_BRANCH}" | wc -l)
          echo "Files in ${DEFAULT_BRANCH} after cleanup: $file_count"
          for dir in data/raw results/calibration; do
            count=$(git ls-tree -r "refs/heads/${DEFAULT_BRANCH}" -- "$dir" 2>/dev/null | wc -l)
            echo "  ${dir}/  →  ${count} live files"
          done
          echo ""

          echo "=== Top 25 remaining blobs by size ==="
          BLOB_LIST=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$BLOB_LIST"
          sort -rnk2 "$BLOB_LIST" | head -25 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          rm -f "$BLOB_LIST"

      - name: Force push cleaned history
        if: ${{ inputs.dry_run == false && steps.check.outputs.skip != 'true' }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git remote remove origin 2>/dev/null || true
          git remote add origin "$REPO_URL"
          git config --unset remote.origin.mirror 2>/dev/null || true

          # WHY THIS IS NOT A PLAIN `git push --all`:
          # A history rewrite changes every commit SHA, so the server shares NO
          # objects with us. A single `push --force --all` must therefore upload
          # the ENTIRE object graph (~4.76 GiB here) as ONE pack, and GitHub's
          # smart-HTTP endpoint drops that with:
          #     error: RPC failed; HTTP 500
          #     send-pack: unexpected disconnect while reading sideband packet
          # The current tree is genuinely multi-GiB, so filter-repo cannot shrink
          # the pack below the limit — the push itself must be chunked.
          #
          # Fix, three parts:
          #   1. Force HTTP/1.1 + a large post buffer. The HTTP/2 sideband is the
          #      proximate cause of the 500 on multi-GiB packs; HTTP/1.1 is the
          #      documented mitigation.
          #   2. Upload DEFAULT_BRANCH history in bounded commit-count increments
          #      to a THROWAWAY ref (refs/blob-cleanup-tmp/prime, NOT refs/heads/*
          #      so no `on: push` workflow fires). Each push sends only the delta
          #      the server does not yet have, so no single pack is large enough
          #      to trip the limit.
          #   3. Once the server holds the objects, the real branch tips + tags
          #      are cheap ref updates. Finally delete the throwaway ref.
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 1048576000

          PRIME_REF="refs/blob-cleanup-tmp/prime"
          BATCH=200

          echo "=== Priming server object store from ${DEFAULT_BRANCH} history ==="
          mapfile -t COMMITS < <(git rev-list --topo-order --reverse "refs/heads/${DEFAULT_BRANCH}")
          total=${#COMMITS[@]}
          echo "  ${DEFAULT_BRANCH} has $total commits; pushing checkpoints every $BATCH commits to $PRIME_REF"

          i=$BATCH
          while [ "$i" -lt "$total" ]; do
            sha="${COMMITS[$i]}"
            echo "  checkpoint $i/$total -> $sha"
            git push --force origin "${sha}:${PRIME_REF}"
            i=$((i + BATCH))
          done

          # Advance the prime ref to the exact tip (sends the final <BATCH delta).
          echo "  checkpoint tip -> refs/heads/${DEFAULT_BRANCH}"
          git push --force origin "refs/heads/${DEFAULT_BRANCH}:${PRIME_REF}"

          echo ""
          echo "=== Updating real branch refs (cheap deltas now) ==="
          branch_count=$(git for-each-ref --format='%(refname:short)' refs/heads/ | wc -l)
          # Default branch first so the other branches share its objects.
          git push --force origin "refs/heads/${DEFAULT_BRANCH}:refs/heads/${DEFAULT_BRANCH}"
          for branch in $(git for-each-ref --format='%(refname:short)' refs/heads/); do
            [ "$branch" = "${DEFAULT_BRANCH}" ] && continue
            echo "  push $branch"
            git push --force origin "refs/heads/${branch}:refs/heads/${branch}"
          done

          echo ""
          echo "=== Pushing all tags ==="
          git push --force --tags origin

          echo ""
          echo "=== Removing throwaway prime ref ==="
          git push origin ":${PRIME_REF}" || true

          echo ""
          echo "============================================================"
          echo "  DONE — History rewritten successfully"
          echo "============================================================"
          echo "  - All $branch_count branches force-pushed (chunked)"
          echo "  - All tags force-pushed"
          echo "  - ${DEFAULT_BRANCH} content is byte-for-byte UNCHANGED"
          echo "  - Out-of-scope files unchanged on every branch"
          echo "  - Only older versions under data/raw/ and"
          echo "    results/calibration/ were stripped"
          echo ""
          echo "  WARNING: All collaborators must re-clone the repository."
          echo "  Run: git clone ${{ github.server_url }}/${{ github.repository }}.git"
          echo "============================================================"
