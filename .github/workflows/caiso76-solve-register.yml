# One-shot: solve the caiso-76 (measured 2025 hydro budget correction) A/B
# probe pair (main + zero-forcing ablation twin) on CI and register both on
# the backcast dashboard as PROBES. The caiso-67/69/74/75 precedent: the
# session environment cannot transport the ~450 KB run payloads through the
# MCP push_files relay byte-safely, so the solve+register runs here and the
# per-run files are committed via the GitHub Data API with the runner's
# token (scripts/ci_api_upload_multi.py). Keeper stays
# caiso65-seam-envelope-clock; promotion is a separate decision evaluated
# from the committed scores.
#
# Probe: scripts/probes/_caiso76_hydro_budget_ab.py (committed on this
# branch) — the caiso-75 recipe (caiso-65 keeper flags + temp derate + SP15
# split + startup-aware bridge + hydro envelope + firm import shape + demand
# clock, ct_netload_drag=False) plus the single caiso-76 delta:
# hydro_backfill_year=2024 + hydro_eia930_monthly=True (the measured
# conventional-hydro budget correction; the 2025 early-release EIA-923
# vintage carries 26 of ~185 CAISO hydro plants, 12.32 of the measured
# 21.32 TWh — FINDING-caiso76-hydro-budget-2026-07-11.md). Years 2023-2025
# sequential within each invocation (CLAUDE.md rule 12); the two
# invocations run sequentially on this one runner.
#
# The CAISO registry is at 15/15, so registration is preceded by the
# top-15 prune (rule 15 retention): the caiso-69 pair — the oldest
# non-keeper entries (keeper + its ablation twin + the keeper-linked
# statmode diagnostic are exempt; caiso-64/67/68 prune commit d690187 is
# the precedent). Bundle dirs stay; only sidecars + payloads are removed.
name: caiso76-solve-register

on:
  push:
    branches:
      - claude/caiso-76-gas-evening-cc-ci27nq
    paths:
      - .github/workflows/caiso76-solve-register.yml

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl

      - name: Curate clean partitions the recipe reads
        run: |
          set -euo pipefail
          # data/clean is derived/gitignored — a fresh checkout has neither
          # partition. Without capacity-deliverability the keeper's published
          # MIC seam supersession silently skips (caiso-69 precedent).
          PYTHONPATH="$PWD" python scripts/curate_capacity_deliverability.py --isos CAISO

      - name: Solve caiso-76 main (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso76_hydro_budget_ab.py main

      - name: Solve caiso-76 ablation twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso76_hydro_budget_ab.py ablation

      - name: Write probe attestations
        run: python scripts/probes/_caiso76_attestation.py

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso67/69/7475-solve-register precedent).
          for b in caiso76_hydro_budget caiso76_hydro_budget-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso CAISO --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Prune CAISO registry to top-15 (caiso-69 pair, oldest non-keeper)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q \
            frontend/data/backcast/registry/2026-07-09-caiso-69-sp15split-ablation.json \
            frontend/data/backcast/registry/2026-07-09-caiso-69-sp15split-dragoff.json \
            frontend/data/backcast/runs/2026-07-09-caiso-69-sp15split-dragoff.js \
            frontend/data/backcast/runs/2026-07-09-caiso-69-sp15split-ablation.js
          git commit -m "Prune caiso-69 probe sidecars + payloads (top-15 retention, displaced by caiso-76) [skip ci]"
          git push origin HEAD:claude/caiso-76-gas-evening-cc-ci27nq

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 76 hydro budget" \
            --bundle results/calibration/caiso76_hydro_budget | tee /tmp/r76m.out
          python scripts/dashboard_add_run.py \
            --label "caiso 76 hydro budget ablation" \
            --bundle results/calibration/caiso76_hydro_budget-ablation | tee /tmp/r76a.out
          echo "RID76M=$(grep '^RUN_ID=' /tmp/r76m.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID76A=$(grep '^RUN_ID=' /tmp/r76a.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID76M" --bundle results/calibration/caiso76_hydro_budget \
            --rid "$RID76A" --bundle results/calibration/caiso76_hydro_budget-ablation \
            --branch claude/caiso-76-gas-evening-cc-ci27nq \
            --message "results: register caiso-76 (measured 2025 hydro budget correction) PROBE + zero-forcing twin on the backcast dashboard (keeper stays caiso65) [skip ci]"
