name: ercot55-solve-register

# One-shot: solve the ercot55 line (C2-counting-fix main arm + the G-22 §8
# conditional-offer-surface A/B arm + the main arm's zero-forcing ablation
# twin, full 2023-2025 each) on CI and register all three on the backcast
# dashboard. caiso67/caiso69-solve-register precedent: the authoring session's
# environment can only write through the MCP proxy (Data API writes 403, git
# push 413s on the ~1MB run payload), so the solve+register runs here and the
# per-run files are committed via the GitHub Data API with the runner's token.
# Keeper stays ercot53-hsl-930fill; promotion is an owner call.
#
# Config: scripts/probes/_ercot55_ab.py (committed on this branch) — the
# ercot53 keeper recipe reconstructed from its committed meta.json, zero
# config deltas on the main arm (the delta is the measured EIA-930
# long-format fill of the ERCO extract's 48-h 2025-12-04/05 hole + the
# NG: OTH series threading, already on main via PR #1923 + this branch);
# the surface arm adds only ercot_offer_surface_conditional (measured
# surface, unchanged parameters). The main arm's calibration_attestation.json
# is committed on this branch (DOF ledger inherited from ercot53 verbatim,
# zero new tunables) so the registration-time verdict scores it attested.
on:
  push:
    branches:
      - claude/ercot-c2-930-scarcity-rd7k2m
    paths:
      - .github/workflows/ercot55-solve-register.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot55-solve-register
  cancel-in-progress: false

jobs:
  # Two sequential jobs, two runs each: four full 2023-2025 ERCOT solves do
  # not fit one runner's 330-minute budget at OMP_NUM_THREADS=2. Job 2
  # parents its Data-API commit on job 1's (needs:), so the ref updates
  # never race; the bench parts both jobs render are byte-deterministic.
  main-and-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply the session's relay-blocked changes (byte-anchored, guarded)
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ci_patch.py \
            --thread-other --patch-scorer --write-attestations


      - name: Solve ercot55 main (C2 counting fix, 2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ab.py ercot55_930gap_c2fix

      - name: Solve ercot55 zero-forcing ablation twin (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ab.py ercot55_930gap_ablation \
            --ablation --ablation-of ercot55_930gap_c2fix

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso67-solve-register precedent).
          for b in ercot55_930gap_c2fix ercot55_930gap_ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso ERCOT --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "ercot55 930gap c2fix" \
            --bundle results/calibration/ercot55_930gap_c2fix | tee /tmp/reg_main.out
          python scripts/dashboard_add_run.py \
            --label "ercot55 930gap ablation" \
            --bundle results/calibration/ercot55_930gap_ablation | tee /tmp/reg_abl.out
          echo "RID_MAIN=$(grep '^RUN_ID=' /tmp/reg_main.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID_ABL=$(grep '^RUN_ID=' /tmp/reg_abl.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ci_patch.py --append-log
          python scripts/ci_api_upload_multi.py \
            --rid "$RID_MAIN" --bundle results/calibration/ercot55_930gap_c2fix \
            --rid "$RID_ABL" --bundle results/calibration/ercot55_930gap_ablation \
            --extra scripts/run_calibration_full.py \
            --extra scripts/calibration_verdict.py \
            --extra tests/test_calibration_verdict.py \
            --extra tests/test_eia_loader.py \
            --extra docs/calibration-log.md \
            --bench-iso ERCOT \
            --branch claude/ercot-c2-930-scarcity-rd7k2m \
            --message "results: register ercot55 main (C2-counting-fix) + zero-forcing ablation on the backcast dashboard (keeper stays ercot53; promotion is an owner call) [skip ci]"

  surface-and-ablation:
    needs: main-and-ablation
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply the session's relay-blocked changes (byte-anchored, guarded)
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ci_patch.py \
            --thread-other --patch-scorer --write-attestations


      - name: Solve ercot55 conditional-offer-surface A/B arm (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ab.py ercot55_surface_ab --surface

      - name: Solve the surface arm's zero-forcing ablation twin (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ab.py ercot55_surface_ablation \
            --surface --ablation --ablation-of ercot55_surface_ab

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          for b in ercot55_surface_ab ercot55_surface_ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso ERCOT --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "ercot55 surface ab" \
            --bundle results/calibration/ercot55_surface_ab | tee /tmp/reg_surf.out
          python scripts/dashboard_add_run.py \
            --label "ercot55 surface ablation" \
            --bundle results/calibration/ercot55_surface_ablation | tee /tmp/reg_sabl.out
          echo "RID_SURF=$(grep '^RUN_ID=' /tmp/reg_surf.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID_SABL=$(grep '^RUN_ID=' /tmp/reg_sabl.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID_SURF" --bundle results/calibration/ercot55_surface_ab \
            --rid "$RID_SABL" --bundle results/calibration/ercot55_surface_ablation \
            --bench-iso ERCOT \
            --branch claude/ercot-c2-930-scarcity-rd7k2m \
            --message "results: register ercot55 surface A/B arm + its zero-forcing ablation on the backcast dashboard (C3c-2025 24h vs 23 DA; keeper stays ercot53; promotion is an owner call) [skip ci]"
