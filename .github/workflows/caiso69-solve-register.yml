name: caiso69-solve-register

# One-shot: solve the caiso-69 SP15-split drag-off A/B (main + zero-forcing
# ablation twin) on CI and register both on the backcast dashboard as PROBES.
# The caiso67-solve-register precedent: the session's environment can only
# write through the MCP proxy (Data API writes 403, git push 413s on the
# ~400KB run payloads), so the solve+register runs here and the per-run files
# are committed via the GitHub Data API with the runner's token. Keeper stays
# caiso65-seam-envelope-clock; promotion is an owner call.
#
# Config: scripts/probes/_caiso_sp15split_ab.py (committed on this branch) —
# the caiso-68 recipe (caiso65 keeper flags + temp_dependent_derate) on the
# LA_BASIN/SDGE/SP15_rest split topology already on main, with
# ct_netload_drag=False as a per-run override (the shared drag mechanism and
# its ERCOT/PJM arming untouched — SP15-split scope doc Phase 2 as corrected).
on:
  push:
    branches:
      - claude/caiso-sp15-split-off-zo5o52
    paths:
      - .github/workflows/caiso69-solve-register.yml
      - scripts/ci_api_upload_multi.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Curate capacity-deliverability clean partition (CAISO)
        run: |
          set -euo pipefail
          # data/clean is derived/gitignored — a fresh checkout has no CAISO
          # partition, and without it capacity_deliverability_limits silently
          # skips the published-MIC seam supersession (the keeper mechanism).
          PYTHONPATH="$PWD" python scripts/curate_capacity_deliverability.py --isos CAISO

      - name: Solve caiso-69 main (SP15 split, drag off, 2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_caiso_sp15split_ab.py main

      - name: Solve caiso-69 zero-forcing ablation twin (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_caiso_sp15split_ab.py ablation

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso67-solve-register precedent).
          for b in caiso69_sp15split caiso69_sp15split-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso CAISO --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 69 sp15split" \
            --bundle results/calibration/caiso69_sp15split | tee /tmp/reg_main.out
          python scripts/dashboard_add_run.py \
            --label "caiso 69 sp15split ablation" \
            --bundle results/calibration/caiso69_sp15split-ablation | tee /tmp/reg_abl.out
          echo "RID_MAIN=$(grep '^RUN_ID=' /tmp/reg_main.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID_ABL=$(grep '^RUN_ID=' /tmp/reg_abl.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID_MAIN" --bundle results/calibration/caiso69_sp15split \
            --rid "$RID_ABL" --bundle results/calibration/caiso69_sp15split-ablation \
            --branch claude/caiso-sp15-split-off-zo5o52 \
            --message "results: register caiso-69 SP15-split PROBES (main + zero-forcing ablation) on the backcast dashboard (drag-off A/B on the LA_BASIN/SDGE/SP15_rest split; keeper stays caiso65) [skip ci]"
