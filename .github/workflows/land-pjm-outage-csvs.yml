name: land-pjm-outage-csvs

# One-shot: fetch + derive the PJM generation-outage by-year CSVs (2018-2026) and
# commit them to main. They are dense numeric data the API-only push path cannot
# carry, but they regenerate deterministically from the two committed scripts.
# Idempotent (commits only if the CSVs changed); delete after it runs.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: land-pjm-outage-csvs

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/data/fetch_pjm_outages.py
            scripts/data/derive_pjm_dam_availability.py
            data/raw/pjm-outages
            data/dictionary/schema/pjm-outages.schema.yaml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pandas requests pyarrow
      - name: Fetch + derive PJM outages, commit by-year CSVs
        run: |
          set -euo pipefail
          python scripts/data/fetch_pjm_outages.py --start 2018-01-01 --end 2026-07-19
          python scripts/data/derive_pjm_dam_availability.py
          ls -la data/raw/pjm-outages/by-year/
          git add data/raw/pjm-outages/by-year/
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dam-wiring: land PJM by-year outage CSVs 2018-2026 (server-side fetch+derive; dense data the API push path cannot carry) [skip ci]"
          git push origin HEAD:main
