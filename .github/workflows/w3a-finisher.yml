name: w3a-finisher

# One-shot promotion + repair for the W3a lane (owner decision 2026-07-07; v4):
#   1. repair the ablation twin's registration (its 5-word label slugged to
#      the BASE id — render_backcast._slug keeps <=4 words — so the base job
#      overwrote its sidecar/payload on main): re-register it from the CI
#      artifact under the distinct id 2026-07-07-caiso65-seam-envclock-ablation.
#   2. add the base bundle's legitimacy_diagnostics.json (C7/C8/D-gates were
#      SKIPPED at registration) — generated from the CI artifact, whose
#      dispatch is byte-identical to the session's local A/B arm.
#   3. compose the caiso-65 calibration_attestation.json (caiso-60 DOF ledger
#      + the two measured clock-lag constants) and refresh metrics.json
#      (C6 attests, C7/C8 score).
#   4. promote: keepers.json CAISO -> caiso-65, sidecar KEEPER definition +
#      disclosures + ablation_twin, rebuild status.js.
#   5. delete the three one-shot W3a workflows from main.
# Self-triggering on the push that lands this file (the sandbox cannot
# dispatch workflows); idempotent via the helper's skip guards.
on:
  push:
    branches:
      - claude/caiso-seam-diurnal-shape-w3a-y2cc1s
    paths:
      - .github/workflows/w3a-finisher.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebase worktree onto fresh main (keep helper from this ref)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch origin auto/caiso65_seam_envelope_clock-ablation-95bef5f6
          git checkout -fB w3a-promotion origin/main
          git checkout "${{ github.sha }}" -- .github/patches/2026_07_07_w3a_finisher_edits.py

      - name: Download base bundle artifact (full parquets)
        uses: actions/download-artifact@v4
        with:
          name: bundle-caiso65_seam_envelope_clock
          path: results/calibration/caiso65_seam_envelope_clock
          run-id: 28870278179
          github-token: ${{ github.token }}

      - name: Promote and publish
        run: |
          set -euo pipefail
          BASE=results/calibration/caiso65_seam_envelope_clock

          # exits 1 when a D-gate FAILs (C8 CT_PEAKER is a known owner-held
          # FAIL); the JSON artifact is written regardless.
          python scripts/legitimacy_diagnostics.py \
            --bundle "$BASE" --iso CAISO \
            --json-out "$BASE/legitimacy_diagnostics.json" || true
          test -s "$BASE/legitimacy_diagnostics.json"

          # the ablation's rendered payload is recovered from its register
          # job's publish commit by the helper (git show; no re-render, no
          # shared-input dependency)
          RUN_ID="2026-07-07-caiso65-seam-envclock-ablation"
          python .github/patches/2026_07_07_w3a_finisher_edits.py
          test -s "frontend/data/backcast/runs/${RUN_ID}.js"

          # NOT-YET determinations exit 1 by design; the metrics write happens first.
          python scripts/calibration_verdict.py "$BASE" --write-metrics || true
          test -s "$BASE/metrics.json"

          python scripts/build_status.py

          git rm -q --ignore-unmatch \
            .github/workflows/apply-w3a-seam-clock.yml \
            .github/workflows/register-w3a-caiso65.yml \
            .github/workflows/w3a-finisher.yml

          git add "$BASE/legitimacy_diagnostics.json" \
                  "$BASE/metrics.json" \
                  "$BASE/calibration_attestation.json" \
                  "frontend/data/backcast/registry/${RUN_ID}.json" \
                  "frontend/data/backcast/runs/${RUN_ID}.js" \
                  frontend/data/backcast/registry/2026-07-07-caiso65-seam-envelope-clock.json \
                  frontend/data/backcast/keepers.json \
                  frontend/data/backcast/status.js \
                  .github/patches/2026_07_07_w3a_finisher_edits.py

          MSG_FILE=$(mktemp)
          {
            echo "w3a: promote caiso-65 to CAISO keeper (owner decision) + repair ablation registration"
            echo ""
            echo "- keepers.json CAISO -> 2026-07-07-caiso65-seam-envelope-clock; sidecar"
            echo "  KEEPER definition with promotion disclosures (C1 free 7/8->6/8: 2023"
            echo "  CC_REGULAR band-edge crossing from the corrected envelope, fix-real;"
            echo "  C8 CT_PEAKER FAIL inherited/owner-held; grade summary identical)."
            echo "- calibration_attestation.json: caiso-60 DOF ledger + the two measured"
            echo "  clock-lag constants (rule 23, drift-guarded); C6 attests."
            echo "- legitimacy_diagnostics.json for the registered bundle (C7 PASS scored)."
            echo "- ablation twin re-registered as 2026-07-07-caiso65-seam-envclock-ablation"
            echo "  (its 5-word label had slugged onto the base id and been overwritten)."
            echo "- status.js rebuilt; the three one-shot W3a workflows removed."
            echo ""
            echo "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
            echo "Claude-Session: https://claude.ai/code/session_016eHWwkn7NsJZZPeVNd6oLA"
          } > "$MSG_FILE"
          git commit -F "$MSG_FILE"

          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:main"; then
              echo "published to main."
              exit 0
            fi
            echo "main moved; rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not publish to main after retries."
          exit 1
