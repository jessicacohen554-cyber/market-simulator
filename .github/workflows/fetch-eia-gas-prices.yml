# Refresh the EIA gas-price inputs from a GitHub runner (open egress; the Claude
# remote env blocks api.eia.gov). Pulls Henry Hub spot (monthly + daily) and the
# per-ISO state citygate basis over Henry Hub, and commits the refreshed CSVs back
# to the branch it ran on. Runs monthly on a schedule (the data "keeps coming up")
# and on demand. Needs the EIA_API_KEY repo secret (free key:
# https://www.eia.gov/opendata/register.php).
name: Fetch EIA gas prices

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets (space-separated: henry-hub citygate)"
        default: "henry-hub citygate"
        type: string
      isos:
        description: "ISOs for citygate basis (space-separated)"
        default: "CAISO ERCOT PJM MISO NYISO NEISO"
        type: string
      start_year:
        description: "Earliest citygate-basis year to add"
        default: "2015"
        type: string
      dry_run:
        description: "Validate series ids only (lists EIA's citygate ids); writes nothing"
        default: false
        type: boolean
  schedule:
    # 06:10 UTC on the 8th of each month — EIA citygate lags ~2 months, HH is current.
    - cron: "10 6 8 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch EIA gas prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          # Prefer the repo secret; fall back to the key committed in .env (the
          # EIA key is free, read-only and rate-limited, and this repo is private,
          # so committing it is an accepted trade-off here — rotate at
          # https://www.eia.gov/opendata/register.php if that ever changes).
          if [ -z "$EIA_API_KEY" ] && [ -f .env ]; then
            EIA_API_KEY="$(grep -E '^EIA_API_KEY=' .env | head -1 | cut -d= -f2- | tr -d '\r\n ')"
          fi
          if [ -z "$EIA_API_KEY" ]; then
            echo "::error::no EIA_API_KEY (set the repo secret or the .env key)"
            exit 1
          fi
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          EIA_API_KEY="$EIA_API_KEY" python scripts/fetch_eia_gas_prices.py $DRY \
            --datasets ${{ github.event.inputs.datasets || 'henry-hub citygate' }} \
            --isos ${{ github.event.inputs.isos || 'CAISO ERCOT PJM MISO SPP NYISO NEISO' }} \
            --start-year ${{ github.event.inputs.start_year || '2015' }}

      - name: Commit and push refreshed gas prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/gas-prices/henry_hub_monthly.csv \
                  data/raw/gas-prices/henry_hub_daily.csv \
                  data/raw/gas_basis_by_iso_month.csv
          if git diff --cached --quiet; then
            echo "no gas-price changes to commit"
            exit 0
          fi
          git commit -m "data: refresh EIA Henry Hub + citygate gas prices (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
