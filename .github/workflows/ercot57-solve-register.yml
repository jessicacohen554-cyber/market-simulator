name: ercot57-solve-register

# One-shot: solve the ercot57 measured-thermal-availability line (ercot56
# keeper recipe + the measured 60-Day DAM disclosure class-day thermal
# availability rescale) + its zero-forcing ablation twin, full 2023-2025
# each, on CI — then register both on the backcast dashboard, prune the ERCOT
# registry to the top-15 retention, and upload the per-run files + the
# ERCOT-57 calibration-log entry via the GitHub Data API. ercot56/ercot55
# precedent: the authoring session's environment cannot git-push (413 on the
# ~1 MB run payloads) and the MCP relay caps single-call content ~200 KB, so
# the oversized pieces land from the runner. Keeper stays ercot56-nucwin;
# promotion is an owner call — the run is the June/Sep-2023 root-cause fix
# registered HONESTLY (rule 15 "keeper-or-probe either way"): the measured
# input exposes the July-Sep scarcity formation's reliance on the phantom
# statistical tightness (details in the log entry + diagnosis doc).
#
# Config: scripts/probes/_ercot57_ab.py (the ercot56_nucwin keeper meta.json
# reconstruction, which already carries the surface + nuclear windows) with
# ercot_thermal_dam_availability=True baked in — ONE measured-input delta,
# zero new free parameters. The authoring session solved the same full-span
# bundle locally first (ercot54/ercot56 local-parity precedent), so these CI
# bundles are expected to match the committed ERCOT-57 log entry's numbers.
on:
  push:
    branches:
      - claude/ercot-june-2023-scarcity-a8yxm6
    paths:
      - .github/workflows/ercot57-solve-register.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot57-solve-register
  cancel-in-progress: false

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply the session's relay-oversized changes (git patch, guarded)
        run: |
          set -euo pipefail
          # The six modified sources (scenarios.py / fleet.py / outages.py /
          # run_calibration_full.py / run_calibration.py / tests) exceed what
          # the session's MCP relay can carry whole, so they land as one
          # committed unified patch (base64-wrapped: the relay is not
          # whitespace-exact and a diff is whitespace-significant); the upload
          # step below commits the PATCHED files so the branch carries the
          # real sources. _ercot56_code.patch precedent, b64 transport.
          if grep -q "ercot_thermal_dam_availability" src/market_sim/config/scenarios.py; then
            echo "already applied — no-op"
          else
            echo "e0543667acd22dc23941e1a9d25fa3a5494d97fbe9d517c80338d3a547f80750  /tmp/_ercot57_code.patch" > /tmp/patch.sha
            tr -d '\r\n ' < scripts/probes/_ercot57_code.patch.b64 | base64 -d > /tmp/_ercot57_code.patch
            sha256sum -c /tmp/patch.sha
            git apply --verbose /tmp/_ercot57_code.patch
          fi
          # The register helper (attestations + ERCOT-57 log entry + prune)
          # rides the same b64 transport — the relay is not byte-exact and the
          # helper embeds the full log-entry text. sha-gated like the patch.
          echo "d1b85f85966e91cfe96788619c903f26dd897aaff3dff22b22938cfcfa3b37d0  scripts/probes/_ercot57_register.py" > /tmp/reg.sha
          tr -d '\r\n ' < scripts/probes/_ercot57_register.py.b64 | base64 -d > scripts/probes/_ercot57_register.py
          sha256sum -c /tmp/reg.sha

      - name: Derive the measured class-day thermal-availability series
        run: |
          set -euo pipefail
          # Deterministic from the committed disclosure parquets + the frozen
          # deriver, so generating here == the authoring session's local CSV
          # (whose numbers the committed log entry quotes); the upload step
          # below commits it. Idempotent: with the CSV already committed a
          # re-run regenerates identical values. ercot56 nuclear-CSV precedent.
          python scripts/derive_ercot_thermal_dam_availability.py

      - name: Run the overlay unit tests
        run: |
          set -euo pipefail
          pip install pytest
          python -m pytest tests/test_outages.py -q \
            -k "ErcotThermalDam or ErcotNuclear"

      - name: Solve ercot57 thermavail main (keeper recipe + measured thermal availability, 2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot57_ab.py ercot57_thermavail

      - name: Solve the zero-forcing ablation twin (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot57_ab.py ercot57_thermavail_ablation \
            --ablation --ablation-of ercot57_thermavail

      - name: Write attestations (main + twin)
        run: |
          set -euo pipefail
          python scripts/probes/_ercot57_register.py --write-attestations

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          for b in ercot57_thermavail ercot57_thermavail_ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso ERCOT --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "ercot57 thermavail" \
            --bundle results/calibration/ercot57_thermavail | tee /tmp/reg_main.out
          python scripts/dashboard_add_run.py \
            --label "ercot57 thermavail ablation" \
            --bundle results/calibration/ercot57_thermavail_ablation | tee /tmp/reg_abl.out
          echo "RID_MAIN=$(grep '^RUN_ID=' /tmp/reg_main.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID_ABL=$(grep '^RUN_ID=' /tmp/reg_abl.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files + log entry via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/probes/_ercot57_register.py --append-log
          python scripts/ci_api_upload_multi.py \
            --rid "$RID_MAIN" --bundle results/calibration/ercot57_thermavail \
            --rid "$RID_ABL" --bundle results/calibration/ercot57_thermavail_ablation \
            --extra docs/calibration-log.md \
            --extra data/raw/ercot-thermal-dam-availability.csv \
            --extra scripts/probes/_ercot57_register.py \
            --extra src/market_sim/config/scenarios.py \
            --extra src/market_sim/data/fleet.py \
            --extra src/market_sim/data/outages.py \
            --extra scripts/run_calibration_full.py \
            --extra scripts/run_calibration.py \
            --extra tests/test_outages.py \
            --bench-iso ERCOT \
            --branch claude/ercot-june-2023-scarcity-a8yxm6 \
            --message "results: register ercot57 thermavail (measured 60-Day DAM class-day thermal availability) + zero-forcing twin; land the relay-oversized sources (keeper stays ercot56-nucwin; promotion is an owner call) [skip ci]"

      - name: Prune ERCOT registry to top-15 retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/probes/_ercot57_register.py --prune-registry \
            --branch claude/ercot-june-2023-scarcity-a8yxm6
