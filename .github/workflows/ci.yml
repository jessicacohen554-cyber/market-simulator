name: CI

# Restored per-PR safety net (owner decision D-2, refactor-consolidation plan
# §2-A). All four workflows CLAUDE.md rule 22 and the .claude hooks cite
# (ci.yml, lint.yml, clean-parity.yml, forecast-invariants.yml) were DELETED
# wholesale on 2026-07-14 (commit 27c0152 "Remove all GitHub Actions workflows
# and patch cruft" — the sweep that killed the per-task solve/apply workflows
# burning Actions minutes) and never restored; the CI safety net was collateral.
# This one durable workflow is sanctioned CI infrastructure — NOT a per-task
# workflow — and folds the former standalone lint.yml back in as the `lint` job.
#
# Every job is seconds-to-a-few-minutes and path-filtered; the jobs run in
# parallel, so wall time is the slowest job (fast-tests). NO LP solves, no data
# regeneration, no cron — heavy work runs in Claude sessions, per the repo CI
# cost policy.

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "conftest.py"
      - "frontend/data/backcast/**"
      - "docs/codebase-site/data/mechanism-matrix.js"
      - "CLAUDE.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  quarantine-gates:
    name: Rule-22 quarantine gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # E1-E9 keeper-text integrity + H1 holdout-quarantine (audit D-6/D-9,
      # re-arms CLAUDE.md rules 22/24/25). Fast (reads committed artifacts).
      - name: audit_keepers --check
        run: uv run python scripts/audit_keepers.py --check
      # D-9 overlay quarantine + D-6 holdout quarantine (the rule-22 marker
      # enforcement). --no-d2-recompute skips the D-2 recompute-vs-committed
      # check, which rebuilds per-plant floors via run_year (needs each keeper's
      # FETCHED raw inputs — uncommitted — and minutes of compute), so it is
      # unfit for the fast hermetic PR tier; run the full --keepers in a
      # data-provisioned lane. See scripts/legitimacy_diagnostics.py.
      - name: legitimacy_diagnostics --keepers (fast tier)
        run: uv run python scripts/legitimacy_diagnostics.py --keepers --no-d2-recompute
      # Registry sidecar <-> run payload 1:1 parity (a sidecar-only run never
      # renders in the Run Explorer). Tolerates only the tracked known-unsynced
      # ids (scripts/lib/known_unsynced_keepers.py); any new gap fails.
      - name: check_registry_payload_parity
        run: uv run python scripts/check_registry_payload_parity.py

  mechanism-matrix-guard:
    name: Rule-28 mechanism-matrix guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      # Rule 28 [R-MECH-MATRIX]: matrix integrity always; on the diff, a new
      # ScenarioConfig field missing from the matrix FAILS (28c), and a new
      # registry sidecar / calibration CLI flag without a matrix touch WARNS
      # (28b). Stdlib-only — no uv sync needed, runs in seconds.
      - name: check_mechanism_matrix
        run: python3 scripts/check_mechanism_matrix.py --base ${{ github.event.pull_request.base.sha }}

  cache-key-guard:
    name: Cache-key registration guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      # A new ScenarioConfig field that is not listed in
      # _CACHE_KEY_OPTIONAL_FIELDS moves the DEFAULT cache key and orphans every
      # on-disk cache, even when the field ships default-off. That has happened
      # FIVE times (coal_committed_takeorpay_sunk_fixed, measured_ct_heat_rates,
      # pjm_apsouth_interface_cut, pjm_external_net_position_cut / temp_derate_*
      # / ramp_limits, pjm_zonal_loss_surface) and each time surfaced only as a
      # pinned-literal test failure in an unrelated session, whose tempting and
      # WRONG remedy is to re-pin the literal. This moves detection to the PR
      # that adds the field. Stdlib-only — no uv sync needed, runs in seconds.
      - name: check_cache_key_registration
        run: python3 scripts/check_cache_key_registration.py --base ${{ github.event.pull_request.base.sha }}

  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  fast-tests:
    name: Fast test tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # Parallel fast tier. The `fulldata` mark is not yet registered (lands
      # with Wave 2D); naming it in the -m expression is harmless (it simply
      # matches nothing today), so this line needs no edit when 2D adds it.
      #
      # BLOCKING since 2026-07-27. Ran advisory from the workflow's restoration
      # through two held flips; the full history — the 141-failure triage, the
      # perf-budget measurement, and the path-dependent cache-key pin that held
      # the last one — is in docs/handoffs/fast-tier-triage-2026-07-26.md
      # §9-§9.3. Do not re-add `continue-on-error` to silence a red: fix the
      # red, or escalate it there.
      - name: Fast pytest tier
        run: uv run python -m pytest -n 2 -m "not slow and not integration and not fulldata"

  refactor-guards:
    name: Structural refactor guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # Byte-compile every module (a syntax break anywhere fails fast).
      - name: compileall
        run: uv run python -m compileall -q src scripts
      # pkgutil import-walk of market_sim + a script-reference lint (a moved or
      # deleted script that leaves a live code/config invocation dangling).
      - name: import-walk + script-reference lint
        run: uv run python scripts/ci_refactor_guards.py
      # Facade re-export + persisted-identity pins (BLOCKING, unlike the
      # advisory fast tier): every split package must keep its full pre-split
      # surface, and the pickle-borne classes their frozen module paths.
      # test_pipeline_facade_shims.py joined this list on 2026-07-26, when the
      # orchestrator-extraction alias conversion it pins finally landed
      # (fast-tier escalation D4) — the shims are now the guard that a later
      # cleanup cannot silently drop one.
      #
      # These ten live in tests/regression/ since the Wave-5A tests/ migration
      # (they are frozen-surface guards, not unit tests). This list is one of
      # the two path inventories that migration has to keep in step — moving
      # any of them without editing this block silently disarms the only
      # BLOCKING test gate in CI.
      - name: facade re-export + persisted-identity tests
        run: >-
          uv run python -m pytest -q
          tests/regression/test_persisted_identity.py
          tests/regression/test_pipeline_facade_shims.py
          tests/regression/test_constants_facade.py
          tests/regression/test_dispatch_facade.py
          tests/regression/test_eia930_facade.py
          tests/regression/test_fuel_facade.py
          tests/regression/test_fleet_facade.py
          tests/regression/test_capacity_evolution_facade.py
          tests/regression/test_transmission_facade.py
          tests/regression/test_scenarios_facade.py
