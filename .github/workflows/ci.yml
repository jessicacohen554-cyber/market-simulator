name: CI

# The per-PR safety net: three jobs, seconds-to-minutes each, path-filtered,
# no LP solves, no data regeneration, no cron (heavy work runs in sessions —
# this repo is private and runner minutes are billed). Cut from twelve jobs to
# three on 2026-10-01 (owner decision, cleanup-A): lint, the fast test tier,
# and one repo-checks job carrying every committed-artifact gate that is still
# load-bearing. The forecast-board, promotion-completeness, cache-key-pin and
# refactor-guard jobs are gone; their pin-ledger tests went with them
# (docs/testing.md: a test asserts behaviour, never a stored digest).
#
# SPARSE CHECKOUT: data/raw is ~7.5 GB. lint and repo-checks exclude it;
# fast-tests carries its own data-INCLUDING list (see that job).

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "conftest.py"
      - "frontend/data/backcast/**"
      - "frontend/data/hindcast/**"
      - "frontend/data/forecast/**"
      - "tests/golden/**"
      - "docs/codebase-site/data/mechanism-matrix.js"
      - "docs/codebase-site/data/mechanism-matrix/**"
      - "CLAUDE.md"
      - ".github/workflows/ci.yml"
      - "docs/records/governance/audit-program-director-board-2026-08.md"
      - "docs/model-audit-release-plan-2026-08.md"
      - "docs/FINDING-*.md"
      - "docs/records/**"
      - "results/calibration/**"
      - "results/phase0/**"
      - "docs/calibration-log/**"


permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # DATA-FREE CHECKOUT (see header): this job reads no data/raw.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  fast-tests:
    name: Fast test tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # fast-tests needs the measured ~2.0 GiB data/raw subset below (a full
          # checkout no longer fits a runner; a missing corpus surfaces as
          # FileNotFoundError — extend the list, never let a skip stand).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /src/
            /scripts/
            /tests/
            /configs/
            /docs/
            /frontend/
            /results/
            /shard-artifacts/
            /data/dictionary/
            /data/raw/*.csv
            /data/raw/*.parquet
            /data/raw/ISO-specific-gen-data/
            /data/raw/NYISO/
            /data/raw/NYISO-AS/
            /data/raw/PJM-AS/
            /data/raw/_processed-legacy/
            /data/raw/_validation-source/
            /data/raw/caiso-curtailment/
            /data/raw/caiso-hsl/
            /data/raw/campd-facility-level/
            /data/raw/campd-unit-level/*_2023.parquet
            /data/raw/confirmed-retirements/
            /data/raw/eia-860/
            /data/raw/eia-930/eia_generation_profiles.parquet
            /data/raw/eia-930-hourly/
            /data/raw/ercot/2_DAY_AS_DISCLOSURE_2d_Cleared_DAM_AS_*.parquet
            /data/raw/ercot/ercot_ordc_mu_sigma_seasonal.csv
            /data/raw/ercot-AS/*60d_dam_as_only_awards*json.zip
            /data/raw/ercot-AS/ercot_*_as_up_mw.parquet
            /data/raw/ercot-hsl/ercot_*_hsl_hourly.parquet
            /data/raw/ercot-weather/
            /data/raw/ercot-wind-shape/
            /data/raw/fleet-egrid/
            /data/raw/gas-prices/
            /data/raw/lmp-data/CAISO/CAISO_dam_hourly_*.csv
            /data/raw/lmp-data/CAISO/CAISO_rtm_hourly_*.csv
            /data/raw/lmp-data/NEISO/
            /data/raw/lmp-data/NYISO/
            /data/raw/lmp-data/PJM_*_rt_da_monthly_lmps.csv
            /data/raw/miso-wind-shape/
            /data/raw/reference/
            /data/raw/zone-specific-demand/
            /data/raw/MISO/
            /data/raw/MISO-AS/
            /data/raw/miso-hsl/
            /data/raw/nyiso-demand-response/
            /data/raw/nyiso-renewable-curtailment/
            /data/raw/capacity-market/
            /data/raw/capacity-deliverability/
            /data/raw/ornl-eha/
            /data/raw/hilarri/
            /data/raw/coal-prices/
            /data/raw/ferc-714/soco_hourly_system_lambda_2019_2025.csv
            /data/raw/soco-energy-auction/
            /data/raw/oil-prices/
            /data/raw/policy/
            /data/raw/som-competitive-conduct/
            /data/raw/neiso-weather/
            /data/raw/miso-weather/
            /data/raw/pjm-weather/
            /data/raw/nyiso-weather/
            /data/raw/new-build-cost-benchmarks/
            /data/raw/nrel-atb/
            /data/raw/uranium-marketing/
            /data/raw/eia-aeo/
            /data/raw/caiso-dam-outages/
            /data/raw/neiso-operable-capacity/
            /data/raw/pjm-outages/
            /data/raw/eia-930-interchange/
            /data/raw/iso-specific-transmission/
            /data/raw/miso-generation-outages/
            /data/raw/maxgen-events/
            /data/raw/eia-930/eia_demand_profiles.parquet
            /data/raw/eia-930/eia_demand_meta.parquet
            /data/raw/ercot-AS/ercot_*_as_by_restype_hourly.parquet
            /data/raw/ercot/ASPLANNP433_*.parquet
            /data/raw/load-forecast/
            /data/raw/spp-hsl/spp_wind_curtailment_annual.csv
            /data/raw/spp-gen-outage/
            /data/raw/spp-mmu-unavailable-capacity/
            /data/raw/ercot/ercot_2024_ordc_reserves_hourly.parquet
            /data/raw/CAISO-AS/asreq_ALL_2023*.csv
            /data/raw/CAISO-AS/asreq_ALL_2024*.csv
            /data/raw/CAISO-AS/asreq_ALL_2025*.csv
            /data/raw/CAISO-AS/asreq_ALL_20221231_20230101.csv
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # The fast tier is BLOCKING. Fix the red; never re-add continue-on-error.
      - name: Fast pytest tier
        run: uv run python -m pytest -n 2 -m "not slow and not integration and not fulldata"

  repo-checks:
    name: Repo checks (keeper integrity, parity, matrix, cache-key registration, imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Reads no data/raw except the 188 KB committed price reference
          # (calibration_verdict is fail-closed on an unreadable reference).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/*
            /data/raw/_validation-source/
            !/data/raw/_validation-source/*
            /data/raw/_validation-source/actual_lmp.json
      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # Keeper text vs committed artifacts (E1-E14; rule 35 E13 invariant).
      - name: audit_keepers --check
        run: uv run python scripts/audit_keepers.py --check
      # Registry sidecar <-> run payload <-> bundle dir parity (rule 15).
      - name: check_registry_payload_parity
        run: uv run python scripts/check_registry_payload_parity.py
      # Rule 28: a new ScenarioConfig field must have a matrix row (FAIL);
      # stale line anchors only warn.
      - name: check_mechanism_matrix
        run: python3 scripts/check_mechanism_matrix.py --base ${{ github.event.pull_request.base.sha }}
      # A new ScenarioConfig field must be registered in the cache key, and a
      # registered field's live default must match its declaration.
      - name: check_cache_key_registration
        run: python3 scripts/check_cache_key_registration.py --base ${{ github.event.pull_request.base.sha }}
      # Rule 37: the rubric surface and the keeper surface never change in one
      # PR. RUBRIC_FREEZE_OVERRIDE=<owner ruling citation> is the owner's
      # promotion-with-amendment override, set on this step only for that PR.
      - name: check_rubric_freeze
        env:
          RUBRIC_FREEZE_OVERRIDE: "owner ruling R-58/R-58a, 2026-10-03, PRECOMMIT docs/records/governance/closeout-2026-10/PRECOMMIT-rubric-c3c-order-2026-10-03.md"
        run: python3 scripts/check_rubric_freeze.py --base ${{ github.event.pull_request.base.sha }}
      - name: check_cache_key_declared_defaults (HEAD-only invariant)
        if: always()
        run: python3 scripts/check_cache_key_registration.py
      # Syntax + import walk + dangling script references.
      - name: compileall
        run: uv run python -m compileall -q src scripts
      - name: import-walk + script-reference lint
        run: uv run python scripts/ci_refactor_guards.py
      # Backcast->forecast parity of armed keeper fields: informational.
      - name: check_forecast_parity (non-blocking)
        continue-on-error: true
        run: uv run python scripts/check_forecast_parity.py
