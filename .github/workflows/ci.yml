name: CI

# Restored per-PR safety net (owner decision D-2, refactor-consolidation plan
# §2-A). All four workflows CLAUDE.md rule 22 and the .claude hooks cite
# (ci.yml, lint.yml, clean-parity.yml, forecast-invariants.yml) were DELETED
# wholesale on 2026-07-14 (commit 27c0152 "Remove all GitHub Actions workflows
# and patch cruft" — the sweep that killed the per-task solve/apply workflows
# burning Actions minutes) and never restored; the CI safety net was collateral.
# This one durable workflow is sanctioned CI infrastructure — NOT a per-task
# workflow — and folds the former standalone lint.yml back in as the `lint` job.
#
# Every job is seconds-to-a-few-minutes and path-filtered; the jobs run in
# parallel, so wall time is the slowest job (fast-tests). NO LP solves, no data
# regeneration, no cron — heavy work runs in Claude sessions, per the repo CI
# cost policy.

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "conftest.py"
      - "frontend/data/backcast/**"
      # FFR-1D (audit FR-24): the forecast namespaces were absent from these
      # filters entirely, so a forecast-registration commit triggered NO CI at
      # all — not even the registry gates that keep the two namespaces apart.
      - "frontend/data/hindcast/**"
      - "frontend/data/forecast/**"
      - "tests/golden/**"
      - "docs/codebase-site/data/mechanism-matrix.js"
      - "docs/codebase-site/data/mechanism-matrix/**"
      - "CLAUDE.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  quarantine-gates:
    name: Rule-22 quarantine gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # E1-E9 keeper-text integrity + H1 holdout-quarantine (audit D-6/D-9,
      # re-arms CLAUDE.md rules 22/24/25). Fast (reads committed artifacts).
      - name: audit_keepers --check
        run: uv run python scripts/audit_keepers.py --check
      # D-9 overlay quarantine + D-6 holdout quarantine (the rule-22 marker
      # enforcement). --no-d2-recompute skips the D-2 recompute-vs-committed
      # check, which rebuilds per-plant floors via run_year (needs each keeper's
      # FETCHED raw inputs — uncommitted — and minutes of compute), so it is
      # unfit for the fast hermetic PR tier; run the full --keepers in a
      # data-provisioned lane. See scripts/legitimacy_diagnostics.py.
      - name: legitimacy_diagnostics --keepers (fast tier)
        run: uv run python scripts/legitimacy_diagnostics.py --keepers --no-d2-recompute
      # Registry sidecar <-> run payload 1:1 parity (a sidecar-only run never
      # renders in the Run Explorer). Tolerates only the tracked known-unsynced
      # ids (scripts/lib/known_unsynced_keepers.py); any new gap fails.
      - name: check_registry_payload_parity
        run: uv run python scripts/check_registry_payload_parity.py

  forecast-invariant-artifacts:
    name: Forecast-invariant artifact audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # FR-24: check_forecast_invariants.py had NO CI wiring anywhere — the
      # standalone forecast-invariants.yml workflow was deleted 2026-07-14 and
      # never restored, while the FF plan claimed the invariants were
      # "CI-wired". Re-running the checker over a run needs that run's cache
      # directory (per-year parquet + ledgers, gigabytes, uncommitted), so it
      # can NEVER be a CI job — but auditing the invariant verdicts each
      # registration COMMITS can. This is that gate: schema + full-battery
      # coverage + a declared-failure ledger, so a newly registered run that
      # fails an invariant is a reviewed line in
      # frontend/data/hindcast/invariant-failures.json rather than a number
      # that lands on the forecast dashboard unremarked.
      #
      # ARTIFACT-LEVEL, NO LP, NO SOLVE, NO data fetch — it reads committed
      # JSON only, and runs in seconds (repo CI cost policy). The `uv sync`
      # above is for the checker module's own imports, not for the audit.
      - name: check_forecast_invariants --sidecar-dir
        run: uv run python scripts/check_forecast_invariants.py --sidecar-dir

  forecast-staleness-warn:
    name: FR-21 forecast-board staleness (WARN only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fetch full history: the check measures the commit distance from the
      # board's newest scored-at sha to HEAD, and a shallow clone cannot reach
      # a sha more than one commit back. With fetch-depth unset the distance
      # reads "(unknown)" — honestly reported, but useless as a signal.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # FR-21: the T1 gate evidence went stale and NOTHING detected it. FF-2D
      # scored 2026-07-20; over the following ten days ~20 keeper promotions
      # landed, the pinned default config cache key moved twice and was
      # broken-and-restored once, and the NYISO forecast orchestrator was
      # rewired — with no FC verdict re-scored and no signal anywhere. This
      # step is the signal: it reads the provenance stamps
      # (scripts/lib/forecast_provenance.py) off the committed board artifacts
      # and reports how far solve-affecting paths have moved past the newest
      # scored sha.
      #
      # WARN-LEVEL BY DESIGN — the step never fails the build (the script exits
      # 0 unless --fail-on-stale, which is deliberately NOT passed). Backcast
      # calibration velocity must not be blocked by forecast-board freshness:
      # the two lanes run concurrently, and the backcast lane is the one
      # producing the keepers that make the board stale. Visibility, not a gate.
      #
      # Stdlib-only, no uv sync, no LP, no data fetch — it reads committed JSON
      # and runs `git rev-list`, in seconds (repo CI cost policy).
      - name: check_forecast_staleness
        run: python3 scripts/check_forecast_staleness.py

  forecast-parity-guard:
    name: FR-22 backcast->forecast parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # FR-22: a mechanism armed in an ISO's keeper posture must have a
      # forecast-orchestrator consumer or an explicit backcast-only-by-design
      # declaration (scripts/lib/forecast_parity_registry.py). The nyiso-102
      # gap (three NYISO downstate mechanisms wired only in the backcast
      # orchestrator) was found by accident; this makes it a gate. Stdlib-only,
      # no LP. Filed gaps (ffr-1e findings doc §4) report but do not fail —
      # --strict-gaps flips that once they are closed.
      #
      # Held back by FFR-1E (which built the checker) because ci.yml was
      # FFR-1D's file in Wave 1; landed here at the Wave-1 close (§W1-X item 4)
      # verbatim from ffr-1e-forecast-parity-check-2026-07-31.md §6. The four
      # path filters that section asks for are already subsumed by the broader
      # globs at the top of this file — src/market_sim/** and
      # scripts/{run_calibration*.py,lib/forecast_parity_registry.py} by
      # `src/**` and `scripts/**`, frontend/data/backcast/keepers/** by
      # `frontend/data/backcast/**` — so no filter edit is needed; narrower
      # duplicates would only be noise.
      - name: check_forecast_parity
        run: python3 scripts/check_forecast_parity.py

  mechanism-matrix-guard:
    name: Rule-28 mechanism-matrix guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      # Rule 28 [R-MECH-MATRIX]: matrix integrity always; on the diff, a new
      # ScenarioConfig field missing from the matrix FAILS (28c), and a new
      # registry sidecar / calibration CLI flag without a matrix touch WARNS
      # (28b). Stdlib-only — no uv sync needed, runs in seconds.
      - name: check_mechanism_matrix
        run: python3 scripts/check_mechanism_matrix.py --base ${{ github.event.pull_request.base.sha }}

  cache-key-guard:
    name: Cache-key registration guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      # A new ScenarioConfig field that is not listed in
      # _CACHE_KEY_OPTIONAL_FIELDS moves the DEFAULT cache key and orphans every
      # on-disk cache, even when the field ships default-off. That has happened
      # FIVE times (coal_committed_takeorpay_sunk_fixed, measured_ct_heat_rates,
      # pjm_apsouth_interface_cut, pjm_external_net_position_cut / temp_derate_*
      # / ramp_limits, pjm_zonal_loss_surface) and each time surfaced only as a
      # pinned-literal test failure in an unrelated session, whose tempting and
      # WRONG remedy is to re-pin the literal. This moves detection to the PR
      # that adds the field. Stdlib-only — no uv sync needed, runs in seconds.
      #
      # FFR-3D added check 3, the DEFAULT-FLIP half (FFR-3A blocker 4). A
      # registration is only meaningful against a fixed default: cache_key()
      # drops a registered field when it equals the LIVE default, so MOVING that
      # default makes the new-default run hash identically to the old-default run
      # it supersedes — a silent same-key collision the registration itself
      # cannot see. It has already happened once (the D-1/D-2 flips left the
      # default key at 603c2498bf71d21d across a behavioral change). Check 3
      # requires every registered field's live default to match its declared
      # entry in _CACHE_KEY_OPTIONAL_FIELD_DEFAULTS, so a flip cannot land until
      # it is declared and its collision classified (byte-identical, or a
      # cache-epoch entry + purge).
      #
      # Check 3 is a HEAD-only invariant, so the first step already covers it.
      # The second re-runs it base-less so the invariant still holds if the
      # PR-base fetch fails — a lane must not depend on a later session noticing
      # a moved default (blocker 4 is "structural, needs a decision not a patch").
      - name: check_cache_key_registration
        run: python3 scripts/check_cache_key_registration.py --base ${{ github.event.pull_request.base.sha }}
      - name: check_cache_key_declared_defaults (HEAD-only invariant)
        if: always()
        run: python3 scripts/check_cache_key_registration.py

  cache-key-pin:
    name: Pinned default cache key
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # HOUSE-1 (X.2, the red-main CI gap). These same tests were ALREADY in
      # two job-level-blocking places when nyiso-128's unregistered field
      # landed (PR #3624): test_persisted_identity.py in refactor-guards, both
      # files collected by fast-tests — and both jobs correctly FAILED, as did
      # cache-key-guard. None of it stopped the merge, for two reasons this
      # job addresses one of and names the other:
      #
      # 1. SIGNAL ISOLATION (addressed here). Every job those tests ride is
      #    also red for unrelated reasons whenever main carries baseline
      #    failures (it did then; it does today), so a moved pinned key is
      #    indistinguishable from ambient red without opening logs. THIS check
      #    is red if and only if the persisted-identity / pinned-cache-key
      #    contract is broken: red cache-key-pin = a moved default key, no log
      #    forensics needed.
      # 2. ENFORCEMENT (not addressable from inside a workflow file). PR #3624
      #    was merged 86 s after creation — before ANY check completed. A
      #    GitHub check, "blocking" or not, only gates a merge when the branch
      #    is protected by required status checks and the merge waits for
      #    them. That is a repo-settings act (owner): mark THIS check name
      #    ("Pinned default cache key") required on main. Until then this job,
      #    like every job in this file, is advisory in effect.
      #
      # Runs the two pin/guard files only (~2 s of pytest after uv sync), so
      # its verdict lands minutes before the tiers that need the full suite.
      - name: Pinned-key + declared-default guard tests
        run: >-
          uv run python -m pytest -q
          tests/regression/test_persisted_identity.py
          tests/unit/config/test_cache_key_default_flip_guard.py

  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  fast-tests:
    name: Fast test tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # Parallel fast tier. The `fulldata` mark is not yet registered (lands
      # with Wave 2D); naming it in the -m expression is harmless (it simply
      # matches nothing today), so this line needs no edit when 2D adds it.
      #
      # BLOCKING since 2026-07-27. Ran advisory from the workflow's restoration
      # through two held flips; the full history — the 141-failure triage, the
      # perf-budget measurement, and the path-dependent cache-key pin that held
      # the last one — is in docs/handoffs/fast-tier-triage-2026-07-26.md
      # §9-§9.3. Do not re-add `continue-on-error` to silence a red: fix the
      # red, or escalate it there.
      - name: Fast pytest tier
        run: uv run python -m pytest -n 2 -m "not slow and not integration and not fulldata"

  refactor-guards:
    name: Structural refactor guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # Byte-compile every module (a syntax break anywhere fails fast).
      - name: compileall
        run: uv run python -m compileall -q src scripts
      # pkgutil import-walk of market_sim + a script-reference lint (a moved or
      # deleted script that leaves a live code/config invocation dangling).
      - name: import-walk + script-reference lint
        run: uv run python scripts/ci_refactor_guards.py
      # Facade re-export + persisted-identity pins (BLOCKING, unlike the
      # advisory fast tier): every split package must keep its full pre-split
      # surface, and the pickle-borne classes their frozen module paths.
      # test_pipeline_facade_shims.py joined this list on 2026-07-26, when the
      # orchestrator-extraction alias conversion it pins finally landed
      # (fast-tier escalation D4) — the shims are now the guard that a later
      # cleanup cannot silently drop one.
      #
      # These ten live in tests/regression/ since the Wave-5A tests/ migration
      # (they are frozen-surface guards, not unit tests). This list is one of
      # the two path inventories that migration has to keep in step — moving
      # any of them without editing this block silently disarms the only
      # BLOCKING test gate in CI.
      - name: facade re-export + persisted-identity tests
        run: >-
          uv run python -m pytest -q
          tests/regression/test_persisted_identity.py
          tests/regression/test_pipeline_facade_shims.py
          tests/regression/test_constants_facade.py
          tests/regression/test_dispatch_facade.py
          tests/regression/test_eia930_facade.py
          tests/regression/test_fuel_facade.py
          tests/regression/test_fleet_facade.py
          tests/regression/test_capacity_evolution_facade.py
          tests/regression/test_transmission_facade.py
          tests/regression/test_scenarios_facade.py
