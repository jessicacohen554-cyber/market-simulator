  refactor-guards:
    name: Structural refactor guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # DATA-FREE CHECKOUT (see header): this job reads no data/raw.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      # Byte-compile every module (a syntax break anywhere fails fast).
      - name: compileall
        run: uv run python -m compileall -q src scripts
      # pkgutil import-walk of market_sim + a script-reference lint (a moved or
      # deleted script that leaves a live code/config invocation dangling).
      - name: import-walk + script-reference lint
        run: uv run python scripts/ci_refactor_guards.py
      # Facade re-export + persisted-identity pins (BLOCKING, unlike the
      # advisory fast tier): every split package must keep its full pre-split
      # surface, and the pickle-borne classes their frozen module paths.
      # test_pipeline_facade_shims.py joined this list on 2026-07-26, when the
      # orchestrator-extraction alias conversion it pins finally landed
      # (fast-tier escalation D4) — the shims are now the guard that a later
      # cleanup cannot silently drop one.
      #
      # These ten live in tests/regression/ since the Wave-5A tests/ migration
      # (they are frozen-surface guards, not unit tests). This list is one of
      # the two path inventories that migration has to keep in step — moving
      # any of them without editing this block silently disarms the only
      # BLOCKING test gate in CI.
      - name: facade re-export + persisted-identity tests
        run: >-
          uv run python -m pytest -q
          tests/regression/test_persisted_identity.py
          tests/regression/test_pipeline_facade_shims.py
          tests/regression/test_constants_facade.py
          tests/regression/test_dispatch_facade.py
          tests/regression/test_eia930_facade.py
          tests/regression/test_fuel_facade.py
          tests/regression/test_fleet_facade.py
          tests/regression/test_capacity_evolution_facade.py
          tests/regression/test_transmission_facade.py
          tests/regression/test_scenarios_facade.py
