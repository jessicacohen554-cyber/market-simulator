name: holdout-intake-nyiso-2018-2021-h1-2026

# One-shot NYISO 2018/2019/2020/2021 + H1-2026 holdout-intake BINARY lander
# (CLAUDE.md rule 22, Option-2 DATA-intake channel — generalized from
# holdout-intake-nyiso-2022.yml, which landed the 2022 block the same way).
#
# The 2026-07-13 owner authorization (verbatim in
# frontend/data/backcast/calibration-complete.json intake_log, scope
# "NYISO 2018/2019/2020/2021 ... + H1-2026 ...") covers DATA intake only:
# validation-ladder extension (2018-2021) + the locked-test edge (H1-2026).
# It is NOT a solve: no LP is constructed; everything here is loader-level
# data intake, same as the 2022 lander.
#
# The GitHub API file tools cannot carry binary content (and large generated
# text wastes an agent session's context), so this workflow reproduces the
# intake session's BINARY + LARGE-GENERATED artifacts on an Actions runner
# from the same committed scripts (pinned deps via uv.lock so parquet bytes
# match) and pushes them to the intake branch:
#   * data/raw/campd-facility-level/{NY,NJ}_{2018,2019,2020,2021,2026}.parquet
#       (derived from the already-committed unit-level extracts; recipe
#       --prove gated; no fetch needed — this is a pure re-derivation)
#   * data/raw/_processed-legacy/plant_emission_rates_v2.parquet + .csv
#       (NYISO 2026 Q1-only row; 2018-2021 NYISO rows are already present
#       and untouched — curate_emissions_unit_annual.py + derive_plant_emissions_v2.py,
#       --holdout-intake NYISO, unblocked by the NYISO calibration-complete marker)
#   * data/raw/_validation-source/actual_lmp_hourly_NYISO.parquet
#       (2018-2021 full-year blocks + 2026 H1-only block appended; every
#       pre-existing row asserted frozen)
#     + data/raw/_validation-source/actual_lmp.json (NYISO year map gains
#       2018/2019/2020/2021/2026 — all other ISOs and pre-existing NYISO years
#       asserted byte-identical)
#   * data/raw/_validation-source/actual_as_reserve_NYISO.parquet
#       (full 2018-2026 rebuild — source AS CSVs already span every year;
#       pre-existing (year, hour) rows asserted value-identical)
#
# Small hand-verified TEXT artifacts (the register, the intake_log entry, the
# small CSV landings) already landed via the API from the intake session
# itself (commits 311c460/591e927/2e787de on this branch).

on:
  # The GitHub App the intake session pushes with cannot POST a workflow
  # dispatch (403), so the run is triggered by pushing this file to the
  # intake branch — the repo's established push-triggered queue pattern
  # (fetch-campd-unit-level.yml, holdout-intake-nyiso-2022.yml). Scoped to
  # THIS file so data commits from the run itself never re-trigger it; every
  # step is idempotent regardless (skip-if-already-landed checks throughout).
  push:
    branches: ["claude/nyiso-holdout-intake-j7vbdi"]
    paths: [".github/workflows/holdout-intake-nyiso-2018-2021-h1-2026.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — run everything but do not commit or push"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: holdout-intake-nyiso-2018-2021-h1-2026
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rule-22 intake-authorization guard (Option-2 channel)
        run: |
          python - <<'EOF'
          import json, sys
          data = json.load(open("frontend/data/backcast/calibration-complete.json"))
          entries = [
              e for e in data.get("intake_log", [])
              if "NYISO 2018/2019/2020/2021" in e.get("scope", "")
              and e.get("date") == "2026-07-13"
          ]
          if not entries:
              sys.exit("no session-logged NYISO 2018-2021+H1-2026 intake "
                       "authorization in intake_log — rule 22 forbids this intake")
          print("NYISO 2018-2021 + H1-2026 intake authorization present:",
                entries[0]["date"])
          EOF

      - uses: astral-sh/setup-uv@v4

      - name: Install pinned dependencies (uv.lock — parquet bytes must match
              the intake session's pinned pyarrow/pandas)
        run: uv sync --frozen

      - name: Derive CAMPD facility-level NY/NJ 2018/2019/2020/2021/2026
              (recipe --prove gated; pure re-derivation, no fetch)
        run: |
          uv run python scripts/derive_campd_facility_from_units.py --states NY NJ --prove
          for y in 2018 2019 2020 2021 2026; do
            if [ -f "data/raw/campd-facility-level/NY_${y}.parquet" ] && \
               [ -f "data/raw/campd-facility-level/NJ_${y}.parquet" ]; then
              echo "NY/NJ ${y} already landed — skipping"
              continue
            fi
            uv run python scripts/derive_campd_facility_from_units.py \
              --states NY NJ --year "${y}" --persefoni-sibling 2023
          done

      - name: Curate emissions-unit-annual 2026 + derive NYISO 2026 v2 rows
              (marker-gated holdout-intake path; 2018-2021 already present)
        run: |
          cat > /tmp/check_nyiso_2026_v2.py <<'EOF'
          import sys
          import pandas as pd
          df = pd.read_parquet("data/raw/_processed-legacy/plant_emission_rates_v2.parquet")
          nyiso = df[df["iso"] == "NYISO"]
          sys.exit(0 if (nyiso["year"] == 2026).any() else 1)
          EOF
          if uv run python /tmp/check_nyiso_2026_v2.py; then
            echo "NYISO 2026 v2 rows already landed — skipping"
          else
            uv run python scripts/curate_emissions_unit_annual.py --years 2026 --holdout-intake NYISO
            uv run python scripts/derive_plant_emissions_v2.py --iso NYISO --years 2026 --holdout-intake NYISO
          fi

      - name: Fetch the 2018-2021 + H1-2026 MIS monthly LBMP archives
              (DA damlbmp + RT realtime)
        run: |
          set -e
          cd data/raw/lmp-data/NYISO
          for y in 2018 2019 2020 2021; do
            for m in 01 02 03 04 05 06 07 08 09 10 11 12; do
              [ -f "${y}${m}01damlbmp_zone_csv.zip" ] || \
                curl -sS --fail --retry 5 --retry-delay 3 -O \
                  "http://mis.nyiso.com/public/csv/damlbmp/${y}${m}01damlbmp_zone_csv.zip"
              [ -f "${y}${m}01realtime_zone_csv.zip" ] || \
                curl -sS --fail --retry 5 --retry-delay 3 -O \
                  "http://mis.nyiso.com/public/csv/realtime/${y}${m}01realtime_zone_csv.zip"
            done
          done
          for m in 01 02 03 04 05 06; do
            [ -f "2026${m}01damlbmp_zone_csv.zip" ] || \
              curl -sS --fail --retry 5 --retry-delay 3 -O \
                "http://mis.nyiso.com/public/csv/damlbmp/2026${m}01damlbmp_zone_csv.zip"
            [ -f "2026${m}01realtime_zone_csv.zip" ] || \
              curl -sS --fail --retry 5 --retry-delay 3 -O \
                "http://mis.nyiso.com/public/csv/realtime/2026${m}01realtime_zone_csv.zip"
          done
          # derive_actual_lmp reads the DA monthly zips from this outer
          # container (never committed — same convention as the 2022 lander).
          zip -q -0 NYISO_zonal_hourly.zip 201[89]*damlbmp_zone_csv.zip 202[01]*damlbmp_zone_csv.zip 2026*damlbmp_zone_csv.zip
          ls -la 2018*zip 2019*zip 2020*zip 2021*zip 2026*zip NYISO_zonal_hourly.zip

      - name: Build + frozen-merge the NYISO LMP bench 2018-2021 + H1-2026 blocks
        run: |
          uv run python scripts/holdout_intake_nyiso_2018_2021_h1_2026_lmp.py

      - name: Rebuild the AS-reserve validation parquet (full 2018-2026,
              pre-existing rows value-identical)
        run: |
          uv run python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts"); sys.path.insert(0, "src")
          import pandas as pd
          committed = pd.read_parquet("data/raw/_validation-source/actual_as_reserve_NYISO.parquet")
          got_years = sorted(committed["year"].unique().tolist())
          target_years = list(range(2018, 2027))
          if got_years == target_years:
              print("actual_as_reserve_NYISO.parquet already spans 2018-2026 — skipping")
              raise SystemExit(0)
          from process_nyiso_as import build_reference
          build_reference(target_years)
          new = pd.read_parquet("data/raw/_validation-source/actual_as_reserve_NYISO.parquet")
          ins = new[new["year"].isin(got_years)].reset_index(drop=True)
          com = committed.reset_index(drop=True)
          ok = ins.shape == com.shape and all(
              ((ins[c].isna() & com[c].isna()) | (ins[c] == com[c])).all()
              for c in com.columns
          )
          assert ok, "pre-existing AS-reserve rows changed — refusing"
          print(f"pre-existing rows ({got_years}) identical; now spans "
                f"{sorted(new['year'].unique().tolist())}")
          EOF

      - name: Integrity report (sha256 of every landed artifact)
        run: |
          sha256sum \
            data/raw/campd-facility-level/NY_2018.parquet \
            data/raw/campd-facility-level/NY_2019.parquet \
            data/raw/campd-facility-level/NY_2020.parquet \
            data/raw/campd-facility-level/NY_2021.parquet \
            data/raw/campd-facility-level/NY_2026.parquet \
            data/raw/campd-facility-level/NJ_2018.parquet \
            data/raw/campd-facility-level/NJ_2019.parquet \
            data/raw/campd-facility-level/NJ_2020.parquet \
            data/raw/campd-facility-level/NJ_2021.parquet \
            data/raw/campd-facility-level/NJ_2026.parquet \
            data/raw/_processed-legacy/plant_emission_rates_v2.parquet \
            data/raw/_processed-legacy/plant_emission_rates_v2.csv \
            data/raw/_validation-source/actual_lmp_hourly_NYISO.parquet \
            data/raw/_validation-source/actual_lmp.json \
            data/raw/_validation-source/actual_as_reserve_NYISO.parquet

      - name: Commit landed artifacts to the branch
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/raw/campd-facility-level/NY_2018.parquet \
            data/raw/campd-facility-level/NY_2019.parquet \
            data/raw/campd-facility-level/NY_2020.parquet \
            data/raw/campd-facility-level/NY_2021.parquet \
            data/raw/campd-facility-level/NY_2026.parquet \
            data/raw/campd-facility-level/NJ_2018.parquet \
            data/raw/campd-facility-level/NJ_2019.parquet \
            data/raw/campd-facility-level/NJ_2020.parquet \
            data/raw/campd-facility-level/NJ_2021.parquet \
            data/raw/campd-facility-level/NJ_2026.parquet \
            data/raw/_processed-legacy/plant_emission_rates_v2.parquet \
            data/raw/_processed-legacy/plant_emission_rates_v2.csv \
            data/raw/_validation-source/actual_lmp_hourly_NYISO.parquet \
            data/raw/_validation-source/actual_lmp.json \
            data/raw/_validation-source/actual_as_reserve_NYISO.parquet
          if git diff --cached --quiet; then
            echo "nothing to commit (artifacts already landed)"
            exit 0
          fi
          git commit -m "data(nyiso): 2018-2021 + H1-2026 holdout-intake binaries (rule-22 Option-2 intake, workflow run ${{ github.run_id }})"
          git push origin "HEAD:${{ github.ref_name }}"
