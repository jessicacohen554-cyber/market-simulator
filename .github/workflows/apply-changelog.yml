# TEMPORARY self-removing helper: splices .github/changelog-entry.txt into
# CHANGELOG.md after line 2 (the file is too large to round-trip through the
# API-only push path in one call), verifies the exact target git blob SHA,
# and deletes this workflow + the entry file in the same commit.
# Triggered by the push of this very commit (App token cannot dispatch).
name: apply-changelog
on:
  push:
    branches:
      - claude/calibration-docs-code-audit-t125f4
    paths:
      - .github/workflows/apply-changelog.yml
      - .github/changelog-entry.txt
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/calibration-docs-code-audit-t125f4
      - name: Splice entry, verify blob SHA, commit, push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CHANGELOG.md)" = "85b21b75da0c9dde98dc6fdb3b69964fbd0a911a"
          sed -i '2r .github/changelog-entry.txt' CHANGELOG.md
          test "$(git hash-object CHANGELOG.md)" = "43cac405d6710a425dd6822dedb5294a63bb3b1d"
          cat > /tmp/msg <<'MSG'
          docs: final truth-gate QA on the calibration/validity documentation refresh

          Fix drifted line citations (methodology doc + model-validity), add the two
          missing D4_WINDOWS rows to the rubric page's D-4 table, correct the
          illustrative scorecard's C6 note (E8/E9 are audit_keepers checks, not C6),
          correct rule-number citations (measured-data rule is #13; no-floor-without-
          a-window is rule 17), and record the findings in QA-REPORT-2026-07.md +
          CHANGELOG. Keeper/frontier text verified against run data: 0 mismatches.

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01RhsqM4Jm5paqgL46CtfVxH
          MSG
          git config user.name "Claude Fable 5"
          git config user.email "noreply@anthropic.com"
          git rm -q .github/workflows/apply-changelog.yml .github/changelog-entry.txt
          git add CHANGELOG.md
          git commit -F /tmp/msg
          git push origin HEAD:claude/calibration-docs-code-audit-t125f4
