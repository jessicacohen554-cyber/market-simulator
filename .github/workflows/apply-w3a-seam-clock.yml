name: apply-w3a-seam-clock

# Applies the W3a session's source changes onto this branch, server-side, so
# they land without the agent sandbox's blocked git push — the
# apply-export-cap.yml precedent. Two carriers, both idempotent (the apply
# commit's own push re-triggers this workflow, which then no-ops):
#   1. .github/patches/2026-07-07-w3a-seam-clock.patch — the two in-place
#      code edits (eia_loader envelope-clock fix; run_calibration_full
#      --replay-bundle).
#   2. .github/patches/2026_07_07_w3a_register_log_edits.py — the
#      gap-register / calibration-log edits, expressed as short-anchor
#      splices because those rows are multi-kilobyte single lines a hand-
#      transcribed diff could silently corrupt.
# The session's new/small files (FINDINGs, guard script, tests) are pushed
# directly via the MCP path and do not travel through this workflow.
on:
  push:
    branches:
      - claude/caiso-seam-diurnal-shape-w3a-y2cc1s
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: claude/caiso-seam-diurnal-shape-w3a-y2cc1s
          fetch-depth: 0
      - name: Apply code patch + register/log edits, push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          PATCH=.github/patches/2026-07-07-w3a-seam-clock.patch
          EDITS=.github/patches/2026_07_07_w3a_register_log_edits.py
          test -f "$PATCH"
          test -f "$EDITS"
          if git apply --check "$PATCH" 2>/dev/null; then
            git apply --index "$PATCH"
            echo "code patch applied"
          elif git apply --check --reverse "$PATCH" 2>/dev/null; then
            echo "code patch already applied - skip"
          else
            echo "::error::patch neither applies nor reverses cleanly on $(git rev-parse HEAD)"
            exit 1
          fi
          python3 "$EDITS"
          git add docs/gap-register-2026-07.md docs/calibration-log.md
          if git diff --cached --quiet; then
            echo "nothing to commit - all carriers already applied"
            exit 0
          fi
          MSG_FILE=$(mktemp)
          {
            echo "W3a seam-clock: apply session source changes (server-side carriers)"
            echo ""
            echo "1. fix(caiso): map per-DIBA interchange stamps onto the model clock for"
            echo "   the corridor deliverability envelope (measured -1h standard / -2h"
            echo "   daylight; eia_loader._caiso_interchange_model_clock + pinned"
            echo "   constants - unit tests and the validate_caiso_seam_hod_frame.py"
            echo "   drift guard arrive via the direct MCP pushes)."
            echo "2. docs(caiso): withdraw the seam-diurnal attribution (its measured"
            echo "   actual hod table was UTC-bucketed, reproduced to the MW) -"
            echo "   G-15/G-20d/G-61 register rows + calibration-log entry; C3a body"
            echo "   reattributed to belly gas commitment."
            echo "3. feat(calibration): --replay-bundle on run_calibration_full.py so"
            echo "   calibration-run.yml can reproduce a committed recipe at this ref"
            echo "   (the caiso-65 registration + its --zero-forcing-ablation twin)."
            echo ""
            echo "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
            echo "Claude-Session: https://claude.ai/code/session_016eHWwkn7NsJZZPeVNd6oLA"
          } > "$MSG_FILE"
          git commit -F "$MSG_FILE"
          git push origin HEAD:claude/caiso-seam-diurnal-shape-w3a-y2cc1s
