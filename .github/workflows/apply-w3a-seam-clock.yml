name: apply-w3a-seam-clock

# Applies .github/patches/2026-07-07-w3a-seam-clock.patch onto the W3a session
# branch, server-side, so the seam-clock source lands without the agent
# sandbox's blocked git push — the apply-export-cap.yml precedent. Idempotent:
# the apply commit's own push re-triggers this workflow, which then finds the
# patch already applied and no-ops.
on:
  push:
    branches:
      - claude/caiso-seam-diurnal-shape-w3a-y2cc1s
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: claude/caiso-seam-diurnal-shape-w3a-y2cc1s
          fetch-depth: 0
      - name: Apply patch and push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          PATCH=.github/patches/2026-07-07-w3a-seam-clock.patch
          test -f "$PATCH"
          if ! git apply --check "$PATCH" 2>/dev/null; then
            if git apply --check --reverse "$PATCH" 2>/dev/null; then
              echo "patch already applied — no-op"
              exit 0
            fi
            echo "::error::patch neither applies nor reverses cleanly on $(git rev-parse HEAD)"
            exit 1
          fi
          git apply --index "$PATCH"
          git commit -m "W3a seam-clock: apply session source patch (server-side git apply)

Carries the three session commits flattened (the patch file in
.github/patches/ preserves the reviewable diff):
1. fix(caiso): map per-DIBA interchange stamps onto the model clock for the
   corridor deliverability envelope (measured -1h standard / -2h daylight;
   eia_loader._caiso_interchange_model_clock + pinned constants + unit tests
   + scripts/validate_caiso_seam_hod_frame.py drift guard).
2. docs(caiso): withdraw the seam-diurnal attribution (its 'measured actual'
   hod table was UTC-bucketed, reproduced to the MW) — tz-correction FINDING,
   superseded banner, G-15/G-20d/G-61 register rows, calibration-log entry;
   C3a body reattributed to belly gas commitment.
3. feat(calibration): --replay-bundle on run_calibration_full.py so
   calibration-run.yml can reproduce a committed recipe at this ref (the
   caiso-65 registration + its --zero-forcing-ablation twin ride this).

