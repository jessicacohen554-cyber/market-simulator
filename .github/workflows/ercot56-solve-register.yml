name: ercot56-solve-register

# One-shot: solve the ercot56 nuclear-window line (keeper recipe + the
# window-grain measured nuclear refuel availability) + its zero-forcing
# ablation twin, full 2023-2025 each, on CI — then register both on the
# backcast dashboard, prune the ERCOT registry to the top-15 retention, and
# upload the per-run files + the ERCOT-56 calibration-log entry via the
# GitHub Data API. ercot55-solve-register / caiso67/69 precedent: the
# authoring session's environment cannot git-push (413 on the ~1 MB run
# payloads) and the MCP relay caps single-call content ~200 KB, so the
# oversized pieces land from the runner. Keeper stays ercot55-surface-ab;
# promotion is an owner call.
#
# Config: scripts/probes/_ercot55_ab.py (the ercot53 keeper meta.json
# reconstruction) --surface --set ercot_nuclear_unit_availability=true —
# i.e. the promoted keeper recipe + ONE measured-input delta, zero new free
# parameters (the daily series is measured 60-Day DAM disclosure NUC status,
# monthly energy reconciled to the standing EIA-923 anchor;
# scripts/derive_ercot_nuclear_availability.py). The authoring session's
# local solves reproduced the CI keeper byte-parity first (ercot54
# precedent), so these CI bundles are expected to match the numbers in the
# committed ERCOT-56 log entry exactly.
on:
  push:
    branches:
      - claude/ercot-may-2024-outage-forensics-4sg2dk
    paths:
      - .github/workflows/ercot56-solve-register.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot56-solve-register
  cancel-in-progress: false

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply the session's relay-oversized changes (git patch, guarded)
        run: |
          set -euo pipefail
          # The six modified sources (scenarios.py / fleet.py /
          # run_calibration_full.py / run_calibration.py / outages.py /
          # tests) exceed what the session's MCP relay can carry whole, so
          # they land as one committed unified patch (verified byte-identical
          # against the authoring working tree); the upload step below
          # commits the PATCHED files so the branch carries the real sources.
          # _ercot55_ci_patch precedent, git-patch edition.
          if grep -q "ercot_nuclear_unit_availability" src/market_sim/config/scenarios.py; then
            echo "already applied — no-op"
          else
            git apply --verbose scripts/probes/_ercot56_code.patch
          fi

      - name: Derive the measured nuclear daily-availability series
        run: |
          set -euo pipefail
          # Deterministic from the committed disclosure parquets + the frozen
          # deriver, so generating here == the authoring session's local CSV
          # byte-for-byte (the session's relay cannot carry the 134 KB file);
          # the upload step commits it. Idempotent: with the CSV already
          # committed a re-run regenerates identical bytes.
          python scripts/derive_ercot_nuclear_availability.py

      - name: Solve ercot56 nucwin main (keeper recipe + nuclear windows, 2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ab.py ercot56_nucwin \
            --surface --set ercot_nuclear_unit_availability=true

      - name: Solve the zero-forcing ablation twin (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot55_ab.py ercot56_nucwin_ablation \
            --surface --set ercot_nuclear_unit_availability=true \
            --ablation --ablation-of ercot56_nucwin

      - name: Write attestations (main + twin)
        run: |
          set -euo pipefail
          python scripts/probes/_ercot56_register.py --write-attestations

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty.
          for b in ercot56_nucwin ercot56_nucwin_ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso ERCOT --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "ercot56 nucwin" \
            --bundle results/calibration/ercot56_nucwin | tee /tmp/reg_main.out
          python scripts/dashboard_add_run.py \
            --label "ercot56 nucwin ablation" \
            --bundle results/calibration/ercot56_nucwin_ablation | tee /tmp/reg_abl.out
          echo "RID_MAIN=$(grep '^RUN_ID=' /tmp/reg_main.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID_ABL=$(grep '^RUN_ID=' /tmp/reg_abl.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files + log entry via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/probes/_ercot56_register.py --append-log
          python scripts/ci_api_upload_multi.py \
            --rid "$RID_MAIN" --bundle results/calibration/ercot56_nucwin \
            --rid "$RID_ABL" --bundle results/calibration/ercot56_nucwin_ablation \
            --extra docs/calibration-log.md \
            --extra data/raw/ercot-nuclear-availability.csv \
            --extra src/market_sim/config/scenarios.py \
            --extra src/market_sim/data/fleet.py \
            --extra src/market_sim/data/outages.py \
            --extra scripts/run_calibration_full.py \
            --extra scripts/run_calibration.py \
            --extra tests/test_outages.py \
            --bench-iso ERCOT \
            --branch claude/ercot-may-2024-outage-forensics-4sg2dk \
            --message "results: register ercot56 nucwin (window-grain measured nuclear refuel availability) + zero-forcing twin; land the relay-oversized sources (keeper stays ercot55-surface-ab; promotion is an owner call) [skip ci]"

      - name: Prune ERCOT registry to top-15 retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/probes/_ercot56_register.py --prune-registry \
            --branch claude/ercot-may-2024-outage-forensics-4sg2dk
