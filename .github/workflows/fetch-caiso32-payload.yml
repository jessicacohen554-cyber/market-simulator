name: fetch-caiso32-payload

on:
  push:
    branches:
      - ci/fetch-caiso32-payload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch payload, verify, and push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          DEST=frontend/data/backcast/runs/2026-06-26-caiso-32-evening-export.js
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --retry 4 "https://tmpfiles.org/dl/wkwT0wv1PZCe/caiso32_payload.txt" -o "$DEST"
          echo "f24d2366e960891d5f86d6fed5496e3c  $DEST" | md5sum -c -
          test "$(wc -c < "$DEST")" -eq 433241
          git checkout -B caiso-32-payload
          git add "$DEST"
          git commit -m "dashboard: add caiso-32 run payload (runs/2026-06-26-caiso-32-evening-export.js)"
          git push -f origin caiso-32-payload
