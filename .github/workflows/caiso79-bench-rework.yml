# One-shot: execute the owner-signed CAISO bench-basis rework (930-NG FINDING
# §5 — results/calibration/FINDING-caiso-c2c4-bench-basis-930ng-2026-07-12.md)
# on a runner and publish via the Data API (NO `git push` — it 413s on this
# remote; caiso77-solve-register v1 postmortem). The session branch carries
# the rework as a sha-gated patch blob (docs/_caiso79_bench_rework.patch.xz.b64,
# the ercot63-landing pattern — the source files exceed the MCP relay's
# single-call ceiling): render CEMS-anchor writer + reconcile cap, verdict
# C2/C4 anchor scoring, the guarded regen script, tests, FINDING §6 + the
# log-entry payload. This workflow applies the patch, regenerates the
# artifacts that cannot ride the text relay (the binary bench/CAISO/*.json.gz
# parts) plus the re-scored metrics.json sidecars and status.js — all
# deterministic from committed code + data/raw so the published bytes are
# runner-reproducible — tripwire-checks the session's pre-registered prints,
# and commits the patched sources + artifacts back to the branch server-side.
# No LP is solved anywhere in this workflow.
name: caiso79-bench-rework

on:
  push:
    branches:
      - claude/caiso-79-calibration-mghmqt
    paths:
      - .github/workflows/caiso79-bench-rework.yml

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply the session patch (sha-gated)
        run: |
          set -euo pipefail
          base64 -d docs/_caiso79_bench_rework.patch.xz.b64 | xz -d > /tmp/caiso79.patch
          echo "e579af04bcd9900e52eeab9db59ebb566203e90f0be5639e1bad825a3f646be2  /tmp/caiso79.patch" | sha256sum -c -
          git apply /tmp/caiso79.patch
          git status --short

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run the rework regression tests
        run: |
          uv run python -m pytest tests/test_vintage_reconcile_foldin.py \
            tests/test_calibration_verdict.py -q

      - name: Regenerate CAISO bench parts on the CEMS-anchored basis (guarded, no solve)
        run: uv run python scripts/regen_caiso_bench_cems.py

      - name: Re-score caiso-78 + ablation twin in place
        run: |
          set -euo pipefail
          uv run python scripts/calibration_verdict.py --write-metrics \
            results/calibration/caiso78_cc_hr_basis || true
          uv run python scripts/calibration_verdict.py --write-metrics \
            results/calibration/caiso78_cc_hr_basis-ablation || true
          # (|| true: the scorer exits 1 on NOT-YET by design; the sidecar
          # write happens regardless. The tripwires below are the real gate.)

      - name: Tripwire — the runner must reproduce the session's pre-registered prints
        run: |
          set -euo pipefail
          OUT=$(uv run python scripts/calibration_verdict.py \
            results/calibration/caiso78_cc_hr_basis || true)
          echo "$OUT" | grep -q '2025 gas: +19.3%'   # C2-2025 honest over-print
          echo "$OUT" | grep -q '+7.69 TWh'          # C1 CC 2023 honest reopen
          echo "$OUT" | grep -q '+10.62 TWh'         # C1 CC 2024 honest reopen
          echo "$OUT" | grep -q 'r=0.829'            # C4-2025 CEMS-basis r
          echo "$OUT" | grep -q '2025: +14.6%'       # C5a-2025 rebuilt actual
          echo "tripwires OK"

      - name: Insert the calibration-log entry from the committed payload
        run: |
          set -euo pipefail
          test -f docs/_caiso79_bench_rework_log_entry.md
          python - <<'PY'
          # docs/calibration-log.md (761 KB) exceeds the MCP relay's
          # single-call ceiling, so the session pushes only the entry payload
          # and the runner splices it (caiso77-port pattern). Idempotent.
          lp = 'docs/calibration-log.md'
          log = open(lp).read()
          entry = open('docs/_caiso79_bench_rework_log_entry.md').read()
          marker = ('### 2026-07-12 — CAISO — caiso-78 (fleet_to_bins '
                    'CC heat-rate/capacity-basis fix)')
          assert marker in log
          if 'bench-basis rework EXECUTED' not in log:
              log = log.replace(marker, entry + '\n' + marker, 1)
              open(lp, 'w').write(log)
          PY

      - name: Regenerate status.js (deterministic from committed inputs)
        run: uv run python scripts/build_status.py

      - name: Publish via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python scripts/ci_api_upload_multi.py \
            --rid 2026-07-12-caiso-78-cc-hr --bundle results/calibration/caiso78_cc_hr_basis \
            --rid 2026-07-12-caiso-78-cc-hr-ablation --bundle results/calibration/caiso78_cc_hr_basis-ablation \
            --branch claude/caiso-79-calibration-mghmqt \
            --bench-iso CAISO \
            --extra frontend/data/backcast/status.js \
            --extra docs/calibration-log.md \
            --extra scripts/render_calibration_html.py \
            --extra scripts/calibration_verdict.py \
            --extra scripts/regen_caiso_bench_cems.py \
            --extra tests/test_calibration_verdict.py \
            --extra tests/test_vintage_reconcile_foldin.py \
            --extra results/calibration/FINDING-caiso-c2c4-bench-basis-930ng-2026-07-12.md \
            --extra docs/_caiso79_bench_rework_log_entry.md \
            --message "bench: CAISO CEMS-anchored basis (930-NG FINDING §5 executed, owner-signed) — render/verdict/regen rework sources + bench parts + caiso-78/twin in-place re-score + status.js + log entry [skip ci]"
