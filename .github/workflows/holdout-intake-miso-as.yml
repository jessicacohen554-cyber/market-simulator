# MISO ancillary-services (AS) market-report holdout intake (2026-07-10
# session): extend data/raw/MISO-AS/asm_{damcp,rtmcp}_zonal_<year>.parquet and
# asm_rt_cleared_mw_<year>.parquet from 2023-2025-only to 2018-2021 + H1-2026.
#
# Rule 22 (CLAUDE.md) splits DATA INTAKE (fetching more raw years, allowed at
# any time under session-logged owner authorization) from SOLVE/SCORE (which
# stays quarantined until an ISO gets a calibration-complete marker). This
# workflow is DATA INTAKE ONLY: it re-runs the already-committed
# scripts/fetch_miso_asm.py against MISO's public one-file-per-day market
# reports — no dispatch solve, no scoring, nothing touches
# frontend/data/backcast/calibration-complete.json.
#
# 2022 is deliberately excluded and NOT fetched: data/raw/MISO-AS/README.md
# documents it as confirmed ungettable (2026-07-09 investigation — MISO's
# Azure blob retention purge, 1,095/1,095 requests 404, Wayback and the Data
# Exchange API both ruled out). The 2026-07-10 intake session additionally
# spot-checked 2018-2021 on the identical URL pattern (year boundaries +
# mid-year dates + 10 legacy report-name variants, all three report types) and
# found the same 100% 404 signature — see the README's "2018-2021 + H1-2026
# holdout intake" section. That is a small-sample finding, not the exhaustive
# per-day count the 2022 section has, so this workflow still attempts the real
# fetch for 2018-2021 here (a different network path than the intake
# sandbox) as the authoritative confirmation. fetch_miso_asm.py was hardened
# the same session so a year where every day 404s writes no file at all
# (never a schema-broken zero-column parquet) — so an all-404 2018-2021 year
# here is expected to land nothing, not fail the job.
#
# Why a workflow and not a direct commit from the intake session: from the
# Claude remote sandbox, plain `git push` 413s on anything but a tiny text
# payload, and the GitHub MCP file-commit tool cannot reliably carry parquet
# binary content. Pushing an edit to THIS file is therefore the trigger
# (workflow_dispatch POSTs 403 from that sandbox) — the same pattern as
# fetch-nyiso-reserve-interface-intake.yml, holdout-intake-nyiso-as.yml, and
# holdout-intake-neiso-2022.yml. The runner does the real fetch + verify +
# commit + push.
#
# Concurrency / timeout: 2018-2021 is ~1,460 days x 3 report endpoints
# (~4,380 requests) that are expected to 404 immediately (no retry — _get()
# only retries non-404 errors), plus H1-2026's ~191 days x 3 endpoints of real
# data. fetch_miso_asm.py's default --workers 4 is left unchanged here
# deliberately — it is the same concurrency already used (and proven not to
# trip MISO's rate limiting) for the committed 2023-2025 fetch, and widening
# it just to race through a known-404 range would be impolite for no benefit.
# timeout-minutes is raised from the repo's usual 90 to 180 to give the
# 2018-2021 404 sweep (plus retry/backoff on any transient non-404 errors)
# comfortable headroom.
name: holdout-intake-miso-as

on:
  push:
    paths:
      - ".github/workflows/holdout-intake-miso-as.yml"

permissions:
  contents: write

concurrency:
  group: holdout-intake-miso-as
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package
        run: pip install -e .

      - name: Fetch MISO AS market reports (2018-2021 + 2026; 2022 excluded)
        run: |
          python scripts/fetch_miso_asm.py --years 2018 2019 2020 2021 2026

      - name: No-LP verification — schema/dtype match against 2023-2025
        # Loader-level check only (rule 22 quarantine clause): confirms any
        # newly-landed year shares the exact column set and dtypes of the
        # already-committed 2023 reference files. No dispatch solve, no LP
        # construction. A year that produced no file (expected for a purged
        # or not-yet-published range) is reported, not failed; only an actual
        # schema mismatch, or an accidentally-landed 2022 file, fails the job.
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path

          import pandas as pd

          AS_DIR = Path("data/raw/MISO-AS")
          REFERENCE_YEAR = 2023  # already-committed, known-good year
          NEW_YEARS = [2018, 2019, 2020, 2021, 2026]
          DATASETS = {
              "asm_damcp_zonal": ["date", "zone", "product"] + [f"he{h:02d}" for h in range(1, 25)],
              "asm_rtmcp_zonal": ["date", "zone", "product"] + [f"he{h:02d}" for h in range(1, 25)],
              "asm_rt_cleared_mw": ["date", "hour_end_est", "region", "product", "cleared_mw"],
          }

          ok = True

          # 2022 must never appear — it is confirmed ungettable and excluded
          # by design (not passed to --years above); a file here would mean
          # something upstream regressed and started fetching it.
          for stem in DATASETS:
              excluded = AS_DIR / f"{stem}_2022.parquet"
              if excluded.exists():
                  print(f"UNEXPECTED: {excluded} exists — 2022 is confirmed ungettable and must not be fetched")
                  ok = False

          for stem, expected_cols in DATASETS.items():
              ref_path = AS_DIR / f"{stem}_{REFERENCE_YEAR}.parquet"
              ref = pd.read_parquet(ref_path)
              if list(ref.columns) != expected_cols:
                  print(f"REFERENCE MISMATCH {ref_path}: {list(ref.columns)} != {expected_cols}")
                  ok = False
                  continue
              for year in NEW_YEARS:
                  path = AS_DIR / f"{stem}_{year}.parquet"
                  if not path.exists():
                      print(f"MISSING {path} (expected for a purged/not-yet-published range — not a failure)")
                      continue
                  df = pd.read_parquet(path)
                  if list(df.columns) != list(ref.columns):
                      print(f"COLUMN MISMATCH {path}: {list(df.columns)} != {list(ref.columns)}")
                      ok = False
                      continue
                  if list(df.dtypes) != list(ref.dtypes):
                      print(f"DTYPE MISMATCH {path}: {list(df.dtypes)} != {list(ref.dtypes)}")
                      ok = False
                      continue
                  if len(df) == 0:
                      print(f"EMPTY FRAME {path}: 0 rows written — should have been skipped, not landed")
                      ok = False
                      continue
                  print(f"OK {path}: {len(df):,} rows, columns/dtypes match {REFERENCE_YEAR}")

          if not ok:
              sys.exit("no-LP verification failed — see mismatches above")
          EOF

      - name: Integrity report (sha256 of every landed parquet)
        run: |
          for stem in asm_damcp_zonal asm_rtmcp_zonal asm_rt_cleared_mw; do
            for year in 2018 2019 2020 2021 2026; do
              f="data/raw/MISO-AS/${stem}_${year}.parquet"
              if [ -f "$f" ]; then
                sha256sum "$f"
              else
                echo "(none) $f"
              fi
            done
          done

      - name: Commit and push the raw intake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/MISO-AS/asm_damcp_zonal_*.parquet \
                  data/raw/MISO-AS/asm_rtmcp_zonal_*.parquet \
                  data/raw/MISO-AS/asm_rt_cleared_mw_*.parquet
          if git diff --cached --quiet; then
            echo "no MISO AS holdout-intake changes to commit (2018-2021 confirmed ungettable, H1-2026 already landed, or nothing new published)"
            exit 0
          fi
          git commit -m "data(miso): AS holdout intake 2018-2021 + H1-2026, 2022 excluded per confirmed-ungettable finding (workflow run ${{ github.run_id }})

          Extends data/raw/MISO-AS/asm_{damcp,rtmcp}_zonal_<year>.parquet and
          asm_rt_cleared_mw_<year>.parquet from 2023-2025-only using the
          already-committed scripts/fetch_miso_asm.py (hardened this session
          to skip writing a file for an all-404 year instead of a
          schema-broken zero-column parquet). 2022 is not fetched — confirmed
          ungettable (data/raw/MISO-AS/README.md). 2018-2021 were spot-checked
          404 on the identical URL pattern by the intake session and are
          expected to land nothing here too; this run is the authoritative
          full-year confirmation. Out-of-training years intaken under the
          2026-07-10 session-logged owner authorization (CLAUDE.md rule 22).
          Data intake only — no LP solve, no scoring, no calibration-complete
          marker touched."
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
