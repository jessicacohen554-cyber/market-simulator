# One-shot: land the caiso-74/75 session's code on this branch and fetch the
# binary raw intake it depends on. The session environment can only write
# text through the MCP push_files proxy, so (a) the code travels as
# .github/patches/caiso74/*.patch applied here with `git am` (ercot57 /
# pjm97 patch-transport precedent), and (b) the 12 CAISO Daily Energy
# Storage Report xlsx (~166 MB of binary, data/raw/storage-as-awards/CAISO)
# are downloaded directly from caiso.com by this runner and committed with
# the runner's token (fetch-caiso-oasis precedent). Also regenerates the
# generator-owned parameter registry + data dictionary on the applied code.
name: apply-caiso74-intake

on:
  push:
    branches:
      - claude/caiso-calibration-continuation-3ftscz
    paths:
      - .github/workflows/apply-caiso74-intake.yml
      - .github/patches/caiso74/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply session patches (git am)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git log --oneline -20 | grep -q "storage-as-awards): intake CAISO"; then
            echo "patches already applied — skipping git am"
          else
            # git am is email-transport tolerant (lost trailing whitespace on
            # context lines) and fails loudly on real corruption; the smoke
            # tests below re-verify the applied code end-to-end (ercot57
            # relay-corruption lesson).
            git am .github/patches/caiso74/0001-storage-as-awards-intake.patch \
                   .github/patches/caiso74/0002-caiso74-mechanism-demand-clock.patch
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download CAISO Daily Energy Storage Report xlsx (2023-2025)
        run: |
          set -euo pipefail
          d=data/raw/storage-as-awards/CAISO
          mkdir -p "$d"
          for q in 1 2 3 4; do
            for y in 2023 2024; do
              f="storage-report-${y}q${q}.xlsx"
              [ -s "$d/$f" ] || curl -fsSL --retry 3 -o "$d/$f" \
                "https://www.caiso.com/documents/storage-report-${y}q${q}.xlsx"
            done
            f="storage-report-q${q}-2025.xlsx"
            [ -s "$d/$f" ] || curl -fsSL --retry 3 -o "$d/$f" \
              "https://www.caiso.com/documents/storage-report-q${q}-2025.xlsx"
          done
          ls -la "$d"

      - name: Smoke-test the intake + mechanism on the applied code
        run: |
          set -euo pipefail
          pip install pytest openpyxl
          python -m pytest tests/test_curate_storage_as_awards.py \
            tests/test_caiso_storage_as_reservation.py \
            tests/test_caiso_demand_clock.py -q

      - name: Regenerate generator-owned registries
        run: |
          set -euo pipefail
          python scripts/generate_parameter_registry.py
          python scripts/render_data_dictionary.py
          python scripts/validate_parameters.py

      - name: Commit raw intake + regenerated registries and push
        run: |
          set -euo pipefail
          git add data/raw/storage-as-awards frontend/data/parameters.json \
            docs/parameter-citations.md data/dictionary/data-dictionary.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data(storage-as-awards): raw CAISO storage-report xlsx + regenerated parameter registry [skip ci]

Raw quarterly xlsx fetched from caiso.com by the apply-caiso74-intake
runner (binary transport); parameter registry / citations / data
dictionary regenerated on the applied code.

Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01QafzWFFCueKzpj6iCUjLP1"
          fi
          git push origin HEAD:claude/caiso-calibration-continuation-3ftscz
