# Fetch CAISO OASIS intertie scheduling-point LMPs (Malin/Captain Jack/NOB,
# Palo Verde/Mead) on a GitHub runner with open egress (the Claude remote env
# blocks oasis.caiso.com), and build the measured-hub import price input
# (data/raw/_validation-source/wecc_intertie_lmp_hourly_CAISO.parquet) that the
# model's caiso_import_hub_prices mechanism reads (lever A of the CAISO LMP
# diagnosis). Commits the parquet back to the branch it ran on.
#
# Run mode=probe FIRST: it does one 1-day call per node and reports which APNode
# names resolve (they vary by registry vintage). Fix scripts/
# fetch_caiso_intertie_lmp.py:INTERTIE_NODES if any say NO DATA, then run
# mode=fetch.
name: Fetch CAISO intertie LMP

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (validate node names) or fetch (full pull)"
        default: "probe"
        type: choice
        options: ["probe", "fetch"]
      years:
        description: "Years to fetch (space-separated)"
        default: "2023 2024 2025"
        type: string
  schedule:
    # 06:30 UTC on the 9th — refresh the rolling OASIS window (~39-month retention).
    - cron: "30 6 9 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Fetch CAISO intertie LMP
        run: |
          MODE="${{ github.event.inputs.mode || 'fetch' }}"
          YEARS="${{ github.event.inputs.years || '2023 2024 2025' }}"
          if [ "$MODE" = "probe" ]; then
            python scripts/fetch_caiso_intertie_lmp.py --probe --years $YEARS
          else
            python scripts/fetch_caiso_intertie_lmp.py --years $YEARS \
              --deadline-minutes 165
          fi

      - name: Commit and push the intertie parquet
        if: ${{ (github.event.inputs.mode || 'fetch') != 'probe' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/_validation-source/wecc_intertie_lmp_hourly_CAISO.parquet
          if git diff --cached --quiet; then
            echo "no intertie data to commit"
            exit 0
          fi
          git commit -m "data: CAISO intertie LMP for measured-hub imports (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
