name: holdout-intake-pjm-as

# PJM ancillary-services / reserve-market DATA INTAKE ONLY (CLAUDE.md rule 22).
#
# Extends data/raw/PJM-AS/ (hand-assembled for 2023-2025 only) to 2018-2022 +
# H1-2026, under the 2026-07-10 session-logged owner authorization for
# out-of-training-period data intake (rule 22: "Data intake is permitted for
# any out-of-training period ... under explicit, session-logged owner
# authorization"). This is NOT a solve and NOT a scoring run: no LP is
# constructed, no dispatch is solved, nothing here is registered as a
# calibration result. It reproduces the exact fetch/build scripts committed
# in this same change (scripts/fetch_pjm_as.py, scripts/build_pjm_as_
# withholding.py) on a GitHub Actions runner, because the Claude remote env's
# proxy only permits small text pushes (plain `git push` 413s on the parquet
# payloads here) — the same constraint and the same fetch-workflow pattern as
# fetch-nyiso-reserve-interface-intake.yml and holdout-intake-neiso-2022.yml.
#
# Retention ground-truth (verified live against PJM DataMiner2's own
# <feed>/metadata on 2026-07-10 — see scripts/fetch_pjm_as.py docstring):
#   reserve_market_results / ancillary_services (RT):    firstAvailable 2012/2013 -> full 2018-2022 + H1-2026
#   da_reserve_market_results / da_ancillary_services (DA): firstAvailable 2022-10-01 -> 2018-2021 skipped
#     entirely (genuinely does not exist -- PJM's Reserve Price Formation
#     redesign went live mid-2022, not a retention gap), 2022 lands Oct-Dec
#     only under a "_partial" filename suffix, H1-2026 lands under the same
#     suffix (never past 2026-06-30, per the intake authorization).
#
# Artifacts landed (data/raw/PJM-AS/):
#   reserve_market_results_{2018..2022}.parquet          (full years)
#   ancillary_services_{2018..2022}.parquet              (full years)
#   da_reserve_market_results_2022_partial.parquet        (Oct-Dec 2022 only)
#   da_ancillary_services_2022_partial.parquet            (Oct-Dec 2022 only)
#   reserve_market_results_2026_partial.parquet           (Jan-Jun 2026 only)
#   ancillary_services_2026_partial.parquet               (Jan-Jun 2026 only)
#   da_reserve_market_results_2026_partial.parquet        (Jan-Jun 2026 only)
#   da_ancillary_services_2026_partial.parquet            (Jan-Jun 2026 only)
#   pjm_{2018..2022}_as_up_mw.parquet                     (derived, full years only)
#
# Guard: none required — this is intake, not solve/score, and is explicitly
# authorized (unlike holdout-intake-neiso-2022.yml, which gated a validation-
# tier *solve/score* on a calibration-complete marker; nothing here touches
# that marker or any dashboard/registry file).
#
# Fixed 2026-07-10 (first run): reserve_market_results fetched cleanly for
# 2018-2022 + H1-2026, but the ancillary_services feed returned HTTP 400 (not
# an empty 200) for the 2018 window even though its own /metadata advertises
# firstAvailable 2012-10-01 -- DataMiner2 is inconsistent across feeds about
# how it signals "before this feed's real data starts." fetch_pjm_as.py now
# treats HTTP 400 the same as 404 (logged, not raised), and the per-(feed,
# year) fetch loop no longer lets one unexpected failure discard every other
# feed/year already written in the same run.

on:
  push:
    paths:
      - ".github/workflows/holdout-intake-pjm-as.yml"
  # workflow_dispatch is unusable from the Claude remote env (POST 403 on
  # dispatch), so pushing an edit to THIS file is the trigger — path-scoped to
  # the workflow itself so the runner's own data commit can never re-fire it.

permissions:
  contents: write

concurrency:
  group: holdout-intake-pjm-as
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package (fetch + build deps)
        run: pip install -e .

      - name: Fetch PJM AS/reserve-market data (2018-2022 + H1-2026)
        run: |
          python scripts/fetch_pjm_as.py --years 2018 2019 2020 2021 2022 --h1-2026

      - name: Build derived reserve-withholding series for the new full years
        run: |
          python scripts/build_pjm_as_withholding.py --year 2018 2019 2020 2021 2022

      - name: No-LP verification (schema/dtype match against 2023-2025; no dispatch solve)
        run: |
          python - <<'EOF'
          """Loader-resolvability check: every new parquet must be readable and
          must carry the same columns/dtypes as its already-committed 2023-2025
          sibling for the same feed. This is a schema check only -- it never
          constructs or solves an LP (CLAUDE.md rule 22's solve/score
          quarantine covers dispatch solves, not this)."""
          import sys
          from pathlib import Path

          import pandas as pd

          AS_DIR = Path("data/raw/PJM-AS")
          FEEDS = [
              "reserve_market_results",
              "da_reserve_market_results",
              "ancillary_services",
              "da_ancillary_services",
          ]
          REFERENCE_YEAR = 2023
          failures = []

          for feed in FEEDS:
              ref_path = AS_DIR / f"{feed}_{REFERENCE_YEAR}.parquet"
              if not ref_path.exists():
                  failures.append(f"{feed}: reference {ref_path} missing")
                  continue
              ref = pd.read_parquet(ref_path)
              ref_cols = set(ref.columns) - {"_dt_ept"}  # housekeeping col, no consumer reads it

              candidates = sorted(AS_DIR.glob(f"{feed}_*.parquet"))
              candidates = [
                  p
                  for p in candidates
                  if p.name != ref_path.name
                  and not p.name.startswith(f"{feed}_2023")
                  and not p.name.startswith(f"{feed}_2024")
                  and not p.name.startswith(f"{feed}_2025")
              ]
              if not candidates:
                  print(f"{feed}: no new files found (skipped feed or before retention)")
                  continue
              for path in candidates:
                  try:
                      df = pd.read_parquet(path)
                  except Exception as exc:  # loader-resolvability failure
                      failures.append(f"{path.name}: failed to load ({exc})")
                      continue
                  if len(df) == 0:
                      failures.append(f"{path.name}: zero rows (should have been skipped, not written)")
                      continue
                  new_cols = set(df.columns)
                  missing = ref_cols - new_cols
                  extra = new_cols - ref_cols
                  if missing:
                      failures.append(f"{path.name}: missing columns vs {ref_path.name}: {sorted(missing)}")
                  if extra:
                      print(f"{path.name}: extra columns vs {ref_path.name} (informational): {sorted(extra)}")
                  print(f"{path.name}: OK ({len(df):,} rows, {len(df.columns)} cols)")

          # Derived withholding series (full years only)
          for year in (2018, 2019, 2020, 2021, 2022):
              p = AS_DIR / f"pjm_{year}_as_up_mw.parquet"
              if not p.exists():
                  continue
              df = pd.read_parquet(p)
              if len(df) != 8760:
                  failures.append(f"{p.name}: expected 8760 rows, got {len(df)}")
              else:
                  print(f"{p.name}: OK (8760-hour withholding series)")

          if failures:
              print("\nFAILURES:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print("\nAll new PJM-AS parquets pass the no-LP loader/schema check.")
          EOF

      - name: Integrity report (sha256 of every landed file)
        run: |
          shopt -s nullglob
          files=(
            data/raw/PJM-AS/reserve_market_results_{2018,2019,2020,2021,2022}.parquet
            data/raw/PJM-AS/ancillary_services_{2018,2019,2020,2021,2022}.parquet
            data/raw/PJM-AS/da_reserve_market_results_2022_partial.parquet
            data/raw/PJM-AS/da_ancillary_services_2022_partial.parquet
            data/raw/PJM-AS/reserve_market_results_2026_partial.parquet
            data/raw/PJM-AS/ancillary_services_2026_partial.parquet
            data/raw/PJM-AS/da_reserve_market_results_2026_partial.parquet
            data/raw/PJM-AS/da_ancillary_services_2026_partial.parquet
            data/raw/PJM-AS/pjm_{2018,2019,2020,2021,2022}_as_up_mw.parquet
          )
          present=()
          for f in "${files[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "no new PJM-AS files landed (all feeds/years already present or unavailable)"
          else
            sha256sum "${present[@]}"
          fi

      - name: Commit and push the raw intake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/PJM-AS/
          if git diff --cached --quiet; then
            echo "no PJM-AS intake changes to commit"
            exit 0
          fi
          git commit -m "data(pjm): reserve/AS market data 2018-2022 + H1-2026 holdout intake (workflow run ${{ github.run_id }})

          DataMiner2 reserve_market_results / da_reserve_market_results /
          ancillary_services / da_ancillary_services, verified retention:
          RT feeds full 2018-2022 + H1-2026; DA feeds genuinely start
          2022-10-01 (PJM's Reserve Price Formation redesign, not a retention
          gap) so 2018-2021 are absent and 2022/2026 land as _partial files.
          Derived pjm_<year>_as_up_mw withholding series built for the new
          full years only. Data intake under the 2026-07-10 session-logged
          owner authorization (CLAUDE.md rule 22) -- not a solve, not a score,
          not a dashboard registration."
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
