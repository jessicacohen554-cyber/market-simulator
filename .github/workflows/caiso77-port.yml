# One-shot: port the caiso-77 keeper promotion onto a fresh branch cut from
# post-G-21b main (the original session branch
# claude/caiso-calibration-next-steps-m1h3tj pre-dated main's 50dbb54 bench
# change and conflicts on calibration-log.md / status.js / bench). Copies the
# solved caiso-77 artifacts from the session branch (byte-identical bundles +
# run payloads — nothing is re-solved), applies the keeper swap + log-entry
# insertion from the committed payload docs/_caiso77_log_entry.md (figures
# re-quoted on the G-21b basis: C2-2025 print unchanged at -7.6%, C1-2023
# +4.54 -> +4.50 TWh), regenerates status.js deterministically, and publishes
# via the Data API (NO `git push` — caiso77-solve-register v1 postmortem).
# Bench stays MAIN'S (G-21b): the runner tree's bench blobs are already the
# branch's, so the upload's bench glob is a no-op.
name: caiso77-port

on:
  push:
    branches:
      - claude/caiso77-keeper-port-m1h3tj
    paths:
      - .github/workflows/caiso77-port.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Copy solved caiso-77 artifacts from the session branch
        run: |
          set -euo pipefail
          git fetch origin claude/caiso-calibration-next-steps-m1h3tj
          git checkout FETCH_HEAD -- \
            results/calibration/caiso77_firm_selfschedule \
            results/calibration/caiso77_firm_selfschedule-ablation \
            frontend/data/backcast/runs/2026-07-12-caiso-77-firm-selfschedule.js \
            frontend/data/backcast/runs/2026-07-12-caiso-77-firm-selfschedule-ablation.js

      - name: Apply keeper swap + log entry insertion
        run: |
          set -euo pipefail
          test -f docs/_caiso77_log_entry.md
          python - <<'PY'
          import json

          # 1. keepers.json: CAISO -> caiso-77 (idempotent).
          p = 'frontend/data/backcast/keepers.json'
          k = json.load(open(p))
          old = k['CAISO']
          new = '2026-07-12-caiso-77-firm-selfschedule'
          if old != new:
              k['CAISO'] = new
              k['keepers'] = [new if x == old else x for x in k['keepers']]
              json.dump(k, open(p, 'w'), indent=1)

          # 2. calibration-log: insert before the G-61(b) entry (idempotent).
          lp = 'docs/calibration-log.md'
          log = open(lp).read()
          entry = open('docs/_caiso77_log_entry.md').read()
          marker = '### 2026-07-11 — CAISO — owner decision G-61(b)'
          assert marker in log
          if 'caiso-77 (self-scheduled firm import base)' not in log:
              log = log.replace(marker, entry + '\n' + marker, 1)
              open(lp, 'w').write(log)
          PY

      - name: Regenerate status.js (deterministic from committed inputs)
        run: python scripts/build_status.py

      - name: Publish via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid 2026-07-12-caiso-77-firm-selfschedule --bundle results/calibration/caiso77_firm_selfschedule \
            --rid 2026-07-12-caiso-77-firm-selfschedule-ablation --bundle results/calibration/caiso77_firm_selfschedule-ablation \
            --branch claude/caiso77-keeper-port-m1h3tj \
            --extra frontend/data/backcast/keepers.json \
            --extra frontend/data/backcast/status.js \
            --extra docs/calibration-log.md \
            --message "Promote caiso-77 (self-scheduled firm import base) to CAISO keeper — solved bundle + twin ported onto post-G-21b main; C1-2024 clears, C2-2025 print adjudicated vs CEMS per the FINDING §4 clause [skip ci]"
