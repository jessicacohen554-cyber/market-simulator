# One-shot v2: solve the caiso-77 (self-scheduled firm import base) A/B
# probe pair (main + zero-forcing ablation twin) on CI and register both on
# the backcast dashboard as PROBES.
#
# v1 (.github/workflows/caiso77-solve-register.yml, run 29170225341,
# 2026-07-11) solved both bundles and passed every D-diagnostic, then died
# at its "prune + git push" step: the runner's GITHUB_TOKEN may not push a
# ref whose new commits touch .github/workflows/* ("refusing to allow a
# GitHub App to ... update workflow ... without `workflows` permission" —
# the branch history carried workflow files main did not yet have), so the
# register + Data-API upload steps never ran and the solve outputs were
# lost with the runner.
#
# v2 differences, and nothing else:
#   * no source patch step — the caiso-77 change set (47ba754) is already
#     in this branch's history via main;
#   * NO `git push` anywhere: every published file travels through
#     scripts/ci_api_upload_multi.py (git Data API blob→tree→commit→ref),
#     the path that has worked on every caiso-67/69/74/75/76 registration;
#   * the top-15 retention prune (caiso-65 superseded-keeper pair) is NOT
#     done here — the session performs it via the contents API after the
#     upload lands, so a prune hiccup can never strand the solve again.
#
# Probe: scripts/probes/_caiso77_firm_selfschedule_ab.py — the caiso-76
# keeper recipe plus the single caiso-77 delta:
# caiso_firm_import_selfschedule=True (the firm/contracted import blocks
# become must-flow at their shaped capability — CPUC D.20-06-028
# self-schedule behaviour, the Manitoba/HQ firm must-flow pattern;
# FINDING-caiso77-c1-cluster-firm-selfschedule-2026-07-11.md). Years
# 2023-2025 sequential within each invocation (CLAUDE.md rule 12); the two
# invocations run sequentially on this one runner. Keeper stays
# 2026-07-11-caiso-76-hydro-budget; promotion is a separate decision
# evaluated from the committed scores.
name: caiso77-solve-register-v2

on:
  push:
    branches:
      - claude/caiso-calibration-next-steps-m1h3tj
    paths:
      - .github/workflows/caiso77-solve-register-v2.yml

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Assert the caiso-77 source change set is present
        run: |
          set -euo pipefail
          grep -q "caiso_firm_import_selfschedule" src/market_sim/config/scenarios.py
          grep -q "inject_caiso_firm_import_selfschedule" src/market_sim/model/transmission.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl

      - name: Curate clean partitions the recipe reads
        run: |
          set -euo pipefail
          # data/clean is derived/gitignored — a fresh checkout has neither
          # partition. Without capacity-deliverability the keeper's published
          # MIC seam supersession silently skips (caiso-69 precedent).
          PYTHONPATH="$PWD" python scripts/curate_capacity_deliverability.py --isos CAISO

      - name: Solve caiso-77 main (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso77_firm_selfschedule_ab.py main

      - name: Solve caiso-77 ablation twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso77_firm_selfschedule_ab.py ablation

      - name: Write probe attestations
        run: python scripts/probes/_caiso77_attestation.py

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso67/69/7475/76-solve-register precedent).
          for b in caiso77_firm_selfschedule caiso77_firm_selfschedule-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso CAISO --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 77 firm selfschedule" \
            --bundle results/calibration/caiso77_firm_selfschedule | tee /tmp/r77m.out
          python scripts/dashboard_add_run.py \
            --label "caiso 77 firm selfschedule ablation" \
            --bundle results/calibration/caiso77_firm_selfschedule-ablation | tee /tmp/r77a.out
          echo "RID77M=$(grep '^RUN_ID=' /tmp/r77m.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID77A=$(grep '^RUN_ID=' /tmp/r77a.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID77M" --bundle results/calibration/caiso77_firm_selfschedule \
            --rid "$RID77A" --bundle results/calibration/caiso77_firm_selfschedule-ablation \
            --branch claude/caiso-calibration-next-steps-m1h3tj \
            --message "results: register caiso-77 (self-scheduled firm import base) PROBE + zero-forcing twin on the backcast dashboard (keeper stays caiso-76) [skip ci]"
