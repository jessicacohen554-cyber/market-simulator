# One-shot: rebase this branch onto origin/main so it merges clean. The only
# conflict is the calibration-log.md append-append; the branch side is a strict
# SUPERSET of main's (main's 6d30d38 landed a stale full-file copy that deleted
# the MISO-57 and MISO-58 entries — pure deletion, verified: 0 insertions), so
# the resolution takes the branch's whole file, which both restores the two
# clobbered entries and appends ERCOT-60. Rehearsed locally on a throwaway
# branch before pushing; post-condition greps guard the result before the
# force-push. git push must run from a runner (the container's remote 413s).
name: ercot60-rebase-main

on:
  push:
    branches:
      - claude/ercot-storage-cycling-next-35f05l
    paths:
      - .github/workflows/ercot60-rebase-main.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto origin/main, resolve log by branch side, force-push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "already based on main tip; nothing to do"
            exit 0
          fi
          git rebase origin/main || true
          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "docs/calibration-log.md" ]; then
              echo "unexpected conflicts: [$conflicts]" >&2
              exit 1
            fi
            # Branch-side whole file: base log (with MISO-57/58) + ERCOT-60.
            git checkout REBASE_HEAD -- docs/calibration-log.md
            git add docs/calibration-log.md
            GIT_EDITOR=true git rebase --continue
          done
          # Post-conditions: every entry present exactly once, payload doc gone.
          for pat in "MISO-57: RDT" "MISO-58: RDT" "ERCOT-59: the storage-cycling-lane fix" "ERCOT-60: thread-1"; do
            n=$(grep -c "$pat" docs/calibration-log.md)
            if [ "$n" -ne 1 ]; then echo "FAIL: '$pat' count=$n" >&2; exit 1; fi
          done
          test ! -e docs/_ercot60_log_entry.md
          git merge-base --is-ancestor origin/main HEAD
          git push --force-with-lease origin HEAD:claude/ercot-storage-cycling-next-35f05l
