name: Fetch CAMPD unit-level (holdout-year data intake)

# Generic runner for scripts/fetch_campd_unit_level.py — lands
# data/raw/campd-unit-level/<ST>_<YEAR>.parquet for any ISO/state/year combo.
# Runs on a GitHub Actions runner (unrestricted egress to api.epa.gov) and
# commits the landed parquet binaries directly via git push from the runner
# checkout — the Claude remote session cannot push binaries itself (its only
# push path, the GitHub API's push_files, stores content literally as a JSON
# string and cannot carry raw binary bytes; direct GitHub REST writes are
# also proxy-blocked for that session). Two ways to run it:
#
# 1. workflow_dispatch (manual, from the Actions UI or a token with dispatch
#    permission) with the year/states/quarters/holdout_intake inputs below.
# 2. push a small JSON job-spec file under .github/campd-queue/*.json (see
#    format below) — this fires on an ordinary `push` event, which needs no
#    special dispatch permission, so the Claude session can queue fetches by
#    pushing a few-hundred-byte spec file instead of the megabyte-scale
#    parquet itself. Every *.json file present under .github/campd-queue/ is
#    processed each run (idempotent: already-landed states are skipped by the
#    fetcher itself), and consumed queue files are deleted in the same commit.
#
# Job-spec format (.github/campd-queue/<name>.json):
#   {"year": 2022, "states": ["CA"], "quarters": null, "holdout_intake": "CAISO"}
#
# Data intake for 2022/H1-2026 is allowed for any ISO, any time, under
# explicit owner authorization (CLAUDE.md rule 22, amended 2026-07-06 —
# docs/handoffs/holdout-policy-memo-2026-07.md Option 2). This workflow does
# not solve or score anything; --holdout-intake is passed straight through to
# the fetcher as the authorization record for its own quarantine check.

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year to fetch (e.g. 2022 or 2026)"
        required: true
        type: string
      states:
        description: "Space-separated state codes (e.g. CA, or NY, or CT MA ME NH RI VT)"
        required: true
        type: string
      quarters:
        description: "Space-separated quarters for an in-progress year (e.g. 1); leave blank for a completed year"
        required: false
        default: ""
        type: string
      holdout_intake:
        description: "ISO name authorizing this holdout-year intake (--holdout-intake); leave blank for a non-holdout year"
        required: false
        default: ""
        type: string
  push:
    paths:
      - ".github/campd-queue/*.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Fetch CAMPD unit-level (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          EPA_API_KEY: ${{ secrets.EPA_API_KEY }}
        run: |
          ARGS="--year ${{ inputs.year }} --states ${{ inputs.states }}"
          if [ -n "${{ inputs.quarters }}" ]; then
            ARGS="$ARGS --quarters ${{ inputs.quarters }}"
          fi
          if [ -n "${{ inputs.holdout_intake }}" ]; then
            ARGS="$ARGS --holdout-intake ${{ inputs.holdout_intake }}"
          fi
          python scripts/fetch_campd_unit_level.py $ARGS

      - name: Fetch CAMPD unit-level (queue files)
        if: github.event_name == 'push'
        env:
          EPA_API_KEY: ${{ secrets.EPA_API_KEY }}
        run: |
          shopt -s nullglob
          for spec in .github/campd-queue/*.json; do
            echo "=== processing $spec ==="
            cat "$spec"
            YEAR=$(jq -r '.year' "$spec")
            STATES=$(jq -r '.states | join(" ")' "$spec")
            QUARTERS=$(jq -r '(.quarters // []) | join(" ")' "$spec")
            HOLDOUT=$(jq -r '.holdout_intake // empty' "$spec")
            ARGS="--year $YEAR --states $STATES"
            if [ -n "$QUARTERS" ]; then ARGS="$ARGS --quarters $QUARTERS"; fi
            if [ -n "$HOLDOUT" ]; then ARGS="$ARGS --holdout-intake $HOLDOUT"; fi
            python scripts/fetch_campd_unit_level.py $ARGS
            rm -f "$spec"
          done

      - name: Commit and push landed parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/campd-unit-level/ .github/campd-queue/
          if git diff --cached --quiet; then
            echo "no new data to commit"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="data(campd): unit-level ${{ inputs.year }} intake for ${{ inputs.states }} (workflow run ${{ github.run_id }})"
          else
            MSG="data(campd): unit-level intake from queued job specs (workflow run ${{ github.run_id }})"
          fi
          git commit -m "$MSG"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
