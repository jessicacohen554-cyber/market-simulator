# W2-P5 forecast-invariant checks, heavy tier (docs/handoffs/forecast-
# validation-program-2026-07.md §2.4, §6 "next-session pickup").
#
# scripts/check_forecast_invariants.py + tests/test_forecast_invariants.py
# ship two tiers:
#   * Fast (~1s, no LP solve): 34 invariant-LOGIC cases against fabricated
#     ledgers/arrays. These already run on every PR — they live under
#     tests/ with no `slow`/`integration` marker, so ci.yml's fast tier
#     (`pytest tests/ -m "not slow and not integration"`) already collects
#     and runs them; see the comment there for the explicit cross-reference.
#   * Heavy (multi-minute real HiGHS solves), which is what THIS workflow
#     covers, modeled on bench-repro.yml's scheduled-cron pattern:
#       1. The real-LP e2e test (`RUN_SLOW_FORECAST=1`, marked `slow`) — a
#          genuine 3-year ERCOT forecast solved end-to-end (~205s), the
#          first real-LP exercise of the capacity-evolution loop + ledger.
#       2. The paired-run invariants P1 (CO2 monotone vs. carbon price), P2
#          (merit-order sign vs. +$1/MMBtu gas), P3 (build stability vs.
#          ±5% gas) — each needs TWO real forecast solves differing in one
#          driver, so a base run is solved once and reused across all three
#          pairings (4 solves total, ~205s each per the plan doc's measured
#          runtime for this exact config).
#       3. The golden-scenario band regression (plan §2.3): a pinned ERCOT
#          reference forecast, 2026-2032 (7 LP years), re-solved fresh and
#          checked against the golden values in
#          tests/golden/ercot_2026_2032.json (annual CO2, end-year capacity
#          by fuel, annual load-weighted price, system cost, cumulative
#          builds by tech). scripts/golden_forecast_bands.py seeded that
#          golden once; regeneration is a deliberate, cited, committed act
#          (see that script's REGEN_POLICY) — this job never regenerates,
#          it only checks and fails loudly on a band exit.
#
# All three are too heavy for a per-PR gate (CLAUDE.md rule 12: minutes per
# year-solve) so they run weekly + on manual dispatch, never on push/PR.
# All solves stay sequential (rule 12: years sequential within an
# invocation; the four paired-run solves here are also run one-at-a-time
# rather than concurrently, which is stricter than the rule requires but
# keeps a single runner's memory bounded).
#
# The final `commit-findings` job persists the paired-invariant results into
# docs/handoffs/weekly-invariant-findings/ (append-only, one dated file per
# run) so the weekly results stop being ephemeral 14-day artifacts
# (testing-audit G9). It adds no solve — just a download + commit — so the
# runtime budget of the heavy tier is unchanged.
name: Forecast invariants (heavy tier)

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Sunday 11:00 UTC — after bench-repro.yml's 09:00 slot.
    - cron: "0 11 * * 0"

# Read by default; the commit-findings job elevates to contents: write.
permissions:
  contents: read

jobs:
  real-lp-e2e:
    name: Real-LP e2e (RUN_SLOW_FORECAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Real multi-year ERCOT forecast + invariant checker (slow tier)
        env:
          RUN_SLOW_FORECAST: "1"
        run: |
          uv run python -m pytest tests/test_forecast_invariants.py -m slow \
            --strict-markers -v --junitxml=/tmp/forecast_e2e_junit.xml

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-invariants-e2e
          path: /tmp/forecast_e2e_junit.xml
          retention-days: 14

  paired-invariants:
    name: Paired-run invariants (P1-P3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Solve base + carbon/gas variants, run P1-P3
        run: |
          mkdir -p /tmp/forecast_paired
          uv run python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          # Repo root on sys.path so `scripts.check_forecast_invariants`
          # resolves the same way tests/test_forecast_invariants.py imports
          # it (`from scripts import check_forecast_invariants`) — `scripts/`
          # has no __init__.py, so this relies on it being an implicit
          # namespace package with the repo root on sys.path.
          sys.path.insert(0, os.getcwd())

          from market_sim.config.scenarios import ScenarioConfig
          from market_sim.data.fuel import GAS_BASIS_DIFFERENTIAL, resolve_annual_gas_price
          from market_sim.results import cache as cachemod
          from market_sim.runner import run_scenario_iso
          from scripts import check_forecast_invariants as C

          ISO = "ERCOT"
          START_YEAR, END_YEAR = 2026, 2028
          OUT_ROOT = Path("/tmp/forecast_paired")

          def solve(label, **overrides):
              """Run one scenario into its own cache root; return (run_dir, config)."""
              cachemod.CACHE_ROOT = OUT_ROOT / label
              config = ScenarioConfig(
                  iso=ISO,
                  hours=8760,
                  use_campd_bins=False,  # legacy bins bound runtime (plan §2.4)
                  start_year=START_YEAR,
                  end_year=END_YEAR,
                  **overrides,
              )
              key = run_scenario_iso(config, ISO)
              run_dir = cachemod.CACHE_ROOT / ISO / key
              print(f"solved {label}: {run_dir}", flush=True)
              return run_dir, config

          base_dir, base_config = solve("base")

          # P1: carbon price path zero (base) vs high.
          carbon_dir, _ = solve("carbon_high", carbon_price_path="high")

          # P2: +$1/MMBtu delivered gas. gas_price_override sets the delivered
          # price directly (override + basis), so back out the basis to land
          # exactly base_delivered + 1.0 — mirrors resolve_annual_gas_price's
          # own basis handling (src/market_sim/data/fuel.py).
          base_delivered_gas = resolve_annual_gas_price(base_config, START_YEAR)
          basis = GAS_BASIS_DIFFERENTIAL.get(ISO, 0.0)
          gas_up_dir, _ = solve(
              "gas_up", gas_price_override=base_delivered_gas + 1.0 - basis
          )

          # P3: +5% gas via the forecast-only gas_price_factor lever.
          gas_pm5_dir, _ = solve("gas_pm5", gas_price_factor=1.05)

          pairs = [
              ("carbon", base_dir, carbon_dir),
              ("gas_up", base_dir, gas_up_dir),
              ("gas_pm5", base_dir, gas_pm5_dir),
          ]

          all_results = {}
          any_fail = False
          for kind, b, o in pairs:
              results = C.run_paired(b, o, kind)
              all_results[kind] = [r.__dict__ for r in results]
              for r in results:
                  print(f"  [{r.status}] {kind}/{r.ident} {r.name}: {r.detail}")
                  if r.status == C.FAIL:
                      any_fail = True

          report_path = OUT_ROOT / "paired_invariant_findings.json"
          report_path.write_text(json.dumps(all_results, indent=2))
          print(f"\nwrote {report_path}")

          sys.exit(1 if any_fail else 0)
          PY

      - name: Upload paired-invariant findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-invariants-paired
          path: /tmp/forecast_paired/paired_invariant_findings.json
          retention-days: 14

  golden-band-regression:
    name: Golden-scenario band regression (plan §2.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Re-solve the pinned ERCOT reference forecast and check bands
        env:
          RUN_GOLDEN_FORECAST: "1"
        run: |
          uv run python -m pytest tests/test_golden_forecast_bands.py -m slow \
            --strict-markers -v --junitxml=/tmp/golden_band_junit.xml

      - name: Upload golden-band results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-band-regression
          path: /tmp/golden_band_junit.xml
          retention-days: 14

  commit-findings:
    name: Persist weekly findings (append-only, testing-audit G9)
    needs: [real-lp-e2e, paired-invariants]
    # Run even if an invariant FAILed — a FAIL is exactly the result worth
    # keeping. Only skip when the whole job was cancelled.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download paired-invariant findings
        uses: actions/download-artifact@v4
        with:
          name: forecast-invariants-paired
          path: /tmp/paired

      - name: Download e2e junit
        uses: actions/download-artifact@v4
        with:
          name: forecast-invariants-e2e
          path: /tmp/e2e
        continue-on-error: true

      - name: Assemble the dated findings file
        env:
          # The date the run fired (UTC) and the Actions run number make the
          # filename unique per run, so this is strictly append-only — no run
          # ever overwrites another's file.
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          E2E_RESULT: ${{ needs.real-lp-e2e.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          out_dir = Path("docs/handoffs/weekly-invariant-findings")
          out_dir.mkdir(parents=True, exist_ok=True)

          paired_path = Path("/tmp/paired/paired_invariant_findings.json")
          paired = (
              json.loads(paired_path.read_text()) if paired_path.exists() else None
          )

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          commit = subprocess.run(
              ["git", "rev-parse", "HEAD"], capture_output=True, text=True
          ).stdout.strip()
          payload = {
              "date": date,
              "run_id": os.environ.get("RUN_ID"),
              "run_number": os.environ.get("RUN_NUMBER"),
              "commit": commit,
              # The e2e slow test (real 3-year ERCOT solve + I1-I14) passed iff
              # its job concluded 'success'.
              "e2e_slow_passed": os.environ.get("E2E_RESULT") == "success",
              "paired_invariants": paired,
          }
          fname = out_dir / f"weekly-{date}-run{os.environ['RUN_NUMBER']}.json"
          fname.write_text(json.dumps(payload, indent=2) + "\n")
          print(f"wrote {fname}")
          PY

      - name: Commit the findings (append-only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/handoffs/weekly-invariant-findings/
          if git diff --cached --quiet; then
            echo "no new findings file to commit"
            exit 0
          fi
          git commit -m "chore(invariants): persist weekly forecast-invariant findings"
          # Push to the branch that triggered the run (main on schedule). Retry
          # once on a race with a concurrent push.
          git push || { git pull --rebase && git push; }
