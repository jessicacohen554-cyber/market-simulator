name: apply-miso-1347-edits

# Applies the MISO #1347 session's gap-register / calibration-log edits onto
# this branch, server-side — the apply-export-cap.yml / apply-w3a-seam-clock
# precedent. Those rows are multi-kilobyte single lines a hand-transcribed
# full-file push could silently corrupt, so the edits travel as short-anchor
# splices (.github/patches/2026_07_07_miso_1347_register_log_edits.py).
# Idempotent: the apply commit's own push re-triggers this workflow, which
# then no-ops on the already-applied keys.
on:
  push:
    branches:
      - claude/miso-keeper-coal-offers-w4c-v04vg3
    paths:
      - .github/patches/2026_07_07_miso_1347_register_log_edits.py
      - .github/workflows/apply-miso-1347-edits.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-edits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply register/log edits and push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          python .github/patches/2026_07_07_miso_1347_register_log_edits.py
          if git diff --quiet; then
            echo "no changes (edits already applied)"
            exit 0
          fi
          git add -u
          git commit -m "docs: record #1347 rule-23 trigger-audit outcome in the gap register (server-side anchored splices) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
