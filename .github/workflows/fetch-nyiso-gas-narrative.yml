# Harvest NYISO-hub daily gas prints from the EIA NG Weekly Update narrative on
# a GitHub runner (open egress; the Claude remote env blocks www.eia.gov) and
# commit the refreshed CSVs back to the branch it ran on. Recovers the
# holiday-week Transco Z6 NY prints the compact-table scrape missed (the
# Dec-2024 late-month hole), harvests any Iroquois Zone 2 narrative prints, and
# recomputes the NYISO monthly hub levels from the completed daily series.
# On-demand only (the archive is static history).
name: Fetch NYISO gas narrative prints

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Earliest year to harvest"
        default: "2023"
        type: string
      end_year:
        description: "Latest year to harvest"
        default: "2025"
        type: string
  # The Claude remote env's GitHub integration cannot POST workflow dispatches
  # (403), so pushing an edit to THIS file is the trigger: path-scoped to the
  # workflow itself, the runner's own data commit can never re-fire it.
  push:
    paths:
      - ".github/workflows/fetch-nyiso-gas-narrative.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Harvest NGWU narrative prints
        run: |
          python scripts/fetch_nyiso_gas_narrative.py \
            --start-year ${{ github.event.inputs.start_year || '2023' }} \
            --end-year ${{ github.event.inputs.end_year || '2025' }}

      - name: Commit and push refreshed gas prints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/gas-prices/transco_z6_ny_daily.csv \
                  data/raw/gas-prices/transco_z6_iroquois_monthly.csv \
                  data/raw/gas_basis_by_iso_month.csv
          git add -f data/raw/gas-prices/iroquois_z2_daily.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no narrative-print changes to commit"
            exit 0
          fi
          git commit -m "data: NGWU narrative gas prints (Transco Z6 NY gap-fill + Iroquois Z2) (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
