name: file-integrity-guard

# CLAUDE.md rule 27 enforcement: fail any PR (and flag any push to main) that
# shrinks a core source file by >30% or deletes it. Guards against
# response-budget-truncated API pushes (incident 2026-07-15: constants.py
# 6,368 -> 33 lines merged to main, five failed fragment restores).
# Runtime is seconds — durable infrastructure, not a compute job (repo CI cost
# policy). The `push` trigger stays path-filtered; the `pull_request` trigger is
# deliberately unfiltered so the check always REPORTS (see the `on:` block).
# Escape hatch: the `intentional-shrink` PR label.

on:
  # NO `paths:` FILTER ON `pull_request` — deliberate, and the ONLY reason this
  # trigger is unfiltered (the `push` trigger below keeps its filter, since a
  # push to main needs no always-report property and unfiltered runs there are
  # billed minutes for nothing).
  #
  # A required status check that never REPORTS is `pending`, not `passed`, so a
  # path-filtered workflow strands every PR outside its filter — for this one,
  # every docs-only PR, i.e. every records-lane PR. That is blocker 2 of owner
  # ruling R-P (director board v19b, H-1), and it is why this guard could not
  # be added to the required set. Removing the filter makes the job REPORT on
  # every PR; on an out-of-scope PR it is a no-op success, because the scan is
  # already scoped by `is_core()` below and simply finds nothing:
  # `expected` = `scanned` = 0 and the step prints "Scanned 0/0 core paths."
  # The rule-27 semantics are unchanged — only the reporting surface widens.
  #
  # Do NOT re-add a `paths:` filter here to save runner minutes without first
  # taking this check out of the required set: the two are a package.
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "CLAUDE.md"
      - "model-methodology-spec.md"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  shrink-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          # DATA-FREE CHECKOUT (the ci.yml 2026-08-14 pattern, missed here
          # because this is a separate workflow file): without it, checking out
          # the working tree lazy-fetches every tip blob INCLUDING the ~7.5 GB
          # data/raw, and the checkout step itself dies before the guard script
          # ever runs — rule-27 enforcement red on infrastructure, not content
          # (first observed on PR #3937). The guard needs no working-tree data
          # at all: the diff scan is tree-level and blob_lines() cat-files
          # individual core-path blobs, which lazy-fetch on demand either way.
          # Non-cone mode because cone mode cannot negate.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/

      - name: Fail on >30% shrink or deletion of core files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -uo pipefail
          if [[ ",${PR_LABELS}," == *",intentional-shrink,"* ]]; then
            echo "PR carries the 'intentional-shrink' label — guard skipped."
            exit 0
          fi
          # On force-push / first-push events the before-SHA may be unknown.
          # fetch-depth 0 above already brings every refs/heads/* commit, so
          # the base tip is normally present; the explicit fetch is the
          # belt-and-braces for an event whose base ref was not in that set.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none origin "${BASE_SHA}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base SHA ${BASE_SHA} unavailable; falling back to HEAD^."
            BASE_SHA=$(git rev-parse "${HEAD_SHA}^")
          fi

          # Diff against the MERGE-BASE, never the base TIP. On a pull_request
          # event `pull_request.base.sha` is the base branch's tip AT THE TIME
          # THE JOB RUNS, not the commit the branch forked from. At ~15
          # merges/hour that tip has usually moved past the PR head's fork
          # point, and a two-dot `git diff <base-tip> <head>` then reports every
          # file main gained since the fork as DELETED by this PR — a phantom
          # deletion, red on a clean PR, and most reliably on the ≥300-line
          # files this guard exists to protect. Measured at the v31 coda
          # 8e26a153 (base tip 9e8de3dc, head fe197d6e): two-dot reported 3
          # deletions, all three files ADDED by #4842 and untouched by the
          # branch, one of them 547 lines; the merge-base form reported 0.
          # The merge-base is what `git diff <base>...<head>` (three-dot) uses;
          # it is computed once here and used for BOTH the diff below and the
          # blob_lines() base read, so the two never disagree about what "base"
          # means. A merge-base that IS the base tip (fast-forward push, or a
          # branch rebased onto the current tip) leaves BASE_SHA unchanged.
          if MERGE_BASE=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null) && [[ -n "${MERGE_BASE}" ]]; then
            if [[ "${MERGE_BASE}" != "$(git rev-parse "${BASE_SHA}")" ]]; then
              echo "Base tip ${BASE_SHA} is past the fork point; diffing from merge-base ${MERGE_BASE} instead."
            fi
            BASE_SHA="${MERGE_BASE}"
          else
            echo "::warning::no merge-base between ${BASE_SHA} and ${HEAD_SHA}; diffing the base tip directly."
          fi
          echo "Comparing merge-base ${BASE_SHA} -> ${HEAD_SHA}"

          # Line count of a blob at a rev; prints nothing and returns 1 when the
          # path does not exist there.
          #
          # NEVER write this as `$(git show ... | wc -l || echo 0)`. `wc -l`
          # prints its own "0" even when the upstream git fails, so the `|| echo
          # 0` appends a SECOND zero and the variable becomes the two-line string
          # "0\n0". Feeding that to `(( ))` raises "syntax error in expression",
          # and in bash 5.2 an arithmetic-expansion error inside a loop body
          # ABANDONS THE WHOLE LOOP and resumes after it — so the scan stopped at
          # the first ADDED file (which by definition has no base blob) and every
          # later path went unexamined, while the job still exited 0.
          #
          # That is not hypothetical: it is exactly how PR #2866 truncated
          # scripts/render_calibration_html.py 1,911 -> 1 lines with this guard
          # reporting SUCCESS. The added backfill_nonfossil_hourly.py script
          # sorts before it in the diff, killed the loop, and the truncation was
          # never checked. An integrity guard that fails OPEN is worse than none,
          # so this step now also verifies it examined every candidate path.
          blob_lines() {
            local rev="$1" path="$2"
            git cat-file -e "${rev}:${path}" 2>/dev/null || return 1
            git cat-file blob "${rev}:${path}" 2>/dev/null | wc -l | tr -cd '0-9'
          }

          is_core() {
            case "$1" in
              src/*|scripts/*|CLAUDE.md|model-methodology-spec.md|.github/workflows/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          git diff --name-status -M "${BASE_SHA}" "${HEAD_SHA}" > /tmp/diff.tsv
          # `if ... then ... fi`, NOT `is_core "$p" && echo x`. GitHub runs this
          # step under `bash -e`, so with `pipefail` the `&&` form leaves the
          # LOOP's exit status at 1 whenever the final path read is not a core
          # path — which poisons the whole pipeline and kills the script before
          # a single file is checked. The `if` form always leaves status 0.
          # (This failed exactly that way on PR #2893; a plain-`bash` local
          # replay could not see it, so replay this step with `bash -e`.)
          expected=$(cut -f1,2 /tmp/diff.tsv | while IFS=$'\t' read -r st p; do
            if is_core "$p"; then echo x; fi
          done | wc -l | tr -cd '0-9')

          fail=0
          scanned=0
          while IFS=$'\t' read -r status path renamed; do
            [[ -z "${status:-}" ]] && continue
            is_core "$path" || continue
            scanned=$(( scanned + 1 ))
            # An ADDED path has no base content and cannot have shrunk.
            if [[ "$status" == A* ]]; then continue; fi
            if ! base_lines=$(blob_lines "${BASE_SHA}" "${path}"); then
              echo "::warning file=${path}::no blob at base ${BASE_SHA} for status '${status}' — skipped."
              continue
            fi
            # Only guard files that were substantial at base (>=300 lines).
            if [[ -z "$base_lines" ]] || (( base_lines < 300 )); then continue; fi
            if [[ "$status" == D* ]]; then
              echo "::error file=${path}::core file DELETED (was ${base_lines} lines). Add the 'intentional-shrink' label if deliberate (CLAUDE.md rule 27)."
              fail=1
              continue
            fi
            # A rename (R<score>) is guarded at its destination: the content
            # must survive the move intact, wherever it lands.
            head_path="$path"
            if [[ "$status" == R* ]]; then
              head_path="$renamed"
            fi
            head_lines=$(blob_lines "${HEAD_SHA}" "${head_path}") || head_lines=0
            [[ -z "$head_lines" ]] && head_lines=0
            min_lines=$(( base_lines * 70 / 100 ))
            if (( head_lines < min_lines )); then
              echo "::error file=${head_path}::shrank ${base_lines} -> ${head_lines} lines (>30%). Likely a truncated API push (CLAUDE.md rule 27). Restore the full content or add the 'intentional-shrink' label if deliberate."
              fail=1
            fi
          done < /tmp/diff.tsv

          # Fail CLOSED on an incomplete scan: if the loop ever exits early again
          # (for this reason or another), that must be a red job, not a green one.
          if (( scanned != expected )); then
            echo "::error::file-integrity-guard scanned ${scanned} of ${expected} core paths — the scan aborted early and its result is NOT trustworthy."
            fail=1
          else
            echo "Scanned ${scanned}/${expected} core paths."
          fi

          if (( fail )); then
            echo "file-integrity-guard FAILED — see errors above."
            exit 1
          fi
          echo "file-integrity-guard passed."
