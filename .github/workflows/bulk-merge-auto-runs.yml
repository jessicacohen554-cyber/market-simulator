name: Bulk-merge auto runs

# Collapse every accumulated auto/* calibration branch into the target branch
# (default main). Each auto/* branch only ADDS its own bundle dir + registry
# sidecar + runs/<id>.js (+ byte-deterministic bench parts) — disjoint files —
# so sequential squash-merges are conflict-free. After the merges land, the
# "Deploy site to GitHub Pages" workflow (chained via workflow_run on this
# workflow's completion) assembles the shared manifest/benchmark/html from the
# committed parts and takes the dashboard live. Stale/diverged branches are
# skipped with a clear log rather than forcing a conflicted merge.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to collect the auto/* runs into"
        type: string
        default: main
      delete_merged:
        description: "Delete each auto/* branch after it is merged"
        type: boolean
        default: true

concurrency:
  group: bulk-merge-auto-runs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bulk-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Squash-merge all auto/* branches
        env:
          TARGET: ${{ inputs.target_branch }}
          DELETE_MERGED: ${{ inputs.delete_merged }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$TARGET"
          git checkout -B "$TARGET" "origin/$TARGET"

          mapfile -t BRANCHES < <(git ls-remote --heads origin 'auto/*' \
            | awk '{print $2}' | sed 's#refs/heads/##' | sort)
          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "no auto/* branches found — nothing to do."
            exit 0
          fi
          echo "found ${#BRANCHES[@]} auto/* branch(es):"
          printf '  %s\n' "${BRANCHES[@]}"

          MERGED=()
          for br in "${BRANCHES[@]}"; do
            git fetch origin "$br"
            if git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo ":: $br already in $TARGET — marking for cleanup."
              MERGED+=("$br")
              continue
            fi
            if git merge --squash FETCH_HEAD; then
              if git diff --cached --quiet; then
                echo ":: $br adds nothing new — skipping commit, will clean up."
                git reset --hard HEAD
              else
                git commit -m "bulk-merge: ${br#auto/}"
                echo ":: merged $br"
              fi
              MERGED+=("$br")
            else
              echo "::warning::$br conflicts with $TARGET — skipping. Rebase it onto $TARGET and re-run."
              git reset --hard HEAD
            fi
          done

          if [ "${#MERGED[@]}" -eq 0 ]; then
            echo "nothing merged."
            exit 0
          fi

          # Publish the collected merges (rebase-retry against concurrent pushes).
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:$TARGET"; then
              echo "pushed ${#MERGED[@]} merged run(s) to $TARGET."
              break
            fi
            echo "$TARGET moved; rebasing (attempt $attempt)"
            git fetch origin "$TARGET"
            git rebase "origin/$TARGET"
            if [ "$attempt" -eq 6 ]; then
              echo "::error::could not push to $TARGET after retries."
              exit 1
            fi
          done

          if [ "$DELETE_MERGED" = "true" ]; then
            for br in "${MERGED[@]}"; do
              echo ":: deleting $br"
              git push origin --delete "$br" || echo "::warning::could not delete $br"
            done
          fi

          echo "Done. Deploy site to GitHub Pages will assemble + publish the dashboard."
