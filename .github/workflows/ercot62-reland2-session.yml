# One-shot: RE-LAND the ERCOT-62 session onto claude/ercot62-reland2 (fresh
# branch off post-#2148 main; PR #2145 was closed unmerged, so the landing
# commit never reached main). The verified patch blob ALREADY LIVES IN MAIN
# (scripts/probes/_ercot62_reland/*, merged via PR #2144) and the rebased diff
# against current main is byte-identical (sha 2800ef74 — none of the
# intervening main commits touch the 18 patched files), so this workflow just
# decodes the committed blob (sha-gated), applies it, executes the
# owner-directed ERCOT registry prune by name, rebuilds status.js, runs the
# post-conditions + mechanism unit tests, and pushes to THIS branch. Patch
# contents = PR #2139's tree: ercot59 keeper promotion (owner decision
# 2026-07-12), ERCOT registry prune to keeper+later, the
# ercot_offer_surface_lowcurve G-22 LOW leg (default-off) + derive + frozen
# JSON + tests + probes, the p1_bid_adjust_prep seam hook, the 62b bridge
# probe, the trough-price-formation diagnosis (§6), and the calibration-log
# entries.
name: ercot62-reland2-session

on:
  push:
    branches:
      - claude/ercot62-reland2
    paths:
      - .github/workflows/ercot62-reland2-session.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot62-reland2-session
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply the rebased session patch (sha-gated, blob committed in main)
        run: |
          set -euo pipefail
          if grep -q "ercot_offer_surface_lowcurve" src/market_sim/config/scenarios.py; then
            echo "already applied — no-op"
            exit 0
          fi
          echo "2800ef7400af02d4be3e39129140374b990aea46e528f289b6a25945f73e6c54  /tmp/_ercot62_reland.patch" > /tmp/patch.sha
          cat scripts/probes/_ercot62_reland/diff.patch.xz.b64.part1 \
              scripts/probes/_ercot62_reland/diff.patch.xz.b64.part2 \
            | tr -d '\r\n ' | base64 -d | xz -d > /tmp/_ercot62_reland.patch
          sha256sum -c /tmp/patch.sha
          git apply --verbose /tmp/_ercot62_reland.patch
          # Owner-directed ERCOT registry prune (keeper + later only): the
          # deleted run payloads are too large to ride in the patch, so the
          # prune is executed here by name (bundle dirs under
          # results/calibration/ stay as the archival record).
          for id in 2026-07-10-ercot53-hsl-930fill 2026-07-10-ercot53-hsl-930fill-ablation \
                    2026-07-10-ercot55-930gap-c2fix 2026-07-10-ercot55-930gap-ablation \
                    2026-07-10-ercot55-surface-ab 2026-07-10-ercot55-surface-ablation \
                    2026-07-10-ercot56-nucwin 2026-07-10-ercot56-nucwin-ablation \
                    2026-07-11-ercot57-thermavail 2026-07-11-ercot57-thermavail-ablation \
                    2026-07-11-ercot58-joint-ordc-only 2026-07-11-ercot58-joint-ordc-only-ablation; do
            git rm -q "frontend/data/backcast/registry/$id.json" "frontend/data/backcast/runs/$id.js"
          done

      - name: Install package and rebuild status.js (committed, not deploy-generated)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . pytest
          python scripts/build_status.py
          grep -q "2026-07-12-ercot59-storage-deploy" frontend/data/backcast/status.js
          grep -q "2026-07-12-caiso-78-cc-hr" frontend/data/backcast/status.js

      - name: Post-conditions (entries present once, keeper state coherent)
        run: |
          set -euo pipefail
          for pat in "ERCOT keeper PROMOTED: \`ercot59 storage-deploy\`" "ERCOT-62: the binding-regime price-formation lane"; do
            n=$(grep -c "$pat" docs/calibration-log.md)
            if [ "$n" -ne 1 ]; then echo "FAIL: '$pat' count=$n" >&2; exit 1; fi
          done
          python - <<'PY'
          import json
          k = json.load(open("frontend/data/backcast/keepers.json"))
          assert k["ERCOT"] == "2026-07-12-ercot59-storage-deploy", k["ERCOT"]
          assert k["CAISO"] == "2026-07-12-caiso-78-cc-hr", k["CAISO"]
          assert "2026-07-12-ercot59-storage-deploy" in k["keepers"]
          assert "2026-07-10-ercot56-nucwin" not in k["keepers"]
          PY
          n=$(ls frontend/data/backcast/registry/ | grep -ci ercot)
          if [ "$n" -ne 2 ]; then echo "FAIL: ERCOT registry count=$n (want 2)" >&2; exit 1; fi

      - name: Run the mechanism unit tests
        run: |
          set -euo pipefail
          python -m pytest tests/test_ercot_offer_surface_lowcurve.py \
            tests/test_ercot_offer_surface_conditional.py \
            tests/test_recorded_cfg_fidelity.py \
            tests/test_floor_mechanisms_ablation.py -q

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ERCOT-62 session re-landing (rebased onto post-#2148 main; supersedes PRs #2139/#2145): ercot59 keeper PROMOTED (owner decision 2026-07-12) + ERCOT dashboard pruned to keeper+later (owner directive); G-22 conditional-offer-distribution LOW leg default-off with the v1/v2 probe refutation recorded; 62b bridge-composition probe; trough-price-formation diagnosis §6 + log entries

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01Kf2jhbBGfeMtxLrMb5eSuK"
          git push origin HEAD:claude/ercot62-reland2
