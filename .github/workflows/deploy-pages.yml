name: Deploy site to GitHub Pages

# The ONE publish pipeline. Stages the static site (landing page + learning
# hub + codebase site incl. the backcast dashboard pages) and deploys it to
# GitHub Pages. The backcast dashboard lives on the codebase site
# (docs/codebase-site/backcast-runs.html + calibration-status.html); its data
# is assembled from committed per-run registry sidecars + per-(ISO, year)
# bench parts by the stdlib-only scripts/build_manifest.py, then copied into
# docs/codebase-site/data/backcast/ by scripts/build_codebase_site_backcast.py
# (seconds, no model deps, no bundles). The old root backcast-results.html is
# a committed static redirect stub — never regenerated. Concurrent calibration
# sessions merge conflict-free — each only ADDS its own files
# (registry/<id>.json, runs/<id>.js, bench parts).
#
# Speed: the checkout is sparse (web roots + scripts only) and blobless, so the
# ~GBs of model bundles/inputs the repo tracks are never downloaded. End-to-end
# the deploy takes well under a minute, vs ~8 min for the old
# regen-commit -> chained-deploy pipeline (which this replaces — the
# "Regenerate backcast dashboard" workflow is retired).
on:
  push:
    branches: [main]
    # Any merge that changes what the site serves, including new calibration
    # runs (their sidecar/payload/bench parts live under frontend/), AND the
    # build scripts that produce the generated dashboard data files.
    paths:
      - "*.html"
      - "frontend/**"
      - "learning-hub/**"
      - "docs/codebase-site/**"
      - "scripts/build_manifest.py"
      - "scripts/build_codebase_site_backcast.py"
      - "scripts/build_status.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}
  # Calibration run / Bulk-merge push to main with GITHUB_TOKEN, whose pushes
  # do not fire the `push` trigger above (GitHub's recursion guard). Chain off
  # their completion so a freshly published run still deploys.
  workflow_run:
    workflows: ["Calibration run", "Bulk-merge auto runs"]
    types: [completed]

# Token scoped for the official Pages deployment flow, plus contents:write so
# the deploy can commit the refreshed dashboard data files (manifest.js /
# benchmark.js / completeness.js) back to main — it is their single writer.
permissions:
  contents: write
  pages: write
  id-token: write

# One in-flight deploy at a time. Do NOT cancel an in-progress run: a Pages
# publish that is interrupted partway can leave the live site in a broken /
# partial state (a hard 404 on freshly-generated files) even though the
# cancelled workflow reports success. When two merges land seconds apart the
# newer run queues behind the in-flight publish and supersedes any other queued
# run instead of killing the one that is mid-publish. This matches GitHub's
# official Pages deploy template.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the chained deploy when the upstream workflow failed (nothing new
    # landed on main); push/dispatch-triggered deploys always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (sparse + blobless — web assets only)
        # The repo also tracks ~GBs of model bundles/inputs the site never
        # serves; a sparse, blobless checkout of just the web roots (cone mode
        # always includes root files like index.html) downloads only the few
        # MB the site needs instead of the whole pack.
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            frontend
            learning-hub
            docs/codebase-site
            scripts

      - name: Stage the web assets
        run: |
          set -euo pipefail
          mkdir -p _site
          cp ./*.html _site/
          cp -r frontend _site/
          [ -d learning-hub ] && cp -r learning-hub _site/
          # Codebase Explorer doc site — the root landing page links to
          # docs/codebase-site/index.html, so stage it at the matching path.
          mkdir -p _site/docs
          cp -r docs/codebase-site _site/docs/codebase-site
          # Serve files verbatim (no Jekyll processing of the data JS).
          touch _site/.nojekyll

      - name: Assemble the backcast dashboard data
        # Pure-stdlib reducer over the committed registry sidecars + bench
        # parts -> writes _site/frontend/data/backcast/{manifest,benchmark}.js
        # and copies the full data set into
        # _site/docs/codebase-site/data/backcast/ for the dashboard pages.
        run: |
          set -euo pipefail
          python3 scripts/build_manifest.py --site-dir _site
          python3 scripts/build_codebase_site_backcast.py --site-dir _site
          echo "Staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Refresh the committed dashboard data files on main
        # The dashboard's shared data files are committed so a raw checkout's
        # local preview (bc-data.js falls back to frontend/data/backcast/)
        # works too, but only THIS workflow writes them: it is the single
        # writer on main, so calibration-run PRs never touch them and merge
        # conflict-free. Regenerate into the working tree (repo root) and
        # commit only when the data actually changed — the generator is
        # byte-deterministic, so a no-op deploy regenerates the files
        # byte-identical and the git-diff check below short-circuits.
        # A push by GITHUB_TOKEN does not re-trigger this workflow (GitHub's
        # recursion guard), so there is no deploy loop.
        run: |
          set -euo pipefail
          python3 scripts/build_manifest.py
          if git diff --quiet -- frontend/data/backcast/manifest.js \
                                 frontend/data/backcast/benchmark.js \
                                 frontend/data/backcast/completeness.js; then
            echo "Dashboard data files unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/backcast/manifest.js \
                  frontend/data/backcast/benchmark.js \
                  frontend/data/backcast/completeness.js
          git commit -m "dashboard: refresh generated data files [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main \
              && git push origin "HEAD:main" && exit 0
            echo "push attempt $i failed; retrying in $((i*5))s"; sleep $((i*5))
          done
          echo "Could not push refreshed dashboard files after retries." >&2
          exit 1

      - name: Configure Pages
        # enablement:true turns Pages on (source = GitHub Actions) if it isn't
        # already, so the first run on main brings the site live with no manual
        # repo-settings step.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
