# Fetch CAISO OASIS data (U2 hub LMPs, U4 TAC load) from a GitHub runner,
# which has unrestricted egress (the Claude remote environment cannot reach
# oasis.caiso.com). Manually triggered; commits hourly aggregates back to the
# branch it was dispatched on and attaches the raw window CSVs as an
# artifact. Safe to re-run: the fetch script resumes from what the
# aggregates already cover.
#
# The 5-minute RTM pull is the long pole (worst case several hours of
# rate-limited queries). If a run hits the fetch deadline, whatever was
# fetched is still aggregated and committed — just dispatch it again.
name: Fetch CAISO OASIS data

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets to fetch (space-separated: dam rtm load)"
        default: "dam rtm load"
        type: string
      years:
        description: "Years to fetch (space-separated)"
        default: "2023 2024 2025"
        type: string
      sleep:
        description: "Seconds between OASIS requests"
        default: "5"
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Fetch from OASIS (deadline-limited)
        continue-on-error: true
        run: |
          python scripts/fetch_caiso_oasis.py \
            --datasets ${{ inputs.datasets }} \
            --years ${{ inputs.years }} \
            --sleep ${{ inputs.sleep }} \
            --deadline-minutes 310

      - name: Aggregate to hourly and stage raw files
        if: always()
        run: |
          python scripts/postprocess_oasis_downloads.py --stage-dir /tmp/oasis-raw

      - name: Upload raw window CSVs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-raw-${{ github.run_id }}
          path: /tmp/oasis-raw
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and push aggregates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inputs/raw-data/lmp-data/CAISO inputs/raw-data/zone-specific-demand/CAISO
          if git diff --cached --quiet; then
            echo "no new data to commit"
            exit 0
          fi
          git commit -m "data: CAISO OASIS hourly aggregates (workflow run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
