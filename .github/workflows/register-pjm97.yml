# One-shot: solve pjm-97 (pjm-96 recipe + measured internal interface limits
# + pergen reserve + measured ramp) on the runner and register it on the
# calibration dashboard — the register-pjm96-v2 pattern (see its header and
# register-pjm96's for why the ~1.5 MB run payload cannot travel through the
# session env's push path). Additions beyond the v2 pattern:
#
#   1. The recipe consumes two gitignored clean datatypes, so they are
#      regenerated from committed raw on the runner BEFORE the solve
#      (transfer-interface-limits via its curate script; ramp-capability via
#      regenerate_clean),
#   2. the solve output is scanned for the overlays' fallback warnings and
#      the job FAILS if any fired — a silently-degraded solve must never be
#      registered as the run it claims to be, and
#   3. the session's calibration-log entry is appended (heading-gated) and
#      committed with the results.
#
# Run 29096868050 completed everything through the results commit but the
# push failed: the build_manifest preview step regenerates tracked
# deploy-owned shared files in the working tree, which blocked
# `git pull --rebase`. The preview step is removed (the Pages deploy is
# those files' single writer) and the push hard-resets the tree after
# committing. Trigger: push of .github/patches/pjm97_definition.txt or of
# this file. Idempotent; prunes pjm-83 and pjm-86 (top-15 retention).
# Delete this workflow + the patches payload from main after the PR merges
# (one-shot convention).

name: register-pjm97

on:
  push:
    branches:
      - claude/pjm-measured-interface-limits-2lchu7
    paths:
      - .github/patches/pjm97_definition.txt
      - .github/workflows/register-pjm97.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-and-register:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gate on the definition file (pushed only after local analysis)
        run: test -s .github/patches/pjm97_definition.txt

      - name: Free runner disk (hosted toolchains this job never uses; room for the swapfile)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/microsoft || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Swapfile at /swapfile2 (runners ship an active 3 GB /swapfile; pjm-78/79 10 GB convention)
        run: |
          sudo swapon --show || true
          sudo fallocate -l 10G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=10240
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Install package
        run: pip install -e .

      - name: Regenerate the recipe's clean inputs (gitignored; from committed raw)
        run: |
          set -euo pipefail
          python scripts/curate_transfer_interface_limits.py
          python scripts/regenerate_clean.py ramp-capability
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, "src"); sys.path.insert(0, ".")
          from scripts.lib.clean_io import clean_exists
          missing = [
              ("transfer-interface-limits", y)
              for y in (2023, 2024, 2025)
              if not clean_exists("transfer-interface-limits", iso="PJM", year=y)
          ]
          if not clean_exists("ramp-capability", iso="PJM"):
              missing.append(("ramp-capability", None))
          if missing:
              raise SystemExit(f"clean inputs missing after regeneration: {missing}")
          print("clean inputs present:", "transfer-interface-limits 2023-2025 + ramp-capability (PJM)")
          PYEOF

      - name: Solve pjm-97 (skip if bundle already complete; FAIL on measured-input fallback)
        run: |
          set -euo pipefail
          if [ -f results/calibration/pjm97_measured_interfaces/system.parquet ] && \
             [ -f results/calibration/pjm97_measured_interfaces/meta.json ]; then
            echo "bundle already present -- skipping solve"
          else
            python scripts/run_pjm97_measured_interfaces.py 2>&1 | tee /tmp/pjm97_solve.log
            if grep -Eq "no transfer-interface-limits clean partition|falling back to class ramp|static TTC kept" /tmp/pjm97_solve.log; then
              echo "::error::a measured-input overlay fell back to its static path -- this is not the pjm-97 recipe"
              exit 1
            fi
          fi

      - name: Register on the dashboard (skip if sidecar already exists)
        run: |
          set -euo pipefail
          if [ -f frontend/data/backcast/registry/2026-07-10-pjm-97-measured-interfaces.json ]; then
            echo "already registered -- skipping"
          else
            python scripts/dashboard_add_run.py --label "pjm 97 measured-interfaces" \
                --bundle results/calibration/pjm97_measured_interfaces
          fi

      - name: Legitimacy diagnostics (exit 1 = a D-gate failed; the artifact is the deliverable, C7/C8 score it — a probe may fail gates)
        run: |
          python scripts/legitimacy_diagnostics.py \
              --bundle results/calibration/pjm97_measured_interfaces --iso PJM \
              --json-out results/calibration/pjm97_measured_interfaces/legitimacy_diagnostics.json \
            || echo "::warning::legitimacy D-gates failed (probe) -- artifact written, scored by C7/C8"
          test -s results/calibration/pjm97_measured_interfaces/legitimacy_diagnostics.json

      - name: Overwrite the sidecar definition with the post-analysis finding
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import json
          from pathlib import Path
          definition = Path(".github/patches/pjm97_definition.txt").read_text().strip()
          p = Path("frontend/data/backcast/registry/2026-07-10-pjm-97-measured-interfaces.json")
          d = json.loads(p.read_text())
          d["definition"] = definition
          p.write_text(json.dumps(d, indent=2) + "\n")
          print("sidecar definition overwritten:", len(definition), "chars")
          PYEOF

      - name: Append the session calibration-log entry (heading-gated)
        run: |
          set -euo pipefail
          if ! grep -q "pjm 97 measured-interfaces): PROBE, keeper stays pjm-94" docs/calibration-log.md; then
            cat .github/patches/pjm97_callog_entry.md >> docs/calibration-log.md
            echo "calibration-log entry appended"
          else
            echo "calibration-log entry already present -- skipping"
          fi

      - name: Prune the two oldest PJM registrations (top-15 retention; 17 after pjm-96 + pjm-97)
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            frontend/data/backcast/registry/2026-07-06-pjm-83-srmc-reground.json \
            frontend/data/backcast/runs/2026-07-06-pjm-83-srmc-reground.js \
            frontend/data/backcast/registry/2026-07-07-pjm-86-pjm83-head.json \
            frontend/data/backcast/runs/2026-07-07-pjm-86-pjm83-head.js

      - name: Verify registry/payload parity (CI gate)
        run: python scripts/check_registry_payload_parity.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add \
            results/calibration/pjm97_measured_interfaces/meta.json \
            results/calibration/pjm97_measured_interfaces/run_config.json \
            results/calibration/pjm97_measured_interfaces/metrics.json \
            results/calibration/pjm97_measured_interfaces/legitimacy_diagnostics.json \
            frontend/data/backcast/registry/2026-07-10-pjm-97-measured-interfaces.json \
            frontend/data/backcast/runs/2026-07-10-pjm-97-measured-interfaces.js \
            frontend/data/backcast/bench \
            docs/calibration-log.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          cat > /tmp/pjm97_commit_msg.txt <<'MSGEOF'
          results: register pjm-97 measured-interfaces (G-20 Phase-2 internal-interface arm) -- hypothesis REFUTED, keeper stays pjm-94

          pjm-97 = pjm-96 recipe + pjm_measured_interface_limits (measured hourly
          Data Miner 2 internal interface limits on the seven mapped links,
          transfer-interface-limits clean datatype, rules 13/14) +
          pjm_reserve_pergen + measured_ramp_capability (pjm-81 owner
          recommendation). The caps bind (AEP->Dominion at its measured hourly
          limit ~94% of hours) but the eastern under-run persists on seam supply
          + commitment posture; CT per-plant capture falls; C3c unchanged at 0h.
          Full finding in the sidecar definition; session entry appended to
          docs/calibration-log.md. Prunes pjm-83 and pjm-86 (top-15 retention).

          Solved + registered server-side (this workflow) -- the run payload
          exceeds the session push path (register-pjm96 precedent).
          MSGEOF
          sed -i 's/^ \{10\}//' /tmp/pjm97_commit_msg.txt
          git commit -F /tmp/pjm97_commit_msg.txt
          # Drop any unstaged edits to tracked files (e.g. regenerated shared
          # data) so pull --rebase cannot refuse; the commit holds everything
          # this run publishes.
          git reset --hard HEAD
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
