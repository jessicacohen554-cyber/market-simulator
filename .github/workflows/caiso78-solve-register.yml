# One-shot: solve the caiso-78 (corrected CC heat-rate basis) A/B probe pair
# (main + zero-forcing ablation twin) on CI and register both on the backcast
# dashboard as PROBES. The caiso-67/69/74/75/76/77 precedent: the session
# environment cannot transport the ~450 KB run payloads (or the 384 KB
# fleet.py) through the MCP push_files relay byte-safely, so the code fix
# travels as a committed xz+base64 git patch, the solve+register runs here,
# and the per-run files are committed via the GitHub Data API with the
# runner's token (scripts/ci_api_upload_multi.py). Keeper stays
# 2026-07-12-caiso-77-firm-selfschedule; promotion is a separate decision
# evaluated from the committed scores.
#
# Probe: scripts/probes/_caiso78_cc_hr_basis_ab.py — the caiso-77 keeper
# recipe unchanged; the single delta is the fleet_to_bins heat-rate/
# capacity-basis fix (FINDING-caiso78-cc-hr-basis-2026-07-12.md §3: under
# cc_nameplate_summer_derate the plant base HR was divided by the
# nameplate-rescaled capacity, deflating every CC plant's offer by its own
# net-summer/nameplate ratio — differentially, scrambling the within-CC
# merit order). Years 2023-2025 sequential within each invocation
# (CLAUDE.md rule 12); the two invocations run sequentially on this runner.
#
# NOTE (v1 postmortem, run 29170225341): the runner token cannot push a ref
# whose NEW commits touch .github/workflows/* — the patch/prune commits here
# touch only src/tests/registry files, and all bundle payloads go through
# the Data API, never `git push` of large packs.
#
# The CAISO registry is at 15/15, so registration is preceded by the top-15
# prune (rule 15 retention): the caiso-70 g61b pair — a refuted probe
# (negative result, FINDING-caiso70 keeps the record; bundle dirs stay).
name: caiso78-solve-register

on:
  push:
    branches:
      - claude/caiso-calibration-tuning-58pd6q
    paths:
      - .github/workflows/caiso78-solve-register.yml

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and commit the caiso-78 source patch
        run: |
          set -euo pipefail
          # fleet.py (384 KB) + test_fleet.py (77 KB) cannot transit the
          # push_files relay byte-safely; the fix travels as a committed
          # xz+base64 git patch (_caiso77_code.patch precedent) and is
          # applied + committed HERE with real git, making the branch the
          # reproducible source of the registered runs.
          if git apply --check --reverse < <(base64 -d scripts/probes/_caiso78_code.patch.xz.b64 | xz -d) 2>/dev/null; then
            echo "patch already applied and committed — skipping"
          else
            base64 -d scripts/probes/_caiso78_code.patch.xz.b64 | xz -d | git apply
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "caiso-78: fleet_to_bins CC heat-rate/capacity-basis fix + regression test (applied from _caiso78_code.patch.xz.b64) [skip ci]"
            git push origin HEAD:claude/caiso-calibration-tuning-58pd6q
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl

      - name: Regression-test the fix
        run: |
          python -m pytest tests/test_fleet.py::TestCcNameplateRescaleHeatRate -q

      - name: Curate clean partitions the recipe reads
        run: |
          set -euo pipefail
          # data/clean is derived/gitignored — a fresh checkout has neither
          # partition. Without capacity-deliverability the keeper's published
          # MIC seam supersession silently skips (caiso-69 precedent).
          PYTHONPATH="$PWD" python scripts/curate_capacity_deliverability.py --isos CAISO

      - name: Solve caiso-78 main (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso78_cc_hr_basis_ab.py main

      - name: Solve caiso-78 ablation twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso78_cc_hr_basis_ab.py ablation

      - name: Write probe attestations
        run: python scripts/probes/_caiso78_attestation.py

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso67/69/7475/76/77-solve-register precedent).
          for b in caiso78_cc_hr_basis caiso78_cc_hr_basis-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso CAISO --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Prune CAISO registry to top-15 (caiso-70 refuted-probe pair, oldest)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/caiso-calibration-tuning-58pd6q
          git rm -q \
            frontend/data/backcast/registry/2026-07-10-caiso-70-g61b-decrowd.json \
            frontend/data/backcast/registry/2026-07-10-caiso-70-g61b-ablation.json \
            frontend/data/backcast/runs/2026-07-10-caiso-70-g61b-decrowd.js \
            frontend/data/backcast/runs/2026-07-10-caiso-70-g61b-ablation.js
          git commit -m "Prune caiso-70 refuted-probe pair sidecars + payloads (top-15 retention, displaced by caiso-78) [skip ci]"
          git push origin HEAD:claude/caiso-calibration-tuning-58pd6q

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 78 cc hr basis" \
            --bundle results/calibration/caiso78_cc_hr_basis | tee /tmp/r78m.out
          python scripts/dashboard_add_run.py \
            --label "caiso 78 cc hr basis ablation" \
            --bundle results/calibration/caiso78_cc_hr_basis-ablation | tee /tmp/r78a.out
          echo "RID78M=$(grep '^RUN_ID=' /tmp/r78m.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID78A=$(grep '^RUN_ID=' /tmp/r78a.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID78M" --bundle results/calibration/caiso78_cc_hr_basis \
            --rid "$RID78A" --bundle results/calibration/caiso78_cc_hr_basis-ablation \
            --branch claude/caiso-calibration-tuning-58pd6q \
            --message "results: register caiso-78 (corrected CC heat-rate basis) PROBE + zero-forcing twin on the backcast dashboard (keeper stays caiso-77) [skip ci]"
