name: Regenerate backcast dashboard

# The deterministic post-merge reducer. Whenever a calibration run lands on main
# (a new bundle + its registry sidecar), this rebuilds the SHARED dashboard files
# — manifest.js, benchmark.js, backcast-results.html and every runs/<id>.js —
# from ALL registered runs in one pass (scripts/regen_dashboard.py). Because it
# consumes every sidecar present, concurrent merges converge to the same result
# and none can drop another's run. It then commits the regenerated files, which
# the "Deploy site to GitHub Pages" workflow picks up to take the dashboard live.
#
# Triggers:
#   * workflow_run — fires after Calibration run / Bulk-merge auto runs finish,
#     even when those pushed to main with GITHUB_TOKEN (a plain push event would
#     be suppressed by GitHub's recursion guard, so we cannot rely on `on: push`
#     alone for token-driven publishes).
#   * push (human PR merges of auto/* branches) on the bundle/registry paths.
#   * workflow_dispatch — manual rebuild.
# Trigger paths intentionally EXCLUDE this job's own outputs (manifest/benchmark/
# runs/html), so its commit never re-triggers itself.
on:
  workflow_run:
    workflows: ["Calibration run", "Bulk-merge auto runs"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "results/calibration/**"
      - "frontend/data/backcast/registry/**"
  workflow_dispatch: {}

# Only the newest rebuild matters (the output is a pure function of the registry),
# so supersede any in-flight regen.
concurrency:
  group: dashboard-regen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate + commit dashboard
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regen_and_stage() {
            python scripts/regen_dashboard.py
            git add frontend/data/backcast/manifest.js \
                    frontend/data/backcast/benchmark.js \
                    frontend/data/backcast/runs \
                    backcast-results.html
          }

          regen_and_stage
          if git diff --cached --quiet; then
            echo "dashboard already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "dashboard: regenerate from registry [auto]"

          # Race-safe publish: on rejection, rebase onto the new main and
          # re-regenerate so any sidecar added meanwhile is included.
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:main"; then
              echo "pushed regenerated dashboard."
              exit 0
            fi
            echo "main moved; rebasing + re-regenerating (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; }
            regen_and_stage
            git diff --cached --quiet && { echo "now up to date."; exit 0; }
            git commit -m "dashboard: regenerate from registry [auto]"
          done
          echo "::error::could not push regenerated dashboard after retries."
          exit 1
