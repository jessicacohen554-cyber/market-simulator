# One-shot: solve the caiso-74 (measured battery AS-award reservation) and
# caiso-75 (measured 2023 demand-clock realignment) A/B probe pairs (main +
# zero-forcing ablation twins) on CI and register all four on the backcast
# dashboard as PROBES. The caiso-67/69 precedent: the session environment
# cannot transport the ~450 KB run payloads through the MCP push_files relay
# byte-safely, so the solve+register runs here and the per-run files are
# committed via the GitHub Data API with the runner's token
# (scripts/ci_api_upload_multi.py). Keeper stays caiso65-seam-envelope-clock;
# promotion is a separate decision. The session's local solves of the same
# recipes are the verification copies (FINDING-caiso74/75 quote them).
#
# Probes: scripts/probes/_caiso74_storage_as_ab.py and
# scripts/probes/_caiso75_demand_clock_ab.py (committed on this branch) —
# each the caiso-73 recipe (caiso-65 keeper flags + temp derate + SP15 split
# + startup-aware bridge + hydro envelope + firm import shape,
# ct_netload_drag=False) plus its single delta. Years 2023-2025 sequential
# within each invocation (CLAUDE.md rule 12); the four invocations run
# sequentially on this one runner.
name: caiso7475-solve-register

on:
  push:
    branches:
      - claude/caiso-calibration-continuation-3ftscz
    paths:
      - .github/workflows/caiso7475-solve-register.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl

      - name: Curate clean partitions the recipes read
        run: |
          set -euo pipefail
          # data/clean is derived/gitignored — a fresh checkout has neither
          # partition. Without capacity-deliverability the keeper's published
          # MIC seam supersession silently skips (caiso-69 precedent); without
          # storage-as-awards the caiso-74 flag hard-errors by design.
          PYTHONPATH="$PWD" python scripts/curate_capacity_deliverability.py --isos CAISO
          PYTHONPATH="$PWD" python scripts/curate_storage_as_awards.py --isos CAISO

      - name: Solve caiso-74 main (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso74_storage_as_ab.py main

      - name: Solve caiso-74 ablation twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso74_storage_as_ab.py ablation

      - name: Solve caiso-75 main (2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso75_demand_clock_ab.py main

      - name: Solve caiso-75 ablation twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_caiso75_demand_clock_ab.py ablation

      - name: Write probe attestations
        run: python scripts/probes/_caiso7475_attestations.py

      - name: Score legitimacy diagnostics (all four bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso67/69-solve-register precedent).
          for b in caiso74_storage_as caiso74_storage_as-ablation \
                   caiso75_demand_clock caiso75_demand_clock-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso CAISO --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register all four runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 74 storage as reservation" \
            --bundle results/calibration/caiso74_storage_as | tee /tmp/r74m.out
          python scripts/dashboard_add_run.py \
            --label "caiso 74 storage as ablation" \
            --bundle results/calibration/caiso74_storage_as-ablation | tee /tmp/r74a.out
          python scripts/dashboard_add_run.py \
            --label "caiso 75 demand clock" \
            --bundle results/calibration/caiso75_demand_clock | tee /tmp/r75m.out
          python scripts/dashboard_add_run.py \
            --label "caiso 75 demand clock ablation" \
            --bundle results/calibration/caiso75_demand_clock-ablation | tee /tmp/r75a.out
          echo "RID74M=$(grep '^RUN_ID=' /tmp/r74m.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID74A=$(grep '^RUN_ID=' /tmp/r74a.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID75M=$(grep '^RUN_ID=' /tmp/r75m.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID75A=$(grep '^RUN_ID=' /tmp/r75a.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID74M" --bundle results/calibration/caiso74_storage_as \
            --rid "$RID74A" --bundle results/calibration/caiso74_storage_as-ablation \
            --rid "$RID75M" --bundle results/calibration/caiso75_demand_clock \
            --rid "$RID75A" --bundle results/calibration/caiso75_demand_clock-ablation \
            --branch claude/caiso-calibration-continuation-3ftscz \
            --message "results: register caiso-74 (storage-AS reservation, measured inert) + caiso-75 (2023 demand-clock realignment) PROBES with ablation twins on the backcast dashboard (keeper stays caiso65) [skip ci]"
