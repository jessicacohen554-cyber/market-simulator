# One-shot: finalize the caiso-80 keeper promotion (owner re-confirmed).
# keepers.json + the repaired keeper sidecar + the log-entry payload were
# pushed by the session (commit 34db244); this workflow splices the payload
# into docs/calibration-log.md (761 KB — exceeds the MCP relay, caiso77-port
# pattern), rebuilds frontend/data/backcast/status.js from the committed
# bundles + the new keepers.json, and publishes BOTH via the Data API
# (ci_api_upload_multi with the caiso-80 rid/bundle pair — re-uploading the
# unchanged bundle files is a harmless no-op). Data-API-only: no git
# commit/push from the runner, so the bulk-merge-auto-runs race cannot
# strand the publish (caiso80-solve-register-v2 pattern).
name: caiso80-finalize

on:
  push:
    branches:
      - claude/caiso-80-c3a-decomposition-fm9460
    paths:
      - .github/workflows/caiso80-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Splice the caiso-80 log entry (idempotent)
        run: |
          set -euo pipefail
          test -f docs/_caiso80_log_entry.md
          python - <<'PY'
          lp = 'docs/calibration-log.md'
          log = open(lp).read()
          entry = open('docs/_caiso80_log_entry.md').read().rstrip() + '\n'
          marker = '### 2026-07-13 — PJM — G-22 lever C EXECUTED'
          assert marker in log, 'splice marker missing'
          if 'caiso-80 (supply-consistent honest demand' not in log:
              log = log.replace(marker, entry + '\n' + marker, 1)
              open(lp, 'w').write(log)
              print('spliced')
          else:
              print('already spliced')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl

      - name: Rebuild status.js (new CAISO keeper)
        run: |
          set -euo pipefail
          python scripts/build_status.py
          grep -q '2026-07-13-caiso-80-supply-demand' frontend/data/backcast/status.js
          echo 'status.js carries the caiso-80 keeper'

      - name: Publish via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid 2026-07-13-caiso-80-supply-demand --bundle results/calibration/caiso80_supply_consistent_demand \
            --rid 2026-07-13-caiso-80-supply-demand-ablation --bundle results/calibration/caiso80_supply_consistent_demand-ablation \
            --branch claude/caiso-80-c3a-decomposition-fm9460 \
            --extra docs/calibration-log.md \
            --extra frontend/data/backcast/status.js \
            --message "calibration-log: caiso-80 keeper-promotion entry (supply-consistent honest demand) + status.js with the new CAISO keeper [skip ci]"
