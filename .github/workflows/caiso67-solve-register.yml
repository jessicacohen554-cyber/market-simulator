name: caiso67-solve-register

# One-shot: regenerate the caiso-67 bundle on CI (the 607KB run payload cannot
# be inlined through an API push) and register it on the backcast dashboard as
# a PROBE. Replays the committed caiso65 keeper with the two new measured,
# default-off flags (caiso_zonal_gas_basis + caiso_asymmetric_path_ratings),
# scores it, runs dashboard_add_run, and commits ONLY the per-run files
# (registry sidecar + runs payload + bench + slim bundle json) on top of
# origin/main -> claude/caiso67-register. Keeper stays caiso65.
# Self-triggering on its own file + a trigger file (workflow_dispatch is 403
# for the integration token).
on:
  push:
    branches:
      - claude/caiso67-register
    paths:
      - .github/workflows/caiso67-solve-register.yml
      - .github/caiso67-register.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Solve caiso-67 (replay keeper + two measured flags)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/replay_keeper.py \
            results/calibration/caiso65_seam_envelope_clock \
            --out-dir results/calibration/caiso67_zonalgas_asympaths \
            --set caiso_zonal_gas_basis=true \
            --set caiso_asymmetric_path_ratings=true \
            --note "(PROBE - keeper stays caiso65-seam-envelope-clock) make-the-3-zones-real A/B: caiso65 recipe + measured PG&E/SoCal citygate zonal gas basis (mean-zero; weekly EIA NGWU prints; N-S spread -0.49/+0.54/-0.18 USD/MMBtu 2023/24/25) + WECC directional Path 15/26 ratings (15: 3265 N-S / 5400 S-N; 26: 4000 N-S / 3000 S-N). Both mechanisms bind (Path 26 N-S at its 4000 MW cap 4000-5250 h/yr; NP15/ZP26 separate for the first time) but the N-S LMP basis stays inverted (2024 basis NP15-SP15: -4.5 -> -3.3 vs actual +8.0) - the model ships ~3 GW N->S around the clock, SP15 structurally short, so the residual reattributes to the G-15 seam contracted overnight/evening base under-delivered into SP15, NOT topology or gas price. Zero fitted parameters (rules 13/14/24). D-gates inherited from caiso65 (D4 off-window PASS; D1/D2 CT fails unchanged; 2024 CT-drag forced share 65.9 -> 47.6 pct). Determination NOT-YET (governance gate unattested, as caiso65)."

      - name: Score legitimacy diagnostics (C7/C8 gates)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -euo pipefail
          python scripts/legitimacy_diagnostics.py \
            --bundle results/calibration/caiso67_zonalgas_asympaths \
            --iso CAISO --years 2023 2024 2025 \
            --json-out results/calibration/caiso67_zonalgas_asympaths/legitimacy_diagnostics.json

      - name: Register on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 67 zonalgas asympaths" \
            --bundle results/calibration/caiso67_zonalgas_asympaths | tee /tmp/reg.out
          RID=$(grep '^RUN_ID=' /tmp/reg.out | cut -d= -f2)
          echo "RID=$RID" >> "$GITHUB_ENV"

      - name: Commit per-run files onto claude/caiso67-register
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # Never commit the deploy-owned shared data files.
          git checkout -- frontend/data/backcast/manifest.js \
                          frontend/data/backcast/benchmark.js 2>/dev/null || true
          # Move the branch pointer to main; keep all working-tree changes.
          git reset --mixed origin/main
          git add \
            "frontend/data/backcast/registry/${RID}.json" \
            "frontend/data/backcast/runs/${RID}.js" \
            frontend/data/backcast/bench \
            results/calibration/caiso67_zonalgas_asympaths/meta.json \
            results/calibration/caiso67_zonalgas_asympaths/run_config.json \
            results/calibration/caiso67_zonalgas_asympaths/metrics.json \
            results/calibration/caiso67_zonalgas_asympaths/legitimacy_diagnostics.json
          git commit -m "results: register caiso-67 zonalgas+asympaths PROBE on the backcast dashboard [skip ci]

Registry sidecar + run payload + slim bundle for the make-the-3-zones-real
A/B (measured PG&E/SoCal zonal gas basis + WECC directional Path 15/26
ratings). PROBE; CAISO keeper stays caiso65-seam-envelope-clock.

Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push --force origin HEAD:claude/caiso67-register
