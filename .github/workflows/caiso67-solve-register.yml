name: caiso67-solve-register

# One-shot: regenerate the caiso-67 bundle on CI and register it on the backcast
# dashboard as a PROBE. Replays the committed caiso65 keeper with the two new
# measured, default-off flags (caiso_zonal_gas_basis + caiso_asymmetric_path_
# ratings), scores it, runs dashboard_add_run, and commits ONLY the per-run
# files via the GitHub Data API (git push 413/500s on the 607KB payload even
# from a runner). Keeper stays caiso65.
on:
  push:
    branches:
      - claude/caiso67-register-api
    paths:
      - .github/workflows/caiso67-solve-register.yml
      - scripts/ci_api_upload.py
      - .github/caiso67-register.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Solve caiso-67 (replay keeper + two measured flags)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/replay_keeper.py \
            results/calibration/caiso65_seam_envelope_clock \
            --out-dir results/calibration/caiso67_zonalgas_asympaths \
            --set caiso_zonal_gas_basis=true \
            --set caiso_asymmetric_path_ratings=true \
            --note "(PROBE - keeper stays caiso65-seam-envelope-clock) make-the-3-zones-real A/B: caiso65 recipe + measured PG&E/SoCal citygate zonal gas basis (mean-zero; weekly EIA NGWU prints; N-S spread -0.49/+0.54/-0.18 USD/MMBtu 2023/24/25) + WECC directional Path 15/26 ratings (15: 3265 N-S / 5400 S-N; 26: 4000 N-S / 3000 S-N). Both mechanisms bind (Path 26 N-S at its 4000 MW cap 4000-5250 h/yr; NP15/ZP26 separate for the first time) but the N-S LMP basis stays inverted (2024 basis NP15-SP15: -4.5 -> -3.3 vs actual +8.0) - the model ships ~3 GW N->S around the clock, SP15 structurally short, so the residual reattributes to the G-15 seam contracted overnight/evening base under-delivered into SP15, NOT topology or gas price. Zero fitted parameters (rules 13/14/24). D-gates inherited from caiso65 (D4 off-window PASS; D1/D2 CT fails unchanged; 2024 CT-drag forced share 65.9 -> 47.6 pct). Determination NOT-YET (governance gate unattested, as caiso65)."

      - name: Score legitimacy diagnostics (C7/C8 gates)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a C8 forced-share gate fails
          # (expected: CT_PEAKER inherits the caiso65 miss -> NOT-YET). The gate
          # verdict is NOT a script error: the machine artifact is written
          # before the non-zero exit, so tolerate the exit and only fail the job
          # if the artifact is genuinely missing/empty.
          python scripts/legitimacy_diagnostics.py \
            --bundle results/calibration/caiso67_zonalgas_asympaths \
            --iso CAISO --years 2023 2024 2025 \
            --json-out results/calibration/caiso67_zonalgas_asympaths/legitimacy_diagnostics.json || true
          test -s results/calibration/caiso67_zonalgas_asympaths/legitimacy_diagnostics.json

      - name: Register on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "caiso 67 zonalgas asympaths" \
            --bundle results/calibration/caiso67_zonalgas_asympaths | tee /tmp/reg.out
          RID=$(grep '^RUN_ID=' /tmp/reg.out | cut -d= -f2)
          echo "RID=$RID" >> "$GITHUB_ENV"

      - name: Upload per-run files via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload.py \
            --rid "$RID" \
            --branch claude/caiso67-register-api \
            --bundle results/calibration/caiso67_zonalgas_asympaths \
            --message "results: register caiso-67 zonalgas+asympaths PROBE on the backcast dashboard (measured PG&E/SoCal zonal gas + WECC directional Path 15/26; keeper stays caiso65) [skip ci]"
