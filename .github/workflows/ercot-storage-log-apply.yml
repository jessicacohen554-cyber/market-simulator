name: ercot-storage-log-apply

# Docs-only: apply the ERCOT storage-cycling-lane calibration-log entry to the
# 671 KB docs/calibration-log.md server-side. The authoring session's MCP relay
# caps single-call content ~200 KB and is not byte-exact for big blobs, so the
# whole log file cannot be pushed directly (the ercot58 precedent). Instead the
# 76-line addition rides as a committed xz+base64 git patch
# (scripts/probes/_ercot_storage_patch/callog.patch.xz.b64); this workflow
# decodes it, sha256-gates it, git-applies it, verifies the resulting file's
# git blob sha, and commits the corrected log. No solve, no bundle — the
# session deliverable is the DIAGNOSIS doc
# (docs/DIAGNOSIS-ercot-storage-cycling-lane-2026-07.md) + this log entry;
# keeper stays ercot56-nucwin. Trigger: pushing THIS workflow file starts the
# run (the relay token cannot dispatch workflows — 403).
on:
  push:
    branches:
      - claude/ercot-storage-discharge-g22mr4
    paths:
      - .github/workflows/ercot-storage-log-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot-storage-log-apply
  cancel-in-progress: false

jobs:
  apply-log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/ercot-storage-discharge-g22mr4

      - name: Apply the calibration-log entry (git patch, sha-gated)
        run: |
          set -euo pipefail
          # Idempotent no-op if the entry is already present.
          if grep -q "ERCOT storage-cycling lane opened" docs/calibration-log.md; then
            echo "already applied — no-op"
            exit 0
          fi
          echo "15b5ea450711d56b21aa312dbabea69f3c857f431da803f4c41d36e6a5db473e  /tmp/callog.patch" > /tmp/patch.sha
          tr -d '\r\n ' < scripts/probes/_ercot_storage_patch/callog.patch.xz.b64 \
            | base64 -d | xz -d > /tmp/callog.patch
          sha256sum -c /tmp/patch.sha
          git apply --verbose /tmp/callog.patch
          got="$(git hash-object docs/calibration-log.md)"
          echo "applied blob sha=$got"
          test "$got" = "da6784fdf150a4cd26b77fee4195c0770b24449b"

      - name: Commit the corrected log
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/calibration-log.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add docs/calibration-log.md
          git commit -m "docs: ERCOT storage-cycling-lane calibration-log entry (apply relay-oversized log patch server-side) [skip ci]"
          git push origin claude/ercot-storage-discharge-g22mr4
