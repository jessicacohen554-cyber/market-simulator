# One-shot follow-up to the PR #1933 merge (pjm-95 -> pjm-94 demotion).
#
# The demotion merged WITHOUT its calibration-log entry: the entry's EOF
# append conflicted with newer main entries, so the merge-unblock step
# reverted it off the branch. This workflow lands the entry on this
# follow-up branch from .github/patches/pjm96_callog_entry.md (now carrying
# the merge-audit corrections: envelope range 0.975-1.11x + the ST_GAS 2025
# small-sample cell note, CT/ST_GAS 2023 unit counts), and applies the same
# range correction to the two evidence files that quote it (pjm-95 registry
# sidecar + attestation). Runner-side because the 9k-line log cannot travel
# through the session's text-only push path.
#
# Trigger: the push of this file itself (the remote env cannot POST workflow
# dispatches), branch-scoped to the follow-up branch so it can never fire on
# main. Idempotent: heading-gated append, replace-if-present corrections.
# This workflow and merge-unblock-pr1933.yml are both deleted from the
# branch before it merges.

name: append-pjm96-callog

on:
  push:
    branches:
      - claude/audit-pr-1933-demotion-g90c0j
    paths:
      - ".github/workflows/append-pjm96-callog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Append entry + correct the quoted evidence range
        run: |
          set -euo pipefail
          changed=0
          if ! grep -q "PJM keeper DEMOTED: pjm-95" docs/calibration-log.md; then
            cat .github/patches/pjm96_callog_entry.md >> docs/calibration-log.md
            changed=1
          fi
          python - <<'PYEOF'
          from pathlib import Path
          fixes = {
              "frontend/data/backcast/registry/2026-07-09-pjm-95-temp-derate.json": (
                  "p98 0.98-1.11x reference across all hot bins",
                  "p98 0.975-1.11x reference across the hot bins (floor CC_CHP 2023; one small-sample ST_GAS 2025 cell excluded)",
              ),
              "results/calibration/pjm95_stgas_drag_tempderate/calibration_attestation.json": (
                  "p98 output/reference 0.98-1.11x in EVERY hot bin",
                  "p98 output/reference 0.975-1.11x in every hot bin (floor CC_CHP 2023; one small-sample ST_GAS 2025 cell excluded)",
              ),
          }
          for path, (old, new) in fixes.items():
              p = Path(path)
              t = p.read_text()
              if old in t:
                  p.write_text(t.replace(old, new))
                  print(f"corrected {path}")
              elif new not in t:
                  raise SystemExit(f"pattern missing in {path}")
          PYEOF
          if ! git diff --quiet; then changed=1; fi
          if [ "$changed" = "0" ]; then
            echo "nothing to do"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add docs/calibration-log.md \
            frontend/data/backcast/registry/2026-07-09-pjm-95-temp-derate.json \
            results/calibration/pjm95_stgas_drag_tempderate/calibration_attestation.json
          git commit -m "docs(pjm): land the pjm-95 -> pjm-94 demotion calibration-log entry (merge-audit corrected) + evidence-range corrections in the pjm-95 sidecar/attestation"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
