# One-shot (v2 of miso57-docs-apply, which raced the parallel miso-57
# registration and conflicted): main ALREADY carries the miso-57
# registration (PRs #2089/#2090) and a FINDING §11 written by that parallel
# session — the ONLY missing rule-15 record is the calibration-log entry,
# whose text sits in the committed payload doc docs/_miso57_log_entry.md.
# This workflow appends it (idempotent, run-id corrected to the canonical
# 2026-07-11 bundle id), removes the three session payload docs, and pushes
# the one docs commit back to this branch (small pack; miso56-promote
# precedent — the 680 KB calibration-log.md cannot transit the MCP relay).
name: miso57-log-entry

on:
  push:
    branches:
      - claude/miso57-log-entry-f0owj2
    paths:
      - .github/workflows/miso57-log-entry.yml

permissions:
  contents: write

jobs:
  log-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Append log entry, remove payload docs, push
        run: |
          set -euo pipefail
          python - <<'PY'
          log_path = 'docs/calibration-log.md'
          log = open(log_path).read()
          entry = open('docs/_miso57_log_entry.md').read()
          # The canonical registered bundle carries the 2026-07-11 id (the
          # parallel registration landed first); fix the session text, and
          # point the FINDING reference at the §11 already on main.
          entry = entry.replace('2026-07-12-miso-57-rdt-congestion',
                                '2026-07-11-miso-57-rdt-congestion')
          if 'MISO-57: RDT S→N congestion lane executed' not in log:
              log = log.rstrip('\n') + '\n\n' + entry.strip() + '\n'
              open(log_path, 'w').write(log)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q docs/_miso57_log_entry.md docs/_miso57_sidecar_patch.json docs/_miso57_finding_s11.md
          git add docs/calibration-log.md
          git commit -m "docs: MISO-57 calibration-log entry (RDT lane executed; keeper recommendation to owner) + session payload docs removed [skip ci]"
          git push origin HEAD:claude/miso57-log-entry-f0owj2
