name: recover-inputs

# Recover files that the calibration-cleanup (strip_blobs) removed from main.
# A force-push does not delete the old commits immediately — GitHub keeps them
# as unreachable objects for ~90 days. This workflow resurrects the pre-rewrite
# commit (by creating a temp ref to its SHA, which makes it fetchable), restores
# the requested paths from that old tree, optionally drops the big raw archives
# (*.zip) so only the parquet/processed data comes back, and commits the result
# to a RECOVERY BRANCH for you to review and merge.
#
# HOW TO FIND old_sha: open  https://github.com/<owner>/<repo>/activity ,
# find the "force-pushed main" entry from the cleanup, and copy the BEFORE SHA.
# (Or leave it blank and the workflow best-effort auto-detects the most recent
# force-push 'before' SHA on the default branch from the events API.)

on:
  workflow_dispatch:
    inputs:
      old_sha:
        description: "Pre-rewrite commit SHA to restore FROM (blank = auto-detect from repo events)"
        required: false
        default: ""
        type: string
      restore_paths:
        description: "Space-separated paths to restore from the old tree"
        required: false
        default: "inputs"
        type: string
      drop_glob:
        description: "After restoring, delete files matching this glob (blank = keep all). Default drops raw zips."
        required: false
        default: "*.zip"
        type: string
      target_branch:
        description: "Branch to commit the recovered files to (NOT main)"
        required: false
        default: "recovered-inputs"
        type: string
      dry_run:
        description: "Preview only — list what would be restored, do not commit or push"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: recover-inputs
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (safe)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
          df -h /

      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the pre-rewrite SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD='${{ inputs.old_sha }}'
          DEF='${{ github.event.repository.default_branch }}'
          if [ -z "$OLD" ]; then
            echo "No old_sha given — best-effort auto-detect from events..."
            OLD=$(gh api "repos/${{ github.repository }}/events?per_page=100" \
              --jq "[.[] | select(.type==\"PushEvent\" and .payload.ref==\"refs/heads/$DEF\") | .payload.before] | map(select(. != \"0000000000000000000000000000000000000000\")) | .[0]" 2>/dev/null || true)
          fi
          if [ -z "$OLD" ] || [ "$OLD" = "null" ]; then
            echo "::error::Could not determine the pre-rewrite SHA. Find it on the repo Activity page (the force-push BEFORE SHA) and re-run with old_sha set."
            exit 1
          fi
          echo "Restoring from $OLD"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

      - name: Resurrect old commit and restore paths
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD='${{ steps.sha.outputs.old }}'
          # Create a temp ref pointing at the (unreachable) old commit so it can
          # be fetched. Works while the object still exists (~90-day window).
          if ! gh api -X POST "repos/${{ github.repository }}/git/refs" \
               -f ref="refs/heads/_recover_src" -f sha="$OLD" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/_recover_src" \
               -f sha="$OLD" -F force=true >/dev/null 2>&1 || true
          fi
          git fetch origin _recover_src
          git checkout -B '${{ inputs.target_branch }}' "origin/${{ github.event.repository.default_branch }}"
          for p in ${{ inputs.restore_paths }}; do
            echo "restoring $p from $OLD"
            git checkout FETCH_HEAD -- "$p" || echo "::warning::'$p' not present in old tree"
          done
          if [ -n '${{ inputs.drop_glob }}' ]; then
            for p in ${{ inputs.restore_paths }}; do
              find "$p" -type f -name '${{ inputs.drop_glob }}' -print -delete 2>/dev/null || true
            done
          fi
          echo "=== files staged for recovery (first 60) ==="
          git add -A
          git diff --cached --name-only | head -60
          n=$(git diff --cached --name-only | wc -l | tr -d ' ')
          sz=$(git diff --cached --numstat >/dev/null 2>&1; du -sh ${{ inputs.restore_paths }} 2>/dev/null | tail -1 | cut -f1 || echo '?')
          {
            echo "### recover-inputs from $OLD"
            echo "Restored **$n** file(s) into paths: ${{ inputs.restore_paths }}  (dropped: '${{ inputs.drop_glob }}')"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          # clean up the temp ref
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/_recover_src" >/dev/null 2>&1 || true

      - name: Commit and push the recovery branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ '${{ steps.restore.outputs.count }}' = '0' ]; then
            echo "Nothing to recover."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "Recover stripped inputs from ${{ steps.sha.outputs.old }}"
          git push --force origin '${{ inputs.target_branch }}'
          echo "Pushed recovery to **${{ inputs.target_branch }}** — review and merge into main." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "DRY RUN — listed above, nothing committed. Re-run with dry_run=false to push the recovery branch."
