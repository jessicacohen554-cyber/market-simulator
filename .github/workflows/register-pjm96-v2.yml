# v2 of register-pjm96 — solves the pjm-96 seam-ladder probe on the runner
# and registers it (the ~1.5 MB run payload cannot travel through the session
# env's push path; see register-pjm96's header). Failure history: v1 died on
# the runner's active /swapfile; then disk exhaustion (fixed by freeing
# hosted toolchains); then the legitimacy-diagnostics exit-1-on-gate-fail
# (now tolerated — the artifact is the deliverable); then build_manifest
# dirtying the tree before the final pull --rebase (preview step removed,
# tree hard-reset after committing). Rebound 2026-07-10 to the
# keeper-promotion branch (PR #1955's merge deleted the prior branch
# mid-run; owner directed a rebase onto latest main). The sidecar definition
# and commit message are extracted AT RUNTIME from register-pjm96.yml (the
# canonical record of the parallel session's finding). Idempotent. Delete
# both register-pjm96 workflows from main after the PR merges.

name: register-pjm96-v2

on:
  push:
    branches:
      - claude/pjm97-keeper-promotion-2lchu7
    paths:
      - .github/workflows/register-pjm96-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-and-register:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free runner disk (hosted toolchains this job never uses; room for the swapfile)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/microsoft || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Swapfile at /swapfile2 (runners ship an active 3 GB /swapfile; pjm-78/79 10 GB convention)
        run: |
          sudo swapon --show || true
          sudo fallocate -l 10G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=10240
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Install package
        run: pip install -e .

      - name: Solve pjm-96 (skip if bundle already complete)
        run: |
          set -euo pipefail
          if [ -f results/calibration/pjm96_seam_ladder/system.parquet ] && \
             [ -f results/calibration/pjm96_seam_ladder/meta.json ]; then
            echo "bundle already present -- skipping solve"
          else
            python scripts/run_pjm96_seam_ladder.py
          fi

      - name: Register on the dashboard (skip if sidecar already exists)
        run: |
          set -euo pipefail
          if [ -f frontend/data/backcast/registry/2026-07-10-pjm-96-seam-ladder.json ]; then
            echo "already registered -- skipping"
          else
            python scripts/dashboard_add_run.py --label "pjm 96 seam ladder" \
                --bundle results/calibration/pjm96_seam_ladder
          fi

      - name: Legitimacy diagnostics (exit 1 = a D-gate failed; the artifact is the deliverable, C7/C8 score it — a probe may fail gates)
        run: |
          python scripts/legitimacy_diagnostics.py \
              --bundle results/calibration/pjm96_seam_ladder --iso PJM \
              --json-out results/calibration/pjm96_seam_ladder/legitimacy_diagnostics.json \
            || echo "::warning::legitimacy D-gates failed (probe) -- artifact written, scored by C7/C8"
          test -s results/calibration/pjm96_seam_ladder/legitimacy_diagnostics.json

      - name: Overwrite the sidecar definition with the v1-recorded post-solve finding (extracted from register-pjm96.yml)
        run: |
          set -euo pipefail
          awk "/<<.PYEOF./{f=1;next} /^          PYEOF\$/{f=0} f" .github/workflows/register-pjm96.yml > /tmp/patch_definition.py
          sed -i 's/^ \{10\}//' /tmp/patch_definition.py
          test -s /tmp/patch_definition.py
          python /tmp/patch_definition.py

      - name: Verify registry/payload parity (CI gate)
        run: python scripts/check_registry_payload_parity.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add \
            results/calibration/pjm96_seam_ladder/meta.json \
            results/calibration/pjm96_seam_ladder/run_config.json \
            results/calibration/pjm96_seam_ladder/metrics.json \
            results/calibration/pjm96_seam_ladder/legitimacy_diagnostics.json \
            frontend/data/backcast/registry/2026-07-10-pjm-96-seam-ladder.json \
            frontend/data/backcast/runs/2026-07-10-pjm-96-seam-ladder.js
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          awk "/<<.MSGEOF./{f=1;next} /^          MSGEOF\$/{f=0} f" .github/workflows/register-pjm96.yml > /tmp/pjm96_commit_msg.txt
          sed -i 's/^ \{10\}//' /tmp/pjm96_commit_msg.txt
          test -s /tmp/pjm96_commit_msg.txt
          git commit -F /tmp/pjm96_commit_msg.txt
          git reset --hard HEAD
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
