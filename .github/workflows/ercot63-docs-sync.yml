# One-shot: land the ERCOT-63 /sync-docs edits (CLAUDE.md ERCOT-bridge
# paragraph, model-methodology-spec.md P1-native-bridges section +
# caiso_ra_mustoffer-no-longer-P2 correction, CHANGELOG.md entry) from the
# runner. The three files total ~420 KB — beyond the MCP relay's single-call
# ceiling — so the 9 KB diff rides scripts/probes/_ercot63_land/
# docs.patch.xz.b64.part1 (xz-9 + base64, fetched back byte-verified before
# this workflow was pushed; the sha256 gate below is the authority). Follows
# the merged ERCOT-63 landing (PR #2152); code and dashboard files are
# already in main — this lands ONLY the prose docs.
name: ercot63-docs-sync

on:
  push:
    branches:
      - claude/ercot-gas-commitment-bridge-qh61xh
    paths:
      - .github/workflows/ercot63-docs-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot63-docs-sync
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the docs patch (sha-gated)
        run: |
          set -euo pipefail
          if grep -q "ERCOT gas commitment bridge is the same P1-native construction" CLAUDE.md; then
            echo "already applied — no-op"
            exit 0
          fi
          echo "e0297fc838f89676e172413142afd74b664ebeab27370a3c1638241e2485c5b8  /tmp/_ercot63_docs.patch" > /tmp/patch.sha
          tr -d '\r\n ' < scripts/probes/_ercot63_land/docs.patch.xz.b64.part1 \
            | base64 -d | xz -d > /tmp/_ercot63_docs.patch
          sha256sum -c /tmp/patch.sha
          git apply --verbose /tmp/_ercot63_docs.patch

      - name: Post-conditions (each edit present exactly once)
        run: |
          set -euo pipefail
          for f in CLAUDE.md model-methodology-spec.md CHANGELOG.md; do
            n=$(grep -c "ercot_gas_commitment_bridge" "$f")
            if [ "$n" -lt 1 ]; then echo "FAIL: $f has no bridge mention" >&2; exit 1; fi
          done
          n=$(grep -c "ERCOT gas commitment bridge (ERCOT-63)" CHANGELOG.md)
          if [ "$n" -ne 1 ]; then echo "FAIL: CHANGELOG entry count=$n" >&2; exit 1; fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md model-methodology-spec.md CHANGELOG.md
          git commit -m "docs: ERCOT-63 sync-docs — CLAUDE.md ERCOT-bridge paragraph, methodology-spec P1-native-bridges section (caiso_ra_mustoffer no longer a P2 trigger), CHANGELOG entry [skip ci]"
          git push origin HEAD:claude/ercot-gas-commitment-bridge-qh61xh
