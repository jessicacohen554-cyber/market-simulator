# One-shot: solve + register the ERCOT-63 gas-commitment-bridge candidate
# (the promoted ercot59-storage-deploy recipe + ONE structural delta,
# ercot_gas_commitment_bridge=True — the P1-native gas-CC committed-state
# bridge, docs/DIAGNOSIS-ercot-trough-price-formation-2026-07.md §7) + its
# zero-forcing ablation twin, full 2023-2025 each, on CI — then register both
# on the backcast dashboard and upload the per-run files + the session's
# relay-oversized sources via the GitHub Data API. ercot59/ercot62 precedent:
# the authoring session's environment cannot git-push (413) and the MCP relay
# caps single-call content, so the oversized pieces (the ~1 MB run payloads
# and the 400 KB source files) land from the runner. The authoring session
# solved the same full-span bundles locally first (local-parity precedent):
# CALIBRATED-WITH-CAVEATS with ONE ledgered caveat (C3c-2024, inherited
# byte-identical) vs the keeper's two — the keeper's own C5c-2024
# storage-shape ledgered FAIL flips to PASS. Keeper stays
# ercot59-storage-deploy — the candidate registers as the honest record
# (rule 15); promotion is an owner decision (case in the calibration-log
# ERCOT-63 entry).
#
# The patch rides scripts/probes/_ercot63_land/diff.patch.xz.b64.part1..3
# (xz-9 + base64), fetched back byte-verified before this workflow was
# pushed; the decoded sha256 gate below is the authority. Main and twin run
# SEQUENTIALLY — the authoring session's 15 GB container OOM-killed a
# concurrent second full ERCOT per-plant solve (dmesg-confirmed).
# Trigger: pushing THIS workflow file starts the run (the relay token cannot
# dispatch workflows — the ercot58/59 pattern).
name: ercot63-bridge-solve-register

on:
  push:
    branches:
      - claude/ercot-gas-commitment-bridge-qh61xh
    paths:
      - .github/workflows/ercot63-bridge-solve-register.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot63-bridge-solve-register
  cancel-in-progress: false

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Apply the session's relay-oversized source patch (sha-gated)
        run: |
          set -euo pipefail
          if grep -q "ercot_gas_commitment_bridge" src/market_sim/config/scenarios.py; then
            echo "already applied — no-op"
          else
            echo "8ab23ec3063cf60cbaa3b4b4415e3d68d97535fe8ac685b3fadf85feccf14b87  /tmp/_ercot63_code.patch" > /tmp/patch.sha
            cat scripts/probes/_ercot63_land/diff.patch.xz.b64.part1 \
                scripts/probes/_ercot63_land/diff.patch.xz.b64.part2 \
                scripts/probes/_ercot63_land/diff.patch.xz.b64.part3 \
              | tr -d '\r\n ' | base64 -d | xz -d > /tmp/_ercot63_code.patch
            sha256sum -c /tmp/patch.sha
            git apply --verbose /tmp/_ercot63_code.patch
          fi

      - name: Run the mechanism unit tests
        run: |
          set -euo pipefail
          python -m pytest tests/test_ercot_gas_commitment_bridge.py \
            tests/test_commitment.py \
            tests/test_pipeline_commitment.py \
            tests/test_floor_mechanisms_ablation.py \
            tests/test_ercot_offer_surface_lowcurve.py \
            tests/test_recorded_cfg_fidelity.py -q

      - name: Solve ercot63-gas-bridge candidate (keeper recipe + the one delta, 2023-2025)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot63_fullspan.py

      - name: Solve the zero-forcing ablation twin (2023-2025, sequential)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/probes/_ercot63_fullspan.py --twin

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          for b in ercot63_gas_bridge ercot63_gas_bridge_ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso ERCOT --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "ercot63 gas bridge" \
            --bundle results/calibration/ercot63_gas_bridge | tee /tmp/reg_main.out
          grep -q "CALIBRATED-WITH-CAVEATS" /tmp/reg_main.out
          python scripts/dashboard_add_run.py \
            --label "ercot63 gas bridge (ABLATION TWIN)" \
            --bundle results/calibration/ercot63_gas_bridge_ablation | tee /tmp/reg_abl.out
          echo "RID_MAIN=$(grep '^RUN_ID=' /tmp/reg_main.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID_ABL=$(grep '^RUN_ID=' /tmp/reg_abl.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Link the ablation twin + market story on the candidate sidecar
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          rid, rid_abl = os.environ["RID_MAIN"], os.environ["RID_ABL"]
          p = f"frontend/data/backcast/registry/{rid}.json"
          s = json.load(open(p))
          s["ablation_twin"] = rid_abl
          s["market_story"] = (
              "The bridge holds P0-committed merchant gas-CC at min-load across "
              "sub-DA-day idle gaps (overnight between run-days — the 902 CC "
              "plant-nights/yr the keeper cycled off) because re-paying the "
              "published startup cost exceeds the net cost of holding at LSL: "
              "real ERCOT CCs stay synchronized overnight at their LSL block. "
              "That committed-state energy deepens the price troughs toward the "
              "measured $10-15 epochs, widens the daily spread from below, lets "
              "batteries cross the round-trip hurdle on more days (storage "
              "0.65->0.74 TWh, HE18/19 discharge up), and returns the overnight "
              "energy the keeper served with coal to gas-CC — toward BOTH "
              "classes' measured actuals (CC_REGULAR onto 141.7 actual; coal "
              "-1.4 TWh toward its 60.4 actual). C5c-2024 monthly storage "
              "shape, the keeper's own ledgered FAIL, flips to PASS."
          )
          json.dump(s, open(p, "w"), indent=1, ensure_ascii=False)
          print("linked", rid, "->", rid_abl)
          PY

      - name: Post-conditions (registry parity, keeper untouched, log entry present once)
        run: |
          set -euo pipefail
          python scripts/check_registry_payload_parity.py
          n=$(grep -c "ERCOT-63: the real gas commitment bridge built" docs/calibration-log.md)
          if [ "$n" -ne 1 ]; then echo "FAIL: log entry count=$n" >&2; exit 1; fi
          python - <<'PY'
          import json
          k = json.load(open("frontend/data/backcast/keepers.json"))
          assert k["ERCOT"] == "2026-07-12-ercot59-storage-deploy", k["ERCOT"]
          PY

      - name: Upload per-run files + session sources via the GitHub Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci_api_upload_multi.py \
            --rid "$RID_MAIN" --bundle results/calibration/ercot63_gas_bridge \
            --rid "$RID_ABL" --bundle results/calibration/ercot63_gas_bridge_ablation \
            --extra src/market_sim/config/scenarios.py \
            --extra src/market_sim/data/fleet.py \
            --extra src/market_sim/data/floor_mechanisms.py \
            --extra src/market_sim/model/commitment.py \
            --extra src/market_sim/pipeline/__init__.py \
            --extra src/market_sim/pipeline/commitment.py \
            --extra src/market_sim/runner.py \
            --extra scripts/run_calibration.py \
            --extra scripts/run_calibration_full.py \
            --extra scripts/legitimacy_diagnostics.py \
            --extra scripts/probes/_ercot62b_bridge_probe.py \
            --extra scripts/probes/_ercot63_anatomy.py \
            --extra scripts/probes/_ercot63_bridge_ladder_probe.py \
            --extra scripts/probes/_ercot63_c3_proxy.py \
            --extra scripts/probes/_ercot63_fullspan.py \
            --extra tests/test_ercot_gas_commitment_bridge.py \
            --extra docs/DIAGNOSIS-ercot-trough-price-formation-2026-07.md \
            --extra docs/calibration-log.md \
            --extra docs/parameter-citations.md \
            --extra frontend/data/parameters.json \
            --bench-iso ERCOT \
            --branch claude/ercot-gas-commitment-bridge-qh61xh \
            --message "results: register ercot63 gas-commitment-bridge candidate (CALIBRATED-WITH-CAVEATS, one ledgered caveat vs the keeper's two; C5c-2024 storage-shape FAIL flips to PASS) + zero-forcing twin; land the ERCOT-63 session sources (keeper stays ercot59-storage-deploy pending owner decision) [skip ci]"
