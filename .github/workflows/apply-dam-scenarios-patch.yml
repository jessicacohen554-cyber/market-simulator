name: apply-dam-scenarios-patch

# One-shot: git-apply docs/handoffs/patches/dam-outage-wiring-4iso-scenarios.patch
# to main and commit. scenarios.py (8138 lines) exceeds the API-only push path's
# single-call emission limit, so the 4 DAM-outage gate fields could not be pushed
# as a whole file; this lands them server-side. Idempotent; delete after it runs.
# Sparse checkout (only the two files it touches) keeps this repo's large
# committed-data working tree from materializing.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: apply-dam-scenarios-patch

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            src/market_sim/config/scenarios.py
            docs/handoffs/patches/dam-outage-wiring-4iso-scenarios.patch
          sparse-checkout-cone-mode: false
      - name: Apply DAM-outage gate patch to scenarios.py
        run: |
          set -euo pipefail
          F=src/market_sim/config/scenarios.py
          if grep -qE '^    caiso_dam_outages: bool = False' "$F"; then
            echo "Gate fields already present on main; nothing to do."
            exit 0
          fi
          git apply docs/handoffs/patches/dam-outage-wiring-4iso-scenarios.patch
          for f in caiso_dam_outages miso_native_outage_source neiso_operable_capacity_availability pjm_dam_availability; do
            grep -qE "^    ${f}: bool = False" "$F" || { echo "MISSING ${f} after apply"; exit 1; }
          done
          grep -qE '^    "pjm_dam_availability",' "$F" || { echo "cache-key registration missing"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dam-wiring: apply 4 DAM-outage gate fields to ScenarioConfig (server-side patch-apply; scenarios.py too large for the API push path) [skip ci]"
          git push origin HEAD:main
