name: apply-ercot-capdual-files

# Applies .github/pending-ercot-capdual/two-file.patch onto this branch,
# server-side, so the two large source files (dispatch.py,
# run_calibration_full.py) land with byte-exact content without the agent
# sandbox's blocked git push / API-write proxy (same pattern as
# apply-export-cap.yml). Triggered by the push that adds this file. Makes one
# commit per file (parts 1/3 and 2/3 of the ercot52 cap-dual-adder change;
# part 3/3, tests/test_reserve_coopt.py, was already pushed directly), then
# removes the pending-patch helper dir.
on:
  push:
    branches:
      - claude/ercot-offer-curve-coal-derate-tazye4
    paths:
      - .github/pending-ercot-capdual/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/ercot-offer-curve-coal-derate-tazye4
      - name: Apply patch, commit per file, clean up
        run: |
          set -euo pipefail
          D=.github/pending-ercot-capdual
          if [ ! -f "$D/two-file.patch" ]; then
            echo "pending patch already consumed; nothing to do"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git apply "$D/two-file.patch"
          git add src/market_sim/model/dispatch.py
          git commit -F "$D/msg-part1.txt"
          git add scripts/run_calibration_full.py
          git commit -F "$D/msg-part2.txt"
          git rm -rq "$D"
          git commit -m "chore: remove ercot-capdual pending-patch helper [skip ci]"
          git push origin HEAD:claude/ercot-offer-curve-coal-derate-tazye4
