# One-shot: solve the miso-57 (RDT S->N congestion lane) probe pair (main +
# zero-forcing ablation twin) on CI and register both on the backcast
# dashboard. The caiso-67/69/74/75/76/77 precedent: the session environment
# cannot transport the ~1 MB run payloads or the binary bench parts through
# the MCP push_files relay byte-safely (and the session container has no
# direct GitHub API access), so the solve+register runs here and every file
# is committed via the GitHub Data API with the runner's token.
#
# v2 (branch-independent): the first trigger attempt ran on the session
# branch, which the platform auto-merged and DELETED seconds after the push —
# so mid-run `git push origin HEAD:<branch>` steps cannot be relied on.
# This version is workflow_dispatch on main (everything it needs — probe
# script, miso_rdt wiring, the docs/_miso57_* payload docs — is on main),
# does NO git pushes, and publishes at the end in two Data-API commits
# (adds + deletions in one tree each) onto a fresh results branch cut from
# the CURRENT main tip. Keeper stays 2026-07-11-miso-56-measured-scarcity;
# the miso-57 promotion recommendation is in the appended calibration-log
# entry (owner decision pending).
#
# Probe: scripts/probes/_miso57_rdt_congestion.py — the miso-56 keeper recipe
# replayed from its exhaustive meta.json plus exactly two structural
# transmission changes: miso_south_seam_split (severs the free 3 GW
# South->external->Midwest wheel around the RDT) and miso_rdt_tcdc (published
# 92% default derate + $40/$500 two-step TCDC priced tiers;
# constants.MISO_RDT_*, 2024 SOM §III.B / MISO-SPP JOA). Years 2023-2025
# sequential within each invocation (CLAUDE.md rule 12); the two invocations
# run sequentially on this one runner (a MISO full-structure year needs
# ~15 GB — swap is provisioned below, the _miso57_chain.sh convention).
#
# DELIBERATELY NO capacity-deliverability curation: the miso-56 keeper (and
# the session's verification solve) ran with the MISO clean partition absent
# — static PY2025-26 summer CIL/CEL fallback. Curating it here would change
# the comparison basis vs the keeper (strict-replay discipline).
#
# The MISO registry is at 15/15 mains, so the publish step includes the
# top-15 prune (rule 15 retention): 2026-07-06-miso-44-wefor-neutral (+ twin)
# — the oldest MISO mains. Bundle dirs stay; only sidecars + payloads go.
name: miso57-solve-register

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  solve-register:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Provision swap (MISO full-structure year needs ~15 GB)
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /swapfile-miso
          sudo chmod 600 /swapfile-miso
          sudo mkswap /swapfile-miso
          sudo swapon /swapfile-miso
          free -g

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openpyxl

      - name: Solve miso-57 main (2023-2025, sequential years)
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_miso57_rdt_congestion.py main 2>&1 | tee results/calibration/miso57_rdt_congestion_solve.log

      - name: Solve miso-57 ablation twin
        env:
          MALLOC_ARENA_MAX: "2"
          OMP_NUM_THREADS: "2"
        run: python scripts/probes/_miso57_rdt_congestion.py ablation 2>&1 | tee results/calibration/miso57_rdt_congestion_ablation_solve.log

      - name: DOF ledgers + attestations (ledger FIRST, then attestation merge)
        run: |
          set -euo pipefail
          python scripts/build_dof_ledger.py results/calibration/miso57_rdt_congestion --iso MISO
          python scripts/build_dof_ledger.py results/calibration/miso57_rdt_congestion-ablation --iso MISO
          python scripts/gen_miso57_attestation.py main
          python scripts/gen_miso57_attestation.py ablation

      - name: Score legitimacy diagnostics (both bundles)
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          set -uo pipefail
          # legitimacy_diagnostics.py exits 1 when a gate fails; the artifact
          # is written before the exit, so tolerate the exit code and only
          # fail the job if an artifact is genuinely missing/empty
          # (caiso77-solve-register precedent).
          for b in miso57_rdt_congestion miso57_rdt_congestion-ablation; do
            python scripts/legitimacy_diagnostics.py \
              --bundle "results/calibration/$b" \
              --iso MISO --years 2023 2024 2025 \
              --json-out "results/calibration/$b/legitimacy_diagnostics.json" || true
            test -s "results/calibration/$b/legitimacy_diagnostics.json"
          done

      - name: Register both runs on the dashboard
        run: |
          set -euo pipefail
          python scripts/dashboard_add_run.py \
            --label "miso 57 rdt congestion" \
            --bundle results/calibration/miso57_rdt_congestion | tee /tmp/r57m.out
          python scripts/dashboard_add_run.py \
            --label "miso 57 rdt congestion ablation" \
            --bundle results/calibration/miso57_rdt_congestion-ablation | tee /tmp/r57a.out
          echo "RID57M=$(grep '^RUN_ID=' /tmp/r57m.out | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RID57A=$(grep '^RUN_ID=' /tmp/r57a.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Write condensed metrics sidecars (G-49)
        run: |
          set -euo pipefail
          python scripts/calibration_verdict.py --run-id "$RID57M" --write-metrics
          python scripts/calibration_verdict.py --run-id "$RID57A" --write-metrics

      - name: Patch sidecars, append docs, publish via Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, glob, json, os, urllib.error, urllib.request

          OWNER, REPO = "jessicacohen554-cyber", "market-simulator"
          API = "https://api.github.com"
          BRANCH = "claude/miso57-results-publish"
          m, a = os.environ["RID57M"], os.environ["RID57A"]

          # 1. Patch sidecar definitions with the session-refined text.
          patch = json.load(open("docs/_miso57_sidecar_patch.json"))
          R = "frontend/data/backcast/registry"
          s = json.load(open(f"{R}/{m}.json"))
          s["definition"] = patch["main"]["definition"]
          s["ablation_twin"] = a
          s["market_story"] = patch["main"]["market_story"]
          json.dump(s, open(f"{R}/{m}.json", "w"), indent=1)
          t = json.load(open(f"{R}/{a}.json"))
          t["definition"] = patch["ablation"]["definition"]
          json.dump(t, open(f"{R}/{a}.json", "w"), indent=1)

          # 2. Append the calibration-log entry + FINDING §11 (idempotent).
          log_path = "docs/calibration-log.md"
          log = open(log_path).read()
          entry = open("docs/_miso57_log_entry.md").read()
          if "MISO-57: RDT S→N congestion lane executed" not in log:
              log = log.rstrip("\n") + "\n\n" + entry.strip() + "\n"
              open(log_path, "w").write(log)
          f_path = "results/calibration/FINDING-miso-august-scarcity-2026-07.md"
          f = open(f_path).read()
          s11 = open("docs/_miso57_finding_s11.md").read()
          if "LANE EXECUTED (2026-07-12" not in f:
              f = f.rstrip("\n") + "\n\n" + s11.strip() + "\n"
              open(f_path, "w").write(f)

          # 3. Publish: two Data-API commits on a fresh branch off main tip.
          def req(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(API + path, data=data, method=method)
              r.add_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
              r.add_header("Accept", "application/vnd.github+json")
              if data:
                  r.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(r) as resp:
                  return json.load(resp)

          def commit(parent, adds, deletes, message):
              base_tree = req("GET", f"/repos/{OWNER}/{REPO}/git/commits/{parent}")["tree"]["sha"]
              tree = []
              for p in adds:
                  with open(p, "rb") as fh:
                      payload = base64.b64encode(fh.read()).decode()
                  blob = req("POST", f"/repos/{OWNER}/{REPO}/git/blobs",
                             {"content": payload, "encoding": "base64"})
                  tree.append({"path": p, "mode": "100644", "type": "blob", "sha": blob["sha"]})
                  print("blob", p)
              for p in deletes:
                  tree.append({"path": p, "mode": "100644", "type": "blob", "sha": None})
                  print("del ", p)
              new_tree = req("POST", f"/repos/{OWNER}/{REPO}/git/trees",
                             {"base_tree": base_tree, "tree": tree})["sha"]
              c = req("POST", f"/repos/{OWNER}/{REPO}/git/commits",
                      {"message": message, "tree": new_tree, "parents": [parent]})["sha"]
              print("commit", c[:10])
              return c

          slim = ["meta.json", "run_config.json", "metrics.json",
                  "legitimacy_diagnostics.json", "calibration_attestation.json"]
          adds1 = (
              [f"{R}/{m}.json", f"{R}/{a}.json",
               f"frontend/data/backcast/runs/{m}.js",
               f"frontend/data/backcast/runs/{a}.js",
               "results/calibration/miso57_rdt_congestion_solve.log",
               "results/calibration/miso57_rdt_congestion_ablation_solve.log"]
              + sorted(glob.glob("frontend/data/backcast/bench/MISO/*.json.gz"))
              + [f"results/calibration/miso57_rdt_congestion/{x}" for x in slim]
              + [f"results/calibration/miso57_rdt_congestion-ablation/{x}" for x in slim]
          )
          dels1 = [
              "frontend/data/backcast/registry/2026-07-06-miso-44-wefor-neutral.json",
              "frontend/data/backcast/registry/2026-07-06-miso-44-ablation.json",
              "frontend/data/backcast/runs/2026-07-06-miso-44-wefor-neutral.js",
              "frontend/data/backcast/runs/2026-07-06-miso-44-ablation.js",
          ]
          adds2 = [log_path, f_path]
          dels2 = ["docs/_miso57_log_entry.md", "docs/_miso57_sidecar_patch.json",
                   "docs/_miso57_finding_s11.md"]

          main_sha = req("GET", f"/repos/{OWNER}/{REPO}/git/ref/heads/main")["object"]["sha"]
          c1 = commit(
              main_sha, adds1, dels1,
              "results: register miso-57 (RDT S->N lane: bypass severed + "
              "published 92% derate/TCDC) + zero-forcing twin; prune miso-44 "
              "pair (top-15 retention, bundles kept) [skip ci]",
          )
          c2 = commit(
              c1, adds2, dels2,
              "docs: miso-57 calibration-log entry + FINDING SS11 - RDT lane "
              "executed; keeper recommendation to owner (keepers.json "
              "untouched); session payload docs removed [skip ci]",
          )
          try:
              req("POST", f"/repos/{OWNER}/{REPO}/git/refs",
                  {"ref": "refs/heads/" + BRANCH, "sha": c2})
          except urllib.error.HTTPError:
              req("PATCH", f"/repos/{OWNER}/{REPO}/git/refs/heads/{BRANCH}",
                  {"sha": c2, "force": True})
          print("published", BRANCH, "->", c2[:10])
          PY
