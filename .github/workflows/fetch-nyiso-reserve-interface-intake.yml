# NYISO Ask-B/C/D raw intake (2026-07-10 session): regenerate and commit the
# heavy raw artifacts on a GitHub runner — the Claude remote env's proxy only
# permits small text pushes (git push 413s; raw Data-API writes 403), so the
# per-year MIS message logs, the hourly interface-flow aggregates, the binary
# source PDFs, and the regenerated data dictionary are produced here from
# their public archives and pushed back to the branch this workflow runs on.
# Deterministic: the MIS monthly archives and Wayback snapshots are static
# history (the one living document, the current LRR posting, is md5-warned by
# the fetch script, not overwritten), and the dictionary render is a pure
# function of the schemas + the curated clean tree. On-demand only.
name: Fetch NYISO reserve/interface raw intake

on:
  workflow_dispatch:
  # The Claude remote env's GitHub integration cannot POST workflow dispatches
  # (403), so pushing an edit to THIS file is the trigger: path-scoped to the
  # workflow itself, the runner's own data commit can never re-fire it.
  push:
    paths:
      - ".github/workflows/fetch-nyiso-reserve-interface-intake.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package (curation + render deps)
        run: pip install -e .

      - name: Fetch LRR + 2020 SOM PDFs (md5-verified)
        run: python scripts/fetch_nyiso_lrr_pdfs.py

      - name: Fetch operating-event logs (P-25/P-35, 2018-01..2026-06)
        run: python scripts/fetch_nyiso_operating_events.py --cache-dir /tmp/nyiso-mis-cache

      - name: Fetch + hourly-aggregate interface flows (P-32, 2018-01..2026-06)
        run: python scripts/fetch_nyiso_interface_flows.py --cache-dir /tmp/nyiso-mis-cache

      - name: Curate the intaken datatypes (loader-resolvability check)
        run: |
          python scripts/regenerate_clean.py \
            nyiso-reserve-requirements nyiso-interface-flows nyiso-som-hub-fuel-annual

      - name: Regenerate the data dictionary
        run: python scripts/render_data_dictionary.py

      - name: Commit and push the raw intake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/NYISO-AS/requirements \
                  data/raw/NYISO/interface-flows \
                  data/raw/NYISO/NYISO-2020-SOM-Report-final-5-18-2021.pdf \
                  data/dictionary/data-dictionary.md
          if git diff --cached --quiet; then
            echo "no raw-intake changes to commit"
            exit 0
          fi
          git commit -m "data(nyiso): reserve-requirement docs + event logs + hourly interface flows 2018-H1/2026 (run ${{ github.run_id }})

          Asks B2/B3 + D1 of docs/handoffs/nyiso-data-asks-2026-07.md. Out-of-
          training years intaken under the 2026-07-10 session-logged owner
          authorization (docs/out-of-sample-results-2026-07.md 1.2). Includes
          the regenerated data dictionary (renderer registered the four new
          datatypes)."
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
