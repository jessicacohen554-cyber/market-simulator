name: Bench reproducibility (D-13)

# CLAUDE.md rule 15/16 legitimacy diagnostic D-13 (docs/model-legitimacy-audit-
# 2026-07.md §7, docs/handoffs/scalar-remediation-plan-2026-07.md §4.4):
# rebuild each ISO's dashboard benchmark ("bench/") artifacts TWICE from
# committed code + data/raw (a full byte-faithful replay of that ISO's
# registered keeper via scripts/replay_keeper.py, then scripts/
# render_backcast.py), and assert:
#   (a) build 1 == build 2, byte-for-byte (the rebuild is deterministic), and
#   (b) build 2 == the currently-committed frontend/data/backcast/bench/<ISO>/
#       parts (no undetected drift between what's on disk and what a fresh
#       rebuild from data/raw produces).
# Catches benchmark-side circularity (the L11 BTM pattern: a bench "actual"
# quietly depending on the model's own dispatch output, so two solves of
# identical code+data stop agreeing, or the committed part silently goes
# stale). The static half of D-13 is tests/test_bench_no_circularity.py (runs
# in the normal pytest suite, not here).
#
# This is a full per-ISO calibration re-solve (all of that ISO's keeper years,
# TWICE) — genuinely expensive (CLAUDE.md rule 12: minutes per year-solve) —
# so it runs manually or weekly, never on every push. Manual dispatch can
# target one ISO for a quick check; the schedule sweeps all six, capped at 2
# concurrent (rule 12: "cap ~2 simultaneous runs for per-plant multi-zone
# LPs"). Years within one ISO's replay stay sequential (replay_keeper.py ->
# run_calibration_full.solve_and_persist's own year loop is intentionally
# sequential; this workflow never parallelizes that).

on:
  workflow_dispatch:
    inputs:
      iso:
        description: "ISO to check (ALL = every registered keeper, capped at 2 concurrent)"
        type: choice
        default: ALL
        options: [ALL, ERCOT, CAISO, PJM, MISO, NYISO, NEISO]
  schedule:
    # Weekly, Sunday 09:00 UTC — off-peak, ahead of the work week.
    - cron: "0 9 * * 0"

permissions:
  contents: read

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      isos: ${{ steps.set.outputs.isos }}
    steps:
      - name: Determine ISO matrix
        id: set
        env:
          ISO_INPUT: ${{ github.event.inputs.iso || 'ALL' }}
        run: |
          set -euo pipefail
          if [ "$ISO_INPUT" = "ALL" ]; then
            echo 'isos=["ERCOT","CAISO","PJM","MISO","NYISO","NEISO"]' >> "$GITHUB_OUTPUT"
          else
            echo "isos=[\"$ISO_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  bench-repro:
    needs: resolve-matrix
    strategy:
      fail-fast: false
      max-parallel: 2  # rule 12: cap ~2 concurrent per-plant multi-zone solves
      matrix:
        iso: ${{ fromJson(needs.resolve-matrix.outputs.isos) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (full history not needed — committed code + data/raw only)
        uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Resolve this ISO's registered keeper bundle
        id: keeper
        env:
          ISO: ${{ matrix.iso }}
        run: |
          set -euo pipefail
          RUN_ID=$(python -c "
          import json, sys
          keepers = json.load(open('frontend/data/backcast/keepers.json'))
          rid = keepers.get('$ISO')
          if not rid:
              sys.exit('no registered keeper for ISO $ISO')
          print(rid)
          ")
          BUNDLE=$(python -c "
          import json
          side = json.load(open(f'frontend/data/backcast/registry/${RUN_ID}.json'))
          print(side['bundle'])
          ")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "Keeper for $ISO: $RUN_ID ($BUNDLE)"

      - name: Snapshot the currently-committed bench parts
        env:
          ISO: ${{ matrix.iso }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench_repro/committed
          cp -r "frontend/data/backcast/bench/$ISO" /tmp/bench_repro/committed/ 2>/dev/null \
            || echo "::warning::no committed bench/$ISO parts yet (first-ever run for this ISO)"

      - name: Build 1 — byte-faithful replay + render
        env:
          ISO: ${{ matrix.iso }}
          BUNDLE: ${{ steps.keeper.outputs.bundle }}
          RUN_ID: ${{ steps.keeper.outputs.run_id }}
        run: |
          set -euo pipefail
          uv run python scripts/replay_keeper.py "$BUNDLE" \
            --out-dir /tmp/bench_repro/build1_solve \
            --note "D-13 bench-repro build 1 (diagnostic; never a keeper)"
          uv run python scripts/render_backcast.py "$RUN_ID=/tmp/bench_repro/build1_solve"
          mkdir -p /tmp/bench_repro/build1
          cp -r "frontend/data/backcast/bench/$ISO" /tmp/bench_repro/build1/

      - name: Restore working tree before build 2
        run: git checkout -- frontend/data/backcast/bench/ frontend/data/backcast/runs/ || true

      - name: Build 2 — independent byte-faithful replay + render
        env:
          ISO: ${{ matrix.iso }}
          BUNDLE: ${{ steps.keeper.outputs.bundle }}
          RUN_ID: ${{ steps.keeper.outputs.run_id }}
        run: |
          set -euo pipefail
          uv run python scripts/replay_keeper.py "$BUNDLE" \
            --out-dir /tmp/bench_repro/build2_solve \
            --note "D-13 bench-repro build 2 (diagnostic; never a keeper)"
          uv run python scripts/render_backcast.py "$RUN_ID=/tmp/bench_repro/build2_solve"
          mkdir -p /tmp/bench_repro/build2
          cp -r "frontend/data/backcast/bench/$ISO" /tmp/bench_repro/build2/

      - name: Restore working tree after build 2
        run: git checkout -- frontend/data/backcast/bench/ frontend/data/backcast/runs/ || true

      - name: Assert byte-identity (build1 == build2 == committed)
        env:
          ISO: ${{ matrix.iso }}
        run: |
          set -euo pipefail
          echo "-- build1 vs build2 --"
          diff -rq "/tmp/bench_repro/build1/$ISO" "/tmp/bench_repro/build2/$ISO"
          if [ -d "/tmp/bench_repro/committed/$ISO" ]; then
            echo "-- build2 vs committed --"
            diff -rq "/tmp/bench_repro/build2/$ISO" "/tmp/bench_repro/committed/$ISO"
          else
            echo "::notice::no committed bench/$ISO to diff against (first-ever run)"
          fi
          echo "PASS: $ISO bench artifacts are byte-reproducible from committed code + data/raw."

      - name: Upload mismatch artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-repro-mismatch-${{ matrix.iso }}
          path: /tmp/bench_repro/
          retention-days: 14
