name: F923 2025 ER intake

# Regenerates data/raw/_processed-legacy/eia923_monthly_fuel_costs.parquet with
# the EIA-923 2025 annual Early Release vintage (f923_2025er.zip, posted
# 30JUN2026) via scripts/process_f923_fuel_costs.py --merge-years 2025,
# server-side on a runner. The agent sandbox pushes via the GitHub API
# (push_files), which is text-only and cannot carry the parquet binary — same
# pattern as apply-export-cap.yml. Triggered by the push that adds this file;
# commits the refreshed parquet back to the branch it ran on.
#
# The merge is surgical: only year-2025 rows are replaced (monthly-cycle
# vintage -> annual Early Release); 2022/2023/2024/2026 rows are carried
# byte-stable, and the Page-1 generation parquet (a calibration benchmark) is
# deliberately NOT rewritten. The verify step enforces both invariants.
on:
  push:
    branches:
      - claude/miso-keeper-coal-offers-w4c-v04vg3
    paths:
      - .github/workflows/f923-2025er-intake.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pinned to the repo venv's versions)
        run: pip install "pandas==3.0.3" "pyarrow==24.0.0" "openpyxl==3.1.5"

      - name: Download the 2025 annual Early Release from EIA
        run: |
          curl -fsSL --retry 3 -o data/raw/f923_2025er.zip \
            "https://www.eia.gov/electricity/data/eia923/xls/f923_2025er.zip"
          ls -la data/raw/f923_2025er.zip

      - name: Snapshot the pre-merge parquet
        run: cp data/raw/_processed-legacy/eia923_monthly_fuel_costs.parquet /tmp/pre_merge.parquet

      - name: Merge the 2025 ER vintage into the costs parquet
        run: python scripts/process_f923_fuel_costs.py --merge-years 2025

      - name: Verify invariants (carried years byte-stable, 2025 strict superset)
        run: |
          python - <<'EOF'
          import pandas as pd

          new = pd.read_parquet(
              "data/raw/_processed-legacy/eia923_monthly_fuel_costs.parquet"
          )
          old = pd.read_parquet("/tmp/pre_merge.parquet")
          key = ["month", "plant_id", "fuel_group"]
          for y in (2022, 2023, 2024, 2026):
              a = new[new.year == y].sort_values(key).reset_index(drop=True)
              b = old[old.year == y].sort_values(key).reset_index(drop=True)
              assert a.equals(b), f"carried year {y} changed"
          n25 = new[new.year == 2025]
          o25 = old[old.year == 2025]
          merged = o25.merge(n25, on=key, how="left", indicator=True)
          assert (merged._merge == "both").all(), "2025 ER dropped plant-months"
          assert len(n25) > len(o25), "2025 ER added no plant-months"
          print(
              f"OK: 2025 {len(o25)} -> {len(n25)} plant-months, "
              f"{o25.plant_id.nunique()} -> {n25.plant_id.nunique()} plants"
          )
          EOF

      - name: Commit the refreshed parquet back to this branch
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/raw/_processed-legacy/eia923_monthly_fuel_costs.parquet
          git commit -m "data: intake EIA-923 2025 annual Early Release into the delivered fuel-cost parquet (server-side; push_files is text-only) [skip ci]" \
            -m "Source: https://www.eia.gov/electricity/data/eia923/xls/f923_2025er.zip (posted 2026-06-30). Surgical --merge-years 2025: +1,844 plant-months nationally (annual-only respondents), 9 December revisions; 2022/2023/2024/2026 rows carried byte-stable; the Page-1 generation benchmark parquet untouched. Rule 23 source-data citation for this vintage refresh."
          git push origin "HEAD:${GITHUB_REF_NAME}"
