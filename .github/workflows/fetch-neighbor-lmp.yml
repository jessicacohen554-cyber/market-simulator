# Fetch the PJM neighbors' realized hourly marginal price from a GitHub runner,
# which has unrestricted egress (the Claude remote environment blocks
# docs.misoenergy.org and ferc.gov). Manually triggered; commits the resulting
# realized-LMP parquet(s) back to the branch it was dispatched on. The data
# feeds scripts/derive_neighbor_convexity.py, which regresses each neighbor's
# price on its own load to recover the seam's load_shape_exponent (claude.md
# rule #11 — a measured quantity, never tuned to PJM's net export).
#
#   * MISO      Indiana Hub real-time / day-ahead ex-post hourly LMP (the
#               PJM-border hub), ~2 daily files x 365 x 3 years.
#   * Carolinas FERC Form 714 hourly system lambda for Duke (best-effort; the
#               clean bulk CSV runs through 2020 and convexity is structural).
#
# Safe to re-run: each run rebuilds the parquet(s) from scratch and only commits
# when the bytes change.
name: Fetch neighbor LMP

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which neighbor(s) to fetch: miso | carolinas | all"
        default: "all"
        type: string
      years:
        description: "Years to fetch (space-separated)"
        default: "2023 2024 2025"
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests openpyxl tzdata

      - name: Fetch neighbor LMP
        run: |
          python scripts/fetch_neighbor_lmp.py \
            --source ${{ inputs.source }} \
            --years ${{ inputs.years }}

      - name: Commit and push parquet(s)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inputs/calibration/actual_lmp_hourly_MISO.parquet \
                  inputs/calibration/actual_lmp_hourly_Carolinas.parquet 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new neighbor LMP data to commit"
            exit 0
          fi
          git commit -m "data: neighbor realized LMP for convexity (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
