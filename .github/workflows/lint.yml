# Lint gate: enforce the ruff baseline pinned in pyproject.toml ([tool.ruff.lint]
# selects the historical default E4/E7/E9/F ruleset, with the documented E402
# per-file-ignores and E702/E741 carve-outs). `ruff check` is clean against that
# config today; running it per-PR keeps the baseline from silently rotting.
#
# Lightweight on purpose: only installs deps and runs `ruff check`. Formatting is
# NOT enforced here — the tree is not `ruff format`-clean yet (a separate effort).
name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .
