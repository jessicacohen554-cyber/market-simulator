name: apply-nyiso-dynamic-rr-wiring

# Applies the NYISO dynamic-reserve-requirements CLI wiring + nyiso57 A/B
# probe onto this branch, server-side — the apply-miso-1347-edits.yml /
# apply-export-cap.yml precedent. run_calibration_full.py (~364 KB) and
# run_calibration.py (~168 KB) are too large for a hand-transcribed full-file
# MCP push to be trustworthy, so the change travels as a git format-patch
# mailbox (.github/patches/2026_07_10_nyiso_dynamic_rr_cli_wiring.patch)
# applied byte-exactly with `git am`. Idempotent: the apply commit's own push
# does not re-trigger (path-scoped), and a re-run no-ops via the
# reverse-apply check.
on:
  push:
    branches:
      - claude/nyiso-data-retrieval-3bm4o8
    paths:
      - .github/patches/2026_07_10_nyiso_dynamic_rr_cli_wiring.patch
      - .github/workflows/apply-nyiso-dynamic-rr-wiring.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply wiring patch and push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          PATCH=.github/patches/2026_07_10_nyiso_dynamic_rr_cli_wiring.patch
          if git apply --reverse --check "$PATCH" 2>/dev/null; then
            echo "already applied — no-op"
            exit 0
          fi
          git am "$PATCH"
          git push origin "HEAD:${GITHUB_REF_NAME}"
