# One-shot: append the ERCOT-60 calibration-log entry (thread-1 determination
# of the storage-cycling lane — analysis-only session, no solve) from the
# committed payload doc docs/_ercot60_log_entry.md, remove the payload doc, and
# push the docs commit back to this branch (miso57-log-entry precedent — the
# ~700 KB calibration-log.md cannot transit the MCP relay).
name: ercot60-log-entry

on:
  push:
    branches:
      - claude/ercot-storage-cycling-next-35f05l
    paths:
      - .github/workflows/ercot60-log-entry.yml

permissions:
  contents: write

jobs:
  log-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Append log entry, remove payload doc, push
        run: |
          set -euo pipefail
          python - <<'PY'
          log_path = 'docs/calibration-log.md'
          log = open(log_path).read()
          entry = open('docs/_ercot60_log_entry.md').read()
          if 'ERCOT-60: thread-1 of the storage-cycling lane adjudicated' not in log:
              log = log.rstrip('\n') + '\n\n' + entry.strip() + '\n'
              open(log_path, 'w').write(log)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q docs/_ercot60_log_entry.md
          git add docs/calibration-log.md
          git commit -m "docs: ERCOT-60 calibration-log entry (storage-cycling thread-1 determination) + session payload doc removed [skip ci]"
          git push origin HEAD:claude/ercot-storage-cycling-next-35f05l
