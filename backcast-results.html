<style>
:root{--mr:#7b8794;
 /* Canonical ISO colors (docs/DESIGN_SYSTEM.md) — used to color-code the market
    toggle and header badge so the active ISO is unmistakable. */
 --iso-ercot:#22C55E;--iso-pjm:#0EA5E9;--iso-caiso:#F59E0B;--iso-nyiso:#E91E63;
 --iso-neiso:#9C27B0;--iso-miso:#F97316;--iso-spp:#14B8A6;--iso-default:#4A90D9;}
body{background:var(--bg-page)}
.bc-wrap{display:flex;gap:var(--space-lg);max-width:var(--content-max);margin:0 auto;padding:var(--space-lg);align-items:flex-start}
.bc-side{flex:0 0 248px;position:sticky;top:var(--space-md);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-md)}
.bc-main{flex:1;min-width:0}
.bc-side h3{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:var(--space-md) 0 var(--space-sm)}
.bc-side h3:first-child{margin-top:0}
/* ISO / market toggle — the primary axis: prominent, color-coded buttons. Each
   button sets its own ISO color in --c (inline) so the dot, hover and active
   fill all follow it. */
.isobtns{display:flex;flex-direction:column;gap:7px}
.isobtn{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--border);background:var(--bg-surface);border-radius:var(--radius-md);padding:11px 13px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);font-weight:700;transition:background .12s ease,border-color .12s ease,box-shadow .12s ease}
.isobtn:hover{border-color:var(--c);box-shadow:var(--shadow-sm)}
.isobtn .dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:0 0 auto}
.isobtn .iname{flex:1;letter-spacing:.01em}
.isobtn .icount{font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.isobtn.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:var(--shadow-sm)}
.isobtn.on .dot{background:#fff}
.isobtn.on .icount{color:rgba(255,255,255,.82)}
.isohint{font-size:var(--fs-xs);color:var(--ink-faint);margin:7px 2px 0;line-height:1.4}
/* Header ISO badge — echoes the active market next to the page title. */
.isobadge{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:700;color:#fff;background:var(--c,var(--accent));padding:4px 12px 4px 10px;border-radius:999px;box-shadow:var(--shadow-sm);white-space:nowrap}
.isobadge .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.92)}
/* Run picker — a visible radio list (newest first), no popup. */
.runlist{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto}
.runopt{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-sm);padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent}
.runopt:hover{background:#eef3f9}
.runopt.on{background:#eef3f9;border-color:var(--border)}
.runopt input{margin:0;flex:0 0 auto;align-self:center}
.runopt .rlab{font-weight:600;color:var(--ink)}
.runopt .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep);cursor:pointer;text-decoration:underline dotted}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--bg-surface);border-radius:18px;padding:4px 11px;font-size:var(--fs-xs);cursor:pointer;color:var(--ink-muted)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bc-top{display:flex;flex-wrap:wrap;gap:var(--space-md);align-items:center;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-md);margin-bottom:var(--space-md)}
.seg{display:inline-flex;background:#eef1f4;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink-muted);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.lab{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--ink-muted);font-weight:600;text-transform:uppercase;margin-right:6px}
.ctl{display:flex;align-items:center;gap:8px}.ctlwide{flex:1 1 auto;min-width:240px}
.bc-top select{font-size:var(--fs-sm);padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--ink);max-width:100%}
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-lg);margin-bottom:var(--space-md)}
.panel h2{font-size:var(--fs-lg);margin:0 0 var(--space-sm)}
.psub{color:var(--ink-muted);font-size:var(--fs-sm);margin:0 0 var(--space-md)}
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-md)}
.kpicard{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd}
.kpicard .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep);cursor:pointer;text-decoration:underline dotted}
.kpicard .lbl{font-weight:700;font-size:var(--fs-sm);margin:2px 0 10px}

.good{color:var(--success)}.ok{color:#b8860b}.bad{color:var(--danger)}
/* Per-year cards on the report scorecard / LMP grid. */
.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:var(--space-md)}
.lmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:var(--space-md)}
.ycard{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd;min-width:0}
.ycard .yhead{font-weight:800;font-size:var(--fs-base);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.ycard .yhead .ysub{font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted)}

.fnd:first-of-type{border-top:0;padding-top:2px}
.fnd .sevdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.sev-good{background:var(--success)}.sev-ok{background:#e3b341}.sev-bad{background:var(--danger)}
.fnd .fhd{font-weight:700}
.fnd .ftag{display:inline-block;font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted);background:#eef1f4;border-radius:4px;padding:1px 7px;margin-left:7px;vertical-align:1px}
.fcat{font-size:var(--fs-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin:var(--space-md) 0 4px}
.fcat:first-child{margin-top:0}
.tablewrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md)}
table{border-collapse:collapse;width:100%;background:var(--bg-surface);font-size:var(--fs-sm)}
th,td{padding:7px 11px;border-bottom:1px solid #eef1f4;text-align:left;white-space:nowrap}
th{background:#f0f3f6;font-size:var(--fs-xs);text-transform:uppercase;color:#46505f;position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sub td{background:#f3f6f9;font-weight:700}
.svgbox{width:100%;overflow:hidden}svg.chart{width:100%;height:auto;display:block;max-width:100%}
canvas.heat{width:100%;height:160px;image-rendering:pixelated;border:1px solid var(--border);border-radius:6px;background:#eef3f7;display:block}
.ax{display:flex;justify-content:space-between;color:var(--ink-muted);font-size:var(--fs-xs);margin:3px 2px 0}
.legend{display:flex;align-items:center;gap:14px;font-size:var(--fs-sm);color:var(--ink-muted);margin:8px 0;flex-wrap:wrap}
.swatch{display:inline-block;width:20px;height:0;border-top-width:3px;border-top-style:solid;vertical-align:middle;margin-right:5px}
.ramp{height:11px;width:150px;border-radius:3px;background:linear-gradient(90deg,#e8f3f7,#7fc4e6,#86c98f,#f2d65c,#ef8f3c,#c0392b)}
.narr{margin-top:var(--space-md);border-top:1px solid var(--border);padding-top:var(--space-md)}
.narr .ndef{font-size:var(--fs-sm);margin:6px 0;color:var(--ink)}
.narr .rid{font-family:var(--font-mono);color:var(--accent-deep)}
#bctip{position:fixed;display:none;z-index:99;max-width:320px;background:#1a2233;color:#fff;font-size:var(--fs-sm);line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:var(--shadow-md)}
#diag{margin:var(--space-md) 0;padding:var(--space-md);border:1px solid var(--warning);border-radius:var(--radius-md);color:#8a6d00;background:#fffaf0}
.hide{display:none}
.sumband{color:var(--ink-muted);font-size:var(--fs-xs);margin:6px 0 0;display:flex;gap:16px;flex-wrap:wrap}
.sumband i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media(max-width:820px){.bc-wrap{flex-direction:column;padding:var(--space-sm)}.bc-side{position:static;width:100%;flex-basis:auto}.bc-main{width:100%}
 .isobtns{flex-direction:row}.isobtn{flex:1;padding:9px 10px}
 .runlist{max-height:190px}}
@media(max-width:640px){th,td{padding:6px 7px;font-size:var(--fs-xs)}
 .bc-top{flex-direction:column;align-items:stretch;gap:var(--space-sm)}
 .ctl{justify-content:space-between;flex-wrap:wrap}.ctlwide{min-width:0}
 .seg{flex:1;flex-wrap:wrap}.seg button{flex:1}.bc-top select{flex:1}
 .kpigrid,.yeargrid,.lmpgrid{grid-template-columns:1fr}.svgbox{margin:0 -4px}}

<div class=bc-wrap>
 <aside class=bc-side>

 </aside>
 <main class=bc-main>

   <h1 style="font-size:var(--fs-xl);margin:0">Backcast Results</h1>
   <span id=isoBadge class=isobadge></span></div>

   <div class=ctl><span class=lab>View</span><span class=seg id=pageSel>
    <button data-p=report class=on>Run report</button><button data-p=charts>Charts</button><button data-p=tables>Tables</button></span></div>
   <div class=ctl id=ctlYear><span class=lab>Year</span><span class=seg id=yearSel></span></div>
   <div class=ctl id=ctlClass><span class=lab>Class</span><select id=classSel></select></div>
   <div class="ctl ctlwide"><span class=lab>Zones</span><span class=chips id=zoneSel></span></div>
  </div>
  <div id=content></div>
 </main>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="frontend/data/backcast/manifest.js"></script><script src="frontend/data/backcast/benchmark.js"></script>
<script>
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const NS="http://www.w3.org/2000/svg",T=8760;
let META,BENCH,MODEL={},st,SUB_BASE=null;
// ISO color token for the active-market chrome (toggle, header badge), with a
// neutral fallback for any ISO not in the canonical palette.
function isoColorVar(iso){return `var(--iso-${String(iso).toLowerCase()},var(--iso-default))`;}
function isoRunCount(iso){return BC.manifest.filter(m=>(m.iso||"ERCOT")===iso).length;}
function inflate(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("browser lacks DecompressionStream — use a current browser"));
 return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()
  .then(ab=>JSON.parse(new TextDecoder().decode(ab)));}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("failed to load "+src));document.head.appendChild(s);});}
async function ensureRuns(ids){for(const id of ids){if(MODEL[id])continue;
  try{
    if(!window.BC.runGz||!window.BC.runGz[id]){const m=META_RUN(id);if(!m)continue;await loadScript(m.file);}
    if(window.BC.runGz&&window.BC.runGz[id])MODEL[id]=await inflate(window.BC.runGz[id]);
  }catch(e){console.warn("skipping run "+id+": "+(e&&e.message||e));}}}
function META_RUN(id){return BC.manifest.find(r=>r.id===id);}
function dec(b){const s=atob(b),a=new Float32Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function pearson(m,o){let mm=0,oo=0,n=m.length;for(let i=0;i<n;i++){mm+=m[i];oo+=o[i];}mm/=n;oo/=n;let a=0,b=0,c=0;for(let i=0;i<n;i++){const x=m[i]-mm,y=o[i]-oo;a+=x*y;b+=x*x;c+=y*y;}const d=Math.sqrt(b*c);return d>0?a/d:0;}
function nrmse(m,o){let s=0,om=0,n=m.length;for(let i=0;i<n;i++){s+=(m[i]-o[i])**2;om+=o[i];}om/=n;return om>0?Math.sqrt(s/n)/om:9.9;}
function capScore(r,nr,dev){return 100*Math.cbrt(Math.max(0,r)*Math.max(0,1-nr)*Math.max(0,1-Math.abs(dev)));}
function plantsOf(id,year,grp){const M=MODEL[id].years[year],B=BENCH[year];if(!M||!B)return [];
 return Object.keys(M.plants).filter(c=>{const b=B.plants[c];return b&&b.group===grp&&st.zones.has(b.zone);});}
const _aggC={},_eAllC={};
// Full EIA-923 class total (all 923 plants of the class), allocated to the
// selected zones by the matched plants' EIA-923 distribution: the matched set
// understates the class (e.g. CC_REGULAR ~138 of 145 TWh), so the zonal Δ-vs-
// 923 is scaled to the full class total rather than the matched subtotal.
function matchedEAnnAll(year,grp){const k=year+"|"+grp;if(_eAllC[k]!=null)return _eAllC[k];
 const B=BENCH[year];let s=0;for(const c in B.plants){if(B.plants[c].group===grp)s+=B.plants[c].e_ann;}return _eAllC[k]=s;}
function classBench923(year,grp,eAzones){const B=BENCH[year];
 const cf=B.classFull?B.classFull[grp]:null,eAll=matchedEAnnAll(year,grp);
 return (cf!=null&&eAll>0)?cf*(eAzones/eAll):eAzones;}
// Model class total scaled the same way: the full grid-LP+BTM class total
// (gmModel) allocated to the selected zones by the matched plants' model
// distribution — so the Δ-vs-923 compares full class to full class (matched
// model vs full 923 would understate the model and exaggerate the shortfall).
const _mAllC={};
function matchedMAnnAll(id,year,grp){const k=id+"|"+year+"|"+grp;if(_mAllC[k]!=null)return _mAllC[k];
 const M=MODEL[id].years[year],B=BENCH[year];let s=0;
 for(const c in M.plants){if(B.plants[c]&&B.plants[c].group===grp)s+=M.plants[c].m_ann;}return _mAllC[k]=s;}
function classModelFull(id,year,grp,mAzones){const gm=(MODEL[id].years[year].gmModel||{})[grp],mAll=matchedMAnnAll(id,year,grp);
 return (gm!=null&&mAll>0)?gm*(mAzones/mAll):mAzones;}
function aggMW(id,year,grp){const key=id+"|"+year+"|"+grp+"|"+[...st.zones].sort().join(",");
 if(_aggC[key])return _aggC[key];const M=MODEL[id].years[year],B=BENCH[year];
 const mm=new Float32Array(T),cc=new Float32Array(T);let mA=0,cA=0,eA=0,bA=0;
 for(const c of plantsOf(id,year,grp)){const b=B.plants[c],npl=b.npl,md=dec(M.plants[c].m),cd=dec(b.campd);
  for(let i=0;i<T;i++){mm[i]+=md[i]*npl/100;cc[i]+=cd[i]*npl/100;}
  mA+=M.plants[c].m_ann;cA+=b.c_ann;eA+=b.e_ann;bA+=(b.btm||0);}
 return _aggC[key]={mm,cc,mA,cA,eA,bA};}
function classMetrics(id,year,grp){const ps=plantsOf(id,year,grp);if(!ps.length)return null;
 const a=aggMW(id,year,grp);const r=pearson(a.mm,a.cc),nr=nrmse(a.mm,a.cc),dev=a.cA>0?(a.mA-a.cA)/a.cA:0;
 const m1=a.cc.reduce((s,v)=>s+v,0)>0?capScore(r,nr,dev):null;
 const M=MODEL[id].years[year];let ws=0,cs=0;for(const c of ps){const w=BENCH[year].plants[c].npl,cp=M.plants[c].cap;if(cp!=null){ws+=w;cs+=w*cp;}}
 return {m1,m2:ws>0?cs/ws:null,r,nr,dev,mA:a.mA,mFull:classModelFull(id,year,grp,a.mA),cA:a.cA,eA:a.eA,bench923:classBench923(year,grp,a.eA),n:ps.length};}
function avgLMP(id,year){const L=(MODEL[id].years[year]||{}).lmp||{};let pd=0,d=0;
 for(const z in L){if(!st.zones.has(z))continue;pd+=L[z].p*L[z].d;d+=L[z].d;}
 return d>0?pd/d:null;}
// Model monthly avg LMP load-weighted over the selected zones (12 values, or
// null when no per-month price is in the payload — older runs carry only the
// annual p/d). Mirrors avgLMP's demand-weighting, per month via pMon/dMon.
function avgLMPMon(id,year){const L=(MODEL[id].years[year]||{}).lmp||{};
 const pd=Array(12).fill(0),d=Array(12).fill(0);let any=false;
 for(const z in L){if(!st.zones.has(z))continue;const zl=L[z];if(!zl.pMon||!zl.dMon)continue;
  for(let m=0;m<12;m++){if(zl.pMon[m]==null)continue;pd[m]+=zl.pMon[m]*zl.dMon[m];d[m]+=zl.dMon[m];any=true;}}
 return any?pd.map((s,m)=>d[m]>0?s/d[m]:null):null;}
function dcls(d){const a=Math.abs(d);return a<5?"good":a<15?"ok":"bad";}
function ppcls(d){const a=Math.abs(d);return a<1?"good":a<3?"ok":"bad";}
// Hourly-r banding for the dispatch-correlation views: the class aggregate is
// tracking CAMPD shape well above 0.85, usably above 0.70, poorly below.
const R_GOOD=0.85,R_OK=0.70;
function rcls(r){return r==null?"":r>=R_GOOD?"good":r>=R_OK?"ok":"bad";}
function fmtPct(d){return (d>=0?"+":"")+d.toFixed(1)+"%";}
function fmtpp(d){return (d>=0?"+":"")+d.toFixed(1);}
// ---- generation mix (system-wide; matches the calibration [3b] analysis) ----
// Model total per fossil class = grid LP + behind-the-meter must-run (gmModel);
// actual = full EIA-923 (classFull). Shows each class's share of TOTAL
// generation and of FOSSIL generation, plus the model's pp deviation from the
// actual fossil share. Non-fossil rows (nuclear/wind/solar) give the share of
// total generation only. Zone-independent: 923/930 totals are system-wide.
function mixLabel(g){return META.groupLabel[g]||({ST_CHP:"Steam Gas CHP"}[g])||g;}
function genMixData(id,yr){const B=BENCH[yr];const gm=(MODEL[id].years[yr]||{}).gmModel||{};
 const nf=(MODEL[id].years[yr]||{}).nonfossil||{};
 const mFos=Object.keys(B.classFull).reduce((s,g)=>s+(gm[g]||0),0);
 const mGen=mFos+(nf.nuclear||0)+(nf.wind||0)+(nf.solar||0);
 return {gm,nf,mFos,mGen};}
function genMixPanel(id,yr){const B=BENCH[yr];if(!B||!B.classFull)return "";
 const cf=B.classFull,e930=B.e930||{},FG=Object.keys(cf);
 const aFos=FG.reduce((s,g)=>s+(cf[g]||0),0);
 const aGen=aFos+(e930.nuclear||0)+(e930.wind||0)+(e930.solar||0);
 const D=genMixData(id,yr);
 let h='<div class=panel><h2>Generation mix <span class=psub>(system-wide; share of total &amp; of fossil generation vs full EIA-923)</span></h2>';
 h+=`<p class=psub>Actual fossil ${aFos.toFixed(1)} TWh of ${aGen.toFixed(1)} TWh total · ${MODEL[id].label} fossil ${D.mFos.toFixed(1)} TWh</p>`;
 h+='<div class=tablewrap><table><thead><tr><th>class</th>'
  +'<th>model TWh</th><th>actual TWh</th><th>model %gen</th><th>actual %gen</th>'
  +'<th>model %fos</th><th>actual %fos</th><th>Δpp</th></tr></thead><tbody>';
 for(const g of FG){const a_f=100*(cf[g]||0)/aFos,a_g=100*(cf[g]||0)/aGen;
  const m=D.gm[g]||0,m_f=D.mFos>0?100*m/D.mFos:0,m_g=D.mGen>0?100*m/D.mGen:0,dpp=m_f-a_f;
  h+=`<tr><td>${mixLabel(g)}</td><td class=num>${m.toFixed(2)}</td><td class=num>${(cf[g]||0).toFixed(2)}</td>`

// classErr so the tolerance test treats every class uniformly; nonfos flags it
// so the system-error KPI stays fossil-only and labels can mark it system-wide.
function nonFosErr(id,yr,fuel){const av=((BENCH[yr]||{}).e930||{})[fuel],mv=((MODEL[id].years[yr]||{}).nonfossil||{})[fuel];
 const a=av||0,m=mv||0;if(!(a>0.02))return null;
 return {grp:fuel,nonfos:true,err:100*(m-a)/a,mFull:m,bench923:a,sharePP:sharePP(id,yr,m,a)};}
function anyErr(id,yr,g){return isNonFos(g)?nonFosErr(id,yr,g):classErr(id,yr,g);}
function classErrs(id,yr){const out=[];for(const g of allClasses()){const e=anyErr(id,yr,g);if(e)out.push(e);}return out;}
// A fossil class passes only when BOTH hold:
//  (1) volume: signed error within ±SUM_TOL_PCT% OR the absolute miss within
//      SUM_TOL_TWH of actual (small classes can be off by a larger % while
//      still within a TWh, so the dual band keeps them from dominating); and
//  (2) share: its share of TOTAL generation is within SUM_TOL_SHARE_PP
//      percentage points of the actual share — so a class can't pass on volume
//      alone while still misrepresenting the generation mix.
const SUM_TOL_PCT=5,SUM_TOL_TWH=1.0,SUM_TOL_SHARE_PP=1.5;
function volInTol(e,k){return Math.abs(e.err)<=k*SUM_TOL_PCT||Math.abs(e.mFull-e.bench923)<=k*SUM_TOL_TWH;}
function shareInTol(e,k){return e.sharePP==null||Math.abs(e.sharePP)<=k*SUM_TOL_SHARE_PP;}
function classInTol(e){return volInTol(e,1)&&shareInTol(e,1);}
// Per-class status: good = in tolerance (both bands); ok = within twice both
// bands; bad otherwise. clsTol takes the class-error object; tolcls takes a
// bare % (for the system-level error, where 1 TWh on a multi-hundred-TWh total
// is never the binding band and there is no single class share to test).
function clsTol(e){return classInTol(e)?"good":(volInTol(e,2)&&shareInTol(e,2))?"ok":"bad";}
function tolcls(v){const a=Math.abs(v);return a<=SUM_TOL_PCT?"good":a<=2*SUM_TOL_PCT?"ok":"bad";}
function summaryHeadline(id,yr){const es=classErrs(id,yr);
 // System volume error stays fossil-only (Σ model vs Σ full EIA-923); the
 // in-tolerance count and worst class span every class incl. non-fossil.
 let sm=0,sa=0,worst=null;
 es.forEach(e=>{if(!e.nonfos){sm+=e.mFull;sa+=e.bench923;}if(!worst||Math.abs(e.err)>Math.abs(worst.err))worst=e;});
 return {n:es.length,inTol:es.filter(classInTol).length,
  sysErr:sa>0?100*(sm-sa)/sa:null,worst,price:avgLMP(id,yr)};}
// Actual historical avg LMP ($/MWh) for the selected year (system hub-average),
// from the benchmark payload; absent for an ISO-year with no price file.
function actualLMP(yr){return (BENCH[yr]||{}).avgLMP||null;}
// Generation-weighted mean class hourly r (weights = CAMPD actual TWh) — the
// scorecard's one-number dispatch-correlation summary for a year.
function fleetR(id,yr){let ws=0,s=0;
 for(const g of META.groups){const m=classMetrics(id,yr,g);if(!m||m.cA<=0)continue;ws+=m.cA;s+=m.cA*m.r;}
 return ws>0?s/ws:null;}
// The years this run actually carries data for (manifest order, numbers).
function runYears(id){const m=META_RUN(id),ys=MODEL[id]?Object.keys(MODEL[id].years).map(Number):[];
 return (m&&m.years?m.years.map(Number):ys).filter(y=>MODEL[id]&&MODEL[id].years[y]);}
// Monthly LMP table (Tables page reference; the report shows the same data as
// charts). Model = load-weighted over the selected zones per month; actual =
// the system DA / RT hub average per month. Δ = (model − actual)/actual.
function lmpMonthlyTable(id,yr){const mm=avgLMPMon(id,yr);if(!mm)return "";
 const aL=actualLMP(yr)||{},da=aL.da_mon,rt=aL.rt_mon;
 const pair=(m,a)=>{const d=(m!=null&&a)?100*(m-a)/a:null;
  return `<td class=num>${a==null?"—":"$"+a.toFixed(1)}</td><td class="num ${d==null?'':dcls(d)}">${d==null?"—":fmtPct(d)}</td>`;};
 let h='<div class=panel><h2>Monthly LMP — model vs actual '
  +'<span class=psub>(model load-weighted over selected zones; actual = system hub average; Δ = (model − actual)/actual)</span></h2>'
  +'<div class=tablewrap><table><thead><tr><th>month</th><th>model $/MWh</th>'
  +(da?'<th>actual DA</th><th>Δ DA</th>':'')+(rt?'<th>actual RT</th><th>Δ RT</th>':'')+'</tr></thead><tbody>';
 for(let m=0;m<12;m++){h+=`<tr><td>${MONTHS[m]}</td><td class=num>${mm[m]==null?"—":"$"+mm[m].toFixed(1)}</td>`
   +(da?pair(mm[m],da[m]):'')+(rt?pair(mm[m],rt[m]):'')+'</tr>';}
 const ann=avgLMP(id,yr);
 h+=`<tr class=sub><td>Annual</td><td class=num>${ann==null?"—":"$"+ann.toFixed(1)}</td>`
   +(da?pair(ann,aL.da):'')+(rt?pair(ann,aL.rt):'')+'</tr>';
 return h+'</tbody></table></div><p class=psub>Diagnostic only — LMP level is not a calibration target.</p></div>';}
// ============================ RUN REPORT ============================
// The full-run view: every testing year at once. Class tolerance, dispatch
// correlation and LMP fidelity per year, plus auto-generated diagnostics that
// localize each miss. All zone-aware metrics honor the zone chips.
function yearScoreCard(id,yr){const H=summaryHeadline(id,yr),fr=fleetR(id,yr);
 const aL=actualLMP(yr),aP=aL?(aL.da!=null?aL.da:aL.rt):null,aLab=aL&&aL.da!=null?"DA":"RT";
 const pdiff=(H.price!=null&&aP)?100*(H.price-aP)/aP:null;
 return `<div class=ycard><div class=yhead>${yr}<span class=ysub>${H.inTol===H.n?"all classes pass":""}</span></div>
  <div class=kpirow><span class=k>Classes in tolerance</span><span class="v ${H.n&&H.inTol===H.n?'good':H.inTol*2>=H.n?'ok':'bad'}">${H.inTol} / ${H.n}</span></div>
  <div class=kpirow><span class=k>System volume error</span><span class="v ${H.sysErr==null?'':tolcls(H.sysErr)}">${H.sysErr==null?"—":fmtPct(H.sysErr)}</span></div>
  <div class=kpirow><span class=k>Fleet dispatch r</span><span class="v ${rcls(fr)}">${fr==null?"—":fr.toFixed(3)}</span></div>
  <div class=kpirow><span class=k>Avg LMP (model)</span><span class=v>${H.price==null?"—":"$"+H.price.toFixed(1)}</span></div>
  <div class=kpirow><span class=k>LMP Δ vs ${aL?aLab:"actual"}</span><span class="v ${pdiff==null?'':dcls(pdiff)}">${pdiff==null?"—":fmtPct(pdiff)}</span></div>
  <div class=kpirow><span class=k>Worst class</span><span class="v ${H.worst?clsTol(H.worst):''}">${H.worst?classLabel(H.worst.grp)+" "+fmtPct(H.worst.err):"—"}</span></div></div>`;}
// Class-tolerance heatmap: rows = every benchmarked class, cols = years; cell
// = signed % volume error, diverging cool/warm with the ±tolerance deadband in
// gray. One glance answers "which classes are off, in which years, and which
// way" — no year-by-year clicking.
function mountTolHeat(id,years){const div=document.getElementById("tolHeat");if(!div)return;
 if(typeof Plotly==="undefined"){div.innerHTML=NOPLOT;return;}
 const byY={};years.forEach(yr=>{byY[yr]={};classErrs(id,yr).forEach(e=>byY[yr][e.grp]=e);});
 const rows=allClasses().filter(g=>years.some(yr=>byY[yr][g]));
 if(!rows.length){div.innerHTML='<p class=psub>No class-level error data for this run/zone selection.</p>';return;}
 const cool=cssTok('--accent','#4A90D9'),warm=cssTok('--danger','#E74C3C'),gray=cssTok('--mr','#7b8794');
 const CAP=20,db=SUM_TOL_PCT,tlo=(CAP-db)/(2*CAP),thi=(CAP+db)/(2*CAP);
 const SCALE=[[0,cool],[tlo,'#ffffff'],[tlo,gray],[thi,gray],[thi,'#ffffff'],[1,warm]];
 const Z=[],TXT=[],CD=[];
 for(const g of rows){const zr=[],tr=[],cr=[];
  for(const yr of years){const e=byY[yr][g];
   if(e){zr.push(Math.max(-CAP,Math.min(CAP,e.err)));tr.push(fmtPct(e.err));
    const status=classInTol(e)?"PASS":(clsTol(e)==="ok"?"near miss":"FAIL"),
     why=classInTol(e)?"":(!volInTol(e,1)?" — volume out of band":"")+(!shareInTol(e,1)?" — gen-share off by "+(e.sharePP>=0?"+":"")+e.sharePP.toFixed(1)+"pp":"");
    cr.push([e.mFull.toFixed(2),e.bench923.toFixed(2),status+why,e.err]);}
   else{zr.push(null);tr.push("");cr.push(["","","",null]);}}
  Z.push(zr);TXT.push(tr);CD.push(cr);}
 const trace={type:"heatmap",x:years.map(String),y:rows.map(classLabel),z:Z,text:TXT,texttemplate:"%{text}",
  customdata:CD,zmin:-CAP,zmax:CAP,colorscale:SCALE,xgap:2,ygap:2,
  hovertemplate:"<b>%{y}</b> · %{x}<br>model %{customdata[0]} · actual %{customdata[1]} TWh<br>Δ %{customdata[3]:+.1f}% · %{customdata[2]}<extra></extra>",
  textfont:{size:11,color:"#1F2933"},
  colorbar:{title:{text:"signed % error",side:"right"},ticksuffix:"%",thickness:12,len:0.9,outlinewidth:0,tickfont:{size:11}}};
 const narrow=(div.clientWidth||640)<560;
 const layout={margin:{l:narrow?86:140,r:narrow?6:16,t:26,b:8},
  height:rows.length*(narrow?32:38)+70,
  xaxis:{type:"category",side:"top",tickfont:{size:12},automargin:true},
  yaxis:{type:"category",autorange:"reversed",automargin:true,tickfont:{size:narrow?10:11}},
  paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"inherit"}};
 Plotly.react(div,[trace],layout,{displayModeBar:false,responsive:true});}
// Dispatch-correlation heatmap: rows = fossil classes, cols = years; cell =
// hourly r of the class aggregate vs CAMPD, in three hard bands (green ≥ 0.85,

function mountCorrHeat(id,years){const div=document.getElementById("corrHeat");if(!div)return;
 if(typeof Plotly==="undefined"){div.innerHTML=NOPLOT;return;}
 const rows=META.groups.filter(g=>years.some(yr=>classMetrics(id,yr,g)));
 if(!rows.length){div.innerHTML='<p class=psub>No dispatch data for this run/zone selection.</p>';return;}
 const good=cssTok('--success','#2ECC71'),okc='#F1C40F',bad=cssTok('--danger','#E74C3C');
 const SCALE=[[0,bad],[R_OK,bad],[R_OK,okc],[R_GOOD,okc],[R_GOOD,good],[1,good]];
 const Z=[],TXT=[],CD=[];
 for(const g of rows){const zr=[],tr=[],cr=[];
  for(const yr of years){const m=classMetrics(id,yr,g);
   if(m){zr.push(Math.max(0,m.r));tr.push(m.r.toFixed(2));cr.push([m.nr.toFixed(3),m.m1==null?"—":m.m1.toFixed(0)+"%",m.r.toFixed(3)]);}
   else{zr.push(null);tr.push("");cr.push(["","",""]);}}
  Z.push(zr);TXT.push(tr);CD.push(cr);}
 const trace={type:"heatmap",x:years.map(String),y:rows.map(g=>META.groupLabel[g]),z:Z,text:TXT,texttemplate:"%{text}",
  customdata:CD,zmin:0,zmax:1,colorscale:SCALE,xgap:2,ygap:2,
  hovertemplate:"<b>%{y}</b> · %{x}<br>hourly r %{customdata[2]} · NRMSE %{customdata[0]}<br>class capture %{customdata[1]}<extra></extra>",
  textfont:{size:11,color:"#1F2933"},
  colorbar:{title:{text:"hourly r",side:"right"},thickness:12,len:0.9,outlinewidth:0,tickfont:{size:11},tickvals:[0,R_OK,R_GOOD,1]}};
 const narrow=(div.clientWidth||640)<560;
 const layout={margin:{l:narrow?86:140,r:narrow?6:16,t:26,b:8},
  height:rows.length*(narrow?32:38)+70,
  xaxis:{type:"category",side:"top",tickfont:{size:12},automargin:true},
  yaxis:{type:"category",autorange:"reversed",automargin:true,tickfont:{size:narrow?10:11}},

 Plotly.react(div,[trace],layout,{displayModeBar:false,responsive:true});}
// Per-year LMP chart: model monthly avg (load-weighted, selected zones) vs the
// actual DA/RT system hub averages. SVG (no Plotly) so it stays light on phones.
function lmpYearCard(id,yr){const mm=avgLMPMon(id,yr),aL=actualLMP(yr)||{};
 const ann=avgLMP(id,yr),aP=aL.da!=null?aL.da:aL.rt,pdiff=(ann!=null&&aP)?100*(ann-aP)/aP:null;
 const head=`<div class=yhead>${yr}<span class="ysub ${pdiff==null?'':dcls(pdiff)}">${pdiff==null?"no actual":"annual Δ "+fmtPct(pdiff)}</span></div>`;
 if(!mm)return `<div class=ycard>${head}<p class=psub>No monthly model LMP in this payload.</p></div>`;
 return `<div class=ycard>${head}<div class=svgbox data-lmpyear="${yr}"></div></div>`;}
function mountLmpCharts(id,years){document.querySelectorAll("[data-lmpyear]").forEach(box=>{
 const yr=+box.dataset.lmpyear,mm=avgLMPMon(id,yr),aL=actualLMP(yr)||{};if(!mm)return;
 const sets=[{pts:mm.map(v=>v==null?0:v),color:"#4A90D9",name:"Model",dash:"4 3"}];
 if(aL.da_mon)sets.unshift({pts:aL.da_mon,color:"#647184",name:"Actual DA",w:3});
 if(aL.rt_mon)sets.unshift({pts:aL.rt_mon,color:"#9aa5b1",name:"Actual RT",w:2});
 const ymax=Math.max(20,...sets.flatMap(s=>s.pts.map(v=>Number(v)||0)))*1.15;
 box.appendChild(lineChart(sets,ymax,MONTHS.map(m=>m[0]),"",380,210));});}
// ---- diagnostics: localize each miss and suggest the likely source ----
// Pure presentation-layer heuristics over the same payload numbers shown in
// the charts (volErr month/zone decomposition, per-plant Δ923, class r, LMP
// deltas) — nothing here re-decides a calibration metric. Wording is hedged:
// these are pointers for where to look, not verdicts.
const SUMMER=[5,6,7,8],WINTER=[11,0,1];          // Jun–Sep, Dec–Feb (0-based)
function monthMiss(id,yr,cls){const out=[];
 for(const mo of ALLMON){const c=volMA(id,yr,cls,st.zones,[mo]);out.push(c?c.m-c.a:0);}return out;}
function seasonLabel(idx){return SUMMER.includes(idx)?"summer":WINTER.includes(idx)?"winter":"shoulder";}
function fmtTWh(v){return (v>=0?"+":"")+(Math.abs(v)>=1?v.toFixed(1)+" TWh":(v*1e3).toFixed(0)+" GWh");}
function topPlantMisses(id,yr,grp,n){const B=BENCH[yr],M=MODEL[id].years[yr];if(!B||!M)return [];
 return plantsOf(id,yr,grp).map(c=>{const b=B.plants[c],mp=M.plants[c];
   return {name:b.name,zone:b.zone,miss:mp.m_ann-b.e_ann,e:b.e_ann};})
  .filter(p=>p.e>0.001).sort((a,b)=>Math.abs(b.miss)-Math.abs(a.miss)).slice(0,n);}
// One volume finding per failing class: which years, which direction, and
// whether the miss is seasonal, zonal, plant-specific or a flat level shift —
// each pattern maps to a different first place to look.
function volFinding(id,years,g){
 const errsByY=years.map(yr=>({yr,e:anyErr(id,yr,g)})).filter(x=>x.e);
 const failing=errsByY.filter(x=>clsTol(x.e)!=="good");if(!failing.length)return null;
 const worst=failing.reduce((a,b)=>Math.abs(b.e.err)>Math.abs(a.e.err)?b:a);
 const sev=clsTol(worst.e),dir=worst.e.err>=0?"over":"under";
 const signs=errsByY.map(x=>Math.sign(x.e.err)),structural=errsByY.length>1&&signs.every(s=>s===signs[0]);
 const yrs=failing.map(x=>x.yr).join(", ");
 let txt=`${dir==="over"?"Over":"Under"}-generates by ${fmtPct(worst.e.err)} (${fmtTWh(worst.e.mFull-worst.e.bench923)}) in ${worst.yr}`
  +(failing.length>1?`; out of tolerance in ${yrs}`:"")
  +(structural?` — same direction every year, so it reads as structural (offer-curve level), not weather/gas-price driven.`:`.`);
 if(!shareInTol(worst.e,1)&&worst.e.sharePP!=null)
  txt+=` Its share of total generation is off by ${fmtpp(worst.e.sharePP)}pp.`;
 if(!isNonFos(g)){
  const dm=monthMiss(id,worst.yr,g),D=dm.reduce((s,v)=>s+v,0);
  if(Math.abs(D)>0.02){
   // season concentration: share of the signed miss carried by each season
   const sums={summer:0,winter:0,shoulder:0};dm.forEach((v,i)=>sums[seasonLabel(i)]+=v);
   const seas=Object.entries(sums).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
   const sShare=seas[1]/D,sameSign=dm.filter(v=>Math.sign(v)===Math.sign(D)&&Math.abs(v)>1e-4).length;
   if(sameSign>=10&&Math.abs(sShare)<0.55){
    txt+=` The miss is spread across all months (a level shift) — first place to look: the committed/min-gen floor or the committed-band multiplier for this class.`;
   }else if(seas[1]!==0&&Math.abs(sShare)>=0.55){
    const lever=seas[0]==="summer"?"the peak / econ_high tranche":(seas[0]==="winter"?"the winter availability / peak tranche":"the econ_low / shoulder tranche");
    txt+=` ${Math.round(100*Math.abs(sShare))}% of the miss sits in ${seas[0]} months — first place to look: ${lever} (${dir==="over"?"likely priced too low; the class clears too often there":"likely priced too high; the class drops out of merit there"}).`;}
   // zone concentration
   const ve=((MODEL[id].years[worst.yr]||{}).volErr||{})[g];
   if(ve&&ve.zoneMon){const zs=Object.entries(ve.zoneMon).filter(([z])=>st.zones.has(z))
     .map(([z,zc])=>({z,d:zc.m.reduce((s,v)=>s+v,0)-zc.a.reduce((s,v)=>s+v,0)}))
     .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    if(zs.length>1&&Math.abs(zs[0].d/D)>0.6&&Math.sign(zs[0].d)===Math.sign(D)){
     const zshare=Math.abs(zs[0].d/D);
     txt+=zshare>1.02
      ?` ${zs[0].z} carries more than the whole net miss (${fmtTWh(zs[0].d)}; other zones partly offset it) — check zonal load share / basis there before retuning the class curve.`
      :` ${zs[0].z} alone carries ${Math.round(100*zshare)}% of it (${fmtTWh(zs[0].d)}) — check zonal load share / basis there before retuning the class curve.`;}}
  // plant concentration (EIA-923 per plant; 2025 actuals can be partial)
  const tp=topPlantMisses(id,worst.yr,g,3);
  if(tp.length&&Math.abs(tp[0].miss)>0.4&&Math.abs(tp[0].miss)/Math.max(0.01,Math.abs(worst.e.mFull-worst.e.bench923))>0.5)
   txt+=` Half or more of the class miss is one plant: ${tp[0].name} (${tp[0].zone}, ${fmtTWh(tp[0].miss)})${worst.yr===2025?" — note 2025 EIA-923 may be partial":""} — check that plant's outage overlay / capacity before touching the class.`;}
 }
 return {cat:"vol",sev,title:classLabel(g),tag:yrs,txt,score:Math.abs(worst.e.err)};}
// Shape findings: classes whose hourly correlation is weak. If the volume is
// fine the problem is timing (tranche ordering/widths); the hour-of-day bias
// says whether the class runs too flat or too peaky.
function shapeFinding(id,years,g){
 const ms=years.map(yr=>({yr,m:classMetrics(id,yr,g)})).filter(x=>x.m&&x.m.cA>0);
 const weak=ms.filter(x=>x.m.r<R_GOOD);if(!weak.length)return null;
 const worst=weak.reduce((a,b)=>b.m.r<a.m.r?b:a);
 const sev=rcls(worst.m.r)==="ok"?"ok":"bad";
 const volOK=Math.abs(100*(worst.m.mFull-worst.m.bench923)/Math.max(0.01,worst.m.bench923))<=SUM_TOL_PCT;
 let txt=`Hourly r ${worst.m.r.toFixed(2)} vs CAMPD in ${worst.yr}`+(weak.length>1?` (weak in ${weak.map(x=>x.yr).join(", ")})`:"")+".";
 if(volOK)txt+=" Annual volume is in band, so this is a timing problem — when the class runs, not how much: look at tranche ordering / band widths rather than levels.";
 const a=aggMW(id,worst.yr,g);let npl=0;plantsOf(id,worst.yr,g).forEach(c=>npl+=BENCH[worst.yr].plants[c].npl);
 if(npl>0){let mp=0,cp=0,mn=0,cn2=0,np=0,nn=0;
  for(let h=0;h<T;h++){const hod=h%24;
   if(hod>=14&&hod<=21){mp+=a.mm[h];cp+=a.cc[h];np++;}
   else if(hod<=5){mn+=a.mm[h];cn2+=a.cc[h];nn++;}}
  const pb=(mp-cp)/np,nb=(mn-cn2)/nn,thr=0.02*npl;
  if(nb>thr&&pb<-thr)txt+=` The model runs this class too flat: +${(nb/1e3).toFixed(1)} GW overnight, ${(pb/1e3).toFixed(1)} GW in the evening peak vs CAMPD.`;
  else if(nb<-thr&&pb>thr)txt+=` The model runs this class too peaky: ${(nb/1e3).toFixed(1)} GW overnight, +${(pb/1e3).toFixed(1)} GW in the evening peak vs CAMPD.`;}
 const wp=plantsOf(id,worst.yr,g).map(c=>({n:BENCH[worst.yr].plants[c].name,r:MODEL[id].years[worst.yr].plants[c].r,w:BENCH[worst.yr].plants[c].npl}))
  .filter(p=>p.r!=null).sort((x,y)=>(1-y.r)*y.w-(1-x.r)*x.w).slice(0,2);
 if(wp.length)txt+=` Worst-tracking plants: ${wp.map(p=>`${p.n} (r ${p.r.toFixed(2)})`).join(", ")}.`;
 return {cat:"shape",sev,title:META.groupLabel[g],tag:weak.map(x=>x.yr).join(", "),txt,score:1-worst.m.r};}
// LMP findings: annual bias plus the worst months, tied (where the data
// supports it) to the class volume misses in those same months.
function lmpFindings(id,years){const out=[];
 for(const yr of years){const mm=avgLMPMon(id,yr);if(!mm)continue;
  const aL=actualLMP(yr)||{},am=aL.da_mon||aL.rt_mon;if(!am)continue;
  const lab=aL.da_mon?"DA":"RT";
  const ds=mm.map((v,i)=>(v!=null&&am[i])?100*(v-am[i])/am[i]:null);
  const ann=avgLMP(id,yr),aP=aL.da!=null?aL.da:aL.rt;
  const pdiff=(ann!=null&&aP)?100*(ann-aP)/aP:null;
  const hot=ds.map((d,i)=>({d,i})).filter(x=>x.d!=null&&Math.abs(x.d)>=15)
   .sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3);
  if(pdiff==null||(Math.abs(pdiff)<5&&!hot.length))continue;
  let txt=`Annual model LMP ${fmtPct(pdiff)} vs actual ${lab}.`;
  if(hot.length){txt+=` Largest monthly gaps: ${hot.map(x=>`${MONTHS[x.i]} ${fmtPct(x.d)}`).join(", ")}.`;
   // tie the worst month to the largest class volume miss in that month
   const w=hot[0];let cand=null;
   for(const g of META.groups){const c=volMA(id,yr,g,st.zones,[w.i]);if(!c)continue;
    const d=c.m-c.a;if(!cand||Math.abs(d)>Math.abs(cand.d))cand={g,d};}
   if(cand&&Math.abs(cand.d)>0.05){
    const over=cand.d>0;
    txt+=` That month coincides with ${META.groupLabel[cand.g]} ${over?"over":"under"}-dispatching by ${fmtTWh(cand.d)}`
     +(w.d>0&&!over?" — the model looks short that supply, letting costlier units set the price.":
       (w.d<0&&over?" — the extra cheap supply depresses the model price.":"."));}}
  txt+=" Reminder: the model is a day-ahead-style energy LP with no ORDC/scarcity adders, so some positive bias in scarcity months is expected.";
  out.push({cat:"lmp",sev:pdiff!=null?dcls(pdiff):"ok",title:"LMP "+yr,tag:"vs "+lab,txt,score:Math.abs(pdiff||0)});}
 return out;}
function diagFindings(id,years){let out=[];
 for(const g of allClasses()){const f=volFinding(id,years,g);if(f)out.push(f);}
 for(const g of META.groups){const f=shapeFinding(id,years,g);if(f)out.push(f);}
 out=out.concat(lmpFindings(id,years));
 const sevRank={bad:0,ok:1,good:2};
 out.sort((a,b)=>sevRank[a.sev]-sevRank[b.sev]||b.score-a.score);
 return out;}
const CAT_HDR={vol:"Class tolerance — volume misses",shape:"Dispatch shape — hourly correlation",lmp:"LMP alignment"};
function diagnosticsHTML(id,years){const fs=diagFindings(id,years);
 let h='<div class=panel><h2>Diagnostics — where the misses likely come from</h2>'
  +'<p class=psub>Auto-generated from the same numbers as the charts above: each failing class is decomposed by month, zone and plant to point at the most likely source. Pointers, not verdicts — confirm in the Charts view before retuning.</p>';
 if(!fs.length)return h+'<p class=psub>No findings — every class is in tolerance, dispatch correlation is ≥ '+R_GOOD+' across classes, and LMP tracks the actuals. 🎉</p></div>';
 for(const cat of ["vol","shape","lmp"]){const fc=fs.filter(f=>f.cat===cat);if(!fc.length)continue;
  h+=`<div class=fcat>${CAT_HDR[cat]}</div>`;
  for(const f of fc)h+=`<div class=fnd><span class="sevdot sev-${f.sev}"></span><div><span class=fhd>${f.title}</span><span class=ftag>${f.tag}</span><br>${f.txt}</div></div>`;}
 return h+'</div>';}

function singleSeries(id,yr,grp,plant){const B=BENCH[yr],M=MODEL[id].years[yr];
 if(plant&&plant!=="agg"&&M.plants[plant]){const b=B.plants[plant],mp=M.plants[plant];
  return {mcf:dec(mp.m),ccf:dec(b.campd),npl:b.npl,name:b.name+" · "+b.zone,nodata:!!b.nodata,m_ann:mp.m_ann,c_ann:b.c_ann,e_ann:b.e_ann,r:mp.r,nr:mp.nrmse,cap:mp.cap,m_mon:mp.m_mon,c_mon:b.c_mon,e_mon:b.e_mon};}
 const a=aggMW(id,yr,grp);const ps=plantsOf(id,yr,grp);let npl=0;ps.forEach(c=>npl+=B.plants[c].npl);
 const mcf=new Float32Array(T),ccf=new Float32Array(T);for(let i=0;i<T;i++){mcf[i]=npl>0?100*a.mm[i]/npl:0;ccf[i]=npl>0?100*a.cc[i]/npl:0;}
 const m_mon=Array(12).fill(0),c_mon=Array(12).fill(0),e_mon=Array(12).fill(0);
 ps.forEach(c=>{M.plants[c].m_mon.forEach((v,i)=>m_mon[i]+=v);B.plants[c].c_mon.forEach((v,i)=>c_mon[i]+=v);B.plants[c].e_mon.forEach((v,i)=>e_mon[i]+=v);});
 const mt=classMetrics(id,yr,grp);return {mcf,ccf,npl,name:META.groupLabel[grp]+" (aggregate)",nodata:a.cA<=0,m_ann:a.mA,c_ann:a.cA,e_ann:a.eA,r:mt?+mt.r.toFixed(3):null,nr:mt?+mt.nr.toFixed(3):null,cap:mt?mt.m1:null,m_mon,c_mon,e_mon};}

 h+='<div class=panel><h2>Hours at each capacity factor</h2><p class=psub>Vertical markers are this plant\'s offer-curve tranche boundaries; the tag is the heat-rate multiplier priced from that CF up. Pick a single plant for markers.</p><div class=legend><span><i class=swatch style="border-top-color:#647184"></i>CAMPD</span><span><i class=swatch style="border-top-color:#4A90D9"></i>Model</span></div><div class=svgbox id=sHist></div></div>';

 document.getElementById("content").innerHTML=h;

 psel.innerHTML=`<option value=agg>Aggregate (${ps.length} plants)</option>`+ps.map(c=>`<option value=${c}>${BENCH[yr].plants[c].name} · ${BENCH[yr].plants[c].zone}${BENCH[yr].plants[c].nodata?" · no CAMPD":""}</option>`).join("");

 // No usable CAMPD hourly data: show the model alone, not a flat-zero "actual".

 const pc=profileArr(d.ccf),pm=profileArr(d.mcf),xl=Array(24).fill("");[0,6,12,18,23].forEach(hh=>xl[hh]=("0"+hh).slice(-2));
 const profSets=hasC?[{pts:pc,color:"#647184",name:"CAMPD",w:3},{pts:pm,color:"#4A90D9",name:"Model",dash:"4 3"}]:[{pts:pm,color:"#4A90D9",name:"Model",dash:"4 3"}];

 h+='<div class=panel><h2>Per-plant fit vs CAMPD / EIA-923 — '+yr+'</h2><div class=tablewrap><table><thead><tr><th>plant</th><th>class</th><th>zone</th><th>r</th><th>NRMSE</th><th>capture%</th><th>Δ923%</th></tr></thead><tbody>';

// ---- shell render ----
function render(){const id=st.run;if(!id){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Select a run.</p></div>';return;}
 ensureRuns([id]).then(()=>{
  if(!MODEL[id]){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Run data failed to load.</p></div>';return;}
  // year/class clamps when the run or ISO changed under the current selection
  const ys=runYears(id);if(ys.length&&!ys.includes(st.year))st.year=ys[0];
  if(!META.groups.includes(st.klass))st.klass=META.groups[0];
  syncTopbar();
  if(st.page==="report")renderReport();
  else if(st.page==="charts")renderCharts();
  else renderTables();
 }).catch(e=>{document.getElementById("diag").style.display="block";document.getElementById("diag").textContent="Load error: "+(e.message||e);});}
// Year + class controls only steer the per-year views; the report shows every
// year at once, so they hide there to keep the bar clean (zones stay — every
// zone-aware metric honors them on all pages).
function syncTopbar(){
 document.getElementById("ctlYear").style.display=st.page==="report"?"none":"";
 document.getElementById("ctlClass").style.display=st.page==="charts"?"":"none";
 const ys=st.run?runYears(st.run):[];
 const ysel=document.getElementById("yearSel");
 ysel.innerHTML=ys.map(y=>`<button data-y=${y} class=${y===st.year?"on":""}>${y}</button>`).join("");}
function isoRuns(){return BC.manifest.filter(m=>(m.iso||"ERCOT")===st.iso);}
// Newest first (run id starts with the bundle date, so lexicographic works);
// the newest run is also the default selection.
function isoRunsNewest(){return isoRuns().slice().sort((a,b)=>b.id.localeCompare(a.id));}
function buildRunList(){
 const list=document.getElementById("runList");
 list.innerHTML=isoRunsNewest().map(m=>`<label class="runopt ${st.run===m.id?'on':''}">
  <input type=radio name=run value="${m.id}" ${st.run===m.id?"checked":""}>
  <span class=rlab>${m.label}</span> <span class=rid data-rid="${m.id}">${m.shorthand}</span></label>`).join("");
 list.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
  st.run=inp.value;st.plant="agg";
  list.querySelectorAll(".runopt").forEach(o=>o.classList.toggle("on",o.querySelector("input").value===st.run));

 wireTips(list);}
function build(){
 document.getElementById("pageSel").onclick=e=>{const p=e.target.dataset.p;if(!p)return;st.page=p;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.p===p));render();};
 const ysel=document.getElementById("yearSel");
 ysel.onclick=e=>{if(!e.target.dataset.y)return;st.year=+e.target.dataset.y;[...ysel.children].forEach(b=>b.classList.toggle("on",+b.dataset.y===st.year));render();};
 const csel=document.getElementById("classSel");csel.innerHTML=META.groups.map(g=>`<option value="${g}">${META.groupLabel[g]}</option>`).join("");
 csel.value=st.klass;csel.onchange=()=>{st.klass=csel.value;st.plant="agg";render();};
 const zsel=document.getElementById("zoneSel");zsel.innerHTML=`<span class="chip on" data-z=__all>All</span>`+META.zones.map(z=>`<span class="chip on" data-z="${z}">${z}</span>`).join("");
 zsel.onclick=e=>{const z=e.target.dataset.z;if(!z)return;
  if(z==="__all")st.zones=new Set(META.zones);else{if(st.zones.has(z))st.zones.delete(z);else st.zones.add(z);if(!st.zones.size)st.zones=new Set(META.zones);}
  [...zsel.children].forEach(c=>{const zz=c.dataset.z;c.classList.toggle("on",zz==="__all"?st.zones.size===META.zones.length:st.zones.has(zz));});
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);render();};
 buildRunList();render();}
// Header badge + subtitle + sidebar hint, recolored to the active market so the
// user always knows which ISO the page is showing and what else is available.
function updateIsoChrome(iso){
  const badge=document.getElementById("isoBadge");
  badge.style.setProperty("--c",isoColorVar(iso));
  badge.innerHTML=`<span class=dot></span>${iso}`;
  const n=isoRunCount(iso),sub=document.getElementById("pageSub");
  if(SUB_BASE!=null)sub.textContent=`${iso} · ${n} run${n===1?"":"s"} · ${SUB_BASE}`;
  const others=Object.keys(window.BC.meta).filter(x=>x!==iso);
  document.getElementById("isoHint").textContent=others.length
    ?("Switch market — also loaded: "+others.join(", ")):"Only this market is loaded.";
}
async function selectIso(iso){
  st.iso=iso;
  META=window.BC.meta[iso];
  BENCH=await inflate(window.BC.benchGz[iso]);
  const first=isoRunsNewest()[0];
  st.run=first?first.id:null;
  st.year=META.years[0];st.zones=new Set(META.zones);
  st.klass=META.groups[0];st.plant="agg";
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);
  Object.keys(_eAllC).forEach(k=>delete _eAllC[k]);
  Object.keys(_mAllC).forEach(k=>delete _mAllC[k]);
  [...document.getElementById("isoSel").children].forEach(b=>b.classList.toggle("on",b.dataset.iso===iso));
  updateIsoChrome(iso);
  build();
}
async function boot(){try{
  const isos=Object.keys(window.BC.meta);
  const isoSel=document.getElementById("isoSel");
  isoSel.innerHTML=isos.map(i=>{const n=isoRunCount(i);
    return `<button class=isobtn data-iso="${i}" style="--c:${isoColorVar(i)}">`
      +`<span class=dot></span><span class=iname>${i}</span>`
      +`<span class=icount>${n} run${n===1?"":"s"}</span></button>`;}).join("");
  isoSel.onclick=e=>{const b=e.target.closest(".isobtn");if(b&&b.dataset.iso!==st.iso)selectIso(b.dataset.iso);};
  st={run:null,year:0,zones:new Set(),page:"report",klass:"",plant:"agg",iso:null};
  SUB_BASE=document.getElementById("pageSub").textContent;
  document.getElementById("diag").style.display="none";
  await selectIso(isos.includes("ERCOT")?"ERCOT":isos[0]);
 }catch(e){const d=document.getElementById("diag");d.style.display="block";d.style.color="#c01c28";d.textContent="Init error: "+((e&&e.message)||e)+" "+((e&&e.stack)||"");}}
boot();
