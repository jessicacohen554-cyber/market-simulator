shape-full", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "(PROBE \u2014 REJECTED) neiso-40 = neiso-39 keeper recipe + neiso_oil_burn_budget flag ON: adds an inventory-limited monthly oil-burn LP constraint (one row per oil-primary generator \u00d7 month, upper bound = EIA-923 Schedule 5 petroleum receipts converted to MWh). Goal: produce >$300 scarcity-tail hours (C3c) by endogenously pricing marginal oil MWh when the monthly budget binds in cold-snap months. NULL FINDING: F923 petroleum receipt coverage is too sparse to support the constraint \u2014 only 1-2 NEISO plants report petroleum receipts (out of 140 oil-primary generators / 5345 MW), and in 2025 only 2/12 months have any deliveries. A sparsity guard (requires \u22656 months with deliveries AND \u22655% of fleet reporting) correctly skips the constraint in all 3 years, producing a solve identical to neiso-39. The fundamental issue: F923 receipts measure fuel deliveries to tank, not inventory available to burn \u2014 zero receipts in a month doesn't mean zero oil available (plants burn from stored inventory). Dual-fuel gas units (6831 MW) are excluded from the constraint because their oil consumption isn't captured in F923 petroleum receipts (they report as gas plants). The C3c scarcity tail requires a different mechanism \u2014 likely a forward-derivable winter fuel-inventory or delivery-logistics constraint, not monthly F923 receipts.", "file": "frontend/data/backcast/runs/2026-06-29-neiso-40-oil-budget.js", "id": "2026-06-29-neiso-40-oil-budget", "iso": "NEISO", "label": "neiso 40 oil budget", "shorthand": "neiso-40-oil-budget", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "(PROBE \u2014 not promoted; keeper stays pjm 58 seam-border) pjm 64 offercurve: pjm 63 config + ONE lever, CT_PEAKER peak 3.0->5.0 (above pjm 61's 4.0). Keeps the pjm 63 CC_REGULAR body gain (econ_high 1.38->1.60, peak 5.0->6.0) and the lower CT_PEAKER committed/econ_low/econ_high (1.10/0.95/1.20), but raises the peaker duct-firing scarcity ceiling so it clears the lifted CC upper econ ramp \u2014 letting the marginal CC set the top-tail clearing price instead of being capped by a low peaker ceiling. RESULT: lifted ONLY the 2024 max (57.57->63.03, +5.46); 2023 (56.46) and 2025 (76.83) max and ALL years' body (avg 26.87/25.38/35.59, p50/p90) unchanged to the cent \u2014 confirms the peak tranche is the binding ceiling only in 2024 and is a rarely-reached scarcity band that never moves the body. Model max ~$56-77 vs PJM actual hundreds: the top-tail miss is structurally NOT offer-curve-reachable on this energy-only LP (matches the reserve-track conclusion). Offer-curve tuning (CLAUDE.md #1 second step), not a residual adder. Energy-only, no co-opt (pjm 62 cleared reserve $0), no P2.", "file": "frontend/data/backcast/runs/2026-06-29-pjm-64-offercurve.js", "id": "2026-06-29-pjm-64-offercurve", "iso": "PJM", "label": "pjm 64 offercurve", "shorthand": "pjm-64-offercurve", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "ERCOT reliability-floor rebuild: keeper config (run157) + per-(zone,class) full-day day-gate reliability floor", "file": "frontend/data/backcast/runs/2026-06-30-20-relfloor-rebuild.js", "id": "2026-06-30-20-relfloor-rebuild", "iso": "ERCOT", "label": "20 relfloor rebuild", "shorthand": "20-relfloor-rebuild", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "ercot 21 cc-coal-rebalance: run157 base + reliability_floor, CC_REGULAR econ_high delta 0.0, peak delta +0.18, PRB sigmoid floor 0.74", "file": "frontend/data/backcast/runs/2026-06-30-21-cc-coal-rebalance.js", "id": "2026-06-30-21-cc-coal-rebalance", "iso": "ERCOT", "label": "21 cc coal rebalance", "shorthand": "21-cc-coal-rebalance", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "From the run157-dam-as-overlay keeper, adds reliability_floor and moderates three offer-curve deltas that caused a 2023 LMP collapse in ercot 21 ($28.57 model vs $48.36 actual at $2.54/MWh gas): CC_REGULAR econ_high delta set to -0.10 (halfway between keeper -0.20 and ercot 21 0.0), peak delta +0.25 (between keeper +0.32 and ercot 21 +0.18), and PRB sigmoid floor 0.76 (between keeper 0.78 and ercot 21 0.74). These are offer-curve shape parameters \u2014 no adder or haircut fitted to the price residual, all levers have forward analogues. Determination: NOT-YET (C1 ST_GAS 2024 fuel-mix, C2 gas 2025 system volume, and C3b price shape 2023\u20132024 remain out of band; C3a 2024 mean LMP +8.4% accepted as measured-input limitation per the attestation).", "file": "frontend/data/backcast/runs/2026-06-30-22-cc-coal-rebalance.js", "id": "2026-06-30-22-cc-coal-rebalance", "iso": "ERCOT", "label": "22 cc coal rebalance", "shorthand": "22-cc-coal-rebalance", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "ercot 23 stgas-drag-v1: ercot 22 base + gas_st_netload_drag=True (slope 0.00906, intercept -0.1376, cap 0.34)", "file": "frontend/data/backcast/runs/2026-06-30-23-stgas-drag-v1.js", "id": "2026-06-30-23-stgas-drag-v1", "iso": "ERCOT", "label": "23 stgas drag v1", "shorthand": "23-stgas-drag-v1", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "ercot 24 ct-drag-v1: ercot 23 base + ct_netload_drag=True (slope 0.00703, intercept -0.1427, cap 0.47, ramp 15-22h) + CC_REGULAR econ_high delta -0.13 (was -0.10)", "file": "frontend/data/backcast/runs/2026-06-30-24-ct-drag-v1.js", "id": "2026-06-30-24-ct-drag-v1", "iso": "ERCOT", "label": "24 ct drag v1", "shorthand": "24-ct-drag-v1", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "CAISO reliability-floor rebuild: per-(zone,class) day-gate + net-load CT", "file": "frontend/data/backcast/runs/2026-06-30-caiso-41-relfloor-rebuild.js", "id": "2026-06-30-caiso-41-relfloor-rebuild", "iso": "CAISO", "label": "caiso 41 relfloor rebuild", "shorthand": "caiso-41-relfloor-rebuild", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "MISO reliability-floor rebuild: per-(zone,class) full-day day-gate (all miso23 levers retained)", "file": "frontend/data/backcast/runs/2026-06-30-miso-28-relfloor-rebuild.js", "id": "2026-06-30-miso-28-relfloor-rebuild", "iso": "MISO", "label": "miso 28 relfloor rebuild", "shorthand": "miso-28-relfloor-rebuild", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "MISO 29: fixes 3+4 + fix 1 (miso_zonal_gas_basis) + fix 2 (cc_nameplate_summer_derate)", "file": "frontend/data/backcast/runs/2026-06-30-miso-29-zonal-gas.js", "id": "2026-06-30-miso-29-zonal-gas", "iso": "MISO", "label": "miso 29 zonal gas", "shorthand": "miso-29-zonal-gas", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "MISO 30: coal sigmoid tuning (PRB sigmoid + BIT retune) + all run-29 flags restored", "file": "frontend/data/backcast/runs/2026-06-30-miso-30-cc-coal.js", "id": "2026-06-30-miso-30-cc-coal", "iso": "MISO", "label": "miso 30 cc coal", "shorthand": "miso-30-cc-coal", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "neiso-41 = the neiso-39 keeper recipe re-solved with the rebuilt generic reliability-floor engine (RELIABILITY_FLOOR_REGISTRY) replacing the legacy per-ISO injector, with 3 enabled limbs: Boston CT_PEAKER hot, Central CC_REGULAR hot, Connecticut CT_PEAKER hot (full-day day-gate, no hour-of-day windows). Monthly LMP MAE is essentially unchanged vs keeper 39: 2023 $3.78->$3.77, 2024 $4.39->$4.41, 2025 $3.90->$3.90. Determination NOT-YET: the governance gate is unattested \u2014 no calibration_attestation.json is present in the bundle \u2014 so metrics are not the blocker.", "file": "frontend/data/backcast/runs/2026-06-30-neiso-41-relfloor-rebuild.js", "id": "2026-06-30-neiso-41-relfloor-rebuild", "iso": "NEISO", "label": "neiso 41 relfloor rebuild", "shorthand": "neiso-41-relfloor-rebuild", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "NYISO reliability-floor rebuild (re-solve: floor enabled)", "file": "frontend/data/backcast/runs/2026-06-30-nyiso-36-relfloor-rebuild.js", "id": "2026-06-30-nyiso-36-relfloor-rebuild", "iso": "NYISO", "label": "nyiso 36 relfloor rebuild", "shorthand": "nyiso-36-relfloor-rebuild", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "PJM reliability-floor rebuild: per-(zone,class) full-day day-gate. Builds on pjm 58 (seam border keeper) with the new generic registry-driven temperature reliability floor enabled. All (zone,class) limbs with enabled=True in reliability_floor_coeffs_PJM.csv are applied: CC_REGULAR, CT_PEAKER, CT_CHP, ST_GAS, COAL hot/cold per zone. Full-day step-gate (no HB windows), physically-grounded commit_frac x min_stable_pct floors. All other levers pjm 58 verbatim.", "file": "frontend/data/backcast/runs/2026-06-30-pjm-65-relfloor-rebuild.js", "id": "2026-06-30-pjm-65-relfloor-rebuild", "iso": "PJM", "label": "pjm 65 relfloor rebuild", "shorthand": "pjm-65-relfloor-rebuild", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "pjm 66 CC/CT calibration: two coupled levers for the C1 CC over-run / CT under-run. (1) CC_REGULAR committed 0.75\u21920.87 (Manual 15 SRMC floor, Rank 3 from pjm-cc-overgen-recommendation; ERCOT keeper 0.998). (2) CT_PEAKER dispatch fix from pjm-59/61 (committed 0.8784\u21921.25, econ_low 0.8792\u21921.05) so CTs clear as peakers not baseload \u2014 the pjm-58 keeper predates this structural correction. Also: CC econ_high 1.38\u21921.50 (steepen upper ramp for miss #2), ct_intermediate_split (threshold=30%), CC peak 5.0, cc_duct_peaking_cap_pct 18%, offer_curve_smoothing_mid=0.35 (pjm-61). All coal/hydro/congestion/seam-border levers pjm-58 verbatim. Energy-only, no P2 commitment.", "file": "frontend/data/backcast/runs/2026-06-30-pjm-66-cc-ct.js", "id": "2026-06-30-pjm-66-cc-ct", "iso": "PJM", "label": "pjm 66 cc ct", "shorthand": "pjm-66-cc-ct", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "pjm 67 reliability-floor + CC/CT calibration: merges pjm-65 (reliability_floor=True, per-(zone,class) temp-gated floors) with CC/CT offer-curve rebalance. CC_REGULAR committed 0.87\u21920.95 (Manual 15 SRMC, fix 2024 cheap-gas overrun), econ_low_share 0.50\u21920.55. CT split: 8 true peakers (committed 1.10, pct_peaking 20) + 62 intermediate CTs (committed 0.90, econ_low 0.92, pct_peaking 5) via ct_intermediate_split threshold=30%. CC econ_high 1.50, peak 5.0, cc_duct_peaking_cap_pct 18%, smoothing_mid 0.35. All coal/hydro/congestion/seam-border levers pjm-58 verbatim.", "file": "frontend/data/backcast/runs/2026-06-30-pjm-67-relfloor-ccct.js", "id": "2026-06-30-pjm-67-relfloor-ccct", "iso": "PJM", "label": "pjm 67 relfloor ccct", "shorthand": "pjm-67-relfloor-ccct", "years": [2023, 2024, 2025]}, {"date": "2026-06-30", "definition": "pjm 68 hydro backfill + interchange balance: layers on pjm-67 (reliability floor + CC/CT calibration). Hydro 2025 backfill: hydro_backfill_year=2024 restores 62 non-reporting EIA-923 hydro plants from 2024, EIA-930 monthly repin corrects budget level. BTM backfill: btm_backfill_year=2024 carries 2024 class totals for plants absent from the 2025 EIA-923 early release. All offer curves / coal / congestion / seam levers pjm-67 verbatim.", "file": "frontend/data/backcast/runs/2026-06-30-pjm-68-hydro-backfill.js", "id": "2026-06-30-pjm-68-hydro-backfill", "iso": "PJM", "label": "pjm 68 hydro backfill", "shorthand": "pjm-68-hydro-backfill", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "Re-registration of the ercot_ct_drag_v1 bundle (same solve as 2026-06-30-24-ct-drag-v1: ercot 23 base + ct_netload_drag=True, slope 0.00703/intercept -0.1427/cap 0.47/ramp 15-22h LST, + CC_REGULAR econ_high delta -0.13) with an updated dashboard payload after fixing scripts/render_calibration_html.py's ERCOT guard, which previously hard-excluded ERCOT from the C3c fallback tail-hour computation; C3c now falls back to model_price_by_zone when no ORDC overlay file exists for the year, so 2025 price-tail scores instead of SKIPPED (model 6h vs actual 31h > $200, ratio 0.19x). This surfaces a CAVEAT that was previously hidden, pushing the soft-caveat count to budget. Determination: NOT-YET (caveat budget exceeded: hard 2/1, soft 3/3) \u2014 hard caveats are C1 fuel-mix CC_REGULAR/CC_CHP classification split (2023/2024) and C2 gas system volume 2025 (-3.2%, EIA-923 preliminary vintage gap); soft caveats are C3b price-shape (2023/2024) and the newly-scored C3c price-tail (2025). All caveats are pre-existing, attested measured-input limitations, not new regressions.", "file": "frontend/data/backcast/runs/2026-07-01-24-ct-drag-v1.js", "id": "2026-07-01-24-ct-drag-v1", "iso": "ERCOT", "label": "24 ct drag v1", "shorthand": "24-ct-drag-v1", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "Adds corridor ATC forward envelope (PNW 0.43 / DSW 0.56 base fractions from measured p95 deliverability) and EIA-930 monthly hydro budget (fixes 2025 hydro gap 12\u219220 TWh). Carries all caiso-41 structural mechanisms: RA must-offer (min_load_frac 0.26), negative renewable offers, endogenous solar spill, CT net-load drag, gas hub basis overlay, reliability floor.", "file": "frontend/data/backcast/runs/2026-07-01-caiso-42-atc-hydro.js", "id": "2026-07-01-caiso-42-atc-hydro", "iso": "CAISO", "label": "caiso 42 atc hydro", "shorthand": "caiso-42-atc-hydro", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "Calibration run from bundle caiso43_gasfloor_probe.", "file": "frontend/data/backcast/runs/2026-07-01-caiso-43-gasfloor-probe.js", "id": "2026-07-01-caiso-43-gasfloor-probe", "iso": "CAISO", "label": "caiso 43 gasfloor probe", "shorthand": "caiso-43-gasfloor-probe", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "(PROBE) Startup-cost-aware CAISO RA must-offer bridge: also holds a committed CC/CT at min-load across a midday gap LONGER than min-down when cycling is uneconomic (startup_per_mw > (MC-LMP)*min_load_frac*gap_hours; MC/LMP forward-derivable, no measured pin). Also fixes the RA bridge, which was inert on the binned CAISO fleet (tranches carry min_down=0). Mechanism works \u2014 holds +590 MW more spring-midday gas (2024), displaces imports, and makes 2024 negative prices appear (LMP min +23.2->-20.0) with monthly LMP toward actuals. Not promoted: annual gas inflates slightly (+0.3-0.8 TWh) on an already-over baseline, so the mix-vs-EIA-923 + no-inflation gate is not cleared. Keeper caiso-42 stands.", "file": "frontend/data/backcast/runs/2026-07-01-caiso-44-startup-bridge.js", "id": "2026-07-01-caiso-44-startup-bridge", "iso": "CAISO", "label": "caiso 44 startup bridge", "shorthand": "caiso-44-startup-bridge", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "CAISO 45: startup bridge + bidir-intertie export sink (fix caiso-44 gas padding). Combines caiso-42 keeper (corridor ATC forward + EIA-930 hydro) with the caiso-44 startup-cost-aware RA bridge, plus caiso_bidir_intertie (export cap 3,500 MW from measured EIA-930 peak). The export leg lets the LP reverse the tie midday so surplus (committed gas at min-load + solar) displaces imports / sets sub-SRMC (negative) clearing prices instead of padding annual gas past EIA-923.", "file": "frontend/data/backcast/runs/2026-07-01-caiso-45-export-sink.js", "id": "2026-07-01-caiso-45-export-sink", "iso": "CAISO", "label": "caiso 45 export sink", "shorthand": "caiso-45-export-sink", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "(PROBE) capdel A/B vs keeper caiso-42: byte-faithful replay of the keeper meta.json + capacity_deliverability_limits=True as the single delta. Part A live: the calibrated 7,500 MW WECC_import simultaneous-import cap is replaced by the published branch-group MIC sum crosswalked to the WECC_import seam (16,055 / 16,452 / 16,148 MW for 2023/24/25). ATTRIBUTION vs the same-code flag-off baseline (caiso 47 capdel-arm-a): 2023-only effect \u2014 the old cap is a hard ceiling (binds 744 h, p95 = max = 7,500); released, imports peak 11.2 GW (+0.69 TWh), CAISO-zone mean LMP 65.16 -> 64.73, and the model's entire 107-hour >$200 tail collapses to 0 h (actual 21 h): the calibrated cap, not physics, generated the 2023 scarcity tail \u2014 right tail-hour count in the keeper era came from an over-tight fitted scalar (rule #1: not a real mechanism). 2024/25 strict price no-op (max |dLMP| = 0.0; import tranches bind at 4.3-6.1 GW before either cap). Neither representation matches 2023 actuals (107 h = 5.1x vs 0 h = 0x of 21 h): the published MIC sum is never approached (slack >= 4.9 GW every hour) because summed per-branch-group MICs overstate simultaneous capability (parallel WECC paths; rule #12 boundary caveat) \u2014 the true binding representation lies between the tranche build and the MIC arithmetic sum. Never a keeper; flag stays default-off.", "file": "frontend/data/backcast/runs/2026-07-01-caiso-46-capdel-probe.js", "id": "2026-07-01-caiso-46-capdel-probe", "iso": "CAISO", "label": "caiso 46 capdel probe", "shorthand": "caiso-46-capdel-probe", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "(PROBE baseline, arm A) Byte-faithful flag-OFF replay of keeper caiso-42 meta.json on current main \u2014 the drift-isolation baseline for caiso 46 capdel-probe. Same-code A/B result: the calibrated 7,500 MW cap is a hard ceiling in 2023 (p95 = max = 7,500; binds 744 h) and generates the model's ENTIRE 107-hour >$200 tail (actual 21 h) \u2014 identical to the registered keeper, so the caiso 46 tail collapse (107h -> 0h) is 100% the MIC seam-cap release, 0% main drift. 2024/25: prices byte-identical between arms (max |dLMP| = 0.0; import tranches bind at 4.3-6.1 GW before either cap), only cost-degenerate dispatch reshuffles. CAISO-zone mean LMP 2023: 65.16 (off) vs 64.73 (on). REPRODUCED independently at ef69fc1 (fresh container, full re-solve): the registered run payload regenerated byte-identical, dashboard payload deep-equal to keeper caiso-42 for all 3 years, with the 107 h tail, 744 h cap-binding and 4,312 / 6,076 MW 2024/25 import maxima confirmed exactly. Not a keeper.", "file": "frontend/data/backcast/runs/2026-07-01-caiso-47-capdel-arm.js", "id": "2026-07-01-caiso-47-capdel-arm", "iso": "CAISO", "label": "caiso 47 capdel-arm-a", "shorthand": "caiso-47-capdel-arm", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "MISO 31: coal sigmoid retune \u2014 ceil<=1.0 for BIT/PRB/PRB_follower (coal cost doesnt follow gas; markup at dear gas was backwards)", "file": "frontend/data/backcast/runs/2026-07-01-miso-31-coal-sigmoid.js", "id": "2026-07-01-miso-31-coal-sigmoid", "iso": "MISO", "label": "miso 31 coal sigmoid", "shorthand": "miso-31-coal-sigmoid", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "CT_PEAKER committed 1.55->1.15 + COAL_BIT sigmoid ceil 0.95->0.97 on miso23 keeper. Confirmed CT under-dispatch is structural (gmModel moved <0.2 TWh/year). C2 2025 gas improved -11.6%->-1.9% (PASS). NOT-YET: C1 CC/CT/ST substitution + C2 2025 coal +10.1% are model misses requiring reserve-demand co-opt + zonal granularity.", "file": "frontend/data/backcast/runs/2026-07-01-miso-33-ct-committed.js", "id": "2026-07-01-miso-33-ct-committed", "iso": "MISO", "label": "miso 33 ct committed", "shorthand": "miso-33-ct-committed", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "MISO 34 (PROBE, not keeper): energy+reserve co-opt ON (RBDC = MSSC + 400 MW regulating, $3500/MWh VOLL max penalty \u2014 MISO's real operating-reserve design). Reserve demand is NON-BINDING at 3-zone granularity: the ~1.7 GW market-wide requirement is trivially met by aggregate headroom, so it never forces commitment. CT_PEAKER stays inert (1.8/3.1/4.0 TWh, no forcing), ST_GAS flat (11.1/12.1/11.8), scarcity tail unchanged 0 h (max $61/$60/$73 vs actual 30/37/88 h). Price LEVEL lifted +2/+3/+4 $/MWh (legitimate reserve opportunity cost; C3a -14/-17% -> ~-8%), but coal 2025 REGRESSED to +18.7% (was +10.5% in miso-31) because reserve headroom pulled off gas is backfilled by coal. Diagnosis: the intended CT/ST-forcing + tail-lift needs sub-regional/zonal reserve zones with deliverability limits, NOT a market-wide curve at 3-zone copperplate and NOT a CC offer haircut. Next workstream: finer reserve-zone granularity.", "file": "frontend/data/backcast/runs/2026-07-01-miso-34-reserve-coopt.js", "id": "2026-07-01-miso-34-reserve-coopt", "iso": "MISO", "label": "miso 34 reserve coopt", "shorthand": "miso-34-reserve-coopt", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "NEISO run 42: cap CT_PEAKER peak 13.15\u21924.0 (ISO-NE offer cap, not ERCOT ORDC) and lower committed 1.55\u21921.35 (NYISO/CAISO-grounded start hurdle)", "file": "frontend/data/backcast/runs/2026-07-01-neiso-42-ct-peak.js", "id": "2026-07-01-neiso-42-ct-peak", "iso": "NEISO", "label": "neiso 42 ct peak", "shorthand": "neiso-42-ct-peak", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "neiso-43 closes NEISO: the neiso-41 keeper recipe (rebuilt generic reliability-floor engine, gas-hub-basis-daily overlay, EIA-930 hydro budget) plus a post-solve ORDC scarcity-price overlay with ISO-NE-grounded parameters (VOLL $2000 = Tariff III.1.10.1A offer cap, MCL 1200 MW = Millstone 3 largest contingency, sigma 900 MW = ISO-NE PAF Study 2022); the overlay adds a reserve-shortage adder to econ_prices for capacity economics but leaves dispatch/LP prices unchanged. Determination NOT-YET: caveat budget exceeded (hard 2/1, soft 3/3) \u2014 the hard caveats (C1 CC_REGULAR volume, C2 2025 gas +2.8%) both trace to the same EIA-930 gas-cell geothermal/biomass fold-in categorization, not a dispatch error, and the soft caveats (C3c price tail, C5b/C5c storage) trace to the LP's oil-parity cap on cold-hour prices, which the overlay prices for capacity value but does not lift out of the persisted LP prices that drive C3c/C5b/C5c; C6 governance passes.", "file": "frontend/data/backcast/runs/2026-07-01-neiso-43-closeout.js", "id": "2026-07-01-neiso-43-closeout", "iso": "NEISO", "label": "neiso 43 closeout", "shorthand": "neiso-43-closeout", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "Calibration run from bundle nyiso_unified_downstate.", "file": "frontend/data/backcast/runs/2026-07-01-nyiso-37-unified-downstate.js", "id": "2026-07-01-nyiso-37-unified-downstate", "iso": "NYISO", "label": "nyiso 37 unified downstate", "shorthand": "nyiso-37-unified-downstate", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "pjm 69 \u2014 PJM keeper (supersedes pjm-67). LIVE DELTA vs pjm-67 is the CC/CT offer-curve rebalance: CC_REGULAR committed 0.95->1.00 (shift CC rightward), CT_PEAKER committed 1.10->1.05 (let CTs compete earlier), targeting the 2024 CC_REGULAR overshoot / CT_PEAKER undershoot. pjm-69 CC_REGULAR/CT_PEAKER: 2024 331.4/17.0 TWh, 2025 321.6/29.7 TWh. SEAM CAPS INERT: pjm_seam_flow_limit + pjm_seam_export_limit are enabled but DO NOT BIND \u2014 2025 net export stayed +38.2 TWh vs actual +18.0 (target 18-22 unmet), interchange/prices ~unchanged from pjm-68. Root cause: the per-seam (month x hod) p90 export envelope, summed across the 5 neighbors, reconstitutes ~14.9 GW avg (~full 16.3 GW TTC) vs 2.1 GW actual net export, so frac~=1 and the export min_gen floor never binds (shared border zones AEP_Ohio / Dominion further inflate the sum). A per-seam marginal-p90 cap cannot bound PJM joint net position; the aggregate simultaneous-transfer-limit fix is deferred to pjm-70. All other settings pjm-68 verbatim.", "file": "frontend/data/backcast/runs/2026-07-01-pjm-69-interchange-caps.js", "id": "2026-07-01-pjm-69-interchange-caps", "iso": "PJM", "label": "pjm 69 cc/ct rebalance", "shorthand": "pjm-69-interchange-caps", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "PJM reserve-demand co-opt (unwind CC-over/CT-under + lift scarcity tail): layers energy+reserve co-optimization onto pjm-69 verbatim. energy_reserve_coopt=True turns on the co-optimized reserve balance row (measured PJM_RTO Primary requirement + published two-step ORDC $850/$300, Manual 11 sec 4.3.3 / FERC EL19-58). pjm_reserve_supply_cap=True caps cleared reserve at the fleet's physical 10-min deliverable ramp so the ORDC step can bind instead of drawing on idle full-fleet headroom (grounded capability, not a residual fit). Targets: lift C3c scarcity tail (0->6/18/59 actual) and unwind the CC-over/CT-under merit-order inversion by forcing reserve-eligible CCs to hold deliverable headroom. All other pjm-69 settings verbatim.", "file": "frontend/data/backcast/runs/2026-07-01-pjm-70-reserve-coopt.js", "id": "2026-07-01-pjm-70-reserve-coopt", "iso": "PJM", "label": "pjm 70 reserve coopt", "shorthand": "pjm-70-reserve-coopt", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "PJM 71 coal-bit-floor 0.65 (bracket bisect): floor=0.75 overshot (COAL_BIT -8/-13 TWh under). Bisecting the 0.55-0.75 bracket at 0.65 to find the floor that best splits C1-coal-volume and C3a-price. Sigmoid: floor=0.65, ceil=1.32, gas_mid=3.40, gas_slope=2.5. All other settings pjm-70 verbatim (reserve co-opt ON).", "file": "frontend/data/backcast/runs/2026-07-01-pjm-71-coal-bit.js", "id": "2026-07-01-pjm-71-coal-bit", "iso": "PJM", "label": "pjm 71 coal bit", "shorthand": "pjm-71-coal-bit", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "(PROBE) capdel A/B vs pjm-69 (the PJM keeper at probe time; since superseded by pjm 71 coal-bit): byte-faithful replay of the keeper meta.json + capacity_deliverability_limits=True as the single delta. CONFIRMED structural no-op in the PJM backcast: the Part A seam hook never fired (CETO/CETL are internal LDA limits \u2014 no seam import_limit resolves to PJM_external) and Part B gates only evolve_fleet, which the backcast never calls (fleet dispatched as observed). Residual deltas vs the REGISTERED keeper (e.g. 2023 CC_REGULAR -5.7 TWh, 2024 LMP -10.3% vs -10.1%) are main-branch code/data drift since the keeper solved at 4437acd, not the flag \u2014 the flag-off arm-A replay on current main (pjm 73 capdel-arm-a) reproduces this run byte-for-byte (max |dMW| = max |dLMP| = 0.0 over all ~24.9M dispatch rows, all 3 years). Forecast-facing Part B root-cause note: the curated PJM 'requirement' is the LDA CETO and 'import_limit' the CETL, so headroom = (in-zone firm + CETL) - CETO screens EVERY filed LDA long (+10 to +42 GW, 2026/27) by construction \u2014 the gate degenerates to a PJM-wide capacity-payment collapse (except unfiled West_APS), while PJM's real adequacy test is CETL >= CETO (tight for SWMAAC at 1.02x). The mechanism direction is right; the CETO-as-requirement semantic is misaligned to our zone-total headroom frame. Never a keeper; flag stays default-off.", "file": "frontend/data/backcast/runs/2026-07-01-pjm-72-capdel-probe.js", "id": "2026-07-01-pjm-72-capdel-probe", "iso": "PJM", "label": "pjm 72 capdel-probe", "shorthand": "pjm-72-capdel-probe", "years": [2023, 2024, 2025]}, {"date": "2026-07-01", "definition": "(PROBE baseline, arm A) Byte-faithful flag-OFF replay of keeper pjm-69 meta.json on current main \u2014 the drift-isolation baseline for pjm 72 capdel-probe. Result: byte-identical to pjm 72 (max |dMW| = max |dLMP| = 0.0, all 3 years), proving capacity_deliverability_limits is a strict no-op in the PJM backcast; the residual deltas both runs share vs the registered pjm-69 keeper (2023 CC_REGULAR -5.7 TWh, 2024 LMP -10.3% vs -10.1%, storage discharge 4.70 vs 4.92 TWh) are main-branch code/data drift accumulated since pjm-69 solved at 4437acd. REPRODUCED independently at ef69fc1 (fresh container, full re-solve of both arms): the registered run payload regenerated byte-identical, and the same-sha flag-on/flag-off byte-diff re-verified at 0.0 across all 74,679,000 dispatch rows and 236,520 system rows \u2014 no further PJM drift f8b5dae through ef69fc1. Not a keeper.", "file": "frontend/data/backcast/runs/2026-07-01-pjm-73-capdel-arm.js", "id": "2026-07-01-pjm-73-capdel-arm", "iso": "PJM", "label": "pjm 73 capdel-arm-a", "shorthand": "pjm-73-capdel-arm", "years": [2023, 2024, 2025]}, {"date": "2026-07-02", "definition": "(PROBE \u2014 not promoted; caiso-42 keeper stands) caiso 48 solar-decommit bridge: caiso-45 (startup bridge + bidir-intertie export sink) plus the caiso_ra_bridge_decommit control \u2014 (1) economic bridges bounded to the 24-h day-ahead commitment horizon (CAISO IFM/RUC commit one operating day; multi-day idles are next-day decommit/re-offer decisions), and (2) gap hours where the candidate min-load floors exceed the P1 import-dispatch + export-sink absorption reprice to the curtailable-renewable keep-running offer, with uneconomic bridges decommitted cheapest-startup-first (RUC order). UC physics only; nothing fitted to a residual. KEY FINDING: refutes the caiso-45 open item \u2014 the bridge adds only +0.58/-0.88/+0.14 TWh of annual gas (P2\u2212P1, 2023/24/25); the '2025 +34.4% over EIA-923' guardrail trip was the P1 BASELINE against the raw preliminary 2025 vintage (55.2 TWh, ~71% reporting); on the repaired C2 basis 2025 gas is +7.9% (improved from caiso-42's +12.3%, still a HARD FAIL). Negatives/curtailment now appear (25/148/32 negative-price hours; 2024's 148 exist already at P1 via the export sink + negative offers). NOT promoted: C1 2024 CC_REGULAR widened to +11.10 TWh (caiso-42 +9.21) \u2014 the bidir baseline raises CC infra-marginality \u2014 and 2023 >$200 tail grew to 161h vs 21h (the WECC_import 7.5 GW simultaneous-cap thread). Next levers: P1 merit order (import tranche prices / CC offers), reconciled WECC seam limit (rule #12).", "file": "frontend/data/backcast/runs/2026-07-02-caiso-48-solar-decommit.js", "id": "2026-07-02-caiso-48-solar-decommit", "iso": "CAISO", "label": "caiso 48 solar-decommit bridge", "shorthand": "caiso-48-solar-decommit", "years": [2023, 2024, 2025]}, {"date": "2026-07-02", " function dec(b){const s=atob(b),a=new Float32Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function pearson(m,o){let mm=0,oo=0,n=m.length;for(let i=0;i<n;i++){mm+=m[i];oo+=o[i];}mm/=n;oo/=n;let a=0,b=0,c=0;for(let i=0;i<n;i++){const x=m[i]-mm,y=o[i]-oo;a+=x*y;b+=x*x;c+=y*y;}const d=Math.sqrt(b*c);return d>0?a/d:0;}
function nrmse(m,o){let s=0,om=0,n=m.length;for(let i=0;i<n;i++){s+=(m[i]-o[i])**2;om+=o[i];}om/=n;return om>0?Math.sqrt(s/n)/om:9.9;}

function fmtpp(d){return (d>=0?"+":"")+d.toFixed(1);}
// ---- generation mix (system-wide; matches the calibration [3b] analysis) ----
// GRID-DELIVERED basis for every ISO. Model column = grid LP only (gmModel,
// NO behind-the-meter add-back); actual = grid-delivered EIA-923 (923 − per-
// class BTM CHP) with wind/solar on the EIA-930 grid series (distribution-
// connected / net-metered BTM PV removed). BTM is excluded by default — these
// system/class totals are what reached the grid, never the behind-the-meter
// self-supply (that add-back lives ONLY in the per-plant CEMS heatmaps). One
// row per class: TWh and share of TOTAL GENERATION, plus the model's pp share
// deviation. Zone-independent: 923/930 totals are system-wide. (genMixData's
// fossil/total split is kept for the KPI share criterion, not shown here.)
//
// Generation alone does NOT balance load for a net importer (MISO serves ~6%
// of load from neighbours; CAISO/NYISO/NEISO similar), so the table also
// reconciles generation + net imports = load. The apparent "model total is
// N TWh under actual" is the net-import volume the generation-only rows omit,
// not missing generation. Net imports come from the priced-interchange
// fuelRows row (absent for a measured-schedule bundle, which nets interchange
// into demand — then generation balances load directly and no import row shows).
function mixLabel(g){return META.groupLabel[g]||({ST_CHP:"Steam Gas CHP"}[g])||g;}
// System-wide load (TWh): sum of every zone's annual demand in the payload.
// The model is balanced to EIA-930 demand, so model generation + net imports
// == this load. Used to reconcile supply against load in the mix table.
function sysDemand(id,yr){const L=(MODEL[id].years[yr]||{}).lmp||{};let d=0;for(const z in L)d+=(L[z].d||0);return d;}
function genMixData(id,yr){const B=BENCH[yr];const gm=(MODEL[id].years[yr]||{}).gmModel||{};
 const nf=(MODEL[id].years[yr]||{}).nonfossil||{};
 const mFos=Object.keys(B.classFull).reduce((s,g)=>s+(gm[g]||0),0);
 const mGen=mFos+(nf.nuclear||0)+(nf.wind||0)+(nf.solar||0);
 return {gm,nf,mFos,mGen};}
// EIA-923 completeness flag for one (year, iso, class). Returns null when the
// year has no completeness part (a complete vintage — no flag), else
// {status, gate} from window.BC.completeness. Drives the mix-table color code.
function cmpInfo(yr,iso,g){const C=(window.BC.completeness||{})[yr];if(!C)return null;
 return (C[iso]||{})[g]||{status:"incomplete",gate:false};}
function cmpBadge(c){if(!c)return "";
 if(c.status==="complete")return ' <span class="badge923 ok" title="EIA-923 verified complete — gates C1">✓ 923</span>';
 if(c.status==="immaterial")return ' <span class="badge923 imm" title="immaterial volume — not gated">— 923</span>';
 return ' <span class="badge923 inc" title="incomplete EIA-923 plant data — not gated this vintage">⚠ 923</span>';}
function genMixPanel(id,yr){const B=BENCH[yr];if(!B||!B.classFull)return "";
 const cf=B.classFull,FG=Object.keys(cf),gm=(MODEL[id].years[yr]||{}).gmModel||{};
 // Totals over ALL classes (including CHP) for share denominators and footer.
 const aGen=FG.reduce((s,g)=>s+(cf[g]||0),0);
 const mGen=FG.reduce((s,g)=>s+(gm[g]||0),0);
 const iso=(META_RUN(id)||{}).iso||"ERCOT";
 // Preliminary-EIA-923 vintage iff the year has a completeness part. When it
 // does, color-code each class by whether its plant data is complete enough to
 // gate the C1 fuel-mix test (only ✓ classes gate; ⚠/— are not gated).
 const prelim=!!(window.BC.completeness||{})[yr];
 // Net imports (import-positive): the fuelRows "interchange" row is net-EXPORT
 // positive (EIA-930 sign), so flip it. Present only for a priced-interchange
 // bundle; a measured-schedule bundle nets interchange into demand (no row).
 const ix=((MODEL[id].years[yr]||{}).fuelRows||[]).find(x=>x.fuel==="interchange");
 const mImp=ix?-ix.m:null,aImp=(ix&&ix.b!=null)?-ix.b:null;
 const load=sysDemand(id,yr);
 // Merge CHP classes into parent classes for display: CC_CHP→CC_REGULAR,
 // CT_CHP→CT_PEAKER, ST_CHP→ST_GAS. Grid-delivered values are already
 // BTM-subtracted on both sides (classFull = EIA-923 − BTM; gmModel = LP
 // dispatch). Merging keeps the table rows summing to total generation while
 // hiding the BTM-concept CHP rows that confuse the class-level diagnosis.
 const CHP_MERGE={'CC_CHP':'CC_REGULAR','CT_CHP':'CT_PEAKER','ST_CHP':'ST_GAS'};
 const FG_disp=FG.filter(g=>!(g in CHP_MERGE));
 const cf_d=Object.fromEntries(FG_disp.map(g=>[g,cf[g]||0]));
 const gm_d=Object.fromEntries(FG_disp.map(g=>[g,gm[g]||0]));
 for(const[chp,par]of Object.entries(CHP_MERGE)){
  if(par in cf_d)cf_d[par]=(cf_d[par]||0)+(cf[chp]||0);
  if(par in gm_d)gm_d[par]=(gm_d[par]||0)+(gm[chp]||0);}
 let h='<div class=panel><h2>Generation mix <span class=psub>(system-wide; share of total generation by class vs grid-delivered EIA-923 (923 − BTM); CHP folded into parent class; BTM excluded — grid-delivered only)</span></h2>';
 h+=`<p class=psub>${MODEL[id].label} generation ${mGen.toFixed(1)} TWh · actual ${aGen.toFixed(1)} TWh`
   +(mImp!=null?` · + net imports ${mImp.toFixed(1)} (actual ${aImp==null?"—":aImp.toFixed(1)}) → supply ${(mGen+mImp).toFixed(1)} TWh vs load ${load.toFixed(1)} TWh`:'')+`</p>`;
 if(prelim)h+='<p class=psub style="color:#9a5b12"><b>Preliminary EIA-923 vintage:</b> per-class plant data is still incomplete. '
   +'Only <span class="badge923 ok">✓ 923</span> classes are verified-complete and gate the C1 fuel-mix test; '
   +'<span class="badge923 inc">⚠ 923</span> (incomplete plant data) and <span class="badge923 imm">— 923</span> (immaterial) classes are shown for reference but not gated.</p>';
 h+='<div class=tablewrap><table><thead><tr><th>class</th>'
  +'<th>model TWh</th><th>actual TWh</th><th>model %gen</th><th>actual %gen</th>'
  +'<th>Δpp</th></tr></thead><tbody>';
 for(const g of FG_disp){const a=cf_d[g]||0,m=gm_d[g]||0;
  const a_g=aGen>0?100*a/aGen:0,m_g=mGen>0?100*m/mGen:0,dpp=m_g-a_g;
  // Only fossil classes carry a 923 completeness flag (cf carries non-fossil
  // wind/solar/nuclear too, which are scored on EIA-930, not 923).
  const ci=prelim&&(g in (((window.BC.completeness||{})[yr]||{})[iso]||{}))?cmpInfo(yr,iso,g):null;
  const rowcls=ci?(ci.status==="incomplete"?" class=cmpl-inc":(ci.status==="immaterial"?" class=cmpl-imm":"")):"";
  // Δpp is a pass/fail-flavored color only when the class actually gates; for a
  // non-gated incomplete/immaterial class show it muted (it does not gate).
  const dppcls=(ci&&!ci.gate)?"":ppcls(dpp);
  h+=`<tr${rowcls}><td>${mixLabel(g)}${cmpBadge(ci)}</td><td class=num>${m.toFixed(2)}</td><td class=num>${a.toFixed(2)}</td>`
    +`<td class=num>${m_g.toFixed(1)}</td><td class=num>${a_g.toFixed(1)}</td>`
    +`<td class="num ${dppcls}">${fmtpp(dpp)}</td></tr>`;}
 h+=`<tr class=sub><td>Total generation</td><td class=num>${mGen.toFixed(2)}</td><td class=num>${aGen.toFixed(2)}</td>`
   +`<td class=num>100.0</td><td class=num>100.0</td><td class=num></td></tr>`;
 // Reconcile generation + net imports = supply = load, so the net-import
 // volume that the generation-only rows omit is visible instead of reading as
 // a phantom "model is N TWh short of actual". Only when the run carries a
 // priced-interchange row; otherwise interchange is already in demand.
 if(mImp!=null){
  const mSup=mGen+mImp;
  // Actual total supply is only meaningful when actual imports are known.
  // Use null (show "—") rather than silently using aGen alone when aImp is
  // absent, which would make aSup ~20-40 TWh short of load for net importers.
  const aSup=aImp!=null?aGen+aImp:null;
  h+=`<tr><td>net imports</td><td class=num>${mImp.toFixed(2)}</td><td class=num>${aImp==null?"—":aImp.toFixed(2)}</td><td class=num></td><td class=num></td><td class=num></td></tr>`;
  h+=`<tr class=sub><td>Total supply (gen + net imports)</td><td class=num>${mSup.toFixed(2)}</td><td class=num>${aSup==null?"—":aSup.toFixed(2)}</td><td class=num></td><td class=num></td><td class=num></td></tr>`;
  if(load>0){
   const dM=mSup-load,dA=aSup!=null?aSup-load:null;
   h+=`<tr><td>Load (EIA-930 demand)</td><td class=num>${load.toFixed(2)}</td><td class=num>${load.toFixed(2)}</td><td class=num></td><td class=num></td><td class="num ${ppcls(100*dM/load)}">${fmtTWh(dM)}</td></tr>`;
   if(dA!=null&&Math.abs(dA)>2)
    h+=`<tr><td colspan=6 class=psub style="text-align:left;white-space:normal;padding:6px 0 0">Model supply balances load to ${fmtTWh(dM)} (storage round-trip + dump). The actual column is EIA-923 net generation reconciled to the EIA-930 grid series per fossil family (grid-delivered: CHP behind-the-meter and 923↔930 plant-to-BA assignment removed so each family matches what reached the grid). Any residual ${fmtTWh(dA)} vs load is EIA-930's own net-generation-minus-demand discrepancy (the two series are independently surveyed), not behind-the-meter — both columns are now on the same grid-delivered basis, so the per-class shares and the absolute supply total are directly comparable.</td></tr>`;}
 }
 return h+'</tbody></table></div></div>';}

// Make a chart/canvas respond to touch as a tap-to-pin tooltip (mobile has no
// hover): tapping shows the value and it persists until the next tap elsewhere

// scrub values without scrolling the page off the element.

 for(const z in L){if(!st.zones.has(z))continue;const dm=L[z].dMon;if(!dm)continue;for(let m=0;m<12;m++){d[m]+=dm[m];any=true;}}return any?d:null;}

// ---- diagnostics: localize each miss and suggest the likely source ----
// Pure presentation-layer heuristics over the same payload numbers shown in
// the charts (volErr month/zone decomposition, per-plant Δ923, class r, LMP
// deltas) — nothing here re-decides a calibration metric. Wording is hedged:
// these are pointers for where to look, not verdicts.
const SUMMER=[5,6,7,8],WINTER=[11,0,1];          // Jun–Sep, Dec–Feb (0-based)
function monthMiss(id,yr,cls){const out=[];
 for(const mo of ALLMON){const c=volMA(id,yr,cls,st.zones,[mo]);out.push(c?c.m-c.a:0);}return out;}
function seasonLabel(idx){return SUMMER.includes(idx)?"summer":WINTER.includes(idx)?"winter":"shoulder";}
function fmtTWh(v){return (v>=0?"+":"")+(Math.abs(v)>=1?v.toFixed(1)+" TWh":(v*1e3).toFixed(0)+" GWh");}
function topPlantMisses(id,yr,grp,n){const B=BENCH[yr],M=MODEL[id].years[yr];if(!B||!M)return [];
 return plantsOf(id,yr,grp).map(c=>{const b=B.plants[c],mp=M.plants[c];
   return {name:b.name,zone:b.zone,miss:mp.m_ann-b.e_ann,e:b.e_ann};})
  .filter(p=>p.e>0.001).sort((a,b)=>Math.abs(b.miss)-Math.abs(a.miss)).slice(0,n);}
// One volume finding per failing class: which years, which direction, and
// whether the miss is seasonal, zonal, plant-specific or a flat level shift —
// each pattern maps to a different first place to look.
function volFinding(id,years,g){
 const errsByY=years.map(yr=>({yr,e:anyErr(id,yr,g)})).filter(x=>x.e);
 const failing=errsByY.filter(x=>clsTol(x.e)!=="good");if(!failing.length)return null;
 const worst=failing.reduce((a,b)=>Math.abs(b.e.err)>Math.abs(a.e.err)?b:a);
 const sev=clsTol(worst.e),dir=worst.e.err>=0?"over":"under";
 const signs=errsByY.map(x=>Math.sign(x.e.err)),structural=errsByY.length>1&&signs.every(s=>s===signs[0]);
 const yrs=failing.map(x=>x.yr).join(", ");
 let txt=`${dir==="over"?"Over":"Under"}-generates by ${fmtPct(worst.e.err)} (${fmtTWh(worst.e.mFull-worst.e.bench923)}) in ${worst.yr}`
  +(failing.length>1?`; out of tolerance in ${yrs}`:"")
  +(structural?` — same direction every year, so it reads as structural (offer-curve level), not weather/gas-price driven.`:`.`);
 if(!shareInTol(worst.e,1)&&worst.e.sharePP!=null)
  txt+=` Its share of total generation is off by ${fmtpp(worst.e.sharePP)}pp.`;
 if(!isNonFos(g)){
  const dm=monthMiss(id,worst.yr,g),D=dm.reduce((s,v)=>s+v,0);
  if(Math.abs(D)>0.02){
   // season concentration: share of the signed miss carried by each season
   const sums={summer:0,winter:0,shoulder:0};dm.forEach((v,i)=>sums[seasonLabel(i)]+=v);
   const seas=Object.entries(sums).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
   const sShare=seas[1]/D,sameSign=dm.filter(v=>Math.sign(v)===Math.sign(D)&&Math.abs(v)>1e-4).length;
   if(sameSign>=10&&Math.abs(sShare)<0.55){

   }else if(seas[1]!==0&&Math.abs(sShare)>=0.55){
    const lever=seas[0]==="summer"?"the peak / econ_high tranche":(seas[0]==="winter"?"the winter availability / peak tranche":"the econ_low / shoulder tranche");
    txt+=` ${Math.round(100*Math.abs(sShare))}% of the miss sits in ${seas[0]} months — first place to look: ${lever} (${dir==="over"?"likely priced too low; the class clears too often there":"likely priced too high; the class drops out of merit there"}).`;}
   // zone concentration
   const ve=((MODEL[id].years[worst.yr]||{}).volErr||{})[g];
   if(ve&&ve.zoneMon){const zs=Object.entries(ve.zoneMon).filter(([z])=>st.zones.has(z))
     .map(([z,zc])=>({z,d:zc.m.reduce((s,v)=>s+v,0)-zc.a.reduce((s,v)=>s+v,0)}))
     .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    if(zs.length>1&&Math.abs(zs[0].d/D)>0.6&&Math.sign(zs[0].d)===Math.sign(D)){

     txt+=zshare>1.02
      ?` ${zs[0].z} carries more than the whole net miss (${fmtTWh(zs[0].d)}; other zones partly offset it) — check zonal load share / basis there before retuning the class curve.`

function lmpFindings(id,years){const out=[];

   .sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3);
  if(pdiff==null||(Math.abs(pdiff)<5&&!hot.length))continue;
  let txt=`Annual ${ov?"model + ORDC overlay":"model"} LMP ${fmtPct(pdiff)} vs actual ${lab}.`;
  if(hot.length){txt+=` Largest monthly gaps: ${hot.map(x=>`${MONTHS[x.i]} ${fmtPct(x.d)}`).join(", ")}.`;
   // tie the worst month to the largest class volume miss in that month
   const w=hot[0];let cand=null;
   for(const g of META.groups){const c=volMA(id,yr,g,st.zones,[w.i]);if(!c)continue;
    const d=c.m-c.a;if(!cand||Math.abs(d)>Math.abs(cand.d))cand={g,d};}
   if(cand&&Math.abs(cand.d)>0.05){
    const over=cand.d>0;

     +(w.d>0&&!over?" — the model looks short that supply, letting costlier units set the price.":
       (w.d<0&&over?" — the extra cheap supply depresses the model price.":"."));}}
  txt+=ov?" Δ is on the ORDC-overlaid price (energy LMP + ORDC/reliability-deployment adder), so it is like-for-like with the scarcity-inclusive actuals; a flat reliability-deployment offset anchored to 2023 under-serves the milder years, leaving a residual under-bias there."
   :" Reminder: the model is a day-ahead-style energy LP with no ORDC/scarcity adders, so some positive bias in scarcity months is expected.";

 document.getElementById("cAnn").appendChild(barChart(bs,Math.max(0.1,...bs.map(b=>b.v))*1.25,760,260));
 mountVolMiss(id,yr,grp);
 wireTips(document.getElementById("content"));}
// ============================ TABLES ============================
function tablesHTML(id,yr){
 let h=genMixPanel(id,yr)+singleFuelTable(id,yr)+singleFossilTable(id,yr)+co2Table(id,yr)+lmpMonthlyTable(id,yr);
 h+='<div class=panel><h2>Per-plant fit vs CAMPD / EIA-923 — '+yr+'</h2><div class=tablewrap><table><thead><tr><th>plant</th><th>class</th><th>zone</th><th>r</th><th>NRMSE</th><th>capture%</th><th>Δ923%</th></tr></thead><tbody>';
 const B=BENCH[yr],M=MODEL[id].years[yr];
 const codes=Object.keys(M.plants).filter(c=>B.plants[c]&&st.zones.has(B.plants[c].zone)).sort((a,b)=>B.plants[a].group.localeCompare(B.plants[b].group)||B.plants[b].npl-B.plants[a].npl);
 for(const c of codes){const b=B.plants[c],mp=M.plants[c];const d=b.e_ann>0.001?100*(mp.m_ann-b.e_ann)/b.e_ann:null;
  h+=`<tr><td>${b.name}</td><td>${META.groupLabel[b.group]||b.group}</td><td>${b.zone}</td><td class="num ${rcls(mp.r)}">${mp.r??"—"}</td><td class=num>${mp.nrmse??"—"}</td><td class=num>${mp.cap==null?"—":mp.cap.toFixed(0)}</td><td class="num ${d==null?'':dcls(d)}">${d==null?"—":d.toFixed(0)}</td></tr>`;}
 h+='</tbody></table></div>'+narrative([id])+'</div>';
 return h;}
function renderTables(){const id=st.run,yr=st.year;
 document.getElementById("content").innerHTML=tablesHTML(id,yr);wireTips(document.getElementById("content"));}
// ===== Calibration Status (all-ISO summary, driven by window.BC.status) =====
// status.js embeds the FULL machine verdict from scripts/calibration_verdict.py
// for each ISO's current keeper, so everything here is presentation only — no
// tolerance or determination is recomputed in JS (the page can never disagree
// with the gate).
const CS_ORDER=["fuelmix","sysvol","price_mean","price_shape","price_tail","dispatch_corr","co2","storage","governance"];
const CS_CODE={fuelmix:"C1",sysvol:"C2",price_mean:"C3a",price_shape:"C3b",price_tail:"C3c",dispatch_corr:"C4",co2:"C5a",storage:"C5b",governance:"C6"};
const CS_MARK={PASS:"✓",CAVEAT:"~",FAIL:"✗",SKIPPED:"·",UNATTESTED:"?"};
const CS_CLS={PASS:"good",CAVEAT:"ok",FAIL:"bad",SKIPPED:"mute",UNATTESTED:"bad"};
const CS_DET={CALIBRATED:"det-cal","CALIBRATED-WITH-CAVEATS":"det-cav","NOT-YET":"det-not"};
function csEsc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function csYears(ys){if(!ys||!ys.length)return"—";const a=ys.slice().sort((x,y)=>x-y);
 let cont=a.length>1;for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)cont=false;
 return cont?`${a[0]}–${a[a.length-1]}`:a.join(", ");}
function csGlyph(status){return `<span class="glyph ${CS_CLS[status]||"mute"}">${CS_MARK[status]||"·"}</span>`;}
function csCardMarks(v){return CS_ORDER.map(cid=>{const c=v.criteria[cid];const s=c?c.status:"SKIPPED";
 return `<span class=cs-mk title="${csEsc((c&&c.label)||cid)} — ${s}"><span class=code>${CS_CODE[cid]}</span>${csGlyph(s)}</span>`;}).join("");}
function csReason(v){return v.reasons&&v.reasons.length?v.reasons.join("; "):"All criteria pass; governance attested.";}
function csDetailRows(v){return CS_ORDER.map(cid=>{const c=v.criteria[cid];if(!c)return"";
 let body;
 if(cid==="governance"){const g=(c.records&&c.records[0])||{};
  body=`<div class=cs-rec><span class="mk ${CS_CLS[c.status]||"mute"}">${CS_MARK[c.status]||"·"}</span>${csEsc(g.magnitude||c.status)}</div>`;}
 else{const notable=(c.records||[]).filter(r=>r.status!=="PASS");
  if(!notable.length)body=`<span class=cs-allok>all scorable years within tolerance</span>`;
  else body=notable.map(r=>{
   const yr=r.year?`${r.year} `:"";const key=r.key?`${csEsc(r.key)} `:"";
   const tol=r.tol?` <span class=cs-gate>(tol ${csEsc(r.tol)})</span>`:"";
   let tag="";
   if(r.classification==="ACCEPTED MEASURED-INPUT LIMITATION")tag=`<span class="cs-tag tag-lim">ACCEPTED LIMITATION</span>`;
   else if(r.classification==="MODEL MISS")tag=`<span class="cs-tag tag-miss">MODEL MISS</span>`;
   const led=r.ledger_reason?`<div class=cs-ledger>${csEsc(r.ledger_reason)}</div>`:"";
   return `<div class=cs-rec><span class="mk ${CS_CLS[r.status]||"mute"}">${CS_MARK[r.status]||"·"}</span><b>${yr}${key}</b>${csEsc(r.magnitude)}${tol}${tag}${led}</div>`;
  }).join("");}
 return `<tr><td>${csEsc(c.label)}</td><td class=cs-gate>${c.hard?"HARD":"soft"}</td><td class="cs-st ${CS_CLS[c.status]||"mute"}">${CS_MARK[c.status]||"·"}</td><td>${body}</td></tr>`;
}).join("");}
let csSel=0;  // index of the keeper tile whose full results are shown
// One keeper's full C1–C6 results block (heading + per-year matrix).
function csResultsBlock(v){const det=CS_DET[v.determination]||"det-not";
 const blocked=v.data_blocked_years&&v.data_blocked_years.length?` · <span class=bad>blocked ${v.data_blocked_years.join(", ")}</span>`:"";
 return `<div class=cs-reshd>
   <span class=cs-iso>${csEsc(v.iso)}</span>
   <span class="cs-badge ${det}">${csEsc(v.determination)}</span>
   <span class="cs-keeper rid" style="margin:0">${csEsc(v.label)} · years ${csYears(v.target_years)}${blocked}</span></div>
  <p class=cs-reason style="margin:0 0 var(--space-md)">${csEsc(csReason(v))}</p>
  <div class=tablewrap><table class=cs-matrix><thead><tr><th>Criterion</th><th>Gate</th><th>Status</th><th>Per-year detail · classification</th></tr></thead>
  <tbody>${csDetailRows(v)}</tbody></table></div>`;}
// Repaint the tile highlight + the results block for the selected keeper.
function csShow(i){const S=window.BC.status;if(!S||!S.keepers[i])return;csSel=i;
 document.querySelectorAll("#csGrid .cs-card").forEach(c=>c.classList.toggle("sel",+c.dataset.i===i));
 const host=document.getElementById("csResults");if(host)host.innerHTML=csResultsBlock(S.keepers[i]);}
function renderCalibStatus(){
 const S=window.BC&&window.BC.status,host=document.getElementById("content");
 if(!S||!S.keepers||!S.keepers.length){
  host.innerHTML='<div class=panel><h2>Calibration Status</h2><p class=psub>Status data is unavailable — <code>frontend/data/backcast/status.js</code> did not load. Re-run <code>python scripts/build_status.py</code> so the all-ISO verdicts are emitted.</p></div>';return;}
 if(csSel>=S.keepers.length)csSel=0;
 const cards=S.keepers.map((v,i)=>{const det=CS_DET[v.determination]||"det-not";
  const blocked=v.data_blocked_years&&v.data_blocked_years.length?` · <span class=bad>blocked ${v.data_blocked_years.join(", ")}</span>`:"";
  return `<article class="cs-card ${det} ${i===csSel?"sel":""}" data-i=${i} tabindex=0 role=button aria-pressed="${i===csSel}">
   <div class=cs-cardhd><span class=cs-iso>${csEsc(v.iso)}</span><span class="cs-badge ${det}">${csEsc(v.determination)}</span></div>
   <div class=cs-keeper><span class=rid>${csEsc(v.label)}</span> · years ${csYears(v.target_years)}${blocked}</div>
   <p class=cs-reason>${csEsc(csReason(v))}</p>
   <div class=cs-marks>${csCardMarks(v)}</div>
   <div class=cs-open>View full results &rarr;</div>
  </article>`;}).join("");
 const tests=(S.rubric||[]).map(r=>`<tr><td>${csEsc(r.label)}</td><td>${csEsc(r.measures)}</td><td>${csEsc(r.source)}</td><td>${csEsc(r.tol)}</td></tr>`).join("");
 const method=(S.methodology||[]).map(m=>`<div class=m><h4>${csEsc(m.head)}</h4><p>${csEsc(m.body)}</p></div>`).join("");
 host.innerHTML=`
  <div class=panel>
   <h2>Calibration Status — every ISO's current keeper</h2>
   <p class=psub>Headline determination for each market's newest keeper, scored from committed artifacts by <code>scripts/calibration_verdict.py</code> against the calibration-determination rubric — so this page can never disagree with the gate. Generated ${csEsc(S.generated||"")}.</p>
   <div class=cs-legend>
    <span><i class="cs-dot dot-cal"></i> <b>CALIBRATED</b> — every criterion passes, governance attested</span>
    <span><i class="cs-dot dot-cav"></i> <b>CALIBRATED-WITH-CAVEATS</b> — only ledgered measured-input limitations / unscored soft criteria</span>
    <span><i class="cs-dot dot-not"></i> <b>NOT-YET</b> — an undocumented out-of-tolerance criterion (a model miss to fix)</span>
   </div>
   <p class=psub style="margin:var(--space-md) 0 var(--space-sm)">Click a market tile to see its full C1–C6 results below.</p>
   <div class=cs-grid id=csGrid>${cards}</div>
  </div>
  <div class=panel>
   <h2>C1–C6 status matrix</h2>
   <p class=psub>${csGlyph("PASS")} pass · ${csGlyph("CAVEAT")} caveat (ledgered limitation) · ${csGlyph("FAIL")} fail (model miss) · ${csGlyph("SKIPPED")} skipped (not scored). Per-year magnitudes and the MODEL-MISS vs ACCEPTED-LIMITATION classification for the selected market.</p>
   <div id=csResults></div>
  </div>
  <div class=panel>
   <h2>Tests conducted</h2>
   <p class=psub>What each criterion measures, its authoritative actual source, and its tolerance (read straight off the scorer's constants).</p>
   <div class=tablewrap><table class=cs-tests><thead><tr><th>Criterion</th><th>What it measures</th><th>Authoritative actual</th><th>Tolerance</th></tr></thead><tbody>${tests}</tbody></table></div>
  </div>
  <div class=panel>
   <h2>Justification — methodology &amp; best-practice grounding</h2>
   <p class=psub>Why these determinations are what they are, grounded in energy-modeling best practice.</p>
   <div class=cs-method>${method}</div>
  </div>`;
 const grid=document.getElementById("csGrid");
 grid.querySelectorAll(".cs-card").forEach(c=>{
  c.onclick=()=>csShow(+c.dataset.i);
  c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();csShow(+c.dataset.i);}};});
 csShow(csSel);
 if(typeof wireTips==="function")wireTips(host);
}
// Top-level destination switch (left-panel menu): the per-run dashboard vs the
// all-ISO Calibration Status page. They are mutually exclusive — Calibration
// Status hides the ISO/run selectors and the per-run control bar entirely.
function setView(v){
 st.view=v;
 document.querySelectorAll("#bcNav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 const calib=v==="calib",show=(id,on)=>{const el=document.getElementById(id);if(el)el.style.display=on?"":"none";};
 show("dashSide",!calib);show("bcTop",!calib);show("isoBadge",!calib);
 if(calib){
  document.getElementById("diag").style.display="none";
  document.getElementById("pageSub").textContent="Determinations for every ISO's current keeper · scored by scripts/calibration_verdict.py";
  renderCalibStatus();
 }else{updateIsoChrome(st.iso);render();}
}
// ---- shell render ----
function render(){const id=st.run;if(!id){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Select a run.</p></div>';return;}
 ensureRuns([id]).then(()=>{
  if(!MODEL[id]){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Run data failed to load.</p></div>';return;}
  // year/class clamps when the run or ISO changed under the current selection
  const ys=runYears(id);if(ys.length&&!ys.includes(st.year))st.year=ys[0];
  if(!META.groups.includes(st.klass))st.klass=META.groups[0];
  syncTopbar();
  if(st.page==="report")renderReport();
  else if(st.page==="charts")renderCharts();
  else renderTables();
 }).catch(e=>{document.getElementById("diag").style.display="block";document.getElementById("diag").textContent="Load error: "+(e.message||e);});}
// Year + class controls only steer the per-year views; the report shows every
// year at once, so they hide there to keep the bar clean (zones stay — every
// zone-aware metric honors them on all pages).
function syncTopbar(){
 document.getElementById("ctlYear").style.display=st.page==="report"?"none":"";
 document.getElementById("ctlClass").style.display=st.page==="charts"?"":"none";
 const ys=st.run?runYears(st.run):[];
 const ysel=document.getElementById("yearSel");
 ysel.innerHTML=ys.map(y=>`<button data-y=${y} class=${y===st.year?"on":""}>${y}</button>`).join("");}
function isoRuns(){return BC.manifest.filter(m=>(m.iso||"ERCOT")===st.iso);}
// Newest first (run id starts with the bundle date, so lexicographic works);
// the newest run is also the default selection.
function isoRunsNewest(){return isoRuns().slice().sort((a,b)=>b.id.localeCompare(a.id));}
function buildRunList(){
 const list=document.getElementById("runList");
 list.innerHTML=isoRunsNewest().map(m=>`<label class="runopt ${st.run===m.id?'on':''}">
  <input type=radio name=run value="${m.id}" ${st.run===m.id?"checked":""}>
  <span class=rlab>${m.label}</span> <span class=rid data-rid="${m.id}">${m.shorthand}</span></label>`).join("");
 list.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
  st.run=inp.value;st.plant="agg";
  list.querySelectorAll(".runopt").forEach(o=>o.classList.toggle("on",o.querySelector("input").value===st.run));
  render();});
 wireTips(list);}
function build(){
 document.getElementById("pageSel").onclick=e=>{const p=e.target.dataset.p;if(!p)return;st.page=p;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.p===p));render();};
 const ysel=document.getElementById("yearSel");
 ysel.onclick=e=>{if(!e.target.dataset.y)return;st.year=+e.target.dataset.y;[...ysel.children].forEach(b=>b.classList.toggle("on",+b.dataset.y===st.year));render();};
 const csel=document.getElementById("classSel");csel.innerHTML=META.groups.map(g=>`<option value="${g}">${META.groupLabel[g]}</option>`).join("");
 csel.value=st.klass;csel.onchange=()=>{st.klass=csel.value;st.plant="agg";render();};
 const zsel=document.getElementById("zoneSel");zsel.innerHTML=`<span class="chip on" data-z=__all>All</span>`+META.zones.map(z=>`<span class="chip on" data-z="${z}">${z}</span>`).join("");
 zsel.onclick=e=>{const z=e.target.dataset.z;if(!z)return;
  if(z==="__all")st.zones=new Set(META.zones);else{if(st.zones.has(z))st.zones.delete(z);else st.zones.add(z);if(!st.zones.size)st.zones=new Set(META.zones);}
  [...zsel.children].forEach(c=>{const zz=c.dataset.z;c.classList.toggle("on",zz==="__all"?st.zones.size===META.zones.length:st.zones.has(zz));});
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);render();};
 buildRunList();render();}
// Header badge + subtitle + sidebar hint, recolored to the active market so the
// user always knows which ISO the page is showing and what else is available.
function updateIsoChrome(iso){
  const badge=document.getElementById("isoBadge");
  badge.style.setProperty("--c",isoColorVar(iso));
  badge.innerHTML=`<span class=dot></span>${iso}`;
  const n=isoRunCount(iso),sub=document.getElementById("pageSub");
  if(SUB_BASE!=null)sub.textContent=`${iso} · ${n} run${n===1?"":"s"} · ${SUB_BASE}`;
  const others=Object.keys(window.BC.meta).filter(x=>x!==iso);
  document.getElementById("isoHint").textContent=others.length
    ?("Switch market — also loaded: "+others.join(", ")):"Only this market is loaded.";
}
async function selectIso(iso){
  st.iso=iso;
  META=window.BC.meta[iso];
  // benchmark.js is the large data file; if the deploy shipped the shell
  // without it (404 / stale / out-of-sync build), benchGz is undefined here.
  // Fail with an actionable message instead of a cryptic "undefined is not an
  // object" that blanks the page.
  if(!window.BC.benchGz||window.BC.benchGz[iso]==null)
   throw new Error("benchmark data for "+iso+" is unavailable — "
    +"frontend/data/backcast/benchmark.js did not load or is out of sync with "
    +"the page. Re-run the Pages deploy (scripts/build_manifest.py) so the "
    +"shell and benchmark.js are rebuilt together.");
  BENCH=await inflate(window.BC.benchGz[iso]);
  const first=isoRunsNewest()[0];
  st.run=first?first.id:null;
  st.year=META.years[0];st.zones=new Set(META.zones);
  st.klass=META.groups[0];st.plant="agg";
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);
  Object.keys(_eAllC).forEach(k=>delete _eAllC[k]);
  Object.keys(_mAllC).forEach(k=>delete _mAllC[k]);
  const sel=document.getElementById("isoSel");
  sel.value=iso;
  document.getElementById("isoWrap").style.setProperty("--c",isoColorVar(iso));
  updateIsoChrome(iso);
  build();
}
// The data files (manifest.js, benchmark.js, completeness.js) load via
// <script src> before boot() runs. A stale CDN / browser cache or an
// out-of-sync deploy can leave one un-loaded (meta / benchGz undefined).
// ensureData() re-fetches whichever is missing with a cache-busting query
// so the page self-heals instead of blanking.
async function ensureData(){
  const cb="?cb="+Date.now(),need=[];
  if(!window.BC.meta||!window.BC.manifest)
    need.push("frontend/data/backcast/manifest.js");
  if(!window.BC.benchGz)
    need.push("frontend/data/backcast/benchmark.js");
  if(!window.BC.completeness)
    need.push("frontend/data/backcast/completeness.js");
  if(!need.length)return;
  console.warn("data scripts missing, re-fetching: "+need.join(", "));
  for(const src of need){
    try{await loadScript(src+cb);}
    catch(e){console.warn("data re-fetch failed: "+src+": "+((e&&e.message)||e));}
  }
}
function diagMsg(e){
  const failed=(window.BC._loadErr||[]).map(u=>{try{return new URL(u).pathname.split("/").pop();}catch(_){return u;}});
  let msg="Init error: "+((e&&e.message)||e);
  if(failed.length)msg+="\n\nFailed to load: "+failed.join(", ")+". Check the browser console (Network tab) for 404s.";
  msg+="\n\nFix: re-run the Pages deploy (push to main or trigger Deploy site to GitHub Pages manually).";
  return msg;
}
async function boot(){try{
  await ensureData();
  if(!window.BC.meta||!window.BC.manifest)
   throw new Error("manifest data is unavailable — "
    +"frontend/data/backcast/manifest.js did not load.");
  if(!window.BC.benchGz)
   throw new Error("benchmark data is unavailable — "
    +"frontend/data/backcast/benchmark.js did not load.");
  const isos=Object.keys(window.BC.meta);
  if(!isos.length) throw new Error("manifest loaded but contains no ISOs.");
  const isoSel=document.getElementById("isoSel");
  isoSel.innerHTML=isos.map(i=>{const n=isoRunCount(i);
    return `<option value="${i}">${i} · ${n} run${n===1?"":"s"}</option>`;}).join("");
  isoSel.onchange=()=>{if(isoSel.value!==st.iso)selectIso(isoSel.value);};
  document.getElementById("bcNav").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.v)setView(b.dataset.v);};
  st={run:null,year:0,zones:new Set(),page:"report",klass:"",plant:"agg",iso:null,cfMode:"bins",view:"dash"};
  SUB_BASE=document.getElementById("pageSub").textContent;
  document.getElementById("diag").style.display="none";
  await selectIso(isos.includes("ERCOT")?"ERCOT":isos[0]);
 }catch(e){const d=document.getElementById("diag");d.style.display="block";d.style.color="#c01c28";d.style.whiteSpace="pre-wrap";d.textContent=diagMsg(e);}}
boot();
</script></body></html>
