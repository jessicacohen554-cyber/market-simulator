<script src="frontend/data/backcast/manifest.js"></script><script src="frontend/data/backcast/benchmark.js"></script>
<script>
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const RC=["#4A90D9","#2ECC71","#9B59B6","#E67E22","#E74C3C"];
const NS="http://www.w3.org/2000/svg",T=8760;
let META,BENCH,MODEL={},st;
function inflate(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("browser lacks DecompressionStream — use a current browser"));
 return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()
  .then(ab=>JSON.parse(new TextDecoder().decode(ab)));}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("failed to load "+src));document.head.appendChild(s);});}
async function ensureRuns(ids){for(const id of ids){if(MODEL[id])continue;
  if(!window.BC.runGz||!window.BC.runGz[id]){const m=META_RUN(id);await loadScript(m.file);}
  MODEL[id]=await inflate(window.BC.runGz[id]);}}
function META_RUN(id){return BC.manifest.find(r=>r.id===id);}
function dec(b){const s=atob(b),a=new Float32Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function pearson(m,o){let mm=0,oo=0,n=m.length;for(let i=0;i<n;i++){mm+=m[i];oo+=o[i];}mm/=n;oo/=n;let a=0,b=0,c=0;for(let i=0;i<n;i++){const x=m[i]-mm,y=o[i]-oo;a+=x*y;b+=x*x;c+=y*y;}const d=Math.sqrt(b*c);return d>0?a/d:0;}
function nrmse(m,o){let s=0,om=0,n=m.length;for(let i=0;i<n;i++){s+=(m[i]-o[i])**2;om+=o[i];}om/=n;return om>0?Math.sqrt(s/n)/om:9.9;}
function capScore(r,nr,dev){return 100*Math.cbrt(Math.max(0,r)*Math.max(0,1-nr)*Math.max(0,1-Math.abs(dev)));}
function plantsOf(id,year,grp){const M=MODEL[id].years[year],B=BENCH[year];if(!M||!B)return [];
 return Object.keys(M.plants).filter(c=>{const b=B.plants[c];return b&&b.group===grp&&st.zones.has(b.zone);});}
const _aggC={},_eAllC={};
// Full EIA-923 class total (all 923 plants of the class), allocated to the
// selected zones by the matched plants' EIA-923 distribution: the matched set
// understates the class (e.g. CC_REGULAR ~138 of 145 TWh), so the zonal Δ-vs-
// 923 is scaled to the full class total rather than the matched subtotal.
function matchedEAnnAll(year,grp){const k=year+"|"+grp;if(_eAllC[k]!=null)return _eAllC[k];
 const B=BENCH[year];let s=0;for(const c in B.plants){if(B.plants[c].group===grp)s+=B.plants[c].e_ann;}return _eAllC[k]=s;}
function classBench923(year,grp,eAzones){const B=BENCH[year];
 const cf=B.classFull?B.classFull[grp]:null,eAll=matchedEAnnAll(year,grp);
 return (cf!=null&&eAll>0)?cf*(eAzones/eAll):eAzones;}
// Model class total scaled the same way: the full grid-LP+BTM class total
// (gmModel) allocated to the selected zones by the matched plants' model
// distribution — so the Δ-vs-923 compares full class to full class (matched
// model vs full 923 would understate the model and exaggerate the shortfall).
const _mAllC={};
function matchedMAnnAll(id,year,grp){const k=id+"|"+year+"|"+grp;if(_mAllC[k]!=null)return _mAllC[k];
 const M=MODEL[id].years[year],B=BENCH[year];let s=0;
 for(const c in M.plants){if(B.plants[c]&&B.plants[c].group===grp)s+=M.plants[c].m_ann;}return _mAllC[k]=s;}
function classModelFull(id,year,grp,mAzones){const gm=(MODEL[id].years[year].gmModel||{})[grp],mAll=matchedMAnnAll(id,year,grp);
 return (gm!=null&&mAll>0)?gm*(mAzones/mAll):mAzones;}
function aggMW(id,year,grp){const key=id+"|"+year+"|"+grp+"|"+[...st.zones].sort().join(",");
 if(_aggC[key])return _aggC[key];const M=MODEL[id].years[year],B=BENCH[year];
 const mm=new Float32Array(T),cc=new Float32Array(T);let mA=0,cA=0,eA=0,bA=0;
 for(const c of plantsOf(id,year,grp)){const b=B.plants[c],npl=b.npl,md=dec(M.plants[c].m),cd=dec(b.campd);
  for(let i=0;i<T;i++){mm[i]+=md[i]*npl/100;cc[i]+=cd[i]*npl/100;}
  mA+=M.plants[c].m_ann;cA+=b.c_ann;eA+=b.e_ann;bA+=(b.btm||0);}
 return _aggC[key]={mm,cc,mA,cA,eA,bA};}
function classMetrics(id,year,grp){const ps=plantsOf(id,year,grp);if(!ps.length)return null;
 const a=aggMW(id,year,grp);const r=pearson(a.mm,a.cc),nr=nrmse(a.mm,a.cc),dev=a.cA>0?(a.mA-a.cA)/a.cA:0;
 const m1=a.cc.reduce((s,v)=>s+v,0)>0?capScore(r,nr,dev):null;
 const M=MODEL[id].years[year];let ws=0,cs=0;for(const c of ps){const w=BENCH[year].plants[c].npl,cp=M.plants[c].cap;if(cp!=null){ws+=w;cs+=w*cp;}}
 return {m1,m2:ws>0?cs/ws:null,r,nr,dev,mA:a.mA,mFull:classModelFull(id,year,grp,a.mA),cA:a.cA,eA:a.eA,bench923:classBench923(year,grp,a.eA),n:ps.length};}
function avgLMP(id,year){const L=(MODEL[id].years[year]||{}).lmp||{};let pd=0,d=0;
 for(const z in L){if(!st.zones.has(z))continue;pd+=L[z].p*L[z].d;d+=L[z].d;}
 return d>0?pd/d:null;}
function dcls(d){const a=Math.abs(d);return a<5?"good":a<15?"ok":"bad";}
function ppcls(d){const a=Math.abs(d);return a<1?"good":a<3?"ok":"bad";}
function fmtPct(d){return (d>=0?"+":"")+d.toFixed(1)+"%";}
function fmtpp(d){return (d>=0?"+":"")+d.toFixed(1);}
// ---- generation mix (system-wide; matches the calibration [3b] analysis) ----
// Model total per fossil class = grid LP + behind-the-meter must-run (gmModel);
// actual = full EIA-923 (classFull). Shows each class's share of TOTAL
// generation and of FOSSIL generation, plus the model's pp deviation from the
// actual fossil share. Non-fossil rows (nuclear/wind/solar) give the share of
// total generation only. Zone-independent: 923/930 totals are system-wide.
function mixLabel(g){return META.groupLabel[g]||({ST_CHP:"Steam Gas CHP"}[g])||g;}
function genMixData(id,yr){const B=BENCH[yr];const gm=(MODEL[id].years[yr]||{}).gmModel||{};
 const nf=(MODEL[id].years[yr]||{}).nonfossil||{};
 const mFos=Object.keys(B.classFull).reduce((s,g)=>s+(gm[g]||0),0);
 const mGen=mFos+(nf.nuclear||0)+(nf.wind||0)+(nf.solar||0);
 return {gm,nf,mFos,mGen};}
function genMixPanel(ids,yr){const B=BENCH[yr];if(!B||!B.classFull)return "";
 const cf=B.classFull,e930=B.e930||{},FG=Object.keys(cf);
 const aFos=FG.reduce((s,g)=>s+(cf[g]||0),0);
 const aGen=aFos+(e930.nuclear||0)+(e930.wind||0)+(e930.solar||0);
 const D={};ids.forEach(id=>D[id]=genMixData(id,yr));
 const single=ids.length===1;
 let h='<div class=panel><h2>Generation mix <span class=psub>(system-wide; share of total &amp; of fossil generation vs full EIA-923)</span></h2>';
 h+=`<p class=psub>Actual fossil ${aFos.toFixed(1)} TWh of ${aGen.toFixed(1)} TWh total`
   +ids.map(id=>` · ${MODEL[id].label} fossil ${D[id].mFos.toFixed(1)} TWh`).join("")+`</p>`;
 h+='<div class=tablewrap><table><thead><tr><th>class</th>';
 if(single){const id=ids[0];
  h+='<th>model TWh</th><th>actual TWh</th><th>model %gen</th><th>actual %gen</th>'
   +'<th>model %fos</th><th>actual %fos</th><th>Δpp</th></tr></thead><tbody>';
  for(const g of FG){const a_f=100*(cf[g]||0)/aFos,a_g=100*(cf[g]||0)/aGen;
   const m=D[id].gm[g]||0,m_f=D[id].mFos>0?100*m/D[id].mFos:0,m_g=D[id].mGen>0?100*m/D[id].mGen:0,dpp=m_f-a_f;
   h+=`<tr><td>${mixLabel(g)}</td><td class=num>${m.toFixed(2)}</td><td class=num>${(cf[g]||0).toFixed(2)}</td>`
     +`<td class=num>${m_g.toFixed(1)}</td><td class=num>${a_g.toFixed(1)}</td>`
     +`<td class=num>${m_f.toFixed(1)}</td><td class=num>${a_f.toFixed(1)}</td>`
     +`<td class="num ${ppcls(dpp)}">${fmtpp(dpp)}</td></tr>`;}
  h+=`<tr class=sub><td>Fossil total</td><td class=num>${D[id].mFos.toFixed(2)}</td><td class=num>${aFos.toFixed(2)}</td>`
    +`<td class=num>${(100*D[id].mFos/D[id].mGen).toFixed(1)}</td><td class=num>${(100*aFos/aGen).toFixed(1)}</td>`
    +`<td class=num>100.0</td><td class=num>100.0</td><td class=num></td></tr>`;
  for(const f of ["nuclear","wind","solar"]){const a_g=100*(e930[f]||0)/aGen,m=D[id].nf[f]||0,m_g=D[id].mGen>0?100*m/D[id].mGen:0;
   h+=`<tr><td>${f}</td><td class=num>${m.toFixed(2)}</td><td class=num>${(e930[f]||0).toFixed(2)}</td>`
     +`<td class=num>${m_g.toFixed(1)}</td><td class=num>${a_g.toFixed(1)}</td><td class=num>—</td><td class=num>—</td><td class=num>—</td></tr>`;}
 }else{
  h+='<th>actual %gen</th><th>actual %fos</th>'+ids.map(id=>`<th>${ridSpan(id)} %fos</th><th>Δpp</th>`).join("")+'</tr></thead><tbody>';
  for(const g of FG){const a_f=100*(cf[g]||0)/aFos,a_g=100*(cf[g]||0)/aGen;
   let row=`<tr><td>${mixLabel(g)}</td><td class=num>${a_g.toFixed(1)}</td><td class=num>${a_f.toFixed(1)}</td>`;
   for(const id of ids){const m_f=D[id].mFos>0?100*(D[id].gm[g]||0)/D[id].mFos:0,dpp=m_f-a_f;
    row+=`<td class=num>${m_f.toFixed(1)}</td><td class="num ${ppcls(dpp)}">${fmtpp(dpp)}</td>`;}
   h+=row+'</tr>';}
  h+=`<tr class=sub><td>Fossil total</td><td class=num>${(100*aFos/aGen).toFixed(1)}</td><td class=num>100.0</td>`
    +ids.map(()=>'<td class=num>100.0</td><td class=num></td>').join("")+'</tr>';
  for(const f of ["nuclear","wind","solar"]){const a_g=100*(e930[f]||0)/aGen;
   let row=`<tr><td>${f}</td><td class=num>${a_g.toFixed(1)}</td><td class=num>—</td>`;
   for(const id of ids){const m_g=D[id].mGen>0?100*((D[id].nf[f]||0))/D[id].mGen:0;row+=`<td class=num>${m_g.toFixed(1)}</td><td class=num>—</td>`;}
   h+=row+'</tr>';}
 }
 return h+'</tbody></table></div></div>';}
// ---- tooltip + run-id ----
const tip=document.getElementById("bctip");
function posTipXY(h,cx,cy){tip.innerHTML=h;tip.style.display="block";const p=14,w=tip.offsetWidth,ht=tip.offsetHeight;
 let x=cx+p,y=cy+p;if(x+w>innerWidth)x=cx-w-p;if(y+ht>innerHeight)y=cy-ht-p;if(x<2)x=2;if(y<2)y=2;tip.style.left=x+"px";tip.style.top=y+"px";}
function posTip(h,e){posTipXY(h,e.clientX,e.clientY);}
function hideTip(){tip.style.display="none";}
// Make a chart/canvas respond to touch as a tap-to-pin tooltip (mobile has no
// hover): tapping shows the value and it persists until the next tap elsewhere
// (handled by the document tap-away below). stopPropagation keeps the opening
// tap from immediately closing it; preventDefault on move lets a finger drag
// scrub values without scrolling the page off the element.
function bindTouchTip(el,at){
 el.addEventListener("touchstart",e=>{e.stopPropagation();const t=e.touches[0];if(t)at(t.clientX,t.clientY);},{passive:true});
 el.addEventListener("touchmove",e=>{const t=e.touches[0];if(t){at(t.clientX,t.clientY);e.preventDefault();}},{passive:false});}
function ridSpan(id){return `<span class=rid data-rid="${id}">${id}</span>`;}
function wireTips(root){root.querySelectorAll("[data-rid]").forEach(el=>{el.onclick=e=>{
 const m=META_RUN(el.dataset.rid);if(!m)return;e.stopPropagation();posTip(`<b>${m.id}</b><br>${m.definition}`,e);};});}
function awayFromTip(t){return !t.closest("[data-rid]")&&!t.closest("svg.chart")&&!t.closest("canvas.heat");}
document.addEventListener("click",e=>{if(awayFromTip(e.target))hideTip();});
document.addEventListener("touchstart",e=>{if(awayFromTip(e.target))hideTip();},{passive:true});
// ---- svg helpers ----
function mk(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
function svgEl(vw,vh){const s=mk("svg",{viewBox:`0 0 ${vw} ${vh}`,class:"chart"});return s;}
function lineChart(sets,ymax,xl,unit,vw,vh){const L=52,R=14,B=40,TTv=14,pw=vw-L-R,ph=vh-TTv-B,n=sets[0].pts.length;
 const svg=svgEl(vw,vh);const g=mk("g",{"font-size":12,fill:"#8a93a0"});
 for(let i=0;i<=4;i++){const y=TTv+ph*i/4;g.appendChild(mk("line",{x1:L,y1:y,x2:vw-R,y2:y,stroke:"#eef1f4"}));g.appendChild(mk("text",{x:L-7,y:y+4,"text-anchor":"end"},(ymax*(1-i/4)).toFixed(0)+unit));}
 xl.forEach((lb,i)=>{if(lb)g.appendChild(mk("text",{x:L+(n>1?pw*i/(n-1):0),y:vh-14,"text-anchor":"middle"},lb));});svg.appendChild(g);
 const X=i=>L+(n>1?pw*i/(n-1):0),Y=v=>TTv+ph*(1-Math.min(Math.max(Number(v)||0,0),ymax)/ymax);
 for(const s of sets){const d=s.pts.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  svg.appendChild(mk("path",{d,fill:"none",stroke:s.color,"stroke-width":s.w||2.4,"stroke-dasharray":s.dash||""}));}
 // hover: show every series' value at the nearest x
 const guide=mk("line",{y1:TTv,y2:TTv+ph,stroke:"#c3ccd6","stroke-width":1,opacity:0});svg.appendChild(guide);
 const at=(cx,cy)=>{const r=svg.getBoundingClientRect();const vx=(cx-r.left)/r.width*vw;
  let bi=0,bd=1e9;for(let i=0;i<n;i++){const dd=Math.abs(X(i)-vx);if(dd<bd){bd=dd;bi=i;}}
  guide.setAttribute("x1",X(bi));guide.setAttribute("x2",X(bi));guide.setAttribute("opacity",0.6);
  let h=`<b>${(xl[bi]!=null&&xl[bi]!==""?xl[bi]:bi)}</b>`;
  for(const s of sets)h+=`<br><span style="color:${s.color}">●</span> ${s.name}: ${(Number(s.pts[bi])||0).toFixed(1)}${unit}`;
  posTipXY(h,cx,cy);};
 svg.addEventListener("mousemove",e=>at(e.clientX,e.clientY));
 svg.addEventListener("mouseleave",()=>{hideTip();guide.setAttribute("opacity",0);});
 bindTouchTip(svg,at);
 return svg;}
function barChart(bs,ymax,vw,vh){const L=52,R=14,TTv=14,B=46,pw=vw-L-R,ph=vh-TTv-B;
 const svg=svgEl(vw,vh);const g=mk("g",{"font-size":12,fill:"#8a93a0"});
 for(let i=0;i<=4;i++){const y=TTv+ph*i/4;g.appendChild(mk("line",{x1:L,y1:y,x2:vw-R,y2:y,stroke:"#eef1f4"}));g.appendChild(mk("text",{x:L-7,y:y+4,"text-anchor":"end"},(ymax*(1-i/4)).toFixed(1)));}svg.appendChild(g);
 const bw=pw/bs.length*0.55;bs.forEach((b,i)=>{const cx=L+pw*(i+.5)/bs.length,h=ph*Math.min(b.v,ymax)/ymax,y=TTv+ph-h;
  svg.appendChild(mk("rect",{x:cx-bw/2,y,width:bw,height:h,rx:3,fill:b.color}));
  svg.appendChild(mk("text",{x:cx,y:vh-26,"text-anchor":"middle","font-size":11,fill:"#46505f"},b.label));
  svg.appendChild(mk("text",{x:cx,y:y-6,"text-anchor":"middle","font-size":12,fill:"#46505f","font-weight":700},b.v.toFixed(1)));});
 const at=(cx,cy)=>{const r=svg.getBoundingClientRect();const vx=(cx-r.left)/r.width*vw;
  let bi=0,bd=1e9;for(let i=0;i<bs.length;i++){const bx=L+pw*(i+.5)/bs.length;const dd=Math.abs(bx-vx);if(dd<bd){bd=dd;bi=i;}}
  posTipXY(`<b>${bs[bi].label}</b><br>${bs[bi].v.toFixed(2)}`,cx,cy);};
 svg.addEventListener("mousemove",e=>at(e.clientX,e.clientY));
 svg.addEventListener("mouseleave",hideTip);
 bindTouchTip(svg,at);
 return svg;}
function cfColor(v){if(v<=1)return[232,243,247];const t=Math.min(v,100)/100,S=[[0,232,243,247],[.04,127,196,230],[.30,134,201,143],[.55,242,214,92],[.78,239,143,60],[1,192,57,43]];
 for(let i=1;i<S.length;i++)if(t<=S[i][0]){const a=S[i-1],b=S[i],f=(t-a[0])/(b[0]-a[0]);return[a[1]+f*(b[1]-a[1]),a[2]+f*(b[2]-a[2]),a[3]+f*(b[3]-a[3])];}return[192,57,43];}
function drawHeat(cv,cf){const x=cv.getContext("2d"),im=x.createImageData(365,24);for(let h=0;h<8760;h++){const day=h/24|0,hod=h%24;if(day>364)break;const c=cfColor(cf[h]),i=(hod*365+day)*4;im.data[i]=c[0];im.data[i+1]=c[1];im.data[i+2]=c[2];im.data[i+3]=255;}x.putImageData(im,0,0);}
function profileArr(cf){const o=Array(24).fill(0),n=Array(24).fill(0);for(let h=0;h<8760;h++){o[h%24]+=cf[h];n[h%24]++;}return o.map((v,i)=>n[i]?v/n[i]:0);}
function heatTip(cv,cf,label){const at=(cx,cy)=>{const r=cv.getBoundingClientRect();
 const day=Math.floor((cx-r.left)/r.width*365),hod=Math.floor((cy-r.top)/r.height*24);
 if(day<0||day>364||hod<0||hod>23){hideTip();return;}const dt=new Date(2023,0,1);dt.setDate(day+1);
 posTipXY(`<b>${label}</b><br>${MONTHS[dt.getMonth()]} ${dt.getDate()}, ${("0"+hod).slice(-2)}:00 &middot; CF ${Math.round(cf[day*24+hod])}%`,cx,cy);};
 cv.onmousemove=e=>at(e.clientX,e.clientY);cv.onmouseleave=hideTip;bindTouchTip(cv,at);}
// hours-by-CF distribution as a fine line: integer CF bins 0..100 (101 pts).
function cfLine(cf){const b=new Array(101).fill(0);for(let i=0;i<cf.length;i++){let k=Math.round(cf[i]);if(k<0)k=0;if(k>100)k=100;b[k]++;}return b;}
// CF distribution line chart (model vs CAMPD, hours per CF point) with the
// offer-curve tranche boundaries drawn as labelled vertical markers.
function cfLineChart(model,campd,bands,vw,vh){const L=52,R=14,TTv=18,B=40,pw=vw-L-R,ph=vh-TTv-B;
 const svg=svgEl(vw,vh);const ymax=Math.max(1,...model,...campd)*1.12;
 const X=c=>L+pw*Math.min(Math.max(c,0),100)/100,Y=v=>TTv+ph*(1-Math.min(Math.max(v,0),ymax)/ymax);
 const g=mk("g",{"font-size":12,fill:"#8a93a0"});
 for(let i=0;i<=4;i++){const y=TTv+ph*i/4;g.appendChild(mk("line",{x1:L,y1:y,x2:vw-R,y2:y,stroke:"#eef1f4"}));g.appendChild(mk("text",{x:L-7,y:y+4,"text-anchor":"end"},Math.round(ymax*(1-i/4))));}
 for(let c=0;c<=100;c+=10){g.appendChild(mk("text",{x:X(c),y:vh-14,"text-anchor":"middle"},c));}
 g.appendChild(mk("text",{x:L+pw/2,y:vh-1,"text-anchor":"middle","font-size":11,fill:"#6b7480"},"capacity factor (%)"));
 svg.appendChild(g);
 // tranche markers (drawn under the lines): a dashed vertical at each band's
 // lower CF edge with a price tag for the heat-rate multiplier priced there.
 (bands||[]).forEach((bd,i)=>{const x=X(bd.cf_lo);
  svg.appendChild(mk("line",{x1:x,y1:TTv,x2:x,y2:TTv+ph,stroke:"#aab2bd","stroke-width":1,"stroke-dasharray":"3 3"}));
  const tag=bd.vom?"VOM":(bd.mult!=null?bd.mult.toFixed(2)+"×":"");
  const txt=bd.name+(tag?" "+tag:""),tw=txt.length*5.6+8,ty=TTv+4+(i%3)*15;
  let tx=x+3;if(tx+tw>vw-R)tx=x-tw-3;if(tx<L)tx=L+1;
  svg.appendChild(mk("rect",{x:tx,y:ty,width:tw,height:13,rx:3,fill:"#1a2233",opacity:0.85}));
  svg.appendChild(mk("text",{x:tx+4,y:ty+10,"font-size":9.5,fill:"#fff"},txt));});
 const path=arr=>arr.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
 svg.appendChild(mk("path",{d:path(campd),fill:"none",stroke:"#647184","stroke-width":2.6}));
 svg.appendChild(mk("path",{d:path(model),fill:"none",stroke:"#4A90D9","stroke-width":2.2,"stroke-dasharray":"4 3"}));
 const guide=mk("line",{y1:TTv,y2:TTv+ph,stroke:"#c3ccd6","stroke-width":1,opacity:0});svg.appendChild(guide);
 const at=(cx,cy)=>{const r=svg.getBoundingClientRect();let c=Math.round((cx-r.left)/r.width*vw-L)/pw*100;
  c=Math.min(Math.max(Math.round(c),0),100);guide.setAttribute("x1",X(c));guide.setAttribute("x2",X(c));guide.setAttribute("opacity",0.6);
  const bd=(bands||[]).slice().reverse().find(b=>c>=b.cf_lo);
  const band=bd?`<br><span style=color:#aab2bd>▮</span> ${bd.name} ${bd.vom?"(VOM)":(bd.mult!=null?bd.mult.toFixed(2)+"×":"")}`:"";
  posTipXY(`<b>CF ${c}%</b><br><span style=color:#4A90D9>●</span> Model: ${model[c]} h<br><span style=color:#647184>●</span> CAMPD: ${campd[c]} h${band}`,cx,cy);};
 svg.addEventListener("mousemove",e=>at(e.clientX,e.clientY));
 svg.addEventListener("mouseleave",()=>{hideTip();guide.setAttribute("opacity",0);});
 bindTouchTip(svg,at);return svg;}

 let h='<div class=panel><h2>Fuel totals vs EIA-930 <span class=psub>(system-wide; 930 not zonal)</span></h2><div class=tablewrap><table><thead><tr><th>fuel</th><th>model TWh</th><th>EIA-930</th><th>Δ</th><th>r</th><th>NRMSE</th></tr></thead><tbody>';

 return h+'</tbody></table></div></div>';}

 // KPI cards per run
 h+='<div class=panel><h2>Capture & deviation — '+META.groupLabel[grp]+' · '+yr+'</h2>'

   <div class=kpirow><span class=k>Hourly r</span><span class=v>${m.r.toFixed(3)}</span></div>

 h+="</div></div>";

 document.getElementById("content").innerHTML=h;
 // monthly

 const sets=ids.map((id,i)=>{const a=new Array(12).fill(0);plantsOf(id,yr,grp).forEach(c=>MODEL[id].years[yr].plants[c].m_mon.forEach((v,k)=>a[k]+=v));return {pts:a,color:RC[i%5],name:MODEL[id].label,dash:"4 3"};});
 sets.push({pts:camp,color:"#647184",name:"CAMPD",w:3});
 const ymax=Math.max(1,...sets.flatMap(s=>s.pts))*1.15;
 document.getElementById("cMon").appendChild(lineChart(sets,ymax,MONTHS,"",760,300));
 document.getElementById("legMon").innerHTML=sets.map(s=>`<span><i class=swatch style="border-top-color:${s.color}"></i>${s.name}</span>`).join("");
 // annual bars
 const bs=ids.map((id,i)=>{let v=0;plantsOf(id,yr,grp).forEach(c=>v+=MODEL[id].years[yr].plants[c].m_ann);return {label:MODEL[id].label.slice(0,10),v,color:RC[i%5]};});
 let cA=0,eA=0;if(B)plantsOf(ids[0],yr,grp).forEach(c=>{cA+=B.plants[c].c_ann;eA+=B.plants[c].e_ann;});
 bs.push({label:"CAMPD",v:cA,color:"#647184"});bs.push({label:"EIA-923",v:eA,color:"#2ECC71"});

// ---- render: SINGLE deep-dive ----
function singleSeries(id,yr,grp,plant){const B=BENCH[yr],M=MODEL[id].years[yr];
 if(plant&&plant!=="agg"&&M.plants[plant]){const b=B.plants[plant],mp=M.plants[plant];
  return {mcf:dec(mp.m),ccf:dec(b.campd),npl:b.npl,name:b.name+" · "+b.zone,m_ann:mp.m_ann,c_ann:b.c_ann,e_ann:b.e_ann,r:mp.r,nr:mp.nrmse,cap:mp.cap,m_mon:mp.m_mon,c_mon:b.c_mon,e_mon:b.e_mon};}
 const a=aggMW(id,yr,grp);const ps=plantsOf(id,yr,grp);let npl=0;ps.forEach(c=>npl+=B.plants[c].npl);
 const mcf=new Float32Array(T),ccf=new Float32Array(T);for(let i=0;i<T;i++){mcf[i]=npl>0?100*a.mm[i]/npl:0;ccf[i]=npl>0?100*a.cc[i]/npl:0;}
 const m_mon=Array(12).fill(0),c_mon=Array(12).fill(0),e_mon=Array(12).fill(0);
 ps.forEach(c=>{M.plants[c].m_mon.forEach((v,i)=>m_mon[i]+=v);B.plants[c].c_mon.forEach((v,i)=>c_mon[i]+=v);B.plants[c].e_mon.forEach((v,i)=>e_mon[i]+=v);});
 const mt=classMetrics(id,yr,grp);return {mcf,ccf,npl,name:META.groupLabel[grp]+" (aggregate)",m_ann:a.mA,c_ann:a.cA,e_ann:a.eA,r:mt?+mt.r.toFixed(3):null,nr:mt?+mt.nr.toFixed(3):null,cap:mt?mt.m1:null,m_mon,c_mon,e_mon};}

  +`<div class=kpicard><div class=lbl>Fit</div>

    <div class=kpirow><span class=k>Hourly r</span><span class=v>${d.r??"—"}</span></div>
    <div class=kpirow><span class=k>NRMSE</span><span class=v>${d.nr??"—"}</span></div>
    <div class=kpirow><span class=k>Avg LMP (zones)</span><span class=v>${avgLMP(id,yr)==null?"—":"$"+avgLMP(id,yr).toFixed(1)+"/MWh"}</span></div></div></div></div>`;
 h+='<div class=panel><h2>Commitment heatmap</h2><div class=legend><span>0%</span><span class=ramp></span><span>100% CF</span></div>'
  +'<h4>CAMPD actual</h4><canvas class=heat id=hC width=365 height=24></canvas><div class=ax id=axC></div>'
  +'<h4>Model</h4><canvas class=heat id=hM width=365 height=24></canvas><div class=ax id=axM></div></div>';
 h+='<div class=panel><h2>Average daily profile (CF%)</h2><div class=legend><span><i class=swatch style="border-top-color:#647184"></i>CAMPD</span><span><i class=swatch style="border-top-color:#4A90D9"></i>Model</span></div><div class=svgbox id=sProf></div></div>';
 h+='<div class=panel><h2>Hours at each capacity factor</h2><p class=psub>Vertical markers are this plant\'s offer-curve tranche boundaries; the tag is the heat-rate multiplier priced from that CF up. Pick a single plant for markers.</p><div class=legend><span><i class=swatch style="border-top-color:#647184"></i>CAMPD</span><span><i class=swatch style="border-top-color:#4A90D9"></i>Model</span></div><div class=svgbox id=sHist></div></div>';
 h+='<div class=panel><h2>Monthly (GWh)</h2><div class=svgbox id=sMon></div></div>';
 document.getElementById("content").innerHTML=h;
 const psel=document.getElementById("plantSel");
 psel.innerHTML=`<option value=agg>Aggregate (${ps.length} plants)</option>`+ps.map(c=>`<option value=${c}>${BENCH[yr].plants[c].name} · ${BENCH[yr].plants[c].zone}</option>`).join("");
 psel.value=st.plant;psel.onchange=()=>{st.plant=psel.value;renderSingleCharts();};
 const hC=document.getElementById("hC"),hM=document.getElementById("hM");
 drawHeat(hC,d.ccf);drawHeat(hM,d.mcf);heatTip(hC,d.ccf,"CAMPD actual");heatTip(hM,d.mcf,"Model");
 const trp=(st.plant&&st.plant!=="agg")?(MODEL[id].years[yr].plants[st.plant]||{}).tr||null:null;
 document.getElementById("sHist").appendChild(cfLineChart(cfLine(d.mcf),cfLine(d.ccf),trp,760,300));
 document.getElementById("axC").innerHTML=document.getElementById("axM").innerHTML=MONTHS.map(m=>`<span>${m}</span>`).join("");
 const pc=profileArr(d.ccf),pm=profileArr(d.mcf),xl=Array(24).fill("");[0,6,12,18,23].forEach(hh=>xl[hh]=("0"+hh).slice(-2));
 document.getElementById("sProf").appendChild(lineChart([{pts:pc,color:"#647184",name:"CAMPD",w:3},{pts:pm,color:"#4A90D9",name:"Model",dash:"4 3"}],Math.max(40,...pc,...pm)*1.1,xl,"%",760,300));
 const ms=[{pts:d.c_mon,color:"#647184",name:"CAMPD",w:3},{pts:d.m_mon,color:"#4A90D9",name:"Model",dash:"4 3"}];
 document.getElementById("sMon").appendChild(lineChart(ms,Math.max(1,...d.c_mon,...d.m_mon)*1.15,MONTHS,"",760,300));
 wireTips(document.getElementById("content"));}
function renderSingleTables(){const id=st.single,yr=st.year;
 let h=genMixPanel([id],yr)+singleFuelTable(id,yr)+singleFossilTable(id,yr);
 h+='<div class=panel><h2>Per-plant fit vs CAMPD / EIA-923 — '+yr+'</h2><div class=tablewrap><table><thead><tr><th>plant</th><th>class</th><th>zone</th><th>r</th><th>NRMSE</th><th>capture%</th><th>Δ923%</th></tr></thead><tbody>';
 const B=BENCH[yr],M=MODEL[id].years[yr];
 const codes=Object.keys(M.plants).filter(c=>B.plants[c]&&st.zones.has(B.plants[c].zone)).sort((a,b)=>B.plants[a].group.localeCompare(B.plants[b].group)||B.plants[b].npl-B.plants[a].npl);
 for(const c of codes){const b=B.plants[c],mp=M.plants[c];const d=b.e_ann>0.001?100*(mp.m_ann-b.e_ann)/b.e_ann:null;
  h+=`<tr><td>${b.name}</td><td>${META.groupLabel[b.group]||b.group}</td><td>${b.zone}</td><td class=num>${mp.r??"—"}</td><td class=num>${mp.nrmse??"—"}</td><td class=num>${mp.cap==null?"—":mp.cap.toFixed(0)}</td><td class="num ${d==null?'':dcls(d)}">${d==null?"—":d.toFixed(0)}</td></tr>`;}
 h+='</tbody></table></div>'+narrative([id])+'</div>';
 document.getElementById("content").innerHTML=h;wireTips(document.getElementById("content"));}
// ---- shell render ----
function render(){const ids=selectedRuns().filter(Boolean);if(!ids.length){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Select a run.</p></div>';return;}
 ensureRuns(ids).then(()=>{
  if(st.mode==="single"){st.classWrap=true;if(st.page==="charts")renderSingleCharts();else renderSingleTables();}
  else{if(st.page==="charts")renderCompareCharts();else renderCompareTables();}
 }).catch(e=>{document.getElementById("diag").style.display="block";document.getElementById("diag").textContent="Load error: "+(e.message||e);});}
function runSummary(){if(st.mode==="single"){const m=META_RUN(st.single);return m?m.label:"Pick a run";}
 const n=st.runs.length;return n?n+" run"+(n>1?"s":"")+" selected":"Pick runs";}
function isoRuns(){return BC.manifest.filter(m=>(m.iso||"ERCOT")===st.iso);}
function buildRunList(){const single=st.mode==="single";
 const runBtn=document.getElementById("runBtn"),runPop=document.getElementById("runPop");
 document.getElementById("runHdr").textContent=single?"Run":"Runs (max 5)";
 runBtn.textContent=runSummary()+"  ▾";
 runPop.innerHTML=isoRuns().map(m=>{const checked=single?(st.single===m.id):st.runs.includes(m.id);
  return `<label class=runopt><input type=${single?"radio":"checkbox"} name=run value="${m.id}" ${checked?"checked":""}>
   <span>${m.label} <span class=rid data-rid="${m.id}">${m.shorthand}</span></span></label>`;}).join("");
 runPop.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
  if(single){st.single=inp.value;runPop.classList.add("hide");}
  else{const set=new Set(st.runs);if(inp.checked){if(set.size>=5){inp.checked=false;return;}set.add(inp.value);}else set.delete(inp.value);st.runs=[...set];}
  runBtn.textContent=runSummary()+"  ▾";render();});
 wireTips(runPop);}
function build(){
 document.getElementById("modeSel").onclick=e=>{const m=e.target.dataset.m;if(!m)return;st.mode=m;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));buildRunList();render();};
 document.getElementById("pageSel").onclick=e=>{const p=e.target.dataset.p;if(!p)return;st.page=p;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.p===p));render();};
 const ysel=document.getElementById("yearSel");ysel.innerHTML=META.years.map(y=>`<button data-y=${y} class=${y==st.year?"on":""}>${y}</button>`).join("");
 ysel.onclick=e=>{if(!e.target.dataset.y)return;st.year=+e.target.dataset.y;[...ysel.children].forEach(b=>b.classList.toggle("on",+b.dataset.y===st.year));render();};
 const csel=document.getElementById("classSel");csel.innerHTML=META.groups.map(g=>`<option value="${g}">${META.groupLabel[g]}</option>`).join("");
 csel.value=st.klass;csel.onchange=()=>{st.klass=csel.value;render();};
 const zsel=document.getElementById("zoneSel");zsel.innerHTML=`<span class="chip on" data-z=__all>All</span>`+META.zones.map(z=>`<span class="chip on" data-z="${z}">${z}</span>`).join("");
 zsel.onclick=e=>{const z=e.target.dataset.z;if(!z)return;
  if(z==="__all")st.zones=new Set(META.zones);else{if(st.zones.has(z))st.zones.delete(z);else st.zones.add(z);if(!st.zones.size)st.zones=new Set(META.zones);}
  [...zsel.children].forEach(c=>{const zz=c.dataset.z;c.classList.toggle("on",zz==="__all"?st.zones.size===META.zones.length:st.zones.has(zz));});
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);render();};
 const runBtn=document.getElementById("runBtn"),runPop=document.getElementById("runPop");
 runBtn.onclick=e=>{e.stopPropagation();runPop.classList.toggle("hide");};
 document.addEventListener("click",e=>{if(!e.target.closest("#runPop")&&e.target!==runBtn)runPop.classList.add("hide");});
 buildRunList();render();}
async function selectIso(iso){
  st.iso=iso;
  META=window.BC.meta[iso];
  BENCH=await inflate(window.BC.benchGz[iso]);
  const runs=isoRuns(),first=runs[0];
  st.runs=first?[first.id]:[];st.single=first?first.id:null;
  st.year=META.years[0];st.zones=new Set(META.zones);
  st.klass=META.groups[0];st.plant="agg";
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);
  Object.keys(_eAllC).forEach(k=>delete _eAllC[k]);
  Object.keys(_mAllC).forEach(k=>delete _mAllC[k]);
  [...document.getElementById("isoSel").children].forEach(b=>b.classList.toggle("on",b.dataset.iso===iso));
  build();
}
async function boot(){try{
  const isos=Object.keys(window.BC.meta);
  const isoSel=document.getElementById("isoSel");
  isoSel.innerHTML=isos.map(i=>`<button data-iso="${i}">${i}</button>`).join("");
  isoSel.onclick=e=>{if(e.target.dataset.iso&&e.target.dataset.iso!==st.iso)selectIso(e.target.dataset.iso);};
  st={mode:"compare",runs:[],single:null,year:0,zones:new Set(),page:"charts",klass:"",plant:"agg",iso:null};
  document.getElementById("diag").style.display="none";
  await selectIso(isos.includes("ERCOT")?"ERCOT":isos[0]);
 }catch(e){const d=document.getElementById("diag");d.style.display="block";d.style.color="#c01c28";d.textContent="Init error: "+((e&&e.message)||e)+" "+((e&&e.stack)||"");}}
boot();
</script></body></html>
