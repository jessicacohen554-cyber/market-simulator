 .seg{flex:1}.bc-top select{flex:1}
 .kpigrid{grid-template-columns:1fr}.svgbox{margin:0 -4px}}

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="frontend/data/backcast/manifest.js"></script><script src="frontend/data/backcast/benchmark.js"></script>
<script>
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const RC=["#4A90D9","#2ECC71","#9B59B6","#E67E22","#E74C3C"];
const NS="http://www.w3.org/2000/svg",T=8760;
// Neutral deadband half-width for the volume-error heatmap: a cell whose
// |signed % error| <= TOLERANCE_PCT renders neutral gray. Default 0.02; the
// spec target (model-methodology-spec.md) is 0.05.
const TOLERANCE_PCT=0.02;
let META,BENCH,MODEL={},st,SUB_BASE=null;
// ISO color token for the active-market chrome (toggle, header badge), with a
// neutral fallback for any ISO not in the canonical palette.
function isoColorVar(iso){return `var(--iso-${String(iso).toLowerCase()},var(--iso-default))`;}
function isoRunCount(iso){return BC.manifest.filter(m=>(m.iso||"ERCOT")===iso).length;}
function inflate(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("browser lacks DecompressionStream — use a current browser"));
 return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()
  .then(ab=>JSON.parse(new TextDecoder().decode(ab)));}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("failed to load "+src));document.head.appendChild(s);});}
async function ensureRuns(ids){for(const id of ids){if(MODEL[id])continue;
  try{
    if(!window.BC.runGz||!window.BC.runGz[id]){const m=META_RUN(id);if(!m)continue;await loadScript(m.file);}
    if(window.BC.runGz&&window.BC.runGz[id])MODEL[id]=await inflate(window.BC.runGz[id]);
  }catch(e){console.warn("skipping run "+id+": "+(e&&e.message||e));}}}
function META_RUN(id){return BC.manifest.find(r=>r.id===id);}
function dec(b){const s=atob(b),a=new Float32Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function pearson(m,o){let mm=0,oo=0,n=m.length;for(let i=0;i<n;i++){mm+=m[i];oo+=o[i];}mm/=n;oo/=n;let a=0,b=0,c=0;for(let i=0;i<n;i++){const x=m[i]-mm,y=o[i]-oo;a+=x*y;b+=x*x;c+=y*y;}const d=Math.sqrt(b*c);return d>0?a/d:0;}
function nrmse(m,o){let s=0,om=0,n=m.length;for(let i=0;i<n;i++){s+=(m[i]-o[i])**2;om+=o[i];}om/=n;return om>0?Math.sqrt(s/n)/om:9.9;}
function capScore(r,nr,dev){return 100*Math.cbrt(Math.max(0,r)*Math.max(0,1-nr)*Math.max(0,1-Math.abs(dev)));}
function plantsOf(id,year,grp){const M=MODEL[id].years[year],B=BENCH[year];if(!M||!B)return [];
 return Object.keys(M.plants).filter(c=>{const b=B.plants[c];return b&&b.group===grp&&st.zones.has(b.zone);});}
const _aggC={},_eAllC={};
// Full EIA-923 class total (all 923 plants of the class), allocated to the
// selected zones by the matched plants' EIA-923 distribution: the matched set
// understates the class (e.g. CC_REGULAR ~138 of 145 TWh), so the zonal Δ-vs-
// 923 is scaled to the full class total rather than the matched subtotal.
function matchedEAnnAll(year,grp){const k=year+"|"+grp;if(_eAllC[k]!=null)return _eAllC[k];
 const B=BENCH[year];let s=0;for(const c in B.plants){if(B.plants[c].group===grp)s+=B.plants[c].e_ann;}return _eAllC[k]=s;}
function classBench923(year,grp,eAzones){const B=BENCH[year];
 const cf=B.classFull?B.classFull[grp]:null,eAll=matchedEAnnAll(year,grp);
 return (cf!=null&&eAll>0)?cf*(eAzones/eAll):eAzones;}
// Model class total scaled the same way: the full grid-LP+BTM class total
// (gmModel) allocated to the selected zones by the matched plants' model
// distribution — so the Δ-vs-923 compares full class to full class (matched
// model vs full 923 would understate the model and exaggerate the shortfall).
const _mAllC={};
function matchedMAnnAll(id,year,grp){const k=id+"|"+year+"|"+grp;if(_mAllC[k]!=null)return _mAllC[k];
 const M=MODEL[id].years[year],B=BENCH[year];let s=0;
 for(const c in M.plants){if(B.plants[c]&&B.plants[c].group===grp)s+=M.plants[c].m_ann;}return _mAllC[k]=s;}
function classModelFull(id,year,grp,mAzones){const gm=(MODEL[id].years[year].gmModel||{})[grp],mAll=matchedMAnnAll(id,year,grp);
 return (gm!=null&&mAll>0)?gm*(mAzones/mAll):mAzones;}
function aggMW(id,year,grp){const key=id+"|"+year+"|"+grp+"|"+[...st.zones].sort().join(",");
 if(_aggC[key])return _aggC[key];const M=MODEL[id].years[year],B=BENCH[year];
 const mm=new Float32Array(T),cc=new Float32Array(T);let mA=0,cA=0,eA=0,bA=0;
 for(const c of plantsOf(id,year,grp)){const b=B.plants[c],npl=b.npl,md=dec(M.plants[c].m),cd=dec(b.campd);
  for(let i=0;i<T;i++){mm[i]+=md[i]*npl/100;cc[i]+=cd[i]*npl/100;}
  mA+=M.plants[c].m_ann;cA+=b.c_ann;eA+=b.e_ann;bA+=(b.btm||0);}
 return _aggC[key]={mm,cc,mA,cA,eA,bA};}
function classMetrics(id,year,grp){const ps=plantsOf(id,year,grp);if(!ps.length)return null;
 const a=aggMW(id,year,grp);const r=pearson(a.mm,a.cc),nr=nrmse(a.mm,a.cc),dev=a.cA>0?(a.mA-a.cA)/a.cA:0;
 const m1=a.cc.reduce((s,v)=>s+v,0)>0?capScore(r,nr,dev):null;
 const M=MODEL[id].years[year];let ws=0,cs=0;for(const c of ps){const w=BENCH[year].plants[c].npl,cp=M.plants[c].cap;if(cp!=null){ws+=w;cs+=w*cp;}}
 return {m1,m2:ws>0?cs/ws:null,r,nr,dev,mA:a.mA,mFull:classModelFull(id,year,grp,a.mA),cA:a.cA,eA:a.eA,bench923:classBench923(year,grp,a.eA),n:ps.length};}
function avgLMP(id,year){const L=(MODEL[id].years[year]||{}).lmp||{};let pd=0,d=0;
 for(const z in L){if(!st.zones.has(z))continue;pd+=L[z].p*L[z].d;d+=L[z].d;}
 return d>0?pd/d:null;}
function dcls(d){const a=Math.abs(d);return a<5?"good":a<15?"ok":"bad";}
function ppcls(d){const a=Math.abs(d);return a<1?"good":a<3?"ok":"bad";}
function fmtPct(d){return (d>=0?"+":"")+d.toFixed(1)+"%";}
function fmtpp(d){return (d>=0?"+":"")+d.toFixed(1);}
// ---- generation mix (system-wide; matches the calibration [3b] analysis) ----
// Model total per fossil class = grid LP + behind-the-meter must-run (gmModel);
// actual = full EIA-923 (classFull). Shows each class's share of TOTAL
// generation and of FOSSIL generation, plus the model's pp deviation from the
// actual fossil share. Non-fossil rows (nuclear/wind/solar) give the share of
// total generation only. Zone-independent: 923/930 totals are system-wide.
function mixLabel(g){return META.groupLabel[g]||({ST_CHP:"Steam Gas CHP"}[g])||g;}
function genMixData(id,yr){const B=BENCH[yr];const gm=(MODEL[id].years[yr]||{}).gmModel||{};
 const nf=(MODEL[id].years[yr]||{}).nonfossil||{};
 const mFos=Object.keys(B.classFull).reduce((s,g)=>s+(gm[g]||0),0);
 const mGen=mFos+(nf.nuclear||0)+(nf.wind||0)+(nf.solar||0);
 return {gm,nf,mFos,mGen};}
function genMixPanel(ids,yr){const B=BENCH[yr];if(!B||!B.classFull)return "";
 const cf=B.classFull,e930=B.e930||{},FG=Object.keys(cf);
 const aFos=FG.reduce((s,g)=>s+(cf[g]||0),0);
 const aGen=aFos+(e930.nuclear||0)+(e930.wind||0)+(e930.solar||0);
 const D={};ids.forEach(id=>D[id]=genMixData(id,yr));
 const single=ids.length===1;
 let h='<div class=panel><h2>Generation mix <span class=psub>(system-wide; share of total &amp; of fossil generation vs full EIA-923)</span></h2>';
 h+=`<p class=psub>Actual fossil ${aFos.toFixed(1)} TWh of ${aGen.toFixed(1)} TWh total`
   +ids.map(id=>` · ${MODEL[id].label} fossil ${D[id].mFos.toFixed(1)} TWh`).join("")+`</p>`;
 h+='<div class=tablewrap><table><thead><tr><th>class</th>';
 if(single){const id=ids[0];
  h+='<th>model TWh</th><th>actual TWh</th><th>model %gen</th><th>actual %gen</th>'
   +'<th>model %fos</th><th>actual %fos</th><th>Δpp</th></tr></thead><tbody>';
  for(const g of FG){const a_f=100*(cf[g]||0)/aFos,a_g=100*(cf[g]||0)/aGen;
   const m=D[id].gm[g]||0,m_f=D[id].mFos>0?100*m/D[id].mFos:0,m_g=D[id].mGen>0?100*m/D[id].mGen:0,dpp=m_f-a_f;
   h+=`<tr><td>${mixLabel(g)}</td><td class=num>${m.toFixed(2)}</td><td class=num>${(cf[g]||0).toFixed(2)}</td>`
     +`<td class=num>${m_g.toFixed(1)}</td><td class=num>${a_g.toFixed(1)}</td>`
     +`<td class=num>${m_f.toFixed(1)}</td><td class=num>${a_f.toFixed(1)}</td>`
     +`<td class="num ${ppcls(dpp)}">${fmtpp(dpp)}</td></tr>`;}
  h+=`<tr class=sub><td>Fossil total</td><td class=num>${D[id].mFos.toFixed(2)}</td><td class=num>${aFos.toFixed(2)}</td>`
    +`<td class=num>${(100*D[id].mFos/D[id].mGen).toFixed(1)}</td><td class=num>${(100*aFos/aGen).toFixed(1)}</td>`
    +`<td class=num>100.0</td><td class=num>100.0</td><td class=num></td></tr>`;
  for(const f of ["nuclear","wind","solar"]){const a_g=100*(e930[f]||0)/aGen,m=D[id].nf[f]||0,m_g=D[id].mGen>0?100*m/D[id].mGen:0;
   h+=`<tr><td>${f}</td><td class=num>${m.toFixed(2)}</td><td class=num>${(e930[f]||0).toFixed(2)}</td>`

// ---- render: SUMMARY ----
// Reuses classMetrics (the same model-full vs full-EIA-923 Δ923 shown in the
// detail tables and KPI cards) — no recompute of any LP/dispatch result. Signed
// % error per fossil class = (model − actual)/actual; a class is in tolerance
// within ±SUM_TOL_PCT% OR SUM_TOL_TWH absolute (zone-aware, since classMetrics
// honors st.zones). This is looser than the per-cell heatmap's TOLERANCE_PCT.
const SUM_NOPLOT='<p class=psub>Plotly failed to load — this view needs network access to the Plotly CDN.</p>';
function orderRuns(ids){const order=BC.manifest.map(m=>m.id);
 return ids.slice().sort((a,b)=>order.indexOf(a)-order.indexOf(b));}
// System-wide model & actual TOTAL generation (TWh): model = grid-LP + BTM
// fossil + non-fossil; actual = full EIA-923 fossil + EIA-930 nuclear/wind/solar.
// The share criterion is zone-independent — non-fossil totals carry no zonal
// split, so "share of total generation" is necessarily system-wide.
function totalGen(id,yr){const B=BENCH[yr];if(!B||!B.classFull)return null;
 const D=genMixData(id,yr),e930=B.e930||{};
 const aFos=Object.keys(B.classFull).reduce((s,g)=>s+(B.classFull[g]||0),0);
 const aGen=aFos+(e930.nuclear||0)+(e930.wind||0)+(e930.solar||0);
 return (D.mGen>0&&aGen>0)?{mGen:D.mGen,aGen}:null;}
// Signed share-of-total-generation deviation (pp): a class's share of total
// MODEL generation minus its share of total ACTUAL generation. mCls/aCls are
// the system-wide class totals (TWh). null when totals are unavailable (treated
// as a pass by shareInTol so a class can't fail on missing data).
function sharePP(id,yr,mCls,aCls){const T=totalGen(id,yr);if(!T)return null;
 return 100*mCls/T.mGen-100*aCls/T.aGen;}
// The generation-mix accuracy test spans every benchmarked class: the fossil
// classes (zone-aware, model grid+BTM vs full EIA-923) plus the non-fossil
// fuels (system-wide, model vs EIA-930). EIA-930 carries no separate geothermal
// series (it folds into "other"), so only nuclear/wind/solar have an actual.
const NONFOSSIL_FUELS=["nuclear","wind","solar"];
function isNonFos(g){return NONFOSSIL_FUELS.includes(g);}
function allClasses(){return META.groups.concat(NONFOSSIL_FUELS);}
function classLabel(g){return isNonFos(g)?g[0].toUpperCase()+g.slice(1):mixLabel(g);}
// Fossil class error: zone-aware volume (model-full vs full EIA-923) + the
// system-wide generation-share deviation (full system class totals gmModel /
// classFull, not the zone-allocated mFull/bench923).
function classErr(id,yr,grp){const m=classMetrics(id,yr,grp);
 if(!m||!(m.bench923>0.02))return null;
 const mSys=((MODEL[id].years[yr].gmModel||{})[grp])||0,aSys=((BENCH[yr].classFull||{})[grp])||0;
 return {grp,err:100*(m.mFull-m.bench923)/m.bench923,mFull:m.mFull,bench923:m.bench923,sharePP:sharePP(id,yr,mSys,aSys)};}
// Non-fossil class error (system-wide; EIA-930 actual). Same shape as a fossil
// classErr so the tolerance test treats every class uniformly; nonfos flags it
// so the system-error KPI stays fossil-only and labels can mark it system-wide.
function nonFosErr(id,yr,fuel){const av=((BENCH[yr]||{}).e930||{})[fuel],mv=((MODEL[id].years[yr]||{}).nonfossil||{})[fuel];
 const a=av||0,m=mv||0;if(!(a>0.02))return null;
 return {grp:fuel,nonfos:true,err:100*(m-a)/a,mFull:m,bench923:a,sharePP:sharePP(id,yr,m,a)};}
function anyErr(id,yr,g){return isNonFos(g)?nonFosErr(id,yr,g):classErr(id,yr,g);}
function classErrs(id,yr){const out=[];for(const g of allClasses()){const e=anyErr(id,yr,g);if(e)out.push(e);}return out;}
// Summary-page class tolerance. A fossil class passes only when BOTH hold:
//  (1) volume: signed error within ±SUM_TOL_PCT% OR the absolute miss within
//      SUM_TOL_TWH of actual (small classes can be off by a larger % while
//      still within a TWh, so the dual band keeps them from dominating); and
//  (2) share: its share of TOTAL generation is within SUM_TOL_SHARE_PP
//      percentage points of the actual share — so a class can't pass on volume
//      alone while still misrepresenting the generation mix.
const SUM_TOL_PCT=5,SUM_TOL_TWH=1.0,SUM_TOL_SHARE_PP=1.5;
function volInTol(e,k){return Math.abs(e.err)<=k*SUM_TOL_PCT||Math.abs(e.mFull-e.bench923)<=k*SUM_TOL_TWH;}
function shareInTol(e,k){return e.sharePP==null||Math.abs(e.sharePP)<=k*SUM_TOL_SHARE_PP;}
function classInTol(e){return volInTol(e,1)&&shareInTol(e,1);}
// Per-class status: good = in tolerance (both bands); ok = within twice both
// bands; bad otherwise. clsTol takes the class-error object; tolcls takes a
// bare % (for the system-level error, where 1 TWh on a multi-hundred-TWh total
// is never the binding band and there is no single class share to test).
function clsTol(e){return classInTol(e)?"good":(volInTol(e,2)&&shareInTol(e,2))?"ok":"bad";}
function tolcls(v){const a=Math.abs(v);return a<=SUM_TOL_PCT?"good":a<=2*SUM_TOL_PCT?"ok":"bad";}
function summaryHeadline(id,yr){const es=classErrs(id,yr);
 // System volume error stays fossil-only (Σ model vs Σ full EIA-923); the
 // in-tolerance count and worst class span every class incl. non-fossil.
 let sm=0,sa=0,worst=null;
 es.forEach(e=>{if(!e.nonfos){sm+=e.mFull;sa+=e.bench923;}if(!worst||Math.abs(e.err)>Math.abs(worst.err))worst=e;});
 return {n:es.length,inTol:es.filter(classInTol).length,
  sysErr:sa>0?100*(sm-sa)/sa:null,worst,price:avgLMP(id,yr)};}
// Actual historical avg LMP ($/MWh) for the selected year (system hub-average),
// from the benchmark payload; absent for an ISO-year with no price file.
function actualLMP(yr){return (BENCH[yr]||{}).avgLMP||null;}
// Model-vs-actual avg-LMP table for the summary. Model is load-weighted over the
// selected zones; actual is the system day-ahead / real-time hub average. Δ is
// (model − actual)/actual — diagnostic only, LMP is not a calibration target.
function lmpPanel(id,yr){const aL=actualLMP(yr),m=avgLMP(id,yr);
 let h='<div class=panel><h2>Average LMP — model vs actual historical '
  +'<span class=psub>(model load-weighted over selected zones; actual = system hub average)</span></h2>';
 if(m==null&&!aL)return h+'<p class=psub>No LMP data for this run/year.</p></div>';
 h+='<div class=tablewrap><table><thead><tr><th>series</th><th>$/MWh</th><th>Δ vs actual</th></tr></thead><tbody>';
 h+=`<tr><td>Model — ${MODEL[id].label} (zones)</td><td class=num>${m==null?"—":"$"+m.toFixed(2)}</td><td class=num>—</td></tr>`;
 for(const [lab,k] of [["Actual day-ahead (system)","da"],["Actual real-time (system)","rt"]]){
  const a=aL?aL[k]:null;if(a==null)continue;
  const d=(m!=null&&a)?100*(m-a)/a:null;
  h+=`<tr><td>${lab}</td><td class=num>$${a.toFixed(2)}</td><td class="num ${d==null?'':dcls(d)}">${d==null?"—":fmtPct(d)}</td></tr>`;}
 if(!aL)h+='<tr><td colspan=3 class=psub>No actual LMP benchmark for this ISO/year.</td></tr>';
 return h+'</tbody></table></div><p class=psub>Diagnostic only — LMP level is not a calibration target. '
  +'The model is a day-ahead-style energy LP (no ORDC / ancillary / scarcity adders), so some positive Δ is expected.</p></div>';}
// Tornado: classes sorted by signed % error, zero-centered, cool (--accent) for
// under / warm (--danger) for over, with the ±SUM_TOL_PCT band shaded gray.
function mountTornado(id,yr){const div=document.getElementById("sumTornado");if(!div)return;
 if(typeof Plotly==="undefined"){div.innerHTML=SUM_NOPLOT;return;}
 const es=classErrs(id,yr).slice().sort((a,b)=>b.err-a.err);
 if(!es.length){div.innerHTML='<p class=psub>No class-level error data for this run/zone selection.</p>';return;}
 const cool=cssTok('--accent','#4A90D9'),warm=cssTok('--danger','#E74C3C'),gray=cssTok('--mr','#7b8794');
 const y=es.map(e=>classLabel(e.grp)),x=es.map(e=>e.err),tol=SUM_TOL_PCT;
 const trace={type:"bar",orientation:"h",x,y,marker:{color:es.map(e=>e.err<0?cool:warm)},
  text:x.map(v=>(v>=0?"+":"")+v.toFixed(1)+"%"),textposition:"outside",cliponaxis:false,
  customdata:es.map(e=>e.sharePP==null?"n/a":(e.sharePP>=0?"+":"")+e.sharePP.toFixed(1)+"pp"),
  hovertemplate:"<b>%{y}</b><br>signed error %{x:+.1f}%<br>gen-share Δ %{customdata}<extra></extra>"};
 const ext=Math.max(tol*2,...x.map(Math.abs))*1.22;
 const layout={margin:{l:140,r:30,t:10,b:42},height:Math.max(180,es.length*44+72),bargap:0.38,
  xaxis:{title:{text:"signed % error (model − actual)"},zeroline:true,zerolinewidth:2,zerolinecolor:"#46505f",
   range:[-ext,ext],ticksuffix:"%",gridcolor:"#eef1f4"},
  yaxis:{autorange:"reversed",automargin:true,tickfont:{size:12}},
  shapes:[{type:"rect",xref:"x",yref:"paper",x0:-tol,x1:tol,y0:0,y1:1,fillcolor:gray,opacity:0.12,line:{width:0},layer:"below"}],
  paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"inherit"}};
 Plotly.react(div,[trace],layout,{displayModeBar:false,responsive:true});}
// Slope chart: one line per class (fossil + non-fossil) across runs (manifest
// order), y = signed % error, bold zero line. Classes whose |error| grew
// first→last run are drawn warm (--danger) and bold; the rest stay gray (--mr).
function mountSlope(ids,yr){const div=document.getElementById("sumSlope");if(!div)return;
 if(typeof Plotly==="undefined"){div.innerHTML=SUM_NOPLOT;return;}
 const ordered=orderRuns(ids),xl=ordered.map(id=>MODEL[id].label);
 const warm=cssTok('--danger','#E74C3C'),gray=cssTok('--mr','#7b8794');
 const traces=[],anns=[];
 for(const g of allClasses()){const ys=ordered.map(id=>{const e=anyErr(id,yr,g);return e?e.err:null;});
  const idxs=ys.map((v,i)=>v==null?-1:i).filter(i=>i>=0);if(idxs.length<2)continue;
  const fi=idxs[0],li=idxs[idxs.length-1],didGrow=Math.abs(ys[li])>Math.abs(ys[fi])+1e-6;
  const col=didGrow?warm:gray,lab=classLabel(g);
  traces.push({type:"scatter",mode:"lines+markers",x:xl,y:ys,connectgaps:true,
   line:{color:col,width:didGrow?3:1.5},marker:{size:didGrow?7:5,color:col},opacity:didGrow?1:0.55,
   hovertemplate:"<b>"+lab+"</b><br>%{x}: %{y:+.1f}%<extra></extra>"});
  anns.push({x:xl[li],y:ys[li],text:didGrow?("<b>"+lab+" ▲</b>"):lab,xanchor:"left",xshift:7,
   showarrow:false,font:{size:11,color:col}});}
 if(!traces.length){div.innerHTML='<p class=psub>Need at least two runs with class-level error data to compare.</p>';return;}
 const layout={margin:{l:56,r:150,t:10,b:42},height:Math.max(280,traces.length*8+280),showlegend:false,
  annotations:anns,xaxis:{type:"category",automargin:true,tickfont:{size:12}},
  yaxis:{title:{text:"signed % error"},ticksuffix:"%",zeroline:true,zerolinewidth:2.5,zerolinecolor:"#46505f",gridcolor:"#eef1f4"},
  paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"inherit"}};
 Plotly.react(div,traces,layout,{displayModeBar:false,responsive:true});}
function renderSummary(){const ids=selectedRuns().filter(Boolean),yr=st.year;
 if(!ids.length){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Select a run.</p></div>';return;}
 const ordered=orderRuns(ids),primary=ordered[0],multi=ids.length>1,tol=SUM_TOL_PCT;
 const H=summaryHeadline(primary,yr);
 // Avg-LMP KPI: model (zones) vs the actual day-ahead system hub average, with
 // the signed Δ. Falls back to real-time, then to a model-only card.
 const aL=actualLMP(yr),aP=aL?(aL.da!=null?aL.da:aL.rt):null,aLab=aL&&aL.da!=null?"actual DA":"actual RT";
 const pdiff=(H.price!=null&&aP)?100*(H.price-aP)/aP:null;
 const priceCard=`<div class=kpicard><div class=lbl>Avg LMP <span class=psub>(${aL?'model vs actual':'diagnostic'})</span></div>
    <div class=kpirow><span class=k>model, zones</span><span class=v>${H.price==null?"—":"$"+H.price.toFixed(1)}</span></div>`
   +(aL?`<div class=kpirow><span class=k>${aLab}, system</span><span class=v>$${aP.toFixed(1)}</span></div>
    <div class=kpirow><span class=k>Δ vs actual</span><span class="v ${pdiff==null?'':dcls(pdiff)}">${pdiff==null?"—":fmtPct(pdiff)}</span></div>`
    :`<div class=kpirow><span class=k>actual</span><span class=v>n/a</span></div>`)+`</div>`;
 let h='<div class=panel><h2>Summary — '+MODEL[primary].label+' · '+yr+'</h2>'
  +'<p class=psub>Signed volume error = (model − full EIA-923)/actual, summed over the selected zones. A class passes when it is within ±'+tol+'% <em>or</em> '+SUM_TOL_TWH+' TWh of actual generation <em>and</em> within '+SUM_TOL_SHARE_PP+'pp of its share of total generation (system-wide). Avg LMP is diagnostic only — not a calibration target.</p><div class=kpigrid>'
  +`<div class=kpicard><div class=lbl>Classes in tolerance</div>
    <div class=kpirow><span class=k>±${tol}%/${SUM_TOL_TWH} TWh &amp; ≤${SUM_TOL_SHARE_PP}pp share</span><span class="v ${H.n&&H.inTol===H.n?'good':H.inTol*2>=H.n?'ok':'bad'}">${H.inTol} / ${H.n}</span></div></div>`
  +`<div class=kpicard><div class=lbl>System volume error</div>
    <div class=kpirow><span class=k>Σmodel vs Σ923</span><span class="v ${H.sysErr==null?'':tolcls(H.sysErr)}">${H.sysErr==null?"—":fmtPct(H.sysErr)}</span></div></div>`
  +`<div class=kpicard><div class=lbl>Worst-offending class</div>
    <div class=kpirow><span class=k>${H.worst?classLabel(H.worst.grp):"—"}</span><span class="v ${H.worst?clsTol(H.worst):''}">${H.worst?fmtPct(H.worst.err):"—"}</span></div></div>`
  +priceCard
  +'</div></div>';
 h+=lmpPanel(primary,yr);
 h+='<div class=panel><h2>Volume error by class <span class=psub>(single run: '+MODEL[primary].label+'; fossil zone-aware vs EIA-923, non-fossil system-wide vs EIA-930; sorted by signed % error)</span></h2><div id=sumTornado></div>'
  +'<p class=sumband><span><i style="background:'+cssTok('--accent','#4A90D9')+'"></i>under (model &lt; actual)</span>'
  +'<span><i style="background:'+cssTok('--danger','#E74C3C')+'"></i>over (model &gt; actual)</span>'
  +'<span><i style="background:'+cssTok('--mr','#7b8794')+';opacity:.4"></i>±'+tol+'% band (pass also needs the '+SUM_TOL_TWH+' TWh band or ≤'+SUM_TOL_SHARE_PP+'pp generation-share)</span></p></div>';
 if(multi)h+='<div class=panel><h2>Run-over-run error <span class=psub>(ordered '+ordered.map(id=>MODEL[id].label).join(' → ')+'; one line per class, bold = error grew)</span></h2><div id=sumSlope></div></div>';
 const detail=st.mode==="single"?singleTablesHTML(primary,yr):compareTablesHTML(ids,yr);
 h+='<div class=panel><button class=detailtog id=detailTog type=button>Show detail ▾</button><div id=detailBox class=hide style="margin-top:var(--space-md)">'+detail+'</div></div>';
 document.getElementById("content").innerHTML=h;
 mountTornado(primary,yr);
 if(multi)mountSlope(ids,yr);
 const tog=document.getElementById("detailTog"),box=document.getElementById("detailBox");
 tog.onclick=()=>{const hidden=box.classList.toggle("hide");tog.textContent=hidden?"Show detail ▾":"Hide detail ▴";};
 wireTips(document.getElementById("content"));}
// ---- shell render ----
function render(){const ids=selectedRuns().filter(Boolean);if(!ids.length){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Select a run.</p></div>';return;}
 ensureRuns(ids).then(()=>{
  if(st.page==="summary"){renderSummary();return;}
  if(st.mode==="single"){st.classWrap=true;if(st.page==="charts")renderSingleCharts();else renderSingleTables();}
  else{if(st.page==="charts")renderCompareCharts();else renderCompareTables();}
 }).catch(e=>{document.getElementById("diag").style.display="block";document.getElementById("diag").textContent="Load error: "+(e.message||e);});}
function runSummary(){if(st.mode==="single"){const m=META_RUN(st.single);return m?m.label:"Pick a run";}
 const n=st.runs.length;return n?n+" run"+(n>1?"s":"")+" selected":"Pick runs";}
function isoRuns(){return BC.manifest.filter(m=>(m.iso||"ERCOT")===st.iso);}
function buildRunList(){const single=st.mode==="single";
 const runBtn=document.getElementById("runBtn"),runPop=document.getElementById("runPop");
 document.getElementById("runHdr").textContent=single?"Run":"Runs (max 5)";
 runBtn.textContent=runSummary()+"  ▾";
 runPop.innerHTML=isoRuns().map(m=>{const checked=single?(st.single===m.id):st.runs.includes(m.id);
  return `<label class=runopt><input type=${single?"radio":"checkbox"} name=run value="${m.id}" ${checked?"checked":""}>
   <span>${m.label} <span class=rid data-rid="${m.id}">${m.shorthand}</span></span></label>`;}).join("");
 runPop.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
  if(single){st.single=inp.value;runPop.classList.add("hide");}
  else{const set=new Set(st.runs);if(inp.checked){if(set.size>=5){inp.checked=false;return;}set.add(inp.value);}else set.delete(inp.value);st.runs=[...set];}
  runBtn.textContent=runSummary()+"  ▾";render();});
 wireTips(runPop);}
function build(){
 document.getElementById("modeSel").onclick=e=>{const m=e.target.dataset.m;if(!m)return;st.mode=m;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));buildRunList();render();};
 document.getElementById("pageSel").onclick=e=>{const p=e.target.dataset.p;if(!p)return;st.page=p;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.p===p));render();};
 const ysel=document.getElementById("yearSel");ysel.innerHTML=META.years.map(y=>`<button data-y=${y} class=${y==st.year?"on":""}>${y}</button>`).join("");
 ysel.onclick=e=>{if(!e.target.dataset.y)return;st.year=+e.target.dataset.y;[...ysel.children].forEach(b=>b.classList.toggle("on",+b.dataset.y===st.year));render();};
 const csel=document.getElementById("classSel");csel.innerHTML=META.groups.map(g=>`<option value="${g}">${META.groupLabel[g]}</option>`).join("");
 csel.value=st.klass;csel.onchange=()=>{st.klass=csel.value;render();};
 const zsel=document.getElementById("zoneSel");zsel.innerHTML=`<span class="chip on" data-z=__all>All</span>`+META.zones.map(z=>`<span class="chip on" data-z="${z}">${z}</span>`).join("");
 zsel.onclick=e=>{const z=e.target.dataset.z;if(!z)return;
  if(z==="__all")st.zones=new Set(META.zones);else{if(st.zones.has(z))st.zones.delete(z);else st.zones.add(z);if(!st.zones.size)st.zones=new Set(META.zones);}
  [...zsel.children].forEach(c=>{const zz=c.dataset.z;c.classList.toggle("on",zz==="__all"?st.zones.size===META.zones.length:st.zones.has(zz));});
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);render();};
 const runBtn=document.getElementById("runBtn"),runPop=document.getElementById("runPop");
 runBtn.onclick=e=>{e.stopPropagation();runPop.classList.toggle("hide");};
 document.addEventListener("click",e=>{if(!e.target.closest("#runPop")&&e.target!==runBtn)runPop.classList.add("hide");});
 buildRunList();render();}
// Header badge + subtitle + sidebar hint, recolored to the active market so the
// user always knows which ISO the page is showing and what else is available.
function updateIsoChrome(iso){
  const badge=document.getElementById("isoBadge");
  badge.style.setProperty("--c",isoColorVar(iso));
  badge.innerHTML=`<span class=dot></span>${iso}`;
  const n=isoRunCount(iso),sub=document.getElementById("pageSub");
  if(SUB_BASE!=null)sub.textContent=`${iso} · ${n} run${n===1?"":"s"} · ${SUB_BASE}`;
  const others=Object.keys(window.BC.meta).filter(x=>x!==iso);
  document.getElementById("isoHint").textContent=others.length
    ?("Switch market — also loaded: "+others.join(", ")):"Only this market is loaded.";
}
async function selectIso(iso){
  st.iso=iso;
  META=window.BC.meta[iso];
  BENCH=await inflate(window.BC.benchGz[iso]);
  const runs=isoRuns(),first=runs[0];
  st.runs=first?[first.id]:[];st.single=first?first.id:null;
  st.year=META.years[0];st.zones=new Set(META.zones);
  st.klass=META.groups[0];st.plant="agg";
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);
  Object.keys(_eAllC).forEach(k=>delete _eAllC[k]);
  Object.keys(_mAllC).forEach(k=>delete _mAllC[k]);
  [...document.getElementById("isoSel").children].forEach(b=>b.classList.toggle("on",b.dataset.iso===iso));
  updateIsoChrome(iso);
  build();
}
async function boot(){try{
  const isos=Object.keys(window.BC.meta);
  const isoSel=document.getElementById("isoSel");
  isoSel.innerHTML=isos.map(i=>{const n=isoRunCount(i);
    return `<button class=isobtn data-iso="${i}" style="--c:${isoColorVar(i)}">`
      +`<span class=dot></span><span class=iname>${i}</span>`
      +`<span class=icount>${n} run${n===1?"":"s"}</span></button>`;}).join("");
  isoSel.onclick=e=>{const b=e.target.closest(".isobtn");if(b&&b.dataset.iso!==st.iso)selectIso(b.dataset.iso);};
  st={mode:"compare",runs:[],single:null,year:0,zones:new Set(),page:"summary",klass:"",plant:"agg",iso:null};
  SUB_BASE=document.getElementById("pageSub").textContent;
  document.getElementById("diag").style.display="none";
  await selectIso(isos.includes("ERCOT")?"ERCOT":isos[0]);
 }catch(e){const d=document.getElementById("diag");d.style.display="block";d.style.color="#c01c28";d.textContent="Init error: "+((e&&e.message)||e)+" "+((e&&e.stack)||"");}}
boot();
</script></body></html>
