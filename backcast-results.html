<style>
:root{--mr:#7b8794;

 --iso-neiso:#9C27B0;--iso-miso:#F97316;--iso-spp:#14B8A6;--iso-default:#4A90D9;}
body{background:var(--bg-page)}
.bc-wrap{display:flex;gap:var(--space-lg);max-width:var(--content-max);margin:0 auto;padding:var(--space-lg);align-items:flex-start}
.bc-side{flex:0 0 248px;position:sticky;top:var(--space-md);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-md)}

.bc-side h3:first-child{margin-top:0}
/* ISO / market toggle — the primary axis. A native <select> (mobile-friendly:
   the OS picker handles small screens) wrapped with a color dot that follows
   the active ISO's --c. */
.isoselwrap{position:relative;display:flex;align-items:center}
.isoselwrap .dot{position:absolute;left:13px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));pointer-events:none}
.isosel{width:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--c,var(--border));background:var(--bg-surface);border-radius:var(--radius-md);padding:11px 34px 11px 33px;font-size:var(--fs-sm);font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm)}
.isosel:focus{outline:2px solid var(--c,var(--accent));outline-offset:1px}
.isoselwrap::after{content:"";position:absolute;right:14px;width:8px;height:8px;border-right:2px solid var(--ink-muted);border-bottom:2px solid var(--ink-muted);transform:rotate(45deg) translateY(-2px);pointer-events:none}
.isohint{font-size:var(--fs-xs);color:var(--ink-faint);margin:7px 2px 0;line-height:1.4}
/* Header ISO badge — echoes the active market next to the page title. */
.isobadge{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:700;color:#fff;background:var(--c,var(--accent));padding:4px 12px 4px 10px;border-radius:999px;box-shadow:var(--shadow-sm);white-space:nowrap}
.isobadge .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.92)}
/* Run picker — a visible radio list (newest first), no popup. */
.runlist{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto}
.runopt{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-sm);padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent}
.runopt:hover{background:#eef3f9}
.runopt.on{background:#eef3f9;border-color:var(--border)}
.runopt input{margin:0;flex:0 0 auto;align-self:center}
.runopt .rlab{font-weight:600;color:var(--ink)}
.runopt .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep);cursor:pointer;text-decoration:underline dotted}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--bg-surface);border-radius:18px;padding:4px 11px;font-size:var(--fs-xs);cursor:pointer;color:var(--ink-muted)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bc-top{display:flex;flex-wrap:wrap;gap:var(--space-md);align-items:center;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-md);margin-bottom:var(--space-md)}
.seg{display:inline-flex;background:#eef1f4;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink-muted);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.lab{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--ink-muted);font-weight:600;text-transform:uppercase;margin-right:6px}
.ctl{display:flex;align-items:center;gap:8px}.ctlwide{flex:1 1 auto;min-width:240px}
.bc-top select{font-size:var(--fs-sm);padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--ink);max-width:100%}
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-lg);margin-bottom:var(--space-md)}
.panel h2{font-size:var(--fs-lg);margin:0 0 var(--space-sm)}
.psub{color:var(--ink-muted);font-size:var(--fs-sm);margin:0 0 var(--space-md)}
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-md)}
.kpicard{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd}
.kpicard .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep);cursor:pointer;text-decoration:underline dotted}
.kpicard .lbl{font-weight:700;font-size:var(--fs-sm);margin:2px 0 10px}
.kpirow{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-sm);padding:3px 0;border-top:1px solid var(--border)}
.kpirow .k{color:var(--ink-muted)}.kpirow .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.good{color:var(--success)}.ok{color:#b8860b}.bad{color:var(--danger)}
/* Per-year cards on the report scorecard / LMP grid. */
.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:var(--space-md)}
.lmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:var(--space-md)}
.ycard{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd;min-width:0}
.ycard .yhead{font-weight:800;font-size:var(--fs-base);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.ycard .yhead .ysub{font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted)}
/* Diagnostics findings list. */
.fnd{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--border);font-size:var(--fs-sm);line-height:1.55}
.fnd:first-of-type{border-top:0;padding-top:2px}
.fnd .sevdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.sev-good{background:var(--success)}.sev-ok{background:#e3b341}.sev-bad{background:var(--danger)}
.fnd .fhd{font-weight:700}
.fnd .ftag{display:inline-block;font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted);background:#eef1f4;border-radius:4px;padding:1px 7px;margin-left:7px;vertical-align:1px}
.fcat{font-size:var(--fs-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin:var(--space-md) 0 4px}
.fcat:first-child{margin-top:0}
.tablewrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md)}
table{border-collapse:collapse;width:100%;background:var(--bg-surface);font-size:var(--fs-sm)}
th,td{padding:7px 11px;border-bottom:1px solid #eef1f4;text-align:left;white-space:nowrap}
th{background:#f0f3f6;font-size:var(--fs-xs);text-transform:uppercase;color:#46505f;position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sub td{background:#f3f6f9;font-weight:700}

   amber row = incomplete plant data (not gated), muted = immaterial, the ✓ badge
   marks a verified-complete class that DOES gate C1. */
tr.cmpl-inc td{background:#fff7ed}
tr.cmpl-imm td{color:var(--ink-faint)}
.badge923{display:inline-block;font-size:var(--fs-xs);font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.badge923.inc{background:#fde9d2;color:#9a5b12}
.badge923.imm{background:#eceff2;color:#7b8794}
.badge923.ok{background:#d8f0dd;color:#1f7a3d}
.svgbox{width:100%;overflow:hidden}svg.chart{width:100%;height:auto;display:block;max-width:100%}
canvas.heat{width:100%;height:160px;image-rendering:pixelated;border:1px solid var(--border);border-radius:6px;background:#eef3f7;display:block}
.ax{display:flex;justify-content:space-between;color:var(--ink-muted);font-size:var(--fs-xs);margin:3px 2px 0}
.legend{display:flex;align-items:center;gap:14px;font-size:var(--fs-sm);color:var(--ink-muted);margin:8px 0;flex-wrap:wrap}
.swatch{display:inline-block;width:20px;height:0;border-top-width:3px;border-top-style:solid;vertical-align:middle;margin-right:5px}
.ramp{height:11px;width:150px;border-radius:3px;background:linear-gradient(90deg,#e8f3f7,#7fc4e6,#86c98f,#f2d65c,#ef8f3c,#c0392b)}
.narr{margin-top:var(--space-md);border-top:1px solid var(--border);padding-top:var(--space-md)}
.narr .ndef{font-size:var(--fs-sm);margin:6px 0;color:var(--ink)}
.narr .rid{font-family:var(--font-mono);color:var(--accent-deep)}
#bctip{position:fixed;display:none;z-index:99;max-width:320px;background:#1a2233;color:#fff;font-size:var(--fs-sm);line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:var(--shadow-md)}
#diag{margin:var(--space-md) 0;padding:var(--space-md);border:1px solid var(--warning);border-radius:var(--radius-md);color:#8a6d00;background:#fffaf0}
.hide{display:none}
.sumband{color:var(--ink-muted);font-size:var(--fs-xs);margin:6px 0 0;display:flex;gap:16px;flex-wrap:wrap}
.sumband i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media(max-width:820px){.bc-wrap{flex-direction:column;padding:var(--space-sm)}.bc-side{position:static;width:100%;flex-basis:auto}.bc-main{width:100%}
 .runlist{max-height:190px}}
@media(max-width:640px){th,td{padding:6px 7px;font-size:var(--fs-xs)}
 .bc-top{flex-direction:column;align-items:stretch;gap:var(--space-sm)}
 .ctl{justify-content:space-between;flex-wrap:wrap}.ctlwide{min-width:0}
 .seg{flex:1;flex-wrap:wrap}.seg button{flex:1}.bc-top select{flex:1}
 .kpigrid,.yeargrid,.lmpgrid{grid-template-columns:1fr}.svgbox{margin:0 -4px}}
/* ===== Calibration Status view (all-ISO summary) ===== */
.mute{color:var(--ink-faint)}
.cs-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:var(--fs-xs);color:var(--ink-muted);margin-top:8px;line-height:1.5}
.cs-legend span{display:inline-flex;align-items:center;gap:6px}
.cs-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot-cal{background:var(--success)}.dot-cav{background:#cf9a1e}.dot-not{background:var(--danger)}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-md)}
.cs-card{border:1px solid var(--border);border-left-width:5px;border-radius:var(--radius-md);padding:var(--space-md);background:var(--bg-surface);box-shadow:var(--shadow-sm)}
.cs-card.det-cal{border-left-color:var(--success)}
.cs-card.det-cav{border-left-color:#cf9a1e}
.cs-card.det-not{border-left-color:var(--danger)}
.cs-cardhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cs-iso{font-weight:800;font-size:var(--fs-lg)}
.cs-badge{font-size:var(--fs-xs);font-weight:800;letter-spacing:.02em;color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap}
.cs-badge.det-cal{background:var(--success)}.cs-badge.det-cav{background:#cf9a1e}.cs-badge.det-not{background:var(--danger)}
.cs-keeper{font-size:var(--fs-sm);color:var(--ink-muted);margin-bottom:8px;line-height:1.5}
.cs-keeper .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep)}
.cs-reason{font-size:var(--fs-sm);line-height:1.5;margin:0 0 10px}
.cs-marks{display:flex;flex-wrap:wrap;gap:5px}
.cs-mk{display:inline-flex;flex-direction:column;align-items:center;min-width:34px;border:1px solid var(--border);border-radius:6px;padding:3px 4px;background:#fbfcfd}
.cs-mk .code{font-size:9px;letter-spacing:.02em;color:var(--ink-muted);font-weight:700}
.cs-mk .glyph{font-size:14px;font-weight:800;line-height:1.15}
.cs-detail{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;background:var(--bg-surface);overflow:hidden}
.cs-detail>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:700;background:#f7f9fb}
.cs-detail>summary::-webkit-details-marker{display:none}
.cs-detail>summary::before{content:"\25B8";color:var(--ink-muted);font-size:12px;flex:0 0 auto}
.cs-detail[open]>summary::before{content:"\25BE"}
.cs-detail>summary .cs-badge{margin-left:auto}
.cs-st{font-weight:800;text-align:center;font-size:var(--fs-base)}
.cs-gate{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted)}
.cs-matrix td,.cs-tests td{white-space:normal;vertical-align:top}
.cs-matrix td:first-child{font-weight:600}
.cs-tests td:first-child{font-weight:700;white-space:nowrap}
.cs-rec{padding:2px 0;font-size:var(--fs-sm);line-height:1.5}
.cs-rec .mk{font-weight:800;margin-right:5px}
.cs-rec b{font-weight:700}
.cs-allok{color:var(--ink-muted);font-size:var(--fs-sm)}
.cs-tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.tag-miss{background:#fdecea;color:#b32218}
.tag-lim{background:#fef6e7;color:#8a6400}
.cs-ledger{font-size:var(--fs-xs);color:var(--ink-muted);line-height:1.5;margin:3px 0 5px 20px;padding-left:8px;border-left:2px solid var(--border)}
.cs-method{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-md)}
.cs-method .m{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd}
.cs-method .m h4{font-size:var(--fs-sm);margin:0 0 6px}
.cs-method .m p{font-size:var(--fs-sm);color:var(--ink);line-height:1.55;margin:0}
/* Top-level left-panel menu (Dashboard vs Calibration Status). */
.bc-nav{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--space-md);padding-bottom:var(--space-md);border-bottom:1px solid var(--border)}
.bc-nav button{text-align:left;border:1px solid transparent;background:transparent;padding:9px 11px;border-radius:var(--radius-md);font-size:var(--fs-sm);font-weight:700;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;gap:8px}
.bc-nav button .ic{font-size:14px;line-height:1}
.bc-nav button:hover{background:#eef3f9;color:var(--ink)}
.bc-nav button.on{background:var(--accent);color:#fff}
/* Tiles are clickable (select a market → its full results render below). */
.cs-card{cursor:pointer;transition:box-shadow .12s,border-color .12s}
.cs-card:hover{box-shadow:var(--shadow-md)}
.cs-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cs-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset,var(--shadow-md)}
.cs-open{margin-top:10px;font-size:var(--fs-xs);font-weight:700;color:var(--accent-deep)}
.cs-card.sel .cs-open{color:var(--accent-deep)}
.cs-reshd{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.cs-reshd .cs-iso{font-size:var(--fs-lg)}
@media(max-width:640px){.cs-grid,.cs-method{grid-template-columns:1fr}}
</style></head><body>

<script>
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const NS="http://www.w3.org/2000/svg",T=8760;
let META,BENCH,MODEL={},st,SUB_BASE=null;
// ISO color token for the active-market chrome (toggle, header badge), with a
// neutral fallback for any ISO not in the canonical palette.
function isoColorVar(iso){return `var(--iso-${String(iso).toLowerCase()},var(--iso-default))`;}
function isoRunCount(iso){return BC.manifest.filter(m=>(m.iso||"ERCOT")===iso).length;}
function inflate(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("browser lacks DecompressionStream — use a current browser"));
 return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()
  .then(ab=>JSON.parse(new TextDecoder().decode(ab)));}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("failed to load "+src));document.head.appendChild(s);});}
async function ensureRuns(ids){for(const id of ids){if(MODEL[id])continue;
  try{
    if(!window.BC.runGz||!window.BC.runGz[id]){const m=META_RUN(id);if(!m)continue;await loadScript(m.file);}
    if(window.BC.runGz&&window.BC.runGz[id])MODEL[id]=await inflate(window.BC.runGz[id]);
  }catch(e){console.warn("skipping run "+id+": "+(e&&e.message||e));}}}
function META_RUN(id){return BC.manifest.find(r=>r.id===id);}
function dec(b){const s=atob(b),a=new Float32Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function pearson(m,o){let mm=0,oo=0,n=m.length;for(let i=0;i<n;i++){mm+=m[i];oo+=o[i];}mm/=n;oo/=n;let a=0,b=0,c=0;for(let i=0;i<n;i++){const x=m[i]-mm,y=o[i]-oo;a+=x*y;b+=x*x;c+=y*y;}const d=Math.sqrt(b*c);return d>0?a/d:0;}
function nrmse(m,o){let s=0,om=0,n=m.length;for(let i=0;i<n;i++){s+=(m[i]-o[i])**2;om+=o[i];}om/=n;return om>0?Math.sqrt(s/n)/om:9.9;}
function capScore(r,nr,dev){return 100*Math.cbrt(Math.max(0,r)*Math.max(0,1-nr)*Math.max(0,1-Math.abs(dev)));}
function plantsOf(id,year,grp){const M=MODEL[id].years[year],B=BENCH[year];if(!M||!B)return [];
 return Object.keys(M.plants).filter(c=>{const b=B.plants[c];return b&&b.group===grp&&st.zones.has(b.zone);});}
const _aggC={},_eAllC={};
// Full EIA-923 class total (all 923 plants of the class), allocated to the
// selected zones by the matched plants' EIA-923 distribution: the matched set
// understates the class (e.g. CC_REGULAR ~138 of 145 TWh), so the zonal Δ-vs-

// A fossil class passes only when BOTH hold:
//  (1) volume: the absolute miss |model − actual| is within
//      min(SUM_TOL_GEN_FRAC of ISO ANNUAL generation, SUM_TOL_GEN_CAP TWh) — the

// bands; bad otherwise. clsTol takes the class-error object; tolcls takes a

// is never the binding band and there is no single class share to test).
function clsTol(e){return classInTol(e)?"good":(volInTol(e,2)&&shareInTol(e,2))?"ok":"bad";}
function tolcls(v){const a=Math.abs(v);return a<=SUM_TOL_PCT?"good":a<=2*SUM_TOL_PCT?"ok":"bad";}
function summaryHeadline(id,yr){const es=classErrs(id,yr);
 // System volume error stays fossil-only (Σ model vs Σ full EIA-923); the
 // in-tolerance count and worst class span every class incl. non-fossil.
 let sm=0,sa=0,worst=null;
 es.forEach(e=>{if(!e.nonfos){sm+=e.mFull;sa+=e.bench923;}if(!worst||Math.abs(e.err)>Math.abs(worst.err))worst=e;});
 return {n:es.length,inTol:es.filter(classInTol).length,
  sysErr:sa>0?100*(sm-sa)/sa:null,worst,price:avgLMP(id,yr),priceScar:avgLMPScar(id,yr)};}
// Actual historical avg LMP ($/MWh) for the selected year (system hub-average),
// from the benchmark payload; absent for an ISO-year with no price file.
function actualLMP(yr){return (BENCH[yr]||{}).avgLMP||null;}
// Generation-weighted mean class hourly r (weights = CAMPD actual TWh) — the
// scorecard's one-number dispatch-correlation summary for a year.
function fleetR(id,yr){let ws=0,s=0;
 for(const g of META.groups){const m=classMetrics(id,yr,g);if(!m||m.cA<=0)continue;ws+=m.cA;s+=m.cA*m.r;}
 return ws>0?s/ws:null;}

function runYears(id){const m=META_RUN(id),ys=MODEL[id]?Object.keys(MODEL[id].years).map(Number):[];

// charts). Model = load-weighted over the selected zones per month; actual =
// the system DA / RT hub average per month. Δ = (model − actual)/actual.
// Total monthly demand (TWh-equivalent weights) over the selected zones, for
// demand-weighting the overlay's annual roll-up the same way avgLMP rolls up
// the energy-only series.
function monthDemandTot(id,year){const L=(MODEL[id].years[year]||{}).lmp||{};const d=Array(12).fill(0);let any=false;
 for(const z in L){if(!st.zones.has(z))continue;const dm=L[z].dMon;if(!dm)continue;for(let m=0;m<12;m++){d[m]+=dm[m];any=true;}}return any?d:null;}

// deployment adder), or null when the run carries no overlay. Weighting the
// monthly overlay means by monthly demand reproduces the true hourly demand-
// weighted annual, exactly as avgLMP rolls up the energy-only series.
function avgLMPScar(id,year){const ms=avgLMPMonScar(id,year),dT=monthDemandTot(id,year);if(!ms||!dT)return null;

// average when the run carries an overlay, else energy-only. Actual ERCOT LMP
// already includes the ORDC reserve adder that the energy-only LP structurally
// cannot produce, so comparing the energy-only price against the actuals is
// apples-to-oranges and overstates the gap; the overlay restores like-for-like.
// The energy-only avgLMP stays the displayed model price and the gated volume
// metrics are untouched.
function avgLMPDelta(id,year){const s=avgLMPScar(id,year);return s!=null?s:avgLMP(id,year);}
function lmpMonthlyTable(id,yr){const mm=avgLMPMon(id,yr);if(!mm)return "";

 const ms=avgLMPMonScar(id,yr);

 // Δ is taken against the ORDC-overlaid price where the run carries an overlay
 // (apples-to-apples — the actuals include the ORDC adder); energy-only mm/ann

  return `<td class=num>${a==null?"—":"$"+a.toFixed(1)}</td><td class="num ${d==null?'':dcls(d)}">${d==null?"—":fmtPct(d)}</td>`;};

  +'<div class=tablewrap><table><thead><tr><th>month</th><th>model $/MWh</th>'
  +(ms?'<th>+ overlay $/MWh</th>':'')
  +(da?'<th>actual DA</th><th>Δ DA</th>':'')+(rt?'<th>actual RT</th><th>Δ RT</th>':'')+'</tr></thead><tbody>';

 h+=`<tr class=sub><td>Annual</td><td class=num>${ann==null?"—":"$"+ann.toFixed(1)}</td>`

function mountTolHeat(id,years){const div=document.getElementById("tolHeat");if(!div)return;

// ---- diagnostics: localize each miss and suggest the likely source ----
// Pure presentation-layer heuristics over the same payload numbers shown in
// the charts (volErr month/zone decomposition, per-plant Δ923, class r, LMP
// deltas) — nothing here re-decides a calibration metric. Wording is hedged:
// these are pointers for where to look, not verdicts.
const SUMMER=[5,6,7,8],WINTER=[11,0,1];          // Jun–Sep, Dec–Feb (0-based)
function monthMiss(id,yr,cls){const out=[];
 for(const mo of ALLMON){const c=volMA(id,yr,cls,st.zones,[mo]);out.push(c?c.m-c.a:0);}return out;}
function seasonLabel(idx){return SUMMER.includes(idx)?"summer":WINTER.includes(idx)?"winter":"shoulder";}
function fmtTWh(v){return (v>=0?"+":"")+(Math.abs(v)>=1?v.toFixed(1)+" TWh":(v*1e3).toFixed(0)+" GWh");}
function topPlantMisses(id,yr,grp,n){const B=BENCH[yr],M=MODEL[id].years[yr];if(!B||!M)return [];
 return plantsOf(id,yr,grp).map(c=>{const b=B.plants[c],mp=M.plants[c];
   return {name:b.name,zone:b.zone,miss:mp.m_ann-b.e_ann,e:b.e_ann};})
  .filter(p=>p.e>0.001).sort((a,b)=>Math.abs(b.miss)-Math.abs(a.miss)).slice(0,n);}
// One volume finding per failing class: which years, which direction, and
// whether the miss is seasonal, zonal, plant-specific or a flat level shift —
// each pattern maps to a different first place to look.
function volFinding(id,years,g){
 const errsByY=years.map(yr=>({yr,e:anyErr(id,yr,g)})).filter(x=>x.e);
 const failing=errsByY.filter(x=>clsTol(x.e)!=="good");if(!failing.length)return null;
 const worst=failing.reduce((a,b)=>Math.abs(b.e.err)>Math.abs(a.e.err)?b:a);
 const sev=clsTol(worst.e),dir=worst.e.err>=0?"over":"under";
 const signs=errsByY.map(x=>Math.sign(x.e.err)),structural=errsByY.length>1&&signs.every(s=>s===signs[0]);
 const yrs=failing.map(x=>x.yr).join(", ");
 let txt=`${dir==="over"?"Over":"Under"}-generates by ${fmtPct(worst.e.err)} (${fmtTWh(worst.e.mFull-worst.e.bench923)}) in ${worst.yr}`
  +(failing.length>1?`; out of tolerance in ${yrs}`:"")
  +(structural?` — same direction every year, so it reads as structural (offer-curve level), not weather/gas-price driven.`:`.`);
 if(!shareInTol(worst.e,1)&&worst.e.sharePP!=null)
  txt+=` Its share of total generation is off by ${fmtpp(worst.e.sharePP)}pp.`;
 if(!isNonFos(g)){
  const dm=monthMiss(id,worst.yr,g),D=dm.reduce((s,v)=>s+v,0);
  if(Math.abs(D)>0.02){
   // season concentration: share of the signed miss carried by each season
   const sums={summer:0,winter:0,shoulder:0};dm.forEach((v,i)=>sums[seasonLabel(i)]+=v);
   const seas=Object.entries(sums).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
   const sShare=seas[1]/D,sameSign=dm.filter(v=>Math.sign(v)===Math.sign(D)&&Math.abs(v)>1e-4).length;
   if(sameSign>=10&&Math.abs(sShare)<0.55){
    txt+=` The miss is spread across all months (a level shift) — first place to look: the committed/min-gen floor or the committed-band multiplier for this class.`;
   }else if(seas[1]!==0&&Math.abs(sShare)>=0.55){
    const lever=seas[0]==="summer"?"the peak / econ_high tranche":(seas[0]==="winter"?"the winter availability / peak tranche":"the econ_low / shoulder tranche");
    txt+=` ${Math.round(100*Math.abs(sShare))}% of the miss sits in ${seas[0]} months — first place to look: ${lever} (${dir==="over"?"likely priced too low; the class clears too often there":"likely priced too high; the class drops out of merit there"}).`;}
   // zone concentration
   const ve=((MODEL[id].years[worst.yr]||{}).volErr||{})[g];
   if(ve&&ve.zoneMon){const zs=Object.entries(ve.zoneMon).filter(([z])=>st.zones.has(z))
     .map(([z,zc])=>({z,d:zc.m.reduce((s,v)=>s+v,0)-zc.a.reduce((s,v)=>s+v,0)}))

function lmpFindings(id,years){const out=[];

  const aL=actualLMP(yr)||{},am=aL.da_mon||aL.rt_mon;if(!am)continue;

   .sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3);
  if(pdiff==null||(Math.abs(pdiff)<5&&!hot.length))continue;
  let txt=`Annual ${ov?"model + ORDC overlay":"model"} LMP ${fmtPct(pdiff)} vs actual ${lab}.`;
  if(hot.length){txt+=` Largest monthly gaps: ${hot.map(x=>`${MONTHS[x.i]} ${fmtPct(x.d)}`).join(", ")}.`;
   // tie the worst month to the largest class volume miss in that month
   const w=hot[0];let cand=null;
   for(const g of META.groups){const c=volMA(id,yr,g,st.zones,[w.i]);if(!c)continue;
    const d=c.m-c.a;if(!cand||Math.abs(d)>Math.abs(cand.d))cand={g,d};}
   if(cand&&Math.abs(cand.d)>0.05){
    const over=cand.d>0;
    txt+=` That month coincides with ${META.groupLabel[cand.g]} ${over?"over":"under"}-dispatching by ${fmtTWh(cand.d)}`
     +(w.d>0&&!over?" — the model looks short that supply, letting costlier units set the price.":
       (w.d<0&&over?" — the extra cheap supply depresses the model price.":"."));}}
  txt+=ov?" Δ is on the ORDC-overlaid price (energy LMP + ORDC/reliability-deployment adder), so it is like-for-like with the scarcity-inclusive actuals; a flat reliability-deployment offset anchored to 2023 under-serves the milder years, leaving a residual under-bias there."
   :" Reminder: the model is a day-ahead-style energy LP with no ORDC/scarcity adders, so some positive bias in scarcity months is expected.";
  out.push({cat:"lmp",sev:pdiff!=null?dcls(pdiff):"ok",title:"LMP "+yr,tag:"vs "+lab,txt,score:Math.abs(pdiff||0)});}

 const bs=[{label:"Model",v:mt?mt.mFull:a.mA,color:"#4A90D9"},{label:"CAMPD (CEMS)",v:a.cA,color:"#647184"},{label:"EIA-923 (grid)",v:mt&&mt.bench923>0?mt.bench923:a.eA,color:"#2ECC71"}];
 document.getElementById("cAnn").appendChild(barChart(bs,Math.max(0.1,...bs.map(b=>b.v))*1.25,760,260));
 mountVolMiss(id,yr,grp);
 wireTips(document.getElementById("content"));}
// ============================ TABLES ============================
function tablesHTML(id,yr){
 let h=genMixPanel(id,yr)+singleFuelTable(id,yr)+singleFossilTable(id,yr)+co2Table(id,yr)+lmpMonthlyTable(id,yr);
 h+='<div class=panel><h2>Per-plant fit vs CAMPD / EIA-923 — '+yr+'</h2><div class=tablewrap><table><thead><tr><th>plant</th><th>class</th><th>zone</th><th>r</th><th>NRMSE</th><th>capture%</th><th>Δ923%</th></tr></thead><tbody>';
 const B=BENCH[yr],M=MODEL[id].years[yr];
 const codes=Object.keys(M.plants).filter(c=>B.plants[c]&&st.zones.has(B.plants[c].zone)).sort((a,b)=>B.plants[a].group.localeCompare(B.plants[b].group)||B.plants[b].npl-B.plants[a].npl);
 for(const c of codes){const b=B.plants[c],mp=M.plants[c];const d=b.e_ann>0.001?100*(mp.m_ann-b.e_ann)/b.e_ann:null;
  h+=`<tr><td>${b.name}</td><td>${META.groupLabel[b.group]||b.group}</td><td>${b.zone}</td><td class="num ${rcls(mp.r)}">${mp.r??"—"}</td><td class=num>${mp.nrmse??"—"}</td><td class=num>${mp.cap==null?"—":mp.cap.toFixed(0)}</td><td class="num ${d==null?'':dcls(d)}">${d==null?"—":d.toFixed(0)}</td></tr>`;}
 h+='</tbody></table></div>'+narrative([id])+'</div>';
 return h;}
function renderTables(){const id=st.run,yr=st.year;
 document.getElementById("content").innerHTML=tablesHTML(id,yr);wireTips(document.getElementById("content"));}
// ===== Calibration Status (all-ISO summary, driven by window.BC.status) =====
// status.js embeds the FULL machine verdict from scripts/calibration_verdict.py
// for each ISO's current keeper, so everything here is presentation only — no
// tolerance or determination is recomputed in JS (the page can never disagree
// with the gate).
const CS_ORDER=["fuelmix","sysvol","price_mean","price_shape","price_tail","dispatch_corr","co2","storage","governance"];
const CS_CODE={fuelmix:"C1",sysvol:"C2",price_mean:"C3a",price_shape:"C3b",price_tail:"C3c",dispatch_corr:"C4",co2:"C5a",storage:"C5b",governance:"C6"};
const CS_MARK={PASS:"✓",CAVEAT:"~",FAIL:"✗",SKIPPED:"·",UNATTESTED:"?"};
const CS_CLS={PASS:"good",CAVEAT:"ok",FAIL:"bad",SKIPPED:"mute",UNATTESTED:"bad"};
const CS_DET={CALIBRATED:"det-cal","CALIBRATED-WITH-CAVEATS":"det-cav","NOT-YET":"det-not"};
function csEsc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function csYears(ys){if(!ys||!ys.length)return"—";const a=ys.slice().sort((x,y)=>x-y);
 let cont=a.length>1;for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)cont=false;
 return cont?`${a[0]}–${a[a.length-1]}`:a.join(", ");}
function csGlyph(status){return `<span class="glyph ${CS_CLS[status]||"mute"}">${CS_MARK[status]||"·"}</span>`;}
function csCardMarks(v){return CS_ORDER.map(cid=>{const c=v.criteria[cid];const s=c?c.status:"SKIPPED";
 return `<span class=cs-mk title="${csEsc((c&&c.label)||cid)} — ${s}"><span class=code>${CS_CODE[cid]}</span>${csGlyph(s)}</span>`;}).join("");}
function csReason(v){return v.reasons&&v.reasons.length?v.reasons.join("; "):"All criteria pass; governance attested.";}
function csDetailRows(v){return CS_ORDER.map(cid=>{const c=v.criteria[cid];if(!c)return"";
 let body;
 if(cid==="governance"){const g=(c.records&&c.records[0])||{};
  body=`<div class=cs-rec><span class="mk ${CS_CLS[c.status]||"mute"}">${CS_MARK[c.status]||"·"}</span>${csEsc(g.magnitude||c.status)}</div>`;}
 else{const notable=(c.records||[]).filter(r=>r.status!=="PASS");
  if(!notable.length)body=`<span class=cs-allok>all scorable years within tolerance</span>`;
  else body=notable.map(r=>{
   const yr=r.year?`${r.year} `:"";const key=r.key?`${csEsc(r.key)} `:"";
   const tol=r.tol?` <span class=cs-gate>(tol ${csEsc(r.tol)})</span>`:"";
   let tag="";
   if(r.classification==="ACCEPTED MEASURED-INPUT LIMITATION")tag=`<span class="cs-tag tag-lim">ACCEPTED LIMITATION</span>`;
   else if(r.classification==="MODEL MISS")tag=`<span class="cs-tag tag-miss">MODEL MISS</span>`;
   const led=r.ledger_reason?`<div class=cs-ledger>${csEsc(r.ledger_reason)}</div>`:"";
   return `<div class=cs-rec><span class="mk ${CS_CLS[r.status]||"mute"}">${CS_MARK[r.status]||"·"}</span><b>${yr}${key}</b>${csEsc(r.magnitude)}${tol}${tag}${led}</div>`;
  }).join("");}
 return `<tr><td>${csEsc(c.label)}</td><td class=cs-gate>${c.hard?"HARD":"soft"}</td><td class="cs-st ${CS_CLS[c.status]||"mute"}">${CS_MARK[c.status]||"·"}</td><td>${body}</td></tr>`;
}).join("");}
let csSel=0;  // index of the keeper tile whose full results are shown
// One keeper's full C1–C6 results block (heading + per-year matrix).
function csResultsBlock(v){const det=CS_DET[v.determination]||"det-not";
 const blocked=v.data_blocked_years&&v.data_blocked_years.length?` · <span class=bad>blocked ${v.data_blocked_years.join(", ")}</span>`:"";
 return `<div class=cs-reshd>
   <span class=cs-iso>${csEsc(v.iso)}</span>
   <span class="cs-badge ${det}">${csEsc(v.determination)}</span>
   <span class="cs-keeper rid" style="margin:0">${csEsc(v.label)} · years ${csYears(v.target_years)}${blocked}</span></div>
  <p class=cs-reason style="margin:0 0 var(--space-md)">${csEsc(csReason(v))}</p>
  <div class=tablewrap><table class=cs-matrix><thead><tr><th>Criterion</th><th>Gate</th><th>Status</th><th>Per-year detail · classification</th></tr></thead>
  <tbody>${csDetailRows(v)}</tbody></table></div>`;}
// Repaint the tile highlight + the results block for the selected keeper.
function csShow(i){const S=window.BC.status;if(!S||!S.keepers[i])return;csSel=i;
 document.querySelectorAll("#csGrid .cs-card").forEach(c=>c.classList.toggle("sel",+c.dataset.i===i));
 const host=document.getElementById("csResults");if(host)host.innerHTML=csResultsBlock(S.keepers[i]);}
function renderCalibStatus(){
 const S=window.BC&&window.BC.status,host=document.getElementById("content");
 if(!S||!S.keepers||!S.keepers.length){
  host.innerHTML='<div class=panel><h2>Calibration Status</h2><p class=psub>Status data is unavailable — <code>frontend/data/backcast/status.js</code> did not load. Re-run <code>python scripts/build_status.py</code> so the all-ISO verdicts are emitted.</p></div>';return;}
 if(csSel>=S.keepers.length)csSel=0;
 const cards=S.keepers.map((v,i)=>{const det=CS_DET[v.determination]||"det-not";
  const blocked=v.data_blocked_years&&v.data_blocked_years.length?` · <span class=bad>blocked ${v.data_blocked_years.join(", ")}</span>`:"";
  return `<article class="cs-card ${det} ${i===csSel?"sel":""}" data-i=${i} tabindex=0 role=button aria-pressed="${i===csSel}">
   <div class=cs-cardhd><span class=cs-iso>${csEsc(v.iso)}</span><span class="cs-badge ${det}">${csEsc(v.determination)}</span></div>
   <div class=cs-keeper><span class=rid>${csEsc(v.label)}</span> · years ${csYears(v.target_years)}${blocked}</div>
   <p class=cs-reason>${csEsc(csReason(v))}</p>
   <div class=cs-marks>${csCardMarks(v)}</div>
   <div class=cs-open>View full results &rarr;</div>
  </article>`;}).join("");
 const tests=(S.rubric||[]).map(r=>`<tr><td>${csEsc(r.label)}</td><td>${csEsc(r.measures)}</td><td>${csEsc(r.source)}</td><td>${csEsc(r.tol)}</td></tr>`).join("");
 const method=(S.methodology||[]).map(m=>`<div class=m><h4>${csEsc(m.head)}</h4><p>${csEsc(m.body)}</p></div>`).join("");
 host.innerHTML=`
  <div class=panel>
   <h2>Calibration Status — every ISO's current keeper</h2>
   <p class=psub>Headline determination for each market's newest keeper, scored from committed artifacts by <code>scripts/calibration_verdict.py</code> against the calibration-determination rubric — so this page can never disagree with the gate. Generated ${csEsc(S.generated||"")}.</p>
   <div class=cs-legend>
    <span><i class="cs-dot dot-cal"></i> <b>CALIBRATED</b> — every criterion passes, governance attested</span>
    <span><i class="cs-dot dot-cav"></i> <b>CALIBRATED-WITH-CAVEATS</b> — only ledgered measured-input limitations / unscored soft criteria</span>
    <span><i class="cs-dot dot-not"></i> <b>NOT-YET</b> — an undocumented out-of-tolerance criterion (a model miss to fix)</span>
   </div>
   <p class=psub style="margin:var(--space-md) 0 var(--space-sm)">Click a market tile to see its full C1–C6 results below.</p>
   <div class=cs-grid id=csGrid>${cards}</div>
  </div>
  <div class=panel>
   <h2>C1–C6 status matrix</h2>
   <p class=psub>${csGlyph("PASS")} pass · ${csGlyph("CAVEAT")} caveat (ledgered limitation) · ${csGlyph("FAIL")} fail (model miss) · ${csGlyph("SKIPPED")} skipped (not scored). Per-year magnitudes and the MODEL-MISS vs ACCEPTED-LIMITATION classification for the selected market.</p>
   <div id=csResults></div>
  </div>
  <div class=panel>
   <h2>Tests conducted</h2>
   <p class=psub>What each criterion measures, its authoritative actual source, and its tolerance (read straight off the scorer's constants).</p>
   <div class=tablewrap><table class=cs-tests><thead><tr><th>Criterion</th><th>What it measures</th><th>Authoritative actual</th><th>Tolerance</th></tr></thead><tbody>${tests}</tbody></table></div>
  </div>
  <div class=panel>
   <h2>Justification — methodology &amp; best-practice grounding</h2>
   <p class=psub>Why these determinations are what they are, grounded in energy-modeling best practice.</p>
   <div class=cs-method>${method}</div>
  </div>`;
 const grid=document.getElementById("csGrid");
 grid.querySelectorAll(".cs-card").forEach(c=>{
  c.onclick=()=>csShow(+c.dataset.i);
  c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();csShow(+c.dataset.i);}};});
 csShow(csSel);
 if(typeof wireTips==="function")wireTips(host);
}
// Top-level destination switch (left-panel menu): the per-run dashboard vs the
// all-ISO Calibration Status page. They are mutually exclusive — Calibration
// Status hides the ISO/run selectors and the per-run control bar entirely.
function setView(v){
 st.view=v;
 document.querySelectorAll("#bcNav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 const calib=v==="calib",show=(id,on)=>{const el=document.getElementById(id);if(el)el.style.display=on?"":"none";};
 show("dashSide",!calib);show("bcTop",!calib);show("isoBadge",!calib);
 if(calib){
  document.getElementById("diag").style.display="none";
  document.getElementById("pageSub").textContent="Determinations for every ISO's current keeper · scored by scripts/calibration_verdict.py";
  renderCalibStatus();
 }else{updateIsoChrome(st.iso);render();}
}
// ---- shell render ----
function render(){const id=st.run;if(!id){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Select a run.</p></div>';return;}
 ensureRuns([id]).then(()=>{
  if(!MODEL[id]){document.getElementById("content").innerHTML='<div class=panel><p class=psub>Run data failed to load.</p></div>';return;}
  // year/class clamps when the run or ISO changed under the current selection
  const ys=runYears(id);if(ys.length&&!ys.includes(st.year))st.year=ys[0];
  if(!META.groups.includes(st.klass))st.klass=META.groups[0];
  syncTopbar();
  if(st.page==="report")renderReport();
  else if(st.page==="charts")renderCharts();
  else renderTables();
 }).catch(e=>{document.getElementById("diag").style.display="block";document.getElementById("diag").textContent="Load error: "+(e.message||e);});}
// Year + class controls only steer the per-year views; the report shows every
// year at once, so they hide there to keep the bar clean (zones stay — every
// zone-aware metric honors them on all pages).
function syncTopbar(){
 document.getElementById("ctlYear").style.display=st.page==="report"?"none":"";
 document.getElementById("ctlClass").style.display=st.page==="charts"?"":"none";
 const ys=st.run?runYears(st.run):[];
 const ysel=document.getElementById("yearSel");
 ysel.innerHTML=ys.map(y=>`<button data-y=${y} class=${y===st.year?"on":""}>${y}</button>`).join("");}
function isoRuns(){return BC.manifest.filter(m=>(m.iso||"ERCOT")===st.iso);}
// Newest first (run id starts with the bundle date, so lexicographic works);
// the newest run is also the default selection.
function isoRunsNewest(){return isoRuns().slice().sort((a,b)=>b.id.localeCompare(a.id));}
function buildRunList(){
 const list=document.getElementById("runList");
 list.innerHTML=isoRunsNewest().map(m=>`<label class="runopt ${st.run===m.id?'on':''}">
  <input type=radio name=run value="${m.id}" ${st.run===m.id?"checked":""}>
  <span class=rlab>${m.label}</span> <span class=rid data-rid="${m.id}">${m.shorthand}</span></label>`).join("");
 list.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
  st.run=inp.value;st.plant="agg";
  list.querySelectorAll(".runopt").forEach(o=>o.classList.toggle("on",o.querySelector("input").value===st.run));
  render();});
 wireTips(list);}
function build(){
 document.getElementById("pageSel").onclick=e=>{const p=e.target.dataset.p;if(!p)return;st.page=p;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b.dataset.p===p));render();};
 const ysel=document.getElementById("yearSel");
 ysel.onclick=e=>{if(!e.target.dataset.y)return;st.year=+e.target.dataset.y;[...ysel.children].forEach(b=>b.classList.toggle("on",+b.dataset.y===st.year));render();};
 const csel=document.getElementById("classSel");csel.innerHTML=META.groups.map(g=>`<option value="${g}">${META.groupLabel[g]}</option>`).join("");
 csel.value=st.klass;csel.onchange=()=>{st.klass=csel.value;st.plant="agg";render();};
 const zsel=document.getElementById("zoneSel");zsel.innerHTML=`<span class="chip on" data-z=__all>All</span>`+META.zones.map(z=>`<span class="chip on" data-z="${z}">${z}</span>`).join("");
 zsel.onclick=e=>{const z=e.target.dataset.z;if(!z)return;
  if(z==="__all")st.zones=new Set(META.zones);else{if(st.zones.has(z))st.zones.delete(z);else st.zones.add(z);if(!st.zones.size)st.zones=new Set(META.zones);}
  [...zsel.children].forEach(c=>{const zz=c.dataset.z;c.classList.toggle("on",zz==="__all"?st.zones.size===META.zones.length:st.zones.has(zz));});
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);render();};
 buildRunList();render();}
// Header badge + subtitle + sidebar hint, recolored to the active market so the
// user always knows which ISO the page is showing and what else is available.
function updateIsoChrome(iso){
  const badge=document.getElementById("isoBadge");
  badge.style.setProperty("--c",isoColorVar(iso));
  badge.innerHTML=`<span class=dot></span>${iso}`;
  const n=isoRunCount(iso),sub=document.getElementById("pageSub");
  if(SUB_BASE!=null)sub.textContent=`${iso} · ${n} run${n===1?"":"s"} · ${SUB_BASE}`;
  const others=Object.keys(window.BC.meta).filter(x=>x!==iso);
  document.getElementById("isoHint").textContent=others.length
    ?("Switch market — also loaded: "+others.join(", ")):"Only this market is loaded.";
}
async function selectIso(iso){
  st.iso=iso;
  META=window.BC.meta[iso];
  // benchmark.js is the large data file; if the deploy shipped the shell
  // without it (404 / stale / out-of-sync build), benchGz is undefined here.
  // Fail with an actionable message instead of a cryptic "undefined is not an
  // object" that blanks the page.
  if(!window.BC.benchGz||window.BC.benchGz[iso]==null)
   throw new Error("benchmark data for "+iso+" is unavailable — "
    +"frontend/data/backcast/benchmark.js did not load or is out of sync with "
    +"the page. Re-run the Pages deploy (scripts/build_manifest.py) so the "
    +"shell and benchmark.js are rebuilt together.");
  BENCH=await inflate(window.BC.benchGz[iso]);
  const first=isoRunsNewest()[0];
  st.run=first?first.id:null;
  st.year=META.years[0];st.zones=new Set(META.zones);
  st.klass=META.groups[0];st.plant="agg";
  Object.keys(_aggC).forEach(k=>delete _aggC[k]);
  Object.keys(_eAllC).forEach(k=>delete _eAllC[k]);
  Object.keys(_mAllC).forEach(k=>delete _mAllC[k]);
  const sel=document.getElementById("isoSel");
  sel.value=iso;
  document.getElementById("isoWrap").style.setProperty("--c",isoColorVar(iso));
  updateIsoChrome(iso);
  build();
}
// The two data files (manifest.js → window.BC.meta/manifest, benchmark.js →
// window.BC.benchGz) load via <script src> before boot() runs. A stale CDN /
// browser cache or an out-of-sync deploy can leave one un-loaded (so meta /
// benchGz is undefined and the old shell crashed with "undefined is not an
// object"). Before giving up, re-fetch whichever is missing dynamically with a
// cache-busting query so the page self-heals instead of blanking.
async function ensureData(){
  const cb="?cb="+Date.now(),need=[];
  if(!window.BC||!window.BC.meta||!window.BC.manifest)
    need.push("frontend/data/backcast/manifest.js");
  if(!window.BC||!window.BC.benchGz)
    need.push("frontend/data/backcast/benchmark.js");
  for(const src of need){
    try{await loadScript(src+cb);}
    catch(e){console.warn("data re-fetch failed: "+((e&&e.message)||e));}
  }
}
async function boot(){try{
  await ensureData();
  if(!window.BC||!window.BC.meta||!window.BC.manifest)
   throw new Error("manifest data is unavailable — "
    +"frontend/data/backcast/manifest.js did not load.");
  if(!window.BC.benchGz)
   throw new Error("benchmark data is unavailable — "
    +"frontend/data/backcast/benchmark.js did not load.");
  const isos=Object.keys(window.BC.meta);
  const isoSel=document.getElementById("isoSel");
  isoSel.innerHTML=isos.map(i=>{const n=isoRunCount(i);
    return `<option value="${i}">${i} · ${n} run${n===1?"":"s"}</option>`;}).join("");
  isoSel.onchange=()=>{if(isoSel.value!==st.iso)selectIso(isoSel.value);};
  document.getElementById("bcNav").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.v)setView(b.dataset.v);};
  st={run:null,year:0,zones:new Set(),page:"report",klass:"",plant:"agg",iso:null,cfMode:"bins",view:"dash"};
  SUB_BASE=document.getElementById("pageSub").textContent;
  document.getElementById("diag").style.display="none";
  await selectIso(isos.includes("ERCOT")?"ERCOT":isos[0]);
 }catch(e){const d=document.getElementById("diag");d.style.display="block";d.style.color="#c01c28";d.textContent="Init error: "+((e&&e.message)||e)+" "+((e&&e.stack)||"");}}
boot();
</script></body></html>
