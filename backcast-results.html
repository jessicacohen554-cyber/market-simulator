<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<!-- Never serve the shell HTML from a stale cache: paired with the
     content-hash SHELL_VER / DATA_VER stamps below, this keeps a long-lived
     browser tab from rendering an out-of-date shell against freshly-fetched
     data scripts (the class of crashes that produced
     "undefined is not an object (evaluating 'window.BC.benchGz[iso]')"). -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Backcast Results — Run Report</title>
<link rel=stylesheet href="frontend/css/style.css">
<style>
:root{--mr:#7b8794;
 /* Canonical ISO colors (docs/DESIGN_SYSTEM.md) — used to color-code the market
    toggle and header badge so the active ISO is unmistakable. */
 --iso-ercot:#22C55E;--iso-pjm:#0EA5E9;--iso-caiso:#F59E0B;--iso-nyiso:#E91E63;
 --iso-neiso:#9C27B0;--iso-miso:#F97316;--iso-spp:#14B8A6;--iso-default:#4A90D9;}
body{background:var(--bg-page)}
.bc-wrap{display:flex;gap:var(--space-lg);max-width:var(--content-max);margin:0 auto;padding:var(--space-lg);align-items:flex-start}
.bc-side{flex:0 0 248px;position:sticky;top:var(--space-md);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-md)}
.bc-main{flex:1;min-width:0}
.bc-side h3{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:var(--space-md) 0 var(--space-sm)}
.bc-side h3:first-child{margin-top:0}
/* ISO / market toggle — the primary axis. A native <select> (mobile-friendly:
   the OS picker handles small screens) wrapped with a color dot that follows
   the active ISO's --c. */
.isoselwrap{position:relative;display:flex;align-items:center}
.isoselwrap .dot{position:absolute;left:13px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));pointer-events:none}
.isosel{width:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--c,var(--border));background:var(--bg-surface);border-radius:var(--radius-md);padding:11px 34px 11px 33px;font-size:var(--fs-sm);font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm)}
.isosel:focus{outline:2px solid var(--c,var(--accent));outline-offset:1px}
.isoselwrap::after{content:"";position:absolute;right:14px;width:8px;height:8px;border-right:2px solid var(--ink-muted);border-bottom:2px solid var(--ink-muted);transform:rotate(45deg) translateY(-2px);pointer-events:none}
.isohint{font-size:var(--fs-xs);color:var(--ink-faint);margin:7px 2px 0;line-height:1.4}
/* Header ISO badge — echoes the active market next to the page title. */
.isobadge{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:700;color:#fff;background:var(--c,var(--accent));padding:4px 12px 4px 10px;border-radius:999px;box-shadow:var(--shadow-sm);white-space:nowrap}
.isobadge .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.92)}
/* Run picker — a visible radio list (newest first), no popup. */
.runlist{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto}
.runopt{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-sm);padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent}
.runopt:hover{background:#eef3f9}
.runopt.on{background:#eef3f9;border-color:var(--border)}
.runopt input{margin:0;flex:0 0 auto;align-self:center}
.runopt .rlab{font-weight:600;color:var(--ink)}
.runopt .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep);cursor:pointer;text-decoration:underline dotted}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--bg-surface);border-radius:18px;padding:4px 11px;font-size:var(--fs-xs);cursor:pointer;color:var(--ink-muted)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bc-top{display:flex;flex-wrap:wrap;gap:var(--space-md);align-items:center;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-md);margin-bottom:var(--space-md)}
.seg{display:inline-flex;background:#eef1f4;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink-muted);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.lab{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--ink-muted);font-weight:600;text-transform:uppercase;margin-right:6px}
.ctl{display:flex;align-items:center;gap:8px}.ctlwide{flex:1 1 auto;min-width:240px}
.bc-top select{font-size:var(--fs-sm);padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--ink);max-width:100%}
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-lg);margin-bottom:var(--space-md)}
.panel h2{font-size:var(--fs-lg);margin:0 0 var(--space-sm)}
.psub{color:var(--ink-muted);font-size:var(--fs-sm);margin:0 0 var(--space-md)}
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-md)}
.kpicard{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd}
.kpicard .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep);cursor:pointer;text-decoration:underline dotted}
.kpicard .lbl{font-weight:700;font-size:var(--fs-sm);margin:2px 0 10px}
.kpirow{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-sm);padding:3px 0;border-top:1px solid var(--border)}
.kpirow .k{color:var(--ink-muted)}.kpirow .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.good{color:var(--success)}.ok{color:#b8860b}.bad{color:var(--danger)}
/* Per-year cards on the report scorecard / LMP grid. */
.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:var(--space-md)}
.lmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:var(--space-md)}
.ycard{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd;min-width:0}
.ycard .yhead{font-weight:800;font-size:var(--fs-base);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.ycard .yhead .ysub{font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted)}
/* Diagnostics findings list. */
.fnd{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--border);font-size:var(--fs-sm);line-height:1.55}
.fnd:first-of-type{border-top:0;padding-top:2px}
.fnd .sevdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.sev-good{background:var(--success)}.sev-ok{background:#e3b341}.sev-bad{background:var(--danger)}
.fnd .fhd{font-weight:700}
.fnd .ftag{display:inline-block;font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted);background:#eef1f4;border-radius:4px;padding:1px 7px;margin-left:7px;vertical-align:1px}
.fcat{font-size:var(--fs-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin:var(--space-md) 0 4px}
.fcat:first-child{margin-top:0}
.tablewrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md)}
table{border-collapse:collapse;width:100%;background:var(--bg-surface);font-size:var(--fs-sm)}
th,td{padding:7px 11px;border-bottom:1px solid #eef1f4;text-align:left;white-space:nowrap}
th{background:#f0f3f6;font-size:var(--fs-xs);text-transform:uppercase;color:#46505f;position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sub td{background:#f3f6f9;font-weight:700}
/* EIA-923 completeness flags on the generation-mix table (preliminary vintage):
   amber row = incomplete plant data (not gated), muted = immaterial, the ✓ badge
   marks a verified-complete class that DOES gate C1. */
tr.cmpl-inc td{background:#fff7ed}
tr.cmpl-imm td{color:var(--ink-faint)}
.badge923{display:inline-block;font-size:var(--fs-xs);font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.badge923.inc{background:#fde9d2;color:#9a5b12}
.badge923.imm{background:#eceff2;color:#7b8794}
.badge923.ok{background:#d8f0dd;color:#1f7a3d}
.svgbox{width:100%;overflow:hidden}svg.chart{width:100%;height:auto;display:block;max-width:100%}
canvas.heat{width:100%;height:160px;image-rendering:pixelated;border:1px solid var(--border);border-radius:6px;background:#eef3f7;display:block}
.ax{display:flex;justify-content:space-between;color:var(--ink-muted);font-size:var(--fs-xs);margin:3px 2px 0}
.legend{display:flex;align-items:center;gap:14px;font-size:var(--fs-sm);color:var(--ink-muted);margin:8px 0;flex-wrap:wrap}
.swatch{display:inline-block;width:20px;height:0;border-top-width:3px;border-top-style:solid;vertical-align:middle;margin-right:5px}
.ramp{height:11px;width:150px;border-radius:3px;background:linear-gradient(90deg,#e8f3f7,#7fc4e6,#86c98f,#f2d65c,#ef8f3c,#c0392b)}
.narr{margin-top:var(--space-md);border-top:1px solid var(--border);padding-top:var(--space-md)}
.narr .ndef{font-size:var(--fs-sm);margin:6px 0;color:var(--ink)}
.narr .rid{font-family:var(--font-mono);color:var(--accent-deep)}
#bctip{position:fixed;display:none;z-index:99;max-width:320px;background:#1a2233;color:#fff;font-size:var(--fs-sm);line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:var(--shadow-md)}
#diag{margin:var(--space-md) 0;padding:var(--space-md);border:1px solid var(--warning);border-radius:var(--radius-md);color:#8a6d00;background:#fffaf0}
.hide{display:none}
.sumband{color:var(--ink-muted);font-size:var(--fs-xs);margin:6px 0 0;display:flex;gap:16px;flex-wrap:wrap}
.sumband i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media(max-width:820px){.bc-wrap{flex-direction:column;padding:var(--space-sm)}.bc-side{position:static;width:100%;flex-basis:auto}.bc-main{width:100%}
 .runlist{max-height:190px}}
@media(max-width:640px){th,td{padding:6px 7px;font-size:var(--fs-xs)}
 .bc-top{flex-direction:column;align-items:stretch;gap:var(--space-sm)}
 .ctl{justify-content:space-between;flex-wrap:wrap}.ctlwide{min-width:0}
 .seg{flex:1;flex-wrap:wrap}.seg button{flex:1}.bc-top select{flex:1}
 .kpigrid,.yeargrid,.lmpgrid{grid-template-columns:1fr}.svgbox{margin:0 -4px}}
/* ===== Calibration Status view (all-ISO summary) ===== */
.mute{color:var(--ink-faint)}
.cs-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:var(--fs-xs);color:var(--ink-muted);margin-top:8px;line-height:1.5}
.cs-legend span{display:inline-flex;align-items:center;gap:6px}
.cs-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot-cal{background:var(--success)}.dot-cav{background:#cf9a1e}.dot-not{background:var(--danger)}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-md)}
.cs-card{border:1px solid var(--border);border-left-width:5px;border-radius:var(--radius-md);padding:var(--space-md);background:var(--bg-surface);box-shadow:var(--shadow-sm)}
.cs-card.det-cal{border-left-color:var(--success)}
.cs-card.det-cav{border-left-color:#cf9a1e}
.cs-card.det-not{border-left-color:var(--danger)}
.cs-cardhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cs-iso{font-weight:800;font-size:var(--fs-lg)}
.cs-badge{font-size:var(--fs-xs);font-weight:800;letter-spacing:.02em;color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap}
.cs-badge.det-cal{background:var(--success)}.cs-badge.det-cav{background:#cf9a1e}.cs-badge.det-not{background:var(--danger)}
.cs-keeper{font-size:var(--fs-sm);color:var(--ink-muted);margin-bottom:8px;line-height:1.5}
.cs-keeper .rid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent-deep)}
.cs-reason{font-size:var(--fs-sm);line-height:1.5;margin:0 0 10px}
.cs-marks{display:flex;flex-wrap:wrap;gap:5px}
.cs-mk{display:inline-flex;flex-direction:column;align-items:center;min-width:34px;border:1px solid var(--border);border-radius:6px;padding:3px 4px;background:#fbfcfd}
.cs-mk .code{font-size:9px;letter-spacing:.02em;color:var(--ink-muted);font-weight:700}
.cs-mk .glyph{font-size:14px;font-weight:800;line-height:1.15}
.cs-detail{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;background:var(--bg-surface);overflow:hidden}
.cs-detail>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:700;background:#f7f9fb}
.cs-detail>summary::-webkit-details-marker{display:none}
.cs-detail>summary::before{content:"\25B8";color:var(--ink-muted);font-size:12px;flex:0 0 auto}
.cs-detail[open]>summary::before{content:"\25BE"}
.cs-detail>summary .cs-badge{margin-left:auto}
.cs-st{font-weight:800;text-align:center;font-size:var(--fs-base)}
.cs-gate{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted)}
.cs-matrix td,.cs-tests td{white-space:normal;vertical-align:top}
.cs-matrix td:first-child{font-weight:600}
.cs-tests td:first-child{font-weight:700;white-space:nowrap}
.cs-rec{padding:2px 0;font-size:var(--fs-sm);line-height:1.5}
.cs-rec .mk{font-weight:800;margin-right:5px}
.cs-rec b{font-weight:700}
.cs-allok{color:var(--ink-muted);font-size:var(--fs-sm)}
.cs-tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.tag-miss{background:#fdecea;color:#b32218}
.tag-lim{background:#fef6e7;color:#8a6400}
.cs-ledger{font-size:var(--fs-xs);color:var(--ink-muted);line-height:1.5;margin:3px 0 5px 20px;padding-left:8px;border-left:2px solid var(--border)}
.cs-method{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-md)}
.cs-method .m{border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);background:#fbfcfd}
.cs-method .m h4{font-size:var(--fs-sm);margin:0 0 6px}
.cs-method .m p{font-size:var(--fs-sm);color:var(--ink);line-height:1.55;margin:0}
/* Top-level left-panel menu (Dashboard vs Calibration Status). */
.bc-nav{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--space-md);padding-bottom:var(--space-md);border-bottom:1px solid var(--border)}
.bc-nav button{text-align:left;border:1px solid transparent;background:transparent;padding:9px 11px;border-radius:var(--radius-md);font-size:var(--fs-sm);font-weight:700;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;gap:8px}
.bc-nav button .ic{font-size:14px;line-height:1}
.bc-nav button:hover{background:#eef3f9;color:var(--ink)}
.bc-nav button.on{background:var(--accent);color:#fff}
/* Tiles are clickable (select a market → its full results render below). */
.cs-card{cursor:pointer;transition:box-shadow .12s,border-color .12s}
.cs-card:hover{box-shadow:var(--shadow-md)}
.cs-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cs-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset,var(--shadow-md)}
.cs-open{margin-top:10px;font-size:var(--fs-xs);font-weight:700;color:var(--accent-deep)}
.cs-card.sel .cs-open{color:var(--accent-deep)}
.cs-reshd{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.cs-reshd .cs-iso{font-size:var(--fs-lg)}
@media(max-width:640px){.cs-grid,.cs-method{grid-template-columns:1fr}}
</style></head><body>

mean 33.93/39.23/68.33 (neiso-23 34.06/39.00/69.60; vs actual DA 36.82/41.47/67.86 -> -7.8%/-5.4%/+0.7%, marginally closer to actual on 2024/2025, ~flat 2023). Hourly hub MAE 15.23/14.11/21.60. TAIL PRESERVED: model hrs>$200 0/0/13 (IDENTICAL to neiso-23; actual 72/43/290) \u2014 summer/winter scarcity neither collapsed nor re-inflated (2025 model max $258.98). The local band is the forecast-defensible exogenous outage input (keys on net load, not price) and produces an equivalent-or-marginally-better calibration; adopted as the keeper-of-record on the correct input. Carries forward all neiso-23/neiso-22 caveats (priced-import seam node required before a forecast run; daily-AGT winter-oil convexity stays rejected).", "file": "frontend/data/backcast/runs/2026-06-22-neiso-24-local-band.js", "id": "2026-06-22-neiso-24-local-band", "iso": "NEISO", "label": "neiso 24 local band", "shorthand": "neiso-24-local-band", "years": [2023, 2024, 2025]}, {"date": "2026-06-22", "definition": "neiso 25 fullstop-override outage re-gate (NEW KEEPER, supersedes neiso 24). The neiso-24 keeper config (run_calibration_full.py --iso NEISO --year 2023 2024 2025 --commitment --ct-deployment --hydro-backfill-year 2024 --hydro-eia930-monthly; monthly gas-hub-basis overlay on by default; CHP BTM basis fix in code) re-solved on the SHARED FULL-STOP DURATION OVERRIDE outage input (commits 56ca468/debad10): filter_revealed_outages now keeps a detected down-span if it overlaps >=24 high-net-load hours OR is a sustained full stop (span mean-CF<0.02) for >=14 continuous days, recovering the thin layer of genuinely-mechanical 14-20d weeks-long dead stops the local band still dropped at the 24h overlap margin. Measured-only (CAMPD CF + EIA-930 net load), one shared N=14/depth across all ISOs, no per-ISO constant, no price/MWh-residual (claude.md #11/#12: keep real measured outages). NEISO recovered +39 windows / 15 spans (Merrimack coal, Granite Ridge/Newington/Westbrook/Bellingham CC, Stony Brook, Pittsfield), 0.6% of detected GW-days, all small units; the STEP-1 audit (docs/multi-iso/outage-gate-fullstop-override-2026-06.md) predicted a near-no-op for NEISO and it is. ONLY the outage CSV changed vs neiso 24 (auto picked up). RESULT vs neiso 24: gas tot 54.82/58.92/60.32 TWh vs EIA-930 55.47/59.64/60.09 -> -1.2%/-1.2%/+0.4% (neiso-24 -1.5/-1.4/+0.2, marginally CLOSER to EIA-930 on 2023/24); CC_REGULAR 52.35/56.50/57.88 (neiso-24 52.32/56.48/57.75; |d|<=0.13). LMP model mean 33.96/39.24/68.74 (neiso-24 33.93/39.23/68.33) vs actual DA 36.82/41.51/67.86 -> -7.8%/-5.5%/+1.3%. Hourly hub MAE vs actual RT 15.24/14.10/21.64 (IDENTICAL to neiso-24 15.23/14.11/21.60). TAIL PRESERVED: model hrs>$200 0/0/14 (neiso-24 0/0/13; actual RT 72/43/290), 2025 model max $258.98 unchanged -- the recovered winter full-stops (Granite Ridge/Merrimack Feb 2025) add exactly one marginal 2025 scarcity hour, neither collapsing nor re-inflating the tail. The full-stop override is the structurally-correct forecast-defensible exogenous outage input (keys on net load + measured CF, regenerates forward) and produces an equivalent-or-marginally-better calibration; adopted as keeper-of-record on the correct input. Carries forward all neiso-24/23/22 caveats: priced-import seam node REQUIRED before a forecast run (imports on a fixed EIA-930 schedule); winter oil under-generation (model 0.00/0.00/0.06 vs EIA-930 0.32/0.37/1.24 TWh) is the monthly-AGT-granularity limit and the dominant remaining residual -- the >$200 winter tail (0/0/14 vs 72/43/290) is downstream of it; daily-AGT winter-oil convexity stays REJECTED as a fitted constant (derive from measured daily AGT spot, upload U4).", "file": "frontend/data/backcast/runs/2026-06-22-neiso-25-fullstop-override.js", "id": "2026-06-22-neiso-25-fullstop-override", "iso": "NEISO", "label": "neiso 25 fullstop override", "shorthand": "neiso-25-fullstop-override", "years": [2023, 2024, 2025]}, {"date": "2026-06-23", "definition": "neiso 26 ps-diag (DIAGNOSIS, not a calibration keeper). Byte-faithful re-solve of the neiso-25 fullstop keeper config (--commitment --ct-deployment --hydro-backfill-year 2024 --hydro-eia930-monthly; identical offer curves/overlays/outages, scarcity off, PS adder 0) to surface and root-cause the newly-wired C5b storage-throughput metric. FINDING: NEISO PS under-cycles (2025 model 0.59 vs EIA-930 2.08 TWh, -72%) NOT because of a storage defect but because the energy-only LP collapses the scarcity tail (model >$200 hrs 0/0/14 vs actual 72/43/290; 2025 max $258.98 vs ~$1110). PS round-trip breakeven needs an intraday price ratio >1.25 (RTE 0.80); the model's median daily ratio is 1.15, so PS clears only ~50 days/yr (~20 cycles vs the ~107 needed for 2 TWh) -- energy cap (18.6 GWh) and the $0 adder are non-binding. Step-1 measurement audit: 2023 EIA-930 PS is fully blank and 2024 begins only in Nov (14.8% coverage), so the old +47% '2024 over-cycle' was a 2-month partial scored as a full year; fixed by a coverage gate in eia_loader (storage series <50% reported -> SKIPPED). 2025 under-cycle is a real MODEL MISS handed to the scarcity/winter-gas workstream (daily AGT spot U4 / NEISO reserve scarcity pricing) -- NO storage knob added (claude.md #1/#11/#12). DETERMINATION NOT-YET (C5b storage 2025 + pre-existing C1 CC_REGULAR 2025 +2.15 TWh inherited from neiso-25). See docs/multi-iso/neiso-ps-undercycling-diagnosis-2026-06.md.", "file": "frontend/data/backcast/runs/2026-06-23-neiso-26-ps-diag.js", "id": "2026-06-23-neiso-26-ps-diag", "iso": "NEISO", "label": "neiso 26 ps diag", "shorthand": "neiso-26-ps-diag", "years": [2023, 2024, 2025]}, {"date": "2026-06-23", "definition": "real daily AGT (EIA-narrative prints + Transco shape), retires demand-convexity proxy", "file": "frontend/data/backcast/runs/2026-06-23-neiso-27-agt-daily.js", "id": "2026-06-23-neiso-27-agt-daily", "iso": "NEISO", "label": "neiso 27 agt daily", "shorthand": "neiso-27-agt-daily", "years": [2023, 2024, 2025]}, {"date": "2026-06-24", "definition": "neiso-27 + EIA-930 hydro repin + storage vintage ramp + renewable/storage retirement ramp", "file": "frontend/data/backcast/runs/2026-06-24-neiso-28-hydro-codramp.js", "id": "2026-06-24-neiso-28-hydro-codramp", "iso": "NEISO", "label": "neiso 28 hydro codramp", "shorthand": "neiso-28-hydro-codramp", "years": [2023, 2024, 2025]}, {"date": "2026-06-24", "definition": "neiso-28 + biomass measured must-run injection + like-for-like total comparison", "file": "frontend/data/backcast/runs/2026-06-24-neiso-29-biomass-mustrun.js", "id": "2026-06-24-neiso-29-biomass-mustrun", "iso": "NEISO", "label": "neiso 29 biomass mustrun", "shorthand": "neiso-29-biomass-mustrun", "years": [2023, 2024, 2025]}, {"date": "2026-06-24", "definition": "(DIAGNOSTIC; keeper stays neiso-29) neiso-29 + OTHER residual class vintage-carry (2025 OTHER 2.61->2.78 TWh, measured EIA-923 like biomass): small correct fix (C1 +3.64->+3.56, C2 +3.0%->+2.5%). Solved on current main, so it also surfaces a8b0e55 (CC nameplate ~75%->92%) dropping NEISO prices 13-18% into under-prediction (C3a -15.9/-14.0/-8.1%) and storage -76% -- a SEPARATE NEISO CC-availability item, not the biomass/OTHER work.", "file": "frontend/data/backcast/runs/2026-06-24-neiso-30-other-carry.js", "id": "2026-06-24-neiso-30-other-carry", "iso": "NEISO", "label": "neiso 30 other carry", "shorthand": "neiso-30-other-carry", "years": [2023, 2024, 2025]}, {"date": "2026-06-24", "definition": "PROBE (rejected, not a keeper). Tests the bucket-A #1 scarcity hypothesis: steepen the NYISO locational RCPF reserve demand curves from the linear-ramp-to-zero stand-in to the published top-25%-span shape (critical_mw = 0.75 x requirement; FERC ER21-502 sets the NYCA 30-min $750 max at 1,965 = 0.75 x 2,620), plus the Ravenswood steam-HR correction. Finding: the steeper published curve DEEPENS the downstate tail faithfully (NYC max $138->$890, 2023 14h >$300) but does NOT add C3c tail HOURS (2024 0h, 2025 12h, unchanged) because the tail COUNT is incidence-gated by the model\u2019s too-loose downstate reserve headroom (idle NYC peakers provide ample reserve; perfect-foresight import over-service backs down downstate gas), not by the demand-curve slope. The deeper few-hour spikes push C3a mean LMP to +12% (over the +-8% band) for no C3c gain. CONCLUSION: the RCPF demand-curve SHAPE is not the C3c lever; the lever is downstate reserve INCIDENCE (locational headroom / import discipline) \u2014 the documented next structural step, out of scope as it would touch the nyiso-24 import reconciliation. The curve steepening is therefore NOT carried into the keeper (nyiso 25 steam-merit), which retains only the Ravenswood merit-order fix.", "file": "frontend/data/backcast/runs/2026-06-24-nyiso-25-scarcity-merit.js", "id": "2026-06-24-nyiso-25-scarcity-merit", "iso": "NYISO", "label": "nyiso 25 rcpf-steep (PROBE)", "shorthand": "nyiso-25-scarcity-merit", "years": [2023, 2024, 2025]}, {"date": "2026-06-24", "definition": "KEEPER. Re-solves the nyiso-24 import-reconciliation keeper config (byte-identical flags) with ONE model-side data correction (data.fleet.MIXED_FACILITY_STEAM_HR): the Ravenswood (plant 2500, NYC) mixed CC+ST facility had its ~1.7 GW steam units inheriting the 8.8 MMBtu/MWh plant-blended heat rate (the efficient combined cycle\u2019s efficiency leaking into the steam row), so the big NYC steam unit cleared AHEAD of idle NYC combined cycle on merit (the 2023 CC_REGULAR -4.06 / ST_GAS +3.55 TWh inversion). Recovered the steam units\u2019 own HR (9.5) by backing the CC (~7.5) out of the 8.8 generation-weighted blend; restores the physically-correct merit order (CC ahead of steam). CC_REGULAR improves EVERY year (2023 -4.06->-3.47, 2024 -3.21->-2.61, 2025 -1.20->-0.6) and the 2023 ST_GAS over-run shrinks (+3.55->+2.76). A rule-#11 measured-data correction, forward-reproducible, not fitted to a residual. Tradeoff (kept per rule #1): C3a 2025 mean LMP +9.3% (just over +-8%) because import-constrained NYC over-relies on Ravenswood steam as marginal \u2014 a discovered symptom of the NYC import-incidence root cause (out of scope), not a reason to revert the correct HR. The RCPF scarcity tail (C3c) is unchanged: it is incidence-gated, not curve-gated (see the nyiso 25 rcpf-steep PROBE). Determination NOT-YET (the hard EIA-930/923 gas basis floor, ledgered).", "file": "frontend/data/backcast/runs/2026-06-24-nyiso-25-steam-merit.js", "id": "2026-06-24-nyiso-25-steam-merit", "iso": "NYISO", "label": "nyiso 25 steam merit", "shorthand": "nyiso-25-steam-merit", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "NEISO CC_REGULAR committed min-load tranche re-anchored 0.92->1.27 (=econ_high) per measured CAMPD min-stable-load HR (1.30x avg vs full-load 0.93x); min-load priced at-or-above full-load SRMC, removes wall-masked cheap min-load block. a8b0e55 kept ON. vs neiso-30.", "file": "frontend/data/backcast/runs/2026-06-25-neiso-31-cc-minload.js", "id": "2026-06-25-neiso-31-cc-minload", "iso": "NEISO", "label": "neiso 31 cc minload", "shorthand": "neiso-31-cc-minload", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "vs neiso-31: dispatch-identical (CC min-load 1.27 re-anchor, a8b0e55 ON, biomass must-run, OTHER vintage-carry, measured AGT daily gas overlay all unchanged). Change is a BENCHMARK/attestation reconcile of NEISO solar: model & benchmark both on EIA-930 grid basis (already via actuals_source); documents that EIA-923 ISNE SUN (3.70/4.53 TWh) includes ~2.8-3.2 TWh distribution-connected/net-metered BTM PV netted into the EIA-930 net-load demand series, excluded from both sides by construction. Energy balance unchanged.", "file": "frontend/data/backcast/runs/2026-06-25-neiso-32-btm-solar.js", "id": "2026-06-25-neiso-32-btm-solar", "iso": "NEISO", "label": "neiso 32 btm solar", "shorthand": "neiso-32-btm-solar", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "vs neiso-32 (keeper): CT AS/RUC out-of-merit deployment-floor overlay REMOVED (ct_deployment_overlay OFF); every other flag/code path byte-identical. Determination-neutral AND dispatch-neutral: the overlay only ever injected 0.076/0.041/0.054 TWh/yr (<0.1% of generation), so removing it leaves gas-family 54.23/58.81/61.60 TWh, system mean LMP 33.95/38.91/66.70 $/MWh and CO2 unchanged, and the verdict stays NOT-YET with the IDENTICAL basis (undocumented fuelmix / price_tail / storage). The overlay was the calibration log's 'most answer-injecting' measured-CEMS floor yet did not flip any gate (CT_PEAKER is structurally under-produced ~0.5-0.9 TWh/yr by the energy-only LP \u2014 a reserves/local-reliability MODEL MISS the 0.04 TWh floor never closed). Removing it is strictly cleaner per CLAUDE.md #12 (one fewer measured-outcome injection) at zero cost to the backcast.", "file": "frontend/data/backcast/runs/2026-06-25-neiso-33-no-ctfloor.js", "id": "2026-06-25-neiso-33-no-ctfloor", "iso": "NEISO", "label": "neiso 33 no ctfloor", "shorthand": "neiso-33-no-ctfloor", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "Calibration run from bundle nyiso_26_cc-nameplate.", "file": "frontend/data/backcast/runs/2026-06-25-nyiso-26-cc-nameplate.js", "id": "2026-06-25-nyiso-26-cc-nameplate", "iso": "NYISO", "label": "nyiso 26 cc nameplate", "shorthand": "nyiso-26-cc-nameplate", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "Calibration run from bundle nyiso_27_cc-offer.", "file": "frontend/data/backcast/runs/2026-06-25-nyiso-27-cc-offer.js", "id": "2026-06-25-nyiso-27-cc-offer", "iso": "NYISO", "label": "nyiso 27 cc offer", "shorthand": "nyiso-27-cc-offer", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "REJECTED PROBE (keeper stays nyiso-27 cc-offer). Re-grounds _NYISO_OFFER_CURVE CC_REGULAR/CC_CHP/ST_GAS committed/econ_low/econ_high to NYISO's OWN CAMPD incremental-HR medians (derive_campd_marginal_hr.py, NY+NJ CEMS pooled 2023-25), removing the ERCOT-borrowed CC reach (1.21/1.24) and ST_GAS shape (1.10/1.45). Merit order preserved (CC econ_high eff HR 7.2/7.7 < ST committed 8.7). Result: the steam-side re-level nearly halves the 2024 ST_GAS under-run (-4.14->-2.22 TWh) and confirms steam was over-priced, but the bare CEMS marginal HR omits the competitive offer MARKUP (cost recovery + inframarginal rent) that NYISO has no offer disclosure to measure, cratering C3a mean LMP to -24.0%/-26.5%/-23.5% across 2023-25. Rule #1: a run missing real structure (the markup) is not a keeper. Carry-forward: ground a NYISO markup ON TOP of the native marginal HR (run 29).", "file": "frontend/data/backcast/runs/2026-06-25-nyiso-28-native-hr.js", "id": "2026-06-25-nyiso-28-native-hr", "iso": "NYISO", "label": "nyiso 28 native-hr (PROBE)", "shorthand": "nyiso-28-native-hr", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "REJECTED PROBE (keeper stays nyiso-27 cc-offer). Path A of the downstate synchronised-reserve fix: a NYISO-only default-off lever adding a NYC 10-min SPINNING sub-requirement (0.5 x NYC 10-min total = 250 MW, the published 1/2-largest-contingency rule) supplied by an ONLINE-bounded reserve class (R <= sum online P), forcing idle NYC peakers to commit. Confirms the mechanism (CT_PEAKER 2023 -1.30->-0.92, 2024 -1.51->-1.05 TWh; CC over-run down) but INSUFFICIENT for the tail (C3c >$300 unchanged 1/0/8; C3a 2024 -9.7%->-11.0%) -- the grounded 250 MW spin clears cheaply and never fires the RCPF, exactly PR #877's prediction. Scopes path B (zonal/family commitment-aware reserve). Lever reverted on the branch; implementation preserved in the bundle model_changes.diff.", "file": "frontend/data/backcast/runs/2026-06-25-nyiso-29-synch-reserve.js", "id": "2026-06-25-nyiso-29-synch-reserve", "iso": "NYISO", "label": "nyiso 29 synch-reserve [probe]", "shorthand": "nyiso-29-synch-reserve", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "NYISO import reconciliation made forecast-aware: backcast still targets the measured EIA-930 schedule (this run); forecast targets the neighbor's forecast net position (nyiso_forward_net_import_twh) or relaxes to the priced seam. Backcast path unchanged vs nyiso-27-cc-offer; re-solve confirms metrics hold.", "file": "frontend/data/backcast/runs/2026-06-25-nyiso-30-fwd-band.js", "id": "2026-06-25-nyiso-30-fwd-band", "iso": "NYISO", "label": "nyiso 30 fwd band", "shorthand": "nyiso-30-fwd-band", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "REJECTED PROBE (keeper stays nyiso-27 cc-offer). Path B of the downstate synchronised-reserve fix: commitment-gated spinning reserve (MILP-free). The NYC 250 MW spinning family rides the ordinary class-1 (quick-start) headroom while the P2 commitment screen zeroes decommitted availability, so the row equals Sum_online(pmax - P) -- the physically-correct synchronised headroom -- and a new reserve_adequacy_commit force-commits NYC quick-start to the measured 250 MW requirement. RESULT: a true no-op -- every scored metric reproduces the keeper essentially exactly (C1 CT_PEAKER 2023 -1.30/2024 -1.51 TWh; C3c >$300 1/0/8 vs actual 10/12/42; C3a 2024 -9.7%), and P1==P2 prices. ROOT CAUSE: the committed NYC quick-start fleet holds ~1,700 MW of genuine online headroom in the tightest hours vs a 500 MW 10-min / 250 MW spin requirement, so the measured reserve requirement is NON-BINDING and no RCPF tail can form -- commitment removes only offline pmax, not the dominant committed-but-backed-off headroom. Both path A (nyiso-29 online proxy) and path B are thus confirmed insufficient with grounded inputs; the >$300 downstate tail stays an accepted, ledgered open frontier on nyiso-27 (closing it would need an ungrounded requirement/adder, forbidden by rule #12). Wiring kept as a NYISO-only default-off scaffold; implementation in the bundle model_changes.diff.", "file": "frontend/data/backcast/runs/2026-06-25-nyiso-31-synch-commit.js", "id": "2026-06-25-nyiso-31-synch-commit", "iso": "NYISO", "label": "nyiso 31 synch-commit [probe]", "shorthand": "nyiso-31-synch-commit", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "run134 recipe re-solved with measured 2023 AS; load-RRS-from-year=2023; storage-AS-from-year=2025; ecrs-requirement=False; battery-adder=0.0", "file": "frontend/data/backcast/runs/2026-06-25-run155b-netload-gas-adder0.js", "id": "2026-06-25-run155b-netload-gas-adder0", "iso": "ERCOT", "label": "run155b netload gas adder0", "shorthand": "run155b-netload-gas-adder0", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "run134 recipe re-solved with measured 2023 AS; load-RRS-from-year=2023; storage-AS-from-year=2024; ecrs-requirement=False; battery-adder=0.0", "file": "frontend/data/backcast/runs/2026-06-25-run155c-netload-gas-storage.js", "id": "2026-06-25-run155c-netload-gas-storage", "iso": "ERCOT", "label": "run155c netload gas storage", "shorthand": "run155c-netload-gas-storage", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "(PROBE \u2014 REJECTED) run155a keeper + measured ECRS reserve requirement ON from 2023 (ercot_ecrs_requirement). Tested the May-2024 under-price hypothesis. Verdict: rejected. The flat +~2 GW ECRS reserve add does NOT fix May 2024 (load-wtd $23.6->$24.0, target $38-45) because May is not physically reserve-thin in the model \u2014 the co-opt ORDC steps only bite in genuinely-thin hours, so the add OVERSHOOTS Aug 2024 ($30.4->$53.5 vs actual 36) and catastrophically over-fires 2023-H2 (annual $48->$128, Aug $147->$598; no storage-AS credit in 2023). Battery throughput held (2024 0.78 TWh). Confirms the May miss is DAM ancillary-service co-optimized scarcity (hypothesis 4), not RT energy/reserve thinness. Keeper remains run154/run155a.", "file": "frontend/data/backcast/runs/2026-06-25-run156-ecrs-requirement-probe.js", "id": "2026-06-25-run156-ecrs-requirement-probe", "iso": "ERCOT", "label": "run156 ecrs requirement probe", "shorthand": "run156-ecrs-requirement-probe", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "run155a keeper + NEW measured Day-Ahead AS-scarcity overlay (--ercot-dam-as-overlay): post-solve additive system-price adder = the binding DAM AS MCPC (per-hour max of cleared RegUp/RRS/ECRS/NonSpin, ERCOT 60-Day DAM Disclosure) on hours the DAM co-optimized energy+AS INTO scarcity (>$150). Fixes the May-2024 DAM-AS-co-opt under-price: May load-wtd $23.6->$46.7 (actual DA $44.8), 2024 monthly price-shape NRMSE 0.430->0.206. Held: Apr $26.4, Aug $34.7 (<$40), 2023 (Aug $147, scoped off via from-year=2024 so RTORDPA carries 2023 \u2014 no double-count), 2025 $34.8; battery 2024 0.775 TWh unchanged (post-solve, dispatch identical to run155a). Measured/backcast-able, not fit to LMP.", "file": "frontend/data/backcast/runs/2026-06-25-run157-dam-as-overlay.js", "id": "2026-06-25-run157-dam-as-overlay", "iso": "ERCOT", "label": "run157 dam as overlay", "shorthand": "run157-dam-as-overlay", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "(PROBE) the CURRENT keeper recipe (run157: DAM-AS overlay + RTORDPA, storage-AS-from-2024, STGAS-drag off, West net-load Waha gas step) re-solved with ONE change \u2014 the two-regime split frequency made ENDOGENOUS (gap G6 closed): collapse_freq from forecast West/Panhandle oversupply (West+Panhandle wind+solar > local load + WESTEX/PNHNDL export TTC) via fuel.ercot_west_oversupply_collapse_freq, replacing the measured Waha neg_day_freq. Validation (endogenous vs measured): 0.017/0.003/0.006 vs 0.030/0.420/0.110 for 2023/24/25 \u2014 the proxy tracks 2023 but is ~0 in 2024/25 because local load + the 12.68 GW takeaway absorbs all West VRE; the measured 2024 0.42 was a Permian gas-pipeline-takeaway event (no forward analogue, #12). Effect kept per #1/#11: West gas firm ~99% of hours, so CT_PEAKER under-runs (5.90/5.22/5.00 vs 7.56/8.21/7.11). NOT-YET (fuelmix 2024 ST_GAS, sysvol 2025 gas, price_mean/price_shape \u2014 run157-recipe + energy-only-dual limits). Demonstrates G6 closure on the keeper recipe; not a keeper.", "file": "frontend/data/backcast/runs/2026-06-25-run158-netload-gas-endogenous.js", "id": "2026-06-25-run158-netload-gas-endogenous", "iso": "ERCOT", "label": "run158 netload gas endogenous", "shorthand": "run158-netload-gas-endogenous", "years": [2023, 2024, 2025]}, {"date": "2026-06-25", "definition": "run157 keeper config (verified-faithful reproduction; new current-code flags ercot_multiproduct_as_coopt/hydro_forecast_budget are default-off no-ops) + NEW uncurtailed-VRE wiring for the no-HSL years (renewables.py _UNCURTAILED_FALLBACK_ISOS). ERCOT 2024/25 have no NP6 HSL parquet, so they previously fell back to EIA-930 net-of-curtailment delivered generation (curtailment baked in, LP could not re-curtail). Now the dispatch gets an uncurtailed potential: the weather-year delivered profile grossed up by the per-tech reference curtailment rate from the most recent HSL year (ERCOT 2023: wind 4.67%, solar 6.29%), so the LP curtails endogenously. 2023 is unchanged (uses its own HSL). Modeled re-curtailment: wind 2.2-2.4%, solar 0.4-1.7% across 2023-25 vs measured/reference 4.67%/6.29% \u2014 the reduced 6-zone network curtails less than ERCOT's local transmission constraints (a DIAGNOSTIC, never a fit target, rule #11). Supersedes the mis-numbered run158-hsl (collided with another session's run158). NOT-YET: governance gate (no attestation) + C1 CC_REGULAR over-run. NOTE: the C1 regression vs run157 is dominated by INTERVENING main-code changes since run157 was solved, not this HSL change \u2014 the 2023 control year (renewables byte-identical to run157) independently regressed CC_REGULAR +8.57 TWh / COAL_PRB -3.78 / ST_GAS -5.10; the HSL change adds only ~+1.5 CC / ~-4 COAL_PRB to 2024 on top of that. Pre-existing ERCOT CC-over-run on main to investigate separately.", "file": "frontend/data/backcast/runs/2026-06-25-run160-hsl-endogenous-curtailment.js", "id": "2026-06-25-run160-hsl-endogenous-curtailment", "iso": "ERCOT", "label": "run160 hsl endogenous curtailment", "shorthand": "run160-hsl-endogenous-curtailment", "years": [2023, 2024, 2025]}, {"date": "2026-06-26", "definition": "Calibration run from bundle 160.", "file": "frontend/data/backcast/runs/2026-06-26-160-as-aware-commit.js", "id": "2026-06-26-160-as-aware-commit", "iso": "ERCOT", "label": "160 as aware commit", "shorthand": "160-as-aware-commit", "years": [2023, 2024, 2025]}, {"date": "2026-06-26", "definition": "Calibration run from bundle 161.", "file": "frontend/data/backcast/runs/2026-06-26-161-reserve-supply-cap.js", "id": "2026-06-26-161-reserve-supply-cap", "iso": "ERCOT", "label": "161 reserve supply cap", "shorthand": "161-reserve-supply-cap", "years": [2023, 2024, 2025]}, {"date": "2026-06-26", "definition": "NEW KEEPER (supersedes nyiso-27 cc-offer). The documented run-29 carry-forward from the rejected nyiso-28 native-hr probe: re-level the legacy gas-steam (ST_GAS) offer from the ERCOT-shaped rising ramp (committed 0.97 / econ_low 1.10 / econ_high 1.45) to NYISO's OWN measured CAMPD marginal heat rate x a grounded competitive markup (committed 1.05 / econ_low 1.08 / econ_high 1.13). Markup = the CC class's own defensible reach ratio (keeper CC econ_high 1.21 / native CC marginal 0.925 = 1.31x) applied to the flat steam native marginal HR (~0.82-0.83); CC reach UNCHANGED at the nyiso-27 keeper (the markup that holds the clearing price). Merit order preserved (steam eff HR 11.1-12.0 > CC 9.4, < CT 16.1; no inversion). Result -- HARD C1 fuel-mix IMPROVES across the board: 2023 ST_GAS -1.26 -> -0.01 TWh (now PASS, the flat measured band reproduces measured steam volume almost EXACTLY -> offer level validated a priori, not residual-fitted), CC_REGULAR +1.70 -> +0.99 (PASS); 2024 ST_GAS -4.14 -> -3.28, CC_REGULAR +2.09 -> +1.74. dispatch_corr stays PASS (gas r=0.91/0.84/0.80). SOFT C3a mean LMP regresses to a documented CAVEAT (2023 in-band -> -10.5%, 2024 -9.7% -> -11.2%): the keeper-27 steep steam ramp was a COMPENSATING over-pricing that propped up the mid-merit price; removing it (the measured-grounded move) exposes the real root cause -- the missing reserve-scarcity / RCPF tail (same cause as the CT_PEAKER C1 miss), confirmed NON-CLOSABLE with grounded inputs by nyiso-29 (online-proxy spin) and nyiso-31 (commitment-gated spin). Kept per CLAUDE.md rule #1 (a measured mechanism stays in even though the fit worsens; reverting would reach C3a through a mechanism that isn't real and re-open the volume miss; raising steam to chase C3a would distort the volume-validated level, rule #12) -- the same promotion principle as nyiso-25. Import/export: net-interchange import reconciliation + priced node unchanged; the downstate interface-TTC congestion separation (U7) stays data-blocked. Governance C6 PASS; determination NOT-YET (price_shape/price_tail = the genuine reserve-scarcity model gap, unledgered MODEL MISS, same open frontier on every NYISO keeper). Reproduce: the nyiso-27 keeper flags + --offer-curve-json '{\"ST_GAS\": {\"committed\": 1.05, \"econ_low\": 1.08, \"econ_high\": 1.13}}'.", "file": "frontend/data/backcast/runs/2026-06-26-nyiso-32-steam-markup.js", "id": "2026-06-26-nyiso-32-steam-markup", "iso": "NYISO", "label": "nyiso 32 steam-markup [keeper]", "shorthand": "nyiso-32-steam-markup", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "Calibration run from bundle 162fwdas.", "file": "frontend/data/backcast/runs/2026-06-27-162fwdas-full-fwdas-coopt.js", "id": "2026-06-27-162fwdas-full-fwdas-coopt", "iso": "ERCOT", "label": "162fwdas full fwdas coopt", "shorthand": "162fwdas-full-fwdas-coopt", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "Forward AS requirement (G3): run159 multi-product co-opt with each AS product (RegUp/RRS/ECRS/NonSpin) set from a forward formula of forecast drivers (net-load, ramp, VRE-share, forecast-error, load-ratio) instead of the measured AS Plan. Modeled-vs-measured requirement MW holds (total up-AS 0.94/0.98/1.02x). Acute/tail: 2025 clean (MAE 2.5), 2023 acute held; 2024 May acute under-fires ($21.7 vs measured-req $40) \u2014 ERCOT's discretionary day-specific acute AS uplift has no forward-driver analogue (not pinned; honesty gate). Measured DAM-AS overlay (run157) stays the pre-RTC+B bridge for the discretionary component.", "file": "frontend/data/backcast/runs/2026-06-27-163-forward-as-requirement.js", "id": "2026-06-27-163-forward-as-requirement", "iso": "ERCOT", "label": "163 forward as requirement", "shorthand": "163-forward-as-requirement", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "Endogenous storage energy-vs-AS co-opt (G5): run163 + ercot_storage_as_endogenous + RTOLCAP reserve-supply cap. The battery CHOOSES energy vs upward-AS inside the multi-product co-opt (full power cap, room competes with arbitrage on the same cap, priced by the per-product AS demand curves) \u2014 REPLACING the measured 60-Day DAM battery AS-award reservation. Cleared storage AS counts toward the measured RTOLCAP online supply (which already includes batteries); the cap is a pure supply bound (the additive ORDC adder is gated off \u2014 the co-opt prices endogenously), so acute/tail HOLDS vs run163: acute 8/24/26 $24.6/$21.7/$30.2, 2025 clean. Measured-vs-modeled split (mean MW, storage-first UPPER bound): modeled AS 2427/4036/5680 vs measured 1249/2045/2824 (~2x), AS share 95/93/89% \u2014 AS-dominated and rising with the fleet as in reality, but over-holds AS vs the measured level (documented residual, NOT retuned to it; the split is the LP's choice, validated against the award not pinned to it). 2023/24 annual under-price inherited from run163's broad-May energy-base residual, not this lever.", "file": "frontend/data/backcast/runs/2026-06-27-164-storage-as-endogenous.js", "id": "2026-06-27-164-storage-as-endogenous", "iso": "ERCOT", "label": "164 storage as endogenous", "shorthand": "164-storage-as-endogenous", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "(PROBE) Priced-interchange + dual-limb weather floor: registers import/export as its own dashboard class (the fuelRows 'interchange' row, model vs EIA-930 net interchange) the same way CAISO/PJM measure it. Surfaces a real miss \u2014 the NEISO priced import/export node OVER-IMPORTS (net import model vs actual 18.1/15.1 (2023), 18.8/10.3 (2024), 27.4/8.1 TWh (2025)): the import tranches are sized to the import envelope, not calibrated to net energy, so the LP floods cheap imports and under-runs domestic gas. Keeper stays the measured-schedule run (neiso 35); priced mode needs import-tranche price/capacity calibration before it is a keeper. Carries the new temperature-correlated reliability floor (CT_PEAKER hot-limb TMAX, COAL/ST_GAS cold-limb TMIN).", "file": "frontend/data/backcast/runs/2026-06-27-neiso-34-import-export.js", "id": "2026-06-27-neiso-34-import-export", "iso": "NEISO", "label": "neiso 34 import export", "shorthand": "neiso-34-import-export", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "neiso-37 = the neiso-33 keeper recipe (measured Algonquin/EIA-MA-citygate DAILY gas-hub basis overlay + dual-fuel oil re-attribution + EIA-930-pinned hydro budget with 2024 plant-capacity backfill + biomass/OTHER measured must-run + historic outage overlay + storage vintage ramp) WITH the dual-limb temperature-correlated reliability floor (neiso_temp_reliability_floor: CT_PEAKER hot-limb on TMAX, COAL/ST_GAS cold-limb on TMIN) added on top. Restores the measured daily gas-hub basis overlay (--gas-hub-basis-daily) that neiso-36 had accidentally dropped: with only the flat MONTHLY hub, the within-month cold-day Algonquin spikes never crossed distillate parity, so the physical dual-fuel gas->oil switch never tripped, modeled oil collapsed ~1.6->0.05 TWh and relabeled back onto gas-CC (gas-family C2 +4.3%, FAIL). With the daily overlay restored the switch trips on the real cold-day prints, 2025 oil returns to 1.60 TWh and the gas family lands 60.85 vs EIA-930 59.76 (+1.8%, C2 PASS). Verdict CALIBRATED-WITH-CAVEATS: 1 HARD C1 CC_REGULAR 2023/24 gas-vs-EIA-930-OTHER fold-in categorization caveat + carried soft C3c price-tail and C5b storage caveats; C6 attested. Promotes NEISO keeper 33 -> 37.", "file": "frontend/data/backcast/runs/2026-06-27-neiso-37-weather-floor.js", "id": "2026-06-27-neiso-37-weather-floor", "iso": "NEISO", "label": "neiso 37 weather floor", "shorthand": "neiso-37-weather-floor", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "NEW KEEPER (supersedes nyiso-32 steam-markup). Adds a temperature-keyed DOWNSTATE CT_PEAKER local-reliability floor (--nyiso-ct-reliability-floor) on top of the nyiso-32 steam-markup keeper -- the CAISO local-RA CT floor ported to NYISO's cable-constrained downstate load pockets (NYC zone J, Long Island zone K, Lower Hudson). On hot afternoons the downstate cooling load climbs and the UPNY-SENY / LI-cable import limits bind, so fast-start GTs are held online for local capacity-area reliability; an energy-only LP imports cheap upstate/NYC CC instead and under-runs CT_PEAKER. Floor = clip(base + slope*(TMAX-25), base, cap) x available downstate-CT capacity over HB14-21, with slope=0.053/degC, cap=0.68, base=0.13 -- ALL regressed a priori from the measured downstate CAMPD CT_PEAKER evening CF vs NYC daily max temperature (NOAA GHCN), pooled 2023-2025 (scripts/derive_nyiso_ct_reliability_floor.py; archived data/raw/nyiso-weather/). A physical heat->commitment rule, forward-reproducible (a forecast year pins a weather year, hence a TMAX series), NOT a CEMS pin and NOT residual-tuned (CT_PEAKER lands UNDER actual, so not over-forced). Result -- the HARD C1 fuel-mix improves decisively: CT_PEAKER (the open frontier on EVERY prior NYISO keeper, and confirmed non-closable via a grounded reserve REQUIREMENT by nyiso-29/31) 2023 -1.73 -> -0.85 TWh and 2024 -1.92 -> -0.85 TWh, FAIL -> PASS both scored years; the complementary CC_REGULAR over-run drops 2023 +0.99 -> +0.63 (PASS) and 2024 +1.74 -> +1.25 (FAIL -> PASS). 2023 now has every gas class in C1 tolerance. dispatch_corr stays PASS (gas r=0.91/0.85/0.80). TRADEOFF (kept per rule #1): C3a mean LMP regresses ~1.3pp (2023 -10.5 -> -11.7%, 2024 -11.2 -> -12.7%, 2025 -7.3 -> -8.6%) because the floor is a min-gen (must-run) representation -- it recovers the local-RA ENERGY but adds inframarginal supply rather than letting the peakers SET a scarcity price; the price side (C3a/C3c) remains the ledgered reserve-scarcity frontier (an ORDC/reserve-scarcity demand curve, non-closable with grounded inputs per nyiso-29/31). Remaining C1 miss: 2024 ST_GAS -3.77 TWh (the floor pulls some evening energy from downstate steam too). Most structurally faithful NYISO config to date: it adds a real, measured, forward-reproducible local-reliability mechanism that closes the largest C1 miss -- the rule-#1 'right market structure' step the reserve-requirement attempts could not take. Governance C6 PASS; determination NOT-YET (2024 ST_GAS C1 + price_shape/price_tail reserve-scarcity gap). Reproduce: nyiso-32 keeper flags + --nyiso-ct-reliability-floor (now the live default for NYISO).", "file": "frontend/data/backcast/runs/2026-06-27-nyiso-33-ct-tempfloor.js", "id": "2026-06-27-nyiso-33-ct-tempfloor", "iso": "NYISO", "label": "nyiso 33 ct-tempfloor [keeper]", "shorthand": "nyiso-33-ct-tempfloor", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "nyiso-34 builds on the nyiso-33 ct-tempfloor keeper and adds a temperature-keyed downstate ST_GAS (gas-steam) local-reliability floor (--nyiso-st-reliability-floor), the ST-fleet companion to the CT floor. MECHANISM: NYISO's downstate steam fleet (NYC zone J Ravenswood/Arthur Kill/Astoria; Long Island; Capital) runs a persistent in-city/cable-islanded reliability baseline an energy-only LP zeroes out (it imports cheaper CC instead), so the backcast under-runs ST_GAS. The floor is a persistent 24h baseline with an evening cooling hot-limb layered over HB14-21 via maximum, applied per-unit pro-rata (each in-pocket unit floored at frac x its OWN available capacity), keyed per zone to its load-center daily max temperature (Islip/Central Park/Albany, NOAA GHCN). Carries two structural corrections it depends on (when-available CF basis; the second per the attestation) plus a benchmark-basis fix, all flagged as methodology fixes, not residual tunes. Verdict CALIBRATED-WITH-CAVEATS: 4 documented caveats + storage unscored; C6 attested. [SUPERSEDED 2026-07-02: this verdict reflects the run's own era (sha 180d579 + dirty floor patch, legacy injectors since deleted); the bundle re-scores NOT-YET on current main and the run is not reproducible there. NYISO keeper is now 2026-07-02-nyiso-39-priced-interchange, which reproduces the same determination on the unified engine.]", "file": "frontend/data/backcast/runs/2026-06-27-nyiso-34-st-tempfloor.js", "id": "2026-06-27-nyiso-34-st-tempfloor", "iso": "NYISO", "label": "nyiso 34 st tempfloor", "shorthand": "nyiso-34-st-tempfloor", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "Calibration run from bundle 162e.", "file": "frontend/data/backcast/runs/2026-06-27-run162e-merit-order-energy.js", "id": "2026-06-27-run162e-merit-order-energy", "iso": "ERCOT", "label": "run162e merit order energy", "shorthand": "run162e-merit-order-energy", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "Calibration run from bundle 162f.", "file": "frontend/data/backcast/runs/2026-06-27-run162f-merit-order-keeper.js", "id": "2026-06-27-run162f-merit-order-keeper", "iso": "ERCOT", "label": "run162f merit order keeper", "shorthand": "run162f-merit-order-keeper", "years": [2023, 2024, 2025]}, {"date": "2026-06-27", "definition": "Structural forward build (G4): run164 + the enrollment-driven forward load-resource RRS-UFR credit (ercot_load_resource_reserve) \u2014 the LAST measured AS *input* on the supply side given a forward analogue. Load Resources provide Responsive Reserve via under-frequency relays (RRS-UFR, an ERCOT-protocol load-side-only service the co-opt omitted); the credit nets it off the RRS product's reserve-balance RHS after the demand curve is sized to the gross peak (tail preserved). Mode-aware: BACKCAST reads the measured NP3-911 (~0.9 GW, byte-identical), FORECAST reads the enrollment forward lr_rrs(t)=enrolled_DR_MW(year)x mean-1 availability shape (enrollment ~0.9 GW today -> ~1.4 GW protocol cap). Composes with the RTOLCAP cap (300b89c) and endogenous storage AS (ea8c656) with no double count (load resources are outside RTOLCAP). Acute HELD vs run164: May 8/24/26 $24.6/$21.7/$30.2; tail RELAXES per the designed forward response (more load-side reserve -> fewer scarcity hours): h>$200 36/4/1 vs run164 57/12/3, model annual 30.0/20.7/33.0 vs 34.3/21.3/33.1. Measured-vs-forward load-resource RRS (mean MW): measured 884/904/787 vs enrollment 780/840/900 (0.88-1.14x \u2014 trend reproduces the present level, not pinned to the year wiggle). DETERMINATION NOT-YET (same inherited broad-May energy-base / merit-order residual as run164: fuelmix/sysvol/price \u2014 separate track, NOT retuned here). Honesty gate: enrollment from a forward trend, never the cleared MW pinned to a price. ERCOT broad-month keeper remains run157.", "file": "frontend/data/backcast/runs/2026-06-27-run165-load-resource-rrs.js", "id": "2026-06-27-run165-load-resource-rrs", "iso": "ERCOT", "label": "run165 load resource rrs", "shorthand": "run165-load-resource-rrs", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "caiso 35 reference-price seam: replaces the measured per-hub OASIS hub-LMP ladder (caiso_per_hub_intertie) with the forward-native reference-price seam (caiso_reference_price_seam) \u2014 both legs of each WECC corridor priced from (HH + gas_basis) x HR x load-shape +/- hurdle, CARB border carbon on import leg, export at hub - hurdle; HR anchors from measured Malin/Palo-Verde annual-mean RT LMP / delivered gas (derive_caiso_seam_hr_by_year.py; rule #11/#12); corridor ATC switched to the forward one-sided import envelope (caiso_corridor_atc_forward) so the export direction is free to the physical TTC. All other caiso 34 levers verbatim. Net-interchange error narrows to +3.56/+2.78/+4.40 TWh (2023/24/25, was chronically negative in prior keepers) and diurnal shape r improves to 0.88/0.93/0.89, confirming the seam correctly liberates midday solar export. However the CAISO price body-overprice is unchanged from caiso 34: CA-zone avg LMP ~100/63/69 vs actual ~44/33/34 (C3a +128%/+90%/+104%; C3b NRMSE 0.77/0.98/1.09; C3c scarcity hours 744/0/0 vs actual 21/35/8), and C6 governance gate is unattested (no calibration_attestation.json). Determination NOT-YET: failing C3a/C3b/C3c price-body gates and unattested C6.", "file": "frontend/data/backcast/runs/2026-06-28-caiso-35-reference-seam.js", "id": "2026-06-28-caiso-35-reference-seam", "iso": "CAISO", "label": "caiso 35 reference seam", "shorthand": "caiso-35-reference-seam", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "(PROBE - REJECTED, not a keeper; caiso 35 remains the keeper) Tested the hypothesis that caiso 35's CA-zone LMP over-price is the reference-seam price being too smooth midday: deepened the WECC seam net-load convexity (DSW exp 1.0->2.5; PNW gross->net exp 1.5), lowered the midday floor to a small negative, dropped the inflated partial-coverage 2023 hr_by_year. RESULT: the body did NOT improve (CA-zone LMP 98.7/69.7/75.3 vs actual 43.8/33.0/33.6; 744 h >$200 in 2023 unchanged) and interchange REGRESSED (2023 err +3.56->+8.49 TWh; 2024 +2.78->-4.95 flip to under-import; 2024 diurnal r 0.93->0.49). DIAGNOSIS: the body over-price is DOMESTIC, not the seam - midday the marginal unit is economic gas_cc bidding ~89 (implied HR ~25 = fuel + P1 startup-amort + reserve co-opt), with NO model midday solar surplus (solar fully used, CA still needs 6.5 GW gas_cc), and the model already imports ~4x the measured midday volume. Source reverted to caiso 35. See results/calibration/DIAGNOSIS-caiso36-body-overprice-domestic-2026-06-28.md.", "file": "frontend/data/backcast/runs/2026-06-28-caiso-36-midday-convexity.js", "id": "2026-06-28-caiso-36-midday-convexity", "iso": "CAISO", "label": "caiso 36 midday convexity", "shorthand": "caiso-36-midday-convexity", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "caiso 37 offer-curve: give CAISO its own ISO-specific gas offer curve (_CAISO_OFFER_CURVE) instead of the silently-inherited ERCOT heat-rate multipliers + ERCOT CT 13.15x $5,000-ORDC wall. The fix for the DOMESTIC CA-zone midday/body LMP over-price diagnosed in caiso 36 (the seam is fine; gas_cc offer level sets the midday body). CC_REGULAR re-grounded to the measured CAMPD CC marginal-HR shape (econ 1.06/1.27 -> 0.95/1.21, physical duct-fire peak 2.25 kept); CT_PEAKER peak capped 13.15 -> 4.0 (CAISO $1,000-2,000 soft cap, PJM's reasoning), econ re-grounded to the DMM DEB cost-plus- adder shape (1.27/1.98 -> 1.10/1.50), committed start hurdle 1.55 -> 1.35 (NYISO-grounded, CTs serve the evening ramp). Grounded in CAISO DMM market structure + measured CAMPD heat rates, NOT the price residual (rules #1/#11). CC_CHP/CT_CHP/ST_GAS/coal keep the generic defaults; ERCOT/PJM/other ISOs byte-identical. All caiso 35 seam levers verbatim.", "file": "frontend/data/backcast/runs/2026-06-28-caiso-37-offer-curve.js", "id": "2026-06-28-caiso-37-offer-curve", "iso": "CAISO", "label": "caiso 37 offer curve", "shorthand": "caiso-37-offer-curve", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "Two measured-grounded structural levers on top of miso18 (export cap retained). LEVER 1 -- cc_intermediate_split: MISO's combined-cycle fleet runs baseload (measured CAMPD median CF 50-150 %; all 39 CC plants clear the threshold), yet inherited the CC_REGULAR offer curve shaped for ERCOT duct-fire-heavy peaker CCs (econ ramp 1.06-1.27x); the upper econ tranches over-priced the already-committed fleet and the model under-ran CC. fleet.cc_intermediate_plants routes the measured cohort to the new CC_INTERMEDIATE curve (econ 0.95-1.08x flat near-baseload incremental cost), keeping the physically-real duct-burner peak (2.25x) unchanged. LEVER 2 -- miso_pjm_border_anchor: the PJM neighbor price was anchored to PJM system-average LMP, which is pulled up by eastern load centres; constants.MISO_PJM_BORDER_HR_BY_YEAR re-anchors to the equal-weight mean of the three MISO-facing western PJM hubs (ComEd/AEP/ATSI), per-year ratio 0.981/0.956/0.936 (2023/24/25), deepening as eastern congestion widens. Both levers trace to measured inputs (CAMPD median CF; PJM zonal RT LMP), assign offer/price shapes, never pin output. Headline vs miso18: net-interchange duration RMSE 2024 1252->1051 MW, 2025 2037->1717 MW; total net-interchange |error| 23.5->20.5 TWh; gas |error| vs EIA-923 (3yr) 55.1->50.8 TWh. NOT-YET: residual gas-CC under-run 2023/24 (~-23/-20 TWh), 2025 dear-gas coal over-run (+14.2 TWh), and import under-run 2024/25 are open MODEL MISS items; exceptions ledger empty.", "file": "frontend/data/backcast/runs/2026-06-28-miso21-cc-border-anchor.js", "id": "2026-06-28-miso21-cc-border-anchor", "iso": "MISO", "label": "miso21 cc border anchor", "shorthand": "miso21-cc-border-anchor", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "One architectural lever on top of miso21 (all prior levers retained: export cap, cc_intermediate_split, miso_pjm_border_anchor, firm-import/seam-flow/coal-mustrun/sigmoid stack): MISO receives its own ISO-specific gas offer curve (_MISO_OFFER_CURVE, deep-merged on iso==\"MISO\"), the same design PJM, NYISO, and CAISO already use, replacing the inherited ERCOT-fit generic fallback that had never been validated for MISO. Two gas classes change, all others keep the generic default. CC_REGULAR econ ramp flattened econ_low 1.06->0.95 / econ_high 1.27->1.08 to match MISO's measured all-baseload CC shape (CAMPD: 44 CC_REGULAR plants, cap-weighted HR 7.44, median CF 50-150%); committed base (0.92) and duct-burner scarcity peak (2.25) are physically unchanged. CT_PEAKER peak capped 13.15->4.0 to MISO's offer-cap-consistent level, removing the inherited ERCOT ORDC $5000 wall (same reasoning PJM used), with committed and econ ramp left at the generic shape. Metric-neutral vs miso21 (cc_intermediate_split already routed MISO's baseload CC cohort to the flat curve; 0 scarcity hours so the CT cap has zero dispatch effect): every fuel class within +-0.6 TWh of miso21, 2025 system volume marginally better. Value is architectural consolidation + correct CC base + removed ERCOT wall, not residual closure. NOT-YET: residual CC_REGULAR over-run / CT+ST under-run (import under-run root cause), 2025 dear-gas coal over-run (+13.8 TWh), import under-run 2024/25, and 0 scarcity hours are open MODEL MISS items; exceptions ledger empty.", "file": "frontend/data/backcast/runs/2026-06-28-miso22-offer-curve.js", "id": "2026-06-28-miso22-offer-curve", "iso": "MISO", "label": "miso22 offer curve", "shorthand": "miso22-offer-curve", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "neiso-39 = the neiso-38 keeper recipe EXACTLY (measured Algonquin/EIA-MA-citygate DAILY gas-hub basis overlay + dual-fuel oil re-attribution + EIA-930-pinned hydro budget with 2024 plant-capacity backfill + biomass/OTHER measured must-run + historic CAMPD outage overlay + storage vintage ramp + the dual-limb temperature-correlated reliability floor + the neiso_floor_outage_exempt Merrimack/ST_GAS availability fix) WITH one structural-parity refactor and NO behaviour change: NEISO's gas offer curve is consolidated into a single grounded, commented _NEISO_OFFER_CURVE dict deep-merged on iso==NEISO, at parity with _PJM_OFFER_CURVE / _NYISO_OFFER_CURVE. Previously NEISO carried one scattered inline override (CC_REGULAR committed 1.27) and silently inherited the generic ERCOT-derived 'else' for every other gas band (incl. the 13.15x CT_PEAKER peak wall). Step 1 (this run) is behavior-preserving: every band is transcribed exactly from NEISO's prior effective curve, so config builds for all 7 ISOs are byte-identical AND this 3-year solve reproduces the neiso-38 keeper byte-for-byte on every metric (gas 54.19/58.72/61.42 TWh, oil 0.35/0.25/1.59, hydro 8.70/7.33/5.11, LMP 33.93/38.88/66.60). Step 2 (grounded re-level: shape from NEISO's own CAMPD HRs, cap the ERCOT-derived CT peak to ~3-4x vs the ISO-NE IMM/Potomac EMM) is deferred and documented as a follow-up. At promotion (2026-06-28) this run's determination read as calibrated-with-caveats (C2/C3a/C3b/C4/C5a/C6 PASS; C1 CC_REGULAR gas-vs-EIA-930-OTHER fold-in + C3c price-tail + C5b storage caveats carried unchanged from neiso-38). Current determination is NOT-YET: a subsequent NEISO bench refresh (accompanying the neiso-41 relfloor-rebuild run) moved the 2025 gas-family target, and neiso-39's unchanged dispatch now fails C2 system-volume (2025 gas +2.8%), which is undocumented in this bundle's exceptions ledger and so is not carried as an accepted caveat -- a benchmark-side drift, not a dispatch regression in neiso-39 itself. Promotes NEISO keeper 37 -> 39 (and lands the neiso-38 availability fix, previously only a patch file); note a newer NEISO run (neiso-41-relfloor-rebuild) already exists in the registry.", "file": "frontend/data/backcast/runs/2026-06-28-neiso-39-offer-curve.js", "id": "2026-06-28-neiso-39-offer-curve", "iso": "NEISO", "label": "neiso 39 offer curve", "shorthand": "neiso-39-offer-curve", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "pjm 60 ERCOT-parity: port 6 calibrated mechanisms from ERCOT run-157 keeper to fix price duration curve compression. (1) CT peak 4.0\u219210.0 (ERCOT 13.15) for scarcity pricing. (2) offer_curve_smoothing_mid=0.35 (convex ramp). (3) cc_duct_peaking=True (per-plant EIA-860 duct-burner flags). (4) battery_dispatch_adder=$10 (cycling degradation). (5) storage_daily_cycling=True. (6) chp_steam_following=True (CHP grid injection floor). All other levers pjm 59 verbatim.", "file": "frontend/data/backcast/runs/2026-06-28-pjm-60-parity.js", "id": "2026-06-28-pjm-60-parity", "iso": "PJM", "label": "pjm 60 parity", "shorthand": "pjm-60-parity", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "pjm 61 consolidate: keep the structurally-correct pjm 59 fixes (CT_PEAKER dispatch fix committed 0.878->1.25 / econ_low 0.879->1.05 so CTs clear as ~3% CF peakers not ~100% baseload; ct_intermediate_split threshold=30%; CC_REGULAR peak 3.4->5.0; cc_duct_peaking_cap_pct 12->18% uniform ceiling) + add offer_curve_smoothing_mid=0.35 (convex econ ramp). DROP the harmful pjm 60 ERCOT ports (battery_dispatch_adder=$10, storage_daily_cycling, per-plant cc_duct_peaking flag, chp_steam_following). Price-tail decompression is a separate structural build (energy+reserve co-opt) blocked on memory (co-opt OOMs >16 GB) and commitment posture \u2014 see docs/multi-iso/pjm-reserve-ordc.md.", "file": "frontend/data/backcast/runs/2026-06-28-pjm-61-consolidate.js", "id": "2026-06-28-pjm-61-consolidate", "iso": "PJM", "label": "pjm 61 consolidate", "shorthand": "pjm-61-consolidate", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "(PROBE, rejected) pjm 62 coopt deliverable: pjm 61 consolidate config + energy_reserve_coopt with deliverable reserve-supply scoping (pjm_reserve_supply_cap = \u03a3 ramp10[eligible] + pjm_reserve_online_gated \u03c1=1.0). Measured PJM Primary req (~3.4 GW) vs published two-step ORDC, cleared inside the LP. RESULT: reserve cleared $0 in every hour, so prices are IDENTICAL to the pjm 61 energy-only keeper-candidate (2023 26.42/56.50, 2024 24.89/58.66, 2025 35.06/76.97 avg/max). This is the expected honest confirmation (handoff step 2): the deliverable cap is ~50 GW and online \u03c1\u00b7\u03a3P is huge \u2014 both \u226b the ~3.4 GW requirement on a ~180 GW fleet \u2014 because the perfect-foresight LP is not tight when PJM's real RT was tight. The top-tail decompression needs per-gen R[g]\u2264ramp10[g] (reserve competing with energy on the marginal unit) PLUS commitment tightening, NOT zone-aggregate scoping. Memtest correction: the zone-aggregate co-opt FITS the 15 GB box (~14.5 GB peak/yr), so the doc's prior 'cannot run any co-opt on 15 GB' claim was stale. Nothing fitted to the residual (claude.md #11).", "file": "frontend/data/backcast/runs/2026-06-28-pjm-62-coopt-deliverable.js", "id": "2026-06-28-pjm-62-coopt-deliverable", "iso": "PJM", "label": "pjm 62 coopt deliverable", "shorthand": "pjm-62-coopt-deliverable", "years": [2023, 2024, 2025]}, {"date": "2026-06-28", "definition": "(PROBE, not promoted) pjm 63 offercurve: pjm 61 consolidate energy-only config + a one-lever offer-curve reshape. CC_REGULAR econ_high 1.38->1.60 + peak 5.0->6.0 (steepen CC upper econ ramp + widen duct-firing scarcity band); CT_PEAKER committed 1.25->1.10 / econ_low 1.05->0.95 / econ_high 1.40->1.20 / peak 4.0->3.0 (lower the whole peaker curve). No reserve co-opt. RESULT: lifted the price-duration BODY ~+0.5 $/MWh avg/yr (2023 26.42->26.87, 2024 24.89->25.38, 2025 35.06->35.59 avg) but the TOP TAIL stayed flat/down (max 2023 56.50->56.46, 2024 58.66->57.57, 2025 76.97->76.83). Diagnostic: the CC duct-firing peak tranche rarely clears so widening it didn't lift the max; lowering CT_PEAKER capped the max (the CT peaker is the model's top-hour marginal/ceiling unit). Offer-curve tuning (CLAUDE.md #1 second step), nothing fitted to the residual (#11). Memory peak 11.8 GB.", "file": "frontend/data/backcast/runs/2026-06-28-pjm-63-offercurve.js", "id": "2026-06-28-pjm-63-offercurve", "iso": "PJM", "label": "pjm 63 offercurve", "shorthand": "pjm-63-offercurve", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "caiso-38 replaces CAISO's EIA-923 gas price series (7-plant NorCal/SDG&E-skewed sample, $4.45/MMBtu 2024) with the measured SoCal/PG&E Citygate hub basis overlay (gas_hub_basis_overlay: EIA N3050CA3 - Henry Hub from gas_basis_by_iso_month.csv, the same mechanism as NEISO doc-08), reconciled up to the full-census CA electric-power delivered price (EIA N3045CA3 $3.84) via the measured citygate-to-burner-tip intrastate-transport adder (CAISO_CITYGATE_TRANSPORT_ADDER +0.46 = N3045CA3 - N3050CA3 2024), so the marginal CC bids its true delivered fuel cost rather than the skewed 7-plant estimate \u2014 measured, forward-reproducible, not residual-tuned (rule #11). Headline: CA-zone (NP15/ZP26/SP15) demand-weighted LMP fell 95.7/61.0/64.8 \u2192 85.7/57.1/62.5 $/MWh (2023/24/25; actual 43.8/33.0/33.6), but interchange regressed +1.33/+0.12/+2.78 \u2192 \u22122.38/\u22125.46/\u2014 TWh because the corrected lower gas exposed an import-ATC miscalibration that the inflated gas price had been masking \u2014 a discovered structural bug (rule #11), not a reason to revert. All caiso-37 offer-curve + seam levers carried verbatim; ERCOT/PJM/NYISO/NEISO byte-identical. NOT-YET: C1 (CC_REGULAR over-run, CT_PEAKER under-run 2023/24), C2 (2025 gas), C3a/b/c (LMP body/shape/tail), C4 (dispatch correlation), C5a (CO2) all remain open MODEL MISS; C6 governance unattested.", "file": "frontend/data/backcast/runs/2026-06-29-caiso-38-delivered-gas.js", "id": "2026-06-29-caiso-38-delivered-gas", "iso": "CAISO", "label": "caiso 38 delivered gas", "shorthand": "caiso-38-delivered-gas", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "caiso 39 import-ATC re-grounding: re-ground the WECC corridor forward-ATC base fractions (CAISO_PER_HUB_NEIGHBORS) to the measured p95 overnight net-import deliverability (PNW 0.30->0.43, DSW 0.50->0.56), closing the import-ATC compression the caiso 38 finding exposed (model import swing 2,321 vs actual 4,596 MW). Midday solar floor stays 0.30 (the p95 midday ratio overstates the typical ceiling and inverts the diurnal). Measured-deliverability grounded (rule #11/#12), NOT residual-tuned. All caiso 38 levers verbatim; ERCOT/PJM/NYISO/NEISO byte-identical.", "file": "frontend/data/backcast/runs/2026-06-29-caiso-39-import-atc.js", "id": "2026-06-29-caiso-39-import-atc", "iso": "CAISO", "label": "caiso 39 import atc", "shorthand": "caiso-39-import-atc", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "caiso 40: RA must-offer bridge min-load 0.40->0.26 (CAMPD-measured CA CC min stable load, CLAUDE.md #11)", "file": "frontend/data/backcast/runs/2026-06-29-caiso-40-ra-minload.js", "id": "2026-06-29-caiso-40-ra-minload", "iso": "CAISO", "label": "caiso 40 ra minload", "shorthand": "caiso-40-ra-minload", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "Calibration run from bundle caiso-41-endogenous-spill.", "file": "frontend/data/backcast/runs/2026-06-29-caiso-41-endogenous-spill.js", "id": "2026-06-29-caiso-41-endogenous-spill", "iso": "CAISO", "label": "caiso 41 endogenous spill", "shorthand": "caiso-41-endogenous-spill", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "(PROBE) miso25 + energy_reserve_coopt=True (MISO RBDC, BPM-002/Schedule 28-A). Reserve co-opt is structurally correct but worsened the import overshot: net imports rose to 51.4/38.6/23.6 TWh (2023/24/25) vs actual 37.9/23.1/19.0 \u2014 worse than miso25's 46.7/32.4/21.4 \u2014 because reserved gas headroom is backfilled by cheap seam imports, leaving gas under-dispatched (215.7/226.0/191.4 TWh vs EIA-923 ~249/258/208). Model import flow is also too deep overnight (p50 -6869 vs actual -4330 MW in 2023) and too volatile (diurnal swing 4832 vs 1020 MW). Root cause is the seam reference price lacking an hourly shape, not reserves. Rejected; energy_reserve_coopt stays OFF for MISO until the seam price is fixed.", "file": "frontend/data/backcast/runs/2026-06-29-miso-26-reserve-coopt.js", "id": "2026-06-29-miso-26-reserve-coopt", "iso": "MISO", "label": "miso 26 reserve coopt", "shorthand": "miso-26-reserve-coopt", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "Offer-SHAPE faithfulness fix on top of miso22 (all miso22/miso21 levers retained): correct the CC_REGULAR committed (min-stable-load) band 0.92 -> 1.20 to the measured CAMPD part-load premium (a CC's min-load $/MWh is ~30-40% above full-load SRMC), so the min-load tranche prices ABOVE the full-load body (committed > econ_high > econ_low) instead of below it; capped just under the ST_GAS non-inversion ceiling (1.227). METRIC-NEUTRAL vs miso22 (gmModel CC_REGULAR -1.5/-0.8/-0.9 TWh, the right direction on the over-run; ST_GAS / CT_PEAKER / coal / prices all <0.5 TWh / <$0.1/MWh): the committed band is a must-run min-load PRICE block whose volume is set by commitment, so it corrects merit ORDER without moving volume. Determination NOT-YET (unchanged C1/C2 misses): the CC-over/CT-under substitution is NOT offer-curve-addressable (CC excess is in its measured-flat econ body; CT deficit is gated by the missing scarcity mechanism + the 2024/25 import under-run -- separate root causes). Keeper on faithfulness grounds (correct min-load offer ordering), not on a fit gain.", "file": "frontend/data/backcast/runs/2026-06-29-miso23-cc-minload-premium.js", "id": "2026-06-29-miso23-cc-minload-premium", "iso": "MISO", "label": "miso23 cc-minload-premium", "shorthand": "miso23-cc-minload-premium", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "Replace the PJM import seam's synthetic gas x HR reference price with measured PJM-west border-hub hourly DA LMP (equal-weight mean of CHICAGO GEN / AEP GEN / ATSI GEN hubs, PJM Data Miner). Mirrors the proven CAISO intertie-hub pattern: measured price overwrites ONLY the PJM seam import/export rows after inject_reference_price_mc; SPP/South seams keep gas x HR. All 8 import tranches get the same measured price + hurdle. NO firm floor, NO adder. Fixes the 2025 import under-run (gmModel import 21.4 vs 19.0 actual, was 5.8 keeper); 2024 moves right direction but overshoots (32.4 vs 23.1 actual, was 17.0 keeper); 2023 over-imports (46.7 vs 37.9 actual, was 39.4 keeper). The 2023/2024 overshot is price-correct: measured PJM LMP ($28-29/MWh mean) is cheaper than internal MISO clearing prices, so the LP imports the full capacity; the root cause is the CC over-run inflating domestic supply cost. CC_REGULAR down -3.4/-5.1/-4.3 TWh (right direction); CT_PEAKER unchanged (gated by missing scarcity mechanism). Determination NOT-YET (C1 CC/CT substitution unchanged). Structurally more faithful than keeper (measured price > synthetic estimate, rule #11).", "file": "frontend/data/backcast/runs/2026-06-29-miso25-pjm-lmp-import.js", "id": "2026-06-29-miso25-pjm-lmp-import", "iso": "MISO", "label": "miso25 pjm lmp import", "shorthand": "miso25-pjm-lmp-import", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "(PROBE \u2014 REJECTED) miso25 flag set + --interchange-shaping-export-only: shape ONLY the export leg of the priced interchange node to the measured EIA-930 (month x hour-of-day) envelope, leaving imports uncapped (clear on price under the existing seam flow cap). Intent: impose the measured diurnal envelope on exports without over-starving baseload imports. RESULT: WRONG LEVER \u2014 net imports got WORSE in all 3 years (model 52.97/39.44/29.66 TWh vs miso25 46.7/32.4/21.4, actual 37.9/23.1/19.0), because shaping the export leg down to the small measured MISO export profile removed the model's balancing exports and pushed NET imports up. Diurnal swing barely moved (peak->trough 4803 MW 2023 vs miso25 4832, actual 1020): the over-deep overnight problem lives on the IMPORT leg, which export-only leaves uncapped, so it cannot fix gap (1). import-hours ~100% all years (vs 98/91/79 actual). Superseded by miso27b (full --interchange-shaping, both legs). energy_reserve_coopt and firm-import-floor stay OFF.", "file": "frontend/data/backcast/runs/2026-06-29-miso27-interchange-shape-export.js", "id": "2026-06-29-miso27-interchange-shape-export", "iso": "MISO", "label": "miso27 interchange shape export", "shorthand": "miso27-interchange-shape-export", "years": [2023, 2024, 2025]}, {"date": "2026-06-29", "definition": "(PROBE) miso25 flag set + full --interchange-shaping (both legs, default percentile=90): shape the priced interchange node by the measured EIA-930 (month x hour-of-day) net-interchange envelope \u2014 import availability capped overnight-deep/midday-shallow, export min_gen released to the measured midday export. FIXES gap (1), the diurnal volatility: peak->trough swing drops to 1959/1636/1674 MW (2023/24/25) from miso25's ~4832, vs actual 1020/999/1471 \u2014 the measured deliverability envelope (admissible rule #12, same class as miso_seam_flow_limit) is the right structure and stays. BUT overcorrects the LEVEL: net imports now UNDERSHOOT actual \u2014 23.93/13.79/10.28 TWh vs actual 37.9/23.1/19.0 (miso25 overshot 46.7/32.4/21.4). Root cause is structural and documented in inject_interchange_shape: the full shape caps *gross* import availability at the *net*-import envelope (net << gross since MISO imports AND exports across different seams), starving baseload imports \u2014 the LP imports ~100% of hours (2023/24) but the per-hour cap binds low. Import depth too shallow at every percentile (2023 p10/p50/p90 -4502/-2714/-538 vs actual -7130/-4330/-1596). Collateral: 2025 coal over-runs (+26 TWh vs EIA-923) backfilling the missing imports; energy-balance drift -4.5/-4.8 TWh in 2024/25. Lever for the level is the code's designed INTERCHANGE_SHAPE_IMPORT_PCT 'bidir sweep' (fatten the deliverable overnight tail) -> miso27c (import_pct=97). NO firm floor, energy_reserve_coopt OFF.", "file": "frontend/data/backcast/runs/2026-06-29-miso27b-interchange-shape-full.js", "id": "2026-06-29-miso27b-interchange-shape-full", "iso": "MISO", "label": "miso27b interchange shape full", "shorthand": "miso27b-interchange-
