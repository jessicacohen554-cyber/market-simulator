# Scenario campaign case set (SCN-WS0 deliverable 4).
#
# The plan's §3.5 case set, in `cases:` mode, every LIVE case one or two field
# overrides on the REF base
# (configs/scenarios/<iso>_scenario_base_2026_{2030,2050}.yaml). Charter:
# docs/handoffs/forecast-scenario-readiness-plan-2026-09.md §3.0 (what REF is),
# §3.5 (this table), §4 (the caveats a campaign carries).
#
# ── READ THIS BEFORE USING THE LEVELS ──────────────────────────────────────
# EVERY NUMBER BELOW IS ILLUSTRATIVE PENDING OWNER CARD D-2 (plan §6, presented
# 2026-09-05 by SCN-DESK r#1, unruled at this file's writing). Scenario levels
# are the owner's what-ifs by definition and are never a modeller's choice
# (rule 1 [R-STRUCT]); this file exists so the HARNESS is exercisable before
# D-2, not to pre-empt it. When D-2 is ruled, the levels here are replaced
# wholesale by the ruled ones and the case names stay.
#
# ── WHAT IS COMMENTED OUT, AND WHY ─────────────────────────────────────────
# A case whose override field does not exist in ScenarioConfig at this commit
# is listed COMMENTED, never as a live key: a live key naming a missing field
# would fail at load, and a silently-dropped one would be worse. Each carries
# the lane that lands its field. Uncomment when that lane merges — the case
# name and its question are already fixed here so the campaign's shape does
# not drift while the fields arrive.
#
# ── THE CARBON LADDER IS THE DELTA FORM, DELIBERATELY ──────────────────────
# Plan §3.5 writes the carbon ladder as `carbon_price_path: low/mid/high`, and
# notes it needs "floor semantics after WS-1". At this commit those semantics
# are NOT in: G-C1 (plan §8) is live — an explicit RFF path SUPPRESSES the
# projected state-program price, so on CAISO/NYISO/NEISO every RFF path sits
# BELOW the program trajectory and a `carbon_price_path` case is a carbon
# price CUT on exactly the three ISOs that have a carbon program. Shipping it
# live would ship a ladder whose sign is wrong on half the campaign. The live
# ladder therefore uses `carbon_price_delta`, which policy.carbon applies
# ADDITIVELY on the resolved signal after its whole precedence chain, so the
# sign is right in every ISO with or without a program. This is the same
# reduced form the desk assigned to SCN-WS1b while D-1 is open. The path form
# is kept commented directly beneath, to be swapped in by WS-1a's D-1 repair.
mode: cases

cases:
  # ── The reference. Every delta in the campaign is measured against this. ──
  # Deliberately empty: REF IS the ISO's shipped forecast posture at the
  # campaign's frozen HEAD (plan §3.0), so it overrides nothing at all.
  REF: {}

  # ── Carbon price → dispatch re-ordering, CCS, thermal mix, VRE entry ──────
  # $/tCO2 ADDED to each ISO's resolved carbon signal (a state program's
  # trajectory where one exists, zero where none does). ILLUSTRATIVE knots
  # pending D-2; 25 is the level SCN-WS1b's reduced-form probe is chartered on.
  CARB-LO:
    carbon_price_delta: 15.0
  CARB-MID:
    carbon_price_delta: 25.0
  CARB-HI:
    carbon_price_delta: 50.0
  # The plan's own path form, BLOCKED on G-C1 / owner card D-1 (replace vs
  # floor vs additive). Lands with SCN-WS1a. Swap these in for the three
  # deltas above once the resolver reads a path as a FLOOR on the program
  # trajectory rather than a replacement:
  #   CARB-LO:  {carbon_price_path: low}
  #   CARB-MID: {carbon_price_path: mid}
  #   CARB-HI:  {carbon_price_path: high}

  # ── Price vs quantity: the mass-cap instrument on the program ISOs ────────
  # BLOCKED, and not on a missing field — `mass_cap_enabled` / `mass_cap_tons`
  # both exist. It is blocked on the LEVEL: the case is a DECLINING budget and
  # `mass_cap_tons` is a single scalar, so the declining schedule has no
  # expression here, and its starting budget is a per-ISO D-2 number that no
  # lane has derived. SCN-WS1a holds the pre-declared CAP-STATE-TIGHT case
  # (desk ledger §1); it lands the schedule and the cited budgets.
  #   CAP-STATE-TIGHT:
  #     mass_cap_enabled: true
  #     mass_cap_tons: <per-ISO declining budget — SCN-WS1a / owner D-2>

  # ── National CES, uniform-PRICE (tradeable) form: the response curve ──────
  # Premium in real 2026$/MWh. The {10, 20, 30} ladder stands from owner
  # decision D8 (national-ces-eac-premium plan), which is why these three are
  # the least illustrative numbers in this file.
  CES-P10:
    federal_ces_enabled: true
    federal_ces_premium_usd_per_mwh: 10.0
  CES-P20:
    federal_ces_enabled: true
    federal_ces_premium_usd_per_mwh: 20.0
  CES-P30:
    federal_ces_enabled: true
    federal_ces_premium_usd_per_mwh: 30.0

  # ── National CES, uniform-SHARE (no-trade) form: dual = implied EAC price ──
  # BLOCKED on missing fields — `federal_ces_target_by_year` and the ACP field
  # do not exist at this commit. Lands with SCN-WS2a (the endogenous national
  # CES target row, plan §3 WS-2 items 1-2). Target schedule and ACP are two
  # of the numbers D-2 explicitly reserves to the owner.
  #   CES-T80:
  #     federal_ces_enabled: true
  #     federal_ces_target_by_year: {2026: <current>, 2035: 0.80, 2050: 1.00}
  #     federal_ces_acp_usd_per_mwh: <owner D-2>

  # ── Voluntary clean demand → curtailment, entry, CO2 ──────────────────────
  # BLOCKED on a missing field — `voluntary_clean_demand_path` does not exist
  # at this commit. Lands with SCN-WS3b, and ONLY if owner card D-3 rules the
  # axis admissible (plan §6 D-3); if D-3 rules NO, these cases and
  # CES-P20+VOL-HI below are struck from the campaign with a ledger note.
  #   VOL-MID: {voluntary_clean_demand_path: mid}
  #   VOL-HI:  {voluntary_clean_demand_path: high}

  # ── Load growth → adequacy, backstop, CO2 per MWh ─────────────────────────
  # Both axes are live fields. G-L3 (plan §8) is the reason there are TWO high
  # cases and not one: organic growth and the data-centre block are independent
  # axes, so "the high case" has to declare its pairing rather than assume it.
  # LOAD-HI pairs both high; LOAD-HI-ORGANIC holds the DC block at its shipped
  # "mid" so the organic half is separable. SCN-WS4b pre-declares how each
  # ISO's high case is READ for adequacy (desk ledger §1).
  #
  # ── SCN-WS4b DECLARATION (2026-09-06, plan §3 WS-4 items 1 + 3) ─────────
  # Full adjudication: docs/handoffs/load-hi-adequacy-reading-2026-09-06.md;
  # the one scoring table SCN-WS4c runs against: FINDING-scn-ws4b-2026-09-06.md.
  # Written BEFORE any LOAD-HI number exists; it is not revised to fit one.
  #
  # `electrification_path` is AS-IS = inherited from REF, and REF is the
  # ScenarioConfig default `off` in ALL SIX ISOs (no iso_configs override arms
  # it; NEISO's sourced heat_pump layer is off in REF too). Neither case
  # overrides it: flipping NEISO to `mid` is a REF-posture question for the
  # desk, never a case override (plan §3.0 — REF is the shipped posture).
  #
  # THE ERCOT TAIL-REGIME ARITHMETIC (data/datacenter.py add_datacenter_block).
  # The block is RELOCATED (energy-invariant, flat) while dc_E < E and ADDED
  # on top once dc_E >= E. With the constants at this commit (DC high 122 GW
  # by 2030, x0.85 LF, linear from 0 at 2024; growth high 11.5 %/yr from the
  # 2024 weather base E0 ~= 464 TWh / P0 ~= 85 GW, both inverted from the
  # committed REF trajectory results/ff-t1f-d50/ercot):
  #   year   block GW   dc_E/E   E TWh   peak GW   regime
  #   2026     34.6     0.525     577      84.7    relocate  (REF 546 / 93.7)
  #   2027     51.9     0.706     643      86.5    relocate  (REF 593 / 99.0)
  #   2028     69.1     0.844     717      89.6    relocate  (REF 643 / 105.1)
  #   2029     86.4     0.947     800      94.2    relocate  (REF 698 / 111.9)
  #   2030    103.7     1.019    1800     266.9    TAIL      (REF 757 / 119.6)
  # Two consequences, both construction, neither adequacy: (1) in 2026-2029
  # the flat block is 52-95 % of energy, so ERCOT's PEAK FALLS BELOW REF while
  # energy rises 6-15 % — every peak-based adequacy reading (I12, reserve
  # margin) will READ BETTER than REF, an artefact of the relocate rule, and
  # is not to be quoted as adequacy; (2) 2030 flips to the tail regime and
  # energy jumps 800 -> 1,800 TWh, peak 94 -> 267 GW, in ONE year. One-pass
  # evolution with a 12 GW/yr queue cap cannot meet it: 2030 is an
  # unserved-energy year by construction and its CO2 delta is not an
  # emissions response. LOAD-HI-ORGANIC stays in the relocate regime through
  # 2030 (dc_E/E 0.16-0.31; peak 99 -> 144 GW) — it is the SMOOTH high case.
  # NYISO also flattens (block 35 % of energy by 2030; LOAD-HI peak 29.0 GW vs
  # ORGANIC 32.4 GW), MISO partly (24 %); the other three do not.
  #
  # THE DC-AXIS COMPANION IS DEGENERATE IN THREE ISOs THROUGH 2030: PJM's high
  # DC curve equals mid until 2030 (30 GW anchors; diverges only to 2040),
  # CAISO ships high := mid (documented limitation, WS-4a G-D4-2), NEISO's
  # block is {} (0 MW). There LOAD-HI == LOAD-HI-ORGANIC byte-for-byte in the
  # T1 window, so the ORGANIC arm is NOT spent on them (a zero-LP fact from
  # the constants); the DC share of the delta is readable only in ERCOT, MISO
  # and NYISO, and in ERCOT/NYISO it is dominated by the block's SHAPE effect.
  #
  # ADEQUACY READING PER ISO (mechanism | live FC-1 fails at mid, bare
  # ff-verdicts keys at pin | the line the delta table MUST carry):
  #   ERCOT  energy-only, backstop OFF by design; scarcity-priced economic
  #          entry or NOTHING (residual -> VOLL slack) | I12+I3 2027-2030
  #          (one phenomenon, D4-I3) | unserved_mwh beside emissions_mt;
  #          backstop_built = 0.0 by design; import line = 0.0 (no node).
  #   CAISO  backstop gas_ct (52.6 % share, FAIL) + ladder | I12+I7 2026-28
  #          (gate_reading prose adds I3) | backstop_built_mw/mwh + unserved;
  #          import line (WECC) expected UP, same sign as CO2.
  #   PJM    cap-bound backstop ladder is the ONLY responding channel (43.9 %)
  #          | I12+I7 2027-30 | backstop_built + unserved (I3 expected to
  #          APPEAR 2029-30); import line (PJM_external) expected UP, small.
  #   MISO   backstop (23.0 % CAVEAT) + ladder | I12+I7 2026-29 (prose says
  #          I3: stale) | backstop_built + unserved; import line 0.0 at REF.
  #   NYISO  backstop armed, never fired | none | backstop_built (expect 0.0)
  #          + unserved beside CO2; import line expected UP; the flattened
  #          peak may push I12 out on the HIGH side — an artefact, not RA.
  #   NEISO  backstop (1.2 %) + reliability floor | none | backstop_built +
  #          unserved + the import line PER TRANCHE: the HQ seam is within
  #          ~1-5 TWh of its 3,850 MW SIL at REF, so the import CO2 line rises
  #          early (<= ~2 Mt at 0.428) then saturates.
  # In EVERY ISO a CO2 number read under binding slack is understated by the
  # shed energy: read emissions_mt with unserved_mwh beside it, and with the
  # import line beside it, and never as a total. The I7/I12/I3 FAILs already
  # on the board at `mid` are DISCLOSED here per case, not fixed and not
  # proposed for fixing — they are the capx director's queue.
  LOAD-HI:
    demand_growth_path: high
    datacenter_load_path: high
  LOAD-HI-ORGANIC:
    demand_growth_path: high
    datacenter_load_path: mid

  # ── Does a carbon price hold CO2 flat under data-centre growth? ───────────
  CARB-MID+LOAD-HI:
    carbon_price_delta: 25.0
    demand_growth_path: high
    datacenter_load_path: high

  # ── Attribute double-claim test (owner card D-6: counts toward, report both) ──
  # BLOCKED on `voluntary_clean_demand_path`; same gate as VOL-* above.
  #   CES-P20+VOL-HI:
  #     federal_ces_enabled: true
  #     federal_ces_premium_usd_per_mwh: 20.0
  #     voluntary_clean_demand_path: high

  # ── The coherent policy corner under high load ────────────────────────────
  # BLOCKED on both missing fields (CES target + voluntary). Lands after
  # SCN-WS2a and SCN-WS3b.
  #   ALL-CLEAN:
  #     carbon_price_delta: 25.0
  #     federal_ces_enabled: true
  #     federal_ces_target_by_year: {2026: <current>, 2035: 0.80, 2050: 1.00}
  #     voluntary_clean_demand_path: high
  #     demand_growth_path: high
  #     datacenter_load_path: high

# The two corners of configs/scenario_matrix.yaml (CORNER-HI-EMIT /
# CORNER-LO-EMIT) remain the envelope reference and are NOT re-solved here
# (plan §3.5).
