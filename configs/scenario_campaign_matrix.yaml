# Scenario campaign case set (SCN-WS0 deliverable 4).
#
# The plan's §3.5 case set, in `cases:` mode, every LIVE case one or two field
# overrides on the REF base
# (configs/scenarios/<iso>_scenario_base_2026_{2030,2050}.yaml). Charter:
# docs/handoffs/forecast-scenario-readiness-plan-2026-09.md §3.0 (what REF is),
# §3.5 (this table), §4 (the caveats a campaign carries).
#
# ── READ THIS BEFORE USING THE LEVELS ──────────────────────────────────────
# THE LEVELS BELOW ARE COMMITTED, NOT ILLUSTRATIVE. Owner card D-2 was RULED
# 2026-09-06 as **S3: the plan's §3.5 table is the COMMITTED default**
# (SCN-DESK r#5 amendment 1; ledger §2, plan §6). Recorded verbatim: carbon
# RFF low/mid/high; CES premium {10, 20, 30}; CES target
# {2026: current, 2035: 0.80, 2050: 1.00} with ACP $50; LOAD-HI = growth high
# + DC high. Scenario levels are the owner's what-ifs by definition and are
# never a modeller's choice (rule 1 [R-STRUCT]) — S3 is what makes these the
# owner's. **NO NUMBER MOVED WHEN THE RULING LANDED**: every level here is the
# value the building lane already carried under an "illustrative" label, so
# the ruling changed the label and not the number, and NO RE-SOLVE IS OWED
# (SCN-LEVELS 2026-09-06, docs/handoffs/FINDING-scn-levels-2026-09-06.md).
# **S3 IS NO LONGER THE ONLY RULING.** Four more landed the same day and
# finished the job: **S9** (D-2(b)) committed the two voluntary sub-levels,
# **S10** (D-3c) ratified the eligible set as built, **S11** (D-6) ruled
# counts-toward, and **S12** (D-2(c)) committed the state-cap slope. NOT ONE
# OF THEM MOVED A NUMBER EITHER. Every level in this file is committed, and
# NOTHING BELOW IS ILLUSTRATIVE.
#
# ── WHERE A LEVEL WAS NOT COMMITTED — ALL THREE ARE NOW CLOSED ─────────────
# S3 commits the §3.5 TABLE, and the table was silent in three places. ALL
# THREE ARE NOW RULED, so no level in this file is open. Each is named at
# its case, with the ruling that closed it:
#   1. `CAP-STATE-TIGHT`'s declining budget — §3.5 writes "declining
#      mass_cap_tons" with no number, and S3's enumeration names none, so the
#      slope stayed the OWNER level SCN-WS1a labelled it
#      (FINDING-scn-ws1a-2026-09-05.md §4.2). **CLOSED 2026-09-06 — S12 on
#      card D-2(c): "Commit the 80 % slope and build the field."** The case
#      is LIVE below at WS-1a §4.2's schedule, verbatim (SCN-CAP).
#   2. **CLOSED 2026-09-06 — S9 on card D-2(b).** The voluntary sub-levels:
#      S3 commits "the memo's box-5 defaults", and box 5 itself left
#      `f_commit` mid and the WTP-ceiling LEVEL owner-set
#      (voluntary-clean-demand-design-memo-2026-09-05.md box 5). S9 took both
#      placeholders AS the committed levels — `f_commit` mid **0.5**, WTP
#      ceiling **$4.5/MWh** — so the LABEL moved and the NUMBER did not, and
#      no re-solve is owed. See the voluntary block.
#   3. **CLOSED 2026-09-06 (SCN-FIX2).** The carbon ladder's FORM: the
#      committed level was always the RFF path ladder, and the live form was a
#      reduced additive stand-in the ruling did not bless. SCN-WS1c landed
#      S2's floor, so the committed form is now the live one. See the carbon
#      block.
# The two OTHER cards are ALSO RULED, both 2026-09-06 and both labelled where
# they bite: **D-3c → S10** — the renewable-only eligible set STANDS AS BUILT
# — and **D-6 → S11** — a voluntary MWh COUNTS TOWARD the federal standard,
# with every combined leg reporting both nettings. Neither moved a number.
#
# ── WHAT IS COMMENTED OUT, AND WHY ─────────────────────────────────────────
# A case whose override field does not exist in ScenarioConfig at this commit
# is listed COMMENTED, never as a live key: a live key naming a missing field
# would fail at load, and a silently-dropped one would be worse. Each carries
# the lane that lands its field. Uncomment when that lane merges — the case
# name and its question are already fixed here so the campaign's shape does
# not drift while the fields arrive.
#
# STILL COMMENTED AT THIS COMMIT, and on what: NOTHING — `CAP-STATE-TIGHT`,
# the last commented case, went LIVE at SCN-CAP (2026-09-06) when ruling S12
# committed its slope and built its schedule field (see its block). **`VOL-MID`
# / `VOL-HI` / `CES-P20+VOL-HI` / `ALL-CLEAN` ARE LIVE since SCN-WS3b
# (2026-09-06)** — the one field they waited on, `voluntary_clean_demand_path`,
# landed with its resolver, its row on the clean-tier family and its
# forecast-only coercion (docs/handoffs/FINDING-scn-ws3b-2026-09-06.md). **THE
# S5 HOLD ON ALL FOUR IS RELEASED.** S5 held them until the capx CCS
# emission-rate seam was repaired; capx D77 landed that repair, the campaign
# itself falsified S5's premise (the retrofit screen is armed by the STATE
# carbon program, not by the CES — SCN-DESK r#10), and ruling **S9** then
# added the four to the six Stage A-POLICY lanes by ADDENDUM (phase-0 regime
# test per year; a slack row is killed, never solved; gates G7-G10). They are
# LIVE AND RELEASED; `CAP-STATE-TIGHT` alone stayed out of that addendum.
# SCN-WS3c's ERCOT probe is still issued separately.
# **`CES-T80` IS NO LONGER
# COMMENTED** — SCN-WS2a landed its two fields and S3 committed its level, so
# SCN-LEVELS made it live 2026-09-06. That is a case going live because its
# blockers cleared, not a level moving: the numbers are the ones SCN-WS2a
# already probed.
#
# ── THE CARBON LADDER IS THE COMMITTED RFF PATH FORM (switched 2026-09-06) ──
# S3 commits the RFF path ladder (`carbon_price_path: low/mid/high`), which is
# what plan §3.5 writes, and it is now the LIVE form below. The blocker was
# CODE, never the card, and the code landed: **SCN-WS1c executed owner ruling
# S2 (D-1) — the federal path is a FLOOR**, `effective = max(RFF path(year),
# program trajectory(year))` (FINDING-scn-ws1c-2026-09-06.md; 450/450 predicted
# cells to the cent, 0 cache keys moved).
# G-C1 (plan §8) is therefore DEAD AT THE RESOLVER. It was the whole reason for
# the interim: before the floor an explicit path SUPPRESSED the projected
# state-program price, so on CAISO/NYISO/NEISO a `carbon_price_path` case was a
# carbon price CUT of $16-$102/t in every one of 25 years
# (FINDING-scn-ws1a-2026-09-05.md §0.1/§6). Under the floor no path can lower
# any ISO's carbon signal, so the ladder's sign is right in every ISO with or
# without a program — which is what the reduced additive `carbon_price_delta`
# stand-in was bought for. That stand-in is GONE from this file (rule 26
# [R-DELETE]: a commented-out live form is a re-armable answer); the FIELD
# `carbon_price_delta` is untouched and still available for a labelled
# sensitivity, but no campaign case uses it.
mode: cases

cases:
  # ── The reference. Every delta in the campaign is measured against this. ──
  # Deliberately empty: REF IS the ISO's shipped forecast posture at the
  # campaign's frozen HEAD (plan §3.0), so it overrides nothing at all.
  REF: {}

  # ── Carbon price → dispatch re-ordering, CCS, thermal mix, VRE entry ──────
  # THE COMMITTED FORM (owner card D-2 → **S3**, 2026-09-06): the plan §3.5 RFF
  # path ladder, resolved from `constants.CARBON_PRICE_PATHS` and applied as a
  # FLOOR under any state program (ruling S2, landed by SCN-WS1c). Switched
  # from the interim `carbon_price_delta` knots {15, 25, 50} on 2026-09-06 by
  # SCN-FIX2 — a FORM change, not a level change: S3 never committed the deltas
  # (they were the desk's reduced-form stand-in) and the path ladder is the
  # level it did commit.
  #
  # WHAT EACH ARM RESOLVES TO, measured through the live chain
  # (`resolve_policy_bundle` → `apply_iso_scenario_defaults` →
  # `resolve_carbon_price`), $/tCO2, 2026-2030 — the T1-F window the policy
  # lanes solve (full table incl. 2050: FINDING-scn-fix2-2026-09-06.md §1):
  #   ERCOT / PJM / MISO (no state program — the path applies alone)
  #     low   0 / 2.00 / 4.00 / 6.00 / 8.00      (knots 0, 8@2030, 18@2040, 25@2050)
  #     mid   0 / 3.75 / 7.50 / 11.25 / 15.00    (knots 0, 15, 35, 50)
  #     high  0 / 7.50 / 15.00 / 22.50 / 30.00   (knots 0, 30, 70, 110)
  #   CAISO / NYISO / NEISO — **EXACTLY EQUAL TO REF in the whole T1-F window,
  #     every arm**: the program trajectory is above every path there, so the
  #     floor binds on the program side, the case is byte-identical to REF in
  #     dispatch and the policy lanes KILL it at phase 0, never solving it
  #     (SCN-WS1b measured the inertness; SCN-WS1c §2 is the same resolver).
  # The 2026 knot is $0 in EVERY path, so no arm separates from REF on a
  # non-program ISO in 2026 either — the axis is live from 2027.
  #
  # **THE INERTNESS IS A T1-F FACT, NOT A HORIZON FACT — measured 2026-09-06,
  # and it is NOT what WS-1b's headline says.** Over the 2026-2050 base the
  # `high` path CROSSES ABOVE two program trajectories in mid-horizon years:
  # NYISO 2031-2047 (peak +$9.05/t at 2040) and NEISO 2033-2042 (peak +$3.32/t
  # at 2038); CAISO stays inert in all 25 years, and `low` / `mid` stay inert
  # in all 25 years on all three. So a full-horizon CARB-HI is a LIVE arm on
  # NYISO and NEISO and must not be killed by an inertness argument taken from
  # the T1-F window. Every crossing delta is POSITIVE — under S2's floor no
  # path can cut any ISO's carbon signal in any year, which is the property the
  # interim delta form existed to guarantee.
  CARB-LO:
    carbon_price_path: low
  CARB-MID:
    carbon_price_path: mid
  CARB-HI:
    carbon_price_path: high

  # ── Price vs quantity: the mass-cap instrument on the program ISOs ────────
  # LIVE as of SCN-CAP (2026-09-06), under owner ruling **S12 on card D-2(c)**
  # (SCN-DESK r#12 am.1, verbatim: "Commit the 80 % slope and build the
  # field"). Both blockers cleared in that one ruling:
  #   (a) THE FIELD. `mass_cap_tons_by_year` ({ISO: {year: metric tonnes}})
  #       is read FIRST by `policy/cap_and_trade.py::_power_sector_cap`, ahead
  #       of the scalar `mass_cap_tons` and the published RGGI/CARB budget;
  #       linear between knots, edge-held outside them (the last knot holds
  #       flat after 2050); coerced to None in backcast/hindcast; cache-
  #       optional at None (docs/handoffs/FINDING-scn-cap-2026-09-06.md §1).
  #   (b) THE LEVEL. The schedule below IS SCN-WS1a §4.2's pre-declared
  #       case, verbatim, committed by S12: the anchor is the 2025 published
  #       per-state budget (NY 23.16 Mt; CT+ME+MA+NH+RI+VT 20.67 Mt), then a
  #       LINEAR decline to 20 % of that anchor by 2050. The level is the
  #       owner's what-if (rule 1 [R-STRUCT]); no number here is a modeller's.
  #   (c) READ-OUT. `DispatchResult.co2_cap_price` (the row dual, $/t) is the
  #       endogenous power-sector allowance price the policy lanes report
  #       beside the adder path's exogenous price in the same year — the
  #       price-vs-quantity comparison the case exists for (WS-1a §4.2).
  # THE CAISO ANCHOR IS DISCLOSED, NOT PUBLISHED: CARB publishes no
  # power-sector budget (its 267 Mt whole-economy cap is meaningless as a
  # power-sector row, WS-1a §4.1), so CAISO's 2026 knot is the model's own
  # REF-2026 CO2 (30.5 Mt, the committed T1-F REF at WS-1a's pin), declining
  # on the same 80 % slope. It is the one non-published anchor in the case.
  # `state_carbon_pricing: true` keeps the program resolver ON so the ROW
  # REPLACES the adder (one instrument at a time, never both — resolver
  # invariant); `carbon_price_path: zero` means no federal price in the cap
  # case (under S2's floor a zero path resolves to the program alone, and on
  # the row path the program IS the row). Both are the shipped defaults,
  # written out because the case's meaning depends on them.
  # SCOPE: CAISO / NYISO / NEISO only — the ISOs the schedule names. ERCOT and
  # MISO carry no program (`CAP_AND_TRADE_PROGRAMS`), so the case resolves to
  # NOTHING there and is byte-identical to REF in the LP. PJM is NOT
  # byte-identical: it carries a partial RGGI program, so an ISO absent from
  # the schedule falls through to the published REGIONAL RGGI budget in
  # 2027-2030 — a slack row, not REF (routed to SCN-DESK, FINDING-scn-cap §5).
  # The ERCOT / PJM / MISO policy lanes do not solve this case (r#12 am.1).
  # The S5 hold on A-POLICY is RELEASED (header), but this case alone stayed
  # OUT of the S9 addendum; it is solved by the three
  # program-ISO policy lanes under their own PRECOMMIT (precondition P5),
  # killed at phase 0 where the budget is slack in every year (FINDING-scn-cap
  # §3 tabulates the resolved budget against each ISO's REF CO2).
  CAP-STATE-TIGHT:
    mass_cap_enabled: true
    mass_cap_program: co2
    state_carbon_pricing: true      # the row REPLACES the adder
    carbon_price_path: zero         # no federal price in the cap case
    mass_cap_tons_by_year:          # metric tonnes CO2; linear between knots
      NYISO: {2026: 23.16e+6, 2030: 20.2e+6, 2040: 12.8e+6, 2050: 4.6e+6}
      NEISO: {2026: 20.67e+6, 2030: 18.0e+6, 2040: 11.4e+6, 2050: 4.1e+6}
      CAISO: {2026: 30.5e+6, 2030: 26.5e+6, 2040: 16.5e+6, 2050: 6.1e+6}

  # ── National CES, uniform-PRICE (tradeable) form: the response curve ──────
  # Premium in real 2026$/MWh. COMMITTED: the {10, 20, 30} ladder is named
  # explicitly in S3 (2026-09-06), and it already stood from owner decision D8
  # (national-ces-eac-premium plan) — S3 re-affirms D8 rather than moving it,
  # so these three numbers are unchanged by the ruling.
  CES-P10:
    federal_ces_enabled: true
    federal_ces_premium_usd_per_mwh: 10.0
  CES-P20:
    federal_ces_enabled: true
    federal_ces_premium_usd_per_mwh: 20.0
  CES-P30:
    federal_ces_enabled: true
    federal_ces_premium_usd_per_mwh: 30.0

  # ── National CES, uniform-SHARE (no-trade) form: dual = implied EAC price ──
  # LIVE as of SCN-LEVELS (2026-09-06). Both blockers cleared, in this order:
  # SCN-WS2a landed the two fields (`federal_ces_target_by_year` sparse {year:
  # credited share} knots + `federal_ces_acp_usd_per_mwh`, the escape price;
  # plan §3 WS-2 items 1-2), and S3 committed the level.
  #
  # THE LEVEL, AND WHY IT IS THE SAME NUMBER IT ALWAYS WAS. S3 commits the
  # §3.5 row `{2026: <current>, 2035: 0.80, 2050: 1.00}` with ACP $50. The
  # `<current>` token is resolved by the plan itself, not by this lane: plan
  # §3 WS-2 item 5 writes the same schedule as `{2026: 0.55, 2035: 0.80,
  # 2050: 1.0}`, and SCN-WS2a's PRECOMMIT and probe used exactly that at ACP
  # 50.0 under an "illustrative" label. S3's own text is the identification —
  # "SCN-WS2a built and probed against exactly this and labelled it
  # illustrative, so the change is to the label, not the number" — so 0.55 is
  # the committed 2026 knot and NO RE-SOLVE IS OWED. Stated plainly for
  # anyone quoting it: 0.55 is the plan's declared stand-in for the current
  # national clean share, NOT an independently sourced measurement, and it is
  # a what-if level (rule 1 [R-STRUCT]) exactly like every other level here.
  # The registered NEISO 2026 T0 pair
  # `neiso-2026-2026-scn-ws2a-neiso-2026-t0-{ref,target}` is therefore now
  # quotable as a CAMPAIGN-LEVEL result, not only as a machinery
  # demonstration — in its measured escape regime (dual = ACP $50 exactly;
  # credited share 0.345 < 0.55; FINDING-scn-ws2a-2026-09-05.md §4).
  CES-T80:
    federal_ces_enabled: true
    federal_ces_target_by_year: {2026: 0.55, 2035: 0.80, 2050: 1.00}
    federal_ces_acp_usd_per_mwh: 50.0

  # ── Voluntary clean demand → curtailment, entry, CO2 ──────────────────────
  # LIVE as of SCN-WS3b (2026-09-06), and the S5 hold is RELEASED: the capx
  # CCS emission-rate seam was repaired (capx D77) and ruling S9 added these
  # cases to the Stage A-POLICY lanes by addendum — see the header.
  # **Owner card D-3 is RULED YES — S1 (2026-09-06)**: a voluntary clean-demand
  # scenario axis is admissible as a declared, forecast-only, publicly-anchored,
  # default-off axis (ffr-5b §1.4 is held to be about a *fitted driver*, a
  # different admissibility class). **D-3b rode it: in-LP hourly (24/7)
  # matching stays DEFERRED** to the isolated `scope2-lce-portfolio` tool, so
  # the field builds the annual volumetric row only.
  #
  # WHAT THE FIELD DOES (policy/voluntary_demand.py; memo §2.1/§3.1): ONE annual
  # volumetric clean-attribute row per ISO-year on the clean-tier family with an
  # ALL-ZONE mask, RHS V = s_base·w_ISO·E_nonDC + f_commit·E_DC read from the
  # run's own demand after the load layers (the DC half rides the shipped
  # `datacenter_load_path: mid` block, so VOL-* moves the attribute demand only
  # and the pairing with REF is clean), and an escape priced at the buyer's
  # WTP ceiling. Its dual is the voluntary attribute price and reaches the
  # screens through the existing max() seam. `off` (REF) builds no row.
  #
  # EVERY SUB-LEVEL IS COMMITTED (header note 2). S3 commits "the
  # WS-3a memo box-5 defaults", built into constants.VOLUNTARY_*: `s_base` mid
  # = the latest NREL national share (2023: 0.08) held flat, low/high = the
  # series' own range (0.06 / 0.08 — the ceiling IS the latest value, so `high`
  # coincides with `mid` on this cell); `f_commit` low 0 / high 1.0; WTP low 2
  # / high 7 $/MWh, the endpoints of the cited public REC range. THE TWO CELLS
  # S3 DID NOT REACH ARE COMMITTED BY **OWNER RULING S9** (2026-09-06, card
  # D-2(b), "the WS-3b placeholders ARE the committed levels") — `f_commit`
  # MID **0.5** and the WTP-ceiling MID level **$4.5/MWh**. THE LABEL MOVED,
  # THE NUMBER DID NOT: both are the values SCN-WS3b already built and probed
  # under an "illustrative" label, so NO RE-SOLVE IS OWED — the same
  # identification S3 made for the CES knot above. constants.py carries the
  # same stamp at VOLUNTARY_COMMITTED_DC_FRACTION and
  # VOLUNTARY_WTP_CEILING_USD_PER_MWH; both cells are re-presented in
  # FINDING-scn-ws3b-2026-09-06.md §4. Stated plainly for anyone quoting them:
  # they are what-if LEVELS (rule 1 [R-STRUCT]) exactly like every other level
  # here, NOT independently sourced measurements. **D-3c IS RULED — S10**: the
  # eligible set STANDS AS BUILT, so both cases run wind, solar, offshore wind
  # and geothermal (never nuclear/CCS) as the COMMITTED set — it is no longer
  # the memo §4.1 recommendation awaiting a decision.
  VOL-MID:
    voluntary_clean_demand_path: mid
  VOL-HI:
    voluntary_clean_demand_path: high

  # ── Load growth → adequacy, backstop, CO2 per MWh ─────────────────────────
  # Both axes are live fields. G-L3 (plan §8) is the reason there are TWO high
  # cases and not one: organic growth and the data-centre block are independent
  # axes, so "the high case" has to declare its pairing rather than assume it.
  # LOAD-HI pairs both high; LOAD-HI-ORGANIC holds the DC block at its shipped
  # "mid" so the organic half is separable. SCN-WS4b pre-declares how each
  # ISO's high case is READ for adequacy (desk ledger §1).
  #
  # ── SCN-WS4b DECLARATION (2026-09-06, plan §3 WS-4 items 1 + 3) ─────────
  # Full adjudication: docs/handoffs/load-hi-adequacy-reading-2026-09-06.md;
  # the one scoring table SCN-WS4c runs against: FINDING-scn-ws4b-2026-09-06.md.
  # Written BEFORE any LOAD-HI number exists; it is not revised to fit one.
  #
  # `electrification_path` is AS-IS = inherited from REF, and REF is the
  # ScenarioConfig default `off` in ALL SIX ISOs (no iso_configs override arms
  # it; NEISO's sourced heat_pump layer is off in REF too). Neither case
  # overrides it: flipping NEISO to `mid` is a REF-posture question for the
  # desk, never a case override (plan §3.0 — REF is the shipped posture).
  #
  # THE ERCOT DC-BLOCK REGIME (data/datacenter.py add_datacenter_block). The
  # block is RELOCATED (energy-invariant, flat) while dc_E < E and ADDED on top
  # once dc_E >= E. **RE-DERIVED FROM THE CONSTANTS AT HEAD, 2026-09-07
  # (SCN-FIX3), AND THE ANSWER REVERSES WHAT THIS BLOCK USED TO SAY.** The old
  # table stood on `DATACENTER_ADDITIONS_MW["ERCOT"]["high"]` = 122 GW at 2030,
  # a raw interconnection-queue estimate that constants.py:3153 RETIRED and
  # replaced with ERCOT's own published TSP-Provided upper forecast, 88,603 MW
  # (constants.py:3160); the paired `DEMAND_GROWTH_RATES["ERCOT"]["high"]` near
  # rate is 20.6157 %/yr, not the 11.5 %/yr the old table used. A smaller block
  # over a larger denominator puts the tail regime out of reach. The TAIL row is
  # DELETED, not annotated (rule 26 [R-DELETE]).
  #
  # Inputs, all read from constants.py at HEAD: DC high {2025: 9,281 -> 2030:
  # 88,603 MW} piecewise-linear, x0.85 LF; growth high near 20.6157 %/yr
  # compounded from the 2024 weather base E0 ~= 464 TWh / P0 ~= 84.9 GW
  # (provenance as this block first recorded it — inverted from the committed
  # REF trajectory results/ff-t1f-d50/ercot — and the one input neither of the
  # two moved constants touches):
  #   year  block GW  dc_E TWh  E TWh  dc_E/E  regime    LOAD-HI peak GW
  #   2026    21.4      187.2     675   0.277  relocate  110.6 (measured 110.63)
  #   2027    34.9      305.4     814   0.375  relocate  128.0 (measured 127.90)
  #   2028    48.3      423.5     982   0.431  relocate  150.5 (measured 150.43)
  #   2029    61.8      541.6    1185   0.457  relocate  179.5 (measured 179.30)
  #   2030    75.3      659.7    1429   0.462  relocate  216.0 (measured 215.81)
  # dc_E/E PEAKS AT 0.462; the tail needs 1.000. The derivation reproduces all
  # three solved arms (REF, LOAD-HI, LOAD-HI-ORGANIC) to <= 0.09 %, which is
  # what licenses it as arithmetic rather than a story.
  #
  # MEASURED — prediction P-1 is a HIT: ERCOT stays in RELOCATE in all five
  # years of BOTH arms, the 1,800 TWh / 267 GW one-year discontinuity DOES NOT
  # REPRODUCE, the arms' energy deltas are identical (2030: 22.978 vs 22.984
  # TWh, where a tail step would add ~660 TWh), and dc_E/E never approaches 1.0.
  # 2030 is therefore NOT "an unserved-energy year by construction": ERCOT does
  # shed 538.9 TWh there, but because HEAD REF is already in deep shortage (REF
  # alone sheds 127.2 TWh), not because of a tail step — right number, wrong
  # cause, scored SPLIT. FINDING-scn-ws5a-load-ercot-2026-09-06.md §0, §3, §5.
  #
  # (1) THE CONSEQUENCE THAT SURVIVES, COMPARATOR CORRECTED — STILL LOAD-BEARING.
  # The relocate rule is flat and energy-invariant, so it does depress a high-DC
  # arm's peak against THE SAME GROWTH PATH CARRYING A SMALLER BLOCK, the only
  # comparison that holds growth fixed:
  #   LOAD-HI minus ORGANIC peak, GW:  -7.5  -12.1  -16.7  -21.3  -25.8
  # What does NOT hold is "vs REF": LOAD-HI's peak is measured ABOVE REF in every
  # year (110.6 vs 104.1 ... 215.8 vs 161.8 GW) and I12 is uniformly WORSE,
  # because REF rides the MID growth path and that gap (+6.6 -> +54.3 GW) swamps
  # the flattening. WS-4b's "peak 9-18 GW below REF, so I12 improves or passes"
  # is a clean MISS (ERCOT finding §3(b)) — as is the same claim for NYISO, whose
  # block reaches 11 % of energy, not the 35 % assumed (NYISO finding §3(b)).
  # THE WARNING ITSELF IS UNCHANGED AND STILL BINDS: a peak-based adequacy
  # reading (I12, reserve margin) of a high-DC arm understates that arm's stress
  # relative to its ORGANIC twin, as an artefact of the relocate rule, and is not
  # to be quoted as adequacy. MISO is the cleanest confirmation of this framing —
  # LOAD-HI peak 3.91 GW below ORGANIC at 2030 on identical energy, scored HIT
  # (MISO finding §3(c)). LOAD-HI-ORGANIC remains the SMOOTH high case.
  #
  # THE DC-AXIS COMPANION IS DEGENERATE IN THREE ISOs THROUGH 2030: PJM's high
  # DC curve equals mid until 2030 (30 GW anchors; diverges only to 2040),
  # CAISO ships high := mid (documented limitation, WS-4a G-D4-2), NEISO's
  # block is {} (0 MW). There LOAD-HI == LOAD-HI-ORGANIC byte-for-byte in the
  # T1 window, so the ORGANIC arm is NOT spent on them (a zero-LP fact from
  # the constants); the DC share of the delta is readable only in ERCOT, MISO
  # and NYISO, and in ERCOT/NYISO it is dominated by the block's SHAPE effect.
  #
  # ADEQUACY READING PER ISO (mechanism | live FC-1 fails at mid, bare
  # ff-verdicts keys at pin | the line the delta table MUST carry):
  #   ERCOT  energy-only, backstop OFF by design; scarcity-priced economic
  #          entry or NOTHING (residual -> VOLL slack) | I12+I3 2027-2030
  #          (one phenomenon, D4-I3) | unserved_mwh beside emissions_mt;
  #          backstop_built = 0.0 by design; import line = 0.0 (no node).
  #   CAISO  backstop gas_ct (52.6 % share, FAIL) + ladder | I12+I7 2026-28
  #          (gate_reading prose adds I3) | backstop_built_mw/mwh + unserved;
  #          import line (WECC) expected UP, same sign as CO2.
  #   PJM    cap-bound backstop ladder is the ONLY responding channel (43.9 %)
  #          | I12+I7 2027-30 | backstop_built + unserved (I3 expected to
  #          APPEAR 2029-30); import line (PJM_external) expected UP, small.
  #   MISO   backstop (23.0 % CAVEAT) + ladder | I12+I7 2026-29 (prose says
  #          I3: stale) | backstop_built + unserved; import line 0.0 at REF.
  #   NYISO  backstop armed, never fired | none | backstop_built (expect 0.0)
  #          + unserved beside CO2; import line expected UP; the flattened
  #          peak may push I12 out on the HIGH side — an artefact, not RA.
  #   NEISO  backstop (1.2 %) + reliability floor | none | backstop_built +
  #          unserved + the import line PER TRANCHE: the HQ seam is within
  #          ~1-5 TWh of its 3,850 MW SIL at REF, so the import CO2 line rises
  #          early (<= ~2 Mt at 0.428) then saturates.
  # In EVERY ISO a CO2 number read under binding slack is understated by the
  # shed energy: read emissions_mt with unserved_mwh beside it, and with the
  # import line beside it, and never as a total. The I7/I12/I3 FAILs already
  # on the board at `mid` are DISCLOSED here per case, not fixed and not
  # proposed for fixing — they are the capx director's queue.
  LOAD-HI:
    demand_growth_path: high
    datacenter_load_path: high
  LOAD-HI-ORGANIC:
    demand_growth_path: high
    datacenter_load_path: mid

  # ── Does a carbon price hold CO2 flat under data-centre growth? ───────────
  # Its load half is committed (S3: growth high + DC high, the LOAD-HI pairing
  # above). Its carbon half is CARB-MID's, and it inherits that arm's committed
  # RFF path form and every reading above it — including the program-ISO
  # inertness: on CAISO/NYISO/NEISO this case's carbon half is exactly REF, so
  # the case is LOAD-HI with a carbon label and the delta it measures is the
  # load delta alone. Read it as the carbon×load interaction only on
  # ERCOT/PJM/MISO.
  CARB-MID+LOAD-HI:
    carbon_price_path: mid
    demand_growth_path: high
    datacenter_load_path: high

  # ── Attribute double-claim test (owner card D-6) ──────────────────────────
  # LIVE as of SCN-WS3b (2026-09-06); the S5 hold is RELEASED (header).
  # **D-6 IS RULED — S11** (2026-09-06): a voluntary MWh COUNTS TOWARD the
  # federal standard, and every combined leg REPORTS BOTH NETTINGS. That
  # ratifies what was already built — the "counts toward" recommendation the
  # WS-3a memo §4.3 briefed, over the Addendum A.2 dissent — so no code and no
  # number moved; only the status did. NO
  # NETTING LOGIC IS BUILT: under the CES *premium* (this case) there is no
  # federal row to net against — the premium is a price, and the screens'
  # max() already answers the price question (memo §4.3) — so this case is
  # the price composition of two attribute buyers, one certificate sold to the
  # higher; the dispatch-RHS netting question has content only against the
  # CES *target* row (ALL-CLEAN below), where both nettings are reported at the
  # REPORT layer (FINDING-scn-ws3b-2026-09-06.md §5 names the hook). Under S11
  # counts-toward IS the answer, and both nettings are still reported beside
  # it — the reporting duty is part of the ruling, not a hedge against it.
  CES-P20+VOL-HI:
    federal_ces_enabled: true
    federal_ces_premium_usd_per_mwh: 20.0
    voluntary_clean_demand_path: high

  # ── The coherent policy corner under high load ────────────────────────────
  # LIVE as of SCN-WS3b (2026-09-06) — its last missing field landed; the S5
  # hold is RELEASED with every VOL-* case (header). EVERY
  # LEVEL BELOW IS COMMITTED, the carbon half included since 2026-09-06: it is
  # CARB-MID's committed RFF path form (SCN-FIX2 switched it from the interim
  # `carbon_price_delta: 25.0` in the same commit as the three CARB-* rows), so
  # on CAISO/NYISO/NEISO the carbon half of this corner is exactly REF and the
  # corner's carbon content is the CES + voluntary rows alone (see the carbon
  # block). `federal_ces_acp_usd_per_mwh:
  # 50.0` is written out because the target row REQUIRES it (> 0). The
  # voluntary half is VOL-HI's — every cell of it committed under S9 — and its
  # DC half rides the `datacenter_load_path: high` block here, so V rises with
  # the load case by construction (memo §3.4). This is the ONE case where owner
  # card D-6 has dispatch content — a federal TARGET row and the voluntary row
  # both count a clean MWh — and it is built as two INDEPENDENT rows
  # (counts-toward, the FFR-6B §6.4 doctrine, zero code). **S11 RULED D-6 FOR
  # EXACTLY THAT BUILD**: counts-toward is the answer, and the "additional"
  # reading is still reported beside it at the report layer.
  ALL-CLEAN:
    carbon_price_path: mid
    federal_ces_enabled: true
    federal_ces_target_by_year: {2026: 0.55, 2035: 0.80, 2050: 1.00}
    federal_ces_acp_usd_per_mwh: 50.0
    voluntary_clean_demand_path: high
    demand_growth_path: high
    datacenter_load_path: high

# The two corners of configs/scenario_matrix.yaml (CORNER-HI-EMIT /
# CORNER-LO-EMIT) remain the envelope reference and are NOT re-solved here
# (plan §3.5).
