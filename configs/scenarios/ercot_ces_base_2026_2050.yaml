# ERCOT national-CES BAU base, 2026-2050 (CES plan W1-B).
#
# The BAU leg of the national CES EAC-premium campaign
# (docs/handoffs/national-ces-eac-premium-plan-2026-07.md §8 W1-B, v2 horizon
# D8: 2026-2050). Identical to configs/scenarios/ercot_base.yaml — the
# ScenarioConfig defaults ARE the keeper-calibrated BAU — plus
# entry_screen_diagnostics, the default-off per-candidate entry-screen ledger
# (scenarios.py `entry_screen_diagnostics`; RC-0C/BLK-8). The ledger is pure
# observability (byte-identical fleet outcome) and is required for the later
# premium attribution: it records how much each CES case moves every
# candidate's entry margin per year (plan §6.4).
mode: forecast
iso: ERCOT
start_year: 2026
end_year: 2050
entry_screen_diagnostics: true
