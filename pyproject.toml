[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sim"
version = "0.0.0"
description = "Electricity market dispatch and policy simulator"
requires-python = ">=3.11"
dependencies = [
    "highspy>=1.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
market-sim = "market_sim.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
