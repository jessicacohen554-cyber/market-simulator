[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sim"
version = "0.0.0"
description = "Electricity market dispatch and policy simulator"
requires-python = ">=3.11"
dependencies = [
    "highspy>=1.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "requests>=2.31.0",
]

[project.scripts]
market-sim = "market_sim.runner:main"

[tool.pytest.ini_options]
# Scopes collection to the main suite. Without this, root `pytest` also walks
# scope2-lce-portfolio/tests, whose conftest imports the standalone
# `lce_portfolio` package (not a dependency of this project) and interrupts
# collection entirely (G-47).
testpaths = ["tests"]
# Registered so `--strict-markers` does not error and ad-hoc marks can't slip in.
# The clean-vs-raw parity tests (tests/test_consume_*.py) carry both: they
# regenerate a slice of data/clean from raw and compare the clean-backed loader
# against the raw loader, so they are slow and need real inputs present.
#
# The two documented lanes (see docs/testing.md):
#   fast:  pytest -n auto -m "not slow and not integration and not fulldata"
#   full:  pytest              (serial, everything, pre-push)
markers = [
    "slow: test is slow (regenerates clean data / runs the model / full-8760 LP)",
    "integration: exercises real data inputs, not a hermetic unit test",
    "fulldata: needs the real data/raw tree present (replaces ad-hoc raw-data skipifs)",
    "golden: byte-identity / band-regression golden guard (see docs/testing.md)",
    "solve_surface_live: opt OUT of the autouse solve-surface neutralization in tests/conftest.py -- for the few tests that are ABOUT the surface entering the cache key (capx D79) rather than about a ScenarioConfig field",
]
# --strict-markers ONLY: an unregistered @pytest.mark typo is an error, not a
# silently-ignored mark. Deliberately NOT a default `-m` deselection — the lane
# is chosen on the command line so a bare `pytest` always runs the full suite.
addopts = "--strict-markers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
# The frozen calibration record (CLAUDE.md / refactor-consolidation-plan §1:
# scripts/probes/ + scripts/archive/ are the per-run probe/retired-driver
# history, exempt from all boilerplate retrofits). Linting them would force
# edits ruff's own policy forbids, so they are out of the lint/format scope.
# `results/` is the on-disk run-BUNDLE tree (parquet, ledgers, run_config.json),
# not source. Sessions occasionally commit a per-run scratch driver inside a
# bundle (e.g. results/calibration/_ercot144_scratch/verify_armed_capture.py),
# and ruff was linting those as if they were library code — which is how the
# `lint` CI job went red on main for every PR that touches src/ (repaired in
# passing by FFR-1D 2026-07-31; the E402s are in a committed scratch file, not
# in any module). Same rationale as the probe/archive exemptions above: it is
# the calibration record, not code under maintenance.
extend-exclude = [
    "scripts/archive",
    "scripts/probes",
    "results",
    # R-AC (owner ruling 2026-09-03; audit-program-director-board v23 X-1,
    # docs/model-audit-release-plan-2026-08.md): per-run capx probe scripts
    # committed under docs/handoffs/ (d37/, d45/, ...) are session artifacts
    # kept alongside their finding, not maintained source — the same class as
    # scripts/probes above. They re-reddened the `Ruff lint + format` job
    # TWICE after the source tree itself had been repaired (R-W #4611/#4621,
    # then R-X #4635), each time via a fresh probe landing with E731/E402/E401
    # and unformatted layout. Excluding the tree is the fix; the probes are
    # never edited to satisfy the linter (rule 27 [R-PUSH] would forbid
    # rewriting them anyway). Lint scope for handoff .md/.json is unaffected —
    # ruff only ever read the .py files here.
    "docs/handoffs",
    # HOUSE-1 charter 2026-08-08 (incident: sitting Addendum T.1,
    # docs/handoffs/ffr-owner-sitting-2026-08-02.md): ruff format must never
    # reflow this ~4,100-line hand-formatted core file. On 2026-08-05 the
    # ruff-autofix hook's whole-tree format reflowed it 3,960 → 9,508 lines on
    # an unrelated .py edit — rule 27 [R-PUSH]'s forbidden full-file rewrite
    # even when AST-identical, trapped manually by every session since. At the
    # charter's HEAD (a445fce) the file happens to PASS `ruff format --check`
    # (the charter's "other core files failing --check" enumeration came back
    # EMPTY — evidence in docs/handoffs/house-1-lint-ci-2026-08-08.md), so this
    # entry is prophylactic: it pins the protection against ruff version drift
    # and future hand edits instead of leaving it to per-session vigilance.
    # Do NOT "fix" by reformatting the file; the exclusion is the fix. Note
    # this also removes the file from `ruff check` scope — acceptable because
    # its F401 surface was already per-file-ignored below, compileall
    # (refactor-guards) still catches syntax breaks, and
    # tests/regression/test_constants_facade.py still asserts the re-export
    # surface. The hook passes --force-exclude so this holds even when
    # constants.py is the file being edited.
    "src/market_sim/config/constants.py",
]

[tool.ruff.lint]
# Pin ruff's historical default ruleset (pyflakes F + pycodestyle E4/E7/E9) so
# the baseline is explicit and stable across ruff upgrades. CI can now enforce
# `ruff check` against this config.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Compact one-line statements are a deliberate idiom here: `import sys;
    # sys.path.insert(...)` bootstrap headers and dispatch.py's paired
    # rows/cols COO appends read better together than split. Not worth churning
    # working code for.
    "E702",
    # Single-letter `l` is used only in established math/loop contexts where a
    # rename buys nothing.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# Loose scripts and tests deliberately manipulate sys.path before importing the
# package (and many carry inline `# noqa: E402`); the package import cannot
# precede that bootstrap, so import-not-at-top is expected and intentional here.
"scripts/**" = ["E402"]
"tests/**" = ["E402"]
# config/constants.py is the facade for the 2026-07 constants split: it
# re-imports every name moved to config/{fuel_trajectories,capacity_market,
# ercot_envelopes}.py purely to re-export them (the imports ARE the public
# surface, asserted by tests/test_constants_facade.py), so unused-import is
# expected and intentional here.
"src/market_sim/config/constants.py" = ["F401"]
# data/fleet/__init__.py is the facade of the 2026-07 fleet-package split: the
# pre-split module's header imports are kept verbatim as re-exports (the
# imports ARE the public surface, asserted by tests/test_fleet_facade.py), and
# the submodule re-export block must run AFTER the constants/classes the
# submodules import back from the partially-initialized package, so
# unused-import and import-not-at-top are expected and intentional here.
"src/market_sim/data/fleet/__init__.py" = ["F401", "E402"]

# Single dev dependency group (consolidated from the former
# [project.optional-dependencies].dev + [dependency-groups].dev duplication).
# `uv sync` installs it by default, so the session-start hook and CI both get
# the same toolchain from one place.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # scripts/data/convert_eia930.py converts EIA-930 timestamps to each BA's
    # local clock; tzdata supplies the IANA zone database on minimal containers.
    "tzdata>=2024.1",
    # Parallel test lane: `pytest -n auto` (fast tier). See docs test lanes.
    "pytest-xdist>=3.5",
    # scripts/data/fetch_ny_harbor_distillate_daily.py reads the EIA dnav daily
    # petroleum series, which EIA serves ONLY as a legacy .xls workbook (the
    # .csv sibling 404s, the HTML LeafHandler redirects). openpyxl cannot read
    # BIFF; xlrd 2.x reads .xls exclusively. Tooling-only — the model runtime
    # never touches it.
    "xlrd>=2.0",
    # TEST-ONLY writer half of the same BIFF story: MISO's pre-2023 monthly
    # pricing reports ship as legacy .xls, and
    # tests/curation/test_fetch_miso_hub_lmp_monthly.py builds the fixture
    # workbooks in-process so the route's date and missing-hour conventions are
    # covered with no network. openpyxl writes only .xlsx, so it cannot stand in.
    "xlwt>=1.3",
]
