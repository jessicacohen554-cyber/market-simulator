[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sim"
version = "0.0.0"
description = "Electricity market dispatch and policy simulator"
requires-python = ">=3.11"
dependencies = [
    "highspy>=1.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # scripts/convert_eia930.py converts EIA-930 timestamps to each BA's local
    # clock; tzdata supplies the IANA zone database on minimal containers.
    "tzdata>=2024.1",
]

[project.scripts]
market-sim = "market_sim.runner:main"

[tool.pytest.ini_options]
# Registered so `--strict-markers` does not error and ad-hoc marks can't slip in.
# The clean-vs-raw parity tests (tests/test_consume_*.py) carry both: they
# regenerate a slice of data/clean from raw and compare the clean-backed loader
# against the raw loader, so they are slow and need real inputs present.
markers = [
    "slow: test is slow (regenerates clean data / runs the model)",
    "integration: exercises real data inputs, not a hermetic unit test",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest",
]
